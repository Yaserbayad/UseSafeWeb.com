name: Fix TSK-0431 post-pass cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-tsk0431-post-pass-cleanup.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, rec-v1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Patch cleanup and remove recovery temp files
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == 'adguartestdvm' ]]
          [[ "$(sha256sum /etc/machine-id | awk '{print $1}')" == 'e09868443c476b30eae778d191ceedee57ed6f27a74856eae1d0709c68f1c852' ]]
          python3 - <<'PY'
          from pathlib import Path
          p=Path('infrastructure/adguard-server/clean-recovery-drill-runtime.sh')
          s=p.read_text(encoding='utf-8')
          old="rm -f /tmp/t0431-imds.json /tmp/t0431-query.bin /tmp/t0431-doh.bin /tmp/t0431-filter-before.json /tmp/t0431-rules-empty.json /tmp/t0431-rules-block.json /tmp/t0431-rules-allow.json /tmp/t0431-check.json /tmp/t0431-qcfg.json /tmp/t0431-qlog.json /tmp/t0431-scfg.json /tmp/t0431-stats.json /tmp/t0431-listeners.txt"
          new="sudo rm -f /tmp/t0431-imds.json /tmp/t0431-query.bin /tmp/t0431-doh.bin /tmp/t0431-filter-before.json /tmp/t0431-rules-empty.json /tmp/t0431-rules-block.json /tmp/t0431-rules-allow.json /tmp/t0431-check.json /tmp/t0431-qcfg.json /tmp/t0431-qlog.json /tmp/t0431-scfg.json /tmp/t0431-stats.json /tmp/t0431-listeners.txt"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add infrastructure/adguard-server/clean-recovery-drill-runtime.sh
          git commit -m 'fix: clean root-owned TSK-0431 temporary files'
          git push origin HEAD:main
          sudo rm -f /tmp/t0431-*
          echo 'TSK_0431_POST_PASS_CLEANUP_FIX=PASS'
