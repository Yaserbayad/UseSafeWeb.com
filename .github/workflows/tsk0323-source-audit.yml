name: Audit TSK-0323 instruction sources

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tsk0323-source-audit.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-governance-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Locate authoritative instruction sources
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          echo "AUDIT_HEAD=$(git rev-parse HEAD)"
          echo 'MATCHING_FILES_BEGIN'
          find . -type f \( -iname '*0307*' -o -iname '*0317*' -o -iname '*instruction*' -o -iname '*support*matrix*' \) -print | sort
          echo 'MATCHING_FILES_END'
          echo 'TASK_REFERENCES_BEGIN'
          grep -RInE 'TSK-0307|TSK-0317|REQ-0040|REQ-0041|INT-0012' Plans/Master CURRENT_STATE.md . --exclude-dir=.git --exclude='master-wbs.csv' --exclude='MASTER_PLAN_FULL.md' | head -n 400 || true
          echo 'TASK_REFERENCES_END'
          python3 - <<'PY'
          import csv, pathlib
          p=pathlib.Path('Plans/Master/WBS/master-wbs.csv')
          with p.open(encoding='utf-8',newline='') as f:
              by={r['Task_ID']:r for r in csv.DictReader(f)}
          for tid in ('TSK-0307','TSK-0317','TSK-0323'):
              r=by[tid]
              print('WBS_ROW_BEGIN='+tid)
              for k,v in r.items(): print(f'{k}={v}')
              print('WBS_ROW_END='+tid)
          print('TSK0323_SOURCE_AUDIT=PASS')
          PY
