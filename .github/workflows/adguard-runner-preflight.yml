name: AdGuard runner preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adguard-runner-preflight.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify trusted runner and privilege boundary
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "host=$(hostname -f 2>/dev/null || hostname)"
          echo "user=$(id -un)"
          echo "commit=${GITHUB_SHA}"

          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${RUNNER_OS}" == "Linux" ]]
          [[ "${RUNNER_ARCH}" == "X64" ]]

          . /etc/os-release
          [[ "${ID}" == "ubuntu" ]]
          [[ "${VERSION_ID}" == "24.04" ]]

          [[ "$(hostname -s)" == "adguardvm" ]]

          command -v sudo >/dev/null
          command -v systemctl >/dev/null
          command -v ss >/dev/null
          command -v bash >/dev/null

          if sudo -n true; then
            echo "sudo_noninteractive=PASS"
          else
            echo "sudo_noninteractive=FAIL"
            exit 1
          fi

          test -f infrastructure/adguard-server/harden-host.sh
          bash -n infrastructure/adguard-server/harden-host.sh
          echo "hardening_artifact_syntax=PASS"

          echo "listener_inventory_begin"
          ss -H -lntu | awk '{print $1, $5}' | sort -u
          echo "listener_inventory_end"

          echo "PREFLIGHT=PASS"
