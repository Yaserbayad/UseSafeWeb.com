name: Reconcile approved TSK-0318 to PASS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0318-pass-20260829.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact TSK-0318 PASS pre-state
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "2e7e5266d6ceff9ac50cc485825275748cb4b393"
          test "$(git hash-object TSK_0318_PUBLIC_PRODUCT_SETUP_IA_DESIGN_CANDIDATE_2026-08-28.md)" = "64f0e6382a5ce166c0aad2ad2e86a3796c5df379"
          test "$(git hash-object TSK_0318_PUBLIC_PRODUCT_SETUP_IA_DESIGN_PREPARATION_EVIDENCE_2026-08-28.md)" = "4a4d766a2fb58e390c9ee80c93dfecf75d50b2eb"
          test "$(git hash-object TSK_0318_OWNER_APPROVAL_2026-08-29.md)" = "623ced7b80fdf7e17dba96c77d9000977869bd60"
          test "$(git hash-object TSK_0318_PUBLIC_PRODUCT_SETUP_IA_DESIGN_ACCEPTANCE_EVIDENCE_2026-08-29.md)" = "7fc66ebf2dcf77330fee639167fdfd2f0452b72a"
          grep -Fq '### TSK-0318 preparation stable state' CURRENT_STATE.md
          grep -Fq 'runtime **WAITING**, not PASS' CURRENT_STATE.md
      - name: Apply bounded TSK-0318 PASS reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          start_marker = '### TSK-0318 preparation stable state\n'
          end_marker = '### TSK-0319 preparation stable state\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          updated = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('**Updated:** '):
                  lines[i] = f'**Updated:** {updated}'
                  break
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          section = (
              '### TSK-0318 accepted stable state\n\n'
              '`TSK-0318 — Design the public website IA and product/setup IA as distinct but connected systems`: **PASS for the provisional internal L4 IA design acceptance under DEC-0050/CR-0003**. Approved candidate `TSK_0318_PUBLIC_PRODUCT_SETUP_IA_DESIGN_CANDIDATE_2026-08-28.md`, blob `64f0e6382a5ce166c0aad2ad2e86a3796c5df379`; preparation evidence `TSK_0318_PUBLIC_PRODUCT_SETUP_IA_DESIGN_PREPARATION_EVIDENCE_2026-08-28.md`, blob `4a4d766a2fb58e390c9ee80c93dfecf75d50b2eb`; Project Owner HUMAN_ONLY approval `TSK_0318_OWNER_APPROVAL_2026-08-29.md`, blob `623ced7b80fdf7e17dba96c77d9000977869bd60`, commit `ebee8139db691b3bd59bbf7eb0afec86da3f83b6`; final acceptance evidence `TSK_0318_PUBLIC_PRODUCT_SETUP_IA_DESIGN_ACCEPTANCE_EVIDENCE_2026-08-29.md`, blob `7fc66ebf2dcf77330fee639167fdfd2f0452b72a`, commit `df28aeb8b4ad1cfaadb61461b05c22f37492a543`.\n\n'
              'ACC-0318 is satisfied: public website and operational setup/product remain distinct but connected; every current page/screen has one purpose, entry/exit, content owner, SEO/index intent, privacy and accessibility requirement; all critical TSK-0315 service stages are mapped without duplicating mutable support/instruction/state authority; accountless, friction, legal and build/publication boundaries are preserved; and the exact unchanged candidate received the required HUMAN_ONLY Project Owner approval.\n\n'
              'This PASS remains provisional internal L4 design evidence only. It does not establish representative-parent usability; `RSK-0002` remains OPEN; `REQ-0022` remains unresolved; LG-03/LG-04/LG-05/LG-06 remain non-PASS; account/dashboard remains deferred under EXC-0001; no implementation/build, public publication, market activation, participant processing, payment or launch is authorized.\n\n'
          )
          p.write_text(text[:start] + section + text[end:], encoding='utf-8')
          PY
      - name: Verify and commit TSK-0318 PASS
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '### TSK-0318 accepted stable state' CURRENT_STATE.md
          grep -Fq 'ACC-0318 is satisfied' CURRENT_STATE.md
          grep -Fq '### TSK-0319 preparation stable state' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: mark approved TSK-0318 PASS'
          git push