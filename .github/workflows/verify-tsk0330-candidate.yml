name: Verify TSK-0330 candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-tsk0330-candidate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify authority pins and candidate contract
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          test "$(git rev-parse HEAD:Plans/Master/WBS/master-wbs.csv)" = "f23b4f017d1baf73258fa30ecd71549bbfe1b815"
          test "$(git rev-parse HEAD:prototype/TSK-0309/BASELINE.md)" = "76bb848ebdf6a2aee4dd84bc18e8af5ba8a99dbc"
          test "$(git rev-parse HEAD:content/TSK-0323/DEVICE_SERVICE_INSTRUCTION_CATALOGUE.md)" = "bbe9ed90b205f2ca852ebdaefedf054446dd7f91"
          test "$(git rev-parse HEAD:design/TSK-0330/PHONE_INTERNET_SERVICES_SETUP_FLOWS_CANDIDATE.md)" = "07fa10b3fa9b91ddd02f19f5d1c68b15184677a7"
          python3 - <<'PY'
          import csv,re
          from pathlib import Path
          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          r=next(x for x in rows if x['Task_ID'].strip()=='TSK-0330')
          assert r['Title'].strip()=='Design Phone → Internet → Services setup flows'
          assert r['Dependencies'].strip()=='TSK-0146'
          assert r['Action_Authority'].strip()=='HUMAN_ONLY'
          ac=r['Acceptance_Criteria']
          for needle in ['prerequisites','step-by-step actions','verification/confirmation','skip conditions','unsupported/conflict states','troubleshooting','no misleading completion state']:
              assert needle in ac, (needle,ac)
          t=Path('design/TSK-0330/PHONE_INTERNET_SERVICES_SETUP_FLOWS_CANDIDATE.md').read_text(encoding='utf-8')
          required=[
            'Layer 1 — Phone','Layer 2 — Internet','Layer 3 — Services','Protection Map completion',
            'dns.usesafeweb.com','https://dns.usesafeweb.com/dns-query','You confirmed this is set up',
            '`Verified`','`Action needed`','`Status uncertain`','`Not covered`','`Removed`',
            'Already configured','Unsupported/conflict','Troubleshooting','Removal/recovery',
            'no named external service is hard-coded','HUMAN_ONLY decision boundary',
            'APPROVE TSK-0330 PHONE INTERNET SERVICES FLOWS'
          ]
          for x in required: assert x in t, x
          for n in range(1,13): assert f'TC-0330-{n:02d}' in t
          # Guard against scope/claims regressions.
          forbidden=['100% safe` as an approved claim','fully protected` as an approved claim','mandatory UseSafeWeb account','collect Google credential','collect Apple credential']
          for x in forbidden: assert x not in t, x
          assert 'not accepted / not PASS' in t
          assert 'does not mark TSK-0330 PASS' in t
          print('TSK0330_WBS_AUTHORITY=PASS')
          print('TSK0330_SOURCE_PINS=PASS')
          print('TSK0330_ACCEPTANCE_COVERAGE=PASS')
          print('TSK0330_TEST_MATRIX=12')
          print('TSK0330_SCOPE_TRUTH_GUARDS=PASS')
          PY
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
          echo 'TSK0330_CANDIDATE_VERIFICATION=PASS'
