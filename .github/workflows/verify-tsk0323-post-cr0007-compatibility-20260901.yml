name: Verify TSK-0323 post-CR-0007 compatibility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0323-post-cr0007-compatibility-20260901.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact current catalogue contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_tsk0323_post_cr0007_compatibility_20260901.py
          git diff --check
          test -z "$(git status --porcelain)"
