name: Reconcile approved TSK-0319 to PASS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0319-pass-20260829.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact TSK-0319 PASS pre-state
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "47e82cf83961953209c8a1598c5c7d4795f743af"
          test "$(git hash-object TSK_0319_AUTOMATED_VERIFICATION_TROUBLESHOOTING_RECOVERY_HELP_DESIGN_CANDIDATE_2026-08-28.md)" = "86de353dd8446f02ed48c80638391a3caa852e59"
          test "$(git hash-object TSK_0319_AUTOMATED_VERIFICATION_TROUBLESHOOTING_RECOVERY_HELP_DESIGN_PREPARATION_EVIDENCE_2026-08-28.md)" = "d4d8a4bbf3e8f9ad3e04f45fdf8f342df188a854"
          test "$(git hash-object TSK_0319_OWNER_APPROVAL_2026-08-29.md)" = "48f7212869f712190bae76d797e45a5d15e4999c"
          test "$(git hash-object TSK_0319_AUTOMATED_VERIFICATION_TROUBLESHOOTING_RECOVERY_HELP_DESIGN_ACCEPTANCE_EVIDENCE_2026-08-29.md)" = "2dc4ab8ba336b28652a85e6deec0e79291e56477"
          grep -Fq '### TSK-0318 accepted stable state' CURRENT_STATE.md
          grep -Fq '### TSK-0319 preparation stable state' CURRENT_STATE.md
      - name: Apply bounded TSK-0319 PASS reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          start_marker = '### TSK-0319 preparation stable state\n'
          start = text.index(start_marker)
          updated = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('**Updated:** '):
                  lines[i] = f'**Updated:** {updated}'
                  break
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          start = text.index(start_marker)
          section = (
              '### TSK-0319 accepted stable state\n\n'
              '`TSK-0319 — Design automated verification, issue-specific troubleshooting, safe reset/reinstall/remove, and point-of-need help`: **PASS for the provisional internal L4 troubleshooting/recovery/help design acceptance under DEC-0050/CR-0003**. Approved candidate `TSK_0319_AUTOMATED_VERIFICATION_TROUBLESHOOTING_RECOVERY_HELP_DESIGN_CANDIDATE_2026-08-28.md`, blob `86de353dd8446f02ed48c80638391a3caa852e59`; preparation evidence `TSK_0319_AUTOMATED_VERIFICATION_TROUBLESHOOTING_RECOVERY_HELP_DESIGN_PREPARATION_EVIDENCE_2026-08-28.md`, blob `d4d8a4bbf3e8f9ad3e04f45fdf8f342df188a854`; Project Owner HUMAN_ONLY approval `TSK_0319_OWNER_APPROVAL_2026-08-29.md`, blob `48f7212869f712190bae76d797e45a5d15e4999c`, commit `9dd55507dc46932cdb296c35149808e508ec3ff3`; final acceptance evidence `TSK_0319_AUTOMATED_VERIFICATION_TROUBLESHOOTING_RECOVERY_HELP_DESIGN_ACCEPTANCE_EVIDENCE_2026-08-29.md`, blob `2dc4ab8ba336b28652a85e6deec0e79291e56477`, commit `5cb5da073536dc1b104ba96475979434b5f4eeeb`.\n\n'
              'ACC-0319 is satisfied: top expected failures have bounded issue-specific decision trees; privacy-safe automatic checks are used where appropriate; retries require changed evidence; verification truth is preserved; reset/reinstall/remove and Android/iPhone recovery are explicit; point-of-need help, privacy limits and exceptional escalation are bounded; no routine staffed-support SLA or account identity is invented; and the exact unchanged candidate received the required HUMAN_ONLY Project Owner approval.\n\n'
              'This PASS remains provisional internal L4 design evidence only. It does not establish representative-parent self-service success; `RSK-0002` remains OPEN; `REQ-0022` remains unresolved; LG-03/LG-04/LG-05/LG-06 remain non-PASS; account/dashboard remains deferred under EXC-0001; no implementation of automatic checks, diagnostic collection, staffed-support activation, participant/public use, publication, payment or launch is authorized.\n\n'
              '## Queue status after TSK-0318 and TSK-0319 PASS\n\n'
              'Both prior HUMAN_ONLY design bottlenecks are now PASS. Recompute eligible L4 work from the current WBS/relationship authority before selecting the next task; do not infer downstream PASS or build/publication authority from these design approvals. Current global fences remain unchanged.\n\n'
              '## Exact next authoritative step\n\n'
              'Recompute the authoritative L4 queue using current WBS rows, dependency graph, gates, action authority and current PASS evidence, then execute the highest-priority eligible AUTO_ALLOWED task or prepare the next HUMAN_ONLY task without crossing current project fences.\n'
          )
          p.write_text(text[:start] + section, encoding='utf-8')
          PY
      - name: Verify and commit TSK-0319 PASS
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '### TSK-0318 accepted stable state' CURRENT_STATE.md
          grep -Fq '### TSK-0319 accepted stable state' CURRENT_STATE.md
          grep -Fq 'ACC-0319 is satisfied' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: mark approved TSK-0319 PASS'
          git push