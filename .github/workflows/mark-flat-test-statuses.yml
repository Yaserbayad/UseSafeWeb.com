name: Mark flat test statuses

on:
  push:
    paths:
      - '.github/workflows/mark-flat-test-statuses.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  mark-statuses:
    runs-on: ubuntu-latest
    steps:
      - name: Update TEST-LARGE-001 flat task statuses
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          base = f'https://api.github.com/repos/{repo}'

          groups = {
              'DONE': list(range(20, 25)),
              'WAITING': list(range(25, 30)),
              'BLOCKED': list(range(30, 35)),
          }
          claim_state = {'DONE': 'COMPLETE', 'WAITING': 'WAITING', 'BLOCKED': 'BLOCKED'}

          def api(method, path, data=None):
              url = base + path
              body = None if data is None else json.dumps(data).encode('utf-8')
              req = urllib.request.Request(url, data=body, method=method)
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              req.add_header('User-Agent', 'flat-plan-status-test')
              if body is not None:
                  req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=60) as r:
                  raw = r.read()
                  return json.loads(raw.decode('utf-8')) if raw else None

          updated = []
          for status, issue_numbers in groups.items():
              for number in issue_numbers:
                  issue = api('GET', f'/issues/{number}')
                  labels = [x['name'] for x in issue.get('labels', [])]
                  if 'plan:test-large-flat-001' not in labels:
                      raise RuntimeError(f'Issue #{number} is not in flat test plan')
                  body = issue.get('body') or ''
                  body = re.sub(r'^- \*\*Status:\*\* .*$', f'- **Status:** {status}', body, count=1, flags=re.M)
                  body = re.sub(r'^- \*\*Claim state:\*\* .*$', f'- **Claim state:** {claim_state[status]}', body, count=1, flags=re.M)
                  payload = {'body': body}
                  if status == 'DONE':
                      payload.update({'state': 'closed', 'state_reason': 'completed'})
                  else:
                      payload.update({'state': 'open'})
                  api('PATCH', f'/issues/{number}', payload)
                  updated.append({'issue': number, 'status': status})

          print(json.dumps(updated, indent=2))
          PY
