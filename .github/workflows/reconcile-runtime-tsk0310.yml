name: Reconcile TSK-0310 runtime state

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-runtime-tsk0310.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-governance-state
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Reconcile runtime file
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          python3 .github/scripts/reconcile_runtime_tsk0310.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git diff --cached --quiet && exit 0
          git commit -m 'state: reconcile TSK-0310 partial verification'
          git push origin HEAD:main
          echo 'RUNTIME_RECONCILIATION=PASS'
