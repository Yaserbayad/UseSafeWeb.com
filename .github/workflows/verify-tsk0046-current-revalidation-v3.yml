name: Verify TSK-0046 current revalidation v3

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0046-current-verifier-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Run robust structural verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_tsk0046_current_revalidation_v3.py
