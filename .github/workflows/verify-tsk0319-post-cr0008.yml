name: Verify TSK-0319 post-CR-0008 current acceptance

on:
  push:
    branches: [main]
    paths:
      - 'TSK_0319_POST_CR0008_AUTOMATED_VERIFICATION_TROUBLESHOOTING_RECOVERY_HELP_2026-09-01.md'
      - '.github/workflows/verify-tsk0319-post-cr0008.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify canonical contract, dependencies, graph and artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "b27a0c5df2f5636d8ed71051e9e26a68959a2616"
          test "$(git hash-object Plans/Master/RELATIONSHIP_INDEX.yaml)" = "c108d2c162bcea2ee4cc01def46d0487a9501032"
          test "$(git hash-object TSK_0319_POST_CR0008_AUTOMATED_VERIFICATION_TROUBLESHOOTING_RECOVERY_HELP_2026-09-01.md)" = "dec2b556745c635656fa0f18945c63c47120f6ff"
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path
          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          row = next((r for r in rows if (r.get('Task_ID') or '').strip() == 'TSK-0319'), None)
          assert row is not None, 'TSK-0319 row missing'
          def val(*names):
              for n in names:
                  if n in row and row[n] is not None:
                      return row[n].strip()
              return ''
          deps = re.findall(r'TSK-\d{4}', val('Dependencies'))
          assert val('Lifecycle_Stage') == 'L4'
          assert val('Priority').upper() == 'HIGH'
          assert val('AI_Capability_A0_A4') == 'A3'
          assert val('Action_Authority') == 'AUTO_ALLOWED'
          assert set(deps) == {'TSK-0315','TSK-0320'}, deps
          assert val('Acceptance_ID') == 'ACC-0319'
          assert val('Verification_ID') == 'VER-0319'
          assert val('Evidence_ID') == 'EVD-0319'
          planning = val('Plan_Status','Planning_Status','Disposition').upper()
          assert planning not in {'DEFERRED','NOT_APPLICABLE','CANCELLED','CANCELED'}, planning

          state = Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          accepted = set(re.findall(r'^##\s+(TSK-\d{4})(?:\s*/[^\n#]+)?\s+current accepted stable state\b', state, flags=re.MULTILINE|re.IGNORECASE))
          assert {'TSK-0315','TSK-0320'} <= accepted
          assert 'TSK-0319' not in accepted

          graph = Path('Plans/Master/RELATIONSHIP_INDEX.yaml').read_text(encoding='utf-8')
          def block(tid):
              m = re.search(rf'(?ms)^  {re.escape(tid)}:\n(.*?)(?=^  TSK-\d{{4}}:|\Z)', graph)
              assert m, f'graph entity missing {tid}'
              return m.group(1)
          assert 'target: TSK-0315' in block('TSK-0319') and 'target: TSK-0320' in block('TSK-0319')
          assert 'target: TSK-0319' in block('TSK-0628') and 'target: TSK-0331' in block('TSK-0628')

          artifact = Path('TSK_0319_POST_CR0008_AUTOMATED_VERIFICATION_TROUBLESHOOTING_RECOVERY_HELP_2026-09-01.md').read_text(encoding='utf-8')
          required = ['complete accountless core','optional parent-account mode','protected/verified','uncertain/error','removed','CHK-PROVIDER','CHK-SESSION','CHK-OWNERSHIP','Sign-in start/provider return','Session expired','Dashboard unavailable','Add/save/manage device','Device replace, revoke, unlink or record deletion','Account deletion','physical DNS removal','no blind replay','ACC-0319 acceptance mapping','browsing/query/activity history','raw DNS history','accountless-only assumptions','Historical evidence remains traceable']
          missing = [x for x in required if x not in artifact]
          assert not missing, missing
          assert 'no implementation, deployment, gate PASS or public release is inferred' in artifact

          Path('/tmp/tsk0319_wbs_row.json').write_text(json.dumps({
              'Task_ID': val('Task_ID'), 'Lifecycle_Stage': val('Lifecycle_Stage'), 'Priority': val('Priority'),
              'Dependencies': deps, 'AI_Capability_A0_A4': val('AI_Capability_A0_A4'),
              'Action_Authority': val('Action_Authority'), 'Acceptance_ID': val('Acceptance_ID'),
              'Verification_ID': val('Verification_ID'), 'Evidence_ID': val('Evidence_ID'),
              'Plan_Status': planning, 'Acceptance_Criteria': val('Acceptance_Criteria')
          }, sort_keys=True, indent=2), encoding='utf-8')
          print('TSK0319_CURRENT_ACCEPTANCE_VERIFICATION=PASS')
          print('GRAPH_TSK0319_DEPS=TSK-0315,TSK-0320')
          print('GRAPH_TSK0628_DEPS_INCLUDE=TSK-0319,TSK-0331')
          print('PREDECESSOR_CURRENT_PASS=TSK-0315,TSK-0320')
          PY
      - name: Persist immutable verification evidence
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          p='TSK_0319_POST_CR0008_INDEPENDENT_VERIFICATION_EVIDENCE_2026-09-01.md'
          test ! -e "$p"
          {
            echo '# TSK-0319 — Post-CR-0008 Independent Verification Evidence'
            echo
            echo '**Result:** PASS'
            echo '**Task:** TSK-0319'
            echo '**Acceptance:** ACC-0319 / VER-0319 / EVD-0319'
            echo "**Source commit:** \`$SOURCE_SHA\`"
            echo "**Workflow run / attempt:** \`$RUN_ID / $RUN_ATTEMPT\`"
            echo '**Canonical WBS blob:** `b27a0c5df2f5636d8ed71051e9e26a68959a2616`'
            echo '**Canonical relationship graph blob:** `c108d2c162bcea2ee4cc01def46d0487a9501032`'
            echo '**Verified artifact blob:** `dec2b556745c635656fa0f18945c63c47120f6ff`'
            echo
            echo '## Verified current contract'
            echo '```json'
            cat /tmp/tsk0319_wbs_row.json
            echo '```'
            echo
            echo '## Verification findings'
            echo '- Current WBS classifies TSK-0319 as L4 / HIGH / A3 / AUTO_ALLOWED and not planning-excluded.'
            echo '- Exact hard dependencies are TSK-0315 and TSK-0320; both have strict current accepted-stable-state headings.'
            echo '- Canonical graph confirms TSK-0319 depends on TSK-0315 and TSK-0320.'
            echo '- Canonical graph confirms TSK-0628 directly depends on TSK-0319 and TSK-0331.'
            echo '- Artifact contains bounded issue-specific accountless and optional-account/provider/session/dashboard/device-lifecycle troubleshooting/recovery flows.'
            echo '- Artifact preserves current protection-state truth, changed-evidence retry rule, unknown-result no-replay rule, login-free core removal/recovery, and privacy/security data minimization.'
            echo '- Artifact distinguishes anonymous-state reset, account/session operations, device-record lifecycle, account deletion and physical DNS removal.'
            echo '- Artifact contains no implementation/deployment/gate/public-release claim.'
            echo
            echo 'This evidence verifies the L4 design acceptance boundary only. It does not prove implementation, production behavior, provider integration, legal/privacy compliance, real-user supportability, or launch readiness.'
          } > "$p"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p"
          git commit -m 'evidence: verify TSK-0319 post-CR-0008 acceptance'
          git push
