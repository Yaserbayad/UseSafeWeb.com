name: Reconcile verified TSK-0319 current PASS

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-tsk0319-post-cr0008.yml']

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-tsk0319-one-shot-recovery
      cancel-in-progress: false
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Run deterministic guarded reconciler
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/reconcile_tsk0319_state.py
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != 'CURRENT_STATE.md' ]; then
            echo "Unexpected changed path(s): $changed" >&2
            exit 1
          fi
          git diff --check -- CURRENT_STATE.md
          grep -Fq '## TSK-0485 current accepted stable state' CURRENT_STATE.md
          grep -Fq '## TSK-0319 current accepted stable state — 2026-09-01 — POST-CR-0008 REQUALIFICATION' CURRENT_STATE.md

      - name: Persist reconciled runtime state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CURRENT_STATE.md; then
            echo 'CURRENT_STATE_ALREADY_RECONCILED=PASS'
            exit 0
          fi
          test "$(git diff --name-only)" = 'CURRENT_STATE.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0319 post-CR-0008 requalification'
          git push origin HEAD:main
