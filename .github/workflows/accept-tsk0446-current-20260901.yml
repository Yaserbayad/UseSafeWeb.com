name: Accept TSK-0446 current recovery contract

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/accept_tsk0446_current_20260901.py'
      - '.github/workflows/accept-tsk0446-current-20260901.yml'

permissions:
  contents: write
  checks: read

env:
  VERIFIED_CHECK_RUN_ID: '99843993787'
  VERIFIED_HEAD: '6214ac817ed3279561495f73212bd7e2e9acfc6b'

concurrency:
  group: usesafeweb-governed-runtime-write
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reverify current evidence and source state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 .github/scripts/verify_tsk0446_recovery_scope_20260901.py
          python3 - <<'PY'
          import json, os, urllib.request
          rid = os.environ['VERIFIED_CHECK_RUN_ID']
          req = urllib.request.Request(
              f'https://api.github.com/repos/Yaserbayad/UseSafeWeb.com/check-runs/{rid}',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'UseSafeWeb-TSK-0446-acceptor',
              },
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              d = json.load(r)
          assert d['status'] == 'completed' and d['conclusion'] == 'success', d
          assert d['head_sha'] == os.environ['VERIFIED_HEAD'], d['head_sha']
          print('INDEPENDENT_CHECK_RUN=PASS')
          PY
          test "$(git hash-object TSK_0446_RECOVERY_SCOPE_CONTRACT_EVIDENCE_2026-09-01.md)" = '714a5ccf4e7d0dc104ff55c1d87381571ab786f9'
          test "$(git hash-object TSK_0446_RECOVERY_SCOPE_CONTRACT_AUTOVERIFY_2026-09-01.md)" = 'f5fe287aac8a40054cc9175b95b85b8f9a63768d'
          test "$(git hash-object infrastructure/adguard-server/TSK-0446-RECOVERY-SCOPE-CONTRACT.md)" = '18d998e2406e801c7ac08f4daa2e3b763ea9b523'
          test "$(git hash-object .github/scripts/verify_tsk0446_recovery_scope_20260901.py)" = '42968bfe96ef9d8a7d7f86a4d6767a2df4f754a3'

      - name: Construct bounded PASS mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/accept_tsk0446_current_20260901.py
          git diff --check
          test "$(git status --porcelain | sed 's/^...//')" = 'CURRENT_STATE.md'
          grep -F '## TSK-0446 current accepted stable state — 2026-09-01' CURRENT_STATE.md
          grep -F 'no actual clean-server timed rebuild/restore' CURRENT_STATE.md
          grep -F 'TSK-0445' CURRENT_STATE.md

      - name: Commit push and remote read-back
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0446 current recovery contract'
          COMMIT="$(git rev-parse HEAD)"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$COMMIT"
          git show "$COMMIT:CURRENT_STATE.md" | grep -F '## TSK-0446 current accepted stable state — 2026-09-01'
          test "$(git rev-parse "$COMMIT:TSK_0446_RECOVERY_SCOPE_CONTRACT_EVIDENCE_2026-09-01.md")" = '714a5ccf4e7d0dc104ff55c1d87381571ab786f9'
          test "$(git rev-parse "$COMMIT:TSK_0446_RECOVERY_SCOPE_CONTRACT_AUTOVERIFY_2026-09-01.md")" = 'f5fe287aac8a40054cc9175b95b85b8f9a63768d'
          test "$(git rev-parse "$COMMIT:infrastructure/adguard-server/TSK-0446-RECOVERY-SCOPE-CONTRACT.md")" = '18d998e2406e801c7ac08f4daa2e3b763ea9b523'
          echo "TSK_0446_ACCEPTANCE_COMMIT=$COMMIT"
          echo 'TSK_0446_REMOTE_READBACK=PASS'
