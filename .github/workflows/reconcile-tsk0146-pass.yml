name: Reconcile TSK-0146 PASS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-tsk0146-pass.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Reconcile current runtime PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          test "$(git rev-parse HEAD:CURRENT_STATE.md)" = "504088e620f34cad7384427dc7e68ce7b4b47bdd"
          test "$(git rev-parse HEAD:Plans/Master/WBS/master-wbs.csv)" = "f23b4f017d1baf73258fa30ecd71549bbfe1b815"
          test "$(git rev-parse HEAD:TSK_0146_ACCOUNTLESS_FIRST_BASELINE_ACCEPTANCE_EVIDENCE_2026-08-30.md)" = "91f8cdacb825c2423f0f6d111ee9676d8645e081"
          test "$(git rev-parse HEAD:.github/scripts/reconcile_tsk0146_pass.py)" = "ed980a2d790aa90e63b20233a1048ba7e7988e4b"
          python3 .github/scripts/reconcile_tsk0146_pass.py
          git diff --check
          [[ "$(git diff --name-only)" == "CURRENT_STATE.md" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          [[ "$(git diff --cached --name-only)" == "CURRENT_STATE.md" ]]
          git commit -m 'state: reconcile TSK-0146 accountless baseline PASS'
          git push origin HEAD:main
          echo "RUNTIME_COMMIT=$(git rev-parse HEAD)"
          echo "RUNTIME_STATE_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
          sha256sum CURRENT_STATE.md | sed 's/^/RUNTIME_STATE_SHA256=/'
