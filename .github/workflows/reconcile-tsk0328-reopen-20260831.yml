name: Reconcile TSK-0328 reopened TODO
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0328-reopen-20260831.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist current TSK-0328 reopened TODO
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 .github/scripts/reconcile_tsk0328_reopen_20260831.py
          git diff --check
          grep -Fq '## TSK-0328 current reopened state — 2026-08-31 — POST-CR-0007' CURRENT_STATE.md
          grep -Fq 'TODO / REOPENED' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: reopen current TSK-0328 as TODO'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          echo "TSK0328_REOPEN_RECONCILIATION=PASS"
          echo "TSK0328_REOPEN_COMMIT=$(git rev-parse HEAD)"
          echo "TSK0328_RUNTIME_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
