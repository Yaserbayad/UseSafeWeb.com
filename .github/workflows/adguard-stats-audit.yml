name: Audit AdGuard client statistics privacy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adguard-stats-audit.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Independently audit TSK-0205 stable state
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          sudo -n true
          secret='/var/lib/usesafeweb/adguard/admin.env'
          username="$(sudo awk -F= '$1=="ADGUARD_ADMIN_USER" {sub(/^[^=]*=/,""); print; exit}' "$secret")"
          password="$(sudo awk -F= '$1=="ADGUARD_ADMIN_PASSWORD" {sub(/^[^=]*=/,""); print; exit}' "$secret")"
          [[ -n "$username" && -n "$password" ]]
          base='http://127.0.0.1:3000/control'

          curl --silent --show-error --fail --max-time 10 --user "$username:$password" "$base/stats/config" -o /tmp/statscfg.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/statscfg.json',encoding='utf-8'))
          assert d.get('enabled') is False, d
          print('stats_enabled=false')
          PY

          python3 - <<'PY'
          import random, socket, struct
          name='usesafeweb-stats-fresh-audit.invalid'
          q=b''.join(bytes([len(x)])+x.encode() for x in name.split('.'))+b'\x00'
          pkt=struct.pack('!HHHHHH',random.randrange(0,65536),0x0100,1,0,0,0)+q+struct.pack('!HH',1,1)
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(3); s.sendto(pkt,('127.0.0.1',53))
          try: s.recvfrom(4096)
          except socket.timeout: pass
          PY
          sleep 1

          curl --silent --show-error --fail --max-time 10 --user "$username:$password" "$base/stats" -o /tmp/statsdata.json
          unset password
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/statsdata.json',encoding='utf-8'))
          assert (d.get('top_clients') or []) == [], d.get('top_clients')
          assert int(d.get('num_dns_queries') or 0) == 0, d.get('num_dns_queries')
          print('top_clients_count=0')
          print('stats_num_dns_queries=0')
          PY

          sudo python3 - /opt/AdGuardHome/AdGuardHome.yaml <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          inside=False; value=None
          for line in lines:
              if line and not line[0].isspace():
                  inside=line.rstrip()=='statistics:'
                  continue
              if inside and line.startswith('  enabled:'):
                  value=line.split(':',1)[1].strip().lower(); break
          assert value=='false', value
          print('persisted_statistics_enabled=false')
          PY

          systemctl is-active --quiet AdGuardHome.service
          rm -f /tmp/statscfg.json /tmp/statsdata.json
          echo 'FRESH_STATS_AUDIT=PASS'
