name: Verify post-CR-0007 TSK-0331 structured acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0331-post-cr0007-structured-20260831.yml'
      - '.github/scripts/verify_tsk0331_post_cr0007_structured_20260831.py'
      - '.github/scripts/verify_tsk0331_browser_20260831.mjs'
      - 'prototype/TSK-0331/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Verify exact current TSK-0331 acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/verify_tsk0331_post_cr0007_structured_20260831.py

          runtime_dir="$RUNNER_TEMP/tsk0331-browser-runtime"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          npm install --prefix "$runtime_dir" --no-save --no-package-lock playwright@1.62.0
          playwright_module="$runtime_dir/node_modules/playwright"
          test -f "$playwright_module/package.json"
          PLAYWRIGHT_BROWSERS_PATH="$runtime_dir/browsers" "$runtime_dir/node_modules/.bin/playwright" install chromium

          python3 -m http.server 8031 --bind 127.0.0.1 >/tmp/tsk0331-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          TSK0331_BASE_URL='http://127.0.0.1:8031/prototype/TSK-0331/index.html' TSK0331_PLAYWRIGHT_MODULE="$playwright_module" PLAYWRIGHT_BROWSERS_PATH="$runtime_dir/browsers" node .github/scripts/verify_tsk0331_browser_20260831.mjs
          git diff --check
          test -z "$(git status --porcelain)"
