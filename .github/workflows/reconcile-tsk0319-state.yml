name: Reconcile TSK-0319 runtime state

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-tsk0319-state.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: self-hosted
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run guarded TSK-0319 reconciler
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/reconcile_tsk0319_state.py
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != 'CURRENT_STATE.md' ]; then
            echo "Unexpected changed path(s): $changed" >&2
            exit 1
          fi
          git diff --check -- CURRENT_STATE.md

      - name: Commit reconciled runtime state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CURRENT_STATE.md; then
            echo 'CURRENT_STATE_ALREADY_RECONCILED=PASS'
            exit 0
          fi
          test "$(git diff --name-only)" = "CURRENT_STATE.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: reconcile TSK-0319 post-CR-0008 PASS'
          git push origin HEAD:main
