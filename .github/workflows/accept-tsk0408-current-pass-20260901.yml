name: Accept TSK-0408 current PASS 2026-09-01

on:
  push:
    branches: [main]
    paths:
      - 'TSK_0408_CURRENT_ACCEPTANCE_EVIDENCE_2026-09-01.md'
      - '.github/scripts/accept_tsk0408_current_pass_20260901.py'
      - '.github/workflows/accept-tsk0408-current-pass-20260901.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reconcile current main
        run: git pull --ff-only origin main
      - name: Confirm independent verifier success
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33497169433 --jq .conclusion)" = "success"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/jobs/99821919358 --jq .conclusion)" = "success"
      - name: Append current runtime acceptance
        run: python3 .github/scripts/accept_tsk0408_current_pass_20260901.py
      - name: Guard mutation
        run: |
          git diff --check
          changed="$(git status --porcelain)"
          test -n "$changed"
          test "$(printf '%s\n' "$changed" | awk '{print $2}' | sort -u)" = "CURRENT_STATE.md"
      - name: Commit current accepted state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0408 current DNS identity contract'
          git push origin HEAD:main
      - name: Fetch and read back authoritative main
        run: |
          git fetch origin main
          git show origin/main:CURRENT_STATE.md | grep -F '## TSK-0408 current accepted stable state — 2026-09-01 — POST-CR-0007'
          git show origin/main:CURRENT_STATE.md | grep -F '33497169433 / 99821919358'
          git show origin/main:CURRENT_STATE.md | grep -F 'TSK_0408_CURRENT_ACCEPTANCE_EVIDENCE_2026-09-01.md'
          test -z "$(git status --porcelain)"
