name: Inspect TSK-0138 chain
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tsk0138-chain-20260830.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inspect current chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = "14fe2b734eb58c63aa2ce38aa3b99739c66f8ef5"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "3bb1598a6233a2bbefa52c746a7621867c6c6e89"
          python3 - <<'PY'
          import csv,json,re
          from pathlib import Path
          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          by={r['Task_ID']:r for r in rows}
          fields=['Task_ID','Title','Lifecycle_Stage','Priority','Plan_Status','Execution_State','Dependencies','Primary_Owner','AI_Capability_A0_A4','Action_Authority','Acceptance_ID','Acceptance_Criteria','Verification_ID','Verification_Method','Evidence_ID','Requirement_Reference','Risk_Reference','Interface_Reference','Gate_ID','Source_Reference','Notes']
          def slim(r): return {k:r.get(k,'') for k in fields}
          for tid in ['TSK-0138','TSK-0141','TSK-0140','TSK-0312','TSK-0142']:
              print('ROW_'+tid+'='+json.dumps(slim(by[tid]),ensure_ascii=False,sort_keys=True))
          s=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          for tid in ['TSK-0138','TSK-0140','TSK-0312']:
              hits=[m.group(0) for m in re.finditer(r'(?m)^### .*'+re.escape(tid)+r'.*$',s)]
              print('RUNTIME_HEADINGS_'+tid+'='+json.dumps(hits,ensure_ascii=False))
          PY
