name: Disable AdGuard identifiable client statistics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adguard-stats-disable.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Execute TSK-0205 statistics privacy control
        shell: bash
        env:
          EXPECTED_SCRIPT_BLOB: a3955852b8e7b8270de777ffa8a31c8ffbd5371d
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          sudo -n true
          script='infrastructure/adguard-server/disable-client-statistics.sh'
          [[ "$(git hash-object "$script")" == "${EXPECTED_SCRIPT_BLOB}" ]]
          bash -n "$script"
          set +e
          bash "$script" | tee /tmp/usesafeweb-tsk-0205.log
          rc=${PIPESTATUS[0]}
          set -e
          [[ "$rc" -eq 0 ]]
          grep -q '^TSK_0205_MUTATION=PASS$' /tmp/usesafeweb-tsk-0205.log
          echo 'TSK_0205_WORKFLOW=PASS'
