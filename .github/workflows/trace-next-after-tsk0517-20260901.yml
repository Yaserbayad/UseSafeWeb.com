name: Trace next governed predecessor after TSK-0517

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trace-next-after-tsk0517-20260901.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Trace first unresolved L5 chain and ready leaves
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,re
          from pathlib import Path
          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          by_id={(r.get('Task_ID') or '').strip():r for r in rows if (r.get('Task_ID') or '').strip()}
          state=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          accepted=set(re.findall(r'^## (TSK-\d{4}) current accepted stable state',state,flags=re.M))
          def deps(r): return [x.strip() for x in (r.get('Dependencies') or '').split(';') if x.strip()]
          def disposition(r): return (r.get('Planning_Status') or '').strip().upper()
          def show(t,depth=0,seen=None):
              if seen is None: seen=set()
              if t in seen: print('  '*depth+t+' CYCLE'); return
              seen=set(seen);seen.add(t); r=by_id[t]; ds=deps(r); missing=[d for d in ds if d not in accepted]
              print('  '*depth+f"{t}|L={(r.get('Lifecycle_Stage') or '').strip()}|P={(r.get('Priority') or '').strip()}|AUTH={(r.get('Action_Authority') or '').strip()}|PLAN={disposition(r) or 'PLANNED'}|DEPS={','.join(ds) or '-'}|MISSING={','.join(missing) or '-'}|TASK={(r.get('Task') or '').strip()}|ACC={(r.get('Acceptance_Criteria') or '').strip()}")
              for d in missing:
                  if d in by_id: show(d,depth+1,seen)
                  else: print('  '*(depth+1)+d+' MISSING_FROM_WBS')
          target='TSK-0047'
          print('TARGET='+target); show(target)
          branch=set()
          def collect(t):
              if t in branch or t not in by_id or t in accepted:return
              branch.add(t)
              for d in deps(by_id[t]):
                  if d not in accepted:collect(d)
          collect(target)
          ready=[]; deferred=[]
          for t in branch:
              r=by_id[t]; p=disposition(r)
              if p in {'DEFERRED','NOT_APPLICABLE','CANCELLED','CANCELED'}:
                  deferred.append(t);continue
              if all(d in accepted for d in deps(r)):ready.append(r)
          order={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          ready.sort(key=lambda r:(order.get((r.get('Priority') or '').strip().upper(),9),rows.index(r),(r.get('Task_ID') or '')))
          print('READY_BRANCH_LEAVES='+str(len(ready)))
          for r in ready: print('READY|'+ '|'.join([(r.get('Task_ID') or '').strip(),(r.get('Priority') or '').strip(),(r.get('AI_Capability_A0_A4') or '').strip(),(r.get('Action_Authority') or '').strip(),(r.get('Task') or '').strip()]))
          print('DEFERRED_BRANCH_NODES='+','.join(sorted(deferred)))
          PY
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
