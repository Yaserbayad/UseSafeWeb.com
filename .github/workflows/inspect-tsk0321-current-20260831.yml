name: Inspect current TSK-0321

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/inspect_tsk0321_current_20260831.py'
      - '.github/workflows/inspect-tsk0321-current-20260831.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect current TSK-0321 boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/inspect_tsk0321_current_20260831.py
          git diff --check
          test -z "$(git status --porcelain)"
