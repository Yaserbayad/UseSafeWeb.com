name: Reconcile TSK-0315 PASS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0315-pass.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify evidence and reconcile runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object TSK_0315_ACCOUNTLESS_END_TO_END_SERVICE_BLUEPRINT_2026-08-28.md)" = "f428f346d6e994d093b651d7b934e8610498c350"
          test "$(git hash-object TSK_0315_ACCOUNTLESS_END_TO_END_SERVICE_BLUEPRINT_EVIDENCE_2026-08-28.md)" = "72d375ed4b783b56572012a0e48716b1314c0be6"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline=''))); by={r['Task_ID']:r for r in rows}
          t=by['TSK-0315']; n=by['TSK-0320']
          assert t['Dependencies']=='TSK-0149; TSK-0229'
          assert t['Action_Authority']=='AUTO_ALLOWED' and t['AI_Capability_A0_A4']=='A3'
          assert n['Dependencies']=='TSK-0315'
          assert n['Action_Authority']=='AUTO_ALLOWED' and n['AI_Capability_A0_A4']=='A3'
          assert n['Priority']=='CRITICAL'
          assert 'no confirmation masquerades as verification' in n['Acceptance_Criteria']
          e=pathlib.Path('TSK_0315_ACCOUNTLESS_END_TO_END_SERVICE_BLUEPRINT_EVIDENCE_2026-08-28.md').read_text()
          assert 'every ACC-0315 clause' in e
          assert 'RSK-0002' in e
          a=pathlib.Path('TSK_0315_ACCOUNTLESS_END_TO_END_SERVICE_BLUEPRINT_2026-08-28.md').read_text()
          assert 'Provisional evidence limitation — RSK-0002 remains OPEN' in a
          assert 'PASS candidate subject to independent verification and runtime read-back' in a
          p=pathlib.Path('CURRENT_STATE.md'); text=p.read_text()
          assert '### TSK-0408 accepted stable state' in text
          assert '### TSK-0315 accepted stable state' not in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          sec='''### TSK-0315 accepted stable state\n\n`TSK-0315 — Create the accountless end-to-end service blueprint from discovery through recovery/removal`: **PASS for the provisional internal L4 service blueprint under DEC-0050/CR-0003**. Blueprint `TSK_0315_ACCOUNTLESS_END_TO_END_SERVICE_BLUEPRINT_2026-08-28.md`, blob `f428f346d6e994d093b651d7b934e8610498c350`; independent evidence `TSK_0315_ACCOUNTLESS_END_TO_END_SERVICE_BLUEPRINT_EVIDENCE_2026-08-28.md`, blob `72d375ed4b783b56572012a0e48716b1314c0be6`. ACC-0315 is satisfied: parent/system actions, evidence states, dependencies, failures/recovery, automated support, privacy boundaries, owner-only exceptions and interaction necessity are explicit from public discovery through removal/exit. The blueprint preserves accountless J0-first/J1-bounded state, consumes TSK-0408 platform-specific DNS semantics, and does not fabricate unfinished TSK-0143/0144/0320/0409 detail.\n\n`RSK-0002` remains OPEN: no representative-parent evidence proves completion, comprehension, support burden, persistence, perceived duplication or optimal ordering/copy. This PASS is provisional internal design only and does not authorize LG-05/LG-06, implementation/build, participants, legal completion, payment, public release or launch.\n\n'''
          marker='## Runtime safeguards'
          text=text.replace(marker,sec+marker,1)
          q=text.rfind('\n## Queue status after current reconciliation'); assert q>=0
          text=text[:q].rstrip()+f'''\n\n## Queue status after current reconciliation\n\n`TSK-0315` is runtime PASS for the provisional internal L4 service blueprint. Its completion unlocks `TSK-0316` and `TSK-0320`; `TSK-0320` is CRITICAL/A3/AUTO_ALLOWED with sole hard dependency `TSK-0315`, while `TSK-0316` and `TSK-0409` are HIGH/A3/AUTO_ALLOWED. `TSK-0187` remains deferred because representative-parent evidence is unavailable under CR-0003. Human-only successors remain fenced.\n\n- **Selected next: `TSK-0320 — {n['Title']}`** (L4 / {n['AI_Capability_A0_A4']} / {n['Action_Authority']} / {n['Priority']}).\n- Hard dependency: `TSK-0315` — current PASS.\n- ACC-0320: {n['Acceptance_Criteria']}\n- Selection rationale: newly eligible CRITICAL product-truth state contract outranks HIGH design/technical candidates and can be satisfied without real-participant evidence.\n\n## Exact next authoritative step\n\nExecute bounded `TSK-0320`: freeze the provisional Protection Map/protection-state evidence and transition rules for protected/verified, configured/parent-confirmed, action-needed, not-covered, uncertain/error and removed states. Ground DNS truth in TSK-0408 and current accepted technical evidence, keep parent confirmation distinct from system verification, preserve TSK-0229 accountless/no-history rules, explicitly carry `RSK-0002`, and do not imply real-user validation or implementation authority. Persist/read back independent ACC-0320 evidence, reconcile runtime, then recompute.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md
          git commit -m "state: accept TSK-0315 and select TSK-0320"
          git push
