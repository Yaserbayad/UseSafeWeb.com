name: Reconcile TSK-0321 post-CR-0007 waiting state
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0321-post-cr0007-waiting-20260901.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guarded runtime WAITING reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 .github/scripts/reconcile_tsk0321_post_cr0007_waiting_20260901.py
          git diff --check
          test "$(git diff --name-only)" = 'CURRENT_STATE.md'
          grep -F 'TSK-0321 current waiting state — 2026-09-01 — POST-CR-0007' CURRENT_STATE.md >/dev/null
          grep -F 'APPROVE TSK-0321 POST-CR-0007 ACCESSIBILITY REMEDIATION AND REVIEW' CURRENT_STATE.md >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: set TSK-0321 post-CR-0007 waiting'
          git push origin HEAD:main
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote" = "$(git rev-parse HEAD)"
          echo "TSK0321_WAITING_COMMIT=$remote"
          echo "TSK0321_WAITING_RUNTIME_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
          echo 'TSK0321_WAITING_RECONCILIATION=PASS'
