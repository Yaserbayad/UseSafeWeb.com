name: TSK-0629 automated-check acceptance

on:
  push:
    branches:
      - feature/tsk-0629-automated-checks-20260903
      - main
    paths:
      - 'website/**'
      - 'Plans/Master/WBS/master-wbs.csv'
      - 'Plans/Master/Registers/VERIFICATION_EVIDENCE_ACCEPTANCE.md'
      - 'Plans/Master/Tools/validate_master_plan.py'
      - 'tests/repository-structure/**'
  pull_request:
    paths:
      - 'website/**'
      - 'Plans/Master/WBS/master-wbs.csv'
      - 'Plans/Master/Registers/VERIFICATION_EVIDENCE_ACCEPTANCE.md'
      - 'Plans/Master/Tools/validate_master_plan.py'
      - 'tests/repository-structure/**'
      - '.github/workflows/accept-tsk0629-automated-checks-20260903.yml'

permissions:
  contents: read

jobs:
  accept-tsk0629:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Verify source, governance integrity, contracts, and production build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = '142a0d45b381136567d78545f063333f1e74901f'
          test "$(git hash-object website/package-lock.json)" = '6ff91d845bc5f3099b6a00f5f43673eed80a3ba5'
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          cd website
          npm ci --no-fund --no-audit
          npm run test:contract
          npm run lint
          npm run typecheck
          NEXT_TELEMETRY_DISABLED=1 npm run build
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          test "$(node -p "require('./node_modules/next/package.json').version")" = '16.3.3'
          test "$(node -p "require('./node_modules/react/package.json').version")" = '19.2.8'
          test "$(node -p "require('./node_modules/react-dom/package.json').version")" = '19.2.8'
          cd ..
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Run real-browser TSK-0629 acceptance when present
        shell: bash
        run: |
          set -euo pipefail
          test_file='website/tests/browser/tsk0629-browser.mjs'
          if [ ! -f "$test_file" ]; then
            echo 'TSK0629_BROWSER_ACCEPTANCE=NOT_YET_PRESENT'
            exit 0
          fi
          cd website
          npm install --no-save --no-package-lock --no-fund --no-audit playwright@1.62.1 axe-core@4.13.0
          test "$(node -p "require('./node_modules/playwright/package.json').version")" = '1.62.1'
          test "$(node -p "require('./node_modules/axe-core/package.json').version")" = '4.13.0'
          npx playwright install --with-deps chromium
          NEXT_TELEMETRY_DISABLED=1 npm start -- -p 3000 > /tmp/tsk0629-acceptance.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/tsk0629-acceptance.log' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/en-GB >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/en-GB >/dev/null
          BASE_URL=http://127.0.0.1:3000 node tests/browser/tsk0629-browser.mjs
          cd ..
          git diff --check
          test -z "$(git status --porcelain)"
