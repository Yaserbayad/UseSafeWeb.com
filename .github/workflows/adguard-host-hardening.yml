name: AdGuard host hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adguard-host-hardening.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  harden:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Apply TSK-0437 host security baseline
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${RUNNER_OS}" == "Linux" ]]
          [[ "${RUNNER_ARCH}" == "X64" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          sudo -n true

          . /etc/os-release
          [[ "${ID}" == "ubuntu" ]]
          [[ "${VERSION_ID}" == "24.04" ]]

          unit="$(systemctl list-unit-files 'actions.runner.*.service' --no-legend 2>/dev/null | awk 'NR==1 {print $1}' || true)"
          [[ -n "${unit}" ]]
          systemctl is-enabled --quiet "${unit}"
          systemctl is-active --quiet "${unit}"

          test -f infrastructure/adguard-server/harden-host.sh
          bash -n infrastructure/adguard-server/harden-host.sh

          source_ip="$(sudo journalctl -u ssh.service --since '-7 days' --no-pager -o cat 2>/dev/null \
            | sed -n 's/.*Accepted publickey for azureusr from \([^ ]*\).*/\1/p' \
            | tail -n 1)"
          if [[ -z "${source_ip}" && -r /var/log/auth.log ]]; then
            source_ip="$(sudo sed -n 's/.*Accepted publickey for azureusr from \([^ ]*\).*/\1/p' /var/log/auth.log | tail -n 1)"
          fi
          [[ -n "${source_ip}" ]] || {
            echo "FAIL no recent public-key SSH login proof found for azureusr"
            exit 1
          }
          python3 - "${source_ip}" <<'PY'
          import ipaddress, sys
          ipaddress.ip_address(sys.argv[1])
          PY
          echo "public_key_ssh_proof=PASS"

          set +e
          sudo env \
            USW_ADMIN_USER=azureusr \
            USW_SSH_SOURCE_IP="${source_ip}" \
            bash infrastructure/adguard-server/harden-host.sh --apply-root \
            | tee /tmp/usesafeweb-tsk-0437.log
          rc=${PIPESTATUS[0]}
          set -e

          if [[ "${rc}" -eq 0 ]]; then
            grep -q '^OVERALL=PASS ' /tmp/usesafeweb-tsk-0437.log
            echo "HARDENING_RESULT=PASS"
            exit 0
          fi

          if [[ "${rc}" -eq 2 ]]; then
            grep -q '^OVERALL=WAITING_REBOOT ' /tmp/usesafeweb-tsk-0437.log
            sudo systemd-run \
              --unit=usesafeweb-reboot-after-hardening \
              --on-active=12s \
              /sbin/reboot
            echo "HARDENING_RESULT=WAITING_REBOOT"
            echo "REBOOT_SCHEDULED=1"
            exit 0
          fi

          echo "HARDENING_RESULT=FAIL rc=${rc}"
          exit "${rc}"
