name: Audit current L5 governed frontier

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/audit_current_l5_frontier_20260901.py'
      - '.github/workflows/audit-current-l5-frontier-20260901.yml'

permissions:
  contents: write

concurrency:
  group: usesafeweb-governed-l5-frontier-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Reconcile TSK-0446 current planning controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import re
          from pathlib import Path

          wbs = Path('Plans/Master/WBS/master-wbs.csv')
          with wbs.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          row = next((r for r in rows if (r.get('Task_ID') or '').strip() == 'TSK-0446'), None)
          if row is None:
              raise SystemExit('TSK0446_RECONCILE_FAIL: WBS row missing')

          wanted = ('lifecycle', 'priority', 'depend', 'capability', 'authority', 'planning',
                    'gate', 'trigger', 'precondition', 'risk', 'constraint', 'requirement',
                    'interface', 'acceptance', 'verification', 'evidence', 'task_name',
                    'task_title', 'title', 'description')
          print('TSK0446_WBS_RECONCILIATION=BEGIN')
          for key, value in row.items():
              if value and any(token in key.lower() for token in wanted):
                  print(f'{key}={value.strip()}')
          print('TSK0446_WBS_RECONCILIATION=END')

          rel = Path('Plans/Master/RELATIONSHIP_INDEX.yaml').read_text(encoding='utf-8').splitlines()
          hits = [i for i, line in enumerate(rel) if 'TSK-0446' in line]
          print(f'TSK0446_RELATIONSHIP_HITS={len(hits)}')
          ids = set()
          for i in hits:
              lo = max(0, i - 12)
              hi = min(len(rel), i + 13)
              for line in rel[lo:hi]:
                  ids.update(re.findall(r'\b(?:REQ|RSK|INT|CON|ACC|VER|EVD|LG|TSK)-\d{4}\b', line))
          print('TSK0446_NEARBY_RELATIONSHIP_IDS=' + ','.join(sorted(ids)))
          PY

      - name: Derive current L5 frontier from canonical state
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/audit_current_l5_frontier_20260901.py
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --check HEAD^ HEAD
          test "$(git status --porcelain | sed 's/^...//')" = 'CURRENT_L5_FRONTIER_AUDIT_2026-09-01.md'

      - name: Persist derived audit with remote read-back
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          AUDIT='CURRENT_L5_FRONTIER_AUDIT_2026-09-01.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$AUDIT"
          git commit -m 'evidence: audit current L5 governed frontier'
          COMMIT="$(git rev-parse HEAD)"
          BLOB="$(git rev-parse "$COMMIT:$AUDIT")"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$COMMIT"
          test "$(git rev-parse "origin/main:$AUDIT")" = "$BLOB"
          git show "origin/main:$AUDIT" | grep -F '**Derived audit only — not a mutable state store, WBS, checkpoint, task claim, or PASS decision.**'
          echo "FRONTIER_AUDIT_COMMIT=$COMMIT"
          echo "FRONTIER_AUDIT_BLOB=$BLOB"
          echo 'FRONTIER_AUDIT_REMOTE_READBACK=PASS'
