name: Verify TSK-0138 post-CR-0006
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0138-post-cr0006-20260830.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify current decision-control register
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = "14fe2b734eb58c63aa2ce38aa3b99739c66f8ef5"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "3bb1598a6233a2bbefa52c746a7621867c6c6e89"
          test "$(git hash-object Plans/Master/Registers/DECISIONS_TRIGGERS.md)" = "9cb2908f4c6f19cb38fce4a8aff71abca3b7b095"
          test "$(git hash-object Plans/Master/Registers/EXCEPTIONS_CHANGE_CONTROLS.md)" = "864ce0c5b893930f24dc3bde814797b55fa0fa7e"
          test "$(git hash-object TSK_0138_UNRESOLVED_PRODUCT_ASSUMPTIONS_AND_OWNER_DECISIONS_2026-08-28.md)" = "d782f26d5d48b0902b044d8bbab48569bdee0ea2"
          test "$(git hash-object TSK_0138_POST_CR0006_UNRESOLVED_PRODUCT_ASSUMPTIONS_AND_OWNER_DECISIONS_2026-08-30.md)" = "a628d84afda666b99e05e494a921fb01e73ac930"
          python3 - <<'PY'
          import csv,re
          from pathlib import Path
          root=Path('.')
          rows=list(csv.DictReader((root/'Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          r=next(x for x in rows if x['Task_ID']=='TSK-0138')
          assert r['Lifecycle_Stage']=='L4'
          assert r['Dependencies']=='TSK-0141'
          assert r['AI_Capability_A0_A4']=='A3'
          assert r['Action_Authority']=='AUTO_ALLOWED'
          assert r['Acceptance_ID']=='ACC-0138'
          runtime=(root/'CURRENT_STATE.md').read_text(encoding='utf-8')
          assert '## TSK-0141 current accepted stable state — 2026-08-30 — POST-CR-0006' in runtime
          assert '`TSK-0141 — Freeze minimum product scope and non-goals`: **PASS**' in runtime
          dec=(root/'Plans/Master/Registers/DECISIONS_TRIGGERS.md').read_text(encoding='utf-8')
          assert 'DEC-0052' in dec and 'actual human/user validation begins only after LG-09 PASS in L8' in dec
          assert 'DEC-0053' in dec and 'Version-1 optional parent accounts with accountless core retained' in dec
          exc=(root/'Plans/Master/Registers/EXCEPTIONS_CHANGE_CONTROLS.md').read_text(encoding='utf-8')
          assert 'EXC-0001 | Optional account/authentication/persistent parent dashboard | ACTIVATED_V1_SCOPE' in exc
          assert '| CR-0005 |' in exc and '| CR-0006 |' in exc
          old=(root/'TSK_0138_UNRESOLVED_PRODUCT_ASSUMPTIONS_AND_OWNER_DECISIONS_2026-08-28.md').read_text(encoding='utf-8')
          assert 'UPA-009 | Accountless-first remains sufficient' in old
          assert 'UPA-010 | A persistent parent dashboard/device list is necessary' in old
          assert 'UPA-017 | Integrated product build may start before real behavioral validation' in old
          new=(root/'TSK_0138_POST_CR0006_UNRESOLVED_PRODUCT_ASSUMPTIONS_AND_OWNER_DECISIONS_2026-08-30.md').read_text(encoding='utf-8')
          for token in [
              'DEC-0052 / CR-0005', 'DEC-0053 / CR-0006', 'ACTIVATED_V1_SCOPE',
              'first real-user validation is L8 only after LG-09 PASS',
              'UPA-009 | Whether accountless-first is sufficient',
              'UPA-010 | Whether a persistent parent dashboard/device list is necessary',
              'UPA-017 | Whether integrated product build must wait for real behavioral validation',
              'TSK-0052 / LG-06', '2027-08-27', 'HUMAN_ONLY/HUMAN_APPROVAL_REQUIRED'
          ]: assert token in new, token
          sec=new.split('## 4. Current unresolved assumptions and decisions',1)[1].split('## 5.',1)[0]
          lines=[ln for ln in sec.splitlines() if ln.startswith('| UPA-')]
          ids=[ln.split('|')[1].strip() for ln in lines]
          expected=['UPA-001','UPA-002','UPA-003','UPA-004','UPA-005','UPA-006','UPA-007','UPA-008','UPA-011','UPA-012','UPA-013','UPA-014','UPA-015','UPA-016','UPA-018','UPA-019','UPA-020']
          assert ids==expected, ids
          for ln in lines:
              cells=[c.strip() for c in ln.strip().strip('|').split('|')]
              assert len(cells)==9, (cells[0],len(cells))
              assert all(cells), cells[0]
          for removed in ['UPA-009','UPA-010','UPA-017']:
              assert removed not in ids
          assert sec.count('L8 after LG-09') >= 8
          assert 'LG-06 stays non-PASS' in sec
          assert 'cannot self-certify HUMAN_ONLY LG-06' in sec
          assert 'No public launch' in sec
          assert 'cannot activate payment collection or spend' in sec
          print('TSK0138_DEPENDENCY=PASS')
          print('TSK0138_STALE_HISTORICAL_ASSUMPTIONS_DETECTED=PASS')
          print('TSK0138_DEC0052_REBASELINE=PASS')
          print('TSK0138_DEC0053_REBASELINE=PASS')
          print('TSK0138_OPEN_ITEMS_COMPLETE=PASS')
          print('TSK0138_ACC0138=PASS')
          print('TSK0138_OWNER_BOUNDARIES=PASS')
          print('TSK0138_VERIFICATION=PASS')
          PY
