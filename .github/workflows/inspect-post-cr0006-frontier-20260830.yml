name: Inspect post-CR-0006 frontier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-post-cr0006-frontier-20260830.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Print exact TSK-0146 execution contract
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          rows = list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='')))
          row = next(r for r in rows if r['Task_ID'].strip() == 'TSK-0146')
          print('FULL_TARGET=' + json.dumps(row, ensure_ascii=False, sort_keys=True))
          PY
