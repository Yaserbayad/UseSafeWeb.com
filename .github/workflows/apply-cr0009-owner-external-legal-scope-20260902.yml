name: Apply CR-0009 owner-external legal scope 2026-09-02

on:
  push:
    branches: [cr0009-owner-external-legal-scope-20260902]
    paths:
      - '.github/workflows/apply-cr0009-owner-external-legal-scope-20260902.yml'
      - 'Plans/Master/Tools/apply_cr0009_owner_external_legal_scope_20260902.py'

permissions:
  contents: write

concurrency:
  group: cr0009-owner-external-legal-scope
  cancel-in-progress: false

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cr0009-owner-external-legal-scope-20260902
          fetch-depth: 0

      - name: Apply bounded CR-0009 amendment
        run: python3 Plans/Master/Tools/apply_cr0009_owner_external_legal_scope_20260902.py

      - name: Deterministic validation and semantic assertions
        run: |
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --check
          grep -F 'latest_change: CR-0009' Plans/Master/MANIFEST.yaml
          grep -F '| DEC-0056 | New | Owner-external legal/compliance scope and dependency satisfaction |' Plans/Master/Registers/DECISIONS_TRIGGERS.md
          grep -F '| CR-0009 | 2026-09-02 |' Plans/Master/Registers/EXCEPTIONS_CHANGE_CONTROLS.md
          grep -F '### 5.3.8 Owner-external legal/compliance scope (DEC-0056 / CR-0009)' Plans/Master/Layers/LAYER_5_AI_EXECUTION_EVIDENCE_STATE_CONTROL.md
          grep -F 'Legal-scope items are **OWNER_EXTERNAL_SATISFIED**' Plans/Master/Layers/LAYER_5_AI_EXECUTION_EVIDENCE_STATE_CONTROL.md
          grep -F 'This is not legal advice, legal verification, compliance evidence' CR_0009_OWNER_EXTERNAL_LEGAL_SCOPE_EVIDENCE_2026-09-02.md

      - name: Commit validated planning amendment
        id: planning
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-cr0009-owner-external-legal-scope-20260902.yml
          git add Plans CR_0009_OWNER_EXTERNAL_LEGAL_SCOPE_EVIDENCE_2026-09-02.md
          git commit -m 'governance: apply owner-external legal scope CR-0009'
          echo "planning_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reconcile CURRENT_STATE to CR-0009
        env:
          PLANNING_SHA: ${{ steps.planning.outputs.planning_sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import os

          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          assert 'CR-0009 current owner-external legal-scope boundary' not in text
          text = text.replace('**ACTIVE / OWNER-FROZEN / POST-FREEZE CR-0008 PUBLISHED, RECONCILED, READ-BACK VERIFIED.**', '**ACTIVE / OWNER-FROZEN / POST-FREEZE CR-0009 PUBLISHED, RECONCILED, READ-BACK VERIFIED.**', 1)
          lines = text.splitlines()
          out = []
          inserted = False
          for line in lines:
              if line.startswith('- Latest post-freeze change: `CR-0008`') and not inserted:
                  out.append('- Latest post-freeze change: `CR-0009` / `DEC-0056`, explicit Project Owner authority 2026-09-02: all legal/regulatory/compliance work is owner-external and nonblocking for governed sequencing; AI does not perform or claim legal/compliance verification.')
                  out.append(f'- CR-0009 planning publication commit: `{os.environ["PLANNING_SHA"]}`; deterministic validator PASS before publication.')
                  out.append('- CR-0009 changes only legal-scope dependency/gate evaluation semantics. WBS task definitions/statuses/dependency edges remain unchanged; legal work is not marked legally PASS.')
                  out.append('- Pure legal-scope tasks and legal clauses are `OWNER_EXTERNAL_SATISFIED` for sequencing. Mixed tasks still require every non-legal product, privacy-engineering, security, architecture, delivery, test, recovery, cost and operations criterion.')
                  out.append('- Actual law/safety/security/platform/technical reality remains higher authority; known prohibitions are not bypassed and no signature, attestation, filing, registration, payment, approval or legal conclusion is fabricated.')
                  out.append(line.replace('- Latest post-freeze change:', '- Prior post-freeze change:', 1))
                  inserted = True
              else:
                  out.append(line)
          assert inserted
          text = '\n'.join(out) + '\n'
          marker = '## CR-0007 current authority and execution boundary\n'
          assert marker in text
          section = f'''## CR-0009 current owner-external legal-scope boundary — 2026-09-02\n\n- `DEC-0056 / CR-0009` supersedes `DEC-0036` and `DEC-0049 / CR-0002` legal-hold timing/preparatory-only restrictions for active governed sequencing.\n- Legal/regulatory/compliance work is outside AI scope and is treated as `OWNER_EXTERNAL_SATISFIED` for dependency and gate evaluation only. This is not legal PASS/evidence.\n- Legal-scope WBS rows retain their historical planning/runtime records for traceability and are not selected by the AI.\n- In mixed tasks/gates, only the legal clause is external. All non-legal acceptance remains mandatory and must be evidenced normally.\n- The previously deferred legal predecessor `TSK-0240` therefore no longer blocks technical L5 progression through `TSK-0239`; exact eligibility must still be recomputed against every other dependency and current evidence before execution.\n- No LG-07/L6/build/production/publication/payment/market/launch PASS is inferred from CR-0009.\n- Planning publication commit: `{os.environ['PLANNING_SHA']}`.\n\n### Queue status after CR-0009 reconciliation\n\nRecompute the residual L5 frontier from current WBS/graph, gates, runtime PASS evidence and DEC-0056 semantics; execute the highest-priority genuinely eligible non-legal AUTO_ALLOWED task.\n\n'''
          text = text.replace(marker, section + marker, 1)
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          import re
          text = re.sub(r'\*\*Updated:\*\* [^\n]+', f'**Updated:** {now}', text, count=1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -F '## CR-0009 current owner-external legal-scope boundary — 2026-09-02' CURRENT_STATE.md
          grep -F '`TSK-0240` therefore no longer blocks technical L5 progression through `TSK-0239`' CURRENT_STATE.md
          git add CURRENT_STATE.md
          git commit -m 'state: reconcile CR-0009 legal-scope boundary'

      - name: Stale-write guard and publish staging branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin cr0009-owner-external-legal-scope-20260902
          if [ "$(git rev-parse origin/cr0009-owner-external-legal-scope-20260902)" != "${SOURCE_SHA}" ]; then
            echo 'Staging branch changed after CR-0009 checkout; refusing ambiguous publish.'
            exit 1
          fi
          git push origin HEAD:cr0009-owner-external-legal-scope-20260902

      - name: Exact remote read-back
        run: |
          git fetch origin cr0009-owner-external-legal-scope-20260902
          git show origin/cr0009-owner-external-legal-scope-20260902:Plans/Master/MANIFEST.yaml | grep -F 'latest_change: CR-0009'
          git show origin/cr0009-owner-external-legal-scope-20260902:Plans/Master/Registers/DECISIONS_TRIGGERS.md | grep -F '| DEC-0056 | New | Owner-external legal/compliance scope and dependency satisfaction |'
          git show origin/cr0009-owner-external-legal-scope-20260902:Plans/Master/Layers/LAYER_5_AI_EXECUTION_EVIDENCE_STATE_CONTROL.md | grep -F '### 5.3.8 Owner-external legal/compliance scope (DEC-0056 / CR-0009)'
          git show origin/cr0009-owner-external-legal-scope-20260902:CURRENT_STATE.md | grep -F '## CR-0009 current owner-external legal-scope boundary — 2026-09-02'
          echo "REMOTE_HEAD=$(git rev-parse origin/cr0009-owner-external-legal-scope-20260902)"
