name: Verify retired TSK-0319 post-CR-0008 acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retired-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify durable accepted state remains intact
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '## TSK-0319 current accepted stable state — 2026-09-01 — POST-CR-0008 REQUALIFICATION' CURRENT_STATE.md
          grep -Fq '`TSK-0319 — Design automated verification, issue-specific troubleshooting, safe reset/reinstall/remove, and point-of-need help`: **PASS**' CURRENT_STATE.md
          test "$(git hash-object TSK_0319_POST_CR0008_AUTOMATED_VERIFICATION_TROUBLESHOOTING_RECOVERY_HELP_2026-09-01.md)" = 'dec2b556745c635656fa0f18945c63c47120f6ff'
          test "$(git hash-object TSK_0319_POST_CR0008_INDEPENDENT_VERIFICATION_EVIDENCE_2026-09-01.md)" = '8a797f8257247bc3c557af10fe1d16b37c831077'
          python3 Plans/Master/Tools/validate_master_plan.py
          echo 'TSK0319_RETIRED_ACCEPTANCE_VERIFIER=PASS'
