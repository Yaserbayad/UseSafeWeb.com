name: Reconcile TSK-0431 recovery runner WAITING state

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-tsk0431-runner-wait.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Reconcile canonical runtime state
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 infrastructure/adguard-server/reconcile-tsk0431-state.py
          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: reconcile TSK-0431 recovery runner WAITING boundary'
          git push origin HEAD:main
