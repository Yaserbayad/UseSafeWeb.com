name: Resolve TSK-0423 WAITING eligibility

on:
  push:
    branches: [main]
    paths: [.github/workflows/resolve-tsk0423-waiting-20260905.yml]

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revalidate and transition WAITING to TODO
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = '0b8ddf8d5272c5f6e2b230dbc49be28a91fc92eb'
          python3 - <<'PY'
          import copy, json
          from pathlib import Path
          p=Path('CURRENT_STATE.md')
          text=p.read_text(encoding='utf-8')
          before=json.loads(text)
          assert text==json.dumps(before,indent=2,ensure_ascii=False)+'\n'
          assert before['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert before['project_id']=='UseSafeWeb.com'
          assert before['governance_mode']=='SERIAL_LIGHT'
          assert before['checkpoint_revision']==29
          assert before['baseline']['version']==1
          assert before['runtime']['project_status']=='ACTIVE'
          assert before['runtime']['governance_blocker'] is None
          assert before['runtime']['human_constraints']==[]
          base={x['id']:x for x in before['baseline']['work_items']}
          rt={x['id']:x for x in before['runtime']['items']}
          assert rt['TSK-0413']['status']=='PASS'
          assert base['TSK-0423']['depends_on']==['TSK-0413']
          assert base['TSK-0423']['gates']==[]
          assert base['TSK-0423']['execution_context']=='ACTIVE_ONLY'
          assert base['TSK-0423']['plan_priority']==0
          assert rt['TSK-0423']['status']=='WAITING'
          assert 'TSK-0423' not in {'TSK-0630','TSK-0421','TSK-0415','TSK-0416','TSK-0370','TSK-0499','TSK-0242','TSK-0631','TSK-0633','TSK-0634','TSK-0635','TSK-0637','TSK-0640'}
          after=copy.deepcopy(before)
          after['checkpoint_revision']=30
          target=next(x for x in after['runtime']['items'] if x['id']=='TSK-0423')
          target.clear(); target.update({'id':'TSK-0423','status':'TODO','acceptance_references':[]})
          assert after['baseline']==before['baseline']
          before_items={x['id']:x for x in before['runtime']['items']}
          after_items={x['id']:x for x in after['runtime']['items']}
          for tid,old in before_items.items():
              if tid!='TSK-0423': assert after_items[tid]==old, tid
          assert after_items['TSK-0423']=={'id':'TSK-0423','status':'TODO','acceptance_references':[]}
          assert 'next_work' not in after and 'next_work' not in after['runtime']
          p.write_text(json.dumps(after,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('TSK0423_WAITING_RESOLVED=TODO revision=30')
          PY
          git diff --check -- CURRENT_STATE.md
      - name: Stale-write guard, remove transport, commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = '0b8ddf8d5272c5f6e2b230dbc49be28a91fc92eb'
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/resolve-tsk0423-waiting-20260905.yml
          git add CURRENT_STATE.md
          git commit -m 'state: resolve TSK-0423 waiting to todo'
          git push origin HEAD:main
