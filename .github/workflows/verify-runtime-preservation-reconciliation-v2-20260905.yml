name: Verify corrected runtime preservation reconciliation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-runtime-preservation-reconciliation-v2-20260905.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact preservation set
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_CHECKPOINT_BLOB='c2175c5b5e3a5797f38638e36503f76d6cafbd60'
          LEGACY_COMMIT='20e2763c0be2124378e3158ac559aed826bc6765'
          LEGACY_BLOB='d45c7b1f98ceba6265944aabd970c250dc7be2d2'
          WBS_BLOB='357c5e1be3b455e7efddd329d6a2468e3125b502'
          test "$(git hash-object CURRENT_STATE.md)" = "$EXPECTED_CHECKPOINT_BLOB"
          test "$(git rev-parse ${LEGACY_COMMIT}:CURRENT_STATE.md)" = "$LEGACY_BLOB"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "$WBS_BLOB"
          git show "${LEGACY_COMMIT}:CURRENT_STATE.md" > /tmp/legacy-current-state.md
          python3 - <<'PY'
          import csv,json,re
          from pathlib import Path

          RESTORE='''TSK-0026 TSK-0027 TSK-0028 TSK-0139 TSK-0165 TSK-0166 TSK-0167 TSK-0168 TSK-0169 TSK-0202 TSK-0207 TSK-0214 TSK-0225 TSK-0227 TSK-0228 TSK-0298 TSK-0302 TSK-0374 TSK-0428 TSK-0429 TSK-0430 TSK-0431 TSK-0437 TSK-0441 TSK-0442 TSK-0443 TSK-0510 TSK-0511 TSK-0512 TSK-0513 TSK-0514 TSK-0559'''.split()
          EXCLUDE='''TSK-0243 TSK-0360 TSK-0369 TSK-0399 TSK-0455 TSK-0483 TSK-0499 TSK-0630'''.split()
          OWNER_DEFER={'TSK-0455','TSK-0631','TSK-0633','TSK-0634','TSK-0635','TSK-0637','TSK-0640','TSK-0630','TSK-0421','TSK-0415','TSK-0416','TSK-0370','TSK-0499','TSK-0242'}
          assert len(RESTORE)==32 and len(EXCLUDE)==8
          assert not (set(RESTORE)&set(EXCLUDE))
          assert not (set(RESTORE)&OWNER_DEFER)

          cur=json.loads(Path('CURRENT_STATE.md').read_text(encoding='utf-8'))
          assert cur['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert cur['project_id']=='UseSafeWeb.com'
          assert cur['governance_mode']=='SERIAL_LIGHT'
          assert cur['checkpoint_revision']==27
          assert cur['baseline']['version']==1
          assert cur['runtime']['project_status']=='ACTIVE'
          runtime={x['id']:x for x in cur['runtime']['items']}
          work={x['id']:x for x in cur['baseline']['work_items']}
          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='') as f:
              wbs={r['Task_ID']:r for r in csv.DictReader(f)}
          legacy=Path('/tmp/legacy-current-state.md').read_text(encoding='utf-8')
          lines=legacy.splitlines()

          # Identify current-non-PASS accepted-stable sections and require full classification.
          headings={}
          heading_positions=[]
          for idx,line in enumerate(lines):
              m=re.match(r'^(#{2,6})\s+(TSK-\d{4})\b.*accepted stable state',line,re.I)
              if m:
                  tid=m.group(2).upper(); level=len(m.group(1))
                  heading_positions.append((idx,tid,level,line.strip()))
                  if tid in runtime and runtime[tid]['status']!='PASS':
                      headings.setdefault(tid,[]).append({'line':idx+1,'heading':line.strip()})
          unclassified=sorted(set(headings)-set(RESTORE)-set(EXCLUDE))
          assert not unclassified, unclassified

          def section_for(tid):
              sections=[]
              for idx,h_tid,level,h_text in heading_positions:
                  if h_tid!=tid: continue
                  end=len(lines)
                  for j in range(idx+1,len(lines)):
                      m=re.match(r'^(#{1,6})\s+',lines[j])
                      if m and len(m.group(1))<=level:
                          end=j; break
                  sections.append((idx,end,'\n'.join(lines[idx:end])))
              return sections

          def direct_lines(tid,acc):
              out=[]
              task_status=re.compile(r'(?i)(?:\*\*)?'+re.escape(tid)+r'\s*(?:=|:)\s*PASS\b')
              current_pass=re.compile(r'(?i)\b'+re.escape(tid)+r'\b.{0,300}\b(?:current PASS|remains current PASS)\b')
              title_pass=re.compile(r'(?i)`?'+re.escape(tid)+r'\b[^\n]{0,220}:\s*\*\*PASS\b')
              acc_sat=re.compile(r'(?i)\b'+re.escape(acc)+r'\b.{0,220}\b(?:is|are|remains)\s+(?:fully\s+)?satisfied\b')
              for i,line in enumerate(lines,1):
                  if tid not in line and acc not in line: continue
                  if task_status.search(line) or current_pass.search(line) or title_pass.search(line) or (tid in line and acc_sat.search(line)):
                      out.append({'line':i,'text':line.strip()})
              return out

          rows=[]
          for tid in RESTORE:
              assert runtime[tid]['status']!='PASS', (tid,runtime[tid]['status'])
              n=tid.split('-')[1]; acc='ACC-'+n
              assert [x['id'] for x in work[tid]['acceptance_criteria']]==[acc]
              assert wbs[tid]['Acceptance_ID']==acc
              sections=section_for(tid)
              direct=direct_lines(tid,acc)
              section_proof=[]
              for start,end,sec in sections:
                  has_acc=bool(re.search(r'(?i)\b'+re.escape(acc)+r'\b.{0,300}\b(?:satisfied|PASS)\b',sec,re.S))
                  has_pass=bool(re.search(r'(?i)\bPASS\b',sec))
                  if has_acc and has_pass:
                      section_proof.append({'start_line':start+1,'end_line':end,'acc_satisfied':True,'pass_present':True})
              # Some canonical current-runtime summary bullets have no per-task heading;
              # direct exact task/ACC state assertions are accepted there.
              assert direct or section_proof, f'no exact legacy PASS proof for {tid}'
              rows.append({
                'id':tid,
                'current_status':runtime[tid]['status'],
                'acceptance_id':acc,
                'wbs_action_authority':wbs[tid]['Action_Authority'],
                'direct_state_assertions':direct,
                'accepted_stable_sections':section_proof,
                'heading_refs':headings.get(tid,[])
              })

          exclusions=[]
          for tid in EXCLUDE:
              assert runtime[tid]['status']!='PASS'
              exclusions.append({'id':tid,'current_status':runtime[tid]['status'],'owner_deferred':tid in OWNER_DEFER,'heading_refs':headings.get(tid,[])})

          result={
            'result':'PASS',
            'checkpoint_revision':27,
            'checkpoint_blob':'c2175c5b5e3a5797f38638e36503f76d6cafbd60',
            'legacy_commit':'20e2763c0be2124378e3158ac559aed826bc6765',
            'legacy_checkpoint_blob':'d45c7b1f98ceba6265944aabd970c250dc7be2d2',
            'wbs_blob':'357c5e1be3b455e7efddd329d6a2468e3125b502',
            'restore_count':len(RESTORE),
            'restore_ids':RESTORE,
            'restore':rows,
            'exclude_count':len(EXCLUDE),
            'exclude_ids':EXCLUDE,
            'exclude':exclusions,
            'accepted_stable_nonpass_ids':sorted(headings),
            'unclassified_accepted_stable_nonpass_ids':unclassified,
            'owner_deferral_intersection':sorted(set(RESTORE)&OWNER_DEFER),
            'classification_rule':'Restore only current non-PASS tasks with exact legacy task/ACC PASS evidence under the immutable legacy checkpoint and unchanged current ACC identity; preserve all current owner deferrals and explicit non-PASS boundaries.'
          }
          Path('runtime-preservation-reconciliation-v2.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in result.items() if k!='restore'},indent=2,ensure_ascii=False))
          PY
      - name: Upload verified reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: runtime-preservation-reconciliation-v2
          path: runtime-preservation-reconciliation-v2.json
          if-no-files-found: error
      - name: Remove one-off verification transport
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = 'c2175c5b5e3a5797f38638e36503f76d6cafbd60'
          git switch -C main origin/main
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/verify-runtime-preservation-reconciliation-v2-20260905.yml
          git commit -m 'evidence: remove corrected runtime preservation verification transport'
          git push origin HEAD:main
