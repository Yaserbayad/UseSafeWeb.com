name: Record TSK-0011 evidence-backed PASS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pass-tsk0011-20260905.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify evidence and apply exact PASS mutation
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='21a13045d2ad5c6408ca4ec86da76df2ea370755'
          EVIDENCE_BLOB='b89ca291a9cf891e6f3aed3918058b9576edcd87'
          test "$(git hash-object CURRENT_STATE.md)" = "$EXPECTED_BLOB"
          test -f TSK_0011_PUBLISHED_PLAN_READBACK_EVIDENCE_2026-09-05.md
          test "$(git hash-object TSK_0011_PUBLISHED_PLAN_READBACK_EVIDENCE_2026-09-05.md)" = "$EVIDENCE_BLOB"

          cp CURRENT_STATE.md /tmp/CURRENT_STATE.before
          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path

          path=Path('CURRENT_STATE.md')
          text=path.read_text(encoding='utf-8')
          before=json.loads(text)
          assert text == json.dumps(before, indent=2, ensure_ascii=False) + '\n'
          assert before['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert before['project_id']=='UseSafeWeb.com'
          assert before['governance_mode']=='SERIAL_LIGHT'
          assert before['checkpoint_revision']==25
          assert before['baseline']['version']==1
          assert before['runtime']['project_status']=='ACTIVE'
          assert before['runtime']['governance_blocker'] is None

          work={x['id']:x for x in before['baseline']['work_items']}
          runtime={x['id']:x for x in before['runtime']['items']}
          assert work['TSK-0011']['depends_on']==['TSK-0009']
          assert work['TSK-0011']['plan_priority']==0
          assert runtime['TSK-0009']['status']=='PASS'
          assert work['TSK-0011']['acceptance_criteria']==[{
              'id':'ACC-0011',
              'condition':'Every file declared by the approved Plans/ package and SHA256SUMS.txt is fetched/read back from GitHub main and matches the approved local bytes; MASTER_PLAN.md, MANIFEST.yaml, commit SHA, file/tree identity, checksums, and branch are recorded; any mismatch blocks ordinary governed execution.'
          }]
          assert runtime['TSK-0011']=={
              'id':'TSK-0011',
              'status':'TODO',
              'acceptance_references':[]
          }

          evidence=Path('TSK_0011_PUBLISHED_PLAN_READBACK_EVIDENCE_2026-09-05.md').read_text(encoding='utf-8')
          assert 'ACC-0011: **SATISFIED**.' in evidence
          assert 'Read-back `Plans/` tree: `0ed412e5dd90f5a05238bb6542a061d7b0ce0ccf`.' in evidence
          assert 'Entries declared by `Plans/SHA256SUMS.txt`: `64`.' in evidence
          assert 'Actions run: `33979759038`.' in evidence
          assert 'Artifact: `9973390487`' in evidence
          assert 'Deviations: none observed.' in evidence

          after=copy.deepcopy(before)
          after['checkpoint_revision']=26
          target=next(x for x in after['runtime']['items'] if x['id']=='TSK-0011')
          target['status']='PASS'
          target['acceptance_references']=[{
              'ac_id':'ACC-0011',
              'evidence_type':'GITHUB_BLOB',
              'reference':'Yaserbayad/UseSafeWeb.com TSK_0011_PUBLISHED_PLAN_READBACK_EVIDENCE_2026-09-05.md; blob b89ca291a9cf891e6f3aed3918058b9576edcd87; evidence commit a19856346604521aef897a52e8c6e0d45ce63c94; frozen authority commit 20e2763c0be2124378e3158ac559aed826bc6765 Plans tree 0ed412e5dd90f5a05238bb6542a061d7b0ce0ccf; verification run 33979759038 job 101342759961 artifact 9973390487',
              'summary':'ACC-0011 is satisfied: GitHub main read-back of the complete approved Plans package exactly matches the frozen authority tree; all 64 declared SHA-256 values and file-set checks pass, required authority-root files are present, and generated MASTER_PLAN_FULL remains non-authoritative.',
              'verification_context':'Source checkpoint revision 25 blob 21a13045d2ad5c6408ca4ec86da76df2ea370755; dependency TSK-0009 PASS; frozen WBS commit 20e2763c0be2124378e3158ac559aed826bc6765 blob 357c5e1be3b455e7efddd329d6a2468e3125b502; manifest blob da35db0fe16009dfb5ce0e24caab05d6d02c84ed; SHA256SUMS blob 8fbeb7337233adc289ea51e49a0722f33db08323; verification run 33979759038.'
          }]

          assert after['baseline']==before['baseline']
          assert after['runtime']['project_status']==before['runtime']['project_status']
          assert after['runtime']['governance_blocker']==before['runtime']['governance_blocker']
          before_items={x['id']:x for x in before['runtime']['items']}
          after_items={x['id']:x for x in after['runtime']['items']}
          for wid,old in before_items.items():
              if wid!='TSK-0011':
                  assert after_items[wid]==old, wid
          assert after['checkpoint_revision']==before['checkpoint_revision']+1
          assert after['baseline']['version']==before['baseline']['version']
          assert after_items['TSK-0011']['status']=='PASS'
          assert set(after_items['TSK-0011'])=={'id','status','acceptance_references'}
          assert len(after_items['TSK-0011']['acceptance_references'])==1
          assert after_items['TSK-0011']['acceptance_references'][0]['ac_id']=='ACC-0011'

          path.write_text(json.dumps(after, indent=2, ensure_ascii=False)+'\n',encoding='utf-8')
          assert json.loads(path.read_text(encoding='utf-8'))==after
          print('TSK_0011_PASS_MUTATION=PASS revision=26 baseline=1')
          PY

          git diff --check -- CURRENT_STATE.md
          git diff --stat -- CURRENT_STATE.md
          git diff -- CURRENT_STATE.md

      - name: Recheck stale-write boundary, remove transport, and commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='21a13045d2ad5c6408ca4ec86da76df2ea370755'
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = "$EXPECTED_BLOB"
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pass-tsk0011-20260905.yml
          git add CURRENT_STATE.md
          printf '%s\n' '.github/workflows/pass-tsk0011-20260905.yml' 'CURRENT_STATE.md' > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          git commit -m 'state: confirm TSK-0011 published plan readback pass'
          git push origin HEAD:main
