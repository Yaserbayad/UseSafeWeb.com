name: Verify post-CR-0007 TSK-0335 preparation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0335-post-cr0007-preparation-20260831.yml'
      - '.github/scripts/verify_tsk0335_post_cr0007_preparation_20260831.py'
      - 'design/TSK-0335/POST_CR0007_DUAL_MODE_PROTECTION_MAP_AMENDMENT_CANDIDATE.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact current TSK-0335 preparation
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/verify_tsk0335_post_cr0007_preparation_20260831.py
          git diff --check
          test -z "$(git status --porcelain)"
