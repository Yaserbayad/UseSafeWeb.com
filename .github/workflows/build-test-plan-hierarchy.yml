name: Build TEST-001 native issue hierarchy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-hierarchy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      API_VERSION: '2026-03-10'
    steps:
      - name: Create native sub-issue hierarchy and dependencies
        shell: bash
        run: |
          set -euo pipefail

          issue_id() {
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "repos/${REPO}/issues/$1" --jq '.id'
          }

          add_subissue() {
            local parent="$1" child="$2" child_id
            child_id="$(issue_id "$child")"
            echo "Parent #${parent} <- child #${child}"
            if ! gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "repos/${REPO}/issues/${parent}/sub_issues" \
              -f sub_issue_id="$child_id" >/dev/null 2>&1; then
              echo "  already linked or duplicate; continuing"
            fi
          }

          add_blocked_by() {
            local issue="$1" blocker="$2" blocker_id
            blocker_id="$(issue_id "$blocker")"
            echo "Issue #${issue} blocked by #${blocker}"
            if ! gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "repos/${REPO}/issues/${issue}/dependencies/blocked_by" \
              -f issue_id="$blocker_id" >/dev/null 2>&1; then
              echo "  dependency already exists or duplicate; continuing"
            fi
          }

          for child in 2 3 4 5; do add_subissue 1 "$child"; done
          for child in 6 7; do add_subissue 2 "$child"; done
          for child in 8 9 10 11 12; do add_subissue 3 "$child"; done
          for child in 13 14 15 16; do add_subissue 4 "$child"; done
          for child in 17 18; do add_subissue 5 "$child"; done

          add_blocked_by 7 6
          add_blocked_by 8 7
          add_blocked_by 9 8
          add_blocked_by 10 8
          add_blocked_by 11 9
          add_blocked_by 12 9
          add_blocked_by 13 10
          add_blocked_by 14 9
          add_blocked_by 15 11
          add_blocked_by 16 12
          add_blocked_by 17 13
          add_blocked_by 17 14
          add_blocked_by 17 15
          add_blocked_by 17 16
          add_blocked_by 18 17

          echo "Native hierarchy and dependencies configured."
