name: Verify post-CR-0007 TSK-0334 candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0334-post-cr0007-candidate-20260831.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact current-scope HUMAN_ONLY candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/verify_tsk0334_post_cr0007_candidate_20260831.py
          git diff --check
          test -z "$(git status --porcelain)"
