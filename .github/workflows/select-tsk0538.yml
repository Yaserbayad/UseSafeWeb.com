name: Select TSK-0538

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/select-tsk0538.yml'

permissions:
  contents: write

jobs:
  select:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify queue and select TSK-0538
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "5447470b20b8905cd5ecd04b81be6bc425ac0b16"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "dce5b829c4d447eac180ae1e896e0019292cf971"
          test "$(git hash-object TSK_0497_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md)" = "86777b2f00f5283f8ad14413541047095319b0c4"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='')))
          by={r['Task_ID']:r for r in rows}
          t=by['TSK-0538']
          assert [x.strip() for x in t['Dependencies'].split(';') if x.strip()]==['TSK-0484']
          assert t['Lifecycle_Stage']=='L4' and t['Priority']=='MEDIUM'
          assert t['AI_Capability_A0_A4']=='A3' and t['Action_Authority']=='AUTO_ALLOWED'
          acc=t['Acceptance_Criteria']
          for phrase in ['critical user journeys','provisional SLI/SLO targets','alert conditions','recovery objectives','backup scope','restore test','maintenance behavior','escalation ownership']:
              assert phrase in acc, phrase
          q=pathlib.Path('TSK_0497_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md').read_text()
          seg=q.split('### TSK-0538',1)[1]
          assert '- **Preflight flags:** (none)' in seg
          assert '### TSK-0187' in q and 'REAL_OR_BEHAVIOR_EVIDENCE_CHECK' in q
          assert '### TSK-0140' in q and 'OWNER_REVIEW_CHECK' in q
          p=pathlib.Path('CURRENT_STATE.md')
          text=p.read_text()
          assert '### TSK-0497 accepted stable state' in text
          assert 'No next task is selected by this write' in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          pos=text.rfind('\n## Queue status after current reconciliation')
          assert pos>=0
          text=text[:pos].rstrip()+'''\n\n## Queue status after current reconciliation\n\nThe TSK-0497 post-PASS queue was reread against current acceptance, CR-0003 and open security/privacy deviations. `TSK-0187` remains ineligible because it requires representative-parent evidence. `TSK-0140` remains ineligible for PASS because owner/multi-role review evidence is absent. `TSK-0538` is the only dependency-ready AUTO_ALLOWED L4 candidate with no preflight flag.\n\n- **Selected next: `TSK-0538 — Define reliability, observability, recovery, and service-level NFRs`** (L4 / A3 / AUTO_ALLOWED / MEDIUM).\n- Hard dependency: `TSK-0484` — current PASS.\n- ACC-0538: specification defines critical user journeys, provisional SLI/SLO targets, alert conditions, recovery objectives, backup scope, restore test, maintenance behavior, and escalation ownership.\n- Selection boundary: internal reliability/operability NFR definition only. No new monitoring vendor, public SLA, HA/multi-node infrastructure, Azure control-plane mutation, staffed-support promise, implementation/build, participants or launch is authorized.\n\n## Exact next authoritative step\n\nExecute bounded TSK-0538: define the critical user/operational journeys and on-call questions; specify privacy-safe SLIs and provisional SLOs consistent with the accepted approximately-30-minute single-node recovery baseline; define symptom-based alerts, recovery/backup/restore objectives, maintenance behavior, incident severity/escalation ownership and verification; use only aggregate/service-health signals and preserve DNS/query-history prohibitions; persist/read back independent ACC-0538 evidence; reconcile runtime; then recompute.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md
          git commit -m "state: select TSK-0538"
          git push
