name: Audit LG-06 readiness

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-lg06-readiness.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Reconcile active L4 disposition for LG-06
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv,re
          from pathlib import Path
          from collections import Counter
          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          state=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          lines=state.splitlines()
          l4=[(i,r) for i,r in enumerate(rows,1) if (r.get('Lifecycle_Stage') or r.get('Lifecycle') or '').strip()=='L4']
          def heading_blocks(tid):
              out=[]
              for i,l in enumerate(lines):
                  m=re.match(r'^(#{1,6})\s+.*'+re.escape(tid)+r'.*$',l,re.I)
                  if not m: continue
                  level=len(m.group(1)); j=i+1
                  while j<len(lines):
                      h=re.match(r'^(#{1,6})\s+',lines[j])
                      if h and len(h.group(1))<=level: break
                      j+=1
                  out.append('\n'.join(lines[i:j]))
              return out
          def status(tid):
              # Direct same-line status is strongest.
              direct=[]
              for l in lines:
                  if tid in l:
                      direct.append(l)
              txt='\n'.join(direct)
              if re.search(r'(?:\*\*PASS\*\*|:\s*PASS\b|\bPASS\s+under\b)',txt,re.I): return 'PASS_DIRECT'
              if re.search(r'\*\*WAITING|:\s*WAITING\b',txt,re.I): return 'WAITING_DIRECT'
              if re.search(r'\*\*BLOCKED|:\s*BLOCKED\b',txt,re.I): return 'BLOCKED_DIRECT'
              if re.search(r'\*\*TODO|:\s*TODO\b',txt,re.I): return 'TODO_DIRECT'
              # Task-local heading blocks handle accepted historical prose formats.
              blocks=heading_blocks(tid)
              for b in blocks:
                  low=b.lower()
                  if ('accepted' in low or 'acceptance' in low or 'stable state' in low or 'completion' in low or 'final state' in low) and re.search(r'\bPASS\b',b,re.I) and not re.search(r'\b(?:WAITING|BLOCKED|TODO)\b\s*/?\s*non-PASS',b,re.I):
                      return 'PASS_BLOCK'
              return 'UNKNOWN'
          by={r['Task_ID'].strip():r for r in rows if r.get('Task_ID','').strip()}
          statuses={r['Task_ID'].strip():status(r['Task_ID'].strip()) for _,r in l4}
          classes=Counter()
          open_rows=[]
          deferred=[]
          for idx,r in l4:
              tid=r['Task_ID'].strip(); ps=(r.get('Plan_Status') or '').strip(); es=(r.get('Execution_State') or '').strip(); st=statuses[tid]
              if ps=='DEFERRED':
                  classes['DEFERRED_TRIGGER_CLOSED']+=1; deferred.append((idx,r,st)); continue
              if ps=='NOT_APPLICABLE' and es=='PASS': classes['EXCLUDED_PASS']+=1; continue
              if st.startswith('PASS'): classes['RUNTIME_PASS']+=1; continue
              if es=='PASS': classes['FROZEN_WBS_PASS_NO_RUNTIME_CONTRADICTION']+=1; continue
              classes['NEEDS_RECONCILIATION']+=1; open_rows.append((idx,r,st))
          print(f'L4_TOTAL={len(l4)}')
          print('L4_RECONCILED_CLASSES='+repr(classes))
          print(f'L4_DEFERRED_COUNT={len(deferred)}')
          for idx,r,st in deferred:
              print('DEFERRED='+r['Task_ID']+'|'+r['Title']+'|trigger='+r.get('Trigger','')+'|runtime='+st)
          print(f'L4_NEEDS_RECONCILIATION={len(open_rows)}')
          for idx,r,st in open_rows:
              print('---RECONCILE---')
              print(f"Task_ID={r['Task_ID']}")
              print(f"Title={r['Title']}")
              print(f"WBS_ORDER={idx}")
              print(f"Priority={r.get('Priority','')}")
              print(f"Dependencies={r.get('Dependencies','')}")
              print(f"Action_Authority={r.get('Action_Authority','')}")
              print(f"RUNTIME_STATUS={st}")
              print(f"Trigger={r.get('Trigger','')}")
              print(f"Acceptance_Criteria={r.get('Acceptance_Criteria','')}")
          # Print gate-required objective entities with wider context.
          rel=Path('Plans/Master/RELATIONSHIP_INDEX.yaml').read_text(encoding='utf-8').splitlines()
          hits=[i for i,l in enumerate(rel) if 'LG-06' in l and i>0 and 'required_for_gate' in rel[i+1] if i+1<len(rel)]
          print(f'LG06_REQUIRED_FOR_GATE_HITS={len(hits)}')
          for i in hits:
              print(f'---LG06_CONTEXT_{i+1}---')
              for j in range(max(0,i-10),min(len(rel),i+3)):
                  print(f'{j+1}:{rel[j]}')
          print('LG06_RECONCILIATION_AUDIT=PASS')
          PY
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
