name: TEMP TSK-0489 post-close state sync

on:
  push:
    branches:
      - cleanup/tsk0489-postclose-main-reds-20260904
    paths:
      - .github/workflows/tmp-tsk0489-postclose-state-sync.yml

permissions:
  contents: write

concurrency:
  group: tsk0489-postclose-state-sync-source-branch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/tsk0489-postclose-main-reds-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Apply guarded checkpoint patch and remove transport
        shell: bash
        run: |
          set -Eeuo pipefail
          branch='cleanup/tsk0489-postclose-main-reds-20260904'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/$branch:refs/remotes/origin/$branch"
          test "$(git rev-parse origin/main)" = '9bbc3984167d2c33c2eb6649acfb841a2fcc2f78'
          test "$(git rev-parse origin/$branch)" = "$GITHUB_SHA"
          test ! -e .github/workflows/inspect-post-lg06-l5-frontier-20260901.yml
          test ! -e .github/workflows/verify-tsk0052-lg06-current-review-20260901.yml
          test -e .github/workflow-archive/tsk0489-postclose/inspect-post-lg06-l5-frontier-20260901.yml
          test -e .github/workflow-archive/tsk0489-postclose/verify-tsk0052-lg06-current-review-20260901.yml
          cp .github/scripts/tmp_tsk0489_postclose_state_patch.py /tmp/state_patch.py
          python3 /tmp/state_patch.py
          rm .github/scripts/tmp_tsk0489_postclose_state_patch.py
          rm .github/workflows/tmp-tsk0489-postclose-state-sync.yml
          test ! -e .github/scripts/tmp_tsk0489_postclose_state_patch.py
          test ! -e .github/workflows/tmp-tsk0489-postclose-state-sync.yml
          grep -Fq '`TSK-0489` is **durable PASS**.' CURRENT_STATE.md
          grep -Fq '`TSK-0243` remains `TODO`.' CURRENT_STATE.md
          git add CURRENT_STATE.md .github/scripts/tmp_tsk0489_postclose_state_patch.py .github/workflows/tmp-tsk0489-postclose-state-sync.yml
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse origin/main)" = '9bbc3984167d2c33c2eb6649acfb841a2fcc2f78'
          git config user.name 'UseSafeWeb governed automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'docs: finalize TSK-0489 post-close checkpoint hygiene'
          mapfile -t final_changed < <(git diff --no-renames --name-only origin/main...HEAD)
          printf 'TSK0489_POSTCLOSE_CHANGED=%s\n' "${final_changed[@]}"
          test "${#final_changed[@]}" -eq 6
          expected=(
            '.github/workflow-archive/tsk0489-postclose/inspect-post-lg06-l5-frontier-20260901.yml'
            '.github/workflow-archive/tsk0489-postclose/verify-tsk0052-lg06-current-review-20260901.yml'
            '.github/workflows/inspect-post-lg06-l5-frontier-20260901.yml'
            '.github/workflows/verify-tsk0052-lg06-current-review-20260901.yml'
            'CURRENT_STATE.md'
            'TSK_0489_GOVERNED_CI_PROMOTION_EVIDENCE_2026-09-04.md'
          )
          for p in "${expected[@]}"; do printf '%s\n' "${final_changed[@]}" | grep -Fxq "$p"; done
          git diff --check origin/main...HEAD
          final_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$branch"
          echo "TSK0489_POSTCLOSE_FINAL_HEAD=$final_sha"
          echo 'TSK0489_POSTCLOSE_FINAL_DIFF=EXACTLY_SIX_FILES'
          echo 'TSK0489_POSTCLOSE_MAIN_MUTATION=NONE'
          echo 'TSK0489_POSTCLOSE_TEMP_TRANSPORT_IN_FINAL_TREE=NO'
