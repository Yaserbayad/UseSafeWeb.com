name: Apply CR-0005 integrated-product-first validation sequence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-cr0005-human-validation-resequence.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-governance-state
  cancel-in-progress: false

jobs:
  amend:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Apply, rebuild, validate, and publish CR-0005
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          python3 .github/scripts/apply_cr0005.py | tee /tmp/cr0005-validation.log
          grep -qx 'CR0005_AMENDMENT_VALIDATION=PASS' /tmp/cr0005-validation.log
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'CR0005_CHANGED_PATH=%s\n' "${changed[@]}"
          allowed='^(Plans/SHA256SUMS\.txt|Plans/Master/(MANIFEST\.yaml|Generated/MASTER_PLAN_FULL\.md|Governance/CURRENT_STATE_INTERFACE\.md|Layers/LAYER_[145]_.+\.md|Registers/(VERIFICATION_EVIDENCE_ACCEPTANCE|DECISIONS_TRIGGERS|EXCEPTIONS_CHANGE_CONTROLS|GATES|CONSTRAINTS|RISKS|LIFECYCLE_OBLIGATIONS)\.md|WBS/master-wbs\.csv))$'
          for f in "${changed[@]}"; do
            [[ "$f" =~ $allowed ]] || { echo "Unexpected changed path: $f" >&2; exit 1; }
          done
          [[ ${#changed[@]} -eq 13 ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Plans
          git commit -m 'plan: adopt integrated-product-first validation sequence'
          git push origin HEAD:main
          echo 'CR0005_CANONICAL_PUBLICATION=PASS'
