name: Apply CR-0005 integrated-product-first validation sequence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-cr0005-human-validation-resequence.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-governance-state
  cancel-in-progress: false

jobs:
  amend:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Apply, rebuild, validate, and publish CR-0005
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/apply_cr0005.py')
          s=p.read_text(encoding='utf-8')
          bad1="    r['Next_Action'] = 'No execution. Preserve as excluded historical pre-product validation work; use the L8 controlled integrated-product pilot for actual human/user validation.'\n"
          old2="assert 'real-user comprehension claim is required' not in fb['TSK-0309']['Acceptance_Criteria'].lower()"
          new2="assert 'no real-user comprehension claim is required or inferred before l8.' in fb['TSK-0309']['Acceptance_Criteria'].lower()"
          old3="assert 'first real-user validation' in read(gates).lower()"
          new3="assert 'first active parent/user/participant validation stage' in read(gates).lower()"
          if any(s.count(x) != 1 for x in (bad1,old2,old3)):
              raise SystemExit('CR0005_HELPER_PATCH_PRECONDITION=FAIL')
          s=s.replace(bad1,'',1).replace(old2,new2,1).replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          print('CR0005_HELPER_PATCH=PASS')
          PY
          python3 .github/scripts/apply_cr0005.py | tee /tmp/cr0005-validation.log
          grep -qx 'CR0005_AMENDMENT_VALIDATION=PASS' /tmp/cr0005-validation.log
          git checkout -- .github/scripts/apply_cr0005.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'CR0005_CHANGED_PATH=%s\n' "${changed[@]}"
          allowed='^(Plans/SHA256SUMS\.txt|Plans/Master/(MANIFEST\.yaml|Generated/MASTER_PLAN_FULL\.md|Governance/CURRENT_STATE_INTERFACE\.md|Layers/LAYER_[145]_.+\.md|Registers/(VERIFICATION_EVIDENCE_ACCEPTANCE|DECISIONS_TRIGGERS|EXCEPTIONS_CHANGE_CONTROLS|GATES|CONSTRAINTS|RISKS|LIFECYCLE_OBLIGATIONS)\.md|WBS/master-wbs\.csv))$'
          for f in "${changed[@]}"; do
            [[ "$f" =~ $allowed ]] || { echo "Unexpected changed path: $f" >&2; exit 1; }
          done
          [[ ${#changed[@]} -eq 15 ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Plans
          git commit -m 'plan: adopt integrated-product-first validation sequence'
          git push origin HEAD:main
          echo 'CR0005_CANONICAL_PUBLICATION=PASS'
