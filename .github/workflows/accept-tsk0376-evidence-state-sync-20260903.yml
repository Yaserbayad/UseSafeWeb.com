name: TSK-0376 evidence and runtime-state publication guard

on:
  push:
    branches:
      - state/tsk-0376-evidence-pass-20260903
  pull_request:
    paths:
      - 'CURRENT_STATE.md'
      - 'TSK_0376_ACCOUNTLESS_STATE_MACHINE_ACCEPTANCE_2026-09-03.md'
      - '.github/workflows/accept-tsk0376-evidence-state-sync-20260903.yml'

permissions:
  contents: read

env:
  CANONICAL_IMPL_HEAD: ce48a5f5fd754e95775a7fab571dba1b2d65ee81
  PRE_STATE_BLOB: 7e8230993f5a3fa487857754d095a8f9598b36b5
  EVIDENCE_FILE: TSK_0376_ACCOUNTLESS_STATE_MACHINE_ACCEPTANCE_2026-09-03.md

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      needs_sync: ${{ steps.state.outputs.needs_sync }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - id: state
        name: Verify publication shape and determine whether synchronization is required
        shell: bash
        run: |
          set -euo pipefail
          state_blob="$(git hash-object CURRENT_STATE.md)"
          if [ "$state_blob" = "$PRE_STATE_BLOB" ]; then
            test "${{ github.event_name }}" = 'push'
            grep -Fq '**Result:** __RESULT__' "$EVIDENCE_FILE"
            grep -Fq '__SYNC_RUN_ID__' "$EVIDENCE_FILE"
            grep -Fq '__SYNC_TIMESTAMP__' "$EVIDENCE_FILE"
            if grep -Fq '## TSK-0376 current accepted stable state' CURRENT_STATE.md; then
              echo 'unexpected pre-existing TSK-0376 runtime section' >&2
              exit 1
            fi
            echo 'needs_sync=true' >> "$GITHUB_OUTPUT"
          else
            grep -Fq '**Result:** PASS — ACC-0376 fully evidenced; runtime publication guard passed.' "$EVIDENCE_FILE"
            if grep -Eq '__RESULT__|__SYNC_RUN_ID__|__SYNC_TIMESTAMP__' "$EVIDENCE_FILE"; then
              echo 'unresolved evidence placeholder' >&2
              exit 1
            fi
            test "$(grep -Fc '## TSK-0376 current accepted stable state — PASS' CURRENT_STATE.md)" = '1'
            grep -Fq 'Runtime state: **PASS**.' CURRENT_STATE.md
            grep -Fq 'EVD-0376' CURRENT_STATE.md
            echo 'needs_sync=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify immutable TSK-0376 authority and accepted artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object website/package-lock.json)" = '14f9a62607489f965b96d98cdf0d825a363cd8bc'
          test "$(git hash-object website/src/lib/core-state-machine.ts)" = '8bebd5f429cdaf03c416c9c64e93fc7ed804ee6a'
          test "$(git hash-object website/src/lib/journey-state.ts)" = '9f7a9dcf4a18e001869350d956c68bd5fc492632'
          test "$(git hash-object website/src/components/dns-verification-panel.tsx)" = '6eeba1ff230ba672a8bf053fa2500a10227e4d91'
          test "$(git hash-object website/tests/contract/tsk0376.test.mjs)" = '2c83ae1bfecf59545518b383e6cdb323749a8847'
          test "$(git hash-object .github/workflows/accept-tsk0376-accountless-state-machine-20260903.yml)" = '7297bcd05032da3c388da66daac38dc27a6c4e5a'
          grep -Fq '33730514968' "$EVIDENCE_FILE"
          grep -Fq '33730835303' "$EVIDENCE_FILE"
          grep -Fq 'ACC-0376' "$EVIDENCE_FILE"
          grep -Fq 'VER-0376' "$EVIDENCE_FILE"
          grep -Fq 'EVD-0376' "$EVIDENCE_FILE"

      - name: Verify synchronized CURRENT_STATE byte preservation
        if: steps.state.outputs.needs_sync == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$CANONICAL_IMPL_HEAD^{commit}" || git fetch --no-tags --depth=1 origin "$CANONICAL_IMPL_HEAD"
          git show "$CANONICAL_IMPL_HEAD:CURRENT_STATE.md" > /tmp/tsk0376-pre-state.md
          test "$(git hash-object /tmp/tsk0376-pre-state.md)" = "$PRE_STATE_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          import re

          old = Path('/tmp/tsk0376-pre-state.md').read_bytes()
          new = Path('CURRENT_STATE.md').read_bytes()
          stamp = re.compile(rb'\*\*Updated:\*\* [^\n]+\n')
          old_match = stamp.search(old)
          new_match = stamp.search(new)
          assert old_match and new_match
          old_normalized = old[:old_match.start()] + b'**Updated:** <STAMP>\n' + old[old_match.end():]
          new_normalized = new[:new_match.start()] + b'**Updated:** <STAMP>\n' + new[new_match.end():]
          assert new_normalized.startswith(old_normalized)
          suffix = new_normalized[len(old_normalized):]
          assert suffix.startswith(b'\n## TSK-0376 current accepted stable state') or suffix.startswith(b'\n\n## TSK-0376 current accepted stable state')
          assert suffix.count(b'## TSK-0376 current accepted stable state') == 1
          PY

      - name: Run applicable repository and TSK-0376 acceptance guards
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          cd website
          npm ci --no-fund --no-audit
          node --test tests/contract/tsk0376.test.mjs
          npm run test:contract
          npm run lint
          npm run typecheck
          NEXT_TELEMETRY_DISABLED=1 npm run build
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          cd ..
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'TSK0376_EVIDENCE_STATE_GUARD=PASS'

  synchronize:
    if: github.event_name == 'push' && needs.guard.outputs.needs_sync == 'true'
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5
      - name: Publish EVD-0376 and minimal guarded CURRENT_STATE synchronization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = "$PRE_STATE_BLOB"
          test "$(grep -Fc '## TSK-0376 current accepted stable state' CURRENT_STATE.md)" = '0'
          sync_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export SYNC_TIMESTAMP="$sync_timestamp"
          export SYNC_RUN_ID="${GITHUB_RUN_ID}"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          evidence_path = Path(os.environ['EVIDENCE_FILE'])
          evidence = evidence_path.read_text(encoding='utf-8')
          assert evidence.count('__RESULT__') == 1
          assert evidence.count('__SYNC_RUN_ID__') == 1
          assert evidence.count('__SYNC_TIMESTAMP__') == 1
          evidence = evidence.replace('__RESULT__', 'PASS — ACC-0376 fully evidenced; runtime publication guard passed.')
          evidence = evidence.replace('__SYNC_RUN_ID__', os.environ['SYNC_RUN_ID'])
          evidence = evidence.replace('__SYNC_TIMESTAMP__', os.environ['SYNC_TIMESTAMP'])
          evidence_path.write_text(evidence, encoding='utf-8')
          evidence_blob = subprocess.check_output(['git', 'hash-object', str(evidence_path)], text=True).strip()

          state_path = Path('CURRENT_STATE.md')
          old = state_path.read_bytes()
          stamp = re.compile(rb'\*\*Updated:\*\* [^\n]+\n')
          assert len(stamp.findall(old)) == 1
          updated = stamp.sub(f"**Updated:** {os.environ['SYNC_TIMESTAMP']}\n".encode(), old, count=1)
          assert b'## TSK-0376 current accepted stable state' not in old

          section = f'''## TSK-0376 current accepted stable state — PASS (2026-09-03)

- Runtime state: **PASS**.
- Acceptance authority: `ACC-0376` / `VER-0376` / `EVD-0376` — all state transitions defined/tested; illegal transitions rejected; parent-confirmed and technically verified evidence remain separate; resume/retry is deterministic and does not duplicate completed work.
- Canonical implementation: PR `#78`; accepted feature head `b423c0304354b22b3151e1660f3e06299ff11f0a`; canonical merge `ce48a5f5fd754e95775a7fab571dba1b2d65ee81`.
- Direct acceptance: feature run/job `33730514968` / `100569122644` **PASS**; clean-main run/job `33730835303` / `100570144399` **PASS**; focused contract 6/6 and complete current website contract suite 74/74.
- `EVD-0376`: `TSK_0376_ACCOUNTLESS_STATE_MACHINE_ACCEPTANCE_2026-09-03.md` @ blob `{evidence_blob}`.
- Guarded evidence/runtime publication: run `{os.environ['SYNC_RUN_ID']}` from exact pre-mutation `CURRENT_STATE.md` blob `7e8230993f5a3fa487857754d095a8f9598b36b5`; only the top `Updated` timestamp and this appended TSK-0376 stable-state section are permitted runtime-state changes.
- Journey-0 remains accountless/session-scoped with fixed 24-hour hard expiry, exact-key validation, safe malformed/expired restart, bounded verification retry, and no retained browsing/query/domain/hostname/raw-DNS history.
- Preserved fences: no deployment, profile distribution, participant processing, runtime/market activation, or downstream lifecycle-gate activation is created or inferred by this PASS.

### Queue effect

- Current successors may consume TSK-0376 only after this exact evidence/runtime publication is merged to canonical `main` and independently read-back verified; no downstream task or gate PASS is inferred.
'''.encode()

          separator = b'\n' if updated.endswith(b'\n') else b'\n\n'
          new = updated + separator + section
          assert new.count(b'## TSK-0376 current accepted stable state') == 1

          old_match = stamp.search(old)
          new_match = stamp.search(new)
          assert old_match and new_match
          old_normalized = old[:old_match.start()] + b'**Updated:** <STAMP>\n' + old[old_match.end():]
          new_normalized = new[:new_match.start()] + b'**Updated:** <STAMP>\n' + new[new_match.end():]
          assert new_normalized.startswith(old_normalized)
          assert new_normalized[len(old_normalized):] == separator + section
          state_path.write_bytes(new)
          PY
          if grep -Eq '__RESULT__|__SYNC_RUN_ID__|__SYNC_TIMESTAMP__' "$EVIDENCE_FILE"; then
            echo 'unresolved publication placeholder after synchronization' >&2
            exit 1
          fi
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' CURRENT_STATE.md "$EVIDENCE_FILE" | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md "$EVIDENCE_FILE"
          git commit -m 'TSK-0376: publish acceptance evidence and runtime PASS'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'TSK0376_EVIDENCE_STATE_SYNC=PASS'
