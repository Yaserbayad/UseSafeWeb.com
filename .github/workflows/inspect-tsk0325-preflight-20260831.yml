name: Inspect TSK-0325 preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tsk0325-preflight-20260831.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect TSK-0325 predecessor applicability
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/inspect_tsk0325_preflight_20260831.py
          git diff --check
          test -z "$(git status --porcelain)"
