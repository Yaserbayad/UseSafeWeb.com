name: Verify and accept current TSK-0355 architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-accept-tsk-0355-current-20260901.yml'

permissions:
  contents: write

concurrency:
  group: usesafeweb-tsk-0355-current-acceptance
  cancel-in-progress: false

jobs:
  verify-accept:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify current TSK-0355 authority, dependency, sources, and ADRs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import subprocess
          from pathlib import Path

          wbs = Path('Plans/Master/WBS/master-wbs.csv')
          with wbs.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          row = next(r for r in rows if (r.get('Task_ID') or '').strip() == 'TSK-0355')
          assert (row.get('Lifecycle_Stage') or '').strip() == 'L5'
          assert (row.get('Plan_Status') or '').strip() == 'PLANNED'
          assert (row.get('Dependencies') or '').strip() == 'TSK-0235'
          assert (row.get('AI_Capability_A0_A4') or '').strip() == 'A3'
          assert (row.get('Action_Authority') or '').strip() == 'AUTO_ALLOWED'
          assert (row.get('Risk_Reference') or '').strip() == 'RSK-0045'
          assert (row.get('Interface_Reference') or '').strip() == 'INT-0011; INT-0012'
          assert (row.get('Requirement_Reference') or '').strip() == 'REQ-0036; REQ-0037; REQ-0039; CON-0010; CON-0011'
          assert (row.get('Acceptance_ID') or '').strip() == 'ACC-0355'
          assert (row.get('Verification_ID') or '').strip() == 'VER-0355'
          assert (row.get('Evidence_ID') or '').strip() == 'EVD-0355'
          expected_acc = 'ADRs fix framework/deployment/runtime boundaries, anonymous ephemeral state, minimum persistent account/device ownership store required by Version 1, authentication/session pattern, server-only AdGuard adapter, observability, backups/deletion/recovery, and explicit non-goals. Persistent data is limited to the approved account/device purpose; no browsing/activity history is introduced.'
          assert (row.get('Acceptance_Criteria') or '').strip() == expected_acc

          state = Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          assert '## TSK-0235 current accepted stable state — 2026-09-01' in state
          assert '## TSK-0052 / LG-06 current accepted stable state' in state
          assert '## TSK-0355 current accepted stable state' not in state

          expected_hashes = {
              'Plans/Master/WBS/master-wbs.csv': 'b27a0c5df2f5636d8ed71051e9e26a68959a2616',
              'TSK_0354_VERSION_1_APPLICATION_ARCHITECTURE_2026-09-01.md': '4196c83e95a013c10b5c0a9a13005b97bbe08a59',
              'TSK_0235_SYSTEM_CONTEXT_CONTAINER_INTEGRATION_DIAGRAMS_2026-09-01.md': 'ecac82c1e020977a50af1d02345091415afba4ce',
              'infrastructure/adguard-server/tsk-0413-bundle-v1/README.md': '5a162a87dd2761ff5a0da587fa660549309a1404',
              'infrastructure/adguard-server/tsk-0413-bundle-v1/AdGuardHome.public-fragment.yaml': '867ef7162c739106fa42af151cda145f6d16888e',
              'TSK_0355_MINIMUM_TYPESCRIPT_NEXTJS_APPLICATION_ARCHITECTURE_ADRS_2026-09-01.md': 'e9efc3b498040cc7e3cdd42a912359e41250d068',
          }
          for path, expected in expected_hashes.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == expected, f'{path}: {actual} != {expected}'

          assert not Path('website/package.json').exists(), 'package.json now exists; version claim must be re-evaluated'

          art = Path('TSK_0355_MINIMUM_TYPESCRIPT_NEXTJS_APPLICATION_ARCHITECTURE_ADRS_2026-09-01.md').read_text(encoding='utf-8')
          required = (
              'one TypeScript + Next.js App Router full-stack application under `/website`',
              'Next.js **16.3.4 current-reference baseline**',
              'Node.js must be a maintained supported release satisfying Next.js\'s documented `>=20.9` minimum',
              "`output: 'standalone'`",
              'Reverse proxy terminates/controls the public HTTP boundary',
              'Server Components are the default',
              'State-changing integration endpoints are bounded Route Handlers',
              'J0 — browser/session-only accountless state',
              'J1 — optional anonymous transient server state',
              'A — optional persistent account/device domain',
              'server-managed application session',
              '`HttpOnly`, `Secure` server-managed session cookie',
              'server-side parent-to-device authorization',
              'typed, allowlisted adapter',
              'AdGuard Home `v0.107.79`, configuration schema `34`',
              'https://dns10.quad9.net/dns-query',
              'ECS disabled',
              'persistent query/file logging disabled',
              '24-hour retention',
              'client-IP anonymization enabled',
              '`127.0.0.1:3000`',
              'no generic browser-visible proxy to AdGuard `/control/*` endpoints',
              'Observability without surveillance',
              'Backup, deletion, and recovery boundaries',
              'Explicit non-goals',
              '`RSK-0045` remains **OPEN',
              'INT-0011',
              'INT-0012',
              'REQ-0036',
              'REQ-0037',
              'REQ-0039',
              'CON-0010',
              'CON-0011',
              'no browsing/activity history',
              'No implementation, build, deployment, LG-07/LG-08, production activation, launch, payment, or real-user validation PASS is inferred',
              'https://nextjs.org/docs/app/guides/self-hosting',
              'https://nextjs.org/docs/app/getting-started/installation',
              'https://nextjs.org/docs/app/guides/environment-variables',
              'https://nextjs.org/docs/app/getting-started/server-and-client-components',
              'https://nextjs.org/docs/app/getting-started/route-handlers',
              'https://nextjs.org/docs/app/api-reference/config/next-config-js/output',
              'https://firebase.google.com/docs/auth/admin/manage-cookies',
          )
          missing = [x for x in required if x not in art]
          assert not missing, 'ADR missing: ' + '; '.join(missing)
          assert art.count('| SATISFIED') >= 17, 'acceptance/authority trace incomplete'
          for forbidden in ('-----BEGIN PRIVATE KEY-----', '-----BEGIN CERTIFICATE-----', 'password=', 'sessionCookie='):
              assert forbidden not in art
          print('TSK0355_CURRENT_CONTRACT_ADR=PASS')
          PY
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --check HEAD^ HEAD
          test -z "$(git status --porcelain)"

      - name: Persist TSK-0355 current PASS with stale-write and remote read-back
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          ART='TSK_0355_MINIMUM_TYPESCRIPT_NEXTJS_APPLICATION_ARCHITECTURE_ADRS_2026-09-01.md'
          ART_BLOB="$(git hash-object "$ART")"
          test "$ART_BLOB" = 'e9efc3b498040cc7e3cdd42a912359e41250d068'
          export SOURCE_COMMIT RUN_ID RUN_ATTEMPT ART_BLOB
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('CURRENT_STATE.md')
          text = path.read_text(encoding='utf-8')
          heading = '## TSK-0355 current accepted stable state — 2026-09-01'
          assert heading not in text, 'TSK-0355 current state appeared after verification source read; reconcile instead of duplicating'
          section = f'''{heading}

`TSK-0355 — Validate and record the minimum owner-selected TypeScript + Next.js application architecture`: **PASS** under current `ACC-0355 / VER-0355 / EVD-0355`, current `TSK-0235` dependency evidence, current `LG-06` PASS, and `DEC-0055/CR-0008` proportional-evidence authority.

- Action authority: **A3 / AUTO_ALLOWED**.
- Artifact: `TSK_0355_MINIMUM_TYPESCRIPT_NEXTJS_APPLICATION_ARCHITECTURE_ADRS_2026-09-01.md`, version `1.0.0`, blob `{os.environ['ART_BLOB']}`, acceptance source commit `{os.environ['SOURCE_COMMIT']}`.
- Verification: ChatGPT Project Governor architecture review plus GitHub Actions run/attempt `{os.environ['RUN_ID']} / {os.environ['RUN_ATTEMPT']}`; exact WBS/ACC/VER/EVD, TSK-0235/LG-06 current state, current frozen source blobs, master-plan validity, source diff, no-package version truth, required ADR clauses and prohibited secret material were checked before this mutation.
- Framework/runtime boundary: one `/website` TypeScript + Next.js App Router application, current-reference Next.js 16.3.4 architecture, Node.js runtime with exact supported version pinned at implementation, self-hosted behind a reverse proxy, and a standalone direct-host release/rollback boundary. No installed dependency version is fabricated while `/website/package.json` is absent.
- Data/auth boundary: J0 browser state plus only optional anonymous bounded J1; separate server-only minimum parent/device persistent domain; optional Google/Firebase identity terminates in a server-validated secure session; core value remains usable without login.
- TSK-0413 boundary: server-only typed AdGuard adapter; AdGuard Home v0.107.79/schema 34; exact Quad9 dns10 DoH; ECS off; persistent query/file logging off; client-IP anonymization on; 24-hour anonymized aggregate statistics only; loopback-only authenticated administration; no browser admin credentials and no browsing/query/activity history.
- `RSK-0045` remains OPEN as a scope/privacy control. Datastore product/schema, final Firebase vendor/version/terms, CMS/component-library product, exact private cross-VM AdGuard control transport, secret-provider implementation and an actual L6 release remain downstream and are not invented.
- **Non-inference:** no website implementation/build, LG-07/LG-08, production deployment/activation, launch, payment, or real-user validation PASS is inferred.
'''
          path.write_text(text.rstrip() + '\n\n' + section.strip() + '\n', encoding='utf-8')
          PY
          git diff --check
          changed="$(git status --porcelain | sed 's/^...//')"
          test "$changed" = 'CURRENT_STATE.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0355 current application architecture'
          STATE_COMMIT="$(git rev-parse HEAD)"
          STATE_BLOB="$(git rev-parse "$STATE_COMMIT:CURRENT_STATE.md")"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$STATE_COMMIT"
          test "$(git rev-parse "origin/main:CURRENT_STATE.md")" = "$STATE_BLOB"
          git show "origin/main:CURRENT_STATE.md" | grep -F '## TSK-0355 current accepted stable state — 2026-09-01'
          git show "origin/main:CURRENT_STATE.md" | grep -F 'TSK-0355 — Validate and record the minimum owner-selected TypeScript + Next.js application architecture'
          echo "TSK0355_STATE_COMMIT=$STATE_COMMIT"
          echo "TSK0355_STATE_BLOB=$STATE_BLOB"
          echo 'TSK0355_ACCEPTANCE_REMOTE_READBACK=PASS'
