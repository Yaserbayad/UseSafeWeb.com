name: Verify TSK-0046 current revalidation v2

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0046-current-verifier-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Independently verify TSK-0046 structurally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, re, subprocess
          from pathlib import Path

          EXPECTED={
            'Plans/Master/WBS/master-wbs.csv':'b27a0c5df2f5636d8ed71051e9e26a68959a2616',
            'Plans/Master/RELATIONSHIP_INDEX.yaml':'c108d2c162bcea2ee4cc01def46d0487a9501032',
            'CURRENT_STATE.md':'b0e320a862eaf83b3fea11e565b42621608578eb',
            'TSK_0046_POST_CR0008_DUAL_MODE_PERFORMANCE_CAPACITY_NFR_REVALIDATION_2026-09-02.md':'8e72d542b68de6f7f5c8c375b63b6229c6d15529',
            'TSK_0046_PERFORMANCE_CAPACITY_NFR_2026-08-28.md':'2c48f975d557b1bb4ba6c58c2a8ad3580b2c7b06',
            'TSK_0046_PERFORMANCE_CAPACITY_NFR_EVIDENCE_2026-08-28.md':'09d111530c5e9c86feb2cafb54f62fb046a44b6f',
            'TSK_0538_POST_CR0008_DUAL_MODE_RELIABILITY_OBSERVABILITY_NFR_REVALIDATION_2026-09-02.md':'44c9c299465e821e2ffd84a54b77e3e615d61925',
            'TSK_0538_POST_CR0008_CURRENT_REVALIDATION_EVIDENCE_2026-09-02.md':'3ba04601ea5574fcd1fb1f58f95922ae94b74ac2',
          }
          def blob(p): return subprocess.check_output(['git','hash-object',p],text=True).strip()
          for p,sha in EXPECTED.items():
              assert Path(p).exists(), f'missing {p}'
              assert blob(p)==sha, f'hash drift {p}'
          print('TSK0046_V2_INPUT_HASHES=PASS')

          with open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          row=next(r for r in rows if r.get('Task_ID')=='TSK-0046')
          assert row['Lifecycle_Stage']=='L4' and row['Priority']=='MEDIUM'
          assert row['AI_Capability_A0_A4']=='A3' and row['Action_Authority']=='AUTO_ALLOWED'
          assert [d.strip() for d in row['Dependencies'].split(';') if d.strip()]==['TSK-0538']
          assert (row['Acceptance_ID'],row['Verification_ID'],row['Evidence_ID'])==('ACC-0046','VER-0046','EVD-0046')
          acc=row['Acceptance_Criteria'].lower()
          for group in [('expected','load'),('safety','margin'),('dns','latency','availability'),('web','performance'),('degradation','behavior'),('capacity','review','trigger')]:
              assert all(x in acc for x in group), group
          print('TSK0046_V2_WBS=PASS')

          runtime=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          task_sections={}
          for m in re.finditer(r'^(##|###) (TSK-\d{4})\b.*?(?=^(?:##|###) |\Z)',runtime,re.M|re.S):
              task_sections.setdefault(m.group(2),[]).append(m.group(0))
          assert any('**PASS' in s and 'current accepted' in s.splitlines()[0].lower() for s in task_sections.get('TSK-0538',[]))
          print('TSK0046_V2_PREDECESSOR=PASS')

          doc=Path('TSK_0046_POST_CR0008_DUAL_MODE_PERFORMANCE_CAPACITY_NFR_REVALIDATION_2026-09-02.md').read_text(encoding='utf-8')
          low=doc.lower()
          def section(n,next_n=None):
              end=rf'(?=\n## {next_n}\.)' if next_n is not None else r'\Z'
              m=re.search(rf'## {n}\.[^\n]*\n(.*?){end}',doc,re.S)
              assert m, f'missing section {n}'
              return m.group(1).lower()

          # Required current-scope mapping.
          s4=section(4,5)
          assert all(x in s4 for x in ['lg-09','0 real-user devices','unfrozen','n_dns_active_peak','q_dns_expected','r_accountless_peak','r_session_peak','r_dashboard_peak','r_mutation_peak','c_account_peak'])
          print('TSK0046_V2_LOAD_SCOPE=PASS')

          # Safety margin and DNS method: require concepts, not exact prose order.
          s5=section(5,6); s6=section(6,7)
          assert '2×' in s5 and 'expected' in s5 and 'hard control' in s5
          assert all(x in s6 for x in ['doh','dot','tls','synthetic','p50/p95/p99','rate-limit'])
          assert 'allow' in s6 and 'block' in s6 and 'correctness' in s6
          print('TSK0046_V2_MARGIN_DNS=PASS')

          # Dual-mode web performance and current reliability linkage.
          s7=section(7,8)
          assert all(x in s7 for x in ['accountless core journey','optional-account journey','cross-parent','provider/datastore','ambiguous consequential mutations','p50/p95/p99'])
          assert 'technical protection verification' in s7
          assert all(x in low for x in ['>=99.9%','p95 `<=1.0s`','p99 `<=2.0s`','authorization isolation','accountless fallback'])
          print('TSK0046_V2_DUAL_MODE_PERFORMANCE=PASS')

          # Current external browser-performance contract.
          s8=section(8,9)
          assert all(x in s8 for x in ['web.dev/articles/vitals','web.dev/articles/defining-core-web-vitals-thresholds','web.dev/articles/vitals-spa-faq','lcp `<=2.5s`','inp `<=200ms`','cls `<=0.1`','75th percentile','soft-navigation'])
          assert 'synthetic/lab results do not prove field p75' in s8
          print('TSK0046_V2_WEB_PERF=PASS')

          # Capacity-review and degradation semantics.
          s9=section(9,10); s10=section(10,11)
          assert len(re.findall(r'^\d+\.',s9,re.M))>=12
          assert all(x in s9 for x in ['cpu','memory','p95/p99','provider/datastore','2× margin','accountless'])
          assert all(x in s10 for x in ['encrypted-dns correctness','account-only authority fails closed','dns/query/activity-history','/control','supported/ramped load'])
          print('TSK0046_V2_TRIGGERS_DEGRADATION=PASS')

          # Historical/current reconciliation: old pilot sequencing is provenance, not current authority.
          hist=Path('TSK_0046_PERFORMANCE_CAPACITY_NFR_2026-08-28.md').read_text(encoding='utf-8').lower()
          assert 'cr-0003' in hist and 'pilot' in hist
          assert 'cr-0003 remains active' not in low
          assert 'no separate mandatory pilot/staging lifecycle is reintroduced' in low
          assert 'live-production' in low and 'optional parent' in low and 'complete accountless core' in low
          print('TSK0046_V2_RECONCILIATION=PASS')

          # Non-inference and no unsafe capacity shortcut.
          s15=section(15,None)
          for concept in ['live-production activation','real-user cohort/load','production stress testing','infrastructure resize/ha/new paid monitoring','web/app/account/auth implementation','legal/privacy completion','successor pass']:
              assert concept in s15, concept
          for unsafe in ['disable rate limiting to improve','enable query logging to improve','mandatory login for core value']:
              assert unsafe not in low
          print('TSK0046_V2_NON_INFERENCE=PASS')

          print('TSK0046_CURRENT_ACC=PASS')
          print('TSK0046_CURRENT_VER=PASS')
          print('TSK0046_CURRENT_EVD_READY=PASS')
          print('TSK0046_CURRENT_REVALIDATION=PASS')
          PY
