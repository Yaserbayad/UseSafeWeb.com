name: Verify TSK-0335 acceptance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-tsk0335-acceptance.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify approved TSK-0335 candidate and evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          test "$(git rev-parse HEAD:Plans/Master/WBS/master-wbs.csv)" = "f23b4f017d1baf73258fa30ecd71549bbfe1b815"
          test "$(git rev-parse HEAD:design/TSK-0335/PROTECTION_MAP_COVERAGE_LIMIT_INTERACTIONS_CANDIDATE.md)" = "7c65a697a98961d0df278658e59262ce39874ff5"
          test "$(git rev-parse HEAD:TSK_0335_PROTECTION_MAP_COVERAGE_LIMIT_INTERACTIONS_PREPARATION_EVIDENCE_2026-08-30.md)" = "27fd622b84351c2eb6690167f7d6dd59b9dd5549"
          test "$(git rev-parse HEAD:TSK_0335_PROTECTION_MAP_COVERAGE_LIMIT_INTERACTIONS_ACCEPTANCE_EVIDENCE_2026-08-30.md)" = "9bc0941af75e6987f0acbb9298a856e7beb090e2"
          python3 - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          r=next(x for x in rows if x['Task_ID'].strip()=='TSK-0335')
          assert r['Dependencies'].strip()=='TSK-0330'
          assert r['Action_Authority'].strip()=='HUMAN_ONLY'
          ev=Path('TSK_0335_PROTECTION_MAP_COVERAGE_LIMIT_INTERACTIONS_ACCEPTANCE_EVIDENCE_2026-08-30.md').read_text(encoding='utf-8')
          cand=Path('design/TSK-0335/PROTECTION_MAP_COVERAGE_LIMIT_INTERACTIONS_CANDIDATE.md').read_text(encoding='utf-8')
          assert 'APPROVE TSK-0335 PROTECTION MAP COVERAGE-LIMIT INTERACTIONS' in ev
          assert '2026-08-30T09:01:35Z' in ev
          assert '7c65a697a98961d0df278658e59262ce39874ff5' in ev
          for s in ['Verified','You confirmed this is set up','Action needed','Not covered','Status uncertain','Removed']:
              assert s in cand, s
          for n in range(1,17):
              assert f'TC-0335-{n:02d}' in cand
          for n in range(1,9):
              assert f'L8-PT-{n:02d}' in cand
          low=cand.lower()
          assert 'evidence map, not a safety score' in low
          assert 'safeweb has not independently verified this setting.' in low
          assert 'acknowledgement is not evidence' in low
          assert 'no seventh user-visible completion/success state' in low
          print('TSK0335_OWNER_APPROVAL_BINDING=PASS')
          print('TSK0335_APPROVED_BLOB_IDENTITY=PASS')
          print('TSK0335_ACCEPTANCE_CONTRACT=PASS')
          print('TSK0335_FINAL_ACCEPTANCE=PASS')
          PY
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
