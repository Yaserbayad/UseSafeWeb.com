name: Verify TSK-0314 current revalidation

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0314-current-verifier-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Independently verify current TSK-0314 acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, re, subprocess
          from pathlib import Path

          EXPECTED={
            'Plans/Master/WBS/master-wbs.csv':'b27a0c5df2f5636d8ed71051e9e26a68959a2616',
            'Plans/Master/RELATIONSHIP_INDEX.yaml':'c108d2c162bcea2ee4cc01def46d0487a9501032',
            'CURRENT_STATE.md':'fb051be724892e1e49d9de3e93b485406649518f',
            'TSK_0314_POST_CR0008_DUAL_MODE_ACCESSIBILITY_BROWSER_DEVICE_NFR_REVALIDATION_2026-09-02.md':'e193abd8398d2c91bc113dfc88ad605e67b475f6',
            'TSK_0314_ACCESSIBILITY_RESPONSIVE_BROWSER_OS_DEVICE_NFR_2026-08-28.md':'3c46d565251ecaec6860d87f18f21fbb22ac3e6d',
            'TSK_0314_ACCESSIBILITY_RESPONSIVE_BROWSER_OS_DEVICE_NFR_EVIDENCE_2026-08-28.md':'28597a33728be020499e08f45ec0cd8c718f43ad',
            'TSK_0046_POST_CR0008_DUAL_MODE_PERFORMANCE_CAPACITY_NFR_REVALIDATION_2026-09-02.md':'8e72d542b68de6f7f5c8c375b63b6229c6d15529',
            'TSK_0046_POST_CR0008_CURRENT_REVALIDATION_EVIDENCE_2026-09-02.md':'0d01804887723c76edc2a8426dfa00585944b84b',
          }
          def blob(p): return subprocess.check_output(['git','hash-object',p],text=True).strip()
          def require(text, concepts, label):
              missing=[c for c in concepts if c not in text]
              if missing: raise AssertionError(f'{label} missing: {missing}')
          for p,sha in EXPECTED.items():
              assert Path(p).exists(), f'missing {p}'
              actual=blob(p); assert actual==sha, f'hash drift {p}: {actual} != {sha}'
          print('TSK0314_INPUT_HASHES=PASS')

          with open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          row=next(r for r in rows if r.get('Task_ID')=='TSK-0314')
          assert row['Lifecycle_Stage']=='L4' and row['Priority']=='MEDIUM'
          assert row['AI_Capability_A0_A4']=='A4' and row['Action_Authority']=='AUTO_ALLOWED'
          assert [d.strip() for d in (row['Dependencies'] or '').split(';') if d.strip()]==['TSK-0046']
          assert (row['Acceptance_ID'],row['Verification_ID'],row['Evidence_ID'])==('ACC-0314','VER-0314','EVD-0314')
          acc=(row['Acceptance_Criteria'] or '').lower()
          require(acc,['wcag','keyboard','screen-reader','text-resize','browser','os','device test tiers','unsupported-state'], 'ACC-0314')
          print('TSK0314_CURRENT_WBS=PASS')

          runtime=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          sections=[]
          for m in re.finditer(r'^## TSK-0046 current accepted stable state.*?(?=^## |\Z)',runtime,re.M|re.S): sections.append(m.group(0))
          assert sections and any('**PASS**' in s and '0d01804887723c76edc2a8426dfa00585944b84b' in s for s in sections)
          print('TSK0314_CURRENT_TSK0046_PREDECESSOR=PASS')

          doc=Path('TSK_0314_POST_CR0008_DUAL_MODE_ACCESSIBILITY_BROWSER_DEVICE_NFR_REVALIDATION_2026-09-02.md').read_text(encoding='utf-8')
          low=doc.lower()
          headings=[line for line in doc.splitlines() if line.startswith('## ')]
          assert len(headings)>=15
          print('TSK0314_STRUCTURE=PASS')

          # WCAG/interaction requirements.
          require(low,['wcag 2.2 level aa','keyboard trap','focus order','screen-reader','200%','320 css px','4.5:1','3:1','24×24','prefers-reduced-motion'], 'accessibility baseline')
          require(low,['optional sign-in','session expiry','dashboard','device','account deletion','accountless core','technical protection verification'], 'dual-mode accessibility')
          print('TSK0314_ACCESSIBILITY_DUAL_MODE=PASS')

          # Responsive/localization support.
          require(low,['mobile-first','arabic','rtl','bidi','english/turkish','200% zoom'], 'responsive localization')
          print('TSK0314_RESPONSIVE_RTL=PASS')

          # Browser/OS policy and dated source snapshot use current stable/release semantics rather than forecasts.
          require(low,['release-time matrix','chrome desktop','edge desktop','firefox desktop','safari/macos','iphone/ipad','android web ui','stable/release channels'], 'browser policy')
          require(low,['chrome 152 stable','firefox 155 released','edge 152 stable','edge 153 stable is scheduled','ios/ipados 26.6.1','macos 26.6.2','safari 26.6.1','august 2026 android bulletin remains latest'], 'dated snapshot')
          require(low,['chromereleases.googleblog.com','firefox 155','learn.microsoft.com/deployedge/microsoft-edge-release-schedule','support.apple.com/100100','source.android.com/docs/security/bulletin/asb-overview'], 'source references')
          print('TSK0314_CURRENT_BROWSER_OS_SOURCES=PASS')

          # Separate web/DNS support and truthful state boundaries.
          require(low,['supported browser does not prove','dns install/verification/removal','not covered','uncertain/error','accessibility blocker','optional-account unavailable while accountless core is healthy'], 'support boundaries')
          print('TSK0314_SUPPORT_STATE_SEPARATION=PASS')

          # Four tiers and both accountless + optional-account critical routes.
          require(low,['tier 0','tier 1','tier 2','tier 3','voiceover','talkback','nvda','complete accountless setup/verify/recover/remove journey','optional sign-in/session/dashboard/device/account-deletion journey'], 'test tiers')
          print('TSK0314_DEVICE_TEST_TIERS=PASS')

          # Current TSK-0046 relationship and no accessibility-for-performance trade.
          require(low,['current tsk-0046','performance/capacity','cannot remove semantics','accessibility verification must be included in performance regression'], 'TSK-0046 binding')
          print('TSK0314_TSK0046_BINDING=PASS')

          # CR-0006/7 and no scope inflation.
          require(low,['cr-0006','cr-0007','lg-09','first real users are live-production users'], 'current lifecycle')
          require(low,['does not prove implemented wcag conformance','public support commitment','dns mechanism support beyond','build/implementation','real-user processing','legal/privacy completion','gate pass or successor pass'], 'non inference')
          print('TSK0314_NON_INFERENCE=PASS')

          # Historical baseline remains provenance, not silently discarded.
          hist=Path('TSK_0314_ACCESSIBILITY_RESPONSIVE_BROWSER_OS_DEVICE_NFR_2026-08-28.md').read_text(encoding='utf-8').lower()
          require(hist,['wcag 2.2 level aa','keyboard trap','200%','320 css pixels','tier 0','tier 1','tier 2','tier 3'], 'historical baseline')
          print('TSK0314_HISTORICAL_CORE_PRESERVED=PASS')

          print('TSK0314_CURRENT_ACC=PASS')
          print('TSK0314_CURRENT_VER=PASS')
          print('TSK0314_CURRENT_EVD_READY=PASS')
          print('TSK0314_CURRENT_REVALIDATION=PASS')
          PY
