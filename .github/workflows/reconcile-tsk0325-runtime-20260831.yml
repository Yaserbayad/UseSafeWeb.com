name: Reconcile TSK-0325 runtime acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0325-runtime-20260831.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile exact TSK-0325 PASS into CURRENT_STATE
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 .github/scripts/reconcile_tsk0325_runtime_20260831.py
          python3 -c 'from pathlib import Path; p=Path("CURRENT_STATE.md"); p.write_text(p.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")'
          git diff --check
          grep -Fq '## TSK-0325 current accepted stable state — 2026-08-31 — POST-CR-0007' CURRENT_STATE.md
          grep -Fq 'final run/job `33405928577 / 99533392966`: **SUCCESS**' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept current post-CR-0007 TSK-0325'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          echo "TSK0325_RUNTIME_RECONCILIATION=PASS"
          echo "TSK0325_RUNTIME_COMMIT=$(git rev-parse HEAD)"
          echo "TSK0325_RUNTIME_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
