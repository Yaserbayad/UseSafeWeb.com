name: Fix TSK-0333 initial focus

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-tsk0333-initial-focus.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Apply guarded initial-focus correction
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD:prototype/TSK-0333/app.mjs)" = "1d4674285a63ae32ae3e9472cc4854b819e2ece3"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototype/TSK-0333/app.mjs')
          s=p.read_text(encoding='utf-8')
          old="""  const heading = app.querySelector('h1');
  if (heading) {
    heading.tabIndex = -1;
    heading.focus({ preventScroll: true });
    if (announce) announcer.textContent = heading.textContent;
  }
"""
          new="""  const heading = app.querySelector('h1');
  if (heading && announce) {
    heading.tabIndex = -1;
    heading.focus({ preventScroll: true });
    announcer.textContent = heading.textContent;
  }
"""
          assert old in s, 'expected render focus block missing'
          s2=s.replace(old,new,1)
          assert s2.count('heading.focus({ preventScroll: true });')==1
          p.write_text(s2,encoding='utf-8')
          print('TSK0333_INITIAL_FOCUS_FIX=PASS')
          PY
          git diff --check
          [[ "$(git diff --name-only)" == "prototype/TSK-0333/app.mjs" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/TSK-0333/app.mjs
          git commit -m 'fix: preserve skip-link as initial keyboard target'
          git push origin HEAD:main
          echo "APP_BLOB=$(git rev-parse HEAD:prototype/TSK-0333/app.mjs)"
