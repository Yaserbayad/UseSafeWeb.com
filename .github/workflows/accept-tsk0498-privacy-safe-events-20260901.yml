name: Accept corrected TSK-0498 privacy-safe event contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-20260901.yml'

permissions:
  contents: write

concurrency:
  group: usesafeweb-tsk-0498-acceptance
  cancel-in-progress: false

jobs:
  verify-accept:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 3

      - name: Verify corrected artifact and stage current state
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          ARTIFACT_BLOB="$(git rev-parse "HEAD:TSK_0498_PRIVACY_SAFE_DECISION_LINKED_EVENT_CONTRACT_2026-09-01.md")"
          echo "TSK0498_ARTIFACT_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "TSK0498_ARTIFACT_BLOB=$ARTIFACT_BLOB" >> "$GITHUB_ENV"
          TSK0498_ARTIFACT_COMMIT="$SOURCE_COMMIT" TSK0498_ARTIFACT_BLOB="$ARTIFACT_BLOB" python3 .github/scripts/accept_tsk0498_20260901.py verify-state
          git diff --check
          test "$(git status --porcelain | sed 's/^...//')" = 'CURRENT_STATE.md'

      - name: Persist CURRENT_STATE and verify exact remote read-back
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$TSK0498_ARTIFACT_COMMIT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0498 privacy-safe event contract'
          STATE_COMMIT="$(git rev-parse HEAD)"
          STATE_BLOB="$(git rev-parse "$STATE_COMMIT:CURRENT_STATE.md")"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$STATE_COMMIT"
          test "$(git rev-parse "origin/main:CURRENT_STATE.md")" = "$STATE_BLOB"
          git show "origin/main:CURRENT_STATE.md" | grep -F '## TSK-0498 current accepted stable state — 2026-09-01 — POST-CR-0008'
          echo "TSK0498_STATE_COMMIT=$STATE_COMMIT"
          echo "TSK0498_STATE_BLOB=$STATE_BLOB"
          echo 'TSK0498_ACCEPTANCE_REMOTE_READBACK=PASS'
