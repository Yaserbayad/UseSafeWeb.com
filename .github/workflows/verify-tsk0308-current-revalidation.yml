name: Verify TSK-0308 current revalidation

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0308-current-verifier-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Run robust structural VER-0308
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_tsk0308_current_revalidation.py
      - name: Install isolated Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tsk0308-pw
          cd /tmp/tsk0308-pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Run rendered dual-mode reference verification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tsk0308-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/prototype/TSK-0308/dual-mode-reference.html >/dev/null && break
            sleep 0.25
          done
          NODE_PATH=/tmp/tsk0308-pw/node_modules node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless: true});
            const errors = [];
            const external = [];
            const viewports = [320, 768, 1024, 1440];
            try {
              for (const width of viewports) {
                const context = await browser.newContext({ viewport: { width, height: 1100 } });
                const page = await context.newPage();
                page.on('console', msg => { if (msg.type() === 'error') errors.push(`console:${width}:${msg.text()}`); });
                page.on('pageerror', err => errors.push(`page:${width}:${err.message}`));
                page.on('request', req => {
                  const u = new URL(req.url());
                  if (u.hostname !== '127.0.0.1') external.push(req.url());
                });
                await page.goto('http://127.0.0.1:4173/prototype/TSK-0308/dual-mode-reference.html', {waitUntil:'networkidle'});
                const result = await page.evaluate(() => {
                  const body = document.body;
                  const start = [...document.querySelectorAll('a,button')].find(el => el.textContent.trim() === 'Start setup');
                  const signIn = [...document.querySelectorAll('a,button')].find(el => el.textContent.trim() === 'Sign in / Manage devices');
                  const fallback = [...document.querySelectorAll('a,button')].find(el => el.textContent.trim() === 'Continue without signing in');
                  const life = ['Sign out','Unlink device','Delete device record','Delete account','Reset anonymous web state','Remove SafeWeb DNS'];
                  const allText = body.innerText.toLowerCase();
                  const rtl = document.querySelector('[dir="rtl"]');
                  const deviceRows = document.querySelectorAll('.sw-ds-device-row');
                  return {
                    overflow: body.scrollWidth > window.innerWidth + 1,
                    start: !!start,
                    startSecondary: !!start && start.classList.contains('sw-button--secondary'),
                    signIn: !!signIn,
                    signInSecondary: !!signIn && signIn.classList.contains('sw-button--secondary'),
                    fallback: !!fallback,
                    optionalText: allText.includes('sign-in is optional for core setup'),
                    identityTruth: allText.includes('does not mean safeweb dns') && allText.includes('protection verification'),
                    noSurveillance: allText.includes('no browsing or dns-query history') && allText.includes('no browsing or dns-query history, child activity/profile, raw adguard administration, query log, or overall safety score'),
                    lifecycle: life.every(label => [...document.querySelectorAll('a,button')].some(el => el.textContent.trim() === label)),
                    accountDeleteDnsTruth: allText.includes('deleting the account does not remove safeweb dns') && allText.includes('removing safeweb dns does not delete the account'),
                    rtl: !!rtl && getComputedStyle(rtl).direction === 'rtl' && rtl.scrollWidth <= rtl.clientWidth + 1,
                    deviceRows: deviceRows.length >= 2,
                  };
                });
                for (const [key, value] of Object.entries(result)) {
                  if (['startSecondary'].includes(key)) continue;
                  if (!value) throw new Error(`VIEWPORT_${width}_${key}=FAIL`);
                }
                if (result.startSecondary) throw new Error(`VIEWPORT_${width}_START_PRIMARY=FAIL`);
                if (!result.signInSecondary) throw new Error(`VIEWPORT_${width}_SIGNIN_SECONDARY=FAIL`);
                await page.keyboard.press('Tab');
                const focus = await page.evaluate(() => {
                  const el = document.activeElement;
                  const cs = getComputedStyle(el);
                  return {tag: el && el.tagName, outline: cs.outlineStyle, width: parseFloat(cs.outlineWidth || '0')};
                });
                if (!focus.tag || focus.tag === 'BODY' || focus.outline === 'none' || !(focus.width > 0)) throw new Error(`VIEWPORT_${width}_FOCUS_VISIBLE=FAIL`);
                console.log(`TSK0308_VIEWPORT_${width}=PASS`);
                await context.close();
              }
              if (errors.length) throw new Error(`browser errors: ${errors.join(' | ')}`);
              if (external.length) throw new Error(`external requests: ${external.join(' | ')}`);
              console.log('TSK0308_BROWSER_NO_OVERFLOW=PASS');
              console.log('TSK0308_BROWSER_ACCOUNTLESS_PRIMARY=PASS');
              console.log('TSK0308_BROWSER_OPTIONAL_ACCOUNT_SECONDARY=PASS');
              console.log('TSK0308_BROWSER_PROVIDER_FALLBACK=PASS');
              console.log('TSK0308_BROWSER_IDENTITY_PROTECTION_SEPARATION=PASS');
              console.log('TSK0308_BROWSER_LIFECYCLE_SEPARATION=PASS');
              console.log('TSK0308_BROWSER_RTL=PASS');
              console.log('TSK0308_BROWSER_FOCUS=PASS');
              console.log('TSK0308_BROWSER_CONSOLE=PASS');
              console.log('TSK0308_RENDERED_CURRENT_ACCEPTANCE=PASS');
            } finally {
              await browser.close();
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          git diff --exit-code -- prototype/TSK-0308 brand/system/TSK-0300 brand/identity/TSK-0301
          echo 'TSK0308_SOURCE_UNCHANGED=PASS'
