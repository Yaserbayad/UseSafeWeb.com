name: Verify AdGuard abuse protections

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adguard-abuse-preflight.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Verify TSK-0483 existing bounded controls
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          sudo -n true
          systemctl is-active --quiet AdGuardHome.service

          sudo python3 - /opt/AdGuardHome/AdGuardHome.yaml <<'PY'
          import ipaddress, sys, yaml
          p=sys.argv[1]
          with open(p,encoding='utf-8') as f: d=yaml.safe_load(f)
          dns=d.get('dns') or {}
          binds=dns.get('bind_hosts') or []
          nonloop=[]
          for x in binds:
              try:
                  a=ipaddress.ip_address(x)
                  if a.version==4 and not a.is_loopback and not a.is_unspecified:
                      nonloop.append(x)
              except ValueError:
                  pass
          ratelimit=int(dns.get('ratelimit') or 0)
          refuse_any=bool(dns.get('refuse_any'))
          whitelist=dns.get('ratelimit_whitelist') or []
          q=d.get('querylog') or {}; s=d.get('statistics') or {}
          assert ratelimit > 0, ratelimit
          assert refuse_any is True, refuse_any
          assert len(whitelist)==0, len(whitelist)
          assert q.get('enabled') is False, q.get('enabled')
          assert dns.get('anonymize_client_ip') is True, dns.get('anonymize_client_ip')
          assert s.get('enabled') is False, s.get('enabled')
          assert '0.0.0.0' not in binds and '::' not in binds, binds
          print('dns_port='+str(dns.get('port')))
          print('ratelimit='+str(ratelimit))
          print('ratelimit_subnet_len_ipv4='+str(dns.get('ratelimit_subnet_len_ipv4')))
          print('ratelimit_subnet_len_ipv6='+str(dns.get('ratelimit_subnet_len_ipv6')))
          print('ratelimit_whitelist_count=0')
          print('refuse_any=true')
          print('bind_host_count='+str(len(binds)))
          print('public_wildcard_bind=false')
          print('nonloopback_ipv4_bind_present='+str(bool(nonloop)).lower())
          print('querylog_enabled=false')
          print('anonymize_client_ip=true')
          print('statistics_enabled=false')
          with open('/tmp/usw-abuse-target','w',encoding='utf-8') as f:
              f.write(nonloop[0] if nonloop else '127.0.0.1')
          PY

          sudo ufw status verbose > /tmp/usw-ufw-status.txt 2>/dev/null || true
          python3 - <<'PY'
          t=open('/tmp/usw-ufw-status.txt',encoding='utf-8',errors='replace').read().lower()
          lines=t.splitlines()
          active='status: active' in t
          deny=('default: deny (incoming)' in t) or ('default: deny (incoming),' in t)
          dns_rules=sum(1 for x in lines if ('53/' in x or x.strip().startswith('53 ')))
          dot_rules=sum(1 for x in lines if ('853/' in x or x.strip().startswith('853 ')))
          assert active, 'ufw inactive'
          assert deny, 'ufw incoming policy not default deny'
          assert dns_rules==0, dns_rules
          assert dot_rules==0, dot_rules
          print('ufw_active=true')
          print('ufw_default_incoming_deny=true')
          print('ufw_dns_rule_mentions=0')
          print('ufw_dot_rule_mentions=0')
          PY

          python3 - <<'PY'
          import random, socket, struct, time
          target=open('/tmp/usw-abuse-target',encoding='utf-8').read().strip()
          name='usesafeweb-abuse-acceptance.invalid'
          qname=b''.join(bytes([len(x)])+x.encode() for x in name.split('.'))+b'\x00'
          def packet(qtype,tid=None):
              if tid is None: tid=random.randrange(0,65536)
              return struct.pack('!HHHHHH',tid,0x0100,1,0,0,0)+qname+struct.pack('!HH',qtype,1)
          def one(qtype,timeout=.75):
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(timeout)
              p=packet(qtype); s.sendto(p,(target,53))
              try:
                  r,_=s.recvfrom(4096)
                  return True, len(p), len(r), (struct.unpack('!H',r[2:4])[0] & 0xF)
              except socket.timeout:
                  return False, len(p), 0, None
              finally: s.close()

          low_sent=8; low_received=0
          for _ in range(low_sent):
              ok,_,_,_=one(1)
              low_received += int(ok)
              time.sleep(.16)
          assert low_received==low_sent, (low_sent,low_received)
          print('pilot_low_rate_sent='+str(low_sent))
          print('pilot_low_rate_received='+str(low_received))

          ok,qs,rs,rcode=one(255)
          assert ok and rcode==4, (ok,rcode)
          ratio=(rs/qs) if qs else 999
          assert ratio <= 1.5, ratio
          print('any_query_rcode='+str(rcode))
          print('any_response_to_query_size_ratio='+'{:.2f}'.format(ratio))

          time.sleep(1.1)
          total=80
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.setblocking(False)
          tids=[]
          start=time.monotonic()
          for i in range(total):
              tid=(2000+i) & 0xffff; tids.append(tid); s.sendto(packet(1,tid),(target,53))
          send_elapsed=time.monotonic()-start
          deadline=time.monotonic()+1.25
          got=set()
          while time.monotonic()<deadline:
              try:
                  r,_=s.recvfrom(4096)
                  if len(r)>=2: got.add(struct.unpack('!H',r[:2])[0])
              except BlockingIOError:
                  time.sleep(.005)
          s.close()
          received=len(got.intersection(tids))
          dropped=total-received
          assert received > 0, received
          assert dropped >= total//2, (received,dropped)
          print('ratelimit_burst_sent='+str(total))
          print('ratelimit_burst_received='+str(received))
          print('ratelimit_burst_dropped='+str(dropped))
          print('ratelimit_burst_send_elapsed_ms='+str(round(send_elapsed*1000,1)))
          PY

          sudo rm -f /tmp/usw-abuse-target
          rm -f /tmp/usw-ufw-status.txt
          echo 'TSK_0483_ACCEPTANCE=PASS'
