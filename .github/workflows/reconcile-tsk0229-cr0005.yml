name: Reconcile TSK-0229 CR-0005

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0229-cr0005.yml'

permissions:
  contents: write

concurrency:
  group: usesafeweb-governance-state
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Reconcile current runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = "adguardvm"
          test "$(whoami)" = "azureusr"
          python3 .github/scripts/reconcile_tsk0229_cr0005.py
          git diff --check
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo 'TSK0229_RUNTIME_NO_CHANGE=PASS'
            exit 0
          fi
          test "$changed" = "CURRENT_STATE.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: revalidate TSK-0229 under CR-0005'
          git push origin HEAD:main
          echo 'TSK0229_RUNTIME_CR0005_RECONCILIATION=PASS'
