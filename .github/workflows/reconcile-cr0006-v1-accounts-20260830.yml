          # Layer 5 owner-change execution semantics.
          t=l5.read_text(encoding='utf-8')
          assert '### 5.3.5 Owner-required Version-1 optional account scope' not in t
          section='''### 5.3.5 Owner-required Version-1 optional account scope (DEC-0053 / CR-0006)\n\n- Effective 2026-08-30, Version 1 must include an optional parent account capability with secure authentication/session, minimum parent/device ownership persistence and lightweight dashboard/device management; the complete core safety setup/protection journey must remain usable without login.\n- This activates the existing `EXC-0001` account/persistence/dashboard branch. It does not authorize browsing/query/activity history, child accounts, unrestricted DNS administration, mandatory login for core value, or a browser-visible AdGuard administration secret/control plane.\n- Prior PASS/evidence remains valid only for unchanged facts. Any PASS whose acceptance depended on accounts being excluded is reopened and must be re-evaluated against the revised contract. In particular, the prior `TSK-0146`, revised integrated prototype/accessibility/findings/freeze chain and LG-06 readiness may not be reused as final evidence without account-inclusive verification.\n- Google/Firebase is the planned initial auth route, not a pre-approved production fact: current official terms, quotas/pricing, data/transfer/privacy/security behavior and failure/exit handling must be verified at the owning L5 task before architecture approval.\n- `LG-06` requires the revised dual-mode L4 product/experience baseline; `LG-07` requires account/session/data/vendor/privacy/security architecture; `LG-08` requires implementation; L7 requires auth/authz/CSRF/IDOR/ClientID/deletion/recovery acceptance. `DEC-0052/CR-0005` remains controlling for human-validation sequencing: no pre-L8 user evidence is invented or required.\n- No public release, participant activation, payment, market activation or launch authority is created by this owner scope correction.\n\n'''
          marker='### 5.4 Evidence and PASS rules\n'
          assert t.count(marker)==1; l5.write_text(t.replace(marker,section+marker,1),encoding='utf-8')

          # Manifest becomes CR-0006 current authority.
          t=manifest.read_text(encoding='utf-8')
          old='  status: 2.0-owner-frozen / OWNER_FREEZE_2026-08-27 / OWNER_TECHNICAL_COMMERCIAL_AMENDMENT_APPLIED / OWNER_LEGAL_HOLD_ACTIVE_TO_2027-08-27 / OWNER_AZURE_HANDOFF_BOUNDARY_APPLIED_2026-08-27 / POST_FREEZE_CR_0001_DEPENDENCY_REPAIR_2026-08-27 / OWNER_LEGAL_SEQUENCING_OVERRIDE_ACTIVE_TO_2027-08-27 / CR_0003_CR_0004_HISTORICAL_SEQUENCING_SUPERSEDED / OWNER_INTEGRATED_PRODUCT_FIRST_HUMAN_VALIDATION_SEQUENCE_2026-08-29 / PRE_PRODUCT_HUMAN_VALIDATION_EXCLUDED / deterministic validation pending CR-0005 execution readback'
          new='  status: 2.0-owner-frozen / OWNER_FREEZE_2026-08-27 / OWNER_TECHNICAL_COMMERCIAL_AMENDMENT_APPLIED / OWNER_LEGAL_HOLD_ACTIVE_TO_2027-08-27 / OWNER_AZURE_HANDOFF_BOUNDARY_APPLIED_2026-08-27 / POST_FREEZE_CR_0001_DEPENDENCY_REPAIR_2026-08-27 / OWNER_LEGAL_SEQUENCING_OVERRIDE_ACTIVE_TO_2027-08-27 / CR_0003_CR_0004_HISTORICAL_SEQUENCING_SUPERSEDED / OWNER_INTEGRATED_PRODUCT_FIRST_HUMAN_VALIDATION_SEQUENCE_2026-08-29 / PRE_PRODUCT_HUMAN_VALIDATION_EXCLUDED / OWNER_V1_OPTIONAL_ACCOUNT_SCOPE_2026-08-30 / deterministic validation pending CR-0006 execution readback'
          assert t.count(old)==1; t=t.replace(old,new,1)
          block='''post_freeze_change_control:\n  latest_change: CR-0006\n  date: '2026-08-30'\n  status: owner-required Version-1 optional parent-account scope activated while preserving the complete accountless core path; prior LG-06 readiness is superseded; canonical reliance requires deterministic validation plus GitHub publication/read-back\n  authority: explicit current Project Owner instruction 2026-08-30; DEC-0053; DEC-0052/CR-0005 remains controlling for human-validation sequencing; actual applicable safety/legal/security/privacy/platform reality remains higher authority\n  affected_scope:\n  - EXC-0001 activated for bounded Version-1 parent account/auth/session/minimum persistence/lightweight dashboard/device management\n  - prior account-exclusion-dependent L4 PASS evidence reopened for revised acceptance\n  - existing dormant account architecture/build/QA tasks activated without bypassing lifecycle or gates\n  affected_gates:\n  - LG-06 requires revised dual-mode product/brand/experience acceptance\n  - LG-07 requires active account/session/data/vendor/privacy/security architecture evidence\n  - LG-08 requires account capability implementation while preserving accountless core\n  - LG-09 remains the prerequisite to first L8 real-user validation under DEC-0052\n  semantic_delta: Version 1 has optional accounts and a lightweight dashboard; core safety value remains usable without login; mandatory login, browsing/activity history, child accounts and broad DNS administration remain excluded; old accountless-only freeze/readiness evidence is not sufficient for the revised gate\n  change_record: Registers/EXCEPTIONS_CHANGE_CONTROLS.md#post-freeze-material-change-records\n'''
          t2=re.sub(r'post_freeze_change_control:\n.*?(?=generated_assembly_contract:)',block+'\n',t,flags=re.S)
          assert t2!=t; manifest.write_text(t2,encoding='utf-8')

          evidence=root/'CR_0006_V1_OPTIONAL_ACCOUNT_SCOPE_EVIDENCE_2026-08-30.md'
          evidence.write_text(f'''# CR-0006 — Version-1 optional account scope amendment evidence\n\n**Owner authority:** explicit Project Owner instruction 2026-08-30: the website must be able to have accounts from Version 1.\n\n## Decision\n\nDEC-0053 activates the existing account/authentication/minimum-persistence/lightweight-dashboard branch for Version 1. The complete core safety setup remains usable without login. Mandatory login, browsing/activity history, child accounts and unrestricted DNS administration remain excluded. DEC-0052/CR-0005 human-validation sequencing is unchanged.\n\n## Impact\n\n- Activated {len(activated)} existing WBS rows previously deferred solely by EXC-0001.\n- Reopened the prior account-exclusion-dependent L4 freeze/evidence chain rather than fabricating equivalence.\n- Revised LG-06/LG-07/LG-08 acceptance so account product, architecture/security/privacy, implementation and release evidence occur in order.\n- Activated existing auth/authz/IDOR/ClientID/deletion/recovery risks and tests.\n- Preserved all prior evidence that remains valid for the unchanged accountless core, DNS, brand, content and other unaffected facts.\n\n## Pre-change identities\n\n- main parent: `9606d83a82f121acffdf574e9973a7a937da0990`\n- WBS blob: `f23b4f017d1baf73258fa30ecd71549bbfe1b815`\n- relationship index blob: `9ed219b4ccb6b05e68c6a264fc2b21b1008b02a4`\n- manifest blob: `1fc24e28e70c8005a75d37c1d21aecd4ea967ae5`\n- runtime blob before later reconciliation: `ad3fd01395150b802fbb025a48f7692e82b80244`\n\n## Verification required\n\nThe official master-plan validator, relationship/dependency checks, stale-accountless-scope assertions, generated-plan rebuild and checksum verification must all pass before CR-0006 is relied upon. `CURRENT_STATE.md` is reconciled only after this planning publication is read back.\n''',encoding='utf-8')

          print('ACTIVATED_EXC0001_TASKS='+str(len(activated)))
          print('CHANGED_TASKS='+str(len(changed)))
          print('DEPENDENCY_MUTATIONS='+str(len(new_deps)))
