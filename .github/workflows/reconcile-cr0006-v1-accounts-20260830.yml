            '| Application state | No application database by default; introduce persistent local storage only for a concrete validated requirement. Stripe/PayPal remain billing source of truth with only minimum reliable local references if required. |':'| Application state | Accountless journey state remains minimum and short-lived. Version-1 accounts may persist only the minimum parent identity, session, device-ownership/settings and lifecycle metadata required for the approved dashboard; no browsing/query/activity history. Stripe/PayPal remain billing source of truth with only minimum reliable local references if required. |'
          }
          for a,b in reps.items(): assert t.count(a)==1,a; t=t.replace(a,b,1)
