name: Audit TSK-0299 current authority

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0299-audit-trigger.txt']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Audit TSK-0299 authority and artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json, re, subprocess
          from pathlib import Path

          wbs=Path('Plans/Master/WBS/master-wbs.csv')
          graph=Path('Plans/Master/RELATIONSHIP_INDEX.yaml')
          runtime=Path('CURRENT_STATE.md')
          with wbs.open(newline='', encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          byid={r['Task_ID']:r for r in rows if r.get('Task_ID')}
          row=byid['TSK-0299']
          print('TSK0299_ROW_JSON='+json.dumps(row, sort_keys=True, ensure_ascii=True))
          def deps(r):
              return [x.strip() for x in re.split(r'[;,]', r.get('Dependencies','')) if x.strip().startswith('TSK-')]
          rev={tid:[] for tid in byid}
          for r in rows:
              for d in deps(r): rev.setdefault(d,[]).append(r['Task_ID'])
          print('TSK0299_DIRECT_SUCCESSORS='+','.join(rev.get('TSK-0299',[])))
          seen={'TSK-0299'}; q=['TSK-0299']
          while q:
              a=q.pop(0)
              for b in rev.get(a,[]):
                  if b not in seen:
                      seen.add(b); q.append(b)
          print('TSK0299_DESCENDANT_COUNT='+str(len(seen)-1))
          for tid in ['TSK-0298','TSK-0299','TSK-0301','TSK-0302','TSK-0300','TSK-0308','TSK-0310','TSK-0316']:
              if tid in byid:
                  r=byid[tid]
                  print('ROW|{}|stage={}|priority={}|plan={}|exec={}|cap={}|authority={}|deps={}|acc={}|ver={}|evd={}|title={}'.format(tid,r.get('Lifecycle_Stage',''),r.get('Priority',''),r.get('Plan_Status',''),r.get('Execution_State',''),r.get('AI_Capability_A0_A4',''),r.get('Action_Authority',''),r.get('Dependencies',''),r.get('Acceptance_ID',''),r.get('Verification_ID',''),r.get('Evidence_ID',''),r.get('Title','')))
          rt=runtime.read_text(encoding='utf-8')
          for h in ['## TSK-0298 accepted stable state','## TSK-0299 accepted stable state','## TSK-0485 current accepted stable state','## TSK-0318 current accepted stable state','## TSK-0319 current accepted stable state']:
              print('RUNTIME_HEADING|{}|{}'.format(h, 'YES' if h in rt else 'NO'))
          files=subprocess.check_output(['git','ls-files'], text=True).splitlines()
          for f in sorted(x for x in files if '0299' in x.upper()):
              try:
                  sha=subprocess.check_output(['git','hash-object',f], text=True).strip()
              except Exception:
                  sha='ERR'
              print('FILE0299|{}|{}'.format(f,sha))
          for f in sorted(x for x in files if '0298' in x.upper()):
              print('FILE0298|{}|{}'.format(f,subprocess.check_output(['git','hash-object',f], text=True).strip()))
          g=graph.read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(g):
              if 'TSK-0299' in line:
                  lo=max(0,i-2); hi=min(len(g),i+3)
                  print('GRAPH_CONTEXT_BEGIN')
                  for x in g[lo:hi]: print(x)
                  print('GRAPH_CONTEXT_END')
          print('WBS_BLOB='+subprocess.check_output(['git','hash-object',str(wbs)], text=True).strip())
          print('GRAPH_BLOB='+subprocess.check_output(['git','hash-object',str(graph)], text=True).strip())
          print('RUNTIME_BLOB='+subprocess.check_output(['git','hash-object',str(runtime)], text=True).strip())
          print('HEAD='+subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          PY
