name: Fix TSK-0243 Nginx regex once

on:
  push:
    branches:
      - verify/tsk-0243-ephemeral-target-20260904
    paths:
      - '.github/workflows/fix-tsk0243-nginx-regex-once-20260904.yml'

permissions:
  contents: write

jobs:
  fix-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply one exact quoted-regex correction
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='041caa3858b61fb4119a66e9f139ccb3ebd318a0'
          TARGET='.github/workflows/verify-tsk0243-ephemeral-target-v2-20260904.yml'
          SELF='.github/workflows/fix-tsk0243-nginx-regex-once-20260904.yml'
          [[ "${GITHUB_REF}" == 'refs/heads/verify/tsk-0243-ephemeral-target-20260904' ]]
          [[ "$(git merge-base HEAD "${BASE}")" == "${BASE}" ]]
          [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "${SELF}" ]]

          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/verify-tsk0243-ephemeral-target-v2-20260904.yml')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          matches = [
              i for i, line in enumerate(lines)
              if line.lstrip().startswith('server_name ~^[0-9a-f]{32}')
              and 'verify' in line
              and line.rstrip().endswith(';')
          ]
          assert len(matches) == 1, f'expected one unquoted verifier regex, found {len(matches)}'
          i = matches[0]
          raw = lines[i]
          newline = '\n' if raw.endswith('\n') else ''
          stripped = raw.rstrip('\n')
          indent = stripped[:len(stripped) - len(stripped.lstrip())]
          body = stripped.strip()
          assert body.startswith('server_name ') and body.endswith(';') and '"' not in body
          regex = body[len('server_name '):-1]
          lines[i] = f'{indent}server_name "{regex}";{newline}'
          updated = ''.join(lines)
          assert updated.count('server_name "~^[0-9a-f]{32}') == 1
          assert 'server_name ~^[0-9a-f]{32}' not in updated
          p.write_text(updated, encoding='utf-8')
          PY

          rm "${SELF}"
          git diff --check
          [[ "$(git diff --name-only)" == $'.github/workflows/fix-tsk0243-nginx-regex-once-20260904.yml\n.github/workflows/verify-tsk0243-ephemeral-target-v2-20260904.yml' ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'verify: quote TSK-0243 nginx regex'
          git push origin HEAD:verify/tsk-0243-ephemeral-target-20260904
