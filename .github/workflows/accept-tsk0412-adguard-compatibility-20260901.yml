name: Accept TSK-0412 AdGuard compatibility

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/adguard-server/TSK-0412-ADGUARD-COMPATIBILITY-REVERIFICATION.md'
      - '.github/workflows/accept-tsk0412-adguard-compatibility-20260901.yml'

permissions:
  contents: write

concurrency:
  group: usesafeweb-governed-runtime-write
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify current task authority and dependency
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 - <<'PY'
          from pathlib import Path
          import csv
          state = Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          art = Path('infrastructure/adguard-server/TSK-0412-ADGUARD-COMPATIBILITY-REVERIFICATION.md').read_text(encoding='utf-8')
          assert 'POST-FREEZE CR-0008 PUBLISHED, RECONCILED, READ-BACK VERIFIED' in state
          assert '## TSK-0413 current accepted stable state' in state
          assert '## TSK-0412 current accepted stable state' not in state
          with open('Plans/Master/WBS/master-wbs.csv', encoding='utf-8-sig', newline='') as f:
              rows={r['Task_ID']:r for r in csv.DictReader(f)}
          r=rows['TSK-0412']
          assert r['Lifecycle_Stage']=='L5'
          assert r['Priority']=='HIGH'
          assert r['Action_Authority']=='AUTO_ALLOWED'
          assert r['AI_Capability_A0_A4']=='A4'
          assert 'TSK-0413' in r.get('Dependencies','')
          acc=r.get('Acceptance_Criteria','')
          for phrase in ('Current official sources','pinned target build','separate-process/config/API integration','privacy fields','compatibility tests','upgrade/rollback path','license','no Firebase/auth dependency'):
              assert phrase.lower() in acc.lower(), (phrase,acc)
          for phrase in ('v0.107.79','c48f4a43000665484c5ec28177de11a004759b620dae8f77b2aabefc9ef3687f','05ba17b282da1c4393d6a4ba4db0cf519194a362','schema 34','/clients/add','ignore_querylog','ignore_statistics','/querylog/config/update','/stats/config/update','GNU GPL Version 3','No automatic AdGuard Home upgrades','no Firebase or Google-auth runtime dependency','PASS CANDIDATE'):
              assert phrase in art, phrase
          print('TSK0412_AUTHORITY_CONTRACT=PASS')
          PY

      - name: Independently fetch and verify official current AdGuard sources and build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'UseSafeWeb-TSK-0412-verifier',
          }
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          release=get_json('https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest')
          assert release['tag_name']=='v0.107.79', release['tag_name']
          assert release['prerelease'] is False and release['draft'] is False
          assert release['published_at']=='2026-08-18T15:45:27Z', release['published_at']
          assets={a['name']:a for a in release['assets']}
          a=assets['AdGuardHome_linux_amd64.tar.gz']
          expected='sha256:c48f4a43000665484c5ec28177de11a004759b620dae8f77b2aabefc9ef3687f'
          assert a.get('digest')==expected, a.get('digest')
          pathlib.Path('/tmp/adguard_asset_url').write_text(a['browser_download_url'],encoding='utf-8')

          ref=get_json('https://api.github.com/repos/AdguardTeam/AdGuardHome/git/ref/tags/v0.107.79')
          obj=ref['object']
          if obj['type']=='tag':
              tag=get_json('https://api.github.com/repos/AdguardTeam/AdGuardHome/git/tags/'+obj['sha'])
              obj=tag['object']
          assert obj['type']=='commit'
          assert obj['sha']=='05ba17b282da1c4393d6a4ba4db0cf519194a362', obj
          print('OFFICIAL_RELEASE_IDENTITY=PASS')
          print('latest=v0.107.79')
          print('commit='+obj['sha'])
          print('asset_digest='+expected)
          PY
          URL="$(cat /tmp/adguard_asset_url)"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors "$URL" -o /tmp/AdGuardHome_linux_amd64.tar.gz
          test "$(sha256sum /tmp/AdGuardHome_linux_amd64.tar.gz | awk '{print $1}')" = 'c48f4a43000665484c5ec28177de11a004759b620dae8f77b2aabefc9ef3687f'
          python3 - <<'PY'
          import pathlib, tarfile
          src='/tmp/AdGuardHome_linux_amd64.tar.gz'
          out=pathlib.Path('/tmp/AdGuardHome')
          with tarfile.open(src,'r:gz') as tf:
              candidates=[m for m in tf.getmembers() if m.isfile() and m.name.rstrip('/').endswith('/AdGuardHome')]
              assert len(candidates)==1,[m.name for m in candidates]
              m=candidates[0]
              assert not m.name.startswith('/') and '..' not in pathlib.PurePosixPath(m.name).parts
              f=tf.extractfile(m); assert f is not None
              out.write_bytes(f.read())
          out.chmod(0o755)
          PY
          /tmp/AdGuardHome --version | tee /tmp/adguard-version.txt
          grep -F 'v0.107.79' /tmp/adguard-version.txt

          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            'https://raw.githubusercontent.com/AdguardTeam/AdGuardHome/v0.107.79/LICENSE.txt' -o /tmp/LICENSE.txt
          grep -F 'GNU GENERAL PUBLIC LICENSE' /tmp/LICENSE.txt
          grep -F 'Version 3, 29 June 2007' /tmp/LICENSE.txt

          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            'https://raw.githubusercontent.com/AdguardTeam/AdGuardHome/v0.107.79/openapi/openapi.yaml' -o /tmp/openapi.yaml
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/openapi.yaml').read_text(encoding='utf-8')
          for phrase in (
            "'/clients/add':", "'operationId': 'clientsAdd'",
            "'/clients/update':", "'operationId': 'clientsUpdate'",
            "'/clients/delete':", "'operationId': 'clientsDelete'",
            "'ignore_querylog':", "'ignore_statistics':", "'anonymize_client_ip':",
            "'/querylog/config/update':", "'/stats/config/update':",
            "'basicAuth':", "'scheme': 'basic'",
          ):
              assert phrase in s, phrase
          # Exact tagged API still carries deprecated older config methods; new integration must use current PUT endpoints.
          q=s.index("'/querylog/config/update':")
          st=s.index("'/stats/config/update':")
          assert "'put':" in s[q:q+1800].lower()
          assert "'put':" in s[st:st+1800].lower()
          assert "'deprecated': true" in s, 'expected deprecated legacy API marker absent'
          print('EXACT_OPENAPI_CONTRACT=PASS')
          PY

      - name: Verify project pin and current recovery bundle
        shell: bash
        run: |
          set -euo pipefail
          grep -F "ADGUARD_VERSION='v0.107.79'" infrastructure/adguard-server/install-adguard.sh
          grep -F "ADGUARD_TARBALL_SHA256='c48f4a43000665484c5ec28177de11a004759b620dae8f77b2aabefc9ef3687f'" infrastructure/adguard-server/install-adguard.sh
          python3 infrastructure/adguard-server/tsk-0413-bundle-v1/verify_bundle.py | tee /tmp/bundle-verify.txt
          grep -F 'TSK_0413_BUNDLE_VERIFY=PASS' /tmp/bundle-verify.txt
          grep -F 'adguard_home_version=v0.107.79' /tmp/bundle-verify.txt
          grep -F 'config_schema_version=34' /tmp/bundle-verify.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('infrastructure/adguard-server/tsk-0413-bundle-v1')
          b=json.loads((root/'bundle.json').read_text(encoding='utf-8'))
          s=b['settings']; dns=s['dns']
          assert b['compatibility']['adguard_home_version']=='v0.107.79'
          assert b['compatibility']['config_schema_version']==34
          assert b['compatibility']['official_tag_commit']=='05ba17b282da1c4393d6a4ba4db0cf519194a362'
          assert dns['upstream_dns']==['https://dns10.quad9.net/dns-query']
          assert dns['edns_client_subnet']=={'enabled':False,'use_custom':False,'custom_ip':''}
          assert dns['anonymize_client_ip'] is True
          assert s['querylog']=={'enabled':False,'file_enabled':False,'interval':'1d'}
          assert s['statistics']=={'enabled':True,'interval':'1d'}
          assert b['admin_policy']['public_exposure'] is False
          assert b['admin_policy']['browser_receives_admin_credentials'] is False
          print('CURRENT_PROJECT_COMPATIBILITY=PASS')
          PY
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --check

      - name: Record current TSK-0412 PASS and remote read-back
        shell: bash
        run: |
          set -euo pipefail
          ART='infrastructure/adguard-server/TSK-0412-ADGUARD-COMPATIBILITY-REVERIFICATION.md'
          ART_BLOB="$(git rev-parse "HEAD:$ART")"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          ART_BLOB="$ART_BLOB" SOURCE_COMMIT="$SOURCE_COMMIT" python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import os,re
          p=Path('CURRENT_STATE.md')
          s=p.read_text(encoding='utf-8')
          assert '## TSK-0412 current accepted stable state — 2026-09-01' not in s
          now=datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          s=re.sub(r'(?m)^\*\*Updated:\*\* .*$',f'**Updated:** {now}',s,count=1)
          s += f'''\n\n## TSK-0412 current accepted stable state — 2026-09-01\n\n`TSK-0412 — Reverify the supported AdGuard Home version, documented API/configuration behavior, license boundary, privacy defaults, compatibility and rollback constraints`: **PASS** under current `ACC-0412 / VER-0412 / EVD-0412`, current `TSK-0413` dependency evidence, and `DEC-0054/DEC-0055` authority.\n\n- Action authority: **A4 / AUTO_ALLOWED**.\n- Accepted compatibility record: `infrastructure/adguard-server/TSK-0412-ADGUARD-COMPATIBILITY-REVERIFICATION.md`, blob `{os.environ['ART_BLOB']}`, source commit `{os.environ['SOURCE_COMMIT']}`.\n- Independent current-source/build verification on GitHub Actions run `{os.environ.get('GITHUB_RUN_ID','UNKNOWN')}` fetched official AdGuard Home latest release/tag/license/exact v0.107.79 OpenAPI, independently downloaded and SHA-256 verified the Linux amd64 asset, executed the pinned binary version check, verified the project installer pin, and ran the complete TSK-0413 bundle verifier.\n- Current stable target remains **v0.107.79**, release commit `05ba17b282da1c4393d6a4ba4db0cf519194a362`, Linux amd64 SHA-256 `c48f4a43000665484c5ec28177de11a004759b620dae8f77b2aabefc9ef3687f`, config schema `34`: **no version drift and no upgrade is required**.\n- Exact API re-verification preserves server-only basic-authenticated `/control` integration, typed client add/update/delete operations, explicit per-client `ignore_querylog`/`ignore_statistics` privacy handling, and current non-deprecated query-log/statistics config update endpoints.\n- Current privacy bundle remains Quad9 `dns10`, ECS off, client-IP anonymization on, persistent query/file logging off, anonymized aggregate statistics at `1d`, restricted admin, approved filter baseline and no versioned secrets/history.\n- License remains GNU GPL Version 3. Specialist review is triggered before materially different modification/distribution/conveyance/bundling facts; no legal conclusion beyond current source/license/architecture facts is inferred.\n- **Non-inference:** no production upgrade/configuration change, typed-adapter implementation, live target DNS/TLS/privacy/recovery result, clean-server recovery/RTO, later task/gate, production activation or public launch PASS is claimed.\n\n### Queue effect after TSK-0412 PASS\n\nRecompute current L5 eligibility from WBS/graph/gates/runtime and current DEC-0054/DEC-0055 authority before selecting later work.\n'''
          p.write_text(s.rstrip()+'\n',encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0412 AdGuard compatibility'
          COMMIT="$(git rev-parse HEAD)"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$COMMIT"
          git show "$COMMIT:CURRENT_STATE.md" | grep -F '## TSK-0412 current accepted stable state — 2026-09-01'
          test "$(git rev-parse "$COMMIT:$ART")" = "$ART_BLOB"
          python3 Plans/Master/Tools/validate_master_plan.py
          echo "TSK0412_STATE_COMMIT=$COMMIT"
          echo "TSK0412_ARTIFACT_BLOB=$ART_BLOB"
          echo 'TSK0412_REMOTE_READBACK=PASS'
