name: Verify TSK-0229 post-CR-0006

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0229-post-cr0006-20260830.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify source-bound TSK-0229 contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = "515638ae5efaa8dfec4e9a8362f28f7efb45cd6e"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "3bb1598a6233a2bbefa52c746a7621867c6c6e89"
          test "$(git hash-object Plans/Master/Registers/REQUIREMENTS.md)" = "a2212059f69c4602eb0c05961d5d1639e3543f83"
          test "$(git hash-object Plans/Master/Registers/CONSTRAINTS.md)" = "9464720bff94fd569e3b939568996a26eed83ca1"
          test "$(git hash-object Plans/Master/Registers/INTERFACES.md)" = "b01b47e48fcd1bd5b9697e0ab35b496059e7eb6c"
          test "$(git hash-object Plans/Master/Registers/RISKS.md)" = "0ebb7ab97ec4d418e61eaae0fce6a35e3a9e36ec"
          test "$(git hash-object Plans/Master/Registers/DECISIONS_TRIGGERS.md)" = "9cb2908f4c6f19cb38fce4a8aff71abca3b7b095"
          test "$(git hash-object TSK_0229_ACCOUNTLESS_JOURNEY_DATA_MODEL_EXPIRY_DELETION_NO_LINKAGE_2026-08-28.md)" = "3fa48b11b6c7704ecc3748bcd865f77aa54f5605"
          test "$(git hash-object TSK_0229_POST_CR0006_ACCOUNTLESS_NO_LINKAGE_AMENDMENT_2026-08-30.md)" = "2955c2762e726f95ec67c33b9abbc5e4b25cb84a"
          test "$(git hash-object TSK_0146_VERSION_1_OPTIONAL_ACCOUNT_PRODUCT_BASELINE_2026-08-30.md)" = "9d3870d90add696fc352829fb4763c834b8d09af"

          python3 - <<'PY'
          import csv
          from pathlib import Path

          root = Path('.')
          rows = list(csv.DictReader((root/'Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='')))
          r = next(x for x in rows if x['Task_ID'] == 'TSK-0229')
          assert r['Lifecycle_Stage'] == 'L4'
          assert r['Plan_Status'] == 'PLANNED'
          assert r['Execution_State'] == 'WAITING'
          assert r['Dependencies'] == 'TSK-0146'
          assert r['AI_Capability_A0_A4'] == 'A3'
          assert r['Action_Authority'] == 'AUTO_ALLOWED'
          assert r['Acceptance_ID'] == 'ACC-0229'
          assert r['Verification_ID'] == 'VER-0229'
          assert r['Evidence_ID'] == 'EVD-0229'
          assert 'Only fields necessary for the active journey exist' in r['Acceptance_Criteria']
          assert 'no browsing history or persistent child profile' in r['Acceptance_Criteria']
          assert 'expiry/deletion and diagnostic boundaries are testable' in r['Acceptance_Criteria']
          print('TSK0229_WBS_ELIGIBILITY=PASS')

          runtime = (root/'CURRENT_STATE.md').read_text(encoding='utf-8')
          assert '`TSK-0146` is current **PASS**' in runtime
          assert 'DEC-0053/CR-0006 dual-mode Version-1 contract' in runtime

          base = (root/'TSK_0229_ACCOUNTLESS_JOURNEY_DATA_MODEL_EXPIRY_DELETION_NO_LINKAGE_2026-08-28.md').read_text(encoding='utf-8')
          amend = (root/'TSK_0229_POST_CR0006_ACCOUNTLESS_NO_LINKAGE_AMENDMENT_2026-08-30.md').read_text(encoding='utf-8')
          t146 = (root/'TSK_0146_VERSION_1_OPTIONAL_ACCOUNT_PRODUCT_BASELINE_2026-08-30.md').read_text(encoding='utf-8')
          req = (root/'Plans/Master/Registers/REQUIREMENTS.md').read_text(encoding='utf-8')
          con = (root/'Plans/Master/Registers/CONSTRAINTS.md').read_text(encoding='utf-8')
          ints = (root/'Plans/Master/Registers/INTERFACES.md').read_text(encoding='utf-8')
          risks = (root/'Plans/Master/Registers/RISKS.md').read_text(encoding='utf-8')
          dec = (root/'Plans/Master/Registers/DECISIONS_TRIGGERS.md').read_text(encoding='utf-8')

          for s in [
              'J0 — Browser/session-only UI state',
              'J1 — Optional anonymous short-lived journey record',
              'maximum **24 hours from creation**, non-sliding',
              '## 5. Explicit prohibited fields and data classes',
              '## 6. Expiry and deletion contract',
              '## 7. No-linkage rules',
              '## 9. Diagnostic separation',
              '## 11. Backup and recovery boundary',
              '14. **Accountless completion:**',
          ]:
              assert s in base, s
          print('TSK0229_BASE_CONTRACT_PRESERVED=PASS')

          for s in [
              'The optional parent account is a **separate persistent data domain** from J0/J1.',
              'J0/J1 must not be automatically joined, converted, stitched or promoted into a parent account/device record.',
              'this TSK-0229 amendment authorizes **no automatic or implicit migration** of J1 fields into persistent account/device state',
              'Until that downstream transfer contract exists, the safe rule is **separate account creation/management with no J1-to-account linkage**.',
              'TSK-0229 does not define the persistent account schema.',
              'account identity must not be used to reconstruct, persist or expose DNS/domain activity history.',
              'authentication/provider/account-store failure must not extend J1 TTL',
              '22. **Deletion independence:**',
              'this artifact does not issue a final legal-compliance conclusion',
          ]:
              assert s in amend, s
          print('TSK0229_CR0006_SEPARATION=PASS')

          assert 'Accountless journey state and persistent account/device state must remain distinct.' in t146
          assert 'REQ-0018' in req and 'REQ-0019' in req
          assert 'CON-0007' in con and 'Persistent identifiable query logging and file query logging are off.' in con
          assert 'CON-0008' in con and 'No browsing/top-domain product metric.' in con
          assert 'INT-0006' in ints and 'INT-0007' in ints
          assert 'RSK-0001' in risks and 'Open — treatment in progress' in risks
          assert 'DEC-0053' in dec and 'optional parent account' in dec
          print('TSK0229_ACC0229=PASS')
          print('TSK0229_PRIVACY_BOUNDARIES=PASS')

          lower = amend.lower()
          for forbidden in [
              'persistent-account schema approved',
              'implementation authorized',
              'participant activation authorized',
          ]:
              assert forbidden not in lower, forbidden
          # The artifact may mention "LG-06 PASS" only in an explicit non-authority disclaimer.
          assert 'not l5 persistent-account schema approval, legal-compliance certification, implementation authority, lg-06 pass, participant authority or launch authority' in lower
          print('TSK0229_DOWNSTREAM_SCOPE_FENCE=PASS')
          print('TSK0229_VERIFICATION=PASS')
          PY
