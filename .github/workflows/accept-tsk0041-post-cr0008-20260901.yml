name: Temporary - Accept TSK-0049 current PASS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-tsk0041-post-cr0008-20260901.yml'
permissions:
  contents: write
jobs:
  accept-tsk0049:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact TSK-0049 acceptance boundary
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object TSK_0049_LG07_ARCHITECTURE_PRIVACY_SECURITY_OPERATIONS_APPROVAL_COMPONENT_2026-09-02.md)" = '0e76b305c6ed282457e0da0b11b85eb1ccaf85c5'
          test "$(git hash-object Plans/Master/Tools/verify_tsk0049_lg07_approval_component_20260902.py)" = '28a23bea81ece638a991157314d628856c7c2bd2'
          python3 Plans/Master/Tools/verify_tsk0049_lg07_approval_component_20260902.py
          python3 Plans/Master/Tools/validate_master_plan.py
      - name: Append bounded TSK-0049 PASS state
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          ACCEPT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8-sig')
          heading = '## TSK-0049 current accepted stable state — 2026-09-02 — POST-CR-0010 / CR-0009'
          if heading in text:
              raise SystemExit('TSK-0049 accepted-state section already exists; refusing duplicate append')

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('**Updated:**'):
                  lines[i] = f'**Updated:** {now}'
                  break
          text = '\n'.join(lines).rstrip() + '\n'

          section = f'''\n{heading}\n\n`TSK-0049 — Complete LG-07 architecture, privacy, security, and operations approval component (legacy G-06)`: **PASS** under current `ACC-0049 / VER-0049 / EVD-0049`.\n\n- Current normalized WBS blob `eb35f3b10356396c5117e3f47d0b0378953e2157`: L5 / MEDIUM / A4 / `AUTO_ALLOWED`; hard dependencies exactly `TSK-0239; TSK-0539`, both current durable PASS.\n- Accepted artifact: `TSK_0049_LG07_ARCHITECTURE_PRIVACY_SECURITY_OPERATIONS_APPROVAL_COMPONENT_2026-09-02.md`, version `1.0.0`, blob `0e76b305c6ed282457e0da0b11b85eb1ccaf85c5`, publication commit `8ba0b23a9bf485bb9938497041cd2f796efa0c64`.\n- Deterministic verifier: `Plans/Master/Tools/verify_tsk0049_lg07_approval_component_20260902.py`, blob `28a23bea81ece638a991157314d628856c7c2bd2`. Independent read-only GitHub Actions verification run `33656968873 / 1`, source commit `ba500bae2257d7a2ea0d731ad287051c780b2904`: **SUCCESS**; TSK-0049 verifier PASS, full modular master-plan validator PASS (`641` tasks, `858` dependency edges, `0` broken links), and repository diff check PASS.\n- Acceptance synchronization run `{os.environ['ACCEPT_RUN_ID']}` at source commit `{os.environ['SOURCE_COMMIT']}` re-ran the exact artifact/WBS/verifier hash guards, TSK-0049 verifier and full master-plan validator before this runtime mutation.\n- Scope of PASS: the direct LG-07 **technical/design architecture, privacy-engineering, security and operations component only**. Current L5 evidence has no unresolved High/Critical architecture/control-plan gap within this component; implementation-time and target-environment High/Critical controls remain mandatory downstream verification obligations.\n- CR-0009 / DEC-0056 boundary is preserved: legal/regulatory/compliance conclusions are `OWNER_EXTERNAL_SATISFIED` for sequencing only; no legal evidence, compliance conclusion, legal PASS or legal approval is inferred.\n- **Non-inference:** this is not final LG-07 PASS, not proof of L6/runtime implementation, not production/deployment/publication/launch authority, and does not authorize spend. Downstream implementation, security/privacy negative testing, recovery/rollback and target-environment evidence remain mandatory and blocking under their own acceptance.\n\n### Queue status after TSK-0049 acceptance\n\nRecompute the residual L5 frontier from current normalized WBS/graph/runtime/gates and DEC-0056 semantics; execute the highest-priority genuinely eligible non-legal `AUTO_ALLOWED` task. No successor or LG-07 PASS is inferred.\n'''
          p.write_text(text + section, encoding='utf-8')
          PY
          git diff --check
          changed="$(git status --porcelain | sed 's/^...//' | sort)"
          test "$changed" = 'CURRENT_STATE.md'
          grep -Fq "$SOURCE_COMMIT" CURRENT_STATE.md
          grep -Fq 'Independent read-only GitHub Actions verification run `33656968873 / 1`' CURRENT_STATE.md
          grep -Fq 'not final LG-07 PASS' CURRENT_STATE.md
      - name: Persist and read back TSK-0049 PASS
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0049 LG-07 technical component'
          C="$(git rev-parse HEAD)"
          B="$(git rev-parse "$C:CURRENT_STATE.md")"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$C"
          test "$(git rev-parse "origin/main:CURRENT_STATE.md")" = "$B"
          git show origin/main:CURRENT_STATE.md | grep -Fq '## TSK-0049 current accepted stable state — 2026-09-02 — POST-CR-0010 / CR-0009'
          git show origin/main:CURRENT_STATE.md | grep -Fq '`TSK-0049 — Complete LG-07 architecture, privacy, security, and operations approval component (legacy G-06)`: **PASS**'
          git show origin/main:CURRENT_STATE.md | grep -Fq 'not final LG-07 PASS'
          echo "TSK0049_STATE_COMMIT=$C"
          echo "TSK0049_STATE_BLOB=$B"
          echo 'TSK0049_ACCEPTANCE_REMOTE_READBACK=PASS'
