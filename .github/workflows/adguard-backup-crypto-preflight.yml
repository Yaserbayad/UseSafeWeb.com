name: Inspect AdGuard backup encryption capabilities

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adguard-backup-crypto-preflight.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify owner SSH recipient suitability without exposing key material
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          sudo -n true
          systemctl is-active --quiet AdGuardHome.service

          auth='/home/azureusr/.ssh/authorized_keys'
          sudo test -f "$auth"
          [[ "$(sudo stat -c '%a %U:%G' "$auth")" == '600 azureusr:azureusr' ]]

          sudo python3 - "$auth" <<'PY'
          import base64,sys
          lines=[]
          for line in open(sys.argv[1],encoding='utf-8',errors='ignore'):
              line=line.strip()
              if line and not line.startswith('#'): lines.append(line)
          assert len(lines)==1, len(lines)
          parts=lines[0].split()
          idx=next(i for i,p in enumerate(parts) if p.startswith(('ssh-','ecdsa-','sk-')))
          keytype=parts[idx]
          assert keytype=='ssh-rsa', keytype
          print('authorized_key_count=1')
          print('authorized_key_type=ssh-rsa')
          PY

          # Print key size/type only; suppress fingerprint/comment/public material.
          read -r key_bits key_type < <(sudo ssh-keygen -lf "$auth" | awk '{print $1,$4}')
          echo "authorized_key_bits=$key_bits"
          echo "authorized_key_display_type=$key_type"
          [[ "$key_bits" =~ ^[0-9]+$ ]]
          (( key_bits >= 2048 ))

          sshd_state="$(sudo sshd -T 2>/dev/null | awk '$1=="publickeyauthentication" || $1=="passwordauthentication" {print $1"="$2}' | sort | tr '\n' ' ')"
          echo "sshd_auth_methods=$sshd_state"
          sudo sshd -T 2>/dev/null | awk '$1=="publickeyauthentication"{exit !($2=="yes")}'

          # The owner handoff evidence records an SSH-session verification at
          # 2026-08-27T20:41:57Z. Count only matching public-key accept events
          # in a narrow window; do not emit source IPs, fingerprints, or log lines.
          accepted_count="$(sudo journalctl -u ssh --since '2026-08-27 20:35:00 UTC' --until '2026-08-27 20:50:00 UTC' --no-pager 2>/dev/null | grep -c 'Accepted publickey for azureusr' || true)"
          echo "handoff_window_accepted_publickey_count=$accepted_count"
          [[ "$accepted_count" =~ ^[0-9]+$ ]]
          (( accepted_count >= 1 ))

          candidate="$(apt-cache policy age 2>/dev/null | awk '/Candidate:/{print $2; exit}')"
          echo "age_package_candidate=${candidate:-none}"
          [[ -n "$candidate" && "$candidate" != '(none)' ]]

          [[ "$(git hash-object TSK_0435_HANDOFF_EVIDENCE_2026-08-27.md)" == '57de1a4187288870da7655973ac09bf907674d89' ]]
          [[ "$(git hash-object infrastructure/adguard-server/BACKUP_SCOPE_POLICY.md)" == 'e62b48a3e746b1be90881bbffab3b7680384cc16' ]]
          echo 'owner_handoff_ssh_publickey_path_supported=true'
          echo 'TSK_0430_RECIPIENT_PREFLIGHT=PASS'
