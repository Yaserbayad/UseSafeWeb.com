name: Verify TSK-0322 dual-mode product language
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/verify_tsk0322_dual_mode_policy_20260901.py'
      - '.github/workflows/verify-tsk0322-dual-mode-policy-20260901.yml'
      - 'content/TSK-0322/PRODUCT_VOICE_CLAIMS_TERMINOLOGY.md'
      - 'content/TSK-0322/POLICY.json'
permissions:
  contents: read
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current TSK-0322 contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/verify_tsk0322_dual_mode_policy_20260901.py
          git diff --check
          test -z "$(git status --porcelain)"
