name: Accept TSK-0042 support recovery requirements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-tsk0042-support-recovery-20260901.yml'

permissions:
  contents: write

jobs:
  verify-accept:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 3
      - name: Verify and stage TSK-0042
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          python3 .github/scripts/accept_tsk0042_20260901.py
          git diff --check
          test "$(git status --porcelain | sed 's/^...//')" = 'CURRENT_STATE.md'
      - name: Persist and read back state
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0042 support recovery requirements'
          C="$(git rev-parse HEAD)"
          B="$(git rev-parse "$C:CURRENT_STATE.md")"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$C"
          test "$(git rev-parse "origin/main:CURRENT_STATE.md")" = "$B"
          git show "origin/main:CURRENT_STATE.md" | grep -F '## TSK-0042 current accepted stable state — 2026-09-01 — POST-CR-0008'
          echo "TSK0042_STATE_COMMIT=$C"
          echo "TSK0042_STATE_BLOB=$B"
          echo 'TSK0042_ACCEPTANCE_REMOTE_READBACK=PASS'