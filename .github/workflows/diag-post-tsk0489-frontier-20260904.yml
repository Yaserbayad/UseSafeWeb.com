name: Diagnose TSK-0629 authority and executor

on:
  push:
    branches:
      - diag/post-tsk0489-frontier-20260904
    paths:
      - '.github/workflows/diag-post-tsk0489-frontier-20260904.yml'

permissions:
  contents: read

jobs:
  tsk0629-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read exact TSK-0629 authority and executor bindings
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='041caa3858b61fb4119a66e9f139ccb3ebd318a0'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD)" = '.github/workflows/diag-post-tsk0489-frontier-20260904.yml'
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path

          tid='TSK-0629'
          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='')))
          row=next(r for r in rows if r.get('Task_ID')==tid)
          print('TSK0629_WBS_ROW='+json.dumps(row, ensure_ascii=False, separators=(',',':')))

          graph=Path('Plans/Master/RELATIONSHIP_INDEX.yaml').read_text(encoding='utf-8')
          m=re.search(r'(?ms)^  TSK-0629:\s*$\n(.*?)(?=^  TSK-\d{4}:\s*$|\Z)', graph)
          print('TSK0629_GRAPH_BLOCK_BEGIN')
          print((m.group(1) if m else 'MISSING').rstrip())
          print('TSK0629_GRAPH_BLOCK_END')

          rt=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          hits=list(re.finditer(r'(?mis)^#{2,4}[^\n]*TSK-0629[^\n]*\n.*?(?=^#{2,4}\s|\Z)', rt))
          print('TSK0629_RUNTIME_SECTIONS_BEGIN')
          for h in hits[-8:]:
              print(h.group(0).rstrip())
              print('---SECTION---')
          print('TSK0629_RUNTIME_SECTIONS_END')
          PY
          echo 'TSK0629_SOURCE_REFERENCES_BEGIN'
          git grep -n -I -E 'TSK-0629|10\.214\.0\.2|E1.?=.?0\.80|5-member aggregate' "$BASE" -- ':!.github/workflows/diag-post-tsk0489-frontier-20260904.yml' || true
          echo 'TSK0629_SOURCE_REFERENCES_END'
          echo 'SELF_HOSTED_BINDINGS_BEGIN'
          git grep -n -I -E 'runs-on:.*self-hosted|self-hosted' "$BASE" -- '.github/workflows/*.yml' '.github/workflows/*.yaml' || true
          echo 'SELF_HOSTED_BINDINGS_END'
