name: Diagnose post-TSK-0489 governed frontier

on:
  push:
    branches:
      - diag/post-tsk0489-frontier-20260904
    paths:
      - '.github/workflows/diag-post-tsk0489-frontier-20260904.yml'

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove current TODO frontier is fenced by missing target evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='041caa3858b61fb4119a66e9f139ccb3ebd318a0'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD)" = '.github/workflows/diag-post-tsk0489-frontier-20260904.yml'
          python3 - <<'PY'
          import csv, re, subprocess
          from pathlib import Path

          wbs_path = Path('Plans/Master/WBS/master-wbs.csv')
          graph_path = Path('Plans/Master/RELATIONSHIP_INDEX.yaml')
          runtime_path = Path('CURRENT_STATE.md')
          rows = list(csv.DictReader(wbs_path.open(encoding='utf-8-sig', newline='')))
          by = {r['Task_ID']: r for r in rows if r.get('Task_ID','').startswith('TSK-')}

          rt = runtime_path.read_text(encoding='utf-8')
          heading_re = re.compile(r'(?m)^(#{2,4})[^\n]*\b(TSK-\d{4})\b[^\n]*(?:current accepted stable state|accepted stable state)[^\n]*$')
          heads = list(heading_re.finditer(rt))
          runtime_state = {}
          runtime_section = {}
          for i, m in enumerate(heads):
              start = m.start()
              end = heads[i+1].start() if i+1 < len(heads) else len(rt)
              sec = rt[start:end]
              tid = m.group(2)
              hits = [sm.group(1) for sm in re.finditer(r'\*\*(PASS|WAITING|BLOCKED|TODO)\*\*', sec)]
              if hits:
                  runtime_state[tid] = hits[-1]
                  runtime_section[tid] = sec

          graph = graph_path.read_text(encoding='utf-8')
          entity_starts = list(re.finditer(r'(?m)^  (TSK-\d{4}):\s*$', graph))
          rels = {}
          for i, m in enumerate(entity_starts):
              end = entity_starts[i+1].start() if i+1 < len(entity_starts) else len(graph)
              block = graph[m.end():end]
              rels[m.group(1)] = [(x.group(1).strip(), x.group(2).strip()) for x in re.finditer(r'(?m)^    - target: ([^\n]+)\n      type: ([^\n]+)', block)]

          def deps(tid):
              return [t for t,k in rels.get(tid,[]) if k == 'depends_on' and t.startswith('TSK-')]

          def eff(tid):
              r = by[tid]
              if r.get('Execution_State') == 'PASS':
                  return 'PASS'
              return runtime_state.get(tid, r.get('Execution_State') or 'TODO')

          ready_todo = []
          for tid, row in by.items():
              if eff(tid) != 'TODO':
                  continue
              ds = deps(tid)
              if all(eff(d) == 'PASS' for d in ds):
                  ready_todo.append(tid)

          expected = {'TSK-0629','TSK-0369','TSK-0499'}
          assert set(ready_todo) == expected, (ready_todo, expected)

          checks = {
              'TSK-0629': [
                  'no approved trusted producer of fresh E1 DNS-path evidence is connected or proven',
                  'no deployment, DNS-server mutation, profile distribution, production/runtime activation'
              ],
              'TSK-0369': [
                  'Remaining `VER-0369` evidence: authorized target deployment/enablement',
                  'no deployment, production/runtime enablement, participant processing'
              ],
              'TSK-0499': [
                  'Remaining `VER-0499` evidence: authorized target deployment/enablement',
                  'no telemetry/analytics activation, deployment, production/runtime enablement'
              ],
          }

          print('PREFLIGHT_CANONICAL_BASE=' + BASE if False else 'PREFLIGHT_CANONICAL_BASE=041caa3858b61fb4119a66e9f139ccb3ebd318a0')
          print('PREFLIGHT_WBS_BLOB=' + subprocess.check_output(['git','hash-object',str(wbs_path)], text=True).strip())
          print('PREFLIGHT_GRAPH_BLOB=' + subprocess.check_output(['git','hash-object',str(graph_path)], text=True).strip())
          print('PREFLIGHT_RUNTIME_BLOB=' + subprocess.check_output(['git','hash-object',str(runtime_path)], text=True).strip())
          print('PREFLIGHT_DEPENDENCY_READY_TODO_COUNT=' + str(len(ready_todo)))
          for tid in sorted(ready_todo):
              row = by[tid]
              sec = runtime_section[tid]
              for needle in checks[tid]:
                  assert needle in sec, (tid, needle)
              assert row.get('Action_Authority') == 'AUTO_ALLOWED', (tid, row.get('Action_Authority'))
              assert 'required inputs/access available' in row.get('Preconditions',''), (tid, row.get('Preconditions'))
              print(f'PREFLIGHT_{tid}=INELIGIBLE_MISSING_REQUIRED_TARGET_ACCESS_OR_EVIDENCE')
              print(f'PREFLIGHT_{tid}_AUTHORITY={row.get("Action_Authority")}')
              print(f'PREFLIGHT_{tid}_AI={row.get("AI_Capability_A0_A4")}')
              print(f'PREFLIGHT_{tid}_DEPS={";".join(deps(tid))}')
          print('PREFLIGHT_EXECUTABLE_TODO_COUNT=0')
          print('PREFLIGHT_MATERIAL_ACTIONS=NONE')
          PY
