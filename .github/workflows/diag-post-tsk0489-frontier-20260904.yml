name: Diagnose verifier ownership and target sequencing

on:
  push:
    branches:
      - diag/post-tsk0489-frontier-20260904
    paths:
      - '.github/workflows/diag-post-tsk0489-frontier-20260904.yml'

permissions:
  contents: read

jobs:
  verifier-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve verifier deployment and trust-boundary ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='041caa3858b61fb4119a66e9f139ccb3ebd318a0'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD)" = '.github/workflows/diag-post-tsk0489-frontier-20260904.yml'
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path

          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='')))
          byid={r.get('Task_ID'):r for r in rows if r.get('Task_ID')}
          wanted=['TSK-0243','TSK-0629']
          for tid in wanted:
              print(tid+'_WBS='+json.dumps(byid[tid], ensure_ascii=False, separators=(',',':')))

          graph=Path('Plans/Master/RELATIONSHIP_INDEX.yaml').read_text(encoding='utf-8')
          blocks={m.group(1):m.group(2) for m in re.finditer(r'(?ms)^  (TSK-\d{4}):\s*$\n(.*?)(?=^  TSK-\d{4}:\s*$|\Z)', graph)}
          for tid in wanted:
              print(tid+'_GRAPH_BEGIN')
              print(blocks.get(tid,'MISSING').rstrip())
              print(tid+'_GRAPH_END')

          print('TSK0243_DIRECT_REFERENCERS_BEGIN')
          for tid, block in blocks.items():
              if tid!='TSK-0243' and re.search(r'(?m)^\s*-\s+target:\s*TSK-0243\s*$', block):
                  rels=[]
                  lines=block.splitlines()
                  for i,line in enumerate(lines):
                      if re.search(r'target:\s*TSK-0243\s*$', line):
                          for j in range(i-1,-1,-1):
                              m=re.search(r'type:\s*([^\s#]+)',lines[j])
                              if m:
                                  rels.append(m.group(1)); break
                  r=byid.get(tid,{})
                  print(json.dumps({'Task_ID':tid,'Task_Title':r.get('Task_Title'),'Plan_Status':r.get('Plan_Status'),'Execution_State':r.get('Execution_State'),'Priority':r.get('Priority'),'AI_Capability':r.get('AI_Capability'),'Action_Authority':r.get('Action_Authority'),'Hard_Dependencies':r.get('Hard_Dependencies'),'relations_to_TSK0243':rels},ensure_ascii=False,separators=(',',':')))
          print('TSK0243_DIRECT_REFERENCERS_END')

          print('INT0021_USERS_BEGIN')
          for tid, block in blocks.items():
              if 'INT-0021' in block:
                  r=byid.get(tid,{})
                  print(json.dumps({'Task_ID':tid,'Task_Title':r.get('Task_Title'),'Plan_Status':r.get('Plan_Status'),'Execution_State':r.get('Execution_State'),'Priority':r.get('Priority'),'AI_Capability':r.get('AI_Capability'),'Action_Authority':r.get('Action_Authority'),'Hard_Dependencies':r.get('Hard_Dependencies')},ensure_ascii=False,separators=(',',':')))
          print('INT0021_USERS_END')

          terms=re.compile(r'(?i)(dns.+verif|verif.+dns|verifier|reverse.?proxy|tls|deploy.+(web|application|dns)|production.+deploy|deploy.+production)')
          print('VERIFIER_RELATED_WBS_BEGIN')
          out=[]
          for idx,r in enumerate(rows):
              hay=' | '.join(str(r.get(k,'') or '') for k in ['Task_Title','Acceptance_Criteria','Required_Tooling','Required_Inputs','Interfaces','Constraints'])
              if terms.search(hay):
                  out.append((idx,r))
          for _,r in out[:120]:
              print(json.dumps({'Task_ID':r.get('Task_ID'),'Task_Title':r.get('Task_Title'),'Plan_Status':r.get('Plan_Status'),'Execution_State':r.get('Execution_State'),'Priority':r.get('Priority'),'Lifecycle_Layer':r.get('Lifecycle_Layer'),'AI_Capability':r.get('AI_Capability'),'Action_Authority':r.get('Action_Authority'),'Hard_Dependencies':r.get('Hard_Dependencies'),'Trigger':r.get('Trigger'),'Preconditions':r.get('Preconditions'),'Acceptance_Criteria':r.get('Acceptance_Criteria')},ensure_ascii=False,separators=(',',':')))
          print('VERIFIER_RELATED_WBS_END')
          PY
          echo 'VERIFIER_AUTHORITY_REFERENCES_BEGIN'
          git grep -n -I -E 'TSK-0243|INT-0021|verify\.usesafeweb\.com|verifier path|verifier service|reverse.proxy' "$BASE" -- \
            'Plans/Master/*.md' 'Plans/Master/**/*.md' 'TSK_*.md' 'CURRENT_STATE.md' \
            ':!Plans/Master/Generated/*' | head -n 320 || true
          echo 'VERIFIER_AUTHORITY_REFERENCES_END'
