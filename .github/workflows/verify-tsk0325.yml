name: Verify TSK-0325 service blueprint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0325.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify TSK-0325 authority and acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 - <<'PY'
          import csv, json, pathlib, subprocess

          def blob(path):
              return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip()

          wbs_path='Plans/Master/WBS/master-wbs.csv'
          with pathlib.Path(wbs_path).open(encoding='utf-8', newline='') as f:
              rows=list(csv.DictReader(f))
          by={r['Task_ID']:r for r in rows}
          row=by['TSK-0325']
          dep=by['TSK-0326']
          assert row['Lifecycle_Stage']=='L4'
          assert row['Plan_Status']=='PLANNED'
          assert row['Priority']=='MEDIUM'
          assert row['Dependencies']=='TSK-0326'
          assert row['Acceptance_ID']=='ACC-0325'
          assert row['Verification_ID']=='VER-0325'
          assert row['Evidence_ID']=='EVD-0325'
          assert row['AI_Capability_A0_A4']=='A3'
          assert row['Action_Authority']=='AUTO_ALLOWED'
          assert 'normal, already-configured, unsupported, failed-activation, false-positive, resume, removal, and support paths' in row['Acceptance_Criteria']
          assert 'each touchpoint maps to requirements' in row['Acceptance_Criteria']
          assert dep['Plan_Status']=='NOT_APPLICABLE' and dep['Execution_State']=='PASS'

          expected_blobs={
            'prototype/TSK-0309/BASELINE.md':'76bb848ebdf6a2aee4dd84bc18e8af5ba8a99dbc',
            'content/TSK-0323/DEVICE_SERVICE_INSTRUCTION_CATALOGUE.md':'bbe9ed90b205f2ca852ebdaefedf054446dd7f91',
            'content/TSK-0323/CATALOGUE.json':'842e18c5666a82d53e2d348715dd6b9198daa44c',
            'Plans/Master/WBS/master-wbs.csv':'f23b4f017d1baf73258fa30ecd71549bbfe1b815',
          }
          for path, expected in expected_blobs.items():
              actual=blob(path)
              assert actual==expected, (path, expected, actual)

          bp_path=pathlib.Path('prototype/TSK-0325/SERVICE_BLUEPRINT.md')
          matrix_path=pathlib.Path('prototype/TSK-0325/ACCEPTANCE_MATRIX.json')
          bp=bp_path.read_text(encoding='utf-8')
          matrix=json.loads(matrix_path.read_text(encoding='utf-8'))
          assert blob(str(bp_path))=='1701f5f7b13ac8f7fa3092e39005b3da7627c89f'
          assert blob(str(matrix_path))=='aee3ead9756f10fb829e948f3ca00336ee0780b3'
          assert matrix['task_id']=='TSK-0325' and matrix['version']=='1.0.0'
          assert matrix['authority']=='non_authoritative_test_projection_of_SERVICE_BLUEPRINT.md'
          assert matrix['sequencing']=='DEC-0052/CR-0005'
          assert matrix['human_validation_claimed'] is False

          required_paths={
            'normal':'Path A — Normal supported setup',
            'already_configured':'Path B — Already configured',
            'unsupported':'Path C — Unsupported / not covered',
            'failed_activation':'Path D — Failed activation / verification failure',
            'false_positive':'Path E — False positive / legitimate content blocked',
            'resume':'Path F — Resume after interruption',
            'removal':'Path G — Removal and recovery',
            'support':'Path H — Support / help',
          }
          assert len(matrix['required_paths'])==8
          found={p['id']:p['heading'] for p in matrix['required_paths']}
          assert found==required_paths
          for heading in required_paths.values(): assert heading in bp

          touchpoints=matrix['touchpoints']
          assert len(touchpoints)==13
          assert [x['id'] for x in touchpoints]==[f'TP-{i:02d}' for i in range(1,14)]
          for tp in touchpoints:
              assert 'REQ-0028' in tp['requirements']
              assert {'CON-0010','CON-0017'} <= set(tp['constraints'])
              assert {'INT-0009','INT-0010'} <= set(tp['interfaces'])
              assert tp['id'] in bp
          for tid in {'TP-02','TP-04','TP-05','TP-08','TP-09','TP-10','TP-13'}:
              tp=next(x for x in touchpoints if x['id']==tid)
              assert 'REQ-0029' in tp['requirements']

          cat=json.loads(pathlib.Path('content/TSK-0323/CATALOGUE.json').read_text(encoding='utf-8'))
          current_ids={r['id'] for r in cat['records']}
          required_instruction_ids=set(matrix['required_instruction_ids'])
          assert len(required_instruction_ids)==12
          assert required_instruction_ids <= current_ids
          for iid in required_instruction_ids: assert iid in bp

          expected_states=['Verified','You confirmed this is set up','Action needed','Status uncertain','Not covered','Removed']
          assert matrix['state_labels']==expected_states
          for state in expected_states: assert state in bp

          required_phrases=[
            'no mandatory SafeWeb account',
            'Parent confirmation never becomes system verification',
            'No `localStorage`, `sessionStorage`, cookie, service worker',
            'No named service may be invented',
            'no human/user validation claim is made pre-L8',
            'no complete-safety/zero-error claim',
            'Retry verification only after a changed condition',
            'Help/Limitations navigation is state-neutral',
            'English, Turkish and Arabic/RTL',
            'This artifact cannot authorize production implementation, public release, participant processing, payment, market activation or launch by itself.'
          ]
          for phrase in required_phrases: assert phrase in bp, phrase

          assert len(matrix['mandatory_invariants'])>=10
          assert 'no pre-L8 human validation claim is made' in matrix['mandatory_invariants']
          assert 'no named external service is invented' in matrix['mandatory_invariants']

          state=pathlib.Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          assert 'DEC-0052 / CR-0005' in state
          assert 'TSK-0326' in state and 'NOT_APPLICABLE + PASS' in state

          print('TSK0325_WBS_AUTHORITY=PASS')
          print('TSK0325_DEPENDENCY_EXCLUSION=PASS')
          print('TSK0325_SOURCE_BLOBS=PASS')
          print('TSK0325_REQUIRED_PATHS=8/8_PASS')
          print('TSK0325_TOUCHPOINTS=13/13_TRACE_PASS')
          print('TSK0325_INSTRUCTION_BINDINGS=12/12_PASS')
          print('TSK0325_STATE_TRUTH=PASS')
          print('TSK0325_ACCOUNTLESS_PRIVACY_I18N_CLAIMS=PASS')
          print('TSK0325_ACC_VER_EVD=PASS')
          PY
      - name: Repository cleanliness
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
