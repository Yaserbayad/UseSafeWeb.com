name: Sync governed waiting-state refresh 20260905-1036

on:
  push:
    branches:
      - runtime/waiting-monitor-refresh-20260905-1036
    paths:
      - .github/workflows/sync-waiting-monitor-refresh-20260905-1036.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: runtime/waiting-monitor-refresh-20260905-1036
          fetch-depth: 0
          persist-credentials: true
      - name: Persist fresh TSK-0243 WAITING monitor result
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 0c283c97e3d3fe03fb960baa1868dc14ea2785ab HEAD
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('CURRENT_STATE.md')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['checkpoint_schema'] == 'serial-light-checkpoint-v1'
          assert data['project_id'] == 'UseSafeWeb.com'
          assert data['governance_mode'] == 'SERIAL_LIGHT'
          assert data['checkpoint_revision'] == 13
          assert data['baseline']['version'] == 1
          assert data['runtime']['project_status'] == 'ACTIVE'
          assert data['runtime']['governance_blocker'] is None

          tasks = data['runtime']['items']
          by_id = {node['id']: node for node in tasks}
          assert by_id['TSK-0243']['status'] == 'WAITING'
          assert by_id['TSK-0452']['status'] == 'WAITING'
          assert by_id['TSK-0360']['status'] == 'WAITING'
          assert by_id['TSK-0369']['status'] == 'WAITING'
          assert by_id['TSK-0455']['status'] == 'WAITING'
          assert not any(node['status'] == 'TODO' for node in tasks), [node['id'] for node in tasks if node['status'] == 'TODO']

          data['checkpoint_revision'] = 14
          by_id['TSK-0243']['wait_details'] = {
            'condition': 'Fresh bounded read-only public preflight attempt 17 confirms the governed routing boundary is materially unchanged from attempt 16: verify.usesafeweb.com and the deterministic 32-hex challenge host resolve to 52.157.109.120, but the exact challenge-host TLS/SNI handshake still fails (timeout rc=124), the challenge probe returns HTTP 000, and https://usesafeweb.com/ plus /api/dns-verification/requests remain HTTP 502. Functional public-target proof remains unavailable and fenced.',
            'resolution_check': 'Resume TSK-0243 functional target proof only when a fresh rerun of the existing bounded read-only public preflight shows the challenge verifier host has valid TLS/SNI and the approved probe path is externally reachable, and the public application request/result endpoints are healthy. Recheck current source/version and every material-action fence before any functional POST, DNS rewrite, deployment, certificate/proxy mutation, participant processing, production/public activation, market activation, payment, or launch action.',
            'references': [
              'GitHub Actions workflow run 33900198638 attempt 17 / job 101293048862; completed SUCCESS 2026-09-05T10:36:42Z; TSK0243_PUBLIC_DNS_SERVICE_HOST=PRESENT; TSK0243_PUBLIC_VERIFICATION_WILDCARD=PRESENT; TSK0243_PUBLIC_TRUST_BOUNDARY_PREFLIGHT=ROUTING_PRESENT_REQUIRES_FUNCTIONAL_PROOF; exact challenge TLS/SNI FAIL timeout rc=124; public origin/request HTTP 502; challenge probe HTTP 000; mutation=NONE; participant/payment/launch action=NONE.'
            ]
          }

          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          chk = json.loads(p.read_text(encoding='utf-8'))
          assert chk['checkpoint_revision'] == 14
          assert chk['baseline']['version'] == 1
          assert chk['runtime']['project_status'] == 'ACTIVE'
          assert chk['runtime']['governance_blocker'] is None
          assert not any(node['status'] == 'TODO' for node in chk['runtime']['items'])
          assert next(node for node in chk['runtime']['items'] if node['id'] == 'TSK-0243')['status'] == 'WAITING'
          PY
          test "$(git diff --name-only)" = "CURRENT_STATE.md"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: record TSK-0243 preflight attempt 17'
          git push origin HEAD:runtime/waiting-monitor-refresh-20260905-1036
