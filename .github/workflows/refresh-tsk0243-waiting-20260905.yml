name: Refresh TSK-0243 current WAITING condition

on:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-tsk0243-waiting-20260905.yml]

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact WAITING refresh
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = 'e2974bdb6b350a71d2ed21c2d37f97ad37b4bae9'
          python3 - <<'PY'
          import copy,json
          from pathlib import Path
          p=Path('CURRENT_STATE.md'); text=p.read_text(encoding='utf-8'); before=json.loads(text)
          assert text==json.dumps(before,indent=2,ensure_ascii=False)+'\n'
          assert before['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert before['project_id']=='UseSafeWeb.com'
          assert before['governance_mode']=='SERIAL_LIGHT'
          assert before['checkpoint_revision']==31
          assert before['runtime']['project_status']=='ACTIVE'
          assert before['runtime']['governance_blocker'] is None
          rt={x['id']:x for x in before['runtime']['items']}
          assert rt['TSK-0243']['status']=='WAITING'
          assert rt['TSK-0452']['status']=='PASS'
          assert rt['TSK-0423']['status']=='PASS'
          after=copy.deepcopy(before); after['checkpoint_revision']=32
          target=next(x for x in after['runtime']['items'] if x['id']=='TSK-0243')
          target['wait']={
            'condition':'Fresh bounded public preflight confirms public application/API routing and verifier wildcard DNS are present, but the deterministic 32-hex challenge host still fails TLS/SNI with alert unrecognized name and its probe endpoint remains unreachable (HTTP 000). TSK-0452 is already PASS, so the remaining TSK-0243 prerequisite is specifically the verifier challenge-host TLS/proxy functional path, not target access or general web deployment.',
            'resolution_check':'Rerun the existing bounded read-only TSK-0243 public preflight. Remain WAITING until the deterministic 32-hex challenge hostname both completes trusted TLS/SNI and reaches the approved /api/dns-verification/probes interface while the public application request/result endpoints remain healthy. Only then may separately authorized functional target proof proceed; do not infer DNS/TLS/proxy mutation authority from this WAITING state.',
            'reference':'Fresh bounded read-only public preflight: workflow run 33900198638, fresh job 101348390683; TSK-0452 durable PASS in checkpoint revision 31; TSK-0423 durable PASS in checkpoint revision 31.'}
          assert after['baseline']==before['baseline']
          bi={x['id']:x for x in before['runtime']['items']}; ai={x['id']:x for x in after['runtime']['items']}
          for tid,old in bi.items():
              if tid!='TSK-0243': assert ai[tid]==old,tid
          assert ai['TSK-0243']['status']=='WAITING'
          assert ai['TSK-0243']['acceptance_references']==bi['TSK-0243']['acceptance_references']
          assert 'next_work' not in after and 'next_work' not in after['runtime']
          p.write_text(json.dumps(after,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('TSK0243_WAITING_REFRESH=PASS revision=32')
          PY
          git diff --check -- CURRENT_STATE.md
      - name: Stale-write guard, remove transport, commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = 'e2974bdb6b350a71d2ed21c2d37f97ad37b4bae9'
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/refresh-tsk0243-waiting-20260905.yml
          git add CURRENT_STATE.md
          git commit -m 'state: refresh TSK-0243 current waiting boundary'
          git push origin HEAD:main
