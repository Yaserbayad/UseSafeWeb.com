name: Reconcile TSK-0140 preparation waiting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0140-waiting.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact pre-state and preparation evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "e6f07c85f45e8628512c01bd2c80ddcce8f7e28c"
          test "$(git hash-object TSK_0140_PROVISIONAL_PRODUCT_BRIEF_CANDIDATE_2026-08-28.md)" = "334bd2e8513d3800573e1d1e9ec569ae3ff50432"
          test "$(git hash-object TSK_0140_PROVISIONAL_PRODUCT_BRIEF_PREPARATION_EVIDENCE_2026-08-28.md)" = "64c4e30d9f35877cf9cdb64ab54700602403f7a2"
          grep -Fq 'TSK-0140 — Issue the post-validation product brief` is the selected runtime **TODO** work item for bounded preparation only.' CURRENT_STATE.md
      - name: Apply bounded WAITING reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          old_updated = '**Updated:** 2026-08-28T21:01:44Z'
          if text.count(old_updated) != 1:
              raise SystemExit('unexpected Updated pre-state')
          updated = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text = text.replace(old_updated, f'**Updated:** {updated}', 1)

          anchor = '\n## Runtime safeguards\n'
          if text.count(anchor) != 1:
              raise SystemExit('runtime safeguards anchor mismatch')
          stable = '''\n### TSK-0140 preparation stable state\n\n`TSK-0140 — Issue the post-validation product brief`: runtime **WAITING**, not PASS. Bounded preparation is complete: candidate `TSK_0140_PROVISIONAL_PRODUCT_BRIEF_CANDIDATE_2026-08-28.md`, blob `334bd2e8513d3800573e1d1e9ec569ae3ff50432`, publication commit `4c11da3201289fd069aff03059b4c5ce12a68c5e`; preparation verification `TSK_0140_PROVISIONAL_PRODUCT_BRIEF_PREPARATION_EVIDENCE_2026-08-28.md`, blob `64c4e30d9f35877cf9cdb64ab54700602403f7a2`, publication commit `2bac27aee49cbae10f83bbbc886b618428ed275c`. The candidate preserves current product, network, privacy, security, UX, support and finance constraints and the analytical pre-review found no canonical conflict.\n\nACC-0140 remains unsatisfied because required review/approval evidence has not been durably established. In particular, Project Owner review of the exact candidate has not occurred, and the governor will not infer that analytical functional-lens review equals the WBS-required owner/product/network/privacy/security/UX/support/finance review. Minimum resume condition: durable Project Owner approval/rejection/change disposition on candidate blob `334bd2e8513d3800573e1d1e9ec569ae3ff50432` (or a corrected owner-requested revision), together with explicit evidence/authority establishing how the named cross-functional review requirement is satisfied.\n\nThis WAITING state does not make behavioral validation true. `RSK-0002` remains OPEN; `REQ-0022` remains unresolved; LG-03/LG-04/LG-05/LG-06 remain non-PASS; no authentication/dashboard re-entry, L5/L6 build, participant processing, legal completion, payment activation, publication or launch is authorized.\n'''
          if '### TSK-0140 preparation stable state' in text:
              raise SystemExit('TSK-0140 preparation state already present')
          text = text.replace(anchor, stable + anchor, 1)

          marker = '## Queue status after TSK-0043 reconciliation\n'
          i = text.find(marker)
          if i < 0 or text.find(marker, i + 1) >= 0:
              raise SystemExit('queue marker mismatch')
          tail = '''## Queue status after TSK-0140 preparation\n\n`TSK-0140` is runtime **WAITING** on its explicit review/approval condition after all currently safe autonomous preparation was completed and verified. It is not PASS.\n\nFresh queue inspection also preserves the following current blockers: `TSK-0187` and evidence-dependent descendants require representative-parent evidence unavailable while CR-0003/RSK-0002 controls the L3 branch; `TSK-0317` is HUMAN_ONLY and blocks dependent instruction/prototype work; brand work requiring validated customer evidence or owner identity approval remains gated by those branches; account/persistence work remains deferred under EXC-0001; `TSK-0628` depends on HUMAN_ONLY `TSK-0319`; L5/L6 work remains outside DEC-0050 authority. Already-PASS L4 work must not be re-executed.\n\n## Exact next authoritative step\n\nObtain the smallest human authority input that can release current work: Project Owner review of `TSK_0140_PROVISIONAL_PRODUCT_BRIEF_CANDIDATE_2026-08-28.md` blob `334bd2e8513d3800573e1d1e9ec569ae3ff50432`, with explicit approve/reject/change disposition and explicit confirmation of what durable review evidence satisfies ACC-0140's product/network/privacy/security/UX/support/finance review requirement. If approved with sufficient review authority/evidence, independently verify ACC-0140, reconcile runtime PASS, then recompute the L4 queue; if changes are requested, revise only the requested scope and re-review.\n'''
          text = text[:i] + tail
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify diff and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '### TSK-0140 preparation stable state' CURRENT_STATE.md
          grep -Fq 'TSK-0140` is runtime **WAITING**' CURRENT_STATE.md
          grep -Fq 'Project Owner review of `TSK_0140_PROVISIONAL_PRODUCT_BRIEF_CANDIDATE_2026-08-28.md`' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: mark TSK-0140 waiting for owner review'
          git push
