name: Inspect post TSK-0628 and Brand chain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-post-tsk0628-brand-chain.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Print Brand chain and TSK-0628 successors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          with open('Plans/Master/WBS/master-wbs.csv', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          ids={'TSK-0298','TSK-0299','TSK-0300','TSK-0301','TSK-0302','TSK-0303','TSK-0304','TSK-0305','TSK-0306','TSK-0310','TSK-0628'}
          for r in rows:
              tid=r.get('Task_ID','')
              deps=r.get('Dependencies','')
              if tid in ids or 'TSK-0301' in deps or 'TSK-0628' in deps:
                  print('ROW=' + ' | '.join(f'{k}={v}' for k,v in r.items()))
          PY
          echo 'RUNTIME_BRAND_MENTIONS:'
          grep -n -E 'TSK-0298|TSK-0299|TSK-0300|TSK-0301|TSK-0302|TSK-0303|TSK-0304|TSK-0305|TSK-0306' CURRENT_STATE.md || true
          echo 'RUNTIME_0628_SUCCESSOR_MENTIONS:'
          grep -n -F 'TSK-0628' CURRENT_STATE.md || true