name: TSK-0491 dependency inventory and SBOM acceptance

on:
  push:
    branches:
      - feature/tsk-0491-dependency-sbom-20260903
      - main
  pull_request:
    paths:
      - 'website/package.json'
      - 'website/package-lock.json'
      - 'website/DEPENDENCY_SECURITY_POLICY.md'
      - 'website/tests/contract/tsk0491.test.mjs'
      - '.github/workflows/accept-tsk0491-dependency-sbom-20260903.yml'

permissions:
  contents: read

jobs:
  accept-tsk0491:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - name: Verify canonical planning integrity and focused TSK-0491 contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object website/package-lock.json)" = '6ff91d845bc5f3099b6a00f5f43673eed80a3ba5'
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          node --test website/tests/contract/tsk0491.test.mjs

      - name: Generate and validate lockfile-derived SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm ci --no-fund --no-audit
          npm run sbom > sbom.spdx.json
          node -e "const fs=require('node:fs'); const s=JSON.parse(fs.readFileSync('sbom.spdx.json','utf8')); if(s.spdxVersion !== 'SPDX-2.3') throw new Error('unexpected SPDX version'); if(!Array.isArray(s.packages) || s.packages.length < 1) throw new Error('empty SBOM');"
          npm audit --audit-level=high
          rm sbom.spdx.json
          cd ..
          git diff --check
          test -z "$(git status --porcelain)"
