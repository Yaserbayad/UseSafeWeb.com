name: Trace TSK-0010 rebaseline verifier failure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trace-tsk0010-rebaseline-failure-20260905.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Emit all acceptance predicates without asserting
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import csv,json,subprocess
          from pathlib import Path

          RESTORE='''TSK-0026 TSK-0027 TSK-0028 TSK-0139 TSK-0165 TSK-0166 TSK-0167 TSK-0168 TSK-0169 TSK-0202 TSK-0207 TSK-0214 TSK-0225 TSK-0227 TSK-0228 TSK-0298 TSK-0302 TSK-0374 TSK-0428 TSK-0429 TSK-0430 TSK-0431 TSK-0437 TSK-0441 TSK-0442 TSK-0443 TSK-0510 TSK-0511 TSK-0512 TSK-0513 TSK-0514 TSK-0559'''.split()
          EXCLUDE='''TSK-0243 TSK-0360 TSK-0369 TSK-0399 TSK-0455 TSK-0483 TSK-0499 TSK-0630'''.split()
          OWNER_DEFER={'TSK-0455','TSK-0631','TSK-0633','TSK-0634','TSK-0635','TSK-0637','TSK-0640','TSK-0630','TSK-0421','TSK-0415','TSK-0416','TSK-0370','TSK-0499','TSK-0242'}

          def git(*args):
              try:
                  return subprocess.check_output(['git',*args],text=True,stderr=subprocess.STDOUT).strip()
              except Exception as e:
                  return 'ERROR:'+repr(e)

          d=json.loads(Path('CURRENT_STATE.md').read_text(encoding='utf-8'))
          work={x['id']:x for x in d['baseline']['work_items']}
          rt={x['id']:x for x in d['runtime']['items']}
          policies={x['id']:x['text'] for x in d['baseline']['policy_rules']}
          objective=' '.join(x['reference'] for x in d['baseline']['objectives'])
          ref0009=' '.join(x['reference'] for x in rt['TSK-0009'].get('acceptance_references',[]))
          ref0011=' '.join(x['reference'] for x in rt['TSK-0011'].get('acceptance_references',[]))
          decisions=Path('Plans/Master/Registers/DECISIONS_TRIGGERS.md').read_text(encoding='utf-8')
          dec43=next((line for line in decisions.splitlines() if line.startswith('| DEC-0043 |')),None)
          iface=Path('Plans/Master/Governance/CURRENT_STATE_INTERFACE.md').read_text(encoding='utf-8')
          disposition_line=next((line for line in iface.splitlines() if line.startswith('| Validation readiness LG-03 |')),None)
          mapping_line=next((line for line in iface.splitlines() if 'actual LG-03 (legacy G-02) execution state' in line),None)

          checks={}
          def ck(name,value): checks[name]=bool(value)
          actual={
            'checkpoint_blob':git('hash-object','CURRENT_STATE.md'),
            'wbs_blob':git('hash-object','Plans/Master/WBS/master-wbs.csv'),
            'plans_tree':git('rev-parse','HEAD:Plans'),
            'manifest_blob':git('rev-parse','HEAD:Plans/Master/MANIFEST.yaml'),
            'sums_blob':git('rev-parse','HEAD:Plans/SHA256SUMS.txt')}
          ck('checkpoint_blob',actual['checkpoint_blob']=='1b2c5e610371610899fd8bca97a5fd3f4332f62b')
          ck('wbs_blob',actual['wbs_blob']=='357c5e1be3b455e7efddd329d6a2468e3125b502')
          ck('plans_tree',actual['plans_tree']=='0ed412e5dd90f5a05238bb6542a061d7b0ce0ccf')
          ck('manifest_blob',actual['manifest_blob']=='da35db0fe16009dfb5ce0e24caab05d6d02c84ed')
          ck('sums_blob',actual['sums_blob']=='8fbeb7337233adc289ea51e49a0722f33db08323')
          ck('schema',d.get('checkpoint_schema')=='serial-light-checkpoint-v1')
          ck('project',d.get('project_id')=='UseSafeWeb.com')
          ck('mode',d.get('governance_mode')=='SERIAL_LIGHT')
          ck('revision',d.get('checkpoint_revision')==28)
          ck('baseline_version',d.get('baseline',{}).get('version')==1)
          ck('project_status',d.get('runtime',{}).get('project_status')=='ACTIVE')
          ck('governance_blocker',d.get('runtime',{}).get('governance_blocker') is None)
          ck('human_constraints',d.get('runtime',{}).get('human_constraints')==[])
          ck('work_count',len(work)==641 and len(rt)==641 and set(work)==set(rt))
          ck('tsk0010_todo',rt['TSK-0010']['status']=='TODO')
          ck('tsk0011_pass',rt['TSK-0011']['status']=='PASS')
          ck('objective_manifest','Plans/Master/MANIFEST.yaml@20e2763c0be2124378e3158ac559aed826bc6765' in objective)
          ck('objective_master','Plans/Master/MASTER_PLAN.md@20e2763c0be2124378e3158ac559aed826bc6765' in objective)
          ck('tsk0009_publication_commit','fce408f34470c0a0883ab978685b5265fdec4b97' in ref0009)
          ck('tsk0011_frozen_commit','20e2763c0be2124378e3158ac559aed826bc6765' in ref0011)
          ck('tsk0011_plans_tree','0ed412e5dd90f5a05238bb6542a061d7b0ce0ccf' in ref0011)
          ck('tsk0011_sums_blob','8fbeb7337233adc289ea51e49a0722f33db08323' in ref0011)

          restore_detail=[]
          for tid in RESTORE:
              refs=rt[tid].get('acceptance_references',[])
              row={
                'id':tid,
                'status_pass':rt[tid]['status']=='PASS',
                'one_ref':len(refs)==1,
                'acc_match':len(refs)==1 and refs[0].get('ac_id')=='ACC-'+tid.split('-')[1],
                'reconcile_blob_ref':len(refs)==1 and 'e87d1aaca75c155f88348f52adad2b6eb78e589a' in refs[0].get('reference','')}
              row['ok']=all(v for k,v in row.items() if k not in ('id','ok'))
              restore_detail.append(row)
          ck('restore_all',all(x['ok'] for x in restore_detail))
          exclusion_detail=[{'id':tid,'status':rt[tid]['status'],'nonpass':rt[tid]['status']!='PASS'} for tid in EXCLUDE]
          ck('exclusions_nonpass',all(x['nonpass'] for x in exclusion_detail))
          ck('restore_not_owner_deferred',not bool(set(RESTORE)&OWNER_DEFER))
          ck('pol012_dec0053','DEC-0053 / CR-0006' in policies.get('POL-012',''))
          ck('pol012_accountless','accountless core plus optional parent account/session/minimum ownership persistence/lightweight dashboard/device management' in policies.get('POL-012',''))
          ck('pol012_mandatory_login','mandatory login for core value' in policies.get('POL-012',''))
          ck('dec43_found',dec43 is not None)
          ck('dec43_title',dec43 is not None and 'Lean recovery/availability and server topology' in dec43)
          ck('dec43_one_adguard',dec43 is not None and 'one AdGuard node initially' in dec43)
          ck('dec43_two_vms',dec43 is not None and 'two separate fresh Ubuntu 24.04 LTS Azure VMs' in dec43)
          ck('dec43_recovery_time',dec43 is not None and 'approximately 30-minute recovery' in dec43)
          ck('dec43_restore',dec43 is not None and 'restore/rebuild required' in dec43)
          ck('tsk0431_pass',rt['TSK-0431']['status']=='PASS')
          ck('lg03_disposition_line',disposition_line is not None)
          ck('lg03_disposition',disposition_line is not None and 'NOT_APPLICABLE TO ACTIVE PRE-PRODUCT PATH' in disposition_line)
          ck('lg03_mapping_line',mapping_line is not None)
          ck('lg03_mapping',mapping_line is not None and 'actual LG-03 (legacy G-02) execution state' in mapping_line)

          status={tid:item['status'] for tid,item in rt.items()}; status['TSK-0010']='PASS'
          def deps_pass(tid): return all(status.get(dep)=='PASS' for dep in work[tid]['depends_on'])
          eligible=[tid for tid,item in rt.items() if tid!='TSK-0010' and item['status']=='TODO' and deps_pass(tid)]
          eligible.sort(key=lambda tid:(work[tid]['plan_priority'] if work[tid]['plan_priority'] is not None else 10**9,work[tid]['order'],tid))
          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='') as f:
              wbs={r['Task_ID']:r for r in csv.DictReader(f)}
          release=[tid for tid,item in rt.items() if item['status']=='WAITING' and tid not in OWNER_DEFER and deps_pass(tid) and wbs[tid]['Action_Authority']=='AUTO_ALLOWED']
          release.sort(key=lambda tid:(work[tid]['plan_priority'] if work[tid]['plan_priority'] is not None else 10**9,work[tid]['order'],tid))
          selected=release[0] if release else None
          selector={'eligible_todo_count':len(eligible),'eligible_todo_ids':eligible,'wait_release_count':len(release),'next_wait_release_candidate':selected}
          if selected:
              selector.update({'candidate_priority':work[selected]['plan_priority'],'candidate_order':work[selected]['order'],'candidate_title':work[selected]['title'],'candidate_action_authority':wbs[selected]['Action_Authority'],'candidate_trigger':wbs[selected]['Trigger'],'candidate_preconditions':wbs[selected]['Preconditions']})
          ck('selector_computed',True)

          failed=[k for k,v in checks.items() if not v]
          result={'result':'TRACE_COMPLETE','actual':actual,'checks':checks,'failed_checks':failed,'restore_detail':restore_detail,'exclusion_detail':exclusion_detail,'dec43':dec43,'disposition_line':disposition_line,'mapping_line':mapping_line,'selector':selector}
          Path('tsk0010-rebaseline-failure-trace.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'actual':actual,'failed_checks':failed,'selector':selector},indent=2,ensure_ascii=False))
          PY

      - name: Upload failure trace
        uses: actions/upload-artifact@v4
        with:
          name: tsk0010-rebaseline-failure-trace
          path: tsk0010-rebaseline-failure-trace.json
          if-no-files-found: error

      - name: Remove stranded and diagnostic transports
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = '1b2c5e610371610899fd8bca97a5fd3f4332f62b'
          git switch -C main origin/main
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          test -f .github/workflows/verify-tsk0010-rebaseline-20260905.yml
          test -f .github/workflows/verify-tsk0010-rebaseline-v2-20260905.yml
          git rm .github/workflows/verify-tsk0010-rebaseline-20260905.yml
          git rm .github/workflows/verify-tsk0010-rebaseline-v2-20260905.yml
          git rm .github/workflows/trace-tsk0010-rebaseline-failure-20260905.yml
          git commit -m 'evidence: remove TSK-0010 verifier transports after trace'
          git push origin HEAD:main
