name: Actions contents-read permission probe 2026-09-02

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-write-permission-probe-20260902.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Prove read-only job scheduling
        run: echo ACTIONS_CONTENTS_READ_JOB_SCHEDULING=PASS
