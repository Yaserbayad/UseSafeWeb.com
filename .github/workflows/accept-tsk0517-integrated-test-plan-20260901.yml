name: Accept TSK-0517 integrated test plan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-tsk0517-integrated-test-plan-20260901.yml'

permissions:
  contents: write

concurrency:
  group: usesafeweb-tsk-0517-acceptance
  cancel-in-progress: false

jobs:
  verify-accept:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 3

      - name: Verify ACC-0517 and stage current state
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          python3 .github/scripts/accept_tsk0517_20260901.py
          git diff --check
          test "$(git status --porcelain | sed 's/^...//')" = 'CURRENT_STATE.md'

      - name: Persist CURRENT_STATE and verify exact remote read-back
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0517 integrated test plan'
          STATE_COMMIT="$(git rev-parse HEAD)"
          STATE_BLOB="$(git rev-parse "$STATE_COMMIT:CURRENT_STATE.md")"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$STATE_COMMIT"
          test "$(git rev-parse "origin/main:CURRENT_STATE.md")" = "$STATE_BLOB"
          git show "origin/main:CURRENT_STATE.md" | grep -F '## TSK-0517 current accepted stable state — 2026-09-01 — POST-CR-0008'
          echo "TSK0517_STATE_COMMIT=$STATE_COMMIT"
          echo "TSK0517_STATE_BLOB=$STATE_BLOB"
          echo 'TSK0517_ACCEPTANCE_REMOTE_READBACK=PASS'
