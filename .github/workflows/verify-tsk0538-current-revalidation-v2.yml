name: Verify TSK-0538 current reliability NFR revalidation v2

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0538-verify-v2-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Run structural current verifier
        run: python3 .github/scripts/verify_tsk0538_current_revalidation.py
