name: Stage TSK-0243 public-target WAITING checkpoint

on:
  push:
    branches:
      - evidence/tsk0243-public-preflight-waiting-20260904
    paths:
      - .github/workflows/stage-tsk0243-public-waiting-checkpoint-20260904.yml

permissions:
  contents: write

jobs:
  stage-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard patch self-remove and push source branch
        shell: bash
        run: |
          set -Eeuo pipefail
          branch='evidence/tsk0243-public-preflight-waiting-20260904'
          workflow='.github/workflows/stage-tsk0243-public-waiting-checkpoint-20260904.yml'
          evidence='TSK_0243_PUBLIC_TARGET_PREFLIGHT_WAITING_2026-09-04.md'
          test "${GITHUB_REF_NAME}" = "${branch}"
          test "$(git log -1 --pretty=%s)" = 'stage TSK-0243 public-target WAITING checkpoint'
          test "$(git rev-parse HEAD^)" = '1df2b914d4eac4dcc4a2d9116306c1bec6440b42'
          test "$(git hash-object CURRENT_STATE.md)" = '9e9617db4f27cc9479751210b650f9e9e3ee224c'
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = '142a0d45b381136567d78545f063333f1e74901f'
          test "$(git hash-object "${evidence}")" = 'e4ba30be0374745d994404c1d092e769d5c2abb3'
          grep -Fq '## TSK-0243 current accepted stable state — 2026-09-04 — ISOLATED TARGET EVIDENCE PARTIAL' CURRENT_STATE.md
          grep -Fq '`TSK-0243` remains `TODO`.' CURRENT_STATE.md
          ! grep -Fq '## TSK-0243 current accepted stable state — 2026-09-04 — PUBLIC TARGET PREFLIGHT WAITING' CURRENT_STATE.md
          grep -Fq '**Disposition:** **WAITING' "${evidence}"
          echo 'TSK0243_WAITING_STAGE_INPUT_BINDING=PASS'

          python3 - <<'PY'
          from pathlib import Path
          import datetime
          import re

          path = Path('CURRENT_STATE.md')
          before = path.read_text(encoding='utf-8')
          marker = '## TSK-0243 current accepted stable state — 2026-09-04 — PUBLIC TARGET PREFLIGHT WAITING'
          if marker in before:
              raise SystemExit('checkpoint marker already present')
          if before.count('**Updated:**') != 1:
              raise SystemExit('unexpected Updated field cardinality')
          stamp = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          updated, n = re.subn(r'^\*\*Updated:\*\* .+$', f'**Updated:** {stamp}', before, count=1, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit('Updated field replacement failed')
          lines = [
              '',
              '',
              '## TSK-0243 current accepted stable state — 2026-09-04 — PUBLIC TARGET PREFLIGHT WAITING',
              '',
              '`TSK-0243 — Implement privacy-safe DNS protection verification`: **WAITING** under current `ACC-0243 / VER-0243 / EVD-0243`. The task is not PASS.',
              '',
              'New durable evidence:',
              '',
              '- `TSK_0243_PUBLIC_TARGET_PREFLIGHT_WAITING_2026-09-04.md`.',
              '- Exact external preflight head `8f2bae96a137e5b62eb6c2ac6409b607000f89d2`; GitHub Actions run/job `33900198638 / 101112216583`: **PASS** read-only diagnostic.',
              '- Public DNS service is externally present: `dns.usesafeweb.com` resolved to `52.157.109.120`; TLS verification passed on ports 443 and 853; a read-only GET to `/dns-query` returned HTTP 400.',
              '- Required public verifier route is absent: neither `verify.usesafeweb.com` nor a 32-hex `*.verify.usesafeweb.com` challenge host resolved externally.',
              '- Public web origin `https://usesafeweb.com/` and read-only GET to `/api/dns-verification/requests` returned HTTP 502 during the same external preflight.',
              '- No verification POST, DNS query payload, public DNS/proxy/certificate/AdGuard mutation, participant/payment/activation/launch action, or repository-main mutation occurred in the preflight.',
              '',
              'WAITING condition:',
              '',
              '- A separately authorized target deployment/configuration must make a 32-hex `*.verify.usesafeweb.com` host externally resolvable, provide the approved TLS/proxy `/api/dns-verification/probes` path, and restore a healthy externally reachable application origin for `/api/dns-verification/requests` and `/api/dns-verification/results`.',
              '- Deterministic recheck: rerun the bounded read-only public preflight from an external GitHub-hosted runner. Only after those routing prerequisites pass may a separately authorized functional target proof exercise request -> public DNS rewrite -> TLS probe -> signed result -> Protection Map.',
              '',
              'Preserved boundaries:',
              '',
              '- The earlier isolated-target evidence remains valid partial evidence only; it does not establish the missing public trust boundary.',
              '- No WBS, dependency, gate, acceptance, verification, interface, requirement, authority, deployment, participant, payment, telemetry, market-activation or launch semantics changed.',
              '- Persistent identifiable query logging/file logging and identifiable per-client statistics remain prohibited by `CON-0007 / CON-0008`.',
              '',
              'Queue consequence:',
              '',
              '- Recompute the governed frontier after canonical promotion/read-back. Do not select TSK-0243 again until its deterministic WAITING condition is observed as satisfied.',
          ]
          path.write_text(updated.rstrip() + '\n' + '\n'.join(lines) + '\n', encoding='utf-8')
          PY
          echo 'TSK0243_WAITING_CHECKPOINT_PATCH=PASS'

          rm "${workflow}"
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n%s\n' "${workflow}" 'CURRENT_STATE.md' | sort)"
          test "${changed}" = "${expected}"
          echo 'TSK0243_WAITING_CHANGESET_GUARD=PASS'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md "${workflow}"
          staged="$(git diff --cached --name-only | sort)"
          test "${staged}" = "${expected}"
          git commit -m 'checkpoint: record TSK-0243 public-target WAITING'
          git push origin "HEAD:refs/heads/${branch}"
          echo 'TSK0243_WAITING_BRANCH_ONLY_SYNC_PUSH=PASS'
