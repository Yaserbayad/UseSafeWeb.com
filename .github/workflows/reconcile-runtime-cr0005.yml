name: Reconcile CR-0005 runtime state

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-runtime-cr0005.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-governance-state
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Reconcile current runtime authority
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          python3 .github/scripts/reconcile_runtime_cr0005.py
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          [[ ${#changed[@]} -eq 1 && "${changed[0]}" == 'CURRENT_STATE.md' ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          if git diff --cached --quiet; then
            echo 'RUNTIME_CR0005_ALREADY_RECONCILED=PASS'
            exit 0
          fi
          git commit -m 'state: adopt integrated-product-first validation sequence'
          git push origin HEAD:main
          echo 'RUNTIME_CR0005_RECONCILIATION=PASS'
