name: Verify TSK-0333 SafeWeb brand revalidation
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/verify_tsk0333_safeweb_brand_revalidation_20260901.py'
      - '.github/workflows/verify-tsk0333-safeweb-brand-revalidation-20260901.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Verify SafeWeb identity and full integrated regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/verify_tsk0333_safeweb_brand_revalidation_20260901.py
          runtime_dir="$RUNNER_TEMP/tsk0333-brand-browser-runtime"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          npm install --prefix "$runtime_dir" --no-save --no-package-lock playwright@1.62.0
          playwright_module="$runtime_dir/node_modules/playwright"
          PLAYWRIGHT_BROWSERS_PATH="$runtime_dir/browsers" "$runtime_dir/node_modules/.bin/playwright" install chromium
          python3 -m http.server 8033 --bind 127.0.0.1 >/tmp/tsk0333-brand-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS 'http://127.0.0.1:8033/prototype/TSK-0333/index.html' >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS 'http://127.0.0.1:8033/prototype/TSK-0333/index.html' >/dev/null
          patched="$RUNNER_TEMP/tsk0333-safeweb-browser.mjs"
          sed 's/UseSafeWeb/SafeWeb/g' .github/scripts/verify_tsk0333_post_cr0007_browser_20260831.mjs > "$patched"
          TSK0333_BASE_URL='http://127.0.0.1:8033/prototype/TSK-0333/index.html' TSK0333_PLAYWRIGHT_MODULE="$playwright_module" PLAYWRIGHT_BROWSERS_PATH="$runtime_dir/browsers" node "$patched"
          git diff --check
          test -z "$(git status --porcelain)"
