name: Reconcile TSK-0310 PASS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-runtime-tsk0310-pass.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-governance-state
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Reconcile TSK-0310 PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          python3 .github/scripts/reconcile_runtime_tsk0310_pass.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          if git diff --cached --quiet; then
            echo 'RUNTIME_ALREADY_RECONCILED=PASS'
            exit 0
          fi
          git commit -m 'state: accept TSK-0310 rendered browser verification'
          git push origin HEAD:main
          echo 'RUNTIME_TSK0310_PASS_RECONCILIATION=PASS'
