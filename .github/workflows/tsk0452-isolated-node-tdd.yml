name: TSK-0452 isolated Node TDD

on:
  push:
    branches:
      - tsk0452-isolated-node-runtime

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Run focused deployment contract
        run: node --test website/tests/contract/tsk0243-deployment.test.mjs
