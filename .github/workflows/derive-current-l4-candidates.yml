name: Derive current L4 candidate queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/derive-current-l4-candidates.yml'

permissions:
  contents: read

jobs:
  derive:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Derive dependency-satisfied L4 candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,re
          from pathlib import Path
          state=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          pass_ids=set()
          # Runtime PASS evidence is expressed in accepted stable sections/inline task entries.
          for m in re.finditer(r'`(TSK-\d{4})[^`]*`:\s*\*\*PASS\b', state):
              pass_ids.add(m.group(1))
          # Also recognize accepted-stable headings followed by a task id and PASS nearby.
          for block in re.split(r'(?=### TSK-\d{4} accepted stable state)', state):
              hm=re.match(r'### (TSK-\d{4}) accepted stable state', block)
              if hm and '**PASS' in block[:1800]:
                  pass_ids.add(hm.group(1))
          print('PASS_COUNT',len(pass_ids))
          print('PASS_IDS',';'.join(sorted(pass_ids)))
          with open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          priority={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          candidates=[]
          unresolved=[]
          for idx,r in enumerate(rows):
              if r.get('Lifecycle_Stage')!='L4': continue
              if r.get('Plan_Status') not in {'PLANNED','IN_PROGRESS','ACTIVE',''}: continue
              if r.get('Action_Authority')!='AUTO_ALLOWED': continue
              tid=r['Task_ID']
              if tid in pass_ids: continue
              deps=[d.strip() for d in r.get('Dependencies','').split(';') if d.strip()]
              missing=[d for d in deps if d not in pass_ids]
              rec=(priority.get(r.get('Priority',''),9),idx,tid,r.get('Title',''),r.get('Execution_State',''),deps,missing,r.get('Trigger',''),r.get('Preconditions',''),r.get('Acceptance_Criteria',''))
              if not missing:
                  candidates.append(rec)
              else:
                  unresolved.append(rec)
          for rec in sorted(candidates):
              print('CANDIDATE priority=%s order=%s id=%s state=%s deps=%s title=%s trigger=%s pre=%s acc=%s' % (rec[0],rec[1],rec[2],rec[4],';'.join(rec[5]),rec[3],rec[7],rec[8],rec[9]))
          print('CANDIDATE_COUNT',len(candidates))
          PY