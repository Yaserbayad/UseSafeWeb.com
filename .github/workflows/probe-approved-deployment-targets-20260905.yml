name: Probe approved deployment targets 20260905

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-approved-deployment-targets-20260905.yml'

permissions:
  contents: read

jobs:
  web_target_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read-only network probe for approved web target
        shell: bash
        run: |
          set -Eeuo pipefail
          target='20.71.90.212'
          for port in 22 80 443; do
            if timeout 5 bash -c "</dev/tcp/${target}/${port}" 2>/dev/null; then
              echo "WEB_TARGET_PORT_${port}=REACHABLE"
            else
              echo "WEB_TARGET_PORT_${port}=NOT_REACHABLE"
            fi
          done
          http_code=$(curl -sS --max-time 8 -o /dev/null -w '%{http_code}' -H 'Host: usesafeweb.com' "http://${target}/" || true)
          echo "WEB_TARGET_HTTP_HOST_CODE=${http_code:-000}"
          https_code=$(curl -skS --max-time 8 -o /dev/null -w '%{http_code}' --resolve "usesafeweb.com:443:${target}" 'https://usesafeweb.com/' || true)
          echo "WEB_TARGET_HTTPS_RESOLVED_CODE=${https_code:-000}"
          ssh_banner=$(timeout 4 bash -c "exec 3<>/dev/tcp/${target}/22; head -n 1 <&3" 2>/dev/null | tr -cd '[:print:]' | head -c 120 || true)
          if [ -n "$ssh_banner" ]; then echo "WEB_TARGET_SSH_BANNER=${ssh_banner}"; else echo 'WEB_TARGET_SSH_BANNER=UNAVAILABLE'; fi
          echo 'WEB_TARGET_PROBE=COMPLETE'
