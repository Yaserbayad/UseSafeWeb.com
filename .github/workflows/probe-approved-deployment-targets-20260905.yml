name: Probe approved deployment targets 20260905

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-approved-deployment-targets-20260905.yml'

permissions:
  contents: read

jobs:
  web_ssh_probe:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Verify current self-hosted runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "HOSTNAME=$(hostname -s 2>/dev/null || hostname)"
          . /etc/os-release
          echo "OS=${ID:-unknown}-${VERSION_ID:-unknown}"
      - name: Read-only batch SSH probe to approved web target
        shell: bash
        run: |
          set -Eeuo pipefail
          target='20.71.90.212'
          out=''
          rc=0
          out=$(timeout 12 ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=5 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o GlobalKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            azureusr@"${target}" \
            'printf "WEB_SSH_AUTH=PASS\nHOSTNAME=%s\n" "$(hostname -s 2>/dev/null || hostname)"; . /etc/os-release; printf "OS=%s-%s\n" "$ID" "$VERSION_ID"; if sudo -n true 2>/dev/null; then echo SUDO_NONINTERACTIVE=PASS; else echo SUDO_NONINTERACTIVE=FAIL; fi' 2>&1) || rc=$?
          if [ "$rc" -eq 0 ]; then
            printf '%s\n' "$out"
          else
            echo "WEB_SSH_AUTH=NOT_PROVEN"
            echo "WEB_SSH_EXIT=${rc}"
            case "$out" in
              *'Permission denied'*) echo 'WEB_SSH_REASON=AUTHENTICATION_NOT_AVAILABLE' ;;
              *'Connection timed out'*|*'Connection refused'*|*'No route to host'*) echo 'WEB_SSH_REASON=NETWORK_FAILURE' ;;
              *) echo 'WEB_SSH_REASON=OTHER_FAIL_CLOSED' ;;
            esac
          fi
          echo 'WEB_SSH_PROBE=COMPLETE'
