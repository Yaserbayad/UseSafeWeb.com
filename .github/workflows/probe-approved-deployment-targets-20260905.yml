name: Probe approved deployment targets 20260905

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-approved-deployment-targets-20260905.yml'

permissions:
  contents: read

jobs:
  dns_target_probe:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Read-only DNS host identity and target binding probe
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "HOSTNAME=$(hostname -s 2>/dev/null || hostname)"
          . /etc/os-release
          echo "OS=${ID:-unknown}-${VERSION_ID:-unknown}"
          if sudo -n true 2>/dev/null; then echo 'SUDO_NONINTERACTIVE=PASS'; else echo 'SUDO_NONINTERACTIVE=FAIL'; fi
          echo "ADGUARD_ACTIVE=$(systemctl is-active AdGuardHome 2>/dev/null || true)"
          outbound_ip=$(curl -fsS --max-time 8 https://api.ipify.org 2>/dev/null || true)
          echo "OUTBOUND_PUBLIC_IP=${outbound_ip:-unavailable}"
          if sudo ss -H -lntu 2>/dev/null | awk '{print $5}' | grep -Eq '(^|:)53$'; then echo 'DNS_PORT_53_LISTENER=PRESENT'; else echo 'DNS_PORT_53_LISTENER=ABSENT'; fi
          echo 'DNS_TARGET_BINDING_PROBE=COMPLETE'
