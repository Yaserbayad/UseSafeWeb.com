name: Probe approved deployment targets 20260905

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-approved-deployment-targets-20260905.yml'

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Extract exact frozen deployment contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv, json
          wanted = {'TSK-0452','TSK-0243'}
          with open('Plans/Master/WBS/master-wbs.csv', newline='', encoding='utf-8-sig') as f:
              rows = [r for r in csv.DictReader(f) if r.get('ID') in wanted or r.get('Task_ID') in wanted]
          if len(rows) != 2:
              raise SystemExit(f'expected 2 rows, got {len(rows)}')
          for r in rows:
              keep = {k:v for k,v in r.items() if k and v and (k in {
                  'Task_ID','Title','Dependencies','Acceptance_Criteria','Verification_Method','Evidence_Reference','Action_Authority','Priority','Execution_State'
              } or 'Authority' in k or 'Acceptance' in k or 'Verification' in k or 'Evidence' in k)}
              print('CONTRACT=' + json.dumps(keep, sort_keys=True))
          PY
      - name: Read repository runner inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          response="$(curl -fsS --retry 2 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100")"
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['RESPONSE'])
          print(f"RUNNER_COUNT={data.get('total_count',0)}")
          for r in sorted(data.get('runners',[]), key=lambda x:x.get('name','')):
              labels=','.join(sorted(l.get('name','') for l in r.get('labels',[])))
              print(f"RUNNER name={r.get('name')} status={r.get('status')} busy={str(r.get('busy')).lower()} labels={labels}")
          PY
