name: Apply verified parent-dashboard master-plan amendment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-master-plan-amendment.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact base and reconstruct validated patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/UseSafeWeb_Master_Plan.md)" = "ff4c810e3f8a0a41818e4a5dd8c48d68a78be4e5"
          cat .github/plan-amendment.part00 .github/plan-amendment.part01 .github/plan-amendment.part02 .github/plan-amendment.part03 > /tmp/plan.patch.gz.b64
          echo "314013dd5ca5896c9262a98022ba6601fa03dbf86ee563bc5ea83d01556b8d3c  /tmp/plan.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/plan.patch.gz.b64 | gzip -dc > /tmp/plan.patch
          sed -i '1c--- a/Plans/UseSafeWeb_Master_Plan.md' /tmp/plan.patch
          sed -i '2c+++ b/Plans/UseSafeWeb_Master_Plan.md' /tmp/plan.patch
          git apply --check /tmp/plan.patch

      - name: Apply and verify amended master plan
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/plan.patch
          sed -i '/^\*\*Artifact persistence state:\*\*/c\**Artifact persistence state:** Owner-authorised parent-dashboard/AdGuard-control-plane amendment persisted to GitHub `main` on 2026-08-27; exact resulting commit/blob is fetch-verified before completion is claimed.  ' Plans/UseSafeWeb_Master_Plan.md
          sed -i 's/| Authoritative master execution plan | In Progress |/| Authoritative master execution plan | Completed |/' Plans/UseSafeWeb_Master_Plan.md
          sed -i 's/| Persist and verify centralized master-plan baseline in GitHub | In Progress |/| Persist and verify centralized master-plan baseline in GitHub | Completed |/' Plans/UseSafeWeb_Master_Plan.md
          echo "51be254b1bad67af429854dd1dabd7b5448c10c5c0b04f28e1ee625493ac62ca  Plans/UseSafeWeb_Master_Plan.md" | sha256sum -c -
          git diff --check
          grep -Fq 'Owner-approved first-coded MCP parent dashboard' Plans/UseSafeWeb_Master_Plan.md
          grep -Fq 'Firebase Authentication' Plans/UseSafeWeb_Master_Plan.md
          grep -Fq 'USW-05.03.04' Plans/UseSafeWeb_Master_Plan.md
          grep -Fq 'R-043' Plans/UseSafeWeb_Master_Plan.md
          grep -Fq 'D-040' Plans/UseSafeWeb_Master_Plan.md

      - name: Commit verified amendment and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Plans/UseSafeWeb_Master_Plan.md
          git rm .github/plan-amendment.part00 .github/plan-amendment.part01 .github/plan-amendment.part02 .github/plan-amendment.part03 .github/workflows/apply-master-plan-amendment.yml
          git commit -m 'Integrate parent dashboard and AdGuard control-plane plan'
          git push origin HEAD:main
