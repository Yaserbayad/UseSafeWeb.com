name: TSK-0361 lockfile generator

on:
  push:
    branches:
      - task/tsk-0361-public-site
    paths:
      - website/package.json
      - .github/workflows/tsk0361-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: task/tsk-0361-public-site
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Resolve exact dependency graph
        working-directory: website
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify package manifest was not rewritten
        run: git diff --exit-code -- website/package.json
      - name: Persist generated lockfile to the task branch
        shell: bash
        run: |
          set -euo pipefail
          test -s website/package-lock.json
          git add website/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: lock TSK-0361 website dependencies"
          git fetch origin task/tsk-0361-public-site
          git rebase origin/task/tsk-0361-public-site
          git push origin HEAD:task/tsk-0361-public-site
