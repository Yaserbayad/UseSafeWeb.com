name: Diagnose TSK-0243 checkout startup

on:
  push:
    branches:
      - evidence/tsk0243-isolated-target-partial-20260904
    paths:
      - .github/workflows/stage-tsk0243-partial-checkpoint-20260904.yml

permissions:
  contents: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove checkout startup boundary
        shell: bash
        run: echo 'TSK0243_STAGE_CHECKOUT_STARTUP=PASS'
