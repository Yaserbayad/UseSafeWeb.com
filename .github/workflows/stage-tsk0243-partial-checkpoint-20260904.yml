name: Diagnose TSK-0243 staging workflow startup

on:
  push:
    branches:
      - evidence/tsk0243-isolated-target-partial-20260904
    paths:
      - .github/workflows/stage-tsk0243-partial-checkpoint-20260904.yml

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
