name: Stage TSK-0243 partial checkpoint evidence

on:
  push:
    branches:
      - evidence/tsk0243-isolated-target-partial-20260904
    paths:
      - .github/workflows/stage-tsk0243-partial-checkpoint-20260904.yml

permissions:
  contents: write

jobs:
  stage-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard patch self-remove and push source branch
        shell: bash
        run: |
          set -euo pipefail
          branch='evidence/tsk0243-isolated-target-partial-20260904'
          workflow='.github/workflows/stage-tsk0243-partial-checkpoint-20260904.yml'
          evidence='TSK_0243_ISOLATED_TARGET_PARTIAL_EVIDENCE_2026-09-04.md'
          test "$(git log -1 --pretty=%s)" = 'apply simplified TSK-0243 checkpoint synchronizer'
          test "${GITHUB_REF_NAME}" = "${branch}"
          test "$(git rev-parse HEAD^)" = '0033c6cdc6ded4c3ec4f87c983a209a14b91b18f'
          test "$(git hash-object CURRENT_STATE.md)" = '7fe19e2f3df94974764bc27ae903c781cb8f9734'
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = '142a0d45b381136567d78545f063333f1e74901f'
          test "$(git hash-object "${evidence}")" = '4884685af21f73629b3b98979075649b5b105e67'
          grep -Fq 'TSK-0243 remains `TODO`' CURRENT_STATE.md
          grep -Fq 'No deployment, live-device/profile/certificate action' CURRENT_STATE.md
          grep -Fq 'Evidence status: partial only; `TSK-0243 = TODO`.' "${evidence}"

          python3 - <<'PY'
          from pathlib import Path
          import datetime
          import re

          path = Path('CURRENT_STATE.md')
          before = path.read_text(encoding='utf-8')
          marker = '## TSK-0243 current accepted stable state — 2026-09-04 — ISOLATED TARGET EVIDENCE PARTIAL'
          if marker in before:
              raise SystemExit('checkpoint marker already present')
          if before.count('**Updated:**') != 1:
              raise SystemExit('unexpected Updated field cardinality')
          stamp = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          updated, n = re.subn(r'^\*\*Updated:\*\* .+$', f'**Updated:** {stamp}', before, count=1, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit('Updated field replacement failed')
          block = r'''

## TSK-0243 current accepted stable state — 2026-09-04 — ISOLATED TARGET EVIDENCE PARTIAL

`TSK-0243` remains `TODO`. A bounded isolated-target proof now provides durable target-like evidence without changing any production/public runtime.

Accepted partial evidence:

- `TSK_0243_ISOLATED_TARGET_PARTIAL_EVIDENCE_2026-09-04.md`.
- Exact proof source head `5a60d95197948d5d46f96224765345e10c73dcde`.
- GitHub Actions run/job `33888891780 / 101075410406`: **PASS** on the exact proof head.
- The isolated proof passed DNS rewrite, TLS host authentication, wrong-origin fail-closed, signed-result/tamper handling, browser Protection Map, rate limiting, query-history-storage absence, public false-positive guard, and rollback/teardown checks.
- Final safety guard: `TSK0243_LIVE_ADGUARD_UNCHANGED=PASS`; `TSK0243_EPHEMERAL_TEARDOWN=PASS`; production DNS/proxy/certificate mutation `NONE`; participant/payment/launch action `NONE`.
- Evidence disposition: `PARTIAL_TARGET_EVIDENCE_ONLY`.

Acceptance status:

- No WBS, dependency, gate, `ACC-0243`, `VER-0243`, `EVD-0243`, authorization, or material-action semantics changed.
- The isolated proof does **not** establish the remaining production/public externally routed DNS/TLS/proxy trust boundary required by the current target-environment verification contract; `TSK-0243` is not PASS.
- Production/public deployment, DNS/proxy/certificate/profile/service mutation, participant processing, payment, activation, and launch remain not authorized/not completed by this evidence.

Queue consequence:

- This synchronization publishes partial evidence only; it creates no task/gate/milestone status transition.
- After canonical promotion and read-back, recompute the deterministic eligible frontier from the current durable Master Plan and checkpoint before further governed work.
'''
          path.write_text(updated.rstrip() + block + '\n', encoding='utf-8')
          PY

          rm "${workflow}"
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n%s\n' "${workflow}" 'CURRENT_STATE.md' | sort)"
          test "${changed}" = "${expected}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md "${workflow}"
          staged="$(git diff --cached --name-only | sort)"
          test "${staged}" = "${expected}"
          git commit -m 'checkpoint: record TSK-0243 isolated target partial proof'
          git push origin "HEAD:refs/heads/${branch}"
          echo 'TSK0243_STAGE_INPUT_BINDING=PASS'
          echo 'TSK0243_CHECKPOINT_PATCH=PASS'
          echo 'TSK0243_BRANCH_ONLY_SYNC_PUSH=PASS'
