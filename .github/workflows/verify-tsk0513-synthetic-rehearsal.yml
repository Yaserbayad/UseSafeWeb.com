name: Verify TSK-0513 synthetic rehearsal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-tsk0513-synthetic-rehearsal.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-governance-tsk0513-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Verify synthetic rehearsal and publish evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git hash-object CURRENT_STATE.md)" == '4f438a44a51b9f77e1434f6a3b2e300bd5a1c819' ]]
          [[ "$(git hash-object fixtures/experiment1/TSK_0513_SYNTHETIC_REHEARSAL_FIXTURE_V1.json)" == '8189de9d6f5fa554ff23fb127f95604c8fc381a5' ]]
          [[ "$(git hash-object TSK_0513_END_TO_END_SYNTHETIC_REHEARSAL_2026-08-28.md)" == '1c90d5e5734832c1e5b26d83fdb21e6aefc2305e' ]]
          [[ "$(git hash-object EXPERIMENT_01_CONCIERGE_VALIDATION.md)" == 'bc801da11d7a7f2a5315d1cdca4f0d134afe7805' ]]
          [[ "$(git hash-object EXPERIMENT_01_PARTICIPANT_RECORD_SCHEMA.md)" == 'c7706fceced87c797b8cd92179198754e2b08ffe' ]]
          [[ "$(git hash-object EXPERIMENT_01_SUPPORT_FALSE_POSITIVE_INTAKE.md)" == '9fab42f97e3e96023de89a8ed266acc21c0f06ab' ]]
          [[ "$(git hash-object TSK_0167_PARTICIPANT_COMMUNICATION_TEMPLATES_EVIDENCE_2026-08-28.md)" == '06506a61d8065bfa812f6df49006d840ef2339ff' ]]
          test ! -e TSK_0513_END_TO_END_SYNTHETIC_REHEARSAL_EVIDENCE_2026-08-28.md

          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          with open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='') as f:
              rows={r['Task_ID']:r for r in csv.DictReader(f)}
          r=rows['TSK-0513']
          assert r['Title']=='Run end-to-end synthetic rehearsal'
          assert r['Dependencies']=='TSK-0167; TSK-0169; TSK-0214; TSK-0510'
          assert r['AI_Capability_A0_A4']=='A3'
          assert r['Action_Authority']=='AUTO_ALLOWED'
          assert r['Acceptance_ID']=='ACC-0513'
          assert r['Acceptance_Criteria']=='Every step completes with synthetic data; no prohibited data is captured; blockers are fixed or explicitly accepted before G-03.'

          d=json.loads(Path('fixtures/experiment1/TSK_0513_SYNTHETIC_REHEARSAL_FIXTURE_V1.json').read_text(encoding='utf-8'))
          assert d['synthetic_only'] is True
          assert d['real_participant'] is False
          assert d['release_boundary']['lg03_g02_disposition']=='DEFER'
          assert d['release_boundary']['recruitment_authorized'] is False
          assert d['release_boundary']['real_participant_processing_authorized'] is False
          assert d['release_boundary']['participant_facing_templates_released'] is False
          for section in ['participant_metric_record','synthetic_intervention','synthetic_support_branch','synthetic_withdrawal_branch']:
              pid=d[section].get('participant_id')
              if pid is not None: assert pid.startswith('SYN-')
          assert d['synthetic_safeguarding_boundary']['case_id'].startswith('SYN-')

          p=d['participant_metric_record']
          required=['participant_id','wave','qualification_result','qualification_reason_code','caregiver_setup_responsibility','child_stage_band','phone_timing_band','device_family','phone_state','willing_real_changes','non_surveillance_fit','relevant_service_category','native_safeguard_state','baseline_dns_protection_state','service_safeguard_state','protection_map_reached','incremental_non_dns_safeguard_completed','full_activation','time_to_full_activation_minutes','active_assistance_minutes','assistance_category','facilitator_completed_parent_action','pause_resume_occurred','abandoned','abandonment_stage','abandonment_reason_category','parent_reports_duplicated_or_added_work','coverage_gap_1_understood','coverage_gap_2_understood','two_gap_comprehension_pass','immediate_false_positive_or_compatibility_issue','issue_category','support_case_id','baseline_disabled_during_session_due_to_issue','followup_14d_completed','baseline_protection_14d_state','baseline_not_active_reason_category']
          assert set(p)==set(required)
          assert p['wave'] in {'A','B'}
          assert p['qualification_result'] in {'pass','fail'}
          assert p['device_family'] in {'iphone','android'}
          assert p['phone_state'] in {'new_phone','already_used_phone'}
          assert p['native_safeguard_state'] in {'already_present_parent_confirmed','completed_during_session','action_needed','not_applicable','not_covered','failed'}
          assert p['baseline_dns_protection_state'] in {'activated_verified','activation_failed','not_attempted_stop','removed_during_session'}
          assert p['service_safeguard_state'] in {'already_present_parent_confirmed','completed_during_session','action_needed','not_applicable','not_covered','failed'}
          assert p['facilitator_completed_parent_action']=='no'
          assert p['coverage_gap_1_understood']=='yes' and p['coverage_gap_2_understood']=='yes'
          assert p['followup_14d_completed'] in {'yes','no','withdrawn'}
          assert p['baseline_protection_14d_state'] in {'active','disabled','broken','unknown_no_followup','withdrawn'}

          forbidden_keys={'child_name','exact_date_of_birth','school','child_email','child_phone','precise_location','contacts','messages','photos','social_username','browsing_history','dns_query_history','visited_domain_history','urls','payment_card_data','password','authentication_code','token','private_key','raw_diagnostic_logs'}
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      assert k not in forbidden_keys, k
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(d)

          report=Path('TSK_0513_END_TO_END_SYNTHETIC_REHEARSAL_2026-08-28.md').read_text(encoding='utf-8')
          for n in range(1,17):
              assert f'| {n} |' in report
          required_report=[
              'Synthetic support / false-positive branch','Synthetic withdrawal/removal branch','Synthetic safeguarding boundary',
              'Prohibited-data audit','Rehearsal-execution blockers','**None.**','G-02 / LG-03 = **DEFER**',
              'recruitment = **NOT AUTHORIZED**','real-participant processing = **NOT AUTHORIZED**',
              'TSK-0513 acceptance disposition: PASS candidate'
          ]
          for x in required_report: assert x in report, x
          assert 'Recruitment authorized: YES' not in report
          assert 'LG-03 = PASS' not in report

          succ=[]
          for x in rows.values():
              deps=[z.strip() for z in x['Dependencies'].split(';') if z.strip()]
              if 'TSK-0513' in deps:
                  succ.append(x)
          succ.sort(key=lambda x:x['Task_ID'])
          with open('/tmp/tsk0513-successors.txt','w',encoding='utf-8') as f:
              for x in succ:
                  f.write('| {Task_ID} | {Lifecycle_Stage} | {Title} | {Plan_Status} | {Execution_State} | {Priority} | {Dependencies} | {AI_Capability_A0_A4} | {Action_Authority} | {Trigger} |\n'.format(**x))
          print('TSK_0513_WBS_ACCEPTANCE=PASS')
          print('TSK_0513_SYNTHETIC_SCHEMA=PASS')
          print('TSK_0513_PROHIBITED_DATA_AUDIT=PASS')
          print('TSK_0513_MAIN_PATH=16/16')
          print('TSK_0513_BRANCHES=3/3')
          print('TSK_0513_INDEPENDENT_AUDIT=PASS')
          PY

          cat > TSK_0513_END_TO_END_SYNTHETIC_REHEARSAL_EVIDENCE_2026-08-28.md <<EOF
          # TSK-0513 — End-to-end synthetic rehearsal verification evidence

          **Task:** TSK-0513 — Run end-to-end synthetic rehearsal  
          **Acceptance:** ACC-0513  
          **Date:** 2026-08-28  
          **Verification:** guarded GitHub Actions machine audit  
          **Run:** ${GITHUB_RUN_ID}  
          **Job:** ${GITHUB_JOB}

          ## Exact artifacts

          - Rehearsal report: \`TSK_0513_END_TO_END_SYNTHETIC_REHEARSAL_2026-08-28.md\`, blob \`1c90d5e5734832c1e5b26d83fdb21e6aefc2305e\`.
          - Synthetic fixture: \`fixtures/experiment1/TSK_0513_SYNTHETIC_REHEARSAL_FIXTURE_V1.json\`, blob \`8189de9d6f5fa554ff23fb127f95604c8fc381a5\`.
          - WBS: \`Plans/Master/WBS/master-wbs.csv\`, blob \`2e4560103b71bb350b14673ce3e415afc3dbfe3a\`.
          - Runtime state before TSK-0513 reconciliation: \`4f438a44a51b9f77e1434f6a3b2e300bd5a1c819\`.

          ## Verification result

          The machine audit parsed the exact TSK-0513 WBS row and ACC-0513 text, validated all required synthetic participant-schema fields and controlled values, verified all participant/case IDs are explicit \`SYN-*\` fixtures with no real-person mapping, checked the 16-step main rehearsal path, verified support/false-positive, withdrawal/removal and safeguarding-boundary branches, and rejected the defined prohibited-data key classes.

          Rehearsal-execution blockers: none. Real-participant legal/contact blockers remain explicitly DEFERRED/OPEN and are **not** treated as cleared for G-03/LG-04. G-02/LG-03 remains DEFER; recruitment and real-participant processing remain unauthorized.

          **Stable verification outcome: TSK-0513 = PASS candidate pending runtime reconciliation/read-back.**

          ## Direct WBS successors containing TSK-0513 as a hard dependency

          | Task | Stage | Title | Plan status | WBS execution state | Priority | Dependencies | AI capability | Action authority | Trigger |
          | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
          EOF
          cat /tmp/tsk0513-successors.txt >> TSK_0513_END_TO_END_SYNTHETIC_REHEARSAL_EVIDENCE_2026-08-28.md

          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TSK_0513_END_TO_END_SYNTHETIC_REHEARSAL_EVIDENCE_2026-08-28.md
          git commit -m 'qa: verify TSK-0513 synthetic rehearsal'
          git push origin HEAD:main
