name: Reconcile TSK-0311 localization PASS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0311-pass-20260829.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact TSK-0311 pre-state
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "a89257b0bf27ae614967549dab4690af94a08d2d"
          test "$(git hash-object TSK_0311_LOCALIZATION_CONTENT_ARCHITECTURE_2026-08-29.md)" = "ef746d64c7878eb7d0f1b8fdf2356721728041c4"
          test "$(git hash-object TSK_0311_LOCALIZATION_CONTENT_ARCHITECTURE_EVIDENCE_2026-08-29.md)" = "b9e7770faa0fa94a35d98d8141dec367583233f7"
          grep -Fq '### TSK-0318 accepted stable state' CURRENT_STATE.md
          grep -Fq '### TSK-0319 accepted stable state' CURRENT_STATE.md
      - name: Append bounded TSK-0311 PASS state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          updated = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('**Updated:** '):
                  lines[i] = f'**Updated:** {updated}'
                  break
          text = '\n'.join(lines) + '\n'
          marker = '## Queue status after TSK-0318 and TSK-0319 PASS\n'
          pos = text.index(marker)
          section = (
              '### TSK-0311 accepted stable state\n\n'
              '`TSK-0311 — Define translation keys/files, locale metadata, plural/date rules, content ownership, localized instruction variants, and fallback behavior`: **PASS for the provisional internal L4 localization/content architecture**. Artifact `TSK_0311_LOCALIZATION_CONTENT_ARCHITECTURE_2026-08-29.md`, blob `ef746d64c7878eb7d0f1b8fdf2356721728041c4`, publication commit `7eb43368af724887405cf3be9cf9363465834b02`; independent evidence `TSK_0311_LOCALIZATION_CONTENT_ARCHITECTURE_EVIDENCE_2026-08-29.md`, blob `b9e7770faa0fa94a35d98d8141dec367583233f7`, publication commit `185063cc1a897b57b17231b3d838365d939b7b7f`.\n\n'
              'ACC-0311 is satisfied: the English baseline is externalized by contract; stable semantic keys and locale files prevent hard-coded UI copy from blocking Turkish/Arabic; locale metadata, RTL behavior, plural/number/date rules, deterministic en-GB fallback, instruction-source binding, content ownership, schema/content versioning and implementation-test assertions are explicit.\n\n'
              'This PASS is design evidence only. It does not prove production locale-file implementation, native-speaker or representative-parent validation, market activation, legal readiness, publication or launch. `RSK-0002` remains OPEN; `REQ-0022` remains unresolved; current global fences remain unchanged.\n\n'
          )
          tail = (
              '## Queue status after TSK-0311 PASS\n\n'
              'TSK-0311 is PASS. Recompute the remaining L4 queue before selecting the next task; specifically verify whether TSK-0310 is still blocked by TSK-0300, otherwise compare it with independently released TSK-0628 under current priority/order rules.\n\n'
              '## Exact next authoritative step\n\n'
              'Inspect current TSK-0300/TSK-0310 authority and dependencies, then execute the highest-priority eligible AUTO_ALLOWED L4 task.\n'
          )
          p.write_text(text[:pos] + section + tail, encoding='utf-8')
          PY
      - name: Verify and commit TSK-0311 PASS
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '### TSK-0311 accepted stable state' CURRENT_STATE.md
          grep -Fq 'ACC-0311 is satisfied' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: mark TSK-0311 PASS'
          git push