name: Reconcile post-CR-0007 TSK-0138 runtime state
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0138-post-cr0007-pass-20260831.yml'
permissions:
  contents: write
concurrency:
  group: usesafeweb-tsk0138-post-cr0007-runtime
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile CURRENT_STATE
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/reconcile_tsk0138_post_cr0007_runtime.py
          git diff --check
          test "$(git diff --name-only)" = "CURRENT_STATE.md"
      - name: Commit and push runtime reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "UseSafeWeb Project Governor"
          git config user.email "actions@users.noreply.github.com"
          git add CURRENT_STATE.md
          git commit -m "state: reaccept post-CR-0007 TSK-0138"
          git push origin HEAD:main
          echo "TSK0138_RUNTIME_COMMIT=$(git rev-parse HEAD)"
          echo "TSK0138_RUNTIME_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
          echo "TSK0138_POST_CR0007_RUNTIME_RECONCILIATION=PASS"