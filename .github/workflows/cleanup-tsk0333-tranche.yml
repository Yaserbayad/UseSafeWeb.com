name: Cleanup TSK-0146 and TSK-0333 temporary tooling
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-tsk0333-tranche.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Remove only temporary governed execution tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          test "$(git rev-parse HEAD:CURRENT_STATE.md)" = "ad3fd01395150b802fbb025a48f7692e82b80244"
          test "$(git rev-parse HEAD:TSK_0146_ACCOUNTLESS_FIRST_BASELINE_ACCEPTANCE_EVIDENCE_2026-08-30.md)" = "91f8cdacb825c2423f0f6d111ee9676d8645e081"
          test "$(git rev-parse HEAD:TSK_0333_END_TO_END_RESPONSIVE_INTERACTIVE_PROTOTYPE_EVIDENCE_2026-08-30.md)" = "2c7a359a1f55465ee9caed0ec107305141cdb148"
          test "$(git rev-parse HEAD:prototype/TSK-0333/index.html)" = "70bc43e2fac6cae845b69f4e4c2c46fd1c23f15e"
          test "$(git rev-parse HEAD:prototype/TSK-0333/model.mjs)" = "8752ec4d1f0b5450ca70cd379792cdee46336e5f"
          test "$(git rev-parse HEAD:prototype/TSK-0333/app.mjs)" = "95427c081ae6b2dadc259ce93ac9be6ce13b730d"
          test "$(git rev-parse HEAD:prototype/TSK-0333/prototype.css)" = "f92f2bdb507d23d37e009023f1bad3c1665af6a1"
          files=(
            .github/workflows/audit-tsk0333-preflight.yml
            .github/workflows/audit-tsk0333-preflight-v2.yml
            .github/workflows/audit-tsk0146-status.yml
            .github/workflows/audit-tsk0146-evidence.yml
            .github/workflows/verify-tsk0146-baseline.yml
            .github/scripts/reconcile_tsk0146_pass.py
            .github/workflows/reconcile-tsk0146-pass.yml
            .github/workflows/verify-tsk0333-integrated-prototype.yml
            .github/workflows/verify-tsk0333-integrated-prototype-v2.yml
            .github/workflows/verify-tsk0333-integrated-prototype-v3.yml
            .github/workflows/fix-tsk0333-initial-focus.yml
            .github/scripts/fix_tsk0333_initial_focus.py
            .github/workflows/apply-tsk0333-initial-focus-fix.yml
            .github/scripts/reconcile_tsk0333_pass.py
            .github/workflows/reconcile-tsk0333-pass.yml
            .github/workflows/cleanup-tsk0333-tranche.yml
          )
          git rm -f --ignore-unmatch -- "${files[@]}"
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' "${files[@]}" | while read -r f; do git cat-file -e "HEAD:$f" 2>/dev/null && echo "$f" || true; done | sort)"
          [[ "$changed" == "$expected" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary TSK-0146 and TSK-0333 tooling'
          git push origin HEAD:main
          echo "CLEANUP_COMMIT=$(git rev-parse HEAD)"
          echo "CLEANUP_REMOVED_COUNT=$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
