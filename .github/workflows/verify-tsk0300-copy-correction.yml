name: Verify TSK-0300 protection-copy correction

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0300-copy-correction-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify TSK-0300 correction and preservation boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_tsk0300_copy_correction.py
