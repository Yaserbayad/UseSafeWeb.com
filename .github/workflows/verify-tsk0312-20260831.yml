name: Verify TSK-0312 acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0312-20260831.yml'
permissions:
  contents: read
concurrency:
  group: usesafeweb-tsk0312-verify
  cancel-in-progress: false
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact current TSK-0312 acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/verify_tsk0312_20260831.py
          git diff --check
          test -z "$(git status --porcelain)"
