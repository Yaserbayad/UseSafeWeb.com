name: Publish corrected CR-0006 V1 account scope

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-cr0006-v1-accounts-v3-20260830.yml'

permissions:
  contents: write

concurrency:
  group: usesafeweb-cr0006-v1-account-scope-v3
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert exact unchanged planning prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          test "$(git hash-object CURRENT_STATE.md)" = "ad3fd01395150b802fbb025a48f7692e82b80244"
          test "$(git hash-object Plans/Master/MANIFEST.yaml)" = "1fc24e28e70c8005a75d37c1d21aecd4ea967ae5"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "f23b4f017d1baf73258fa30ecd71549bbfe1b815"
          test "$(git hash-object Plans/Master/RELATIONSHIP_INDEX.yaml)" = "9ed219b4ccb6b05e68c6a264fc2b21b1008b02a4"
          test "$(git hash-object Plans/Master/Tools/validate_master_plan.py)" = "930328130c0baba99e77cd78f28f3ece7ddcf855"
      - name: Apply corrected CR-0006 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/cr0006_reconcile_v3.py
      - name: Rebuild generated plan and checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 Plans/Master/Tools/rebuild_master_plan.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          sums=Path('Plans/SHA256SUMS.txt'); out=[]
          for line in sums.read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              _,rel=line.split('  ',1); p=Path('Plans')/rel
              out.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}')
          sums.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Full deterministic and semantic validation
        shell: bash
        run: |
          set -euo pipefail
          python3 Plans/Master/Tools/validate_master_plan.py | tee /tmp/cr0006-validation.txt
          grep -Fx 'VALIDATION PASS' /tmp/cr0006-validation.txt
          grep -Fx 'tasks=641' /tmp/cr0006-validation.txt
          grep -Fx 'broken_links=0' /tmp/cr0006-validation.txt
          grep -Fx 'generated_missing_task_ids=0' /tmp/cr0006-validation.txt
          python3 - <<'PY'
          import csv
          from pathlib import Path
          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='') as f:
              rows={r['Task_ID']:r for r in csv.DictReader(f)}
          assert len(rows)==641
          assert rows['TSK-0146']['Plan_Status']=='PLANNED' and rows['TSK-0146']['Execution_State']=='TODO'
          for tid in ['TSK-0312','TSK-0142','TSK-0329','TSK-0331','TSK-0332','TSK-0356','TSK-0377','TSK-0394','TSK-0523']:
              assert rows[tid]['Plan_Status']!='DEFERRED',tid
          assert set(x.strip() for x in rows['TSK-0329']['Dependencies'].split(';'))=={'TSK-0328','TSK-0312'}
          assert set(x.strip() for x in rows['TSK-0333']['Dependencies'].split(';'))=={'TSK-0335','TSK-0334','TSK-0146','TSK-0331'}
          assert set(x.strip() for x in rows['TSK-0321']['Dependencies'].split(';'))=={'TSK-0323','TSK-0324','TSK-0333'}
          assert set(x.strip() for x in rows['TSK-0309']['Dependencies'].split(';'))=={'TSK-0310','TSK-0321','TSK-0187'}
          assert set(x.strip() for x in rows['TSK-0628']['Dependencies'].split(';'))=={'TSK-0319','TSK-0331'}
          assert set(x.strip() for x in rows['TSK-0052']['Dependencies'].split(';'))=={'TSK-0043','TSK-0321','TSK-0309','TSK-0628'}
          assert rows['TSK-0052']['Action_Authority']=='HUMAN_ONLY'
          assert rows['TSK-0398']['Dependencies'].strip()=='TSK-0399'
          assert 'accountless core' in rows['TSK-0052']['Acceptance_Criteria'].lower()
          assert 'browsing/query/activity history' in rows['TSK-0524']['Acceptance_Criteria'].lower()
          for tid in ['TSK-0187','TSK-0326','TSK-0336']:
              assert rows[tid]['Plan_Status']=='NOT_APPLICABLE' and rows[tid]['Execution_State']=='PASS',tid
          text=Path('Plans/Master/WBS/master-wbs.csv').read_text(encoding='utf-8')
          assert text.count('DEC-0053/CR-0006: Version-1 optional parent-account')==43
          assert 'DEFERRED_EXCEPTION EXC-0001: account/persistence capability is not in the current accountless baseline' not in text
          assert 'DEC-0053' in Path('Plans/Master/Registers/DECISIONS_TRIGGERS.md').read_text(encoding='utf-8')
          assert 'CR-0006' in Path('Plans/Master/Registers/EXCEPTIONS_CHANGE_CONTROLS.md').read_text(encoding='utf-8')
          assert 'ACTIVATED_V1_SCOPE' in Path('Plans/Master/Registers/EXCEPTIONS_CHANGE_CONTROLS.md').read_text(encoding='utf-8')
          assert 'latest_change: CR-0006' in Path('Plans/Master/MANIFEST.yaml').read_text(encoding='utf-8')
          graph={k:[x.strip() for x in v['Dependencies'].split(';') if x.strip()] for k,v in rows.items()}
          visiting=set(); done=set()
          def visit(n):
              if n in done:return
              if n in visiting:raise AssertionError('dependency cycle '+n)
              visiting.add(n)
              for d in graph[n]:visit(d)
              visiting.remove(n);done.add(n)
          for n in graph:visit(n)
          print('CR0006_SEMANTIC_ASSERTIONS=PASS')
          PY
          git diff --check
      - name: Commit and push canonical planning amendment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "UseSafeWeb Project Governor"
          git config user.email "actions@users.noreply.github.com"
          git add Plans CR_0006_V1_OPTIONAL_ACCOUNT_SCOPE_EVIDENCE_2026-08-30.md
          git diff --cached --quiet && { echo 'No planning delta'; exit 1; }
          git commit -m "governance: activate Version-1 optional account scope"
          git push origin HEAD:main
          echo "CR0006_COMMIT=$(git rev-parse HEAD)"
          echo "CR0006_WBS_BLOB=$(git rev-parse HEAD:Plans/Master/WBS/master-wbs.csv)"
          echo "CR0006_REL_BLOB=$(git rev-parse HEAD:Plans/Master/RELATIONSHIP_INDEX.yaml)"
          echo "CR0006_MANIFEST_BLOB=$(git rev-parse HEAD:Plans/Master/MANIFEST.yaml)"
          echo "CR0006_VALIDATOR_BLOB=$(git rev-parse HEAD:Plans/Master/Tools/validate_master_plan.py)"
          echo "CR0006_EVIDENCE_BLOB=$(git rev-parse HEAD:CR_0006_V1_OPTIONAL_ACCOUNT_SCOPE_EVIDENCE_2026-08-30.md)"
