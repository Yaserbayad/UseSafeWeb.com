name: Guard publish TSK-0369 source partial evidence

on:
  push:
    branches:
      - guard/tsk-0369-source-evidence-20260903

permissions:
  contents: write

jobs:
  publish-guarded-partial:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Verify immutable authority and generate guarded publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 'f353e557438ec31f4967fd1bda961e1d95a8f4bb'
          test "$(git merge-base HEAD origin/main)" = 'f353e557438ec31f4967fd1bda961e1d95a8f4bb'
          test "$(git hash-object CURRENT_STATE.md)" = '4915576f3a5da13d6db7a9eed5c76d7c2d003a9e'
          test "$(git hash-object Plans/Master/MANIFEST.yaml)" = '0b0238a75926009a50d8503a7fe86bfa94c77708'
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object website/package-lock.json)" = '14f9a62607489f965b96d98cdf0d825a363cd8bc'
          test "$(git hash-object website/src/lib/support-capture.ts)" = 'b8ca3edd73a8c517e46cc9acf132acd9859e759c'
          test "$(git hash-object website/src/app/api/support-capture/route.ts)" = '185655fbccf85f0d2e5e5048143c3cfb483735b2'
          test "$(git hash-object website/tests/contract/tsk0369.test.mjs)" = '4a37c7c16dce3f440869efd8ba99f348ee546688'
          test "$(git hash-object website/package.json)" = '32dd6e912f4fddce22565a09982dac9b74b15053'
          test "$(git hash-object .github/workflows/accept-tsk0369-minimal-support-capture-20260903.yml)" = '81709a917f0f667c719b94f4edcbdf2963a2d0d7'
          test ! -e TSK_0369_MINIMAL_SUPPORT_CAPTURE_SOURCE_IMPLEMENTATION_2026-09-03.md

          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          cd website
          npm ci --ignore-scripts --no-fund --no-audit
          node --test tests/contract/tsk0369.test.mjs
          npm run test:contract
          npm run lint
          npm run typecheck
          NEXT_TELEMETRY_DISABLED=1 npm run build
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          cd ..

          python3 .github/scripts/publish_tsk0369_source_partial.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(CURRENT_STATE.md TSK_0369_MINIMAL_SUPPORT_CAPTURE_SOURCE_IMPLEMENTATION_2026-09-03.md)
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected generated diff:\n%s\n' "${changed[*]}"
            exit 1
          fi
          grep -Fq 'TSK-0369 current accepted stable state — 2026-09-03 — SOURCE IMPLEMENTATION PARTIAL' CURRENT_STATE.md
          grep -Fq 'Task runtime disposition:** TODO' TSK_0369_MINIMAL_SUPPORT_CAPTURE_SOURCE_IMPLEMENTATION_2026-09-03.md
          grep -Fq 'USESAFEWEB_SUPPORT_CAPTURE_ENABLED=1' TSK_0369_MINIMAL_SUPPORT_CAPTURE_SOURCE_IMPLEMENTATION_2026-09-03.md
          ! grep -Fq 'Task runtime disposition:** PASS' TSK_0369_MINIMAL_SUPPORT_CAPTURE_SOURCE_IMPLEMENTATION_2026-09-03.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md TSK_0369_MINIMAL_SUPPORT_CAPTURE_SOURCE_IMPLEMENTATION_2026-09-03.md
          git commit -m 'evidence: record TSK-0369 source partial and runtime TODO'
          git push origin HEAD:guard/tsk-0369-source-evidence-20260903
          echo 'TSK0369_SOURCE_PARTIAL_PUBLICATION_GUARD=PASS'
