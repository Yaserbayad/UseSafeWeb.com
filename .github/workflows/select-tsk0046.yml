name: Select TSK-0046

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/select-tsk0046.yml'

permissions:
  contents: write

jobs:
  select:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify queue and select TSK-0046
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "6de12d4c652e6bb479932f6e3f8168459405a9a8"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "dce5b829c4d447eac180ae1e896e0019292cf971"
          test "$(git hash-object TSK_0044_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md)" = "f60f48143d71e47c70d168f1496486a23b037fa0"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='')))
          by={r['Task_ID']:r for r in rows}
          t=by['TSK-0046']
          deps=[x.strip() for x in t['Dependencies'].split(';') if x.strip()]
          assert deps==['TSK-0538'], deps
          assert by['TSK-0538'].get('Execution_State')=='PASS'
          assert t['Lifecycle_Stage']=='L4' and t['Priority']=='MEDIUM'
          assert t['AI_Capability_A0_A4']=='A3' and t['Action_Authority']=='AUTO_ALLOWED'
          acc=t['Acceptance_Criteria']
          for phrase in ['expected pilot load','safety margin','DNS latency/availability test method','web journey performance','degradation behavior','capacity-review trigger']:
              assert phrase in acc, phrase
          q=pathlib.Path('TSK_0044_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md').read_text()
          seg=q.split('### TSK-0046',1)[1].split('### TSK-0140',1)[0]
          assert '- **Preflight flags:** (none)' in seg
          assert '### TSK-0187' in q and 'REAL_OR_BEHAVIOR_EVIDENCE_CHECK' in q
          assert '### TSK-0140' in q and 'OWNER_REVIEW_CHECK' in q
          p=pathlib.Path('CURRENT_STATE.md')
          text=p.read_text()
          assert '### TSK-0044 accepted stable state' in text
          assert 'No next task is selected by this write' in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          pos=text.rfind('\n## Queue status after current reconciliation')
          assert pos>=0
          text=text[:pos].rstrip()+'''\n\n## Queue status after current reconciliation\n\nThe TSK-0044 post-PASS queue was reread against current acceptance, CR-0003 and open security/privacy deviations. `TSK-0187` remains ineligible because it requires representative-parent evidence. `TSK-0140` remains ineligible for PASS because owner/multi-role review evidence is absent. `TSK-0046` is the only dependency-ready AUTO_ALLOWED L4 candidate with no preflight flag. Canonical WBS directly confirms TSK-0538 current Execution_State=PASS.\n\n- **Selected next: `TSK-0046 — Define performance and capacity NFRs`** (L4 / A3 / AUTO_ALLOWED / MEDIUM).\n- Hard dependency: `TSK-0538` — current PASS.\n- ACC-0046: state expected pilot load, safety margin, DNS latency/availability test method, web journey performance, degradation behavior, and capacity-review trigger.\n- Selection boundary: internal performance/capacity NFR definition only. No fabricated user forecast, load-test execution against real participants, scaling purchase, infrastructure mutation, application build, participant processing or release is authorized.\n\n## Exact next authoritative step\n\nExecute bounded TSK-0046: derive a conservative planning load envelope from the current single-node architecture and pilot/validation constraints without inventing future adoption; define safety margin, privacy-safe DNS latency/availability test method, conditional web-journey performance targets, degradation behavior and measurable capacity-review triggers; preserve the single-node/no-HA baseline until evidence justifies scale; persist/read back independent ACC-0046 evidence; reconcile runtime; then recompute.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md
          git commit -m "state: select TSK-0046"
          git push
