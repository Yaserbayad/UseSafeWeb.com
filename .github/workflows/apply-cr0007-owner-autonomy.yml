name: Apply CR-0007 owner autonomy and production-only lifecycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cr0007-owner-autonomy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply CR-0007 bounded owner-authorized amendment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, re, hashlib, subprocess, collections

          R=Path('Plans/Master')
          P=Path('Plans')
          DATE='2026-08-31'

          def read(rel): return (R/rel).read_text(encoding='utf-8')
          def write(rel,text): (R/rel).write_text(text,encoding='utf-8')
          def replace_row(rel,prefix,newline):
              lines=read(rel).splitlines()
              hits=[i for i,l in enumerate(lines) if l.startswith(prefix)]
              if len(hits)!=1: raise SystemExit(f'{rel} {prefix}: expected 1 row, got {len(hits)}')
              lines[hits[0]]=newline
              write(rel,'\n'.join(lines)+'\n')
          def append_source(row):
              s=(row.get('Source_Reference') or '').strip()
              tag='Project Owner instruction 2026-08-31 / DEC-0054 / CR-0007'
              if tag not in s: row['Source_Reference']=(s+'; '+tag).strip('; ')
          def append_note(row,msg):
              n=(row.get('Notes') or '').strip()
              if msg not in n: row['Notes']=(n+' '+msg).strip()

          # Preconditions: CR/decision IDs must be fresh.
          if 'DEC-0054' in read('Registers/DECISIONS_TRIGGERS.md'):
              raise SystemExit('DEC-0054 already exists')
          if 'CR-0007' in read('Registers/EXCEPTIONS_CHANGE_CONTROLS.md'):
              raise SystemExit('CR-0007 already exists')

          # 1) WBS: apply only owner-authorized authority/lifecycle deltas; preserve state/dependencies.
          wbs=R/'WBS/master-wbs.csv'
          with wbs.open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f)); fields=list(rows[0].keys())
          by={r['Task_ID']:r for r in rows}
          if len(rows)!=641: raise SystemExit(f'WBS task count mismatch {len(rows)}')

          auto_ids={
              'TSK-0140','TSK-0262','TSK-0270','TSK-0273','TSK-0276','TSK-0277','TSK-0278','TSK-0281','TSK-0282',
              'TSK-0314','TSK-0317','TSK-0320','TSK-0322','TSK-0329','TSK-0331','TSK-0332',
              'TSK-0412','TSK-0413','TSK-0417','TSK-0420','TSK-0424','TSK-0465'
          }
          missing=sorted(auto_ids-set(by))
          if missing: raise SystemExit(f'expected authority tasks missing: {missing}')
          changed=set()
          for tid in sorted(auto_ids):
              r=by[tid]
              if 'AI_Capability' in r: r['AI_Capability']='A4'
              if 'Action_Authority' in r: r['Action_Authority']='AUTO_ALLOWED'
              append_source(r)
              append_note(r,'DEC-0054/CR-0007: objective work inside the frozen scope is AUTO_ALLOWED; escalate only a higher-authority blocker or a genuinely nondelegable human act.')
              ac=r.get('Acceptance_Criteria') or ''
              for old,new in [
                  ('explicit Project Owner approval','objective acceptance evidence'),
                  ('Project Owner approval','objective acceptance evidence'),
                  ('explicit owner approval','objective acceptance evidence'),
                  ('owner approval','objective acceptance evidence'),
                  ('Project Owner authorization','objective gate authorization'),
                  ('owner authorization','objective gate authorization'),
                  ('Project Owner review','objective evidence review'),
                  ('owner review','objective evidence review')]:
                  ac=ac.replace(old,new)
              r['Acceptance_Criteria']=ac
              changed.add(tid)

          # TSK-0140 was prepared and objectively reviewed before CR-0007; remove only the ceremonial owner-review acceptance clause.
          by['TSK-0140']['Acceptance_Criteria']='The current product brief faithfully translates the frozen current product, privacy, security, technical, commercial and sequencing authority into an internally consistent implementation brief; all material scope changes remain separately owner-controlled, and objective evidence review must find no unresolved contradiction before PASS.'

          # Active production path: no mandatory pilot or staging lifecycle/environment. Historical L0-L6 records are untouched.
          active_lifecycles={'L7','L8','L9','L10','L11','L12','L13'}
          human_fields=[x for x in ['Title','Description','Preconditions','Acceptance_Criteria','KPI_Success_Metric','Notes'] if x in fields]
          for r in rows:
              lc=(r.get('Lifecycle') or '').strip()
              if lc not in active_lifecycles: continue
              before=tuple(r.get(k,'') for k in human_fields)
              for k in human_fields:
                  s=r.get(k,'') or ''
                  if lc=='L7':
                      s=s.replace('Pilot Readiness','Production Release Readiness').replace('pilot readiness','production release readiness')
                      s=s.replace('Pilot','Production Release').replace('pilot','production release')
                  else:
                      s=s.replace('Pilot','Initial Production').replace('pilot','initial production')
                  s=s.replace('staging environment','pre-release verification').replace('staging','pre-release verification')
                  s=s.replace('Launch Go/No-Go','Automated Launch Authorization').replace('launch go/no-go','automated launch authorization')
                  r[k]=s
              after=tuple(r.get(k,'') for k in human_fields)
              if before!=after:
                  changed.add(r['Task_ID']); append_source(r)
                  append_note(r,'CR-0007: this is production-path work; no separate mandatory pilot or staging lifecycle/environment is created. Pre-release tests, recovery and rollback evidence remain mandatory.')

          with wbs.open('w',encoding='utf-8-sig',newline='') as f:
              dw=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); dw.writeheader(); dw.writerows(rows)

          # Keep acceptance register synchronized for every changed WBS acceptance contract.
          vr='Registers/VERIFICATION_EVIDENCE_ACCEPTANCE.md'
          vlines=read(vr).splitlines()
          acc_changed=0
          for i,l in enumerate(vlines):
              if not l.startswith('| TSK-'): continue
              parts=[x.strip() for x in l.split('|')[1:-1]]
              if not parts: continue
              tid=parts[0]
              if tid in changed and tid in by and len(parts)==8:
                  parts[6]=by[tid]['Acceptance_Criteria']
                  vlines[i]='| '+' | '.join(parts)+' |'; acc_changed+=1
          if acc_changed==0: raise SystemExit('no verification acceptance rows synchronized')
          write(vr,'\n'.join(vlines)+'\n')

          # Derived autonomy projection from authoritative WBS.
          caps=collections.Counter(r.get('AI_Capability','') for r in rows)
          auth=collections.Counter(r.get('Action_Authority','') for r in rows)
          ap=R/'Governance/AUTONOMY_POLICY.yaml'
          ap.write_text(
              'schema: usesafeweb.autonomy-policy-projection.v1\n'
              'authority: DERIVED_NON_AUTHORITATIVE\n'
              'governing_source: Layers/LAYER_5_AI_EXECUTION_EVIDENCE_STATE_CONTROL.md\n'
              'task_authority_source: WBS/master-wbs.csv\n'
              'governing_loop:\n- UNDERSTAND\n- VERIFY_PREREQUISITES\n- EXECUTE\n- TEST\n- VERIFY\n- RECORD_EVIDENCE\n- UPDATE_STATE\n- CONTINUE\n'
              'failure_loop:\n- DIAGNOSE\n- CORRECT\n- RETEST\n- REVERIFY\n'
              'capability_counts:\n'+''.join(f'  {k}: {caps.get(k,0)}\n' for k in ['A0','A1','A2','A3','A4'] if caps.get(k,0))+
              'action_authority_counts:\n'+''.join(f'  {k}: {auth.get(k,0)}\n' for k in ['AUTO_ALLOWED','HUMAN_APPROVAL_REQUIRED','HUMAN_ONLY'] if auth.get(k,0))+
              'human_boundary: Nondelegable legal signatures/contracts/identity/consent, named-market activation, strategic pivot/pause/stop/transfer/resume, organizational formalization and material unbudgeted commitments remain human-controlled; DEC-0054 otherwise maximizes evidence-driven autonomy subject to higher authority.\n',
              encoding='utf-8')

          # 2) Decision register: single durable owner policy containing all 14 answers.
          d='Registers/DECISIONS_TRIGGERS.md'; text=read(d).rstrip()
          row='| DEC-0054 | New | Owner autonomy, production-only lifecycle and standing consequential-action policy | ACTIVE OWNER DECISION — (1) detailed account/dashboard UX is AI-designed/reviewed/approved inside frozen scope; (2) LG-07 is evidence-driven AUTO; (3) LG-08 is AUTO with escalation only for genuine consequential/nondelegable exception; (4) AI may accept project-defined material residual risk when no higher-authority law/safety/security/platform/technical prohibition or required human act applies; (5) standing conditional authority activates first real production users once objective readiness and all actually applicable legal/privacy/consent prerequisites pass; (6) no mandatory pilot or staging lifecycle/environment — work proceeds to production, while local/dev/CI/synthetic/device/network/security/privacy/accessibility/performance/recovery/rollback verification remains mandatory and bounded/ramped production rollout is allowed as a production safety mechanism; (7) LG-12 readiness is AUTO; (8) LG-13 is automatic GO when all current prerequisites pass, with no additional owner input; (9) LG-14 automatically PASSes when objective stabilization criteria pass, while strategic adverse dispositions remain human; (10) routine technical scaling is AUTO inside approved architecture/budget, organizational/entity/formalization/contracts/material spending remain human; (11) AI researches/ranks expansion, Project Owner approves each named official market activation; (12) Year-1 automatically CONTINUEs when frozen thresholds pass, other strategic dispositions remain human; (13) routine reversible already-budgeted operating spend is AUTO, new contracts/regulated fees/banking-or-merchant identity/legal attestations-or-signatures/unbudgeted-or-material spend remain human; (14) AI handles routine incidents/retries/rollback/recovery/reversible remediation, while strategic pause/pivot/stop/transfer/resume, irreversible human-authority acts, frozen-boundary/material scope changes and legal/contract/identity obligations remain human. | Explicit Project Owner instruction 2026-08-31; effective immediately after canonical publication/read-back. | Objective acceptance evidence for each gate/action; no inference of PASS from this authority change; higher actual legal/safety/security/platform/technical reality always controls; nondelegable human acts remain human. | Project Owner | LG-06..LG-18; TSK-0140; TSK-0329; TSK-0331; TSK-0332; active L7-L13 production path; Layer 5 action authority | Owner answers 1B,2B,3C,4 AI-autonomous material-risk acceptance,5B,6 production-only approval,7B,8 auto-GO,9B,10B,11B,12B,13B,14A on 2026-08-31; CR-0007 |'
          write(d,text+'\n'+row+'\n')

          # Existing decision rows: preserve history, explicitly route current semantics to DEC-0054.
          def mutate_dec(prefix, replacements):
              lines=read(d).splitlines(); hits=[i for i,l in enumerate(lines) if l.startswith(prefix)]
              if len(hits)!=1: raise SystemExit(f'{prefix} decision row mismatch')
              s=lines[hits[0]]
              for a,b in replacements: s=s.replace(a,b)
              lines[hits[0]]=s; write(d,'\n'.join(lines)+'\n')
          mutate_dec('| DEC-0025 |', [('CONDITIONAL — 30–50 families only after accepted minimal MCP and G-10.','SUPERSEDED for active sequencing by DEC-0054 — no separate pilot lifecycle; initial real-user validation occurs as bounded live production after objective production readiness.'), ('Real MCP pilot','Initial live production validation (historical pilot record)')])
          mutate_dec('| DEC-0052 |', [('ACTIVE OWNER DECISION — no parent/user/participant validation, usability/comprehension study, recruitment, or other real-user testing is required or permitted as a pre-product gate; build and integrated technical/product verification proceed first, and actual human/user validation begins only after LG-09 PASS in L8.','ACTIVE for pre-L8 sequencing — no parent/user/participant validation, usability/comprehension study, recruitment, or other real-user testing is required or permitted before integrated production readiness. DEC-0054 supersedes only the downstream pilot/staging model: after LG-09, actual human/user validation begins as live production validation, not a separate pilot.')])

          # 3) Gate register: objective gates are automatic; only the explicitly retained strategic/nondelegable choices remain human.
          g='Registers/GATES.md'
          gate_rows={
          'LG-06':'| LG-06 | Product, Brand and Experience Freeze | L4 | Accept the dual-mode Version-1 product, brand and experience baseline inside current frozen owner policy. | Applicable L4 dependencies and current owner product authority satisfied. | Product/non-goals; traceability; internally accepted dual-mode prototype and critical journeys; account/session/dashboard/device lifecycle; accountless-core availability; brand/design system; self-service; content; accessibility/i18n; privacy/security boundaries; unresolved risks. No pre-product real-user evidence is required. | PASS; REWORK; REDUCE; DEFER | Project Governance / AUTO_ALLOWED inside frozen scope | G-05 | Automatically unlocks L5 only when every applicable acceptance requirement is evidenced; any material product/scope-policy change returns to Project Owner. |',
          'LG-07':'| LG-07 | Architecture, Security, Privacy and Delivery Readiness | L5 | Automatically accept the smallest production-capable architecture and implementation plan when every objective requirement passes. | LG-06 PASS. | Architecture/ADRs; account/session/data/vendor/privacy/security model; auth/authz/CSRF/IDOR/deletion/recovery; typed AdGuard integration; security/threat; measurement; test/recovery; budget; delivery plan; residual risks. | PASS; REWORK; REDUCE; BLOCK | Project Governance / AUTO_ALLOWED | G-06/G-07 | Unlocks L6 build only on evidence-complete PASS; a genuinely nondelegable legal/identity/contract/material-spend act remains separately human-controlled. |',
          'LG-08':'| LG-08 | Build and Integration Complete | L6 | Automatically confirm the approved minimum product is implemented and integrated when current technical acceptance evidence passes. | LG-07 PASS. | Exact release/config; accountless public/setup surfaces; optional account/session/dashboard/device lifecycle; minimum persistence/ownership isolation; DNS integration; recovery; CI/tests; auth/authz/IDOR/ClientID; non-goal/secret/data checks. | PASS; REWORK; ROLLBACK; BLOCK | Engineering/QA / AUTO_ALLOWED; exception escalation only | G-08 | Unlocks integrated production-readiness verification; consequential nondelegable exceptions do not inherit automatic authority. |',
          'LG-09':'| LG-09 | Integrated Production Release Readiness | L7 | Automatically establish readiness for the first bounded live production activation; there is no separate pilot or staging gate. | LG-08 PASS. | Functional/device/network; deterministic UX/truth-state flows; accessibility/RTL; security/privacy; performance/capacity; self-service; clean-server recovery; operations; rollback; defects/residual risks; and all actually applicable legal/privacy/consent prerequisites for live users. No real-user evidence is required before this gate. | PASS; REWORK; REBUILD; BLOCK | Project Governance / AUTO_ALLOWED | G-09/G-10 | PASS activates the owner standing authority for bounded live production users under DEC-0054; tests and rollback remain mandatory. |',
          'LG-10':'| LG-10 | Initial Production Evidence Complete | L8 exit | Confirm that bounded live production operation produced sufficient quality evidence for continuation evaluation. | LG-09 PASS and initial live production observation complete. | Cohort/release integrity; value/persistence/support/reliability/incidents/payment/channel/cost/data-quality/deletion evidence from production, privacy-minimized as required. | PASS TO EVALUATION; EXTEND OBSERVATION; BLOCK | Project Governance / AUTO_ALLOWED | Replaces active pilot evidence checkpoint | Unlocks L9 evidence synthesis; this is production evidence, not a pilot/staging environment. |',
          'LG-11':'| LG-11 | Initial Production Continuation Decision | L9 | Automatically CONTINUE toward public UK production expansion when every frozen success threshold passes; reserve strategic non-proceed dispositions to the Project Owner. | LG-10 evidence complete. | Initial-production synthesis, thresholds, economics, trust/legal/security/operations, channel evidence, residuals and recommendation. | CONTINUE; MODIFY/REPEAT; REDUCE; PIVOT; PAUSE; STOP | AUTO CONTINUE on evidence; Project Owner for strategic non-proceed disposition | G-11 | CONTINUE unlocks L10; a failed threshold cannot be converted to CONTINUE by inference. |',
          'LG-12':'| LG-12 | UK Public Production Readiness | L10 | Automatically accept the exact UK public-production baseline and bounded rollout readiness. | LG-11 CONTINUE. | Production environment/release; policies/vendors; operations/recovery/rollback; security/privacy; budget; self-service; brand/web/GTM; evidence index. | PASS; REWORK; DEFER; BLOCK | Project Governance / AUTO_ALLOWED | G-12 | PASS unlocks automatic LG-13 evaluation; no ceremonial owner approval is required. |',
          'LG-13':'| LG-13 | UK Public Production Activation | L11 entry | Automatically GO for the exact UK public production expansion when LG-12 and all current time-sensitive checks pass. | LG-12 PASS and time-sensitive checks current. | Release/time/caps/ramp/monitoring/support/rollback/communications/owners; no active blocker. | AUTO-GO; REWORK; DEFER | Project Governance / AUTO_ALLOWED | G-13 | AUTO-GO expands live production within the approved UK scope; no additional owner input is required. |',
          'LG-14':'| LG-14 | Post-Launch Stabilization | L11 exit | Automatically transition to normal Year-1 operation when objective stabilization criteria pass; escalate only strategic adverse disposition. | Public production activation complete and observation window executed. | Service/product/support/privacy/security/cost/channel/incident/change report and unresolved corrective work. | PASS; EXTEND STABILIZATION; ROLLBACK; PAUSE; STOP | AUTO PASS/ordinary remediation; Project Owner for strategic adverse disposition | G-14 | PASS unlocks normal L12 operation. |',
          'LG-15':'| LG-15 | Year-1 Close and Year-2 Decision | L13 | Automatically CONTINUE when frozen annual success thresholds pass; reserve other strategic Year-2 directions to the Project Owner. | M1-M12 obligations complete or dispositioned. | Annual product/reliability/security/privacy/support/channel/finance/vendor/locale/governance evidence; obligations; options. | CONTINUE; MODIFY; EXPAND; FORMALIZE; TRANSFER; PAUSE; STOP | AUTO CONTINUE; Project Owner for other strategic outcomes | G-17 | Authorizes Year-2 continuation or the owner-selected alternative transition. |',
          'LG-16':'| LG-16 | Localized Market Activation | L12 conditional | Authorize one specific officially supported/localized market or locale. | Stable UK evidence and named candidate market. | Research; legal/privacy/safeguarding; translated/transcreated product/help/SEO; RTL/platform; support/channel/analytics/budget; owner decision. | PASS; REWORK; DEFER; REJECT | Project Owner | G-16 | AI may research and rank markets autonomously, but only explicit owner approval unlocks the named market/locale. |',
          'LG-17':'| LG-17 | Scale and Formalization Review | L12 conditional | Permit routine technical scaling autonomously inside approved architecture/budget while retaining organizational/entity/formalization/contracts/material-spend decisions for the Project Owner. | 500 verified active users or earlier material revenue/contract/staff/tax/partner/risk trigger. | Trigger calculation, capacity/support/reliability/cost/legal/admin options, risks and owner decision where a retained human boundary is implicated. | AUTO SCALE; ACT; DEFER; LIMIT; REDUCE; STOP | AUTO routine technical scaling; Project Owner for formalization/material commitments | G-15 | Unlocks only scaling/formalization actions within the corresponding authority boundary. |',
          'LG-18':'| LG-18 | Pause, Pivot, Stop, Transfer or Decommission | Any stage conditional | AI handles routine incidents, retries, rollback/recovery and reversible remediation; strategic lifecycle disposition remains human. | Kill/incident/strategy/authority trigger. | Impact inventory; service/data/user/payment/vendor/domain/access/legal/communication/asset/evidence transition plan. | REMEDIATE; PAUSE; PIVOT; TRANSFER; STOP/DECOMMISSION; RESUME | AUTO routine remediation; Project Owner for strategic transition | Terminal route across legacy gates | Routine incident handling does not require owner input; strategic pause/pivot/stop/transfer/resume remains a human decision. |'
          }
          for gid,newline in gate_rows.items(): replace_row(g,f'| {gid} |',newline)

          # 4) Layer 5: latest execution/authority semantics and explicit supersession of conflicting human-only rows.
          l5='Layers/LAYER_5_AI_EXECUTION_EVIDENCE_STATE_CONTROL.md'; text=read(l5)
          lines=text.splitlines()
          for i,l in enumerate(lines):
              if l.startswith('| AUTO_ALLOWED |'):
                  lines[i]='| AUTO_ALLOWED | AI may act within current scope/access and must verify/report. | Research, design/drafts, code/tests, monitoring/analysis, evidence-driven gate PASS/GO under DEC-0054, routine reversible production operations/rollout, routine already-budgeted spend, and project-defined residual-risk acceptance where no higher-authority prohibition or nondelegable human act applies. |'
              elif l.startswith('| HUMAN_APPROVAL_REQUIRED |'):
                  lines[i]='| HUMAN_APPROVAL_REQUIRED | AI prepares/analyzes; the consequential act occurs only after explicit approval where the specific act is retained as human authority. | New contracts, regulated fees, banking/merchant identity, legal attestation/signature, unbudgeted/material spend, named-market activation, strategic non-proceed/transition decisions, destructive/irreversible human-authority acts, and material scope/frozen-boundary changes. |'
              elif l.startswith('| HUMAN_ONLY |'):
                  lines[i]='| HUMAN_ONLY | The human/authorized professional performs or decides acts that cannot be delegated by project policy. | Legal signatures/attestations, contracts requiring human acceptance, identity/KYC/credential/consent acts requiring a person, named-market strategic authorization, organizational formalization, and strategic pivot/pause/stop/transfer/resume. Material residual risk and public launch are not human-only merely by category under DEC-0054. |'
          text='\n'.join(lines)+'\n'
          marker='### 5.4 Evidence and PASS rules'
          if text.count(marker)!=1: raise SystemExit('Layer5 5.4 marker mismatch')
          sec='''### 5.3.6 Owner autonomy and production-only lifecycle authority (DEC-0054 / CR-0007)\n\n- Effective **2026-08-31**, objective work inside already-frozen product/scope policy is AI-autonomous by default. Detailed account/dashboard UX and ordinary product/design translation no longer require ceremonial owner approval; scope/product-policy changes still require the Project Owner.\n- `LG-07`, ordinary `LG-08`, `LG-12` and objective readiness gates are evidence-driven `AUTO_ALLOWED`. `LG-13` is **automatic GO** only when every current prerequisite and time-sensitive check is actually PASS; missing evidence or a blocker cannot be waived by this standing authority.\n- The Project Owner authorizes first real users as **live production users** once `LG-09` and every actually applicable legal/privacy/consent prerequisite pass. There is no mandatory pilot or staging lifecycle/environment. Local/dev/CI/synthetic/device/network/security/privacy/accessibility/performance/recovery/rollback verification remains mandatory, and bounded/capped/ramped production rollout may be used as a production safety mechanism without becoming a separate pilot/staging gate.\n- AI may accept project-defined material residual risks autonomously when evidence supports the disposition and no actual law, safety, security, platform or technical reality prohibits it or requires a specific human/professional act. This authority cannot fabricate compliance, consent, signatures, contracts, identity, provider acceptance, or other facts.\n- `LG-14` automatically PASSes on objective stabilization evidence. `LG-15` automatically CONTINUEs when frozen annual thresholds pass. Strategic adverse or alternative outcomes such as modify/pivot/pause/stop/transfer/formalize remain human where stated.\n- Routine technical scaling is autonomous inside approved architecture/budget. Organizational/entity/formalization/contracts and material/unbudgeted commitments remain human. AI may research/rank geographic expansion, but `LG-16` named-market activation remains Project Owner authority.\n- Routine reversible already-budgeted operating spend is autonomous. New contracts, regulated fees, banking/merchant identity, legal attestations/signatures and material/unbudgeted spending remain human.\n- AI handles routine incidents, diagnostics, retries, rollback/recovery and reversible remediation autonomously. Strategic pause/pivot/stop/transfer/resume, irreversible human-authority acts and frozen-boundary/material scope changes remain human.\n- This governance change **does not itself make any task or gate PASS**. Existing PASS is preserved only where its evidence still proves unchanged acceptance; changed acceptance must be reverified under current evidence.\n\n'''
          text=text.replace(marker,sec+marker,1)
          # Remove explicitly superseded HUMAN_ONLY table rows if present; the new section is the controlling rule for other conflicts.
          l5lines=text.splitlines(); filtered=[]
          remove_ids={'TSK-0140','TSK-0262','TSK-0270','TSK-0273','TSK-0276','TSK-0277','TSK-0278','TSK-0281','TSK-0282','TSK-0314','TSK-0317','TSK-0320','TSK-0322','TSK-0329','TSK-0331','TSK-0332','TSK-0412','TSK-0413','TSK-0417','TSK-0420','TSK-0424','TSK-0465'}
          in58=False
          for l in l5lines:
              if l.startswith('### 5.8 '): in58=True
              elif in58 and l.startswith('### ') and not l.startswith('### 5.8 '): in58=False
              if in58 and l.startswith('| TSK-') and any(l.startswith(f'| {tid} |') for tid in remove_ids):
                  continue
              filtered.append(l)
          write(l5,'\n'.join(filtered)+'\n')

          # 5) Lifecycle authority: make the active path production-only while retaining historical pre-product records.
          def active_text_rebase(rel):
              lines=read(rel).splitlines(); out=[]
              for l in lines:
                  active=any(f'| {lc} |' in l or l.startswith(f'| {lc} |') for lc in ['L7','L8','L9','L10','L11','L12','L13'])
                  if active:
                      l=l.replace('Controlled Integrated-Product Pilot','Initial Live Production Validation & Observation')
                      l=l.replace('Pilot Evaluation & Production Decision','Initial Production Evidence & Continuation Decision')
                      l=l.replace('Pilot Readiness','Production Release Readiness').replace('pilot readiness','production release readiness')
                      l=l.replace('Pilot','Initial Production').replace('pilot','initial production')
                      l=l.replace('staging environment','pre-release verification').replace('staging','pre-release verification')
                      l=l.replace('Launch Go/No-Go','Automated Launch Authorization').replace('launch go/no-go','automated launch authorization')
                  out.append(l)
              write(rel,'\n'.join(out)+'\n')
          active_text_rebase('Registers/PHASES.md')
          active_text_rebase('Registers/LIFECYCLE_OBLIGATIONS.md')
          active_text_rebase('Layers/LAYER_1_PROGRAM_ARCHITECTURE_STRATEGIC_BASELINE.md')

          l4='Layers/LAYER_4_INTEGRATED_PROGRAM_CRITICAL_PATH.md'; text=read(l4)
          l4sec='''\n### CR-0007 active production-only continuation path\n\nFrom `LG-09` onward, the active path is **live production**, not a separate pilot or staging lifecycle: integrated production release readiness -> bounded/ramped live production activation -> initial production evidence -> automatic CONTINUE when frozen thresholds pass -> UK public production readiness -> automatic public-production GO -> objective stabilization -> Year-1 operations. Pre-release verification, security/privacy/accessibility/performance tests, clean-server recovery and rollback remain mandatory. Named-market expansion, organizational formalization, contracts/legal identity acts, material unbudgeted commitments and strategic pivot/pause/stop/transfer/resume retain the human boundaries in DEC-0054. Historical pilot/staging language is traceability only and does not control active sequencing.\n'''
          if '### CR-0007 active production-only continuation path' not in text:
              text=text.rstrip()+l4sec+'\n'
          # Rebase only explicit active lifecycle rows in Layer 4.
          tmp=[]
          for l in text.splitlines():
              if any(f'| L{n} -' in l or l.startswith(f'| {n} | L{n} -') for n in range(7,14)):
                  l=l.replace('Controlled Integrated-Product Pilot','Initial Live Production Validation & Observation').replace('Pilot Evaluation & Production Decision','Initial Production Evidence & Continuation Decision').replace('Pilot','Initial Production').replace('pilot','initial production').replace('staging','pre-release verification').replace('Launch Go/No-Go','Automated Launch Authorization')
              tmp.append(l)
          write(l4,'\n'.join(tmp)+'\n')

          # 6) Change-control register.
          exc='Registers/EXCEPTIONS_CHANGE_CONTROLS.md'; text=read(exc)
          cr='| CR-0007 | 2026-08-31 | Owner action authority; active L7-L13 production lifecycle; gates LG-06..LG-18; WBS task action metadata/active production wording; Layer 1/4/5; phase/lifecycle registers; decision register; autonomy projection; verification acceptance; manifest; generated reconstruction/checksums. | Explicit current Project Owner answers to the 14 human-authority questions, including AI material-risk acceptance, standing live-production activation authority, no mandatory pilot/staging, automatic readiness/launch gates, bounded retained human authority for named-market/formalization/contracts/material commitments/strategic transitions. | Maximize AI autonomy and remove ceremonial human gates while preserving evidence, objective readiness, actual legal/safety/security/platform reality, nondelegable human acts, tests/recovery/rollback and owner control over genuine strategic/contract/identity/material-commitment boundaries. | Active path after LG-09 becomes live production validation/observation rather than pilot/staging. No existing PASS is created by the governance mutation. Existing evidence is preserved only for unchanged acceptance. | Add DEC-0054 and Layer-5 §5.3.6; rebase LG-06..LG-18; update bounded WBS action metadata and active L7-L13 terminology; synchronize acceptance/autonomy projection; rebuild/checksum/validate; publish/read back; reconcile CURRENT_STATE. | Revert DEC-0054/CR-0007 semantics to the immediately prior canonical tree, rebuild/checksum/validate, then re-evaluate any later PASS or production action that materially relied on CR-0007. | Full deterministic validator PASS; 641 WBS tasks; existing dependency graph unchanged; zero broken links/generated missing IDs; semantic audit proves DEC-0054/CR-0007, automatic gates, production-only active path, retained named-market/contract/identity/strategic boundaries, and no authority-change-as-PASS inference. | Pending publication/read-back at record creation; final commit/run/blobs are recorded in CURRENT_STATE reconciliation. |'
          marker='\n\nMaterial change records use'
          if marker in text: text=text.replace(marker,'\n'+cr+marker,1)
          else: text=text.rstrip()+'\n'+cr+'\n'
          write(exc,text)

          # 7) Manifest latest-change routing.
          man='MANIFEST.yaml'; text=read(man)
          a=text.index('post_freeze_change_control:'); b=text.index('\ngenerated_assembly_contract:',a)
          block='''post_freeze_change_control:\n  latest_change: CR-0007\n  date: '2026-08-31'\n  status: owner autonomy and production-only lifecycle amendment; canonical reliance requires deterministic validation plus GitHub publication/read-back\n  authority: explicit current Project Owner answers 2026-08-31; DEC-0054; actual applicable law/safety/security/platform/technical reality remains higher authority\n  affected_scope:\n  - evidence-driven autonomy inside frozen scope, including detailed account/dashboard UX and ordinary product/design translation\n  - no mandatory pilot or staging lifecycle/environment; first real users are live production after LG-09 readiness\n  - automatic evidence gates and automatic UK production GO where current prerequisites pass\n  - routine technical scaling/spend/incidents autonomous inside approved bounds\n  - named-market activation, nondelegable legal/identity/contract acts, organizational formalization/material commitments and strategic transition remain human\n  affected_gates:\n  - LG-06 through LG-15 rebaselined to DEC-0054 automatic/conditional authority semantics\n  - LG-16 remains Project Owner named-market activation\n  - LG-17 splits routine technical scaling from human formalization/material commitments\n  - LG-18 splits routine incident remediation from human strategic transition\n  semantic_delta: no governance change itself creates PASS; objective evidence, tests, recovery/rollback and actual applicable requirements remain mandatory\n  change_record: Registers/EXCEPTIONS_CHANGE_CONTROLS.md#post-freeze-material-change-records\n'''
          text=text[:a]+block+text[b:]
          # Add a compact source-plan status marker without relying on the exact old status wording.
          sa=text.index('source_plan:'); sb=text.index('\nmigration_prompt:',sa); sblock=text[sa:sb]
          if 'OWNER_AUTONOMY_PRODUCTION_ONLY_CR_0007' not in sblock:
              sl=sblock.splitlines()
              for i,l in enumerate(sl):
                  if l.strip().startswith('status:'):
                      sl[i]=l+' / OWNER_AUTONOMY_PRODUCTION_ONLY_CR_0007'
                      break
              text=text[:sa]+'\n'.join(sl)+text[sb:]
          write(man,text)

          # 8) Rebuild derived full plan and existing checksum inventory.
          subprocess.run(['python3',str(R/'Tools/rebuild_master_plan.py')],check=True)
          sumfile=P/'SHA256SUMS.txt'; rels=[]
          for line in sumfile.read_text(encoding='utf-8').splitlines():
              if line.strip(): rels.append(line.split('  ',1)[1])
          out=[]
          for relp in rels:
              fp=P/relp
              if not fp.is_file(): raise SystemExit(f'checksum inventory missing {relp}')
              out.append(hashlib.sha256(fp.read_bytes()).hexdigest()+'  '+relp)
          sumfile.write_text('\n'.join(out)+'\n',encoding='utf-8')

          print(f'CR0007_WBS_CHANGED_TASKS={len(changed)}')
          print('CR0007_CHANGED_IDS='+','.join(sorted(changed)))
          print('CR0007_AUTH_COUNTS='+repr(dict(auth)))
          PY

