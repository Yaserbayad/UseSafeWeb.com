name: Verify Azure region and DNS data path for TSK-0428

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/adguard-region-data-path-acceptance.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Verify production region and DNS path
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == 'adguardvm' ]]
          [[ "$(sha256sum /etc/machine-id | awk '{print $1}')" == 'e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2' ]]
          sudo -n true
          systemctl is-active --quiet AdGuardHome.service
          systemctl is-active --quiet nginx.service

          curl --silent --show-error --fail --noproxy '*' -H 'Metadata:true' \
            'http://169.254.169.254/metadata/instance/compute?api-version=2025-04-07' > /tmp/t0428-imds.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t0428-imds.json',encoding='utf-8'))
          assert d.get('location') == 'westeurope', d.get('location')
          assert d.get('name') == 'adguardvm', d.get('name')
          assert d.get('vmId') == 'bc7f566f-7231-41fb-9fdd-49cf190fd5e1', d.get('vmId')
          assert str(d.get('azEnvironment','')).lower() == 'azurepubliccloud', d.get('azEnvironment')
          print('azure_location=westeurope')
          print('azure_vm_name=adguardvm')
          print('azure_vm_id=bc7f566f-7231-41fb-9fdd-49cf190fd5e1')
          print('azure_environment=AzurePublicCloud')
          PY

          sudo python3 - /opt/AdGuardHome/AdGuardHome.yaml <<'PY'
          import sys,yaml
          d=yaml.safe_load(open(sys.argv[1],encoding='utf-8'))
          dns=d.get('dns') or {}
          assert list(dns.get('upstream_dns') or []) == ['https://dns10.quad9.net/dns-query']
          assert list(dns.get('bootstrap_dns') or []) == ['9.9.9.10','149.112.112.10','2620:fe::10','2620:fe::fe:10']
          assert list(dns.get('fallback_dns') or []) == []
          assert list(dns.get('private_upstream') or []) == []
          assert str(dns.get('upstream_dns_file') or '') == ''
          assert bool((dns.get('edns_client_subnet') or {}).get('enabled')) is False
          assert list(dns.get('bind_hosts') or []) == ['127.0.0.1']
          assert int(dns.get('port')) == 53
          assert (d.get('querylog') or {}).get('enabled') is False
          assert (d.get('querylog') or {}).get('file_enabled') is False
          assert (d.get('statistics') or {}).get('enabled') is False
          assert dns.get('anonymize_client_ip') is True
          assert ((d.get('clients') or {}).get('persistent') or []) == []
          print('upstream=https://dns10.quad9.net/dns-query')
          print('bootstrap_recipients=Quad9_dns10_only')
          print('fallback_dns_count=0')
          print('private_upstream_count=0')
          print('ecs_enabled=false')
          print('adguard_dns_bind=127.0.0.1:53')
          PY

          sudo nginx -T 2>/tmp/t0428-nginx-stderr > /tmp/t0428-nginx.txt
          python3 - <<'PY'
          import re
          t=open('/tmp/t0428-nginx.txt',encoding='utf-8').read()
          assert 'server_name dns.usesafeweb.com;' in t
          proxies=re.findall(r'\bproxy_pass\s+([^;]+);',t)
          assert proxies == ['http://127.0.0.1:3000','127.0.0.1:53'], proxies
          assert '/dns-query' in t
          low=t.lower()
          for token in ('google-analytics','googletagmanager','stripe','paypal','sendgrid','mailgun','postmark','segment.io','mixpanel','amplitude'):
              assert token not in low, token
          print('nginx_public_identity=dns.usesafeweb.com')
          print('nginx_proxy_targets=loopback_DoH_3000_and_DoT_53_only')
          print('nginx_external_app_vendor_tokens=0')
          PY

          sudo ss -H -lntup > /tmp/t0428-listeners.txt
          python3 - <<'PY'
          import re
          t=open('/tmp/t0428-listeners.txt',encoding='utf-8').read()
          for p in (':22 ',':443 ',':853 ', '127.0.0.1:53 ', '127.0.0.1:3000 '):
              assert p in t, p
          for port in (25,465,587,3306,5432,6379,8080,8081,9000):
              assert not re.search(rf'(?<!\d):{port}\s',t), port
          print('required_dns_listener_topology=PASS')
          print('common_app_mail_db_listener_count=0')
          PY

          for svc in docker.service containerd.service podman.service kubelet.service postfix.service exim4.service sendmail.service; do
            if systemctl list-unit-files "$svc" --no-legend 2>/dev/null | grep -q .; then
              ! systemctl is-active --quiet "$svc"
            fi
          done
          echo 'container_mail_service_participation=none'

          python3 - <<'PY'
          import random,socket,struct
          name='example.com'
          q=b''.join(bytes([len(x)])+x.encode() for x in name.split('.'))+b'\x00'
          pkt=struct.pack('!HHHHHH',random.randrange(65536),0x0100,1,0,0,0)+q+struct.pack('!HH',1,1)
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(4); s.sendto(pkt,('127.0.0.1',53))
          r,_=s.recvfrom(4096); s.close()
          flags,answers=struct.unpack('!HH',r[2:6])[0],struct.unpack('!H',r[6:8])[0]
          assert (flags & 0xF)==0 and answers>0, (flags & 0xF,answers)
          print('synthetic_allowed_resolution=PASS')
          PY

          rm -f /tmp/t0428-imds.json /tmp/t0428-nginx.txt /tmp/t0428-nginx-stderr /tmp/t0428-listeners.txt
          echo 'TSK_0428_TARGET_AUDIT=PASS'

      - name: Publish evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_blob="$(git hash-object .github/workflows/adguard-region-data-path-acceptance.yml)"
          state_blob="$(git hash-object CURRENT_STATE.md)"
          config_blob="$(git hash-object infrastructure/adguard-server/approved-adguard-config-v1.json)"
          cat > TSK_0428_AZURE_REGION_DATA_PATH_EVIDENCE_2026-08-28.md <<EOF
          # TSK-0428 — Azure Region, Recipients, and DNS Data-Path Evidence

          **Task:** TSK-0428 — Verify Azure region, recipients, and data path  
          **Acceptance:** ACC-0428  
          **Verification:** VER-0428  
          **Evidence:** EVD-0428  
          **Date:** 2026-08-28

          ## Exact target and authoritative metadata

          Fresh assertion-based target verification executed on production host \`adguardvm\` from workflow source commit \`${GITHUB_SHA}\`, workflow blob \`${workflow_blob}\`, runtime-state blob \`${state_blob}\`, and approved-config blob \`${config_blob}\`.

          Azure Instance Metadata Service was queried from inside the production VM using API version \`2025-04-07\`. The run asserted Azure environment \`AzurePublicCloud\`, VM name \`adguardvm\`, VM ID \`bc7f566f-7231-41fb-9fdd-49cf190fd5e1\`, and Azure location **\`westeurope\`**.

          Current accepted recovery-runner evidence separately identifies the only handed-off recovery target as Azure VM \`adguartestdvm\`, also in West Europe, with AdGuard/Nginx inactive. There is no accepted or active US DNS node in the governed runtime inventory.

          ## DNS recipients and path

          The live persisted AdGuard configuration directly asserted upstream DNS exactly \`https://dns10.quad9.net/dns-query\`; bootstrap resolvers exactly Quad9 dns10 addresses \`9.9.9.10\`, \`149.112.112.10\`, \`2620:fe::10\`, \`2620:fe::fe:10\`; zero fallback/private upstream entries; no upstream file; ECS disabled; loopback-only plain DNS; query/file logging and statistics disabled; IP anonymisation enabled; and zero persistent clients.

          Effective Nginx configuration asserted public identity \`dns.usesafeweb.com\` and exactly two proxy targets, both loopback-only: \`http://127.0.0.1:3000\` for the DoH HTTP backend and \`127.0.0.1:53\` for the DoT stream backend. No external application-vendor proxy target is configured. Listener/service checks found the expected DNS host topology and no common application/mail/database or container/mail service participating in the resolver path. A final synthetic allowed-domain query resolved successfully.

          Therefore the active child-linked DNS request path is bounded to: **supported device -> UseSafeWeb Azure West Europe DNS endpoint -> same-host Nginx/AdGuard loopback path -> Quad9 dns10 recursive resolver**. Cloudflare authoritative DNS, Let's Encrypt certificate operations, GitHub runner/control tooling, and filter-list distribution are operational/control-plane dependencies but do not receive the child-linked DNS query payload in this resolver path; they are not additional DNS-query processors for ACC-0428.

          No CDN, analytics, payment, email, US DNS node, or other application processor was found in the active DNS-query path.

          ## Deviation and disposition

          Initial verifier run \`33167781526\` was not accepted: Azure IMDS and live AdGuard assertions passed, but the Nginx check incorrectly expected only the DoH loopback proxy and failed when it correctly observed the separate local DoT proxy \`127.0.0.1:53\`. No product/runtime mutation occurred. The verifier was corrected to require exactly both approved loopback targets and rerun; this evidence is emitted only after the corrected full target audit passes.

          ## Current-source corroboration

          Microsoft documents Azure IMDS as the host-local authoritative metadata service for running Azure VMs and exposes compute \`location\`/\`vmId\`. Quad9's current service documentation identifies \`dns10.quad9.net\`, \`https://dns10.quad9.net/dns-query\`, and the four bootstrap addresses above as its no-threat-blocking privacy-first service. These source facts were checked on 2026-08-28; the PASS rests on fresh target/runtime evidence.

          ## Acceptance

          - Azure metadata shows West Europe: **PASS**.
          - DNS configuration/runtime shows Quad9 dns10 only for recursive resolution/bootstrap: **PASS**.
          - No active US DNS node participates: **PASS**.
          - No CDN, analytics, payment, email, or other application processor participates in the active child-linked DNS query path: **PASS**.
          - Exact environment/artifact and reproducible target assertions retained without participant browsing data: **PASS**.

          **Stable outcome: TSK-0428 = PASS.**

          This verifies the current DNS data path only. It does not authorize Azure control-plane changes, real-participant activation, web/application deployment, or legal/release-gate bypass.
          EOF
          git config user.name "UseSafeWeb QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add TSK_0428_AZURE_REGION_DATA_PATH_EVIDENCE_2026-08-28.md
          git commit -m "evidence: verify TSK-0428 Azure region and DNS data path"
          git push origin HEAD:main
