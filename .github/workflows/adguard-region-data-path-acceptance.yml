name: Reconcile TSK-0428 state

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/adguard-region-data-path-acceptance.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Reconcile state
        run: python3 .github/scripts/reconcile_tsk0428.py
      - name: Commit reconciliation and cleanup
        run: |
          git config user.name "UseSafeWeb Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CURRENT_STATE.md TSK_0428_QUEUE_RECOMPUTE_EVIDENCE_2026-08-28.md
          git rm .github/scripts/reconcile_tsk0428.py
          git rm .github/workflows/adguard-region-data-path-acceptance.yml
          git commit -m "state: mark TSK-0428 PASS and recompute governed queue"
          git push origin HEAD:main
