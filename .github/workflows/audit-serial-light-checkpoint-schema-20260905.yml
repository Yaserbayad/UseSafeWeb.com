name: Audit SERIAL LIGHT checkpoint schema

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-serial-light-checkpoint-schema-20260905.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit exact SERIAL LIGHT schema and semantic invariants
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='fe4483426fe3f69cf9f1d969282be16d141788e5'
          ACTUAL_BLOB="$(git hash-object CURRENT_STATE.md)"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('CURRENT_STATE.md')
          d = json.loads(p.read_text(encoding='utf-8'))
          issues = []
          def issue(path, code, detail):
              issues.append({'path': path, 'code': code, 'detail': detail})
          def exact_keys(obj, allowed, required, path):
              if not isinstance(obj, dict):
                  issue(path, 'TYPE', f'expected object, got {type(obj).__name__}')
                  return
              for k in obj:
                  if k not in allowed:
                      issue(f'{path}.{k}', 'ADDITIONAL_PROPERTY', 'field is not allowed')
              for k in required:
                  if k not in obj:
                      issue(f'{path}.{k}', 'MISSING_REQUIRED', 'required field is absent')

          assert d.get('checkpoint_schema') == 'serial-light-checkpoint-v1'
          assert d.get('project_id') == 'UseSafeWeb.com'
          assert d.get('governance_mode') == 'SERIAL_LIGHT'
          assert d.get('checkpoint_revision') == 19
          assert d.get('baseline', {}).get('version') == 1

          exact_keys(d, {'checkpoint_schema','project_id','governance_mode','checkpoint_revision','baseline','runtime'}, {'checkpoint_schema','project_id','governance_mode','checkpoint_revision','baseline','runtime'}, '$')
          b = d['baseline']
          exact_keys(b, {'version','objectives','policy_rules','gates','work_items','closure_criteria'}, {'version','objectives','policy_rules','gates','work_items','closure_criteria'}, '$.baseline')
          for i,o in enumerate(b['objectives']):
              exact_keys(o, {'id','summary','reference'}, {'id','summary'}, f'$.baseline.objectives[{i}]')
          for i,r in enumerate(b['policy_rules']):
              exact_keys(r, {'id','text'}, {'id','text'}, f'$.baseline.policy_rules[{i}]')
          for i,g in enumerate(b['gates']):
              exact_keys(g, {'id','type','condition'}, {'id','type','condition'}, f'$.baseline.gates[{i}]')
          wi_allowed={'id','title','wbs_path','order','depends_on','acceptance_criteria','required_for_completion','plan_priority','gates','executor_constraint','execution_context','spec_reference'}
          wi_required={'id','title','wbs_path','order','depends_on','acceptance_criteria','required_for_completion','gates','execution_context'}
          for i,w in enumerate(b['work_items']):
              path=f'$.baseline.work_items[{i}]({w.get("id","?")})'
              exact_keys(w, wi_allowed, wi_required, path)
              for j,ac in enumerate(w.get('acceptance_criteria',[])):
                  exact_keys(ac, {'id','condition'}, {'id','condition'}, f'{path}.acceptance_criteria[{j}]')
          for i,c in enumerate(b['closure_criteria']):
              exact_keys(c, {'id','condition'}, {'id','condition'}, f'$.baseline.closure_criteria[{i}]')

          r=d['runtime']
          exact_keys(r, {'project_status','governance_blocker','items','gate_satisfactions','human_constraints','closure_references'}, {'project_status','governance_blocker','items','gate_satisfactions','human_constraints','closure_references'}, '$.runtime')
          if r['governance_blocker'] is not None:
              exact_keys(r['governance_blocker'], {'code','reason','required_resolution','reference'}, {'code','reason','required_resolution'}, '$.runtime.governance_blocker')
          item_allowed={'id','status','priority_override','executor_override','continuation_note','wait','blocker','acceptance_references'}
          item_required={'id','status','acceptance_references'}
          ar_allowed={'ac_id','evidence_type','reference','summary','verification_context'}
          ar_required={'ac_id','evidence_type','reference','summary'}
          for i,it in enumerate(r['items']):
              path=f'$.runtime.items[{i}]({it.get("id","?")})'
              exact_keys(it,item_allowed,item_required,path)
              if 'wait' in it:
                  exact_keys(it['wait'], {'condition','resolution_check','reference'}, {'condition','resolution_check'}, f'{path}.wait')
              if 'blocker' in it:
                  exact_keys(it['blocker'], {'reason','required_resolution','reference'}, {'reason','required_resolution'}, f'{path}.blocker')
              ars=it.get('acceptance_references',[])
              if not isinstance(ars,list):
                  issue(f'{path}.acceptance_references','TYPE','expected array')
              else:
                  for j,ar in enumerate(ars):
                      ap=f'{path}.acceptance_references[{j}]'
                      if not isinstance(ar,dict):
                          issue(ap,'TYPE',f'expected acceptanceReference object, got {type(ar).__name__}')
                      else:
                          exact_keys(ar, ar_allowed, ar_required, ap)
          for i,gs in enumerate(r['gate_satisfactions']):
              path=f'$.runtime.gate_satisfactions[{i}]'
              exact_keys(gs, {'gate_id','proof'}, {'gate_id','proof'}, path)
              if isinstance(gs.get('proof'),dict):
                  exact_keys(gs['proof'], {'evidence_type','reference','summary','verification_context'}, {'evidence_type','reference','summary'}, f'{path}.proof')
          for i,h in enumerate(r['human_constraints']):
              exact_keys(h, {'id','scope','work_item_ids','text'}, {'id','scope','text'}, f'$.runtime.human_constraints[{i}]')
          for i,cr in enumerate(r['closure_references']):
              path=f'$.runtime.closure_references[{i}]'
              exact_keys(cr, {'closure_id','proof'}, {'closure_id','proof'}, path)
              if isinstance(cr.get('proof'),dict):
                  exact_keys(cr['proof'], {'evidence_type','reference','summary','verification_context'}, {'evidence_type','reference','summary'}, f'{path}.proof')

          work={w['id']:w for w in b['work_items']}
          items={it['id']:it for it in r['items']}
          if len(work)!=len(b['work_items']): issue('$.baseline.work_items','DUPLICATE_ID','work-item IDs are not unique')
          if len(items)!=len(r['items']): issue('$.runtime.items','DUPLICATE_ID','runtime IDs are not unique')
          if set(work)!=set(items): issue('$.runtime.items','ID_MISMATCH','runtime IDs are not one-to-one with baseline IDs')
          orders=[w['order'] for w in b['work_items']]
          if len(orders)!=len(set(orders)): issue('$.baseline.work_items','DUPLICATE_ORDER','order values are not unique')
          for w in b['work_items']:
              if not w.get('wbs_path') or w['wbs_path'][-1]!=w['id']: issue(f'$.baseline.work_items({w["id"]}).wbs_path','WBS_PATH','last path element does not equal id')
              for dep in w.get('depends_on',[]):
                  if dep not in work: issue(f'$.baseline.work_items({w["id"]}).depends_on','UNKNOWN_DEPENDENCY',dep)
          gate_ids={g['id'] for g in b['gates']}
          for w in b['work_items']:
              for g in w.get('gates',[]):
                  if g not in gate_ids: issue(f'$.baseline.work_items({w["id"]}).gates','UNKNOWN_GATE',g)
          seen_gs=set()
          for gs in r['gate_satisfactions']:
              gid=gs.get('gate_id')
              if gid not in gate_ids: issue('$.runtime.gate_satisfactions','UNKNOWN_GATE',str(gid))
              if gid in seen_gs: issue('$.runtime.gate_satisfactions','DUPLICATE_GATE',str(gid))
              seen_gs.add(gid)
          for wid,it in items.items():
              w=work[wid]
              ac_ids=[ac['id'] for ac in w.get('acceptance_criteria',[])]
              if len(ac_ids)!=len(set(ac_ids)): issue(f'$.baseline.work_items({wid}).acceptance_criteria','DUPLICATE_AC','AC IDs are not unique')
              ar_ids=[]
              for ar in it.get('acceptance_references',[]):
                  if isinstance(ar,dict):
                      aid=ar.get('ac_id'); ar_ids.append(aid)
                      if aid not in ac_ids: issue(f'$.runtime.items({wid}).acceptance_references','UNKNOWN_AC',str(aid))
              if len(ar_ids)!=len(set(ar_ids)): issue(f'$.runtime.items({wid}).acceptance_references','DUPLICATE_AC_REF','multiple refs for same AC')
              st=it.get('status')
              if st=='WAITING':
                  if 'wait' not in it: issue(f'$.runtime.items({wid})','STATE_PAYLOAD','WAITING requires wait')
                  if 'blocker' in it: issue(f'$.runtime.items({wid})','STATE_PAYLOAD','WAITING forbids blocker')
              elif st=='BLOCKED':
                  if 'blocker' not in it: issue(f'$.runtime.items({wid})','STATE_PAYLOAD','BLOCKED requires blocker')
                  if 'wait' in it: issue(f'$.runtime.items({wid})','STATE_PAYLOAD','BLOCKED forbids wait')
              elif st=='TODO':
                  if 'wait' in it or 'blocker' in it: issue(f'$.runtime.items({wid})','STATE_PAYLOAD','TODO forbids wait/blocker')
              elif st=='PASS':
                  for f in ('wait','blocker','continuation_note'):
                      if f in it: issue(f'$.runtime.items({wid}).{f}','STATE_PAYLOAD','PASS forbids this field')
                  if sorted(ar_ids)!=sorted(ac_ids): issue(f'$.runtime.items({wid}).acceptance_references','PASS_PROOF','PASS requires exactly one structured ref for every AC')
              else:
                  issue(f'$.runtime.items({wid}).status','ENUM',str(st))

          expected_w_order=[w['id'] for w in sorted(b['work_items'],key=lambda x:(x['order'],x['id']))]
          if [w['id'] for w in b['work_items']]!=expected_w_order: issue('$.baseline.work_items','ORDER','baseline work_items not canonical order')
          if [it['id'] for it in r['items']]!=expected_w_order: issue('$.runtime.items','ORDER','runtime items not canonical order')

          # Dependency cycle check.
          state={}
          def visit(x, stack):
              if state.get(x)==1:
                  issue('$.baseline.work_items','DEPENDENCY_CYCLE',' -> '.join(stack+[x])); return
              if state.get(x)==2: return
              state[x]=1
              for dep in work[x].get('depends_on',[]):
                  if dep in work: visit(dep, stack+[x])
              state[x]=2
          for wid in work: visit(wid,[])

          out={
              'checkpoint_blob':'fe4483426fe3f69cf9f1d969282be16d141788e5',
              'checkpoint_revision':d['checkpoint_revision'],
              'baseline_version':b['version'],
              'project_status':r['project_status'],
              'work_item_count':len(b['work_items']),
              'runtime_item_count':len(r['items']),
              'issue_count':len(issues),
              'issues':issues,
          }
          Path('checkpoint-schema-audit.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY

      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-schema-audit
          path: checkpoint-schema-audit.json
          if-no-files-found: error

      - name: Remove one-off audit transport
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = 'fe4483426fe3f69cf9f1d969282be16d141788e5'
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/audit-serial-light-checkpoint-schema-20260905.yml
          git commit -m 'recovery: remove checkpoint schema audit transport'
          git push origin HEAD:main
