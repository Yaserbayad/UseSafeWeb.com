name: Sync governed waiting-state refresh 20260905-1120

on:
  push:
    branches:
      - runtime/waiting-monitor-refresh-20260905-1120
    paths:
      - .github/workflows/sync-waiting-monitor-refresh-20260905-1120.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: runtime/waiting-monitor-refresh-20260905-1120
          fetch-depth: 0
          persist-credentials: true
      - name: Persist fresh TSK-0243 WAITING monitor result
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "9ce1d1f0bf225274990dcaaaff9fd3911c4533d6"
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('CURRENT_STATE.md')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['checkpoint_schema'] == 'serial-light-checkpoint-v1'
          assert data['project_id'] == 'UseSafeWeb.com'
          assert data['governance_mode'] == 'SERIAL_LIGHT'
          assert data['checkpoint_revision'] == 14
          assert data['baseline']['version'] == 1
          assert data['runtime']['project_status'] == 'ACTIVE'
          assert data['runtime']['governance_blocker'] is None

          tasks = data['runtime']['items']
          by_id = {node['id']: node for node in tasks}
          for task_id in ('TSK-0243', 'TSK-0452', 'TSK-0360', 'TSK-0369', 'TSK-0455'):
              assert by_id[task_id]['status'] == 'WAITING', (task_id, by_id[task_id]['status'])
          assert not any(node['status'] == 'TODO' for node in tasks), [node['id'] for node in tasks if node['status'] == 'TODO']
          prior = by_id['TSK-0243'].get('wait_details', {})
          assert 'attempt 17' in prior.get('condition', '')
          assert 'timeout rc=124' in prior.get('condition', '')

          data['checkpoint_revision'] = 15
          by_id['TSK-0243']['wait_details'] = {
            'condition': 'Fresh bounded read-only public preflight attempt 18 shows a diagnostic change but does not satisfy the WAITING resolution condition: verify.usesafeweb.com and the deterministic 32-hex challenge host still resolve to 52.157.109.120, and the exact challenge-host TLS/SNI path now reaches a responding endpoint but fails immediately with TLS alert unrecognized name (rc=1) instead of the prior timeout rc=124. The challenge probe still returns HTTP 000, while https://usesafeweb.com/ and /api/dns-verification/requests remain HTTP 502. Functional public-target proof remains unavailable and fenced.',
            'resolution_check': 'Resume TSK-0243 functional target proof only when a fresh rerun of the existing bounded read-only public preflight shows the challenge verifier host has valid TLS/SNI and the approved probe path is externally reachable, and the public application request/result endpoints are healthy. Recheck current source/version and every material-action fence before any functional POST, DNS rewrite, deployment, certificate/proxy mutation, participant processing, production/public activation, market activation, payment, or launch action.',
            'references': [
              'GitHub Actions workflow run 33900198638 attempt 18 / job 101298224787; completed SUCCESS 2026-09-05T11:20:37Z; TSK0243_PUBLIC_DNS_SERVICE_HOST=PRESENT; TSK0243_PUBLIC_VERIFICATION_WILDCARD=PRESENT; TSK0243_PUBLIC_TRUST_BOUNDARY_PREFLIGHT=ROUTING_PRESENT_REQUIRES_FUNCTIONAL_PROOF; exact challenge TLS/SNI FAIL rc=1 with TLS alert unrecognized name; public origin/request HTTP 502; challenge probe HTTP 000; mutation=NONE; participant/payment/launch action=NONE.'
            ]
          }

          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          chk = json.loads(p.read_text(encoding='utf-8'))
          assert chk['checkpoint_schema'] == 'serial-light-checkpoint-v1'
          assert chk['project_id'] == 'UseSafeWeb.com'
          assert chk['governance_mode'] == 'SERIAL_LIGHT'
          assert chk['checkpoint_revision'] == 15
          assert chk['baseline']['version'] == 1
          assert chk['runtime']['project_status'] == 'ACTIVE'
          assert chk['runtime']['governance_blocker'] is None
          assert not any(node['status'] == 'TODO' for node in chk['runtime']['items'])
          check_by_id = {node['id']: node for node in chk['runtime']['items']}
          for task_id in ('TSK-0243', 'TSK-0452', 'TSK-0360', 'TSK-0369', 'TSK-0455'):
              assert check_by_id[task_id]['status'] == 'WAITING', (task_id, check_by_id[task_id]['status'])
          assert 'attempt 18' in check_by_id['TSK-0243']['wait_details']['condition']
          assert 'unrecognized name' in check_by_id['TSK-0243']['wait_details']['condition']
          PY
          test "$(git diff --name-only)" = "CURRENT_STATE.md"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: record TSK-0243 preflight attempt 18'
          git push origin HEAD:runtime/waiting-monitor-refresh-20260905-1120
