name: Reconcile TSK-0514 runtime state

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-tsk-0514-state.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-governance-state
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Reconcile TSK-0514 PASS and next L2 work
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_blob='767dea8e9ecf163cde12cff1fae926f7bc8fd7b5'
          actual_blob="$(git hash-object CURRENT_STATE.md)"
          test "$actual_blob" = "$expected_blob"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CURRENT_STATE.md')
          s=p.read_text(encoding='utf-8')

          old='**Updated:** 2026-08-28T10:16:00Z  '
          new='**Updated:** 2026-08-28T10:38:46Z  '
          assert old in s
          s=s.replace(old,new,1)

          anchor='- `TSK-0203` — supported AdGuard release installed — evidence blob `382b70ca971739712ff8ad5668d03841d5493d62`.'
          assert anchor in s
          pass_line='- `TSK-0514` — external cellular endpoint test and removal/recovery verification — evidence: `TSK_0514_EXTERNAL_ENDPOINT_COMPLETION_EVIDENCE_2026-08-28.md`, blob `c5d004d0e0a8c58d1056b3aaad38034ae4188a68`; owner observation: external cellular UseSafeWeb test PASS, no network-specific failure reported, and normal DNS/internet resolution restored after removing/resetting UseSafeWeb.'
          s=s.replace(anchor,pass_line+'\n'+anchor,1)

          start=s.index('### WAITING — TSK-0514')
          end=s.index('### External/provider and legal boundaries',start)
          replacement='''### TSK-0514 accepted stable state

The exact WBS row defines TSK-0514 as L2 / A3 / `AUTO_ALLOWED` / HIGH with hard predecessors `TSK-0442; TSK-0443`, both current PASS, acceptance `ACC-0514`.

The prior preflight identified exactly two remaining direct target-device observations: one qualifying network outside Azure and outside the operator's normal network under REQ-0066, and removal/reset recovery restoring normal DNS behavior under REQ-0069.

On 2026-08-28 the Project Owner reported that the external cellular test passed and that normal DNS worked after removing UseSafeWeb. No network-specific failure was reported. This is the privacy-minimal observation class explicitly permitted by the preflight; no browsing history, DNS/domain history, screenshot, device identifier or participant data is required or retained.

Evidence: `TSK_0514_EXTERNAL_ENDPOINT_COMPLETION_EVIDENCE_2026-08-28.md`, blob `c5d004d0e0a8c58d1056b3aaad38034ae4188a68`, publication commit `81b0ebc754324c8481912f36cd84115bef16f2a9`. ACC-0514, REQ-0066 and the applicable REQ-0069 removal/recovery condition are satisfied. **TSK-0514: PASS.**

Queue impact was independently evaluated by governance workflow run `33164135015` / job `98825388572` at commit `83172a70e98bed04b25da2d51b7aebadaef0cb45`: releasing TSK-0514 yields exactly one L2 `AUTO_ALLOWED` ready task, `TSK-0511`; releasing TSK-0431 alone yields none.

'''
          s=s[:start]+replacement+s[end:]

          old_boundary='- TSK-0442 TLS target-device acceptance and TSK-0443 certificate renewal/expiry alerting are satisfied; TSK-0514 external-network/removal verification remains a direct target-device observation boundary.'
          new_boundary='- TSK-0442 TLS target-device acceptance, TSK-0443 certificate renewal/expiry alerting, and TSK-0514 external-network/removal verification are satisfied. This does not itself satisfy downstream per-supported-device verification or authorize participant activation.'
          assert old_boundary in s
          s=s.replace(old_boundary,new_boundary,1)

          old_guard='- Plain DNS 53 remains non-public. TSK-0442 TLS and TSK-0443 certificate renewal/expiry controls are PASS, but broader participant/public readiness remains gated by applicable downstream readiness, validation, privacy/legal and activation evidence.'
          new_guard='- Plain DNS 53 remains non-public. TSK-0442 TLS, TSK-0443 certificate renewal/expiry controls, and TSK-0514 external-network/removal verification are PASS, but broader participant/public readiness remains gated by applicable downstream readiness, per-supported-device verification, validation, privacy/legal and activation evidence.'
          assert old_guard in s
          s=s.replace(old_guard,new_guard,1)

          qstart=s.index('## Queue status after current reconciliation')
          nstart=s.index('## Exact next authoritative step',qstart)
          queue='''## Queue status after current reconciliation

TSK-0514 completion evidence is durable at `TSK_0514_EXTERNAL_ENDPOINT_COMPLETION_EVIDENCE_2026-08-28.md`, blob `c5d004d0e0a8c58d1056b3aaad38034ae4188a68`, commit `81b0ebc754324c8481912f36cd84115bef16f2a9`.

Governance dependency evaluation run `33164135015` / job `98825388572`: **PASS** against runtime blob `767dea8e9ecf163cde12cff1fae926f7bc8fd7b5`. The unchanged pre-mutation runtime had `RUNTIME_PASS_COUNT=28`, `RUNTIME_WAIT=TSK-0431,TSK-0514`, and `READY_COUNT=0`; the deterministic WAIT-release evaluation returned `WAIT_RELEASE=TSK-0514;READY_COUNT=1` with the sole task `TSK-0511`, and `WAIT_RELEASE=TSK-0431;READY_COUNT=0`.

After binding the verified owner observation and durable evidence above, runtime truth is `TSK-0514=PASS`; `TSK-0431` remains WAITING. The exact next L2 `AUTO_ALLOWED` candidate is therefore `TSK-0511` — Verify encrypted DNS resolution from supported devices. Its acceptance must be evaluated independently; TSK-0514 does not automatically prove every supported device path.

'''
          s=s[:qstart]+queue+s[nstart:]

          estart=s.index('## Exact next authoritative step')
          exact='''## Exact next authoritative step

Preflight and execute `TSK-0511` — Verify encrypted DNS resolution from supported devices. Confirm its exact supported-device scope and current direct evidence before assigning PASS; do not infer “each supported device” from TSK-0514 alone. If direct target-device evidence remains unavailable, persist the smallest truthful WAITING boundary and deterministic resolution condition.

Separately, `TSK-0431` remains WAITING until the owner identifies/provides the Azure-native backup/restore path required by REQ-0052. Do not bypass participant-activation, legal, Azure control-plane, provider, recovery, privacy or validation gates.
'''
          s=s[:estart]+exact

          assert '### WAITING — TSK-0514' not in s
          assert s.count('`TSK-0514` — external cellular endpoint test and removal/recovery verification') == 1
          assert '### TSK-0514 accepted stable state' in s
          assert 'The exact next L2 `AUTO_ALLOWED` candidate is therefore `TSK-0511`' in s
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          test "$(grep -c '^### WAITING — TSK-0431$' CURRENT_STATE.md)" = '1'
          test "$(grep -c '^### WAITING — TSK-0514$' CURRENT_STATE.md || true)" = '0'
          git config user.name 'Yaserbayad'
          git config user.email '149335096+Yaserbayad@users.noreply.github.com'
          git add CURRENT_STATE.md
          git diff --cached --quiet && { echo 'No runtime delta'; exit 1; }
          git commit -m 'Reconcile TSK-0514 PASS and L2 queue'
          git push origin HEAD:main
