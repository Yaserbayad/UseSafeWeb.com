name: Audit post-TSK-0299 frontier v2

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/post-tsk0299-frontier-v2-trigger.txt']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Prove current frontier without brittle prose matching
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,re,subprocess
          from pathlib import Path
          def blob(p): return subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          wbs=Path('Plans/Master/WBS/master-wbs.csv'); graph=Path('Plans/Master/RELATIONSHIP_INDEX.yaml'); runtime=Path('CURRENT_STATE.md')
          assert blob(wbs)=='b27a0c5df2f5636d8ed71051e9e26a68959a2616'
          assert blob(graph)=='c108d2c162bcea2ee4cc01def46d0487a9501032'
          assert blob(runtime)=='dbe82497b0bfe5a699c446ca8b343568c7ca456f'
          with wbs.open(newline='',encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          byid={r['Task_ID']:r for r in rows if r.get('Task_ID')}
          for tid in ['TSK-0302','TSK-0301','TSK-0316']:
              r=byid[tid]
              print('ROW|{}|stage={}|priority={}|authority={}|deps={}|acc={}|ver={}|evd={}'.format(tid,r['Lifecycle_Stage'],r['Priority'],r['Action_Authority'],r['Dependencies'],r['Acceptance_ID'],r['Verification_ID'],r['Evidence_ID']))
          assert byid['TSK-0302']['Dependencies'].strip()=='TSK-0298'
          assert byid['TSK-0301']['Dependencies'].strip()=='TSK-0302; TSK-0299'
          assert byid['TSK-0316']['Dependencies'].strip()=='TSK-0315'

          rt=runtime.read_text(encoding='utf-8')
          for h in ['### TSK-0302 accepted stable state','### TSK-0301 accepted stable state','## TSK-0299 current accepted stable state — 2026-09-01 — POST-CR-0008 CORRECTED OWNER-IDENTITY BINDING','## TSK-0315 current accepted stable state']:
              assert h in rt, h

          concept=Path('brand/concepts/TSK-0302/README.md'); identity=Path('brand/identity/TSK-0301/README.md'); approval=Path('TSK_0301_OWNER_IDENTITY_APPROVAL_2026-08-29.md'); correction=Path('TSK_0299_POST_CR0008_OWNER_IDENTITY_BINDING_CORRECTION_2026-09-01.md'); friction=Path('TSK_0316_FRICTION_BUDGET_AND_INTERACTION_CHALLENGE_2026-08-28.md')
          assert blob(concept)=='59c01476f22147f5567c4d10fd0a0c122056ae23'
          assert blob(identity)=='b8ffd2ed234465a238558a7b94e56274de49696a'
          assert blob(approval)=='66f4b545c03571649a8baa4c0fe3d1df564b5949'
          assert blob(correction)=='6b4ac6020391a2f6e291f83c50f27a7583215f3b'
          assert blob(friction)=='07df8b1909809a069e3ddba1ff10b688d2f5a5e0'

          c=concept.read_text(encoding='utf-8'); i=identity.read_text(encoding='utf-8'); a=approval.read_text(encoding='utf-8'); corr=correction.read_text(encoding='utf-8'); f=friction.read_text(encoding='utf-8')
          # TSK-0302: current acceptance is visual-direction quality/editability/claims restraint; optional-account activation does not change it.
          for s in ['three','editable vector source','scale without fixed-resolution detail','avoid surveillance motifs','No direction is called parent-preferred','exactly a small set of three directions exists']:
              assert s in c, s
          print('TSK0302_CURRENT_VALIDITY=PASS')

          # TSK-0301 substantive identity remains current and is explicitly preserved by corrected TSK-0299.
          for s in ['The visible product/brand name is exactly **SafeWeb**.','do not render `UseSafeWeb`','Cross-surface reuse','Multilingual / RTL use']:
              assert s in i, s
          assert '**Decision:** APPROVED' in a and '**Brand name:** `SafeWeb`' in a
          assert 'TSK-0301 owner-approved identity is preserved rather than reselected or overwritten' in corr
          print('TSK0301_SUBSTANTIVE_IDENTITY=PASS')
          print('TSK0301_OWNER_RESELECTION_REQUIRED=NO')
          print('TSK0301_CURRENT_PREDECESSOR_REVALIDATION_REQUIRED=YES')

          # TSK-0316 historical friction model is accountless-only where CR-0006 now requires optional-account lifecycle friction analysis.
          assert 'mandatory UseSafeWeb account/login/sign-up' in f
          assert 'persistent child/device profile creation' in f
          assert 'Resulting minimum provisional happy path' in f
          assert 'optional parent account' not in f.lower()
          assert 'dashboard' not in f.lower()
          print('TSK0316_CR0006_SEMANTIC_STALENESS=PASS')
          print('TSK0316_REQUALIFICATION_REQUIRED=YES')

          def deps(r): return [x.strip() for x in re.split(r'[;,]',r.get('Dependencies','')) if x.strip().startswith('TSK-')]
          rev={tid:[] for tid in byid}
          for r in rows:
              for d in deps(r): rev.setdefault(d,[]).append(r['Task_ID'])
          counts={}
          for root in ['TSK-0301','TSK-0316']:
              seen={root}; q=[root]
              while q:
                  x=q.pop(0)
                  for y in rev.get(x,[]):
                      if y not in seen: seen.add(y); q.append(y)
              counts[root]=len(seen)-1
              print('DESC|{}|count={}'.format(root,counts[root]))
              print('DIRECT_SUCCESSORS|{}|{}'.format(root,','.join(rev.get(root,[]))))
          assert byid['TSK-0301']['Lifecycle_Stage']=='L4' and byid['TSK-0301']['Priority']=='HIGH' and byid['TSK-0301']['Action_Authority']=='AUTO_ALLOWED'
          assert byid['TSK-0316']['Lifecycle_Stage']=='L4' and byid['TSK-0316']['Priority']=='HIGH' and byid['TSK-0316']['Action_Authority']=='AUTO_ALLOWED'
          print('TSK0301_DESCENDANTS='+str(counts['TSK-0301']))
          print('TSK0316_DESCENDANTS='+str(counts['TSK-0316']))
          print('SELECTION_DEPENDENCY_CHAIN_WINNER='+('TSK-0301' if counts['TSK-0301']>counts['TSK-0316'] else 'TSK-0316' if counts['TSK-0316']>counts['TSK-0301'] else 'TIE'))
          print('FRONTIER|1|TSK-0301|dependency-complete current revalidation|owner_action=NONE')
          print('FRONTIER|2|TSK-0316|CR-0006 dual-mode friction requalification|owner_action=NONE')
          print('RUNTIME_BLOB='+blob(runtime))
          PY
