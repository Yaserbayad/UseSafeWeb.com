name: Diagnose TSK-0321 200 percent text overflow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-tsk0321-200pct-overflow-20260901.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Reproduce and identify overflow boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = 'adguardvm'
          runtime_dir="$RUNNER_TEMP/tsk0321-overflow-diagnostic"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          npm install --prefix "$runtime_dir" --no-save --no-package-lock playwright@1.62.0
          playwright_module="$runtime_dir/node_modules/playwright"
          PLAYWRIGHT_BROWSERS_PATH="$runtime_dir/browsers" "$runtime_dir/node_modules/.bin/playwright" install chromium
          python3 -m http.server 8033 --bind 127.0.0.1 >/tmp/tsk0321-overflow-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS 'http://127.0.0.1:8033/prototype/TSK-0333/index.html' >/dev/null; then break; fi
            sleep 0.25
          done
          TSK0321_BASE_URL='http://127.0.0.1:8033/prototype/TSK-0333/index.html' TSK0321_PLAYWRIGHT_MODULE="$playwright_module" PLAYWRIGHT_BROWSERS_PATH="$runtime_dir/browsers" node .github/scripts/diagnose_tsk0321_200pct_overflow_20260901.mjs
          git diff --check
          test -z "$(git status --porcelain)"
