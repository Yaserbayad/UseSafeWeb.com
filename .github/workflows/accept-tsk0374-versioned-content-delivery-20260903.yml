name: TSK-0374 versioned content delivery source acceptance

on:
  push:
    branches:
      - main
      - feature/tsk-0374-versioned-content-delivery-20260903
    paths:
      - 'website/**'
      - '.github/workflows/accept-tsk0374-versioned-content-delivery-20260903.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/accept-tsk0374-versioned-content-delivery-20260903.yml'

permissions:
  contents: read

jobs:
  accept-tsk0374:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Verify TSK-0374 source contract and production baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object website/package-lock.json)" = '6ff91d845bc5f3099b6a00f5f43673eed80a3ba5'
          test "$(git hash-object content/TSK-0323/CATALOGUE.json)" = '79753cc4916d38ed8d2f0ed6d01890e62df3fb04'
          test "$(git hash-object website/src/content/instruction-bindings.json)" = '32441b56f5b2daf2c9924584685fd35fb416438e'
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          cd website
          npm ci --ignore-scripts --no-fund --no-audit
          node --test tests/contract/tsk0374.test.mjs
          npm run test:contract
          npm run lint
          npm run typecheck
          NEXT_TELEMETRY_DISABLED=1 npm run build
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          cd ..
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'TSK0374_VERSIONED_CONTENT_DELIVERY_SOURCE_ACCEPTANCE=PASS'
