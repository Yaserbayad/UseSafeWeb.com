name: TSK-0243 isolated ephemeral target proof

on:
  push:
    branches:
      - verify/tsk-0243-ephemeral-target-20260904
    paths:
      - '.github/workflows/verify-tsk0243-ephemeral-target-20260904.yml'

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  ephemeral-target:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout exact proof head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify canonical base, authority, and live target identity
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='041caa3858b61fb4119a66e9f139ccb3ebd318a0'
          EXPECTED_REF='refs/heads/verify/tsk-0243-ephemeral-target-20260904'
          [[ "${GITHUB_EVENT_NAME}" == 'push' ]]
          [[ "${GITHUB_REF}" == "${EXPECTED_REF}" ]]
          [[ "$(git merge-base HEAD "${BASE}")" == "${BASE}" ]]
          [[ "$(git diff --name-only "${BASE}" HEAD)" == '.github/workflows/verify-tsk0243-ephemeral-target-20260904.yml' ]]
          [[ "${RUNNER_OS}" == 'Linux' ]]
          [[ "${RUNNER_ARCH}" == 'X64' ]]
          [[ "$(hostname -s)" == 'adguardvm' ]]
          [[ "$(id -un)" == 'azureusr' ]]
          sudo -n true
          . /etc/os-release
          [[ "${ID}" == 'ubuntu' ]]
          [[ "${VERSION_ID}" == '24.04' ]]
          sudo systemctl is-active --quiet AdGuardHome.service
          sudo test -x /opt/AdGuardHome/AdGuardHome
          sudo /opt/AdGuardHome/AdGuardHome --version | grep -F 'v0.107.79'
          command -v unshare >/dev/null
          command -v ip >/dev/null
          command -v nginx >/dev/null
          command -v openssl >/dev/null
          command -v dig >/dev/null
          command -v curl >/dev/null
          echo 'TSK0243_TARGET_IDENTITY=PASS'
          echo 'TSK0243_EPHEMERAL_ENVIRONMENT=EPH-DNS+EPH-APP'

      - name: Set up job-scoped Node toolchain
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build exact canonical application source and job-scoped browser
        shell: bash
        run: |
          set -Eeuo pipefail
          cd website
          npm ci --no-fund --no-audit
          npm run test:contract
          npm run lint
          npm run typecheck
          NEXT_TELEMETRY_DISABLED=1 npm run build
          PLAYWRIGHT_VERSION='1.62.1'
          npm install --no-save --no-package-lock --ignore-scripts "playwright@${PLAYWRIGHT_VERSION}"
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" install chromium
          test -z "$(git status --porcelain)"
          echo 'TSK0243_SOURCE_AND_BROWSER_TOOLING=PASS'

      - name: Execute isolated DNS TLS proxy application browser and rollback proof
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="${RUNNER_TEMP}/tsk0243-eph-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${ROOT}"
          mkdir -p "${ROOT}/adguard" "${ROOT}/nginx"
          chmod 700 "${ROOT}"

          LIVE_CONFIG='/opt/AdGuardHome/AdGuardHome.yaml'
          LIVE_CONFIG_SHA_BEFORE="$(sudo sha256sum "${LIVE_CONFIG}" | awk '{print $1}')"
          LIVE_PID_BEFORE="$(sudo systemctl show -p MainPID --value AdGuardHome.service)"
          LIVE_STATE_BEFORE="$(sudo systemctl is-active AdGuardHome.service)"
          LIVE_PRIVACY_BEFORE="$(sudo python3 - <<'PY'
          import hashlib,json,yaml
          p='/opt/AdGuardHome/AdGuardHome.yaml'
          with open(p,encoding='utf-8') as f: d=yaml.safe_load(f) or {}
          q=d.get('querylog') or {}; s=d.get('statistics') or {}; rules=d.get('user_rules') or []
          v={'querylog_enabled':q.get('enabled'),'querylog_file_enabled':q.get('file_enabled'),'statistics_enabled':s.get('enabled'),'user_rules_sha256':hashlib.sha256(json.dumps(rules,sort_keys=True,separators=(',',':')).encode()).hexdigest(),'user_rules_count':len(rules) if isinstance(rules,list) else -1}
          print(hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':')).encode()).hexdigest())
          PY
          )"
          [[ "${LIVE_STATE_BEFORE}" == 'active' ]]
          [[ "${LIVE_PID_BEFORE}" =~ ^[1-9][0-9]*$ ]]

          cleanup_outer() {
            rm -f website/.tsk0243-eph-browser.mjs
            rm -rf "${ROOT}"
          }
          trap cleanup_outer EXIT

          SIGNING_SECRET="$(openssl rand -hex 32)"
          test "${#SIGNING_SECRET}" -eq 64
          chmod 700 "${ROOT}"

          openssl genrsa -out "${ROOT}/ca.key" 2048 >/dev/null 2>&1
          openssl req -x509 -new -nodes -key "${ROOT}/ca.key" -sha256 -days 1 \
            -subj '/CN=UseSafeWeb TSK-0243 Ephemeral Test CA' -out "${ROOT}/ca.crt" >/dev/null 2>&1
          cat >"${ROOT}/server.cnf" <<'EOF'
          [req]
          distinguished_name=dn
          prompt=no
          req_extensions=req_ext
          [dn]
          CN=*.verify.usesafeweb.com
          [req_ext]
          subjectAltName=@alt_names
          [alt_names]
          DNS.1=*.verify.usesafeweb.com
          DNS.2=eph-app.usesafeweb.test
          EOF
          openssl genrsa -out "${ROOT}/server.key" 2048 >/dev/null 2>&1
          openssl req -new -key "${ROOT}/server.key" -out "${ROOT}/server.csr" -config "${ROOT}/server.cnf" >/dev/null 2>&1
          openssl x509 -req -in "${ROOT}/server.csr" -CA "${ROOT}/ca.crt" -CAkey "${ROOT}/ca.key" -CAcreateserial \
            -out "${ROOT}/server.crt" -days 1 -sha256 -extfile "${ROOT}/server.cnf" -extensions req_ext >/dev/null 2>&1
          chmod 600 "${ROOT}"/*.key
          SPKI_PIN="$(openssl x509 -in "${ROOT}/server.crt" -pubkey -noout | openssl pkey -pubin -outform der 2>/dev/null | openssl dgst -sha256 -binary | openssl base64 -A)"
          test -n "${SPKI_PIN}"

          cat >"${ROOT}/AdGuardHome.yaml" <<'EOF'
          schema_version: 34
          http:
            address: 127.0.0.54:3000
          dns:
            bind_hosts:
              - 127.0.0.53
            port: 53
            upstream_dns:
              - 9.9.9.9
            upstream_dns_file: ""
            bootstrap_dns:
              - 9.9.9.9
            fallback_dns: []
            private_upstream: []
            upstream_mode: load_balance
            ratelimit: 20
            ratelimit_subnet_len_ipv4: 24
            ratelimit_subnet_len_ipv6: 56
            ratelimit_whitelist: []
            refuse_any: true
            edns_client_subnet:
              enabled: false
              use_custom: false
              custom_ip: ""
            anonymize_client_ip: true
            cache_size: 0
            cache_ttl_min: 0
            cache_ttl_max: 0
            cache_optimistic: false
          filtering:
            protection_enabled: true
            filtering_enabled: true
            blocking_mode: default
            safebrowsing_enabled: false
            parental_enabled: false
            safesearch_enabled: false
          filters: []
          whitelist_filters: []
          user_rules:
            - '||verify.usesafeweb.com^$dnsrewrite=NOERROR;A;127.0.0.2'
            - '||eph-app.usesafeweb.test^$dnsrewrite=NOERROR;A;127.0.0.3'
          querylog:
            enabled: false
            file_enabled: false
            interval: 1d
          statistics:
            enabled: false
            interval: 1d
          tls:
            enabled: false
            force_https: false
            port_dns_over_quic: 8853
            port_dns_over_tls: 8853
            port_https: 8443
            server_name: ""
          dhcp:
            enabled: false
          EOF

          cat >"${ROOT}/nginx.conf" <<EOF
          pid ${ROOT}/nginx.pid;
          error_log ${ROOT}/nginx-error.log notice;
          events { worker_connections 128; }
          http {
            access_log off;
            limit_req_zone \$binary_remote_addr zone=tsk0243_probe:1m rate=20r/s;
            server {
              listen 127.0.0.2:443 ssl;
              server_name ~^[0-9a-f]{32}\\.verify\\.usesafeweb\\.com\$;
              ssl_certificate ${ROOT}/server.crt;
              ssl_certificate_key ${ROOT}/server.key;
              ssl_protocols TLSv1.2 TLSv1.3;
              location = /api/dns-verification/probes {
                limit_req zone=tsk0243_probe burst=5 nodelay;
                limit_req_status 429;
                proxy_pass http://127.0.0.1:3100;
                proxy_set_header Host \$host;
                proxy_set_header Origin \$http_origin;
                proxy_set_header X-Forwarded-Proto https;
              }
              location / { return 404; }
            }
            server {
              listen 127.0.0.3:443 ssl;
              server_name eph-app.usesafeweb.test;
              ssl_certificate ${ROOT}/server.crt;
              ssl_certificate_key ${ROOT}/server.key;
              ssl_protocols TLSv1.2 TLSv1.3;
              location / {
                proxy_pass http://127.0.0.1:3100;
                proxy_set_header Host \$host;
                proxy_set_header X-Forwarded-Proto https;
              }
            }
          }
          EOF

          cat >"${ROOT}/resolv.conf" <<'EOF'
          nameserver 127.0.0.53
          options timeout:1 attempts:1
          EOF

          cat >website/.tsk0243-eph-browser.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const publicBase = 'https://eph-app.usesafeweb.test';
          const pin = process.env.EPH_SPKI_PIN;
          assert.ok(pin);
          const coreKey = 'usesafeweb:core:v1';
          const retiredProofKey = 'usesafeweb:dns-verification:v1';
          const browser = await chromium.launch({headless:true,args:[`--ignore-certificate-errors-spki-list=${pin}`]});
          const context = await browser.newContext({viewport:{width:390,height:844}});
          const page = await context.newPage();
          try {
            await page.goto(`${publicBase}/en-GB/start`, {waitUntil:'domcontentloaded'});
            const now=Date.now();
            await page.evaluate(({key,state})=>sessionStorage.setItem(key,JSON.stringify(state)),{
              key:coreKey,
              state:{schemaVersion:1,scope:'ab'.repeat(16),createdAt:now-1000,hardExpiresAt:now+120000,locale:'en-GB',phase:'verify',loginRequired:false,retryCount:0,deviceFamily:'android'}
            });
            const response=await page.goto(`${publicBase}/en-GB/verify?platform=android`,{waitUntil:'domcontentloaded'});
            assert.equal(response?.status(),200);
            await page.locator('[data-verification-outcome]').waitFor({state:'visible'});
            await page.waitForFunction(()=>document.querySelector('[data-verification-outcome]')?.getAttribute('data-verification-outcome')==='working');
            const panel=page.locator('[data-verification-outcome]');
            assert.equal(await panel.getAttribute('data-protection-state'),'protected/verified');
            assert.equal(await panel.getAttribute('data-parent-confirmation'),'confirmed');
            const values=await page.evaluate(()=>Object.values(sessionStorage));
            assert.equal(await page.evaluate((k)=>sessionStorage.getItem(k),retiredProofKey),null);
            for (const value of values) {
              assert.equal(value.includes('observationToken'),false);
              assert.equal(value.includes('challenge'),false);
              assert.equal(value.includes('verify.usesafeweb.com'),false);
            }
            await page.locator('[data-core-view-protection]').click();
            await page.waitForURL(`${publicBase}/en-GB/protection?platform=android`);
            await page.locator('[data-dns-verification-state]').waitFor({state:'visible'});
            await page.waitForFunction(()=>document.querySelector('[data-dns-verification-state]')?.getAttribute('data-dns-verification-state')==='working');
            const card=page.locator('[data-dns-verification-state]');
            assert.equal(await card.getAttribute('data-protection-state'),'protected/verified');
            assert.equal((await card.innerText()).includes('Protection verified'),true);
            console.log('TSK0243_EPH_BROWSER_REAL_DNS_TLS_PATH=PASS');
          } finally {
            await context.close();
            await browser.close();
          }
          EOF

          cat >"${ROOT}/inside.sh" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          : "${ROOT:?}" "${SIGNING_SECRET:?}" "${SPKI_PIN:?}" "${NODE_PATH_VALUE:?}" "${NPM_PATH:?}" "${WORKSPACE:?}"
          ip link set lo up
          mount --make-rprivate /
          mount --bind "${ROOT}/resolv.conf" /etc/resolv.conf

          pids=()
          cleanup_inner() {
            set +e
            for pid in "${pids[@]}"; do kill -TERM -- "-${pid}" >/dev/null 2>&1 || true; done
            sleep 1
            for pid in "${pids[@]}"; do kill -KILL -- "-${pid}" >/dev/null 2>&1 || true; done
          }
          trap cleanup_inner EXIT

          setsid /opt/AdGuardHome/AdGuardHome -c "${ROOT}/AdGuardHome.yaml" -w "${ROOT}/adguard" --no-check-update >"${ROOT}/adguard.log" 2>&1 &
          pids+=("$!")
          setsid runuser -u azureusr -- env PATH="${NODE_PATH_VALUE}" USESAFEWEB_DNS_VERIFICATION_SIGNING_SECRET="${SIGNING_SECRET}" USESAFEWEB_PUBLIC_ORIGIN='https://eph-app.usesafeweb.test' NEXT_TELEMETRY_DISABLED=1 \
            bash -lc "cd '${WORKSPACE}/website' && exec '${NPM_PATH}' start -- --hostname 127.0.0.1 --port 3100" >"${ROOT}/next.log" 2>&1 &
          pids+=("$!")
          setsid nginx -p "${ROOT}/nginx/" -c "${ROOT}/nginx.conf" -g 'daemon off;' >"${ROOT}/nginx-stdout.log" 2>&1 &
          pids+=("$!")

          ready=0
          for _ in $(seq 1 30); do
            if dig +time=1 +tries=1 +short @127.0.0.53 eph-app.usesafeweb.test A 2>/dev/null | grep -qx '127.0.0.3' \
              && curl -fsS --max-time 2 http://127.0.0.1:3100/en-GB >/dev/null 2>&1 \
              && curl -fsS --max-time 2 --cacert "${ROOT}/ca.crt" https://eph-app.usesafeweb.test/en-GB >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          if [[ "${ready}" -ne 1 ]]; then
            echo 'TSK0243_EPH_READY=FAIL'
            tail -n 80 "${ROOT}/adguard.log" || true
            tail -n 80 "${ROOT}/next.log" || true
            tail -n 80 "${ROOT}/nginx-error.log" || true
            exit 1
          fi
          echo 'TSK0243_EPH_READY=PASS'

          scope="$(openssl rand -hex 16)"
          request_json="$(curl -fsS --max-time 5 --cacert "${ROOT}/ca.crt" -H 'Content-Type: application/json' --data "{\"scope\":\"${scope}\"}" https://eph-app.usesafeweb.test/api/dns-verification/requests)"
          challenge="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["challenge"])' <<<"${request_json}")"
          probe_host="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["probeHost"])' <<<"${request_json}")"
          request_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["requestToken"])' <<<"${request_json}")"
          [[ "${probe_host}" == "${challenge}.verify.usesafeweb.com" ]]
          [[ "${challenge}" =~ ^[0-9a-f]{32}$ ]]
          printf '%s\n' "${challenge}" >"${ROOT}/challenge.txt"

          dns_answer="$(dig +time=1 +tries=1 +short "${probe_host}" A | tr -d '\r')"
          [[ "${dns_answer}" == '127.0.0.2' ]]
          echo 'TSK0243_EPH_ACTUAL_SYSTEM_DNS_REWRITE=PASS'

          openssl s_client -connect 127.0.0.2:443 -servername "${probe_host}" -CAfile "${ROOT}/ca.crt" -verify_return_error </dev/null 2>"${ROOT}/tls.err" | openssl x509 -noout -checkhost "${probe_host}" >/dev/null
          echo 'TSK0243_EPH_TLS_HOST_AUTHENTICATION=PASS'

          wrong_origin_status="$(curl -sS --max-time 5 --cacert "${ROOT}/ca.crt" -o /dev/null -w '%{http_code}' -H 'Origin: https://evil.example' -H 'Content-Type: text/plain' --data-binary "${request_token}" "https://${probe_host}/api/dns-verification/probes")"
          [[ "${wrong_origin_status}" == '403' ]]
          wrong_host="wrong.${probe_host}"
          wrong_host_status="$(curl -sS --max-time 5 --cacert "${ROOT}/ca.crt" -o /dev/null -w '%{http_code}' -H 'Origin: https://eph-app.usesafeweb.test' -H 'Content-Type: text/plain' --data-binary "${request_token}" "https://${wrong_host}/api/dns-verification/probes" || true)"
          [[ "${wrong_host_status}" == '403' ]]
          wrong_path_status="$(curl -sS --max-time 5 --cacert "${ROOT}/ca.crt" -o /dev/null -w '%{http_code}' "https://${probe_host}/")"
          [[ "${wrong_path_status}" == '404' ]]
          echo 'TSK0243_EPH_WRONG_ORIGIN_HOST_PATH_FAIL_CLOSED=PASS'

          probe_json="$(curl -fsS --max-time 5 --cacert "${ROOT}/ca.crt" -H 'Origin: https://eph-app.usesafeweb.test' -H 'Content-Type: text/plain' --data-binary "${request_token}" "https://${probe_host}/api/dns-verification/probes")"
          observation_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["observationToken"])' <<<"${probe_json}")"
          result_json="$(python3 - <<'PY' "${request_token}" "${observation_token}"
          import json,sys
          print(json.dumps({'requestToken':sys.argv[1],'observationToken':sys.argv[2]},separators=(',',':')))
          PY
          )"
          verified_json="$(curl -fsS --max-time 5 --cacert "${ROOT}/ca.crt" -H 'Content-Type: application/json' --data-binary "${result_json}" https://eph-app.usesafeweb.test/api/dns-verification/results)"
          python3 - <<'PY' <<<"${verified_json}"
          import json,sys
          v=json.load(sys.stdin)
          assert v['dnsPath']=='verified-fresh',v
          assert v['reasonCode']=='TECH_VERIFIED',v
          assert v['verifierVersion']=='private-rewrite-v1',v
          assert isinstance(v.get('observedAt'),int),v
          PY
          echo 'TSK0243_EPH_REQUEST_PROBE_RESULT=PASS'

          tampered="${observation_token%?}A"
          tampered_json="$(python3 - <<'PY' "${request_token}" "${tampered}"
          import json,sys
          print(json.dumps({'requestToken':sys.argv[1],'observationToken':sys.argv[2]},separators=(',',':')))
          PY
          )"
          tampered_status="$(curl -sS --max-time 5 --cacert "${ROOT}/ca.crt" -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data-binary "${tampered_json}" https://eph-app.usesafeweb.test/api/dns-verification/results)"
          [[ "${tampered_status}" == '403' ]]
          echo 'TSK0243_EPH_TAMPER_FAIL_CLOSED=PASS'

          EPH_SPKI_PIN="${SPKI_PIN}" runuser -u azureusr -- env PATH="${NODE_PATH_VALUE}" EPH_SPKI_PIN="${SPKI_PIN}" bash -lc "cd '${WORKSPACE}/website' && exec node .tsk0243-eph-browser.mjs"

          mkdir -p "${ROOT}/rate"
          for i in $(seq 1 30); do
            (curl -sS --max-time 5 --cacert "${ROOT}/ca.crt" -o /dev/null -w '%{http_code}\n' -H 'Origin: https://eph-app.usesafeweb.test' -H 'Content-Type: text/plain' --data-binary "${request_token}" "https://${probe_host}/api/dns-verification/probes" >"${ROOT}/rate/${i}.status" || true) &
          done
          wait
          cat "${ROOT}"/rate/*.status | grep -qx '429'
          echo 'TSK0243_EPH_RATE_LIMIT=PASS'

          [[ ! -e "${ROOT}/adguard/data/querylog.json" ]]
          [[ ! -e "${ROOT}/adguard/data/querylog.json.1" ]]
          find "${ROOT}/adguard" -type f -maxdepth 3 -print | sed "s#${ROOT}#<EPH>#g" | sort >"${ROOT}/adguard-files.txt"
          ! grep -Ei 'querylog' "${ROOT}/adguard-files.txt"
          echo 'TSK0243_EPH_QUERY_HISTORY_STORAGE_ABSENT=PASS'
          echo 'TSK0243_EPH_INNER_ACCEPTANCE=PASS'
          EOF
          chmod 700 "${ROOT}/inside.sh"

          NODE_DIR="$(dirname "$(command -v node)")"
          NPM_PATH="$(command -v npm)"
          sudo env ROOT="${ROOT}" SIGNING_SECRET="${SIGNING_SECRET}" SPKI_PIN="${SPKI_PIN}" NODE_PATH_VALUE="${NODE_DIR}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" NPM_PATH="${NPM_PATH}" WORKSPACE="${GITHUB_WORKSPACE}" \
            unshare --mount --net --pid --fork --mount-proc "${ROOT}/inside.sh"
          unset SIGNING_SECRET

          challenge="$(cat "${ROOT}/challenge.txt")"
          [[ "${challenge}" =~ ^[0-9a-f]{32}$ ]]
          probe_host="${challenge}.verify.usesafeweb.com"
          local_live_answer="$(dig +time=2 +tries=1 +short @127.0.0.1 "${probe_host}" A 2>/dev/null || true)"
          [[ -z "${local_live_answer}" ]]
          public_observed=0
          public_answers=0
          for resolver in 9.9.9.9 1.1.1.1; do
            full="$(dig +time=2 +tries=1 +noall +comments @"${resolver}" "${probe_host}" A 2>/dev/null || true)"
            out="$(dig +time=2 +tries=1 +short @"${resolver}" "${probe_host}" A 2>/dev/null || true)"
            if grep -Eq 'status: (NOERROR|NXDOMAIN|SERVFAIL|REFUSED)' <<<"${full}"; then
              public_observed=$((public_observed+1))
              [[ -z "${out}" ]] || public_answers=$((public_answers+1))
            fi
          done
          [[ "${public_observed}" -ge 1 ]]
          [[ "${public_answers}" -eq 0 ]]
          echo 'TSK0243_PUBLIC_FALSE_POSITIVE_GUARD=PASS'

          LIVE_CONFIG_SHA_AFTER="$(sudo sha256sum "${LIVE_CONFIG}" | awk '{print $1}')"
          LIVE_PID_AFTER="$(sudo systemctl show -p MainPID --value AdGuardHome.service)"
          LIVE_STATE_AFTER="$(sudo systemctl is-active AdGuardHome.service)"
          LIVE_PRIVACY_AFTER="$(sudo python3 - <<'PY'
          import hashlib,json,yaml
          p='/opt/AdGuardHome/AdGuardHome.yaml'
          with open(p,encoding='utf-8') as f: d=yaml.safe_load(f) or {}
          q=d.get('querylog') or {}; s=d.get('statistics') or {}; rules=d.get('user_rules') or []
          v={'querylog_enabled':q.get('enabled'),'querylog_file_enabled':q.get('file_enabled'),'statistics_enabled':s.get('enabled'),'user_rules_sha256':hashlib.sha256(json.dumps(rules,sort_keys=True,separators=(',',':')).encode()).hexdigest(),'user_rules_count':len(rules) if isinstance(rules,list) else -1}
          print(hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':')).encode()).hexdigest())
          PY
          )"
          [[ "${LIVE_CONFIG_SHA_AFTER}" == "${LIVE_CONFIG_SHA_BEFORE}" ]]
          [[ "${LIVE_PID_AFTER}" == "${LIVE_PID_BEFORE}" ]]
          [[ "${LIVE_STATE_AFTER}" == "${LIVE_STATE_BEFORE}" ]]
          [[ "${LIVE_PRIVACY_AFTER}" == "${LIVE_PRIVACY_BEFORE}" ]]
          echo 'TSK0243_LIVE_ADGUARD_UNCHANGED=PASS'

          rm -f website/.tsk0243-eph-browser.mjs
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'TSK0243_EPHEMERAL_ROLLBACK_TEARDOWN=PASS'
          echo 'TSK0243_DEPLOYMENT_ACTION=NONE'
          echo 'TSK0243_PRODUCTION_DNS_CONFIG_ACTION=NONE'
          echo 'TSK0243_PRODUCTION_PROXY_CONFIG_ACTION=NONE'
          echo 'TSK0243_PRODUCTION_CERTIFICATE_ACTION=NONE'
          echo 'TSK0243_PARTICIPANT_ACTION=NONE'
          echo 'TSK0243_PAYMENT_ACTION=NONE'
          echo 'TSK0243_LAUNCH_ACTION=NONE'
          echo 'TSK0243_EPH_TARGET_PROOF=PASS'
          echo 'TSK0243_DISPOSITION=PARTIAL_TARGET_EVIDENCE_ONLY'
