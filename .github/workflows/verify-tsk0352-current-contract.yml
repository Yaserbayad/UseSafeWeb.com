name: Verify TSK-0352 current contract

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0352-current-verifier-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Run structural and version-pinned TSK-0352 verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_tsk0352_current_contract_v2.py
