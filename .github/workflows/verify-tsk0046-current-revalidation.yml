name: Verify TSK-0046 current revalidation

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0046-current-verifier-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Independently verify current TSK-0046 acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, re, subprocess
          from pathlib import Path

          expected={
            'Plans/Master/WBS/master-wbs.csv':'b27a0c5df2f5636d8ed71051e9e26a68959a2616',
            'Plans/Master/RELATIONSHIP_INDEX.yaml':'c108d2c162bcea2ee4cc01def46d0487a9501032',
            'CURRENT_STATE.md':'b0e320a862eaf83b3fea11e565b42621608578eb',
            'TSK_0046_POST_CR0008_DUAL_MODE_PERFORMANCE_CAPACITY_NFR_REVALIDATION_2026-09-02.md':'8e72d542b68de6f7f5c8c375b63b6229c6d15529',
            'TSK_0046_PERFORMANCE_CAPACITY_NFR_2026-08-28.md':'2c48f975d557b1bb4ba6c58c2a8ad3580b2c7b06',
            'TSK_0046_PERFORMANCE_CAPACITY_NFR_EVIDENCE_2026-08-28.md':'09d111530c5e9c86feb2cafb54f62fb046a44b6f',
            'TSK_0538_POST_CR0008_DUAL_MODE_RELIABILITY_OBSERVABILITY_NFR_REVALIDATION_2026-09-02.md':'44c9c299465e821e2ffd84a54b77e3e615d61925',
            'TSK_0538_POST_CR0008_CURRENT_REVALIDATION_EVIDENCE_2026-09-02.md':'3ba04601ea5574fcd1fb1f58f95922ae94b74ac2',
          }
          def blob(path): return subprocess.check_output(['git','hash-object',path],text=True).strip()
          for path,sha in expected.items():
              assert Path(path).exists(), 'missing '+path
              actual=blob(path)
              assert actual==sha, f'hash drift {path}: {actual} != {sha}'
          print('TSK0046_VER_IMMUTABLE_INPUT_HASHES=PASS')

          with open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          byid={r['Task_ID']:r for r in rows if r.get('Task_ID')}
          r=byid['TSK-0046']
          assert r['Lifecycle_Stage']=='L4'
          assert r['Priority']=='MEDIUM'
          assert r['AI_Capability_A0_A4']=='A3'
          assert r['Action_Authority']=='AUTO_ALLOWED'
          assert [x.strip() for x in (r['Dependencies'] or '').split(';') if x.strip()]==['TSK-0538']
          assert (r['Acceptance_ID'],r['Verification_ID'],r['Evidence_ID'])==('ACC-0046','VER-0046','EVD-0046')
          acc=(r['Acceptance_Criteria'] or '').lower()
          for concepts in [('expected','load'),('safety','margin'),('dns','latency'),('web','performance'),('degradation','behavior'),('capacity','trigger')]:
              assert all(c in acc for c in concepts), concepts
          print('TSK0046_VER_CURRENT_WBS_CONTRACT=PASS')

          rt=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          pat=re.compile(r'^(##|###) (TSK-\d{4})\b.*?(?=^(?:##|###) |\Z)',re.MULTILINE|re.DOTALL)
          sections={}
          for m in pat.finditer(rt): sections.setdefault(m.group(2),[]).append(m.group(0))
          assert any('**PASS' in s and 'current accepted' in s.splitlines()[0].lower() for s in sections.get('TSK-0538',[]))
          print('TSK0046_VER_CURRENT_PREDECESSOR=PASS')

          doc=Path('TSK_0046_POST_CR0008_DUAL_MODE_PERFORMANCE_CAPACITY_NFR_REVALIDATION_2026-09-02.md').read_text(encoding='utf-8')
          low=doc.lower()
          headings=[line.strip() for line in doc.splitlines() if line.startswith('## ')]
          assert len(headings)>=15, len(headings)
          print('TSK0046_VER_DOCUMENT_STRUCTURE=PASS')

          # Current sequencing and scope are explicit, without relying on one exact sentence.
          for concept in ['cr-0007','lg-09','live-production','optional parent','accountless core','no adoption']:
              assert concept in low, concept
          assert '0 real-user devices' in low
          print('TSK0046_VER_CURRENT_SEQUENCE_SCOPE=PASS')

          # Separate bounded load models exist for DNS, accountless web, and optional account paths.
          for token in ['n_dns_active_peak','q_dns_expected','r_accountless_peak','r_session_peak','r_dashboard_peak','r_mutation_peak','c_account_peak']:
              assert token in low, token
          print('TSK0046_VER_DUAL_MODE_LOAD_MODEL=PASS')

          # Safety margin and DNS method retain the accepted engineering core.
          assert low.count('2×')>=5
          for token in ['doh','dot','tls','controlled allow','controlled block','p50/p95/p99','rate-limit','synthetic']:
              assert token in low, token
          print('TSK0046_VER_MARGIN_DNS_METHOD=PASS')

          # Current TSK-0538 service targets and failure separation are bound.
          for token in ['>=99.9%','p95 `<=1.0s`','p99 `<=2.0s`','authorization isolation','accountless fallback','provider/datastore']:
              assert token in low, token
          print('TSK0046_VER_CURRENT_TSK0538_BINDING=PASS')

          # Web/account performance explicitly covers both modes and does not use account state as protection proof.
          for token in ['accountless core journey','optional-account journey','no account action substitutes for technical protection verification','cross-parent','ambiguous consequential mutations reconcile before replay']:
              assert token in low, token
          print('TSK0046_VER_WEB_DUAL_MODE_PERFORMANCE=PASS')

          # Current external performance references and measurable thresholds are present.
          for token in ['https://web.dev/articles/vitals','https://web.dev/articles/defining-core-web-vitals-thresholds','https://web.dev/articles/vitals-spa-faq','lcp `<=2.5s`','inp `<=200ms`','cls `<=0.1`','75th percentile','soft-navigation']:
              assert token in low, token
          print('TSK0046_VER_CURRENT_WEB_PERFORMANCE_REFERENCES=PASS')

          # Capacity review/degradation preserve hard controls and contain a substantive trigger catalogue.
          trigger_section=re.search(r'## 9\. Capacity-review triggers\n(.*?)(?=\n## 10\.)',doc,re.DOTALL)
          assert trigger_section
          numbered=re.findall(r'^\d+\.',trigger_section.group(1),re.MULTILINE)
          assert len(numbered)>=12, len(numbered)
          for token in ['preserve encrypted-dns correctness','account-only authority fails closed','never enable dns/query/activity-history logging','do not broaden `/control`','reduce the supported/ramped load']:
              assert token in low, token
          print('TSK0046_VER_TRIGGERS_DEGRADATION=PASS')

          # Historical source is preserved only for compatible facts and stale sequencing is not silently carried forward.
          hist=Path('TSK_0046_PERFORMANCE_CAPACITY_NFR_2026-08-28.md').read_text(encoding='utf-8').lower()
          assert 'cr-0003' in hist and 'pilot' in hist
          assert 'cr-0003 remains active' not in low
          assert 'separate mandatory pilot/staging lifecycle is reintroduced' in low
          print('TSK0046_VER_HISTORICAL_RECONCILIATION=PASS')

          # No scope inflation or execution claim.
          for token in ['does not authorize or prove','production stress testing','infrastructure resize/ha/new paid monitoring','any real-user cohort/load','any successor pass']:
              assert token in low, token
          print('TSK0046_VER_NON_INFERENCE=PASS')

          print('TSK0046_CURRENT_ACC=PASS')
          print('TSK0046_CURRENT_VER=PASS')
          print('TSK0046_CURRENT_EVD_READY=PASS')
          print('TSK0046_CURRENT_REVALIDATION=PASS')
          PY
