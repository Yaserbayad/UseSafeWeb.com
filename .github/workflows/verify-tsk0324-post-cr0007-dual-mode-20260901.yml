name: Verify TSK-0324 post-CR-0007 dual mode
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0324-post-cr0007-dual-mode-20260901.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current UI component contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_tsk0324_post_cr0007_dual_mode_20260901.py
          git diff --check
          test -z "$(git status --porcelain)"
