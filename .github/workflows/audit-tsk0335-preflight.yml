name: Audit TSK-0335 preflight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-tsk0335-preflight.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Read exact WBS contract and source identities
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          test "$(git rev-parse HEAD:Plans/Master/WBS/master-wbs.csv)" = "f23b4f017d1baf73258fa30ecd71549bbfe1b815"
          python3 - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          r=next(x for x in rows if x['Task_ID'].strip()=='TSK-0335')
          for k in ['Task_ID','Title','Lifecycle_Stage','Priority','Plan_Status','Execution_State','Dependencies','Action_Authority','Trigger','Acceptance_Criteria','Verification_Method','Evidence_Required']:
              print(f'{k}={r.get(k,"")}')
          assert r['Dependencies'].strip()=='TSK-0330'
          assert r['Action_Authority'].strip()=='HUMAN_ONLY'
          print('TSK0335_WBS_PREFLIGHT=PASS')
          PY
          for p in \
            TSK_0320_PROTECTION_STATE_MODEL_AND_COPY_RULES_2026-08-28.md \
            prototype/TSK-0324/UI_COMPONENT_RULES.md \
            prototype/TSK-0325/SERVICE_BLUEPRINT.md \
            prototype/TSK-0328/INFORMATION_ARCHITECTURE_NAVIGATION.md \
            design/TSK-0330/PHONE_INTERNET_SERVICES_SETUP_FLOWS_CANDIDATE.md; do
            echo "SOURCE_BLOB $p $(git rev-parse HEAD:$p)"
          done
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
