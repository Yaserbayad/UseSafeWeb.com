name: Select TSK-0484

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/select-tsk0484.yml'

permissions:
  contents: write

jobs:
  select:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify queue and select TSK-0484
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = "99a4fe7606fbb963492f9ef9af821e39fe985ce0"
          test "$(git hash-object TSK_0230_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md)" = "d8dff9681a56c1c5aa6e518a2dcb84f785817ea9"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "dce5b829c4d447eac180ae1e896e0019292cf971"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='')))
          by={r['Task_ID']:r for r in rows}
          t=by['TSK-0484']
          assert t['Dependencies'].strip()=='TSK-0230'
          assert t['Lifecycle_Stage']=='L4' and t['Priority']=='MEDIUM'
          assert t['AI_Capability_A0_A4']=='A3' and t['Action_Authority']=='AUTO_ALLOWED'
          acc=t['Acceptance_Criteria']
          assert 'identified threats' in acc
          assert 'measurable controls and verification' in acc
          assert 'distinguish public resolver abuse from user-data security' in acc
          assert 'Representative parents' in by['TSK-0187']['Acceptance_Criteria']
          assert 'reviewed by owner' in by['TSK-0140']['Acceptance_Criteria'].lower()
          q=pathlib.Path('TSK_0230_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md').read_text()
          assert q.index('### TSK-0484') < q.index('### TSK-0497')
          p=pathlib.Path('CURRENT_STATE.md'); text=p.read_text()
          assert '### TSK-0230 accepted stable state' in text
          assert 'No next task is selected by this write' in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          cut=text.rfind('\n## Queue status after current reconciliation'); assert cut>=0
          text=text[:cut].rstrip()+f'''\n\n## Queue status after current reconciliation\n\nThe TSK-0230 post-PASS queue was reread against current acceptance, CR-0003 and open deviation `DVR-0230-01`. `TSK-0187` remains ineligible because it requires representative-parent evidence. `TSK-0140` remains ineligible for PASS because owner/multi-role review evidence is absent. `TSK-0484` is the highest eligible AUTO_ALLOWED provisional-L4 task and precedes the equal-priority TSK-0497 in WBS order.\n\n- **Selected next: `TSK-0484 — {t['Title']}`** (L4 / {t['AI_Capability_A0_A4']} / {t['Action_Authority']} / {t['Priority']}).\n- Hard dependency: `TSK-0230` — current PASS.\n- ACC-0484: {acc}\n- Selection boundary: internal security/abuse-resistance NFR definition only. Threat modeling must distinguish availability/abuse of the public encrypted resolver from confidentiality/integrity/privacy of user-related data; controls must be measurable and tied to verification. `DVR-0230-01` must be treated as an existing access-control deviation where relevant, not normalized away.\n\n## Exact next authoritative step\n\nExecute bounded `TSK-0484`: load current threat/risk/security authority and direct production security/abuse evidence; enumerate trust boundaries/assets/abuse cases; define measurable controls and verification for network abuse, service integrity, admin/change authority, secrets, software/supply chain, data/log access, web/product input/output and recovery; preserve accountless/privacy/legal/build gates; persist/read back independent ACC-0484 evidence; reconcile runtime; then recompute.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md
          git commit -m "state: select TSK-0484"
          git push
