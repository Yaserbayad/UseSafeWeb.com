name: Reconcile TSK-0484 PASS and inspect L4 queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0484-pass-and-inspect-l4.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify security NFR evidence, reconcile runtime, inspect queue
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = "b0050ea04590cbdd3d798e358e31908fe70ea496"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "dce5b829c4d447eac180ae1e896e0019292cf971"
          test "$(git hash-object TSK_0484_SECURITY_ABUSE_RESISTANCE_NFR_2026-08-28.md)" = "ebd146f88f51cae67b9515fb94133bcd74c8cf28"
          test "$(git hash-object TSK_0484_SECURITY_ABUSE_RESISTANCE_NFR_EVIDENCE_2026-08-28.md)" = "15ad7e97f13210737e014499820690c30232a952"
          test "$(git hash-object TSK_0230_PRIVACY_DATA_MINIMISATION_RETENTION_DELETION_NFR_2026-08-28.md)" = "011caaa84dd3dec13bb608be30b15ec92a24f19e"

          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone

          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='')))
          by={r['Task_ID']:r for r in rows}
          t=by['TSK-0484']
          assert [x.strip() for x in t['Dependencies'].split(';') if x.strip()]==['TSK-0230']
          assert t['Lifecycle_Stage']=='L4' and t['Priority']=='MEDIUM'
          assert t['AI_Capability_A0_A4']=='A3' and t['Action_Authority']=='AUTO_ALLOWED'
          acc=t['Acceptance_Criteria']
          for phrase in ['map to identified threats','measurable controls and verification','distinguish public resolver abuse from user-data security']:
              assert phrase in acc, phrase

          c=pathlib.Path('TSK_0484_SECURITY_ABUSE_RESISTANCE_NFR_2026-08-28.md').read_text()
          e=pathlib.Path('TSK_0484_SECURITY_ABUSE_RESISTANCE_NFR_EVIDENCE_2026-08-28.md').read_text()
          for phrase in [
              '## 3. Current assets and trust boundaries',
              '## 4. Threat catalogue — STRIDE + abuse cases',
              '## 5. Public resolver abuse and availability NFRs',
              '## 8. User-data, privacy and security-logging NFRs',
              '## 13. Minimum security verification catalogue',
              'DVR-0230-01','DVR-0484-01','GAP-0484-02','RSK-0002'
          ]:
              assert phrase in c, phrase
          assert '**VER-0484 independent audit result: PASS for ACC-0484' in e
          for phrase in ['DVR-0230-01','DVR-0484-01','GAP-0484-02','remain OPEN/non-PASS']:
              assert phrase in e, phrase

          p=pathlib.Path('CURRENT_STATE.md')
          text=p.read_text()
          assert 'Selected next: `TSK-0484' in text
          assert '### TSK-0484 accepted stable state' not in text
          assert '### TSK-0230 accepted stable state' in text

          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          sec='''### TSK-0484 accepted stable state\n\n`TSK-0484 — Define security and abuse-resistance NFRs`: **PASS for the provisional internal L4 security-NFR-definition acceptance under DEC-0050/CR-0003**. Contract `TSK_0484_SECURITY_ABUSE_RESISTANCE_NFR_2026-08-28.md`, blob `ebd146f88f51cae67b9515fb94133bcd74c8cf28`; independent evidence `TSK_0484_SECURITY_ABUSE_RESISTANCE_NFR_EVIDENCE_2026-08-28.md`, blob `15ad7e97f13210737e014499820690c30232a952`. ACC-0484 is satisfied: assets/trust boundaries and abuse cases are explicit, every NFR maps to identified threats with measurable verification/PASS conditions, and public-resolver abuse/availability is kept distinct from user-data/admin/application/supply-chain security.\n\nCurrent first-party OWASP ASVS/Input-Validation/XSS/SSRF guidance and AdGuard anti-amplification configuration semantics were rechecked on 2026-08-28. Historical TSK-0483 remains valid evidence of AdGuard engine-level anti-abuse capability/configuration but does not self-certify the later public Nginx DoH/DoT ingress. `GAP-0484-02` therefore remains OPEN pending direct current public-path verification. `DVR-0230-01` remains OPEN for the custom DoH critical error-log mode (`0644 root:root` vs target <=0640/service-admin only). `DVR-0484-01` remains OPEN because the TSK-0230 production-host evidence workflow used repository write credentials on a root-capable runner; no compromise is evidenced, and future host-verification/publishing should be separated where practical. `RSK-0002` remains OPEN. This PASS does not authorize implementation/build, account/auth activation, public release, participants, legal completion, payment or launch.\n\n'''
          marker='## Runtime safeguards'
          assert marker in text
          text=text.replace(marker,sec+marker,1)

          pass_set={r['Task_ID'] for r in rows if r.get('Execution_State')=='PASS'}
          pass_set.update(re.findall(r'^### (TSK-\d{4}) accepted stable state$', text, re.M))
          pass_set.add('TSK-0484')
          pri={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          candidates=[]
          for idx,row in enumerate(rows):
              if row.get('Lifecycle_Stage')!='L4':
                  continue
              if row['Task_ID'] in pass_set:
                  continue
              if row.get('Plan_Status') in {'DEFERRED','NOT_APPLICABLE'}:
                  continue
              if row.get('Action_Authority')!='AUTO_ALLOWED':
                  continue
              deps=[x.strip() for x in (row.get('Dependencies') or '').split(';') if x.strip()]
              if not all(d in pass_set for d in deps):
                  continue
              flags=[]
              hay=' '.join([row.get('Acceptance_Criteria',''),row.get('Preconditions',''),row.get('Notes',''),row.get('Trigger','')]).lower()
              if any(k in hay for k in ['representative parent','real participant','cohort','usability','comprehension','behavioral','observed parent','user evidence']):
                  flags.append('REAL_OR_BEHAVIOR_EVIDENCE_CHECK')
              if any(k in hay for k in ['reviewed by owner','owner approval','explicit owner','approved by owner']):
                  flags.append('OWNER_REVIEW_CHECK')
              if any(k in hay for k in ['legal approval','legal review','privacy approval','dpia approval','lia approval']):
                  flags.append('LEGAL_PRIVACY_APPROVAL_CHECK')
              candidates.append((pri.get(row.get('Priority','LOW'),9),idx,row,deps,flags))
          candidates.sort(key=lambda x:(x[0],x[1]))

          report=['# TSK-0484 post-PASS L4 queue inspection','','**Date:** 2026-08-28','**Purpose:** conservative derived queue after TSK-0484 PASS. This report is not authority and does not change task state.','',f'- Conservative PASS set size: {len(pass_set)}',f'- Dependency-ready non-PASS AUTO_ALLOWED L4 candidates: {len(candidates)}','','## Candidates in deterministic priority/WBS order','']
          for _,_,row,deps,flags in candidates:
              report += [
                  f"### {row['Task_ID']} — {row['Title']}",
                  f"- **Priority:** {row['Priority']}",
                  f"- **Dependencies:** {'; '.join(deps) if deps else '(none)'}",
                  f"- **Acceptance:** {row['Acceptance_ID']} — {row['Acceptance_Criteria']}",
                  f"- **AI / authority:** {row['AI_Capability_A0_A4']} / {row['Action_Authority']}",
                  f"- **Requirements:** {row.get('Requirement_Reference','')}",
                  f"- **Interfaces:** {row.get('Interface_Reference','')}",
                  f"- **Notes:** {row.get('Notes','')}",
                  f"- **Preflight flags:** {', '.join(flags) if flags else '(none)'}",
                  ''
              ]
          pathlib.Path('TSK_0484_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md').write_text('\n'.join(report)+'\n')

          q=text.rfind('\n## Queue status after current reconciliation')
          assert q>=0
          text=text[:q].rstrip()+'''\n\n## Queue status after current reconciliation\n\n`TSK-0484` is runtime PASS for its bounded provisional-L4 security-NFR-definition acceptance. `DVR-0230-01`, `DVR-0484-01` and `GAP-0484-02` remain explicit open implementation/verification items. A fresh conservative dependency-ready AUTO_ALLOWED L4 queue has been generated at `TSK_0484_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md`. No next task is selected by this write; the queue must be reread against acceptance, direct predecessor evidence, CR-0003, human/legal/participant holds and the open security/privacy deviations before execution.\n\n## Exact next authoritative step\n\nRead back the TSK-0484 post-PASS L4 queue, reject any candidate requiring unavailable real-user evidence, owner/legal/privacy approval, unresolved trigger/gate or missing predecessor proof, account for the open security/privacy deviations where relevant, and persist the deterministic highest-priority eligible AUTO_ALLOWED selection.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md TSK_0484_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md
          git commit -m "state: accept TSK-0484 and inspect L4 queue"
          git push
