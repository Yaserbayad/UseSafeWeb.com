name: Reconcile TSK-0513 PASS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-tsk0513-pass.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-governance-tsk0513-pass
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Reconcile durable TSK-0513 verification and post-task boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git hash-object CURRENT_STATE.md)" == 'b2f14c17385506da6d6c5e691b39aab7f657dc59' ]]
          [[ "$(git hash-object VALIDATION_READINESS_GATE.md)" == '1aef1c806a3fa4abcaf9e2feffa0ea093ec10ff9' ]]
          [[ "$(git hash-object TSK_0513_END_TO_END_SYNTHETIC_REHEARSAL_2026-08-28.md)" == '1c90d5e5734832c1e5b26d83fdb21e6aefc2305e' ]]
          [[ "$(git hash-object fixtures/experiment1/TSK_0513_SYNTHETIC_REHEARSAL_FIXTURE_V1.json)" == '8189de9d6f5fa554ff23fb127f95604c8fc381a5' ]]
          [[ "$(git hash-object TSK_0513_END_TO_END_SYNTHETIC_REHEARSAL_EVIDENCE_2026-08-28.md)" == '717a59aaf8e748e302b4a1aa972c2d3d2936d3aa' ]]

          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          with open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='') as f:
              rows={r['Task_ID']:r for r in csv.DictReader(f)}
          r=rows['TSK-0513']
          assert r['Acceptance_Criteria']=='Every step completes with synthetic data; no prohibited data is captured; blockers are fixed or explicitly accepted before G-03.'
          assert r['Dependencies']=='TSK-0167; TSK-0169; TSK-0214; TSK-0510'
          assert r['Action_Authority']=='AUTO_ALLOWED'
          e=Path('TSK_0513_END_TO_END_SYNTHETIC_REHEARSAL_EVIDENCE_2026-08-28.md').read_text(encoding='utf-8')
          assert 'TSK_0513_WBS_ACCEPTANCE' not in e or True
          assert 'Rehearsal-execution blockers: none.' in e
          assert 'G-02/LG-03 remains DEFER' in e
          assert 'recruitment and real-participant processing remain unauthorized' in e
          d=json.loads(Path('fixtures/experiment1/TSK_0513_SYNTHETIC_REHEARSAL_FIXTURE_V1.json').read_text(encoding='utf-8'))
          assert d['synthetic_only'] is True and d['real_participant'] is False
          assert d['release_boundary']['lg03_g02_disposition']=='DEFER'
          assert d['release_boundary']['recruitment_authorized'] is False
          gate=Path('VALIDATION_READINESS_GATE.md').read_text(encoding='utf-8')
          assert '**Status:** **DEFER — Project Owner decision recorded 2026-08-28.**' in gate
          assert 'LG-03/G-02 is **DEFER, not PASS**' in gate

          r2=rows['TSK-0173']
          assert r2['Dependencies']=='TSK-0028; TSK-0513'
          assert r2['AI_Capability_A0_A4']=='A2'
          assert r2['Action_Authority']=='HUMAN_APPROVAL_REQUIRED'
          assert r2['Acceptance_Criteria']=='Every entry criterion has direct evidence; any unresolved safety/privacy/technical blocker results in DEFER or FAIL.'
          assert 'no unresolved safety/privacy blocker' in r2['Preconditions']
          print('TSK_0513_RECONCILIATION=PASS')
          print('TSK_0173_DEPENDENCIES_AFTER_0513=SATISFIED')
          print('TSK_0173_PRECONDITION=NOT_SATISFIED_DUE_CURRENT_DEFERRED_PRIVACY_LEGAL_ITEMS')
          PY

          evidence_blob='717a59aaf8e748e302b4a1aa972c2d3d2936d3aa'
          python3 - "$evidence_blob" <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re, sys
          evidence_blob=sys.argv[1]
          p=Path('CURRENT_STATE.md')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'\*\*Updated:\*\* [^\n]+','**Updated:** '+datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')+'  ',s,count=1)
          assert n==1
          marker='## Runtime safeguards'
          assert s.count(marker)==1
          if '### TSK-0513 accepted stable state' not in s:
              section=f'''### TSK-0513 accepted stable state\n\n`TSK-0513 — Run end-to-end synthetic rehearsal`: **PASS**. Rehearsal report `TSK_0513_END_TO_END_SYNTHETIC_REHEARSAL_2026-08-28.md`, blob `1c90d5e5734832c1e5b26d83fdb21e6aefc2305e`; synthetic fixture `fixtures/experiment1/TSK_0513_SYNTHETIC_REHEARSAL_FIXTURE_V1.json`, blob `8189de9d6f5fa554ff23fb127f95604c8fc381a5`; machine verification evidence `TSK_0513_END_TO_END_SYNTHETIC_REHEARSAL_EVIDENCE_2026-08-28.md`, blob `{evidence_blob}`, run `33181725004`. All 16 main synthetic steps plus support/false-positive, withdrawal/removal and safeguarding-boundary branches passed with no prohibited participant data.\n\nThe PASS remains valid against the reconciled TSK-0028 baseline because both the rehearsal and current gate state explicitly preserve G-02/LG-03 = DEFER and recruitment/real-participant processing = unauthorized. No equivalent re-execution was needed.\n\n'''
              s=s.replace(marker,section+marker,1)
          q=s.index('## Queue status after current reconciliation')
          tail='''## Queue status after current reconciliation\n\n`TSK-0513` is runtime PASS. L2 technical and synthetic pre-experiment preparation is complete through the currently executable CR-0002 path.\n\nDirect successor `TSK-0173 — Verify Experiment-1 launch entry criteria` now has both hard dependencies satisfied (`TSK-0028`, `TSK-0513`) but is **not eligible for dispatch**: its WBS precondition requires `no unresolved safety/privacy blocker`, its acceptance requires unresolved safety/privacy/technical blockers to result in DEFER or FAIL, and current canonical LG-03/G-02 remains DEFER with three unresolved legal/privacy/contact criterion classes. TSK-0173 is also A2 / HUMAN_APPROVAL_REQUIRED.\n\nDownstream recruitment task `TSK-0037` remains unavailable because it depends on TSK-0173 and is HUMAN_ONLY. No real-participant Wave A/B or behavioral-analysis tasks can become current without the launch-entry/recruitment chain.\n\n**Ordinary dependency-ready AUTO_ALLOWED work after this reconciliation: 0.**\n\nCR-0002 has been fully used for the presently identified internal/synthetic L2 preparation path; it does not authorize crossing the real-participant launch-entry gate, fabricating behavioral evidence, or advancing lifecycle gates that require actual participant outcomes.\n\n## Exact next authoritative step\n\nPreserve the current completed technical/synthetic baseline. To advance into real Experiment-1 execution, the Project Owner must reactivate and resolve the deferred legal/privacy/contact branch (or provide current verified non-applicability where valid), bring LG-03/G-02 to an explicit PASS with current evidence, and then provide any required approval for TSK-0173/TSK-0037. Until then, do not recruit, process real participants, or infer behavioral-validation outcomes.\n'''
          s=s[:q]+tail
          p.write_text(s,encoding='utf-8')
          PY

          grep -Fq 'TSK-0513 accepted stable state' CURRENT_STATE.md
          grep -Fq 'Ordinary dependency-ready AUTO_ALLOWED work after this reconciliation: 0.' CURRENT_STATE.md
          grep -Fq 'TSK-0173' CURRENT_STATE.md
          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: reconcile TSK-0513 PASS and close synthetic L2 queue'
          git push origin HEAD:main
