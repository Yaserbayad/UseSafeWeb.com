name: TSK-0417 removal-order source acceptance

on:
  push:
    branches:
      - feature/tsk-0417-removal-ordering-20260903
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/accept-tsk0417-removal-ordering-20260903.yml'

permissions:
  contents: read

jobs:
  accept-tsk0417-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - name: Verify canonical planning structure and focused TSK-0417 contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          cd website
          node --test tests/contract/tsk0417.test.mjs
