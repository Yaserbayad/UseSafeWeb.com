name: Reconcile TSK-0026 PASS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-tsk0026-pass.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Reconcile TSK-0026 and next boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git hash-object CURRENT_STATE.md)" == 'f6b8273fbea05bea4c2c253cd5820588dc4eba9f' ]]
          [[ "$(git hash-object TSK_0026_G02_LG03_EVIDENCE_PACKAGE_2026-08-28.md)" == 'dbeda1202728bdd6ec6d1f838842fa576e733d8e' ]]
          [[ "$(git hash-object TSK_0026_G02_LG03_EVIDENCE_PACKAGE_EVIDENCE_2026-08-28.md)" == 'e4d14fea268b78ab0bc395fb10988412c7e66484' ]]
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re
          p=Path('CURRENT_STATE.md')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'\*\*Updated:\*\* [^\n]+','**Updated:** '+datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')+'  ',s,count=1)
          assert n==1
          anchor='- `TSK-0510` — pilot technical acceptance report compiled and independently audited against ACC-0510, REQ-0065/REQ-0066, current predecessor evidence and the LG-03 boundary — report `TSK_0510_PILOT_TECHNICAL_ACCEPTANCE_REPORT_2026-08-28.md`, blob `fbc41f65ec56e7e9ea8873e9a995b66ae9e8f2c9`; evidence `TSK_0510_PILOT_TECHNICAL_ACCEPTANCE_EVIDENCE_2026-08-28.md`, blob `ce833b35f904c7657b5cc69419ec388b84e1a611`; independent audit run `33175993512` / job `98864628019`: PASS. The evidence signature is Git/repository evidence only; no human/legal signature or gate approval is fabricated. **TSK-0510 = PASS; LG-03 remains NOT PASS.**'
          assert s.count(anchor)==1
          pass_line='- `TSK-0026` — G-02/LG-03 eight-criterion evidence package assembled and independently audited — package `TSK_0026_G02_LG03_EVIDENCE_PACKAGE_2026-08-28.md`, blob `dbeda1202728bdd6ec6d1f838842fa576e733d8e`; evidence `TSK_0026_G02_LG03_EVIDENCE_PACKAGE_EVIDENCE_2026-08-28.md`, blob `e4d14fea268b78ab0bc395fb10988412c7e66484`; independent audit run `33180135119` / job `98878984354`: PASS. Criteria 1,3,4,7,8 are current PASS for their bounded criterion scope; criteria 2,5,6 remain DEFERRED/OPEN under CR-0002. **TSK-0026 = PASS; LG-03 remains NOT PASS.**'
          assert '`TSK-0026` — G-02/LG-03 eight-criterion evidence package assembled' not in s
          pos=s.index(anchor)+len(anchor)
          s=s[:pos]+'\n'+pass_line+s[pos:]
          q=s.index('## Queue status after current reconciliation')
          tail='''## Queue status after current reconciliation\n\nTSK-0026 is runtime PASS with durable eight-criterion evidence-package and independent audit proof. The package preserves the current gate truth: criteria 1, 3, 4, 7 and 8 are PASS for their bounded criterion scope; criteria 2, 5 and 6 remain DEFERRED/OPEN. **LG-03 remains NOT PASS.**\n\nThe dependency mutation makes `TSK-0027 — Decide G-02 PASS, FAIL, or DEFER` dependency-ready. WBS classification: L2 / A1 / `HUMAN_ONLY` / HIGH / critical path. Its acceptance requires the Project Owner to review evidence/residual risks/open conditions, choose PASS/FAIL/DEFER, state work unlocked, and state whether recruitment is authorised. The AI may prepare the decision but must not make or fabricate it.\n\n`TSK-0167` remains a lower-priority preparatory AUTO_ALLOWED task under CR-0002, but SERIAL LIGHT priority stops progression at the higher-priority current gate/HUMAN_ONLY boundary rather than bypassing it.\n\n## Exact next authoritative step\n\nProject Owner decision required for `TSK-0027`. Review `TSK_0026_G02_LG03_EVIDENCE_PACKAGE_2026-08-28.md` and explicitly choose **PASS**, **FAIL**, or **DEFER** for G-02/LG-03. Current evidence contains three unresolved/deferred criterion classes (final LIA/DPIA approval, final participant-notice release, and ICO/UK-representation resolution), so no automatic PASS or recruitment authorization may be inferred. After the explicit owner decision is persisted/read-back, recompute governed work.\n'''
          s=s[:q]+tail
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq '**TSK-0026 = PASS; LG-03 remains NOT PASS.**' CURRENT_STATE.md
          grep -Fq 'TSK-0027 — Decide G-02 PASS, FAIL, or DEFER' CURRENT_STATE.md
          grep -Fq 'Project Owner decision required for `TSK-0027`.' CURRENT_STATE.md
          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: mark TSK-0026 PASS and expose owner gate'
          git push origin HEAD:main
