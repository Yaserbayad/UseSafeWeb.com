name: Temporary TSK-0491 policy formatter

on:
  push:
    branches:
      - feature/tsk-0491-dependency-sbom-20260903

permissions:
  contents: write

jobs:
  format-policy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/tsk-0491-dependency-sbom-20260903
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - name: Format only the TSK-0491 policy and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object website/package-lock.json)" = '6ff91d845bc5f3099b6a00f5f43673eed80a3ba5'
          test "$(git hash-object website/DEPENDENCY_SECURITY_POLICY.md)" = '8d9152460a2d1cd32701e102abfdcf9c5aeb7c5c'
          cd website
          npm ci --ignore-scripts --no-fund --no-audit
          npx --no-install prettier --write DEPENDENCY_SECURITY_POLICY.md
          npx --no-install prettier --check DEPENDENCY_SECURITY_POLICY.md
          cd ..
          test "$(git diff --name-only)" = 'website/DEPENDENCY_SECURITY_POLICY.md'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/DEPENDENCY_SECURITY_POLICY.md
          git commit -m 'style(TSK-0491): format dependency security policy'
          git push origin HEAD:feature/tsk-0491-dependency-sbom-20260903
