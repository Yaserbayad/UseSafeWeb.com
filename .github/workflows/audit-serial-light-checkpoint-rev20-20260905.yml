name: Validate repaired SERIAL LIGHT checkpoint revision 20

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-serial-light-checkpoint-rev20-20260905.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit schema and semantic invariants
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='a71e82d722efdb33d962c19ee6fcb496dee90cea'
          test "$(git hash-object CURRENT_STATE.md)" = "$EXPECTED_BLOB"
          python3 - <<'PY'
          import json
          from pathlib import Path

          p=Path('CURRENT_STATE.md')
          text=p.read_text(encoding='utf-8')
          d=json.loads(text)
          issues=[]
          def issue(path, code, detail): issues.append({'path':path,'code':code,'detail':detail})
          def exact_keys(obj, allowed, required, path):
              if not isinstance(obj,dict):
                  issue(path,'TYPE',f'expected object, got {type(obj).__name__}'); return
              for k in obj:
                  if k not in allowed: issue(f'{path}.{k}','ADDITIONAL_PROPERTY','field is not allowed')
              for k in required:
                  if k not in obj: issue(f'{path}.{k}','MISSING_REQUIRED','required field is absent')

          if text != json.dumps(d, indent=2, ensure_ascii=False)+'\n': issue('$','SERIALIZATION','not canonical two-space UTF-8 JSON with one final LF')
          if d.get('checkpoint_schema')!='serial-light-checkpoint-v1': issue('$.checkpoint_schema','IDENTITY',str(d.get('checkpoint_schema')))
          if d.get('project_id')!='UseSafeWeb.com': issue('$.project_id','IDENTITY',str(d.get('project_id')))
          if d.get('governance_mode')!='SERIAL_LIGHT': issue('$.governance_mode','IDENTITY',str(d.get('governance_mode')))
          if d.get('checkpoint_revision')!=20: issue('$.checkpoint_revision','REVISION',str(d.get('checkpoint_revision')))
          if d.get('baseline',{}).get('version')!=1: issue('$.baseline.version','BASELINE',str(d.get('baseline',{}).get('version')))

          exact_keys(d, {'checkpoint_schema','project_id','governance_mode','checkpoint_revision','baseline','runtime'}, {'checkpoint_schema','project_id','governance_mode','checkpoint_revision','baseline','runtime'}, '$')
          b=d['baseline']; r=d['runtime']
          exact_keys(b, {'version','objectives','policy_rules','gates','work_items','closure_criteria'}, {'version','objectives','policy_rules','gates','work_items','closure_criteria'}, '$.baseline')
          for i,o in enumerate(b['objectives']): exact_keys(o, {'id','summary','reference'}, {'id','summary'}, f'$.baseline.objectives[{i}]')
          for i,x in enumerate(b['policy_rules']): exact_keys(x, {'id','text'}, {'id','text'}, f'$.baseline.policy_rules[{i}]')
          for i,g in enumerate(b['gates']): exact_keys(g, {'id','type','condition'}, {'id','type','condition'}, f'$.baseline.gates[{i}]')
          wi_allowed={'id','title','wbs_path','order','depends_on','acceptance_criteria','required_for_completion','plan_priority','gates','executor_constraint','execution_context','spec_reference'}
          wi_required={'id','title','wbs_path','order','depends_on','acceptance_criteria','required_for_completion','gates','execution_context'}
          for i,w in enumerate(b['work_items']):
              wp=f'$.baseline.work_items[{i}]({w.get("id","?")})'; exact_keys(w,wi_allowed,wi_required,wp)
              for j,ac in enumerate(w.get('acceptance_criteria',[])): exact_keys(ac, {'id','condition'}, {'id','condition'}, f'{wp}.acceptance_criteria[{j}]')
          for i,c in enumerate(b['closure_criteria']): exact_keys(c, {'id','condition'}, {'id','condition'}, f'$.baseline.closure_criteria[{i}]')

          exact_keys(r, {'project_status','governance_blocker','items','gate_satisfactions','human_constraints','closure_references'}, {'project_status','governance_blocker','items','gate_satisfactions','human_constraints','closure_references'}, '$.runtime')
          if r['project_status'] not in {'INIT','ACTIVE','PAUSED','CANCELLING','CANCELLED','DONE'}: issue('$.runtime.project_status','ENUM',str(r['project_status']))
          if r['governance_blocker'] is not None: exact_keys(r['governance_blocker'], {'code','reason','required_resolution','reference'}, {'code','reason','required_resolution'}, '$.runtime.governance_blocker')
          item_allowed={'id','status','priority_override','executor_override','continuation_note','wait','blocker','acceptance_references'}
          item_required={'id','status','acceptance_references'}
          ar_allowed={'ac_id','evidence_type','reference','summary','verification_context'}; ar_required={'ac_id','evidence_type','reference','summary'}
          for i,it in enumerate(r['items']):
              ip=f'$.runtime.items[{i}]({it.get("id","?")})'; exact_keys(it,item_allowed,item_required,ip)
              if 'wait' in it: exact_keys(it['wait'], {'condition','resolution_check','reference'}, {'condition','resolution_check'}, f'{ip}.wait')
              if 'blocker' in it: exact_keys(it['blocker'], {'reason','required_resolution','reference'}, {'reason','required_resolution'}, f'{ip}.blocker')
              ars=it.get('acceptance_references',[])
              if not isinstance(ars,list): issue(f'{ip}.acceptance_references','TYPE','expected array')
              else:
                  for j,ar in enumerate(ars):
                      ap=f'{ip}.acceptance_references[{j}]'
                      if not isinstance(ar,dict): issue(ap,'TYPE',f'expected acceptanceReference object, got {type(ar).__name__}')
                      else: exact_keys(ar,ar_allowed,ar_required,ap)
          for i,gs in enumerate(r['gate_satisfactions']):
              gp=f'$.runtime.gate_satisfactions[{i}]'; exact_keys(gs, {'gate_id','proof'}, {'gate_id','proof'}, gp)
              if isinstance(gs.get('proof'),dict): exact_keys(gs['proof'], {'evidence_type','reference','summary','verification_context'}, {'evidence_type','reference','summary'}, f'{gp}.proof')
          for i,h in enumerate(r['human_constraints']): exact_keys(h, {'id','scope','work_item_ids','text'}, {'id','scope','text'}, f'$.runtime.human_constraints[{i}]')
          for i,cr in enumerate(r['closure_references']):
              cp=f'$.runtime.closure_references[{i}]'; exact_keys(cr, {'closure_id','proof'}, {'closure_id','proof'}, cp)
              if isinstance(cr.get('proof'),dict): exact_keys(cr['proof'], {'evidence_type','reference','summary','verification_context'}, {'evidence_type','reference','summary'}, f'{cp}.proof')

          work={w['id']:w for w in b['work_items']}; items={it['id']:it for it in r['items']}
          if len(work)!=len(b['work_items']): issue('$.baseline.work_items','DUPLICATE_ID','work-item IDs are not unique')
          if len(items)!=len(r['items']): issue('$.runtime.items','DUPLICATE_ID','runtime IDs are not unique')
          if set(work)!=set(items): issue('$.runtime.items','ID_MISMATCH','runtime IDs are not one-to-one with baseline IDs')
          orders=[w['order'] for w in b['work_items']]
          if any(not isinstance(x,int) or x<=0 for x in orders): issue('$.baseline.work_items','ORDER_VALUE','orders must be positive integers')
          if len(orders)!=len(set(orders)): issue('$.baseline.work_items','DUPLICATE_ORDER','order values are not unique')
          gate_ids={g['id'] for g in b['gates']}
          for w in b['work_items']:
              wid=w['id']
              if not w.get('wbs_path') or w['wbs_path'][-1]!=wid: issue(f'$.baseline.work_items({wid}).wbs_path','WBS_PATH','last path element does not equal id')
              if wid in w.get('depends_on',[]): issue(f'$.baseline.work_items({wid}).depends_on','SELF_DEPENDENCY',wid)
              for dep in w.get('depends_on',[]):
                  if dep not in work: issue(f'$.baseline.work_items({wid}).depends_on','UNKNOWN_DEPENDENCY',dep)
              for gid in w.get('gates',[]):
                  if gid not in gate_ids: issue(f'$.baseline.work_items({wid}).gates','UNKNOWN_GATE',gid)
              ac_ids=[a['id'] for a in w.get('acceptance_criteria',[])]
              if len(ac_ids)!=len(set(ac_ids)): issue(f'$.baseline.work_items({wid}).acceptance_criteria','DUPLICATE_AC','AC IDs are not unique')

          seen_gs=set()
          for gs in r['gate_satisfactions']:
              gid=gs.get('gate_id')
              if gid not in gate_ids: issue('$.runtime.gate_satisfactions','UNKNOWN_GATE',str(gid))
              if gid in seen_gs: issue('$.runtime.gate_satisfactions','DUPLICATE_GATE',str(gid))
              seen_gs.add(gid)

          seen_h=set()
          for h in r['human_constraints']:
              hid=h.get('id')
              if hid in seen_h: issue('$.runtime.human_constraints','DUPLICATE_ID',str(hid))
              seen_h.add(hid)
              scope=h.get('scope'); ids=h.get('work_item_ids',[])
              if scope=='PROJECT' and ids: issue(f'$.runtime.human_constraints({hid})','SCOPE','PROJECT requires absent/empty work_item_ids')
              if scope=='WORK_ITEMS' and (not ids or len(ids)!=len(set(ids))): issue(f'$.runtime.human_constraints({hid})','SCOPE','WORK_ITEMS requires one or more unique IDs')
              for wid in ids:
                  if wid not in work: issue(f'$.runtime.human_constraints({hid})','UNKNOWN_WORK_ITEM',wid)

          for wid,it in items.items():
              w=work[wid]; ac_ids=[a['id'] for a in w.get('acceptance_criteria',[])]; ar_ids=[]
              for ar in it.get('acceptance_references',[]):
                  if isinstance(ar,dict):
                      aid=ar.get('ac_id'); ar_ids.append(aid)
                      if aid not in ac_ids: issue(f'$.runtime.items({wid}).acceptance_references','UNKNOWN_AC',str(aid))
              if len(ar_ids)!=len(set(ar_ids)): issue(f'$.runtime.items({wid}).acceptance_references','DUPLICATE_AC_REF','multiple refs for same AC')
              st=it.get('status')
              if st=='WAITING':
                  if 'wait' not in it: issue(f'$.runtime.items({wid})','STATE_PAYLOAD','WAITING requires wait')
                  if 'blocker' in it: issue(f'$.runtime.items({wid})','STATE_PAYLOAD','WAITING forbids blocker')
              elif st=='BLOCKED':
                  if 'blocker' not in it: issue(f'$.runtime.items({wid})','STATE_PAYLOAD','BLOCKED requires blocker')
                  if 'wait' in it: issue(f'$.runtime.items({wid})','STATE_PAYLOAD','BLOCKED forbids wait')
              elif st=='TODO':
                  if 'wait' in it or 'blocker' in it: issue(f'$.runtime.items({wid})','STATE_PAYLOAD','TODO forbids wait/blocker')
              elif st=='PASS':
                  for f in ('wait','blocker','continuation_note'):
                      if f in it: issue(f'$.runtime.items({wid}).{f}','STATE_PAYLOAD','PASS forbids this field')
                  if sorted(ar_ids)!=sorted(ac_ids): issue(f'$.runtime.items({wid}).acceptance_references','PASS_PROOF','PASS requires exactly one structured ref for every AC')
              else: issue(f'$.runtime.items({wid}).status','ENUM',str(st))

          expected_order=[w['id'] for w in sorted(b['work_items'],key=lambda x:(x['order'],x['id']))]
          if [w['id'] for w in b['work_items']]!=expected_order: issue('$.baseline.work_items','ORDER','baseline work_items not canonical order')
          if [it['id'] for it in r['items']]!=expected_order: issue('$.runtime.items','ORDER','runtime items not canonical order')
          for key in ('objectives','policy_rules','gates','closure_criteria'):
              arr=b[key]
              if [x['id'] for x in arr]!=sorted(x['id'] for x in arr): issue(f'$.baseline.{key}','ORDER','array not ascending id')
          if [x['gate_id'] for x in r['gate_satisfactions']]!=sorted(x['gate_id'] for x in r['gate_satisfactions']): issue('$.runtime.gate_satisfactions','ORDER','not ascending gate_id')
          if [x['id'] for x in r['human_constraints']]!=sorted(x['id'] for x in r['human_constraints']): issue('$.runtime.human_constraints','ORDER','not ascending id')
          if [x['closure_id'] for x in r['closure_references']]!=sorted(x['closure_id'] for x in r['closure_references']): issue('$.runtime.closure_references','ORDER','not ascending closure_id')
          for w in b['work_items']:
              if w.get('depends_on',[])!=sorted(w.get('depends_on',[])): issue(f'$.baseline.work_items({w["id"]}).depends_on','ORDER','dependencies not sorted')
              if w.get('gates',[])!=sorted(w.get('gates',[])): issue(f'$.baseline.work_items({w["id"]}).gates','ORDER','gates not sorted')
              if [a['id'] for a in w.get('acceptance_criteria',[])]!=sorted(a['id'] for a in w.get('acceptance_criteria',[])): issue(f'$.baseline.work_items({w["id"]}).acceptance_criteria','ORDER','ACs not sorted')
          for it in r['items']:
              ars=[a.get('ac_id') for a in it.get('acceptance_references',[]) if isinstance(a,dict)]
              if ars!=sorted(ars): issue(f'$.runtime.items({it["id"]}).acceptance_references','ORDER','acceptance refs not sorted')

          state={}
          def visit(x,stack):
              if state.get(x)==1: issue('$.baseline.work_items','DEPENDENCY_CYCLE',' -> '.join(stack+[x])); return
              if state.get(x)==2: return
              state[x]=1
              for dep in work[x].get('depends_on',[]):
                  if dep in work: visit(dep,stack+[x])
              state[x]=2
          for wid in work: visit(wid,[])

          closure_ids={c['id'] for c in b['closure_criteria']}; seen_c=set()
          for cr in r['closure_references']:
              cid=cr.get('closure_id')
              if cid not in closure_ids: issue('$.runtime.closure_references','UNKNOWN_CLOSURE',str(cid))
              if cid in seen_c: issue('$.runtime.closure_references','DUPLICATE_CLOSURE',str(cid))
              seen_c.add(cid)
          if r['project_status']=='DONE':
              if r['governance_blocker'] is not None: issue('$.runtime.governance_blocker','DONE_RULE','DONE requires null blocker')
              for w in b['work_items']:
                  if w.get('required_for_completion') and items[w['id']]['status']!='PASS': issue(f'$.runtime.items({w["id"]})','DONE_RULE','required item not PASS')
              if seen_c!=closure_ids: issue('$.runtime.closure_references','DONE_RULE','DONE requires every closure reference')

          out={'checkpoint_blob':'a71e82d722efdb33d962c19ee6fcb496dee90cea','checkpoint_revision':d['checkpoint_revision'],'baseline_version':b['version'],'project_status':r['project_status'],'work_item_count':len(b['work_items']),'runtime_item_count':len(r['items']),'issue_count':len(issues),'issues':issues}
          Path('checkpoint-rev20-audit.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2))
          if issues: raise SystemExit(1)
          PY

      - name: Upload zero-issue audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-rev20-audit
          path: checkpoint-rev20-audit.json
          if-no-files-found: error

      - name: Remove one-off audit transport
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = 'a71e82d722efdb33d962c19ee6fcb496dee90cea'
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/audit-serial-light-checkpoint-rev20-20260905.yml
          git commit -m 'recovery: remove revision 20 checkpoint audit transport'
          git push origin HEAD:main
