name: Reconcile TSK-0045 current revalidation

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0045-runtime-trigger.txt']

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Run guarded reconciler
        run: python3 .github/scripts/reconcile_tsk0045_current_revalidation.py
      - name: Persist only CURRENT_STATE.md
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CURRENT_STATE.md; then echo 'TSK0045_CURRENT_STATE_WRITE=ALREADY_APPLIED'; exit 0; fi
          changed="$(git diff --name-only)"
          if [ "$changed" != "CURRENT_STATE.md" ]; then echo "Unexpected changed paths: $changed" >&2; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: reconcile current TSK-0045 revalidation'
          git push origin HEAD:main
          echo 'TSK0045_CURRENT_STATE_WRITE=PASS'
