name: Capture completed TSK-0431 recovery summary

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tsk0431-summary-capture.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: [self-hosted, rec-v1]
    timeout-minutes: 3
    steps:
      - name: Verify target and capture privacy-safe summary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == 'adguartestdvm' ]]
          [[ "$(sha256sum /etc/machine-id | awk '{print $1}')" == 'e09868443c476b30eae778d191ceedee57ed6f27a74856eae1d0709c68f1c852' ]]
          test -s /tmp/t0431-summary.env
          if grep -Ev '^(azure_location=westeurope|recovery_vm_id=6e92a026-964c-4118-8312-f1d31c6ff4d2|prior_project_state_cleanup=PASS|firewall_public_service_ports=22_only|approved_config_reconstructed=PASS|nginx_local_tls_listeners=PASS|local_doh_encrypted_resolution=PASS|local_dot_encrypted_resolution=PASS|filter_block_exception_rollback=PASS|privacy_persistence=PASS|admin_and_firewall_fail_safe=PASS|elapsed_seconds=[0-9]+|recovery_target_health=PASS|azure_backup_owner_evidence=PASS|azure_native_restore_exercised=false|project_controlled_rebuild=PASS)$' /tmp/t0431-summary.env; then
            echo 'unexpected_summary_content=true' >&2
            exit 1
          fi
          cat /tmp/t0431-summary.env
          sudo systemctl is-active --quiet AdGuardHome.service
          sudo systemctl is-active --quiet nginx.service
          sudo ss -H -lntup | grep -q '127.0.0.1:53 '
          sudo ss -H -lntup | grep -q '127.0.0.1:3000 '
          sudo ss -H -lntup | grep -q '127.0.0.1:443 '
          sudo ss -H -lntup | grep -q '127.0.0.1:853 '
          echo 'post_run_health_recheck=PASS'
