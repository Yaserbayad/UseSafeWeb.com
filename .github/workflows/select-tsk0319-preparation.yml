name: Select TSK-0319 HUMAN_ONLY preparation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/select-tsk0319-preparation.yml'

permissions:
  contents: write

jobs:
  select:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact governed pre-state
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "e97e564775e01d3a08dfd5f61929e69024d9cbb9"
          grep -Fq '### TSK-0318 preparation stable state' CURRENT_STATE.md
          grep -Fq '`TSK-0318` is **WAITING**' CURRENT_STATE.md
          grep -Fq 'TSK-0315' CURRENT_STATE.md
          grep -Fq 'TSK-0320' CURRENT_STATE.md
      - name: Persist bounded TSK-0319 preparation selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          old_updated = '**Updated:** 2026-08-28T21:53:56Z'
          if text.count(old_updated) != 1:
              raise SystemExit('unexpected Updated pre-state')
          updated = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text = text.replace(old_updated, f'**Updated:** {updated}', 1)
          marker = '## Queue status after TSK-0318 preparation\n'
          i = text.find(marker)
          if i < 0 or text.find(marker, i + 1) >= 0:
              raise SystemExit('queue marker mismatch')
          tail = (
              '## Queue status — TSK-0319 HUMAN_ONLY preparation selected\n\n'
              '`TSK-0319 — Design automated verification, issue-specific troubleshooting, safe reset/reinstall/remove, and point-of-need help` is the selected runtime **TODO** item for **preparation only**. Its hard dependencies `TSK-0315` and `TSK-0320` are runtime PASS. The WBS classifies TSK-0319 as L4 / HIGH / A1 / HUMAN_ONLY, so AI may prepare and independently verify a complete candidate but may not perform or fabricate the human design disposition.\n\n'
              'Selection basis: TSK-0318 is already stably WAITING on its human disposition; TSK-0319 is independently eligible and blocks downstream TSK-0628. Preparing it now maximizes safe progress without crossing either human boundary.\n\n'
              'All current fences remain unchanged: `RSK-0002` OPEN; `REQ-0022` unresolved; LG-03/LG-04/LG-05/LG-06 non-PASS; account/dashboard deferred under EXC-0001; no L5/L6 build, participant processing, legal completion, payment, publication, market activation or launch authority.\n\n'
              '## Exact next authoritative step\n\n'
              'Prepare the smallest complete TSK-0319 candidate using current protection-state, support, platform-install, source-backed instruction, support/recovery/privacy and verified removal evidence. Publish and independently verify it, then classify TSK-0319 WAITING on the exact HUMAN_ONLY disposition without marking PASS.\n'
          )
          text = text[:i] + tail
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify diff and commit selection
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'TSK-0319 HUMAN_ONLY preparation selected' CURRENT_STATE.md
          grep -Fq 'selected runtime **TODO** item for **preparation only**' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: select TSK-0319 HUMAN_ONLY preparation'
          git push
