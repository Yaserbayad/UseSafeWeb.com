name: Reconcile TSK-0307 acceptance PASS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0307-pass.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact governed pre-state and evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "03d6fe05178525cef9e5879736324d2175606735"
          test "$(git hash-object TSK_0307_SOURCE_BACKED_INSTRUCTION_CONTENT_CATALOGUE_2026-08-28.md)" = "d717c9b3f66197abe1f3e73361633f222b817e7c"
          test "$(git hash-object TSK_0307_SOURCE_BACKED_INSTRUCTION_CONTENT_CATALOGUE_EVIDENCE_2026-08-28.md)" = "7bc98f1b18f3a20c9a6be75138a4704b2002bf2f"
          grep -Fq '### TSK-0317 accepted stable state' CURRENT_STATE.md
          grep -Fq '`TSK-0317` is runtime **PASS**' CURRENT_STATE.md
      - name: Apply bounded PASS reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          old_updated = '**Updated:** 2026-08-28T21:43:21Z'
          if text.count(old_updated) != 1:
              raise SystemExit('unexpected Updated pre-state')
          updated = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text = text.replace(old_updated, f'**Updated:** {updated}', 1)
          marker = '## Queue status after TSK-0317 acceptance\n'
          i = text.find(marker)
          if i < 0 or text.find(marker, i + 1) >= 0:
              raise SystemExit('queue marker mismatch')
          tail = (
              '### TSK-0307 accepted stable state\n\n'
              '`TSK-0307 — Create the source-backed instruction/content catalogue with applicability and review triggers`: **PASS for the provisional internal L4 content/instruction-definition acceptance under DEC-0050/CR-0003**. Catalogue `TSK_0307_SOURCE_BACKED_INSTRUCTION_CONTENT_CATALOGUE_2026-08-28.md`, blob `d717c9b3f66197abe1f3e73361633f222b817e7c`, publication commit `c8c0fa314701190a0b5ade9b8e48d6cf6b19ce36`; independent evidence `TSK_0307_SOURCE_BACKED_INSTRUCTION_CONTENT_CATALOGUE_EVIDENCE_2026-08-28.md`, blob `7bc98f1b18f3a20c9a6be75138a4704b2002bf2f`, corrected evidence commit `8aec0378f0e15ba3b2dac37edafa6591ea8ca39d`.\n\n'
              'ACC-0307 is satisfied for all nine current instruction classes: official/current source, platform/version/region applicability, owner, last verification, review trigger, en-GB plus explicit provisional tr-TR/ar variants, known limits and test references are present. The catalogue preserves Android DoT-hostname versus iPhone DoH-profile asymmetry, truthful verification/conflict/removal semantics, accountless privacy constraints and source-change review triggers. The first evidence draft contained an incorrect catalogue blob reference; that binding defect was detected before runtime mutation and corrected/read back in the accepted evidence above.\n\n'
              'This PASS defines internal L4 content semantics only. It does not prove representative-parent comprehension or localization usability; `RSK-0002` remains OPEN. Turkish/Arabic variants are provisional and do not activate markets. `REQ-0022` remains unresolved; LG-03/LG-04/LG-05/LG-06 remain non-PASS; account/dashboard remains deferred; no implementation/build, profile publication, participant processing, market activation, payment, publication or launch is authorized.\n\n'
              '## Queue status after TSK-0307 acceptance\n\n'
              '`TSK-0307` is runtime **PASS**. No successor is selected by this reconciliation write.\n\n'
              '## Exact next authoritative step\n\n'
              'Recompute the deterministic current L4 queue from WBS/runtime/relationship authority. Continue with the highest-priority eligible AUTO_ALLOWED work; if none remains, prepare the highest-impact eligible HUMAN_ONLY/HUMAN_APPROVAL_REQUIRED item only to the permitted boundary and stop for the smallest required human disposition.\n'
          )
          text = text[:i] + tail
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify diff and commit PASS
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '### TSK-0307 accepted stable state' CURRENT_STATE.md
          grep -Fq '`TSK-0307` is runtime **PASS**' CURRENT_STATE.md
          grep -Fq '7bc98f1b18f3a20c9a6be75138a4704b2002bf2f' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: mark TSK-0307 PASS after verification'
          git push
