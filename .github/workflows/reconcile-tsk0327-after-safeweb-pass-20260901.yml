name: Reconcile TSK-0327 after SafeWeb correction
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/reconcile_tsk0327_after_safeweb_pass_20260901.py'
      - '.github/workflows/reconcile-tsk0327-after-safeweb-pass-20260901.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist refreshed TSK-0327 PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 .github/scripts/reconcile_tsk0327_after_safeweb_pass_20260901.py
          git diff --check
          grep -Fq 'version `2.1.0-post-cr0007`' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: refresh TSK-0327 after SafeWeb correction'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          echo "TSK0327_SAFEWEB_PASS_RECONCILIATION=PASS"
          echo "TSK0327_SAFEWEB_RUNTIME_COMMIT=$(git rev-parse HEAD)"
          echo "TSK0327_SAFEWEB_RUNTIME_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
