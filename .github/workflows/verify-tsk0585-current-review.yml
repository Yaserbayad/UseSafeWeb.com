name: Verify TSK-0585 current vendor review

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0585-current-verifier-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Run structural and live-source TSK-0585 verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_tsk0585_current_vendor_review_v3.py
