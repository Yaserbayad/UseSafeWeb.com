name: Verify TSK-0044 current revalidation

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0044-current-verifier-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Run structural TSK-0044 verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_tsk0044_current_revalidation.py
