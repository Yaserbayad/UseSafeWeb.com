name: Audit TSK-0308 preparation authority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tsk0308-preparation-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Print exact TSK-0308 contract and current sources
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 - <<'PY'
          import csv, pathlib, re, subprocess
          with pathlib.Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          by={r['Task_ID']:r for r in rows}
          r=by['TSK-0308']
          print('TSK0308_ROW_BEGIN')
          for k,v in r.items(): print(f'{k}={v}')
          print('TSK0308_ROW_END')
          for dep in [x.strip() for x in re.split(r'[;,]',r.get('Dependencies','')) if x.strip()]:
              d=by[dep]
              print('DEPENDENCY|'+'|'.join([dep,d['Title'],d['Lifecycle_Stage'],d['Plan_Status'],d['Execution_State'],d['Action_Authority']]))
          state=pathlib.Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          for tid in ['TSK-0300','TSK-0309','TSK-0308']:
              print(f'RUNTIME_{tid.replace("-","")}_HITS={state.count(tid)}')
          candidates=[
            'brand/system/TSK-0300/README.md',
            'brand/system/TSK-0300/tokens.css',
            'brand/system/TSK-0300/components.css',
            'prototype/TSK-0309/BASELINE.md',
            'prototype/TSK-0324/UI_COMPONENT_RULES.md',
            'prototype/TSK-0328/INFORMATION_ARCHITECTURE_NAVIGATION.md',
            'content/TSK-0322/PRODUCT_VOICE_CLAIMS_TERMINOLOGY.md',
            'brand/identity/TSK-0301/README.md'
          ]
          for p in candidates:
              path=pathlib.Path(p)
              if path.exists():
                  sha=subprocess.check_output(['git','rev-parse',f'HEAD:{p}'],text=True).strip()
                  print(f'SOURCE|{p}|{sha}')
              else:
                  print(f'MISSING_SOURCE|{p}')
          hits=[]
          for p in pathlib.Path('.').rglob('*'):
              if p.is_file() and '.git/' not in str(p) and '0308' in str(p).lower().replace('-',''):
                  if str(p) != '.github/workflows/tsk0308-preparation-audit.yml': hits.append(str(p))
          print('EXISTING_TSK0308_PATHS_BEGIN')
          for p in sorted(hits): print(p)
          print('EXISTING_TSK0308_PATHS_END')
          print('TSK0308_PREPARATION_AUDIT=PASS')
          PY
      - name: Repository cleanliness
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
