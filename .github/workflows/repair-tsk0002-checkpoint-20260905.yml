name: Repair malformed TSK-0002 checkpoint serialization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-tsk0002-checkpoint-20260905.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate malformed state and apply exact repair
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='9c714688f2d3434da542e29b256cf3ead6536821'
          ACTUAL_BLOB="$(git hash-object CURRENT_STATE.md)"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"

          cp CURRENT_STATE.md /tmp/CURRENT_STATE.before
          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path

          path = Path('CURRENT_STATE.md')
          text = path.read_text(encoding='utf-8')
          before = json.loads(text)

          assert before['checkpoint_schema'] == 'serial-light-checkpoint-v1'
          assert before['project_id'] == 'UseSafeWeb.com'
          assert before['governance_mode'] == 'SERIAL_LIGHT'
          assert before['checkpoint_revision'] == 19
          assert before['baseline']['version'] == 1
          assert before['runtime']['project_status'] == 'ACTIVE'
          assert before['runtime']['governance_blocker'] is None

          matches = [item for item in before['runtime']['items'] if item.get('id') == 'TSK-0002']
          assert len(matches) == 1, matches
          item = matches[0]
          assert list(item.keys()) == ['id', 'status', 'TODO', 'acceptance_references'], item
          assert item['status'] == 'TODO'
          assert item['acceptance_references'] == []
          malformed = item['TODO']
          assert list(malformed.keys()) == ['condition', 'resolution_check', 'reference'], malformed
          assert malformed['condition'].startswith('Canonical migrated runtime records this task as WAITING.')
          assert '#TSK-0002' in malformed['reference']

          expected = copy.deepcopy(before)
          expected_item = next(x for x in expected['runtime']['items'] if x.get('id') == 'TSK-0002')
          del expected_item['TODO']
          assert expected_item == {
              'id': 'TSK-0002',
              'status': 'TODO',
              'acceptance_references': [],
          }

          prefix = (
              '      {\n'
              '        "id": "TSK-0002",\n'
              '        "status": "TODO",\n'
          )
          assert text.count(prefix) == 1
          start = text.index(prefix) + len(prefix)
          assert text.startswith('        "TODO": {\n', start)
          end_marker = '        "acceptance_references": []\n      }'
          end = text.index(end_marker, start)
          removed = text[start:end]
          assert removed.startswith('        "TODO": {\n')
          assert removed.endswith('        },\n')

          repaired_text = text[:start] + text[end:]
          after = json.loads(repaired_text)
          assert after == expected
          assert after['checkpoint_revision'] == 19
          assert after['baseline']['version'] == 1
          repaired_item = next(x for x in after['runtime']['items'] if x.get('id') == 'TSK-0002')
          assert repaired_item == {
              'id': 'TSK-0002',
              'status': 'TODO',
              'acceptance_references': [],
          }
          path.write_text(repaired_text, encoding='utf-8')
          print('CHECKPOINT_REPAIR_SEMANTICS=PASS revision=19 baseline=1 tsk0002=TODO')
          PY

          git diff --check -- CURRENT_STATE.md
          git diff --exit-code --quiet /tmp/CURRENT_STATE.before CURRENT_STATE.md && exit 1 || true
          git diff -- CURRENT_STATE.md

      - name: Recheck stale-write boundary, remove one-off transport, and commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='9c714688f2d3434da542e29b256cf3ead6536821'
          git fetch origin main
          REMOTE_BLOB="$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)"
          test "$REMOTE_BLOB" = "$EXPECTED_BLOB"

          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/repair-tsk0002-checkpoint-20260905.yml
          git add CURRENT_STATE.md
          printf '%s\n' '.github/workflows/repair-tsk0002-checkpoint-20260905.yml' 'CURRENT_STATE.md' > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          git commit -m 'state: repair TSK-0002 TODO serialization'
          git push origin HEAD:main
