name: Temporary - Accept TSK-0587 owner resource cost tool envelope

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: write

jobs:
  accept-tsk0587:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify TSK-0587 owner approval and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object TSK_0587_OWNER_DECISION_PACKET_2026-09-02.md)" = '88d3a57e79a69ed07210770a5bbb72e20d8c4dee'
          test "$(git hash-object TSK_0587_OWNER_APPROVAL_EVIDENCE_2026-09-02.md)" = '22c035bff361dcea8b915b940db088fcdb1f3931'
          python3 - <<'PY'
          import csv,re
          from pathlib import Path
          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          r=next(x for x in rows if x['Task_ID']=='TSK-0587')
          assert r['Lifecycle_Stage']=='L5'
          assert r['Dependencies'].strip()=='TSK-0586; TSK-0047'
          assert r['Action_Authority']=='HUMAN_ONLY' and r['AI_Capability_A0_A4']=='A1'
          assert r['Acceptance_ID']=='ACC-0587' and r['Verification_ID']=='VER-0587' and r['Evidence_ID']=='EVD-0587'
          state=Path('CURRENT_STATE.md').read_text(encoding='utf-8-sig')
          def passed(tid):
              pats=[rf'^##+\s+{re.escape(tid)}\s+current accepted stable state[^\n]*$',rf'^##+\s+{re.escape(tid)}\s+accepted stable state[^\n]*$']
              starts=[]
              for p in pats: starts += [m.start() for m in re.finditer(p,state,re.M|re.I)]
              if not starts: return bool(re.search(rf'`{re.escape(tid)}[^`]*`[^\n]*\*\*PASS\*\*',state,re.I))
              s=max(starts); e=state.find('\n## ',s+3); e=len(state) if e<0 else e
              sec=state[s:e]
              return '**PASS**' in sec or ': **PASS**' in sec or '`: **PASS**' in sec
          assert passed('TSK-0586'), 'TSK-0586 not current PASS'
          assert passed('TSK-0047'), 'TSK-0047 not current PASS'
          approval=Path('TSK_0587_OWNER_APPROVAL_EVIDENCE_2026-09-02.md').read_text(encoding='utf-8').lower()
          packet=Path('TSK_0587_OWNER_DECISION_PACKET_2026-09-02.md').read_text(encoding='utf-8').lower()
          for x in ['approve tsk-0587 recommended envelope','incremental new recurring or one-time development spend without another owner decision: **0**','contingency pre-authorized: **0**','before any paid activation','material lifecycle gates','monthly after measurable production recurring cost begins','unconfirmed existing azure/runtime/domain/tool costs remain explicitly unconfirmed']:
              assert x in approval, f'missing approval term: {x}'
          for x in ['each required role/cost has an assigned source or explicit gap','incremental new recurring or one-time development spend without a new owner approval','contingency pre-authorized','cost review cadence','no engineering-role critical gap is identified','if an l6 acceptance criterion cannot be satisfied using existing entitlement or a zero-incremental-cost option']:
              assert x in packet, f'missing decision packet acceptance term: {x}'
          print('PASS: TSK-0587 exact HUMAN_ONLY owner approval, dependencies, resource/cost sources and gaps, zero incremental limit/contingency, and review cadence verified.')
          PY
          python3 Plans/Master/Tools/validate_master_plan.py
      - name: Append TSK-0587 PASS
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('CURRENT_STATE.md'); text=p.read_text(encoding='utf-8-sig')
          heading='## TSK-0587 current accepted stable state — 2026-09-02 — OWNER-APPROVED RESOURCE/COST/TOOL ENVELOPE'
          if heading in text: raise SystemExit('TSK-0587 section already exists')
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          lines=text.splitlines()
          for i,line in enumerate(lines):
              if line.startswith('**Updated:**'):
                  lines[i]=f'**Updated:** {now}'; break
          text='\n'.join(lines).rstrip()+'\n'
          section=f'''\n{heading}\n\n`TSK-0587 — Approve development resource, cost, and tool envelope`: **PASS** under current `ACC-0587 / VER-0587 / EVD-0587` and explicit Project Owner approval.\n\n- Current normalized WBS blob `eb35f3b10356396c5117e3f47d0b0378953e2157`: L5 / A1 / `HUMAN_ONLY`; dependencies `TSK-0586; TSK-0047` are current durable PASS.\n- Prepared decision packet: `TSK_0587_OWNER_DECISION_PACKET_2026-09-02.md`, blob `88d3a57e79a69ed07210770a5bbb72e20d8c4dee`, publication commit `b717e97bbfd5a35eb0db5b4f678f9ac3a72e1907`.\n- Explicit owner approval evidence: `TSK_0587_OWNER_APPROVAL_EVIDENCE_2026-09-02.md`, blob `22c035bff361dcea8b915b940db088fcdb1f3931`, publication commit `d7cf614e172c884e8763fef79cc7356851fbc853`; owner instruction: `Approve TSK-0587 recommended envelope.`\n- Approved limit: zero incremental new recurring or one-time development spend without a new owner decision; existing owner-provided/paid resources may be used within existing entitlement/frozen architecture. Approved contingency: zero.\n- Cost review cadence: before paid activation, at material lifecycle gates, monthly after measurable production recurring cost begins, and earlier on applicable TSK-0237 vendor price/quota triggers.\n- Explicit gaps remain non-guessed: existing Azure/runtime/domain/tool costs and implementation-bounded datastore/secrets/monitoring choices remain unconfirmed until real source/selection evidence exists; any required new spend returns to the owner before activation.\n- Independent GitHub Actions acceptance run `{os.environ['RUN_ID']}`: exact WBS/dependency/action-authority contract, immutable decision/approval blobs, resource/cost source-or-gap coverage, approved limit/contingency/cadence, critical-gap disposition, and full master-plan validator all PASS before this state mutation.\n- **Non-inference:** no paid action, vendor upgrade, L6 build, deployment, production activation, launch, legal/compliance conclusion, TSK-0051 or LG-07 PASS is inferred.\n\n### Queue status after TSK-0587 acceptance\n\nRecompute current authority. `TSK-0051` becomes dependency-eligible only if `TSK-0052` and `TSK-0049` remain current PASS and its complete LG-07 acceptance is independently proven.\n'''
          p.write_text(text+section,encoding='utf-8')
          PY
          git diff --check
          test "$(git status --porcelain | sed 's/^...//' | sort)" = 'CURRENT_STATE.md'
      - name: Persist and read back
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0587 owner resource cost tool envelope'
          C="$(git rev-parse HEAD)"; B="$(git rev-parse "$C:CURRENT_STATE.md")"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$C"
          test "$(git rev-parse "origin/main:CURRENT_STATE.md")" = "$B"
          git show origin/main:CURRENT_STATE.md | grep -Fq '## TSK-0587 current accepted stable state — 2026-09-02 — OWNER-APPROVED RESOURCE/COST/TOOL ENVELOPE'
          echo "TSK0587_STATE_COMMIT=$C"
          echo "TSK0587_STATE_BLOB=$B"
          echo 'TSK0587_STATE_REMOTE_READBACK=PASS'
