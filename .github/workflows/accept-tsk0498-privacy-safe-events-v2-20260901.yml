name: Temporary - Inspect TSK-0361 generated source files

on:
  push:
    branches:
      - feature/tsk-0361-nextjs-public-site-20260902
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  inspect-generated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - name: Inspect deterministic generated source delta
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm install --no-fund --no-audit >/dev/null
          NEXT_TELEMETRY_DISABLED=1 npm run build >/dev/null
          cd ..
          echo '--- GIT STATUS ---'
          git status --porcelain
          echo '--- NEXT ENV ---'
          if test -f website/next-env.d.ts; then cat website/next-env.d.ts; fi
          echo '--- TSCONFIG DIFF ---'
          git diff -- website/tsconfig.json
          echo 'TSK0361_GENERATED_DELTA_INSPECTION=PASS'
