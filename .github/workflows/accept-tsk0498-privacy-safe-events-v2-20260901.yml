name: Temporary - Independently verify TSK-0048 backlog

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-tsk0048:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published TSK-0048
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object TSK_0048_DEPENDENCY_ORDERED_VERTICAL_IMPLEMENTATION_BACKLOG_2026-09-02.md)" = '4463a818d15a9faa4e48363105bce92fe28e3450'
          python3 Plans/Master/Tools/verify_tsk0048_vertical_backlog_20260902.py
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --exit-code -- TSK_0048_DEPENDENCY_ORDERED_VERTICAL_IMPLEMENTATION_BACKLOG_2026-09-02.md
