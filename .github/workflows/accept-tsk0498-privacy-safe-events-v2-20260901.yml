name: Temporary - Read exact TSK-0237 and TSK-0587 contracts

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  read-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit exact WBS rows and current PASS deps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,re
          from pathlib import Path
          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          state=Path('CURRENT_STATE.md').read_text(encoding='utf-8-sig')
          for tid in ['TSK-0237','TSK-0587','TSK-0051','TSK-0052']:
              r=next(x for x in rows if x['Task_ID']==tid)
              print('TASK='+tid)
              for k in ['Lifecycle_Stage','Title','Plan_Status','Priority','Dependencies','Acceptance_ID','Acceptance_Criteria','Verification_ID','Verification_Method','Evidence_ID','Evidence_Required','Primary_Owner','AI_Capability_A0_A4','Action_Authority','Risk_Reference','Cost/Budget','Notes']:
                  print(k+'='+(r.get(k) or '').replace('\n',' '))
          PY
          python3 Plans/Master/Tools/validate_master_plan.py
