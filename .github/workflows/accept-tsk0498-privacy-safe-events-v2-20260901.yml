name: Temporary - Post-TSK-0357 frontier diagnostic

on:
  push:
    branches:
      - diag/post-tsk0357-frontier-20260902
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Print exact TSK-0358 authority and dependency evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = '21d6a75d674b99a03ed4056a629fc1695835d687'
          test "$(git merge-base HEAD origin/main)" = '21d6a75d674b99a03ed4056a629fc1695835d687'
          test "$(git diff --name-only origin/main...HEAD)" = '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'
          python3 Plans/Master/Tools/validate_master_plan.py
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path

          root = Path('.')
          wbs = root/'Plans/Master/WBS/master-wbs.csv'
          with wbs.open(encoding='utf-8', newline='') as f:
              reader = csv.DictReader(f)
              rows = list(reader)
              fields = reader.fieldnames or []
          id_field = next((k for k in fields if k.lstrip('\ufeff') == 'Task_ID'), None)
          if not id_field:
              raise SystemExit('Task_ID field missing')
          matches = [r for r in rows if r.get(id_field) == 'TSK-0358']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one exact TSK-0358 row, found {len(matches)}')
          row = matches[0]
          print('TSK0358_ROW=' + json.dumps(row, ensure_ascii=False, sort_keys=True))

          deps = sorted(set(re.findall(r'TSK-\d{4}', row.get('Dependencies',''))))
          print('TSK0358_DEPS=' + ';'.join(deps))
          state = (root/'CURRENT_STATE.md').read_text(encoding='utf-8')
          for dep in deps:
              patterns = [
                  rf'## {re.escape(dep)} current accepted stable state',
                  rf'`{re.escape(dep)}[^`]*`: \*\*PASS\*\*',
              ]
              ok = any(re.search(p, state) for p in patterns)
              print(f'DEP_RUNTIME_{dep}=' + ('PASS_EVIDENCE_PRESENT' if ok else 'NO_DIRECT_PASS_MARKER'))

          needles = ['TSK-0358', 'ACC-0358', 'VER-0358', 'EVD-0358']
          for path in sorted((root/'Plans/Master').rglob('*')):
              if not path.is_file() or path.suffix.lower() not in {'.md','.yaml','.yml','.csv','.json','.txt'}:
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except Exception:
                  continue
              for i,line in enumerate(lines,1):
                  if any(n in line for n in needles):
                      print(f'AUTH_MATCH={path}:{i}:{line}')

          print('TSK0358_DIAGNOSTIC=PASS')
          PY
