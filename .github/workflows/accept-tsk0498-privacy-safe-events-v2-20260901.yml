name: Temporary - TSK-0361 framework build verification

on:
  push:
    branches:
      - feature/tsk-0361-nextjs-public-site-20260902
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - name: Install and verify TSK-0361 framework baseline
        shell: bash
        run: |
          set -euo pipefail
          node --test website/tests/contract/tsk0361.test.mjs
          cd website
          npm install --no-fund --no-audit
          npm run lint
          npm run typecheck
          NEXT_TELEMETRY_DISABLED=1 npm run build
          npm audit --omit=dev --audit-level=high
          test "$(node -p "require('./node_modules/next/package.json').version")" = '16.3.3'
          test "$(node -p "require('./node_modules/react/package.json').version")" = '19.2.8'
          test "$(node -p "require('./node_modules/react-dom/package.json').version")" = '19.2.8'
          echo 'TSK0361_FRAMEWORK_BUILD=PASS'
