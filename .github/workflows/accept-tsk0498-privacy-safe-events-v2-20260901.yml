name: Temporary - Verify and freeze TSK-0361 dependency lock

on:
  push:
    branches:
      - feature/tsk-0361-nextjs-public-site-20260902
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: write

jobs:
  verify-and-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - name: Verify source, framework, generated-file, and master-plan boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object .gitignore)" = '0caad3916497b0c89cb53238ce525a0a8d06bfaf'
          test "$(git hash-object website/package.json)" = 'da15ebcbec9c6154276e4abd5bd2e63f86f9840f'
          test "$(git hash-object website/tests/contract/tsk0361.test.mjs)" = '84d8592e4b8c2b833a70a9fb4d54ec02705edd78'
          test ! -e website/next-env.d.ts
          git check-ignore -q website/next-env.d.ts
          git check-ignore -q website/tsconfig.tsbuildinfo
          node --test website/tests/contract/tsk0361.test.mjs
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          cd website
          npm install --no-fund --no-audit
          test "$(node -p "require('./node_modules/eslint/package.json').version")" = '9.39.5'
          test "$(node -p "require('./node_modules/next/package.json').version")" = '16.3.3'
          test "$(node -p "require('./node_modules/react/package.json').version")" = '19.2.8'
          test "$(node -p "require('./node_modules/react-dom/package.json').version")" = '19.2.8'
          npm run lint
          npm run typecheck
          test -f next-env.d.ts
          git check-ignore -q next-env.d.ts
          NEXT_TELEMETRY_DISABLED=1 npm run build
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          cd ..
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --check
          echo 'TSK0361_PRELOCK_VERIFICATION=PASS'
      - name: Persist exact dependency lock only after verification
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(git rev-parse HEAD)"
          git fetch origin feature/tsk-0361-nextjs-public-site-20260902
          test "$(git rev-parse origin/feature/tsk-0361-nextjs-public-site-20260902)" = "$SOURCE"
          test -f website/package-lock.json
          STATUS="$(git status --porcelain | sed 's/^...//' | sort)"
          printf '%s\n' "$STATUS"
          test "$STATUS" = 'website/package-lock.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/package-lock.json
          git commit -m 'chore: freeze verified TSK-0361 dependency lock'
          C="$(git rev-parse HEAD)"
          B="$(git rev-parse "$C:website/package-lock.json")"
          git push origin HEAD:feature/tsk-0361-nextjs-public-site-20260902
          git fetch origin feature/tsk-0361-nextjs-public-site-20260902
          test "$(git rev-parse origin/feature/tsk-0361-nextjs-public-site-20260902)" = "$C"
          test "$(git rev-parse "origin/feature/tsk-0361-nextjs-public-site-20260902:website/package-lock.json")" = "$B"
          echo "TSK0361_LOCK_COMMIT=$C"
          echo "TSK0361_LOCK_BLOB=$B"
          echo 'TSK0361_LOCK_REMOTE_READBACK=PASS'
