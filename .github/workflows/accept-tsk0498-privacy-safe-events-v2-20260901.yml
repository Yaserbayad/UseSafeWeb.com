name: Temporary - Complete TSK-0358 acceptance proof

on:
  push:
    branches:
      - diag/tsk0455-contract-reconcile-20260902b
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  verify-tsk0358-gap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Verify isolation, authority and dormant optional-account transitions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 'e2586f389a29524b23d105cd56acaa2a038b2b46'
          test "$(git merge-base HEAD origin/main)" = 'e2586f389a29524b23d105cd56acaa2a038b2b46'
          test "$(git diff --name-only origin/main...HEAD)" = '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'
          python3 Plans/Master/Tools/validate_master_plan.py
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { stripTypeScriptTypes } from 'node:module';

          const source = readFileSync('website/src/lib/core-state-machine.ts', 'utf8');
          const js = stripTypeScriptTypes(source, { mode: 'strip' });
          const api = await import(`data:text/javascript;base64,${Buffer.from(js).toString('base64')}`);

          assert.deepEqual(api.optionalAccountTransition({ capabilityEnabled: true, status: 'unavailable' }, 'ENTER'), { capabilityEnabled: true, status: 'entry', route: '/account' });
          assert.deepEqual(api.optionalAccountTransition({ capabilityEnabled: true, status: 'entry' }, 'RETURN'), { capabilityEnabled: true, status: 'authenticated', route: '/dashboard' });
          assert.deepEqual(api.optionalAccountTransition({ capabilityEnabled: true, status: 'authenticated' }, 'DASHBOARD'), { capabilityEnabled: true, status: 'authenticated', route: '/dashboard' });
          assert.deepEqual(api.optionalAccountTransition({ capabilityEnabled: true, status: 'authenticated' }, 'EXPIRE'), { capabilityEnabled: true, status: 'expired', route: '/account' });
          assert.deepEqual(api.optionalAccountTransition({ capabilityEnabled: true, status: 'authenticated' }, 'LOGOUT'), { capabilityEnabled: true, status: 'logged-out', route: null });
          assert.deepEqual(api.optionalAccountTransition({ capabilityEnabled: true, status: 'logged-out' }, 'DASHBOARD'), { capabilityEnabled: true, status: 'logged-out', route: '/account' });
          assert.equal(api.coreRequiresLogin({ capabilityEnabled: true, status: 'authenticated' }), false);
          assert.equal(api.evaluateProtection({ coverage: 'covered', configured: true, technical: null, action: null, uncertainty: null, removal: null, accountOwned: true }).state, 'configured/parent-confirmed');
          console.log('TSK0358_OPTIONAL_ACCOUNT_STATE_CONTRACT=PASS');
          NODE
          test ! -e website/src/app/'[locale]'/account
          test ! -e website/src/app/'[locale]'/dashboard
          ! grep -R -E --exclude='tsk0358.test.mjs' --exclude='core-state-machine.ts' 'optionalAccountTransition\(' website/src
          printf 'TSK0358_OWNER_FENCE_NON_ACTIVATION=PASS\n'
          printf 'TSK0358_SUPPLEMENTAL_ACCEPTANCE=PASS\n'
