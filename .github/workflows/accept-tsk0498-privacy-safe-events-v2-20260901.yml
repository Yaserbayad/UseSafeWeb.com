name: Temporary - Verify corrected TSK-0047 release plan

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-tsk0047:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify corrected TSK-0047 plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object TSK_0047_RELEASE_CHECKPOINT_ROLLBACK_PLAN_2026-09-02.md)" = '00e4c57b2db0efdd23e213ac2078a435f24f0171'
          test "$(git hash-object Plans/Master/Tools/verify_tsk0047_release_checkpoint_rollback_20260902.py)" = '3739809c3a8cf4a189ca00804a808bb3e5b72cc9'
          python3 Plans/Master/Tools/verify_tsk0047_release_checkpoint_rollback_20260902.py
          python3 Plans/Master/Tools/validate_master_plan.py
