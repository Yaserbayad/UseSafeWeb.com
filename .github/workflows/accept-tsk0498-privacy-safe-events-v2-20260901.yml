name: Temporary - TSK-0357 RED acceptance

on:
  push:
    branches:
      - feature/tsk-0357-anonymous-journey-state-20260902
    paths:
      - 'website/**'
      - 'Plans/Master/WBS/master-wbs.csv'
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Prove TSK-0357 unit contract is RED before implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          cd website
          npm ci --no-fund --no-audit
          node --test tests/contract/tsk0357.test.mjs

  red-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build unchanged baseline
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm ci --no-fund --no-audit
          NEXT_TELEMETRY_DISABLED=1 npm run build
      - name: Install exact ephemeral browser tooling
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm install --no-save --no-package-lock --no-fund --no-audit playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Prove TSK-0357 browser contract is RED before implementation
        shell: bash
        run: |
          set -euo pipefail
          cd website
          NEXT_TELEMETRY_DISABLED=1 npm start -- -p 3000 > /tmp/tsk0357-red.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/tsk0357-red.log' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/en-GB/start >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3000 node tests/browser/tsk0357-browser.mjs
