name: Temporary - TSK-0358 RED browser

on:
  push:
    branches:
      - feature/tsk-0358-accountless-core-state-machine-20260902
    paths:
      - 'website/**'
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Verify TSK-0358 logic slice remains green
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm ci --no-fund --no-audit
          node --test tests/contract/tsk0358.test.mjs

  red-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build current product baseline
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm ci --no-fund --no-audit
          NEXT_TELEMETRY_DISABLED=1 npm run build
      - name: Install exact browser tooling
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm install --no-save --no-package-lock --no-fund --no-audit playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Prove TSK-0358 browser contract is RED before UI implementation
        shell: bash
        run: |
          set -euo pipefail
          cd website
          NEXT_TELEMETRY_DISABLED=1 npm start -- -p 3000 > /tmp/tsk0358-red.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/tsk0358-red.log' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/en-GB/start >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3000 node tests/browser/tsk0358-browser.mjs
