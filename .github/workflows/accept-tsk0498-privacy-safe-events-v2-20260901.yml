name: Temporary - TDD TSK-0454 source structure branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  verify-tsk0454-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify current TSK-0454 feature branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 'feature/tsk-0454-source-structure-20260902:refs/remotes/origin/feature/tsk-0454-source-structure-20260902'
          git checkout --detach refs/remotes/origin/feature/tsk-0454-source-structure-20260902
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --check
