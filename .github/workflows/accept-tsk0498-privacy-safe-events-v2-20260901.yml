name: Temporary - Read exact TSK-0050 contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  read-tsk0050:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Emit exact TSK-0050 WBS contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          r=next(x for x in rows if x['Task_ID']=='TSK-0050')
          for k in ['Task_ID','Lifecycle_Stage','Title','Plan_Status','Priority','Dependencies','Acceptance_ID','Acceptance_Criteria','Verification_ID','Verification_Method','Evidence_ID','Evidence_Required','Primary_Owner','AI_Capability_A0_A4','Action_Authority','Risk_Reference','Cost/Budget','Notes']:
              print(k+'='+(r.get(k) or '').replace('\n',' '))
          print('DIRECT_SUCCESSORS='+';'.join(x['Task_ID'] for x in rows if 'TSK-0050' in [d.strip() for d in (x.get('Dependencies') or '').split(';') if d.strip()]))
          PY
          python3 Plans/Master/Tools/validate_master_plan.py
