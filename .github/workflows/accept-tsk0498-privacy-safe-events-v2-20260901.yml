name: Temporary - Inspect TSK-0361 current execution contract

on:
  push:
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  inspect-tsk0361:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Extract exact current contract and predecessor state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path
          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          row=next(r for r in rows if r['Task_ID']=='TSK-0361')
          print('TSK0361_ROW='+json.dumps(row, ensure_ascii=False, sort_keys=True))
          state=Path('CURRENT_STATE.md').read_text(encoding='utf-8-sig')
          def passed(tid):
              pats=[rf'^##+\s+{re.escape(tid)}(?:\s*/[^\n]*)?\s+current accepted stable state[^\n]*$',rf'^##+\s+{re.escape(tid)}(?:\s*/[^\n]*)?\s+accepted stable state[^\n]*$']
              starts=[]
              for p in pats: starts += [m.start() for m in re.finditer(p,state,re.M|re.I)]
              if starts:
                  s=max(starts); e=state.find('\n## ',s+3); e=len(state) if e<0 else e
                  if '**PASS**' in state[s:e] or ': **PASS**' in state[s:e] or '`: **PASS**' in state[s:e]: return True
              return bool(re.search(rf'`{re.escape(tid)}[^`]*`[^\n]*\*\*PASS\*\*',state,re.I))
          for tid in ['TSK-0354','TSK-0308','TSK-0307','TSK-0454','TSK-0050']:
              print(f'{tid}_PASS={str(passed(tid)).lower()}')
              assert passed(tid), tid
          assert row['Lifecycle_Stage']=='L6'
          assert row['Dependencies'].strip()=='TSK-0354; TSK-0308; TSK-0307'
          assert row['Priority']=='HIGH'
          assert row['Action_Authority']=='AUTO_ALLOWED' and row['AI_Capability_A0_A4']=='A3'
          assert row['Acceptance_ID']=='ACC-0361' and row['Verification_ID']=='VER-0361' and row['Evidence_ID']=='EVD-0361'
          PY
          python3 Plans/Master/Tools/validate_master_plan.py
          echo 'TSK0361_CURRENT_CONTRACT_INSPECTION=PASS'
