name: Temporary - TSK-0358 clean-main acceptance

on:
  push:
    branches:
      - verify/tsk-0358-clean-main-20260902
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  tsk0358-clean-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Verify clean-main parent and authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'e2586f389a29524b23d105cd56acaa2a038b2b46'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object website/package-lock.json)" = '14f9a62607489f965b96d98cdf0d825a363cd8bc'
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --check HEAD^
      - name: Locked install and contract tests
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm ci --no-fund --no-audit
          npm run test:contract
      - name: Lint, typecheck, and production build
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm run lint
          npm run typecheck
          NEXT_TELEMETRY_DISABLED=1 npm run build
      - name: Dependency and version verification
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          test "$(node -p "require('./package.json').dependencies.next")" = '16.3.3'
          test "$(node -p "require('./package.json').dependencies.react")" = '19.2.8'
          test "$(node -p "require('./package.json').dependencies['react-dom']")" = '19.2.8'
      - name: Install exact ephemeral browser tooling
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm install --no-save --no-package-lock --no-fund --no-audit playwright@1.62.1 axe-core@4.13.0
          npx playwright install --with-deps chromium
      - name: Real-browser merged-main acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd website
          NEXT_TELEMETRY_DISABLED=1 npm start -- -p 3000 > /tmp/tsk0358-main.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/tsk0358-main.log' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/en-GB/start >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3000 node tests/browser/tsk0361-browser.mjs
          BASE_URL=http://127.0.0.1:3000 node tests/browser/tsk0357-browser.mjs
          BASE_URL=http://127.0.0.1:3000 node tests/browser/tsk0358-browser.mjs
          test -z "$(git status --porcelain)"
          printf 'TSK0358_CLEAN_MAIN_ACCEPTANCE=PASS\n'
