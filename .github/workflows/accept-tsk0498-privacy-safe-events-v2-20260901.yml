name: Temporary - Verify merged TSK-0454 source structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  verify-tsk0454-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify merged TSK-0454 on clean main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object tests/repository-structure/verify_structure.py)" = 'ae2444df35bcf3c967800709b35a0366924e55e0'
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --check
          echo 'TSK0454_MERGED_MAIN_VERIFICATION=PASS'
