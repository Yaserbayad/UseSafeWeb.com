name: Diagnostic - Post TSK-0361 L6 frontier

on:
  push:
    branches:
      - diag/post-tsk0361-l6-frontier-20260902
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  derive-frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Derive current L6 AUTO_ALLOWED dependency frontier
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          python3 Plans/Master/Tools/validate_master_plan.py
          python3 - <<'PY'
          import csv, re
          from pathlib import Path

          state = Path('CURRENT_STATE.md').read_text(encoding='utf-8-sig')
          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          by_id = {(r.get('Task_ID') or '').strip(): r for r in rows if (r.get('Task_ID') or '').strip()}

          heading_re = re.compile(r'^##+\s+(TSK-\d{4})\s+current accepted stable state[^\n]*$', re.M | re.I)
          matches = list(heading_re.finditer(state))
          latest = {}
          for i, m in enumerate(matches):
              start = m.start()
              end = matches[i + 1].start() if i + 1 < len(matches) else len(state)
              latest[m.group(1).upper()] = state[start:end]
          pass_ids = set()
          for tid, section in latest.items():
              lead = '\n'.join(section.splitlines()[:8])
              if re.search(rf'`?{re.escape(tid)}\b[^\n]*:\s*\*\*PASS\*\*', lead, re.I):
                  pass_ids.add(tid)

          for tid in ('TSK-0361','TSK-0354','TSK-0308','TSK-0307','TSK-0320','TSK-0445'):
              assert tid in pass_ids, tid
          assert '`LG-07 — Architecture, Security, Privacy and Delivery Readiness`: **PASS**' in state

          def deps(r):
              return [x.strip() for x in (r.get('Dependencies') or '').split(';') if x.strip()]

          l6 = [r for r in rows if (r.get('Lifecycle_Stage') or '').strip() == 'L6']
          candidates = []
          for r in l6:
              tid = (r.get('Task_ID') or '').strip()
              if not tid or tid in pass_ids or (r.get('Action_Authority') or '').strip() != 'AUTO_ALLOWED':
                  continue
              if not [d for d in deps(r) if d not in pass_ids]:
                  candidates.append(r)

          priority_rank = {'CRITICAL': 0, 'HIGH': 1, 'MEDIUM': 2, 'LOW': 3}
          def successor_pressure(tid):
              critical = high = total = 0
              for s in l6:
                  sid = (s.get('Task_ID') or '').strip()
                  if not sid or sid in pass_ids or tid not in deps(s):
                      continue
                  others = [d for d in deps(s) if d != tid and d not in pass_ids]
                  if not others:
                      total += 1
                      p = (s.get('Priority') or '').strip()
                      critical += p == 'CRITICAL'
                      high += p == 'HIGH'
              return critical, high, total

          candidates.sort(key=lambda r: (
              priority_rank.get((r.get('Priority') or '').strip(), 9),
              -successor_pressure((r.get('Task_ID') or '').strip())[0],
              -successor_pressure((r.get('Task_ID') or '').strip())[1],
              (r.get('Task_ID') or '').strip(),
          ))

          print(f'RUNTIME_PASS_COUNT={len(pass_ids)}')
          print(f'L6_ROW_COUNT={len(l6)}')
          print(f'L6_STRICT_DEPENDENCY_READY_COUNT={len(candidates)}')
          for r in candidates:
              tid = (r.get('Task_ID') or '').strip()
              c, h, t = successor_pressure(tid)
              print('FRONTIER|' + '|'.join([
                  tid,(r.get('Priority') or '').strip(),(r.get('AI_Capability_A0_A4') or '').strip(),
                  (r.get('Action_Authority') or '').strip(),','.join(deps(r)) or '-',
                  f'unlocks_critical={c}',f'unlocks_high={h}',f'unlocks_total={t}',
                  (r.get('Task_Name') or r.get('Title') or r.get('Task') or r.get('Objective') or '').replace('|','/').strip(),
              ]))

          for tid in ('TSK-0455','TSK-0456','TSK-0457','TSK-0357','TSK-0358'):
              r = by_id[tid]
              missing = [d for d in deps(r) if d not in pass_ids]
              print(f'CHAIN|{tid}|priority={(r.get("Priority") or "").strip()}|deps={",".join(deps(r))}|missing={",".join(missing) or "NONE"}|authority={(r.get("Action_Authority") or "").strip()}')

          assert candidates and (candidates[0].get('Task_ID') or '').strip() == 'TSK-0455'
          print('SELECTED_BY_GOVERNING_PRIORITY=TSK-0455')
          PY
          git diff --check
          test -z "$(git status --porcelain)"
