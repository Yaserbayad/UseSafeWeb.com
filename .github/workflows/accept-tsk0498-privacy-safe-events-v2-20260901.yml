name: Temporary - Accept TSK-0048 vertical implementation backlog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  accept-tsk0048:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact TSK-0048 acceptance boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object TSK_0048_DEPENDENCY_ORDERED_VERTICAL_IMPLEMENTATION_BACKLOG_2026-09-02.md)" = '4463a818d15a9faa4e48363105bce92fe28e3450'
          test "$(git hash-object Plans/Master/Tools/verify_tsk0048_vertical_backlog_20260902.py)" = '976e678d636e6deacdcda173696e391a95e3abe9'
          python3 Plans/Master/Tools/verify_tsk0048_vertical_backlog_20260902.py
          python3 Plans/Master/Tools/validate_master_plan.py
      - name: Append bounded TSK-0048 PASS state
        shell: bash
        env:
          VERIFY_RUN_ID: '33661466541'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('CURRENT_STATE.md')
          text=p.read_text(encoding='utf-8-sig')
          heading='## TSK-0048 current accepted stable state — 2026-09-02 — POST-CR-0010'
          if heading in text:
              raise SystemExit('TSK-0048 accepted-state section already exists')
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          lines=text.splitlines()
          for i,line in enumerate(lines):
              if line.startswith('**Updated:**'):
                  lines[i]=f'**Updated:** {now}'
                  break
          text='\n'.join(lines).rstrip()+'\n'
          section=f'''\n{heading}\n\n`TSK-0048 — Create dependency-ordered vertical implementation backlog`: **PASS** under current `ACC-0048 / VER-0048 / EVD-0048`.\n\n- Current normalized WBS blob `eb35f3b10356396c5117e3f47d0b0378953e2157`; hard dependencies `TSK-0043; TSK-0321; TSK-0239` are current durable PASS.\n- Accepted artifact: `TSK_0048_DEPENDENCY_ORDERED_VERTICAL_IMPLEMENTATION_BACKLOG_2026-09-02.md`, version `1.0.0`, blob `4463a818d15a9faa4e48363105bce92fe28e3450`, publication commit `081043e32e5fe63634cb653108ebff9665ebd449`.\n- The derived backlog covers all 76 current non-PASS L6 tasks exactly once in 55 dependency-ordered slices of at most four canonical tasks, with canonical owner/dependencies/acceptance/verification/artifact/risk/release target plus derived S/M execution size. WBS remains sole mutable task authority.\n- Deterministic verifier `Plans/Master/Tools/verify_tsk0048_vertical_backlog_20260902.py`, blob `976e678d636e6deacdcda173696e391a95e3abe9`, proves complete coverage, no duplicates, dependency precedence, required scope/non-goal guardrails and byte-for-byte regeneration from current WBS/runtime.\n- Independent read-only GitHub Actions verification run `{os.environ['VERIFY_RUN_ID']} / 1`: **SUCCESS**. Full modular validator also PASS: 641 tasks, 858 dependency edges, 0 broken links, 0 generated missing task IDs.\n- Scope guardrails preserved: accountless core remains mandatory; optional account/session/minimum ownership/dashboard scope remains bounded; browsing/query/activity history, child accounts and unrestricted customer DNS administration remain excluded; CR-0009 legal scope remains owner-external without legal PASS inference.\n- **Non-inference:** no L6 task, LG-07, build, deployment, production, spend or human-only approval is inferred from this planning PASS. TSK-0516 and TSK-0047 retain their own acceptance boundaries; L6 starts only after actual LG-07 PASS.\n\n### Queue status after TSK-0048 acceptance\n\nRecompute current L5 eligibility. Direct successor `TSK-0516` may execute only if all current gates/constraints remain satisfied.\n'''
          p.write_text(text+section,encoding='utf-8')
          PY
          git diff --check
          test "$(git status --porcelain | sed 's/^...//' | sort)" = 'CURRENT_STATE.md'
      - name: Persist and read back TSK-0048 PASS
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0048 vertical implementation backlog'
          C="$(git rev-parse HEAD)"
          B="$(git rev-parse "$C:CURRENT_STATE.md")"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$C"
          test "$(git rev-parse "origin/main:CURRENT_STATE.md")" = "$B"
          git show origin/main:CURRENT_STATE.md | grep -Fq '## TSK-0048 current accepted stable state — 2026-09-02 — POST-CR-0010'
          echo "TSK0048_STATE_COMMIT=$C"
          echo "TSK0048_STATE_BLOB=$B"
          echo 'TSK0048_STATE_REMOTE_READBACK=PASS'
