name: Temporary - Verify TSK-0361 locale/canonical fix

on:
  push:
    branches:
      - feature/tsk-0361-nextjs-public-site-20260902
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  verify-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Verify locale-root and path-aware metadata fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object website/package-lock.json)" = '14f9a62607489f965b96d98cdf0d825a363cd8bc'
          test "$(git hash-object website/tests/contract/tsk0361.test.mjs)" = '31116c434bda726cf10586070c28efe23bad2053'
          node --test website/tests/contract/tsk0361.test.mjs
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          cd website
          npm ci --no-fund --no-audit
          npm run lint
          npm run typecheck
          NEXT_TELEMETRY_DISABLED=1 npm run build
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          cd ..
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'TSK0361_LOCALE_CANONICAL_FIX_BUILD=PASS'
