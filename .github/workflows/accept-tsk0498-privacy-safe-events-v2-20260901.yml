name: Temporary - Accept TSK-0050 LG-07 baseline persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: write

jobs:
  accept-tsk0050:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify TSK-0050 before state mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object TSK_0050_LG07_APPROVED_BASELINE_PERSISTENCE_INDEX_2026-09-02.md)" = '971af8e89ce79bfe00e4c08d647104b445673ec5'
          test "$(git hash-object Plans/Master/Tools/verify_tsk0050_lg07_baseline_persistence_20260902.py)" = '3023e556b991958ec6106f891d4548228bafafe8'
          python3 Plans/Master/Tools/verify_tsk0050_lg07_baseline_persistence_20260902.py
          python3 Plans/Master/Tools/validate_master_plan.py
      - name: Append TSK-0050 PASS
        shell: bash
        env:
          VERIFY_RUN_ID: '33664917332'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('CURRENT_STATE.md'); text=p.read_text(encoding='utf-8-sig')
          heading='## TSK-0050 current accepted stable state — 2026-09-02 — LG-07 BASELINE PERSISTED'
          if heading in text: raise SystemExit('TSK-0050 section already exists')
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          lines=text.splitlines()
          for i,line in enumerate(lines):
              if line.startswith('**Updated:**'):
                  lines[i]=f'**Updated:** {now}'; break
          text='\n'.join(lines).rstrip()+'\n'
          section=f'''\n{heading}\n\n`TSK-0050 — Persist approved baselines and readiness decision in GitHub`: **PASS** under current `ACC-0050 / VER-0050 / EVD-0050`.\n\n- Current normalized WBS blob `eb35f3b10356396c5117e3f47d0b0378953e2157`: L5 / A3 / `AUTO_ALLOWED`; sole dependency `TSK-0051` is current durable PASS and LG-07 is current durable PASS.\n- Accepted persistence index: `TSK_0050_LG07_APPROVED_BASELINE_PERSISTENCE_INDEX_2026-09-02.md`, version `1.0.0`, blob `971af8e89ce79bfe00e4c08d647104b445673ec5`, publication commit `bb41fadc6b883fdbaa27077b1ff3c88ca7d20943`.\n- Deterministic verifier: `Plans/Master/Tools/verify_tsk0050_lg07_baseline_persistence_20260902.py`, blob `3023e556b991958ec6106f891d4548228bafafe8`.\n- Independent read-only GitHub Actions verification run `{os.environ['VERIFY_RUN_ID']} / 1`: **SUCCESS**; 12 immutable readiness artifacts matched exact blobs, current LG-07 PASS and authority separation were verified, the next action was confirmed as a full L6 frontier recomputation, secret/participant-data payload guards passed, and the full modular validator passed with 641 tasks / 858 dependency edges / 0 broken links / 0 generated missing task IDs.\n- Earlier read-only run `33664805560` failed only because a narrative assertion ignored Markdown backticks around `CURRENT_STATE.md`; it caused no runtime mutation or acceptance failure. The accepted verifier normalizes narrative presentation while keeping artifact hashes and authoritative WBS fields exact.\n- Single-authority invariant preserved: WBS owns task/dependency/acceptance, gate register owns LG-07, relationship index owns traversal, and `CURRENT_STATE.md` owns volatile runtime. This persistence index is immutable evidence/pointers only.\n- The persisted baseline contains repository/task/commit/blob/run identifiers and governance statements only; no password, token, private key, production secret, raw DNS query, browsing/activity history or participant record is included.\n- **Non-inference:** TSK-0050 PASS marks no L6 implementation task PASS and authorizes no deployment, production activation, new spend, participant processing, launch, or legal/compliance completion.\n\n### Queue status after TSK-0050 acceptance\n\nLG-07 and all non-legal L5 readiness work are complete. Recompute the full current L6 eligible frontier from WBS/graph/runtime/gates and select the highest-priority genuinely executable `AUTO_ALLOWED` task. `TSK-0240` remains owner-external under CR-0009 and is not selected as legal work.\n'''
          p.write_text(text+section,encoding='utf-8')
          PY
          git diff --check
          test "$(git status --porcelain | sed 's/^...//' | sort)" = 'CURRENT_STATE.md'
      - name: Persist and read back
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0050 LG-07 baseline persistence'
          C="$(git rev-parse HEAD)"; B="$(git rev-parse "$C:CURRENT_STATE.md")"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$C"
          test "$(git rev-parse "origin/main:CURRENT_STATE.md")" = "$B"
          git show origin/main:CURRENT_STATE.md | grep -Fq '## TSK-0050 current accepted stable state — 2026-09-02 — LG-07 BASELINE PERSISTED'
          echo "TSK0050_STATE_COMMIT=$C"
          echo "TSK0050_STATE_BLOB=$B"
          echo 'TSK0050_STATE_REMOTE_READBACK=PASS'
