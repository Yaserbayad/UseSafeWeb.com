name: Temporary - TSK-0360 RED contract

on:
  push:
    branches:
      - feature/tsk-0360-ios-profile-generator-20260903
    paths:
      - 'website/**'
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Prove TSK-0360 iPhone profile generator is RED before implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          cd website
          npm ci --no-fund --no-audit
          node --test tests/contract/tsk0360.test.mjs