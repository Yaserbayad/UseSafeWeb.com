name: Temporary - Accept TSK-0237 vendor monitoring design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  accept-tsk0237:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify TSK-0237 before state mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object TSK_0237_VENDOR_VERSION_PRICE_TERMS_COMPATIBILITY_MONITORING_TRIGGERS_2026-09-02.md)" = '4eae7703238a603885da93cf816e61b43726efe1'
          test "$(git hash-object Plans/Master/Tools/verify_tsk0237_vendor_monitoring_20260902.py)" = 'd5806fb8d2d50519b57d82abb605a8f8aa74feae'
          python3 Plans/Master/Tools/verify_tsk0237_vendor_monitoring_20260902.py
          python3 Plans/Master/Tools/validate_master_plan.py
      - name: Append TSK-0237 PASS
        shell: bash
        env:
          VERIFY_RUN_ID: '33662918882'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('CURRENT_STATE.md'); text=p.read_text(encoding='utf-8-sig')
          heading='## TSK-0237 current accepted stable state — 2026-09-02 — POST-CR-0010 / CURRENT-VENDOR-SOURCES'
          if heading in text: raise SystemExit('TSK-0237 section already exists')
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          lines=text.splitlines()
          for i,line in enumerate(lines):
              if line.startswith('**Updated:**'):
                  lines[i]=f'**Updated:** {now}'; break
          text='\n'.join(lines).rstrip()+'\n'
          section=f'''\n{heading}\n\n`TSK-0237 — Define Firebase/Auth and AdGuard API version, price, terms and compatibility monitoring triggers`: **PASS** under current `ACC-0237 / VER-0237 / EVD-0237`.\n\n- Current normalized WBS blob `eb35f3b10356396c5117e3f47d0b0378953e2157`: L5 / A4 / `AUTO_ALLOWED`; dependencies `TSK-0586; TSK-0539; TSK-0585` are current durable PASS.\n- Accepted artifact: `TSK_0237_VENDOR_VERSION_PRICE_TERMS_COMPATIBILITY_MONITORING_TRIGGERS_2026-09-02.md`, version `1.0.0`, blob `4eae7703238a603885da93cf816e61b43726efe1`, publication commit `f1b3d482a3285b8606b0adad84a3ba8e1c635752`.\n- Corrected deterministic verifier: `Plans/Master/Tools/verify_tsk0237_vendor_monitoring_20260902.py`, blob `d5806fb8d2d50519b57d82abb605a8f8aa74feae`. Initial read-only run `33662826121` failed only on an overcounted Firebase-prefix assertion (expected 7; complete matrix contains 6 Firebase + 2 Google OAuth + 7 AdGuard = 15 triggers); no acceptance failure or state mutation occurred.\n- Independent GitHub Actions verification run `{os.environ['VERIFY_RUN_ID']} / 1`: **SUCCESS**; verifies owners/cadence/signals/thresholds, official source baseline, quota/price/session/provider/OAuth/scope/terms/subprocessor/OpenAPI/release/default/security/license/platform triggers, safe responses, migration/retest paths, and gate/state reopening rules. Full modular validator PASS.\n- Current official-source baseline was refreshed on 2026-09-02 from Firebase Authentication/pricing/limits/session/terms, Google Cloud subprocessors, Google Identity/OAuth, and AdGuard Home OpenAPI/changelog/releases/security sources cited in the artifact.\n- CR-0009/DEC-0056 preserved: terms/subprocessor/license changes are detected and routed, but no AI legal interpretation, legal evidence, legal approval, transfer conclusion or legal PASS is inferred.\n- **Non-inference:** no vendor upgrade, plan upgrade, spend, production action, L6 implementation, LG-07 PASS, or HUMAN_ONLY resource approval is inferred.\n\n### Queue status after TSK-0237 acceptance\n\nRecompute the complete residual L5 frontier. Stop only if every remaining eligible item is legal-external, dependency-blocked, or HUMAN_ONLY/HUMAN_APPROVAL_REQUIRED.\n'''
          p.write_text(text+section,encoding='utf-8')
          PY
          git diff --check
          test "$(git status --porcelain | sed 's/^...//' | sort)" = 'CURRENT_STATE.md'
      - name: Persist and read back
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0237 vendor monitoring design'
          C="$(git rev-parse HEAD)"; B="$(git rev-parse "$C:CURRENT_STATE.md")"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$C"
          test "$(git rev-parse "origin/main:CURRENT_STATE.md")" = "$B"
          git show origin/main:CURRENT_STATE.md | grep -Fq '## TSK-0237 current accepted stable state — 2026-09-02 — POST-CR-0010 / CURRENT-VENDOR-SOURCES'
          echo "TSK0237_STATE_COMMIT=$C"
          echo "TSK0237_STATE_BLOB=$B"
          echo 'TSK0237_STATE_REMOTE_READBACK=PASS'
