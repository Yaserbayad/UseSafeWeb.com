name: Temporary - TSK-0360 source acceptance

on:
  push:
    branches:
      - feature/tsk-0360-ios-profile-generator-20260903
    paths:
      - 'website/**'
      - 'Plans/Master/**'
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  source-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Verify canonical planning authority and clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --check
      - name: Locked install and contract tests
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm ci --no-fund --no-audit
          npm run test:contract
      - name: Lint, typecheck, and production build
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm run lint
          npm run typecheck
          NEXT_TELEMETRY_DISABLED=1 npm run build
      - name: Dependency and version verification
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          node -e 'const p=require("./package.json"); if (p.dependencies.next !== "16.3.3" || p.dependencies.react !== "19.2.8" || p.dependencies["react-dom"] !== "19.2.8") process.exit(1)'
      - name: Verify source-only boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          printf 'TSK0360_SOURCE_ACCEPTANCE=PASS\n'