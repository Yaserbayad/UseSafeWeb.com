name: Temporary - Post-TSK-0358 L6 frontier

on:
  push:
    branches:
      - diag/post-tsk0358-l6-frontier-20260902b
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  inspect-frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Derive evidence-backed L6 candidates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 'b4da890e8028a6613b31363daa04b58c6f09ec0f'
          test "$(git merge-base HEAD origin/main)" = 'b4da890e8028a6613b31363daa04b58c6f09ec0f'
          test "$(git diff --name-only origin/main...HEAD)" = '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'
          python3 Plans/Master/Tools/validate_master_plan.py
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path

          root = Path('.')
          state = (root / 'CURRENT_STATE.md').read_text(encoding='utf-8')
          with (root / 'Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          by_id = {r['Task_ID']: r for r in rows}
          index = {r['Task_ID']: i for i, r in enumerate(rows)}

          heading_pass = set(re.findall(r'^## (TSK-\d{4}) current accepted stable state', state, flags=re.M))
          explicit_pass = set(re.findall(r'`(TSK-\d{4})[^`]*`: \*\*PASS\*\*', state))
          current_pass = heading_pass | explicit_pass
          wbs_pass = {r['Task_ID'] for r in rows if r.get('Execution_State') == 'PASS'}

          print('CURRENT_PASS_COUNT=' + str(len(current_pass)))
          print('LG07_PASS=' + ('YES' if re.search(r'LG-07[^\n]{0,300}\*\*PASS\*\*|LG-07[^\n]{0,300}: PASS', state) else 'NO_DIRECT_MARKER'))
          print('TSK0455_HOST_FENCE=' + ('YES' if 'TSK-0455 remains non-PASS and non-executable until the owner-provided fresh Ubuntu 24.04 target host' in state else 'NO'))

          def deps_of(row):
              return sorted(set(re.findall(r'TSK-\d{4}', row.get('Dependencies', ''))))

          def dep_status(dep):
              if dep in current_pass:
                  return 'PASS_CURRENT'
              if dep in wbs_pass:
                  return 'PASS_WBS_HISTORICAL'
              d = by_id.get(dep)
              if d and d.get('Plan_Status') == 'NOT_APPLICABLE' and d.get('Execution_State') == 'PASS':
                  return 'NOT_APPLICABLE_PASS'
              return 'UNPROVEN'

          successors = []
          for r in rows:
              if r['Task_ID'] in current_pass:
                  continue
              if 'TSK-0358' in deps_of(r):
                  successors.append(r)
          for r in successors:
              ds = deps_of(r)
              print('DIRECT_SUCCESSOR=' + json.dumps({
                  'Task_ID': r['Task_ID'], 'Title': r['Title'], 'Lifecycle_Stage': r['Lifecycle_Stage'],
                  'Priority': r['Priority'], 'Action_Authority': r['Action_Authority'],
                  'Execution_State': r['Execution_State'], 'Dependencies': ds,
                  'Dependency_Status': {d: dep_status(d) for d in ds},
                  'Required_Tools_or_Access': r['Required_Tools_or_Access'], 'WBS_Index': index[r['Task_ID']],
              }, ensure_ascii=False, sort_keys=True))

          candidates = []
          for r in rows:
              if r.get('Lifecycle_Stage') != 'L6' or r.get('Action_Authority') != 'AUTO_ALLOWED':
                  continue
              if r['Task_ID'] in current_pass or r.get('Plan_Status') == 'NOT_APPLICABLE':
                  continue
              if r.get('Priority') not in {'CRITICAL', 'HIGH'}:
                  continue
              ds = deps_of(r)
              statuses = {d: dep_status(d) for d in ds}
              if any(v == 'UNPROVEN' for v in statuses.values()):
                  continue
              access = r.get('Required_Tools_or_Access', '')
              fenced = r['Task_ID'] in {'TSK-0455','TSK-0456'} or 'fresh Ubuntu 24.04' in access
              candidates.append((0 if r['Priority']=='CRITICAL' else 1, index[r['Task_ID']], r, statuses, fenced))
          candidates.sort(key=lambda x: (x[0], x[1]))
          for _, _, r, statuses, fenced in candidates[:30]:
              print('ELIGIBLE_BY_DEPS=' + json.dumps({
                  'Task_ID': r['Task_ID'], 'Title': r['Title'], 'Priority': r['Priority'],
                  'Action_Authority': r['Action_Authority'], 'Execution_State': r['Execution_State'],
                  'Dependencies': deps_of(r), 'Dependency_Status': statuses,
                  'Required_Tools_or_Access': r['Required_Tools_or_Access'],
                  'Preconditions': r['Preconditions'], 'Trigger': r['Trigger'],
                  'Access_Fenced': fenced, 'WBS_Index': index[r['Task_ID']],
                  'Acceptance_ID': r['Acceptance_ID'], 'Verification_ID': r['Verification_ID'],
                  'Risk_Reference': r['Risk_Reference'], 'Interface_Reference': r['Interface_Reference'],
              }, ensure_ascii=False, sort_keys=True))
          print('FRONTIER_DIAGNOSTIC=PASS')
          PY
