name: Temporary - Inspect Next.js 16.3.3 scaffold pins for TSK-0361

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  inspect-next-scaffold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: /dev/null
      - name: Generate isolated official scaffold and emit pins
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          rm -rf /tmp/usesafeweb-next-scaffold
          npx --yes create-next-app@16.3.3 /tmp/usesafeweb-next-scaffold --typescript --eslint --app --src-dir --no-tailwind --use-npm --import-alias '@/*' --yes
          echo '--- package.json ---'
          cat /tmp/usesafeweb-next-scaffold/package.json
          echo '--- lock root package ---'
          node - <<'NODE'
          const lock=require('/tmp/usesafeweb-next-scaffold/package-lock.json');
          console.log(JSON.stringify(lock.packages[''], null, 2));
          NODE
          echo '--- build ---'
          npm --prefix /tmp/usesafeweb-next-scaffold run build
