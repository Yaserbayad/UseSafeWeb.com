name: Temporary - Inspect TSK-0360 contract

on:
  push:
    branches:
      - diag/post-tsk0358-l6-frontier-20260902b
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: read

jobs:
  inspect-tsk0360:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Print exact TSK-0360 authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 'b4da890e8028a6613b31363daa04b58c6f09ec0f'
          test "$(git merge-base HEAD origin/main)" = 'b4da890e8028a6613b31363daa04b58c6f09ec0f'
          test "$(git diff --name-only origin/main...HEAD)" = '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'
          python3 Plans/Master/Tools/validate_master_plan.py
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path
          root = Path('.')
          with (root/'Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          row = next((r for r in rows if r.get('Task_ID') == 'TSK-0360'), None)
          if row is None: raise SystemExit('TSK-0360 row missing')
          print('TSK0360_ROW=' + json.dumps(row, ensure_ascii=False, sort_keys=True))
          state = (root/'CURRENT_STATE.md').read_text(encoding='utf-8')
          for dep in sorted(set(re.findall(r'TSK-\d{4}', row.get('Dependencies','')))):
              print('DEP_' + dep.replace('-', '') + '_PASS=' + ('YES' if f'## {dep} current accepted stable state' in state else 'NO'))
          needles = ('TSK-0360','ACC-0360','VER-0360','EVD-0360','INT-0011','INT-0012','RSK-0045','REQ-0036','REQ-0037','CON-0010','CON-0011')
          for path in sorted((root/'Plans/Master').rglob('*')):
              if not path.is_file() or path.suffix.lower() not in {'.md','.yaml','.yml','.csv','.json','.txt'}:
                  continue
              try: lines = path.read_text(encoding='utf-8').splitlines()
              except Exception: continue
              for i,line in enumerate(lines,1):
                  if any(n in line for n in needles):
                      print(f'AUTH_MATCH={path}:{i}:{line}')
          print('TSK0360_CONTRACT_DIAG=PASS')
          PY
