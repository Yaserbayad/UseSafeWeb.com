name: TSK-0539 privacy-safe observability acceptance carrier

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tsk0539-observability-acceptance
  cancel-in-progress: false

jobs:
  verify-accept-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Independently verify TSK-0539
        run: python3 Plans/Master/Tools/verify_tsk0539_privacy_safe_observability_20260902.py --verify

      - name: Record PASS, restore carrier, and publish safely
        env:
          SOURCE_SHA: ${{ github.sha }}
          CARRIER_BASE_SHA: 422d0f5ce1e09d998ec73556392e551a52c8273a
        run: |
          python3 Plans/Master/Tools/verify_tsk0539_privacy_safe_observability_20260902.py --record-state
          git diff --check
          grep -F '## TSK-0539 current accepted stable state — 2026-09-02 — POST-CR-0009' CURRENT_STATE.md
          grep -F 'all 14 current SLI rows; all TM-01..TM-30 threat rows' CURRENT_STATE.md
          grep -F 'legal/compliance conclusions remain owner-external/not AI-verified' CURRENT_STATE.md

          git show "${CARRIER_BASE_SHA}:.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml" > .github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml
          rm -f TSK_0539_VERIFIER_TRIGGER_2026-09-02.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md .github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml
          git add -u TSK_0539_VERIFIER_TRIGGER_2026-09-02.txt || true
          git commit -m 'state: accept TSK-0539 privacy-safe observability design'

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${SOURCE_SHA}" ]; then
            echo 'Main changed after TSK-0539 checkout; refusing ambiguous state publication.'
            exit 1
          fi
          git push origin HEAD:main

      - name: Exact remote read-back
        run: |
          git fetch origin main
          git show origin/main:CURRENT_STATE.md | grep -F '## TSK-0539 current accepted stable state — 2026-09-02 — POST-CR-0009'
          git show origin/main:CURRENT_STATE.md | grep -F 'all 14 current SLI rows; all TM-01..TM-30 threat rows'
          git show origin/main:TSK_0539_PRIVACY_SAFE_LOGS_METRICS_TRACES_DASHBOARDS_ALERTS_2026-09-02.md | grep -F '## 15. Acceptance disposition'
          test "$(git show origin/main:.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml | git hash-object --stdin)" = "5b8528ff98bfc82eeede4675ab6253c09e220a5b"
          if git cat-file -e origin/main:TSK_0539_VERIFIER_TRIGGER_2026-09-02.txt 2>/dev/null; then exit 1; fi
          echo "REMOTE_HEAD=$(git rev-parse origin/main)"
