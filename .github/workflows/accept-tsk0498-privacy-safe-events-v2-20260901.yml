name: Temporary - Verify TSK-0516 master acceptance plan

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-tsk0516:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify TSK-0516 plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object TSK_0516_MASTER_VERIFICATION_ACCEPTANCE_TEST_PLAN_2026-09-02.md)" = '68e1a104339d402550b178506f82a111b3155118'
          test "$(git hash-object Plans/Master/Tools/verify_tsk0516_master_verification_plan_20260902.py)" = 'fe0708d48a6795c74756ab4ffaa074bdb6c1101b'
          python3 Plans/Master/Tools/verify_tsk0516_master_verification_plan_20260902.py
          python3 Plans/Master/Tools/validate_master_plan.py
