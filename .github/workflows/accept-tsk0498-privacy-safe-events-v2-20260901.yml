name: Temporary - Accept merged TSK-0361 public website

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/accept-tsk0498-privacy-safe-events-v2-20260901.yml'

permissions:
  contents: write

jobs:
  accept-tsk0361-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Verify authority, eligibility, merged source, and production build
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor c4a0e041fbb285f09fbbd257d58f9b03669df039 HEAD
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object website/package-lock.json)" = '14f9a62607489f965b96d98cdf0d825a363cd8bc'
          test "$(git hash-object website/tests/contract/tsk0361.test.mjs)" = '31116c434bda726cf10586070c28efe23bad2053'
          test "$(git hash-object website/tests/performance/tsk0361-performance.mjs)" = '47b3bdf45c45529a516abd3713928ae98de1a70f'
          python3 - <<'PY'
          import csv,re
          from pathlib import Path
          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          r=next(x for x in rows if x['Task_ID']=='TSK-0361')
          assert r['Lifecycle_Stage']=='L6'
          assert {x.strip() for x in r['Dependencies'].split(';') if x.strip()}=={'TSK-0354','TSK-0308','TSK-0307'}
          assert r['Action_Authority']=='AUTO_ALLOWED' and r['AI_Capability_A0_A4']=='A3'
          assert r['Acceptance_ID']=='ACC-0361' and r['Verification_ID']=='VER-0361' and r['Evidence_ID']=='EVD-0361'
          acc=r['Acceptance_Criteria'].lower()
          for term in ['typescript','next.js','mobile','desktop','english','turkish','arabic','rtl','wcag 2.2 aa','performance','security','seo','no-premature-claims','no unnecessary local database']:
              assert term in acc, term
          state=Path('CURRENT_STATE.md').read_text(encoding='utf-8-sig')
          for task in ('TSK-0354','TSK-0308','TSK-0307'):
              starts=[m.start() for m in re.finditer(rf'^##+\s+{re.escape(task)}\s+current accepted stable state[^\n]*$',state,re.M|re.I)]
              assert starts, f'{task} current accepted section missing'
              s=max(starts); e=state.find('\n## ',s+3); e=len(state) if e<0 else e
              assert '**PASS**' in state[s:e], f'{task} current section is not PASS'
          assert '`LG-07 — Architecture, Security, Privacy and Delivery Readiness`: **PASS**' in state
          assert '## TSK-0361 current accepted stable state' not in state
          PY
          node --test website/tests/contract/tsk0361.test.mjs
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          cd website
          npm ci --no-fund --no-audit
          npm run lint
          npm run typecheck
          NEXT_TELEMETRY_DISABLED=1 npm run build
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          test "$(node -p "require('./node_modules/next/package.json').version")" = '16.3.3'
          test "$(node -p "require('./node_modules/react/package.json').version")" = '19.2.8'
          test "$(node -p "require('./node_modules/react-dom/package.json').version")" = '19.2.8'
          test "$(node -p "require('./node_modules/eslint/package.json').version")" = '9.39.5'
          cd ..
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Install exact ephemeral browser acceptance tooling
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm install --no-save --no-package-lock --no-fund --no-audit playwright@1.62.1 axe-core@4.13.0
          test "$(node -p "require('./node_modules/playwright/package.json').version")" = '1.62.1'
          test "$(node -p "require('./node_modules/axe-core/package.json').version")" = '4.13.0'
          npx playwright install --with-deps chromium
      - name: Verify merged main in a real browser and synthetic performance lab
        shell: bash
        run: |
          set -euo pipefail
          cd website
          NEXT_TELEMETRY_DISABLED=1 npm start -- -p 3000 > /tmp/tsk0361-main.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/tsk0361-main.log' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/en-GB >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/en-GB >/dev/null
          BASE_URL=http://127.0.0.1:3000 node tests/browser/tsk0361-browser.mjs | tee /tmp/tsk0361-browser.out
          BASE_URL=http://127.0.0.1:3000 node tests/performance/tsk0361-performance.mjs | tee /tmp/tsk0361-perf.out
          grep -Fxq 'TSK0361_BROWSER_ACCEPTANCE=PASS' /tmp/tsk0361-browser.out
          grep -Fxq 'TSK0361_PERFORMANCE_ACCEPTANCE=PASS' /tmp/tsk0361-perf.out
          for key in TSK0361_PERF_BROWSER TSK0361_PERF_SAMPLE_COUNT TSK0361_NAV_P95_MS TSK0361_NAV_P99_MS TSK0361_LCP_MAX_MS TSK0361_CLS_MAX TSK0361_INTERACTION_EVENT_UPPER_BOUND_MS; do
            value="$(grep -E "^${key}=" /tmp/tsk0361-perf.out | tail -n 1 | cut -d= -f2-)"
            test -n "$value"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done
          cd ..
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Append TSK-0361 PASS to canonical runtime state
        shell: bash
        env:
          MERGE_SHA: c4a0e041fbb285f09fbbd257d58f9b03669df039
          BRANCH_ACCEPT_RUN: '33685314060'
          BRANCH_ACCEPT_JOB: '100431277608'
          ORIGINAL_FAIL_RUN: '33676915612'
          ORIGINAL_FAIL_JOB: '100403845229'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('CURRENT_STATE.md')
          text=p.read_text(encoding='utf-8-sig')
          heading='## TSK-0361 current accepted stable state — 2026-09-02 — POST-LG-07 PUBLIC WEBSITE IMPLEMENTATION'
          if heading in text:
              raise SystemExit('TSK-0361 current PASS section already exists')
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          lines=text.splitlines()
          for i,line in enumerate(lines):
              if line.startswith('**Updated:**'):
                  lines[i]=f'**Updated:** {now}'
                  break
          text='\n'.join(lines).rstrip()+'\n'
          section=f'''
          {heading}

          `TSK-0361 — Implement the public/customer website from approved IA, brand, content, accessibility, performance, SEO, privacy, and conversion requirements`: **PASS** under current `ACC-0361 / VER-0361 / EVD-0361`.

          - Current normalized WBS blob `eb35f3b10356396c5117e3f47d0b0378953e2157`: L6 / HIGH / A3 / `AUTO_ALLOWED`; hard dependencies `TSK-0354`, `TSK-0308`, and `TSK-0307` are current durable PASS and LG-07 is current durable PASS.
          - Implementation merged through PR `#58`; squash merge commit `{os.environ['MERGE_SHA']}`. The canonical `/website` baseline is one TypeScript + Next.js application using Next.js `16.3.3`, React/ReactDOM `19.2.8`, and ESLint `9.39.5` with deterministic lockfile `14f9a62607489f965b96d98cdf0d825a363cd8bc`.
          - Original real-browser diagnostic run/job `{os.environ['ORIGINAL_FAIL_RUN']} / {os.environ['ORIGINAL_FAIL_JOB']}` failed on two exact defects: normal routes lacked `Strict-Transport-Security`, and missing/invalid `platform` setup URLs returned HTTP 200 instead of 404. The correction adds global HSTS `max-age=63072000` without includeSubDomains/preload expansion and fails closed through App Router 404 handling unless `platform` is exactly `android` or `iphone`.
          - Final pre-merge branch acceptance run/job `{os.environ['BRANCH_ACCEPT_RUN']} / {os.environ['BRANCH_ACCEPT_JOB']}`: **SUCCESS**, including contract, locked install, lint, typecheck, production build, zero-vulnerability full/production audits, exact browser-tool pins, real-browser functional/negative/accessibility/security/SEO/locale/RTL acceptance, and synthetic performance.
          - Independent merged-`main` verification phase in Actions run `{os.environ['GITHUB_RUN_ID']}` passed before this state mutation: contract tests 9/9; canonical repository/master-plan validation; locked install; lint; typecheck; production build; full and production dependency audits with 0 vulnerabilities; Playwright `1.62.1` + axe-core `4.13.0`; `TSK0361_BROWSER_ACCEPTANCE=PASS`; `TSK0361_PERFORMANCE_ACCEPTANCE=PASS`.
          - Merged-main synthetic lab performance: browser `{os.environ['TSK0361_PERF_BROWSER']}`; sample count `{os.environ['TSK0361_PERF_SAMPLE_COUNT']}`; navigation p95 `{os.environ['TSK0361_NAV_P95_MS']} ms`; p99 `{os.environ['TSK0361_NAV_P99_MS']} ms`; max LCP `{os.environ['TSK0361_LCP_MAX_MS']} ms`; max CLS `{os.environ['TSK0361_CLS_MAX']}`; representative interaction event upper bound `{os.environ['TSK0361_INTERACTION_EVENT_UPPER_BOUND_MS']} ms`. This is synthetic lab evidence only; no field-p75, 99.9% operational-SLO, or live-load-envelope claim is inferred.
          - Acceptance coverage includes mobile/desktop critical routes; English, Turkish, and Arabic with RTL; keyboard behavior; automated WCAG 2.2 AA checks on representative pages; truthful security/SEO/noindex boundaries; no-premature-claims checks; and strict invalid-state 404 behavior. The implementation consumes the approved shared design system and externalized versioned content. No separate CMS product is selected by current architecture, so no CMS vendor integration is fabricated; no unnecessary local database, analytics transport, mandatory login, browsing/query/activity history, or browser admin secret is introduced.
          - **Non-inference:** no target-host deployment, production activation, public launch, participant processing, payment activation, optional-account/dashboard completion, legal/compliance PASS, or real-world availability/SLO evidence is inferred.

          ### Queue status after TSK-0361 acceptance

          Recompute the complete current L6 executable frontier from canonical WBS/graph, current runtime PASS evidence, gates, risks, interfaces, Action Authority and unresolved material-action fences. Do not infer the next task from historical order alone.
          '''
          section='\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines()).strip()+'\n'
          p.write_text(text+'\n'+section,encoding='utf-8')
          PY
          git diff --check
          test "$(git status --porcelain | sed 's/^...//' | sort)" = 'CURRENT_STATE.md'
      - name: Persist TSK-0361 state and verify remote read-back
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0361 public website implementation'
          C="$(git rev-parse HEAD)"
          B="$(git rev-parse "$C:CURRENT_STATE.md")"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$C"
          test "$(git rev-parse "origin/main:CURRENT_STATE.md")" = "$B"
          git show origin/main:CURRENT_STATE.md | grep -Fq '## TSK-0361 current accepted stable state — 2026-09-02 — POST-LG-07 PUBLIC WEBSITE IMPLEMENTATION'
          echo "TSK0361_STATE_COMMIT=$C"
          echo "TSK0361_STATE_BLOB=$B"
          echo 'TSK0361_STATE_REMOTE_READBACK=PASS'
