name: Verify TSK-0324 UI component rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0324.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify TSK-0324 acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 - <<'PY'
          import csv, json, pathlib, re, subprocess

          def blob(path):
              return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip()

          expected={
            'prototype/TSK-0324/UI_COMPONENT_RULES.md':'0b7012a12070f7eccf45a1bbb2f453fde8507ff6',
            'prototype/TSK-0324/COMPONENT_CONTRACT.json':'dc1f767025c2b016274d247d997411128105c5e4',
            'brand/system/TSK-0300/tokens.css':'cd7d9a7cd5109e1ff0baa76532495dfd7a27a70f',
            'brand/system/TSK-0300/components.css':'831e92a74b6dda04252d93242cb33bd491a02381',
            'brand/guidelines/TSK-0297/README.md':'89e915678e85f7f301e8fa4b05c335cd803dd9d4',
            'TSK_0320_PROTECTION_STATE_MODEL_AND_COPY_RULES_2026-08-28.md':'1146f7622f434590dde1253d11f14fb6a87e19de',
            'content/TSK-0322/PRODUCT_VOICE_CLAIMS_TERMINOLOGY.md':'d12c1e707f0390915002b27bf3a5073d0135d466',
            'prototype/TSK-0309/BASELINE.md':'76bb848ebdf6a2aee4dd84bc18e8af5ba8a99dbc',
            'Plans/Master/WBS/master-wbs.csv':'f23b4f017d1baf73258fa30ecd71549bbfe1b815',
          }
          for path, sha in expected.items():
              actual=blob(path)
              assert actual==sha, (path, sha, actual)

          with pathlib.Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          by={r['Task_ID']:r for r in rows}
          row=by['TSK-0324']; dep=by['TSK-0322']
          assert row['Lifecycle_Stage']=='L4'
          assert row['Plan_Status']=='PLANNED'
          assert row['Priority']=='MEDIUM'
          assert row['Dependencies']=='TSK-0322'
          assert row['Acceptance_ID']=='ACC-0324'
          assert row['Verification_ID']=='VER-0324'
          assert row['Evidence_ID']=='EVD-0324'
          assert row['AI_Capability_A0_A4']=='A3'
          assert row['Action_Authority']=='AUTO_ALLOWED'
          for phrase in ['typography','spacing','contrast','focus','controls','feedback','four Protection Map states','mobile/desktop behavior','logo/domain use','accessible component specifications']:
              assert phrase in row['Acceptance_Criteria'], phrase

          state=pathlib.Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          assert re.search(r'## TSK-0322 product voice / claims / terminology', state)
          assert re.search(r'`TSK-0322[^\n]*\*\*PASS\*\*', state)
          assert 'DEC-0052 / CR-0005' in state

          rules=pathlib.Path('prototype/TSK-0324/UI_COMPONENT_RULES.md').read_text(encoding='utf-8')
          contract=json.loads(pathlib.Path('prototype/TSK-0324/COMPONENT_CONTRACT.json').read_text(encoding='utf-8'))
          tokens=pathlib.Path('brand/system/TSK-0300/tokens.css').read_text(encoding='utf-8')
          components=pathlib.Path('brand/system/TSK-0300/components.css').read_text(encoding='utf-8')

          assert contract['task_id']=='TSK-0324' and contract['version']=='1.0.0'
          assert contract['sequencing']=='DEC-0052/CR-0005'
          assert contract['human_validation_claimed'] is False
          assert contract['shared_sources']['tokens']['sole_mutable_token_source'] is True
          for _,meta in contract['shared_sources'].items():
              assert blob(meta['path'])==meta['blob'], meta['path']

          for token in contract['typography_tokens']+contract['spacing_tokens']:
              assert token+':' in tokens, token
          for token in ['--sw-focus-width','--sw-color-focus','--sw-page-max','--sw-copy-max','--sw-logo-height','--sw-radius-sm','--sw-radius-md']:
              assert token+':' in tokens, token
          for css in ['a:focus-visible','button:focus-visible','.sw-button','.sw-button--secondary','.sw-button--quiet','.sw-card','.sw-panel','.sw-status','.sw-callout','[dir="rtl"]']:
              assert css in components, css

          def rgb(h):
              h=h.lstrip('#'); return tuple(int(h[i:i+2],16)/255 for i in (0,2,4))
          def lin(c): return c/12.92 if c<=0.04045 else ((c+0.055)/1.055)**2.4
          def lum(h):
              r,g,b=map(lin,rgb(h)); return 0.2126*r+0.7152*g+0.0722*b
          def ratio(a,b):
              x,y=sorted((lum(a),lum(b)),reverse=True); return (x+0.05)/(y+0.05)
          computed={}
          for pair in contract['contrast']['accepted_pairs']:
              val=ratio(pair['foreground'],pair['background']); computed[f"{pair['foreground']}/{pair['background']}"]=val
              assert val >= pair['minimum'], (pair,val)
          bad=contract['contrast']['prohibited_critical_pair']
          bad_ratio=ratio(bad['foreground'],bad['background'])
          assert bad_ratio < 3.0, bad_ratio
          print('CONTRAST_RATIOS='+','.join(f'{k}={v:.2f}' for k,v in computed.items())+f',prohibited={bad_ratio:.2f}')

          states=contract['protection_map']['states']
          expected_labels=['Verified','You confirmed this is set up','Action needed','Not covered','Status uncertain','Removed']
          assert [s['label'] for s in states]==expected_labels
          assert contract['protection_map']['historical_acc_minimum_states']==4
          assert contract['protection_map']['current_state_count']==6
          assert contract['protection_map']['historical_minimum_satisfied'] is True
          assert contract['protection_map']['overall_safety_score_allowed'] is False
          assert contract['protection_map']['color_only_state_meaning_allowed'] is False
          for label in expected_labels: assert label in rules

          assert contract['responsive_test_widths_css_px']==[320,768,1024,1440]
          assert contract['rtl']['safeweb_brand_ltr_invariant'] is True
          assert contract['rtl']['language_availability_implies_market_activation'] is False
          assert contract['identity']['visible_brand']=='SafeWeb'
          assert contract['identity']['domain_identifier']=='UseSafeWeb.com'
          assert len(contract['components'])==13
          assert len(contract['feedback_states'])==7
          assert contract['controls']['pointer_target_wcag22_aa_min_css_px']==24
          assert contract['controls']['removal_confirmation_modal_required_by_default'] is False
          assert contract['wcag_source_review']['focus_appearance_level']=='AAA'

          must_rules=[
            'sole mutable implementation-token source','one `h1` per page/screen','320 px','768 px','1024 px','1440 px',
            'maroon on deep green','Dark-brand fields are display/brand fields','24×24 CSS-pixel','all six',
            'SafeWeb','UseSafeWeb.com','visible `:focus-visible` indicator','aria-busy="true"','200% text resize',
            'does not self-certify the HUMAN_ONLY TSK-0308'
          ]
          for phrase in must_rules: assert phrase in rules, phrase

          # No local implementation fork: TSK-0324 contains only its rules + machine projection.
          files=sorted(str(p) for p in pathlib.Path('prototype/TSK-0324').iterdir() if p.is_file())
          assert files==['prototype/TSK-0324/COMPONENT_CONTRACT.json','prototype/TSK-0324/UI_COMPONENT_RULES.md'], files
          assert not any(p.suffix in {'.css','.svg','.woff','.woff2','.ttf','.otf'} for p in pathlib.Path('prototype/TSK-0324').iterdir())

          print('TSK0324_WBS_AUTHORITY=PASS')
          print('TSK0324_DEPENDENCY_TSK0322=PASS')
          print('TSK0324_SOURCE_BLOBS=PASS')
          print('TSK0324_TYPOGRAPHY_SPACING=PASS')
          print('TSK0324_CONTRAST_FOCUS=PASS')
          print('TSK0324_CONTROLS_FEEDBACK=PASS')
          print('TSK0324_PROTECTION_STATES=6/6_PASS')
          print('TSK0324_RESPONSIVE_RTL_IDENTITY=PASS')
          print('TSK0324_ACCESSIBLE_COMPONENT_SPECS=13/13_PASS')
          print('TSK0324_NO_DESIGN_SYSTEM_FORK=PASS')
          print('TSK0324_ACC_VER_EVD=PASS')
          PY
      - name: Repository cleanliness
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
