name: Temporary TSK-0491 supply-chain scan

on:
  push:
    branches:
      - feature/tsk-0491-dependency-inventory-sbom-20260903

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Enumerate direct CI and ephemeral tooling inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          workflows = sorted(Path('.github/workflows').glob('*.y*ml'))
          actions = set()
          runners = set()
          install_lines = []
          npx_lines = []
          expression_prefix = '$' + '{{'
          for path in workflows:
              if path.name.startswith('tmp-tsk0491-supply-chain-scan-'):
                  continue
              text = path.read_text(encoding='utf-8')
              actions.update(x for x in re.findall(r'^\s*-?\s*uses:\s*([^\s#]+)', text, re.M) if not x.startswith('./'))
              runners.update(x.strip("'\"") for x in re.findall(r'^\s*runs-on:\s*([^\s#]+)', text, re.M) if expression_prefix not in x)
              for line in text.splitlines():
                  s = line.strip()
                  if re.search(r'\bnpm\s+(?:install|i)\b', s):
                      install_lines.append(f'{path.name}: {s}')
                  if re.search(r'\bnpx\b', s):
                      npx_lines.append(f'{path.name}: {s}')
          print('TSK0491_GITHUB_ACTIONS')
          for item in sorted(actions): print(item)
          print('TSK0491_RUNNER_IMAGES')
          for item in sorted(runners): print(item)
          print('TSK0491_NPM_INSTALL_LINES')
          for item in install_lines: print(item)
          print('TSK0491_NPX_LINES')
          for item in npx_lines: print(item)
          PY
