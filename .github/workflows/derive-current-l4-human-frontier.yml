name: Derive current L4 human frontier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/derive-current-l4-human-frontier.yml'

permissions:
  contents: read

jobs:
  derive:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Derive dependency-satisfied human-controlled L4 tasks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,re
          from pathlib import Path
          state=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          pass_ids=set(re.findall(r'`(TSK-\d{4})[^`]*`:\s*\*\*PASS\b',state))
          for block in re.split(r'(?=### TSK-\d{4} accepted stable state)',state):
              m=re.match(r'### (TSK-\d{4}) accepted stable state',block)
              if m and '**PASS' in block[:1800]: pass_ids.add(m.group(1))
          with open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          pri={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          out=[]
          for idx,r in enumerate(rows):
              if r.get('Lifecycle_Stage')!='L4': continue
              if r.get('Plan_Status') not in {'PLANNED','IN_PROGRESS','ACTIVE',''}: continue
              if r.get('Action_Authority') not in {'HUMAN_ONLY','HUMAN_APPROVAL_REQUIRED'}: continue
              if r['Task_ID'] in pass_ids: continue
              deps=[x.strip() for x in r.get('Dependencies','').split(';') if x.strip()]
              missing=[x for x in deps if x not in pass_ids]
              if not missing:
                  out.append((pri.get(r.get('Priority',''),9),idx,r))
          for _,idx,r in sorted(out):
              print('HUMAN_CANDIDATE order=%s id=%s priority=%s authority=%s state=%s deps=%s title=%s trigger=%s acc=%s' % (idx,r['Task_ID'],r.get('Priority'),r.get('Action_Authority'),r.get('Execution_State'),r.get('Dependencies'),r.get('Title'),r.get('Trigger'),r.get('Acceptance_Criteria')))
          print('HUMAN_CANDIDATE_COUNT',len(out))
          PY