name: Reconcile TSK-0299 PASS and queue

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-tsk0299-pass-20260829.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify TSK-0299 acceptance and derive queue
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "6a25d63af125116a80f96ac0f1548b1ddb452a34"
          test "$(git hash-object Plans/Master/MANIFEST.yaml)" = "acadf21483ee3fddd63ee57795126619f92a00f3"
          test "$(git hash-object CURRENT_STATE.md)" = "8389f7cad50db406948acc6b0ccf6ad775811ad0"
          test "$(git hash-object TSK_0299_PROVISIONAL_VERBAL_SYSTEM_2026-08-29.md)" = "a4ff2314ff02c407249e8b5d4d6b9600b89403b3"
          test "$(git hash-object TSK_0299_PROVISIONAL_VERBAL_SYSTEM_EVIDENCE_2026-08-29.md)" = "061bc40ebfa096ae4fc74b56b49a72248cd3b6c8"
          grep -Fq '**ACC-0299: PASS.**' TSK_0299_PROVISIONAL_VERBAL_SYSTEM_EVIDENCE_2026-08-29.md
          grep -Fq 'RSK-0002` remains OPEN' TSK_0299_PROVISIONAL_VERBAL_SYSTEM_2026-08-29.md
          grep -Fq 'representative-parent comprehension' TSK_0299_PROVISIONAL_VERBAL_SYSTEM_2026-08-29.md
          grep -Fq 'Legal completion remains unproven' TSK_0299_PROVISIONAL_VERBAL_SYSTEM_2026-08-29.md
          grep -Fq 'You confirmed this is set up' TSK_0299_PROVISIONAL_VERBAL_SYSTEM_2026-08-29.md
          grep -Fq 'Status uncertain' TSK_0299_PROVISIONAL_VERBAL_SYSTEM_2026-08-29.md
          grep -Fq 'Not covered' TSK_0299_PROVISIONAL_VERBAL_SYSTEM_2026-08-29.md
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import csv,re
          runtime=Path('CURRENT_STATE.md')
          text=runtime.read_text(encoding='utf-8')
          assert 'TSK-0299 accepted stable state' not in text
          passed=set()
          m=re.search(r'(?ms)^### PASS\s*$\n(.*?)(?=^### |^## )',text)
          if m:
              passed.update(re.findall(r'^- `?(TSK-\d{4})`?\b',m.group(1),flags=re.M))
          passed.update(re.findall(r'(?m)^### (TSK-\d{4}) accepted stable state\s*$',text))
          passed.update(re.findall(r'(?m)^`(TSK-\d{4})[^`\n]*`:\s*\*\*PASS\b',text))
          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          ids={r['Task_ID'] for r in rows}; passed &= ids
          assert len(passed)==72,(len(passed),sorted(passed))
          assert 'TSK-0298' in passed and 'TSK-0299' not in passed
          assert 'TSK-0187' not in passed and 'TSK-0146' not in passed
          passed.add('TSK-0299')
          candidates=[]
          for idx,r in enumerate(rows):
              if r['Lifecycle_Stage']!='L4' or r['Task_ID'] in passed: continue
              if (r['Plan_Status'] or '').upper() not in {'PLANNED','ACTIVE','IN_PROGRESS'}: continue
              deps={x.strip() for x in re.split(r'[;,]',r['Dependencies'] or '') if x.strip().startswith('TSK-')}
              if deps <= passed:
                  candidates.append((idx,r,deps))
          pri={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          candidates.sort(key=lambda item:(pri.get((item[1]['Priority'] or '').upper(),99), item[0], item[1]['Task_ID']))
          print('POST_TSK0299_PASS_COUNT='+str(len(passed)))
          print('CANDIDATE_COUNT='+str(len(candidates)))
          for _,r,deps in candidates:
              print('CANDIDATE|'+ '|'.join([r['Task_ID'],r['Priority'],r['Action_Authority'],','.join(sorted(deps)),r['Title']]))
          assert candidates,candidates
          selected=candidates[0][1]
          assert selected['Task_ID']=='TSK-0302',[(r['Task_ID'],r['Priority'],r['Action_Authority']) for _,r,_ in candidates]
          assert selected['Action_Authority']=='AUTO_ALLOWED'
          now=datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          text += '''\n\n### TSK-0299 accepted stable state\n\n`TSK-0299 — Define tone, voice, terminology, trust language, protection-state language, and communication examples`: **PASS for provisional internal L4 verbal-system acceptance under DEC-0051/CR-0004**. Artifact `TSK_0299_PROVISIONAL_VERBAL_SYSTEM_2026-08-29.md`, blob `a4ff2314ff02c407249e8b5d4d6b9600b89403b3`, publication commit `5f9cd0f2521fb81ba5b3692e110c9c1b197b5804`; independent acceptance evidence `TSK_0299_PROVISIONAL_VERBAL_SYSTEM_EVIDENCE_2026-08-29.md`, blob `061bc40ebfa096ae4fc74b56b49a72248cd3b6c8`, publication commit `259dcd09eaac755c915b46d9db86a28b262fe824`.\n\nACC-0299 is satisfied: the system is parent-facing, plain-language, child-aware, non-alarmist and non-technical by default; it preserves all TSK-0320 evidence-state semantics; approved, conditional and prohibited claims are explicit; non-surveillance/accountless trust language is bounded; CTA/terminology patterns are reusable across public/setup/help surfaces; localization semantics preserve evidence strength across en-GB and provisional tr-TR/ar; representative-parent comprehension and legal completion remain explicitly unproven.\n\nThis PASS does not establish real-parent comprehension/preference/trust, legal completion, native-speaker publication readiness, implementation/build, LG-03/LG-04/LG-05/LG-06 PASS, participant processing, publication, payment, market activation or launch. `RSK-0002` remains OPEN.\n\n### Post-TSK-0299 L4 queue\n\nFresh dependency derivation with 73 durable PASS task IDs selects `TSK-0302 — Develop and evaluate a small set of coherent visual identity directions` as the next dependency-satisfied L4 task. It is MEDIUM / AUTO_ALLOWED and depends on TSK-0298, now PASS. `TSK-0301` remains HUMAN_ONLY and is not eligible until both TSK-0302 and TSK-0299 are PASS.\n\n### Exact next authoritative step\n\nExecute TSK-0302 as bounded internal visual-direction exploration: create a small set of distinct, accessible, scalable, editable directions aligned to TSK-0298/0299, evaluate them without premature high-volume asset production, preserve non-surveillance/no-safety-guarantee constraints, then read back and reconcile before reaching HUMAN_ONLY TSK-0301.\n'''
          runtime.write_text(text,encoding='utf-8')
          PY
          git diff --check
      - name: Commit and push runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          git add CURRENT_STATE.md
          git diff --cached --check
          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'state: accept TSK-0299 verbal system'
          git push origin HEAD:main
