name: Temporary TSK-0491 prototype lockfile helper

on:
  push:
    branches:
      - feature/tsk-0491-dependency-inventory-sbom-20260903

permissions:
  contents: write

jobs:
  lock-prototype:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/tsk-0491-dependency-inventory-sbom-20260903
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - name: Generate and verify only the TSK-0310 npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object prototype/TSK-0310/package.json)" = '9cbf9f5102592a0147c531748db49b68e4ee1648'
          test ! -e prototype/TSK-0310/package-lock.json
          python3 Plans/Master/Tools/validate_master_plan.py
          cd prototype/TSK-0310
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          test "$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" = '1.62.0'
          test -n "$(node -p "require('./package-lock.json').packages['node_modules/playwright'].integrity")"
          npm ci --ignore-scripts --no-fund --no-audit
          npm audit --audit-level=high
          cd ../..
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/TSK-0310/package-lock.json
          git commit -m 'build(TSK-0491): lock legacy browser verification dependency'
          git push origin HEAD:feature/tsk-0491-dependency-inventory-sbom-20260903
