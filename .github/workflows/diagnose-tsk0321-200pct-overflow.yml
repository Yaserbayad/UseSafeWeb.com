name: Diagnose TSK-0321 200 percent overflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-tsk0321-200pct-overflow.yml'

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Diagnose exact 200 percent overflow elements after grid-child candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = "adguardvm"
          test "$(git rev-parse HEAD:prototype/TSK-0321/REMEDIATION_CANDIDATE.css)" = "5a1ce1f8b4d695dae20eb7bea18d17f88652eb57"
          tmp="$(mktemp -d)"; server_pid=""; original="$tmp/index.html.original"
          cp prototype/TSK-0310/index.html "$original"
          cleanup() {
            if [ -n "$server_pid" ]; then kill "$server_pid" 2>/dev/null || true; fi
            cp "$original" prototype/TSK-0310/index.html
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototype/TSK-0310/index.html'); t=p.read_text(encoding='utf-8')
          n='  <link rel="stylesheet" href="prototype.css">\n'
          assert n in t
          p.write_text(t.replace(n,n+'  <link rel="stylesheet" href="../TSK-0321/REMEDIATION_CANDIDATE.css">\n',1),encoding='utf-8')
          PY
          (cd "$tmp" && npm init -y >/dev/null 2>&1 && npm install --no-save --no-audit --no-fund playwright@1.62.0 >/dev/null 2>&1)
          export NODE_PATH="$tmp/node_modules" PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"
          "$tmp/node_modules/.bin/playwright" install chromium >/dev/null
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/tsk0321-diag-http.log 2>&1 & server_pid=$!
          for _ in $(seq 1 40); do curl -fsS http://127.0.0.1:4176/prototype/TSK-0310/ >/dev/null && break; sleep 0.25; done
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true}); const page=await browser.newPage({viewport:{width:320,height:900}});
            await page.goto('http://127.0.0.1:4176/prototype/TSK-0310/',{waitUntil:'networkidle'});
            async function press(s){const e=page.locator(s);await e.focus();await page.keyboard.press('Enter')}
            async function dump(label){
              await page.evaluate(()=>document.documentElement.style.fontSize='200%');
              const out=await page.evaluate(()=>{
                const vw=innerWidth;
                const els=[...document.querySelectorAll('.prototype-screen,.prototype-screen > *,.prototype-actions,.prototype-actions > *')];
                return {root:document.documentElement.scrollWidth-vw, items:els.map(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return {tag:el.tagName,cls:el.className,text:(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,55),w:+r.width.toFixed(1),right:+r.right.toFixed(1),scroll:el.scrollWidth,client:el.clientWidth,min:s.minWidth,minInline:s.minInlineSize,width:s.width,max:s.maxWidth,overflowWrap:s.overflowWrap,wordBreak:s.wordBreak,gridCols:s.gridTemplateColumns}})};
              });
              console.log(`CURRENT_${label}=${JSON.stringify(out)}`); await page.evaluate(()=>document.documentElement.style.fontSize='');
            }
            await dump('DISCOVERY'); await press('[data-action="START"]'); await dump('ROUTER');
            await press('[data-platform="other"]'); await dump('LIMITATIONS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          cleanup; trap - EXIT
          git diff --check; test -z "$(git status --porcelain)"
          echo 'TSK0321_GRID_CHILD_DIAGNOSTIC=PASS'
