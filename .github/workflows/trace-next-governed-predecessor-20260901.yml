name: Audit TSK-0313 canonical contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trace-next-governed-predecessor-20260901.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Audit TSK-0313 WBS, dependencies, and linked registers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, re
          from pathlib import Path

          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          row = next(r for r in rows if (r.get('Task_ID') or '').strip() == 'TSK-0313')
          print('WBS_FIELDS_BEGIN')
          for key, value in row.items():
              if (value or '').strip():
                  print(f'{key}={(value or "").strip()}')
          print('WBS_FIELDS_END')

          state = Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          accepted = set(re.findall(r'^## (TSK-\d{4})(?:\s*/[^\n#]+)?\s+current accepted stable state\b', state, flags=re.M|re.I))
          deps = re.findall(r'TSK-\d{4}', row.get('Dependencies') or '')
          print('DEPENDENCIES=' + ';'.join(deps))
          for dep in deps:
              print(f'DEP_{dep}=' + ('CURRENT_PASS' if dep in accepted else 'MISSING_CURRENT_PASS'))
          print('TSK0313_CURRENT=' + ('PASS' if 'TSK-0313' in accepted else 'NOT_PASS'))

          refs = {
              'Plans/Master/Registers/REQUIREMENTS.md': ['REQ-0028','REQ-0029','REQ-0035'],
              'Plans/Master/Registers/CONSTRAINTS.md': ['CON-0010','CON-0017'],
              'Plans/Master/Registers/RISKS.md': ['RSK-0002'],
              'Plans/Master/Registers/INTERFACES.md': ['INT-0009','INT-0010'],
              'Plans/Master/Registers/VERIFICATION_EVIDENCE_ACCEPTANCE.md': ['TSK-0313'],
          }
          for path, ids in refs.items():
              lines = Path(path).read_text(encoding='utf-8').splitlines()
              print(f'REGISTER={path}')
              for item_id in ids:
                  matches = [line for line in lines if line.startswith(f'| {item_id} |')]
                  print(f'ROW_{item_id}_COUNT={len(matches)}')
                  for line in matches:
                      print(line)

          for artifact in [
              'TSK_0320_POST_CR0008_PROTECTION_STATE_MODEL_AND_COPY_RULES_2026-09-01.md',
              'TSK_0144_EXTERNAL_SERVICE_SAFEGUARD_REQUIREMENT_2026-09-01.md',
              'TSK_0041_POST_CR0008_CURRENT_REQUALIFICATION_AMENDMENT_2026-09-01.md',
          ]:
              p = Path(artifact)
              print(f'ARTIFACT_{artifact}_EXISTS={p.exists()}')
              if p.exists():
                  print(f'ARTIFACT_{artifact}_BYTES={p.stat().st_size}')

          print('TSK0313_CONTRACT_AUDIT=PASS')
          PY
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
