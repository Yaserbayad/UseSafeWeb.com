name: Trace next governed predecessor after TSK-0144

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trace-next-governed-predecessor-20260901.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Trace highest-priority blocked L5 chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, re
          from pathlib import Path

          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          by_id = {(r.get('Task_ID') or '').strip(): r for r in rows if (r.get('Task_ID') or '').strip()}
          state = Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          accepted = set(re.findall(r'^## (TSK-\d{4})(?:\s*/[^\n#]+)?\s+current accepted stable state\b', state, flags=re.M|re.I))
          def deps(row): return re.findall(r'TSK-\d{4}', row.get('Dependencies') or '')

          target = 'TSK-0047'
          branch = set()
          def collect(task_id):
              if task_id in branch or task_id not in by_id: return
              branch.add(task_id)
              for dep in deps(by_id[task_id]):
                  if dep not in accepted: collect(dep)
          collect(target)

          ready = []
          for task_id in branch:
              if task_id in accepted: continue
              row = by_id[task_id]
              if (row.get('Planning_Status') or '').strip().upper() in {'DEFERRED','NOT_APPLICABLE','CANCELLED','CANCELED'}: continue
              if all(dep in accepted for dep in deps(row)):
                  ready.append(row)
          order = {'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          ready.sort(key=lambda r:(order.get((r.get('Priority') or '').strip().upper(),9), rows.index(r), (r.get('Task_ID') or '')))

          print(f'ACCEPTED_COUNT={len(accepted)}')
          print(f'TARGET={target}')
          print(f'READY_BRANCH_LEAVES={len(ready)}')
          for r in ready:
              task_id = (r.get('Task_ID') or '').strip()
              print(f"READY | {task_id} | {(r.get('Lifecycle_Stage') or '').strip()} | {(r.get('Priority') or '').strip()} | {(r.get('AI_Capability_A0_A4') or '').strip()} | {(r.get('Action_Authority') or '').strip()}")
              print(f"TITLE | {(r.get('Title') or r.get('Task') or '').strip()}")
              print(f"DEPS | {(r.get('Dependencies') or '').strip()}")
              print(f"ACCEPTANCE | {(r.get('Acceptance_Criteria') or '').strip()}")
              print(f"REFS | req={(r.get('Requirement_Reference') or '').strip()} | risk={(r.get('Risk_Reference') or '').strip()} | interface={(r.get('Interface_Reference') or '').strip()} | acc={(r.get('Acceptance_ID') or '').strip()} | ver={(r.get('Verification_ID') or '').strip()} | evd={(r.get('Evidence_ID') or '').strip()}")
              print(f"CONTROL | gate={(r.get('Gate') or '').strip()} | trigger={(r.get('Trigger') or '').strip()} | preconditions={(r.get('Preconditions') or '').strip()}")
          PY
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"