name: Select TSK-0140 governed preparation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/select-tsk0140.yml'

permissions:
  contents: write

jobs:
  select:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact governed pre-state
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "cce58db09424e7ed8ff44308fdd9b52544b4e1ee"
          grep -Fq 'TSK-0043` is runtime **PASS**' CURRENT_STATE.md
          grep -Fq 'No successor is selected by this reconciliation write.' CURRENT_STATE.md
      - name: Persist bounded TSK-0140 selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          old_updated = '**Updated:** 2026-08-28T20:56:42Z'
          if text.count(old_updated) != 1:
              raise SystemExit('unexpected Updated pre-state')
          updated = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text = text.replace(old_updated, f'**Updated:** {updated}', 1)
          marker = '## Queue status after TSK-0043 reconciliation\n'
          i = text.find(marker)
          if i < 0 or text.find(marker, i + 1) >= 0:
              raise SystemExit('queue marker mismatch')
          tail = '''## Queue status after TSK-0043 reconciliation\n\n`TSK-0140 — Issue the post-validation product brief` is the selected runtime **TODO** work item for bounded preparation only. Its sole hard dependency `TSK-0138` is runtime PASS. WBS classifies TSK-0140 as L4 / A3 / AUTO_ALLOWED, but ACC-0140 additionally requires review by the Project Owner plus product, network, privacy, security, UX, support and finance before approval. Current DEC-0050/CR-0003 permits internal provisional L4 preparation but does not permit this brief to claim real behavioral validation or substitute AI review for the mandatory owner review.\n\nAll higher-priority remaining L4 branches currently fail eligibility for autonomous completion: representative-parent evidence remains unavailable under `RSK-0002`; `TSK-0317` and dependent UX work cross HUMAN_ONLY authority; account/persistence work remains deferred under EXC-0001; L5/L6 progression remains unauthorized.\n\n## Exact next authoritative step\n\nPrepare the smallest source-traceable provisional TSK-0140 product brief from current accepted L4 artifacts and canonical requirements. Perform all non-owner cross-functional conflict checks that can be truthfully completed from current evidence. Do not call the brief approved, post-validation in the behavioral sense, or PASS. After durable publication/read-back, classify TSK-0140 WAITING if Project Owner review remains the only unsatisfied ACC-0140 condition; record the exact owner-review input needed and preserve all DEC-0050/CR-0003, privacy, accountless, build and launch fences.\n'''
          text = text[:i] + tail
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify diff and commit selection
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'TSK-0140 — Issue the post-validation product brief` is the selected runtime **TODO** work item for bounded preparation only.' CURRENT_STATE.md
          grep -Fq 'Project Owner review remains the only unsatisfied ACC-0140 condition' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: select TSK-0140 preparation'
          git push
