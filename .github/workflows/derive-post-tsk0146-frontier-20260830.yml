name: Inspect TSK-0229 execution contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/derive-post-tsk0146-frontier-20260830.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Print exact TSK-0229 contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = "515638ae5efaa8dfec4e9a8362f28f7efb45cd6e"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "3bb1598a6233a2bbefa52c746a7621867c6c6e89"
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          rows = list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='')))
          by_id = {r['Task_ID'].strip(): r for r in rows}
          r = by_id['TSK-0229']
          print('FULL_TARGET=' + json.dumps(r, ensure_ascii=False, sort_keys=True))
          for tid in ['TSK-0146','TSK-0315','TSK-0230','TSK-0233']:
              if tid in by_id:
                  print('RELATED_' + tid + '=' + json.dumps(by_id[tid], ensure_ascii=False, sort_keys=True))
          PY
