name: TSK-0243 verifier-interface runtime sync one-shot

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  sync-state:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'trigger/tsk-0243-interface-state-sync-20260903'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Replace TSK-0243 runtime tail in place, self-remove, push, and byte-verify remote
        shell: bash
        run: |
          set -euo pipefail
          BASE='5f75946da2482f8f454e2a39cf15ac7208bcb59f'
          PRE_STATE_BLOB='47d126d381f9b628261474c62b9e6a2b3e34ef6a'
          EVIDENCE_BLOB='92581bf41614ed51a7e35b228b6645a5bea3f8b1'
          PROOF_BLOB='470095e20ee7a51ec06ea02fc561743a78cb5012'
          HELPER='.github/workflows/tsk0243-state-sync-interface-one-shot.yml'

          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git hash-object CURRENT_STATE.md)" = "$PRE_STATE_BLOB"
          test "$(git hash-object TSK_0243_VERIFIER_INTERFACE_SOURCE_IMPLEMENTATION_2026-09-03.md)" = "$EVIDENCE_BLOB"
          test "$(git hash-object website/src/lib/dns-verification-proof.ts)" = "$PROOF_BLOB"
          test -f "$HELPER"
          test "$(grep -c '^## TSK-0243 current' CURRENT_STATE.md)" -eq 1

          PRE_SIZE="$(wc -c < CURRENT_STATE.md)"
          STAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export STAMP

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('CURRENT_STATE.md')
          raw = path.read_bytes()
          old_stamp = b'**Updated:** 2026-09-03T03:42:40Z'
          assert raw.count(old_stamp) == 1, 'unexpected CURRENT_STATE Updated marker'
          raw = raw.replace(old_stamp, b'**Updated:** ' + os.environ['STAMP'].encode('ascii'), 1)
          marker = b'\n## TSK-0243 current accepted stable state'
          assert raw.count(marker) == 1, 'TSK-0243 runtime section count mismatch'
          prefix, tail = raw.split(marker, 1)
          assert b'\n## ' not in tail, 'TSK-0243 is not the final runtime section'
          section = r'''

          ## TSK-0243 current accepted stable state — 2026-09-03 — VERIFIER INTERFACE SOURCE IMPLEMENTATION PARTIAL

          `TSK-0243 — Implement privacy-safe DNS protection verification`: **TODO**. The source trust/proof contract and server request/probe interface are durably integrated and independently verified, including a CI-local production HTTP round trip, but current `ACC-0243 / VER-0243 / EVD-0243` remains incomplete because the target DNS/TLS/proxy trust boundary and real end-to-end verifier path have not been deployed or observed.

          - Current normalized WBS: L6 / MEDIUM / A3 / `AUTO_ALLOWED`; hard predecessor `TSK-0358` is current durable PASS; `LG-07` is current durable PASS.
          - First source slice merged through PR `#66`, squash merge `34e2dd6599ae0f5a8e0d8fb2f955b8ba6b3a0e7b`; durable first-slice evidence remains `TSK_0243_PRIVACY_SAFE_DNS_VERIFICATION_SOURCE_CONTRACT_2026-09-03.md`, blob `fa0f049384b4504f15329a1bed3d2f7a1cb04e7a`.
          - Verifier-interface source slice merged through PR `#69`; squash merge commit `5f75946da2482f8f454e2a39cf15ac7208bcb59f`.
          - Durable second-slice evidence: `TSK_0243_VERIFIER_INTERFACE_SOURCE_IMPLEMENTATION_2026-09-03.md`, blob `92581bf41614ed51a7e35b228b6645a5bea3f8b1`.
          - Canonical proof/request source: `website/src/lib/dns-verification-proof.ts`, blob `470095e20ee7a51ec06ea02fc561743a78cb5012`; streaming body reader `website/src/lib/bounded-request-body.ts`, blob `37a56b8a1853aa2fb5dcd8bffdc9a2c48be17ed9`; request route blob `327a7a8a743e959382c9fc5110185ff81007c0bb`; probe route blob `4bf11a4e78260b495f305fbfeb00382af107d7be`; CSP config blob `540a2442651bd713a9c0abe00166857a0614b3b4`.
          - Final evidence-bearing PR-head acceptance `33713695806 / 100518299050`: **SUCCESS** on exact head `125d035cbbf921c7ca2572235d6f87d8f18e9fc5`.
          - Clean canonical-main TSK-0243 acceptance `33713797020 / 100518630909`: **SUCCESS** on exact merge SHA `5f75946da2482f8f454e2a39cf15ac7208bcb59f`; 56/56 contract tests PASS, repository/master-plan validators PASS, lint has zero errors with one inherited `_accountState` warning, type-check and Next.js production build PASS with 57/57 static pages generated where applicable, production/all dependency audits report 0 vulnerabilities, and CI-local marker `TSK0243_LOCAL_HTTP_VERIFIER_ACCEPTANCE=PASS` proves the built request/probe Route Handlers reject wrong origin and wrong Host and accept the exact current Host/origin/token path.
          - Related clean-main regressions on the same merge SHA also PASS: TSK-0629 `33713797031 / 100518630756` including real-browser acceptance, and TSK-0359 `33713797011 / 100518630689` including inherited real-browser locale/accountless acceptance.
          - Proven source behavior now includes CSPRNG per-check challenge generation; HMAC-SHA256 domain-separated request and observation tokens; exact scope/challenge/expiry binding; current-Host positive-signing derivation; strict no-history schemas; timing-safe signature comparison; byte/count/freshness bounds; a 4,096-byte streaming request-body cap with fatal UTF-8 validation; POST-only Node Route Handlers; exact configured HTTPS origin CORS with `Vary: Origin`; no-store responses; and CSP limited to `https://*.verify.usesafeweb.com`.
          - Review defects were corrected test-first before integration: stale-challenge replay, unbounded proof input, caller-dependent challenge freshness, cross-origin JSON/preflight mismatch, missing CSP connectivity, an over-broad CSP regression assertion, and whole-body buffering before size validation.
          - **Acceptance still missing:** target evidence must prove `*.verify.usesafeweb.com` resolves/reaches the positive signer only through the intended UseSafeWeb DNS path; ordinary/public resolution does not false-positive; TLS authenticates the random challenge hostname; reverse-proxy/network controls prevent direct positive-signer invocation by forged `Origin`/`Host`; the signing key is injected only into the intended trusted service and is rotatable; rate/abuse controls work at the actual interface; the real product/browser orchestration completes request→probe→observation→Protection Map; negative/timeout/DNS/TLS/replay/wrong-host/wrong-origin/conflict paths fail closed; runtime/event/storage inspection proves prohibited DNS/browsing/identity data is not retained; and target rollback/removal is tested against the exact configuration/version.
          - CORS/Origin and Host checks are source controls, not proof of network authenticity. Source and CI-local loopback evidence cannot establish how a real client resolved/routed the random hostname.
          - **Non-inference / fences:** no DNS rewrite/record, TLS certificate, reverse-proxy/runtime configuration, deployed signing secret, web deployment, profile distribution, production/runtime activation, participant processing, market activation, payment, launch, or unrelated task/gate PASS is inferred or performed. `TSK-0629` remains TODO until a trusted deployed fresh E1 DNS-path producer is evidenced and integrated end-to-end; `TSK-0360` remains TODO; `TSK-0455` remains WAITING for a genuinely qualifying owner-provided fresh Ubuntu 24.04 LTS target host/access; `TSK-0399` remains ineligible while `TSK-0360` is non-PASS. No `GATE-0026` exists or is created.

          ### Queue status after TSK-0243 verifier-interface source acceptance

          Continue only with current authorized source/configuration work that materially advances the missing end-to-end product/verifier acceptance without deploying, distributing, activating runtime/market state or processing participants. If the remaining acceptance requires a fenced target DNS/TLS/runtime mutation or unavailable target access, retain `TSK-0243` as non-PASS and recompute the next genuinely executable `AUTO_ALLOWED` frontier.
          '''.encode('utf-8')
          section = b'\n'.join(line[10:] if line.startswith(b'          ') else line for line in section.split(b'\n'))
          path.write_bytes(prefix + section)
          PY

          POST_SIZE="$(wc -c < CURRENT_STATE.md)"
          test "$POST_SIZE" -gt 470000
          grep -Fq '`TSK-0243 — Implement privacy-safe DNS protection verification`: **TODO**' CURRENT_STATE.md
          grep -Fq '5f75946da2482f8f454e2a39cf15ac7208bcb59f' CURRENT_STATE.md
          grep -Fq '33713797020 / 100518630909' CURRENT_STATE.md
          grep -Fq 'TSK0243_LOCAL_HTTP_VERIFIER_ACCEPTANCE=PASS' CURRENT_STATE.md
          grep -Fq '`TSK-0455` remains WAITING' CURRENT_STATE.md
          test "$(grep -c '^## TSK-0243 current' CURRENT_STATE.md)" -eq 1

          rm "$HELPER"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'state: extend TSK-0243 partial TODO checkpoint'
          FINAL="$(git rev-parse HEAD)"
          test "$(git diff --name-only "$BASE" "$FINAL" | tr -d '\r')" = 'CURRENT_STATE.md'

          git push origin HEAD:main
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$FINAL"
          git show origin/main:CURRENT_STATE.md > /tmp/remote-current-state.md
          cmp CURRENT_STATE.md /tmp/remote-current-state.md
          LOCAL_BLOB="$(git hash-object CURRENT_STATE.md)"
          REMOTE_BLOB="$(git rev-parse origin/main:CURRENT_STATE.md)"
          test "$LOCAL_BLOB" = "$REMOTE_BLOB"
          REMOTE_SIZE="$(wc -c < /tmp/remote-current-state.md)"
          test "$REMOTE_SIZE" = "$POST_SIZE"
          grep -Fq '33713797020 / 100518630909' /tmp/remote-current-state.md
          grep -Fq '33713797031 / 100518630756' /tmp/remote-current-state.md
          grep -Fq '33713797011 / 100518630689' /tmp/remote-current-state.md
          test "$(grep -c '^## TSK-0243 current' /tmp/remote-current-state.md)" -eq 1

          echo "TSK0243_INTERFACE_STATE_SYNC_FINAL_SHA=$FINAL"
          echo "TSK0243_INTERFACE_STATE_SYNC_PRE_BLOB=$PRE_STATE_BLOB"
          echo "TSK0243_INTERFACE_STATE_SYNC_PRE_SIZE=$PRE_SIZE"
          echo "TSK0243_INTERFACE_STATE_SYNC_REMOTE_BLOB=$REMOTE_BLOB"
          echo "TSK0243_INTERFACE_STATE_SYNC_REMOTE_SIZE=$REMOTE_SIZE"
          echo 'TSK0243_INTERFACE_STATE_SYNC_REMOTE_READBACK=PASS'
