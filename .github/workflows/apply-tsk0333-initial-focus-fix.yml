name: Apply TSK-0333 initial focus fix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-tsk0333-initial-focus-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Patch and publish
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD:prototype/TSK-0333/app.mjs)" = "1d4674285a63ae32ae3e9472cc4854b819e2ece3"
          python3 .github/scripts/fix_tsk0333_initial_focus.py
          git diff --check
          [[ "$(git diff --name-only)" == "prototype/TSK-0333/app.mjs" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/TSK-0333/app.mjs
          git commit -m 'fix: preserve skip-link as initial keyboard target'
          git push origin HEAD:main
          echo "APP_BLOB=$(git rev-parse HEAD:prototype/TSK-0333/app.mjs)"
