name: Verify TSK-0307 current revalidation

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0307-current-verifier-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Run robust structural VER-0307
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_tsk0307_current_revalidation.py
      - name: Verify current first-party source reachability
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://support.google.com/android/answer/9654714'
            'https://developer.android.com/reference/android/app/admin/DevicePolicyManager'
            'https://developer.android.com/reference/android/net/LinkProperties'
            'https://support.apple.com/guide/deployment/dns-settings-payload-settings-dep86469ba99/web'
            'https://support.apple.com/guide/iphone/install-or-remove-configuration-profiles-iph6c493b19/ios'
            'https://support.apple.com/guide/personal-safety/ips327569a75/web'
          )
          for url in "${urls[@]}"; do
            code="$(curl -L --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 45 -A 'Mozilla/5.0 TSK-0307-verifier' -sS -o /tmp/source.html -w '%{http_code}' "$url")"
            case "$code" in 200|301|302|303|307|308) ;; *) echo "SOURCE_REACHABILITY_FAIL=$url HTTP=$code"; exit 1;; esac
            test -s /tmp/source.html
          done
          echo 'TSK0307_OFFICIAL_SOURCE_REACHABILITY=6/6_PASS'
