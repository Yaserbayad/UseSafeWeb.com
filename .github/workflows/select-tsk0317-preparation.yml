name: Select TSK-0317 HUMAN_ONLY preparation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/select-tsk0317-preparation.yml'

permissions:
  contents: write

jobs:
  select:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact governed pre-state
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "3860d32d51db37f5d376773a188016a611173b33"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "dce5b829c4d447eac180ae1e896e0019292cf971"
          grep -Fq '`TSK-0140` is runtime **PASS**' CURRENT_STATE.md
          grep -Fq 'No successor is selected by this reconciliation write.' CURRENT_STATE.md
      - name: Persist bounded TSK-0317 preparation selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          old_updated = '**Updated:** 2026-08-28T21:20:50Z'
          if text.count(old_updated) != 1:
              raise SystemExit('unexpected Updated pre-state')
          updated = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text = text.replace(old_updated, f'**Updated:** {updated}', 1)
          marker = '## Queue status after TSK-0140 acceptance\n'
          i = text.find(marker)
          if i < 0 or text.find(marker, i + 1) >= 0:
              raise SystemExit('queue marker mismatch')
          tail = (
              '## Queue status — TSK-0317 HUMAN_ONLY preparation selected\n\n'
              '`TSK-0317 — Design the simplest technically correct install, verification, removal, and recovery path for each supported platform` is the selected runtime **TODO** item for **preparation only**. Its sole hard dependency `TSK-0316` is runtime PASS. The WBS classifies TSK-0317 as L4 / HIGH / A1 / HUMAN_ONLY, so AI may prepare a source-grounded candidate and verification packet but may not perform, fabricate, or self-certify the required human design decision.\n\n'
              'Selection basis after TSK-0140 PASS: TSK-0312 is statically DEFERRED under EXC-0001; TSK-0309 is blocked on representative-parent evidence through TSK-0187; TSK-0307 and TSK-0310 depend on TSK-0317; TSK-0311 depends on HUMAN_ONLY TSK-0318; TSK-0319 is also HUMAN_ONLY. Among the live HIGH HUMAN_ONLY L4 bottlenecks, TSK-0317 is first by current dependency impact and WBS/task order.\n\n'
              'All current fences remain: RSK-0002 OPEN; REQ-0022 unresolved; LG-03/LG-04/LG-05/LG-06 non-PASS; account/dashboard deferred; no L5/L6 build, participant processing, legal completion, payment, publication or launch authority.\n\n'
              '## Exact next authoritative step\n\n'
              'Prepare the smallest technically correct TSK-0317 candidate from current accepted friction, DNS identity, support-matrix, verification-state and recovery evidence. Make Android/iPhone asymmetry, automatic-versus-manual limits, verification truth, conflicts, fallback, removal and recovery explicit. Publish and independently verify the candidate, then classify TSK-0317 WAITING on the exact HUMAN_ONLY review/decision without marking PASS or claiming human completion.\n'
          )
          text = text[:i] + tail
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify diff and commit selection
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'TSK-0317 HUMAN_ONLY preparation selected' CURRENT_STATE.md
          grep -Fq 'selected runtime **TODO** item for **preparation only**' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: select TSK-0317 HUMAN_ONLY preparation'
          git push
