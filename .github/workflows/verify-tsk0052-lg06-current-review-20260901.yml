name: Verify current TSK-0052 LG-06 evidence review 2026-09-01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0052-lg06-current-review-20260901.yml'
      - '.github/scripts/verify_tsk0052_lg06_current_review_20260901.py'
      - 'TSK_0052_LG06_CURRENT_DUAL_MODE_FREEZE_REVIEW_2026-09-01.md'
      - 'CURRENT_STATE.md'
      - 'Plans/Master/WBS/master-wbs.csv'
      - 'Plans/Master/Registers/GATES.md'
      - 'Plans/Master/Registers/DECISIONS_TRIGGERS.md'
      - 'Plans/Master/Registers/RISKS.md'
      - 'prototype/TSK-0309/**'
      - 'prototype/TSK-0333/**'
      - 'prototype/TSK-0324/**'
      - 'TSK_LG06_PREDECESSOR_CURRENT_REQUALIFICATION_EVIDENCE_2026-09-01.md'
      - 'TSK_0321_POST_CR0007_FINAL_ACCESSIBILITY_EVIDENCE_2026-09-01.md'
  workflow_dispatch:

concurrency:
  group: tsk0052-lg06-current-evidence-review
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current LG-06 evidence map
        run: python3 .github/scripts/verify_tsk0052_lg06_current_review_20260901.py
      - name: Repository integrity guards
        run: |
          git diff --check HEAD^ HEAD
          test -z "$(git status --porcelain)"
      - name: Persist verification marker with stale-write guard
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          cat > TSK_0052_LG06_CURRENT_EVIDENCE_AUTOVERIFY_2026-09-01.md <<EOF
          # TSK-0052 / LG-06 current evidence review — automated verification

          **Review verification:** PASS  
          **Source commit:** \`${SOURCE_SHA}\`  
          **GitHub Actions run:** \`${RUN_ID}\` / attempt \`${RUN_ATTEMPT}\`  
          **Verifier:** GitHub-hosted Ubuntu source/reconciliation CI

          The repository-current verifier passed the exact TSK-0052 A4/AUTO_ALLOWED WBS contract, current LG-06 gate/DEC-0053/DEC-0054 authority, four current direct predecessor PASS states, current dual-mode product/account/dashboard/lifecycle/prototype/accessibility evidence, unchanged pinned brand/content/localization authorities as consumed by current dual-mode surfaces, and the explicit open-risk/legal-fence disposition in the 2026-09-01 current freeze review.

          Verified review conclusion: every applicable current ACC-0052 L4 evidence category is mapped and no unresolved critical L4 product/scope/experience contradiction was found. RSK-0002/0005/0015/0017/0022 remain open as recorded; deferred legal facts remain unresolved rather than waived; no real-user evidence is inferred. The review permits only a subsequent separate stable-state evaluation of TSK-0052/LG-06 and does not itself create gate PASS or unlock L5.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TSK_0052_LG06_CURRENT_EVIDENCE_AUTOVERIFY_2026-09-01.md
          git commit -m 'evidence: verify current TSK-0052 LG-06 review'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${SOURCE_SHA}" ]; then
            changed="$(git diff --name-only "${SOURCE_SHA}"..origin/main)"
            bad="$(printf '%s\n' "${changed}" | grep -Ev '^(TSK_LG06_PREDECESSOR_REQUALIFICATION_AUTOVERIFY_2026-09-01\.md)?$' || true)"
            if [ -n "${bad}" ]; then
              echo 'Material source changed after LG-06 review checkout:'
              printf '%s\n' "${bad}"
              exit 1
            fi
            git rebase origin/main
          fi
          git push origin HEAD:main
      - name: Remote marker read-back
        run: |
          git fetch origin main
          git show origin/main:TSK_0052_LG06_CURRENT_EVIDENCE_AUTOVERIFY_2026-09-01.md | grep -F '**Review verification:** PASS'
          git show origin/main:TSK_0052_LG06_CURRENT_EVIDENCE_AUTOVERIFY_2026-09-01.md | grep -F 'does not itself create gate PASS or unlock L5'
          echo "REMOTE_HEAD=$(git rev-parse origin/main)"
