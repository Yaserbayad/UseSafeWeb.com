name: Verify runtime preservation reconciliation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-runtime-preservation-reconciliation-20260905.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify proposed preservation set and exclusions
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_CHECKPOINT_BLOB='c2175c5b5e3a5797f38638e36503f76d6cafbd60'
          LEGACY_COMMIT='20e2763c0be2124378e3158ac559aed826bc6765'
          LEGACY_BLOB='d45c7b1f98ceba6265944aabd970c250dc7be2d2'
          WBS_BLOB='357c5e1be3b455e7efddd329d6a2468e3125b502'
          test "$(git hash-object CURRENT_STATE.md)" = "$EXPECTED_CHECKPOINT_BLOB"
          test "$(git rev-parse ${LEGACY_COMMIT}:CURRENT_STATE.md)" = "$LEGACY_BLOB"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "$WBS_BLOB"
          git show "${LEGACY_COMMIT}:CURRENT_STATE.md" > /tmp/legacy-current-state.md

          python3 - <<'PY'
          import csv,json,re
          from pathlib import Path

          RESTORE='''TSK-0026 TSK-0027 TSK-0028 TSK-0139 TSK-0165 TSK-0166 TSK-0167 TSK-0168 TSK-0169 TSK-0202 TSK-0207 TSK-0214 TSK-0225 TSK-0227 TSK-0228 TSK-0298 TSK-0302 TSK-0374 TSK-0428 TSK-0431 TSK-0437 TSK-0441 TSK-0442 TSK-0443 TSK-0510 TSK-0511 TSK-0512 TSK-0513 TSK-0514 TSK-0559'''.split()
          EXCLUDE='''TSK-0243 TSK-0360 TSK-0369 TSK-0399 TSK-0455 TSK-0483 TSK-0499 TSK-0630'''.split()
          OWNER_DEFER={'TSK-0455','TSK-0631','TSK-0633','TSK-0634','TSK-0635','TSK-0637','TSK-0640','TSK-0630','TSK-0421','TSK-0415','TSK-0416','TSK-0370','TSK-0499','TSK-0242'}

          cur=json.loads(Path('CURRENT_STATE.md').read_text(encoding='utf-8'))
          assert cur['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert cur['project_id']=='UseSafeWeb.com'
          assert cur['governance_mode']=='SERIAL_LIGHT'
          assert cur['checkpoint_revision']==27
          assert cur['baseline']['version']==1
          assert cur['runtime']['project_status']=='ACTIVE'
          runtime={x['id']:x for x in cur['runtime']['items']}
          work={x['id']:x for x in cur['baseline']['work_items']}
          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='') as f:
              wbs={r['Task_ID']:r for r in csv.DictReader(f)}
          legacy=Path('/tmp/legacy-current-state.md').read_text(encoding='utf-8')
          lines=legacy.splitlines()

          assert not (set(RESTORE)&set(EXCLUDE))
          assert not (set(RESTORE)&OWNER_DEFER)
          assert len(RESTORE)==30
          assert len(EXCLUDE)==8

          # Any accepted-stable heading for a currently non-PASS task must be classified.
          heading_nonpass={}
          for i,line in enumerate(lines,1):
              m=re.match(r'^#{2,6}\s+(TSK-\d{4})\b.*accepted stable state',line,re.I)
              if m:
                  tid=m.group(1).upper()
                  if tid in runtime and runtime[tid]['status']!='PASS':
                      heading_nonpass.setdefault(tid,[]).append({'line':i,'heading':line.strip()})
          unclassified=sorted(set(heading_nonpass)-set(RESTORE)-set(EXCLUDE))
          assert not unclassified, f'unclassified accepted-stable non-PASS tasks: {unclassified}'

          def strong_positive_lines(tid):
              out=[]
              for i,line in enumerate(lines,1):
                  if tid not in line: continue
                  low=line.lower()
                  if any(x in low for x in ['does not imply '+tid.lower()+' pass','does not prove or authorize '+tid.lower(),'not pass','non-pass','before pass','pending direct current','remains todo','remains waiting']):
                      continue
                  # Task-level or current-state positive assertions only.
                  positive=(
                    re.search(re.escape(tid)+r'.{0,500}(?:\*\*PASS|= PASS|: PASS|remains current PASS|current .*PASS|acceptance (?:is|are) satisfied|ACC-\d{4}.{0,80}satisfied)',line,re.I)
                    or re.search(r'(?:Dependency\s+)?`?'+re.escape(tid)+r'`?\s+remains current PASS',line,re.I)
                  )
                  if positive:
                      out.append({'line':i,'text':line.strip()})
              return out

          rows=[]
          for tid in RESTORE:
              assert tid in runtime and tid in work and tid in wbs
              assert runtime[tid]['status']!='PASS', (tid,runtime[tid]['status'])
              n=tid.split('-')[1]
              acc=f'ACC-{n}'
              assert [x['id'] for x in work[tid]['acceptance_criteria']]==[acc], (tid,work[tid]['acceptance_criteria'])
              assert wbs[tid]['Acceptance_ID']==acc, (tid,wbs[tid]['Acceptance_ID'])
              positives=strong_positive_lines(tid)
              # Accepted-stable headings plus immutable current-state text are enough only
              # if an explicit task-level/current PASS assertion is also present.
              assert positives, f'no strong positive legacy PASS assertion for {tid}'
              # Verify all 40-char Git object IDs explicitly cited on positive lines exist
              # when they look like object hashes. This is supplementary, not the sole proof.
              hashes=[]
              for p in positives:
                  hashes += re.findall(r'(?<![0-9a-f])[0-9a-f]{40}(?![0-9a-f])',p['text'],re.I)
              rows.append({
                'id':tid,
                'current_status':runtime[tid]['status'],
                'acceptance_id':acc,
                'wbs_action_authority':wbs[tid]['Action_Authority'],
                'accepted_stable_headings':heading_nonpass.get(tid,[]),
                'strong_positive_assertions':positives,
                'cited_git_object_ids':sorted(set(hashes))
              })

          # Exclusions must remain non-PASS and must not be accidentally treated as restore.
          exclusions=[]
          for tid in EXCLUDE:
              assert runtime[tid]['status']!='PASS'
              exclusions.append({'id':tid,'current_status':runtime[tid]['status'],'owner_deferred':tid in OWNER_DEFER,'accepted_stable_headings':heading_nonpass.get(tid,[])})

          result={
            'result':'PASS',
            'checkpoint_revision':27,
            'checkpoint_blob':'c2175c5b5e3a5797f38638e36503f76d6cafbd60',
            'legacy_commit':'20e2763c0be2124378e3158ac559aed826bc6765',
            'legacy_checkpoint_blob':'d45c7b1f98ceba6265944aabd970c250dc7be2d2',
            'wbs_blob':'357c5e1be3b455e7efddd329d6a2468e3125b502',
            'restore_count':len(RESTORE),
            'restore':rows,
            'exclude_count':len(EXCLUDE),
            'exclude':exclusions,
            'accepted_stable_nonpass_ids':sorted(heading_nonpass),
            'unclassified_accepted_stable_nonpass_ids':unclassified,
            'classification_rule':'Only explicit task-level/current legacy PASS assertions under current immutable state are proposed for preservation; current owner deferrals and explicit non-PASS/partial boundaries remain non-PASS.'
          }
          Path('runtime-preservation-reconciliation-verification.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in result.items() if k not in ('restore',)},indent=2,ensure_ascii=False))
          print('RESTORE_IDS='+' '.join(RESTORE))
          PY

      - name: Upload reconciliation verification
        uses: actions/upload-artifact@v4
        with:
          name: runtime-preservation-reconciliation-verification
          path: runtime-preservation-reconciliation-verification.json
          if-no-files-found: error

      - name: Remove one-off verification transport
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = 'c2175c5b5e3a5797f38638e36503f76d6cafbd60'
          git switch -C main origin/main
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/verify-runtime-preservation-reconciliation-20260905.yml
          git commit -m 'evidence: remove runtime preservation verification transport'
          git push origin HEAD:main
