name: Reconcile TSK-0334 current WAITING state
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0334-waiting-20260831.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist exact current HUMAN_ONLY waiting state
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 .github/scripts/reconcile_tsk0334_waiting_20260831.py
          git diff --check
          grep -Fq '## TSK-0334 current state — 2026-08-31 — POST-CR-0007' CURRENT_STATE.md
          grep -Fq '**WAITING / HUMAN_APPROVAL_REQUIRED**, not PASS' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: record current TSK-0334 human approval wait'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          echo "TSK0334_WAITING_RECONCILIATION=PASS"
          echo "TSK0334_WAITING_COMMIT=$(git rev-parse HEAD)"
          echo "TSK0334_WAITING_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
