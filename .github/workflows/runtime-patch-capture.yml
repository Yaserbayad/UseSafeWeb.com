name: Capture patched runtime state

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/runtime-patch-capture.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-runtime-patch-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Apply exact patched runtime state
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          python3 .github/scripts/reconcile_runtime_tsk0310.py
          git diff --check
          printf 'PATCHED_STATE_SHA256='; sha256sum CURRENT_STATE.md | awk '{print $1}'
          printf 'PATCHED_STATE_BYTES='; wc -c < CURRENT_STATE.md | tr -d ' '
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          if git diff --cached --quiet; then
            echo 'RUNTIME_ALREADY_RECONCILED=PASS'
            exit 0
          fi
          git commit -m 'state: reconcile TSK-0310 partial verification'
          git push origin HEAD:main
          echo 'RUNTIME_RECONCILIATION=PASS'
