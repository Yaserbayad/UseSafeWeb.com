name: Capture patched runtime state

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/runtime-patch-capture.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-runtime-patch-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Generate exact patched runtime payload
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          python3 .github/scripts/reconcile_runtime_tsk0310.py
          git diff --check
          printf 'PATCHED_STATE_SHA256='; sha256sum CURRENT_STATE.md | awk '{print $1}'
          printf 'PATCHED_STATE_BYTES='; wc -c < CURRENT_STATE.md | tr -d ' '
          printf 'PATCHED_STATE_B64_BEGIN\n'
          base64 -w0 CURRENT_STATE.md
          printf '\nPATCHED_STATE_B64_END\n'
