name: Sync TSK-0452 approved target access 20260905

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-tsk0452-target-access-20260905.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Advance TSK-0452 from WAITING to TODO
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = "da25d90b3d298347adcbf370158c23aae46b2561"
          test "$(git hash-object Plans/Master/MANIFEST.yaml)" = "da35db0fe16009dfb5ce0e24caab05d6d02c84ed"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "357c5e1be3b455e7efddd329d6a2468e3125b502"
          test "$(git hash-object Plans/Master/RELATIONSHIP_INDEX.yaml)" = "862c9167dc37ceb12415208065327fd1903edbcc"
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('CURRENT_STATE.md')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['checkpoint_schema'] == 'serial-light-checkpoint-v1'
          assert data['project_id'] == 'UseSafeWeb.com'
          assert data['governance_mode'] == 'SERIAL_LIGHT'
          assert data['checkpoint_revision'] == 16
          assert data['baseline']['version'] == 1
          assert data['runtime']['project_status'] == 'ACTIVE'
          assert data['runtime']['governance_blocker'] is None

          items = {x['id']: x for x in data['runtime']['items']}
          assert items['TSK-0489']['status'] == 'PASS'
          assert items['TSK-0490']['status'] == 'PASS'
          assert items['TSK-0452']['status'] == 'WAITING'
          assert items['TSK-0243']['status'] == 'WAITING'
          assert items['TSK-0361']['status'] == 'PASS'
          assert not any(x['status'] == 'TODO' for x in data['runtime']['items'])

          # Owner explicitly selected/re-authorized the existing targets on 2026-09-05:
          # DNS 52.157.109.120 and web 20.71.90.212, both via GitHub.
          # Fresh read-only evidence proved the GitHub-bound machines and required host access:
          # DNS run 33966585612/job 101307674698 -> adguardvm, Ubuntu 24.04, sudo,
          # AdGuard active, outbound IP 52.157.109.120, port 53 listener.
          # Web transport run 33966551601/job 101307582123 in Yaserbayad/erp.hmg.test ->
          # hmgweb, Ubuntu 24.04, sudo, Nginx active, outbound IP 20.71.90.212,
          # usesafeweb.com server name present.
          t = items['TSK-0452']
          t['status'] = 'TODO'
          t.pop('wait', None)
          t.pop('wait_details', None)

          v = items['TSK-0243']
          v['wait'] = {
            'condition': 'The owner-selected target/access prerequisite is now established: GitHub reaches DNS host adguardvm at 52.157.109.120 and web host hmgweb at 20.71.90.212 with Ubuntu 24.04 and non-interactive sudo. TSK-0243 still requires the actual controlled direct-host deployment/enablement and then current public functional verification; the present HTTP 502/challenge TLS state is therefore an undeployed runtime condition, not a missing-target condition.',
            'resolution_check': 'Complete the current AUTO_ALLOWED TSK-0452 direct-host deployment/health/rollback acceptance on the approved hosts. Then rerun the bounded read-only TSK-0243 public preflight. Only when public application/API health and challenge-host TLS/SNI/probe routing are healthy may the gated TSK-0243 functional target proof proceed under its own current authority.',
            'reference': 'Owner target instruction 2026-09-05; DNS binding run 33966585612 job 101307674698; web binding run 33966551601 job 101307582123; WBS TSK-0452 AUTO_ALLOWED; TSK-0489 and TSK-0490 PASS.'
          }
          v['wait_details'] = {
            'condition': 'Target identity/access is proven; deployment/enablement and current target functional proof remain outstanding.',
            'resolution_check': 'After TSK-0452 deployment acceptance, rerun the existing TSK-0243 public preflight and proceed only on healthy current target evidence.',
            'references': [
              'UseSafeWeb DNS runner adguardvm -> 52.157.109.120; Ubuntu 24.04; sudo PASS; AdGuard active; port 53 listener.',
              'Cross-repo transport runner hmgweb -> 20.71.90.212; Ubuntu 24.04; sudo PASS; Nginx active; usesafeweb.com configured.'
            ]
          }

          data['checkpoint_revision'] = 17
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          chk = json.loads(p.read_text(encoding='utf-8'))
          assert chk['checkpoint_revision'] == 17
          assert chk['baseline']['version'] == 1
          by_id = {x['id']: x for x in chk['runtime']['items']}
          assert by_id['TSK-0452']['status'] == 'TODO'
          assert 'wait' not in by_id['TSK-0452'] and 'wait_details' not in by_id['TSK-0452']
          assert by_id['TSK-0243']['status'] == 'WAITING'
          assert sum(1 for x in chk['runtime']['items'] if x['status'] == 'TODO') == 1
          PY
          test "$(git diff --name-only)" = "CURRENT_STATE.md"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: authorize approved TSK-0452 targets'
          git push origin HEAD:main
