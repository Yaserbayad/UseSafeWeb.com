name: Temporary TSK-0453 guarded runtime sync

on:
  push:
    branches:
      - state/tsk-0453-source-waiting-20260903

permissions:
  contents: write

jobs:
  sync-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: state/tsk-0453-source-waiting-20260903
          fetch-depth: 1
      - name: Guard, append truthful WAITING state, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object CURRENT_STATE.md)" = '4e2c3e97a6b9f0a705f7547f360ae3b43d4aac37'
          test "$(git hash-object TSK_0453_QUALITY_AND_REVIEW_RULES_SOURCE_CHECKPOINT_2026-09-03.md)" = '2a06fed6987bd81e465f21a7fd5adeae0442a0ab'
          python3 Plans/Master/Tools/validate_master_plan.py
          marker='## TSK-0453 current accepted stable state — 2026-09-03 — SOURCE/POLICY VERIFIED; REVIEW ENFORCEMENT WAITING'
          if grep -Fq "$marker" CURRENT_STATE.md; then
            echo 'TSK-0453 runtime marker already present; refusing duplicate append.' >&2
            exit 1
          fi
          printf '%s' '' | base64 -d >> CURRENT_STATE.md
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state(TSK-0453): record review-enforcement WAITING checkpoint'
          git push origin HEAD:state/tsk-0453-source-waiting-20260903
