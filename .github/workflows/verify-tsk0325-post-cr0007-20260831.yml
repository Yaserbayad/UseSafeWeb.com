name: Verify post-CR-0007 TSK-0325 acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0325-post-cr0007-20260831.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact current TSK-0325 acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/verify_tsk0325_post_cr0007_20260831.py
          git diff --check
          test -z "$(git status --porcelain)"
# rerun after semantic lifecycle assertion correction
