name: Verify AdGuard filtering policy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adguard-filter-policy-acceptance.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify TSK-0512 filtering policy, exception, and rollback
        id: regression
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          sudo -n true
          systemctl is-active --quiet AdGuardHome.service

          secret='/var/lib/usesafeweb/adguard/admin.env'
          [[ "$(sudo stat -c '%a %U:%G' "$secret")" == '600 root:root' ]]
          username="$(sudo awk -F= '$1=="ADGUARD_ADMIN_USER" {sub(/^[^=]*=/,""); print; exit}' "$secret")"
          password="$(sudo awk -F= '$1=="ADGUARD_ADMIN_PASSWORD" {sub(/^[^=]*=/,""); print; exit}' "$secret")"
          [[ -n "$username" && -n "$password" ]]
          base='http://127.0.0.1:3000/control'

          curl --silent --show-error --fail --max-time 10 --user "$username:$password" "$base/filtering/status" -o /tmp/usw-filter-before.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/usw-filter-before.json',encoding='utf-8'))
          active=[x.get('url') for x in (s.get('filters') or []) if x.get('enabled')]
          inactive=[x.get('url') for x in (s.get('filters') or []) if not x.get('enabled')]
          assert s.get('enabled') is True, s.get('enabled')
          assert active == ['https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt'], active
          assert 'https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt' in inactive, inactive
          assert (s.get('whitelist_filters') or []) == [], s.get('whitelist_filters')
          assert (s.get('user_rules') or []) == [], 'unexpected pre-existing user rules'
          json.dump({'rules':s.get('user_rules') or []},open('/tmp/usw-filter-restore.json','w',encoding='utf-8'),separators=(',',':'))
          print('baseline_filtering_enabled=true')
          print('baseline_active_filter_count=1')
          print('baseline_active_filter=AdGuard_DNS_filter')
          print('baseline_whitelist_filter_count=0')
          print('baseline_user_rule_count=0')
          PY

          test_domain="usesafeweb-policy-$RANDOM-$RANDOM.invalid"
          printf '%s' "$test_domain" > /tmp/usw-filter-test-domain

          check_host() {
            curl --silent --show-error --fail --max-time 10 --user "$username:$password" \
              --get --data-urlencode "name=$test_domain" --data-urlencode 'qtype=A' \
              "$base/filtering/check_host" -o "$1"
          }

          wait_reason() {
            expected="$1"
            outfile="$2"
            attempts=0
            for i in $(seq 1 100); do
              attempts="$i"
              check_host "$outfile"
              if EXPECTED="$expected" python3 - "$outfile" <<'PY'
          import json, os, sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          raise SystemExit(0 if r.get('reason') == os.environ['EXPECTED'] else 1)
          PY
              then
                printf '%s' "$attempts"
                return 0
              fi
              sleep 0.1
            done
            return 1
          }

          check_host /tmp/usw-filter-check-baseline.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/usw-filter-check-baseline.json',encoding='utf-8'))
          assert r.get('reason') == 'NotFilteredNotFound', r
          print('synthetic_baseline_reason=NotFilteredNotFound')
          PY

          python3 - <<'PY'
          import json
          d=open('/tmp/usw-filter-test-domain',encoding='utf-8').read().strip()
          json.dump({'rules':['||'+d+'^']},open('/tmp/usw-filter-block.json','w',encoding='utf-8'),separators=(',',':'))
          json.dump({'rules':['||'+d+'^','@@||'+d+'^']},open('/tmp/usw-filter-allow.json','w',encoding='utf-8'),separators=(',',':'))
          PY

          mutated=0
          cleanup() {
            if [[ "$mutated" == '1' ]]; then
              curl --silent --show-error --fail --max-time 10 --user "$username:$password" \
                --header 'Content-Type: application/json' --data-binary @/tmp/usw-filter-restore.json \
                "$base/filtering/set_rules" >/dev/null 2>&1 || true
            fi
            rm -f /tmp/usw-filter-before.json /tmp/usw-filter-restore.json /tmp/usw-filter-test-domain \
              /tmp/usw-filter-check-baseline.json /tmp/usw-filter-block.json /tmp/usw-filter-allow.json \
              /tmp/usw-filter-check-block.json /tmp/usw-filter-check-allow.json /tmp/usw-filter-check-restored.json \
              /tmp/usw-filter-after.json
          }
          trap cleanup EXIT

          mutated=1
          curl --silent --show-error --fail --max-time 10 --user "$username:$password" \
            --header 'Content-Type: application/json' --data-binary @/tmp/usw-filter-block.json \
            "$base/filtering/set_rules" >/dev/null
          block_attempts="$(wait_reason FilteredBlackList /tmp/usw-filter-check-block.json)"
          echo "synthetic_block_reason=FilteredBlackList"
          echo "block_convergence_poll_attempts=$block_attempts"

          curl --silent --show-error --fail --max-time 10 --user "$username:$password" \
            --header 'Content-Type: application/json' --data-binary @/tmp/usw-filter-allow.json \
            "$base/filtering/set_rules" >/dev/null
          allow_attempts="$(wait_reason NotFilteredWhiteList /tmp/usw-filter-check-allow.json)"
          echo "synthetic_exception_reason=NotFilteredWhiteList"
          echo "exception_convergence_poll_attempts=$allow_attempts"

          curl --silent --show-error --fail --max-time 10 --user "$username:$password" \
            --header 'Content-Type: application/json' --data-binary @/tmp/usw-filter-restore.json \
            "$base/filtering/set_rules" >/dev/null
          rollback_attempts="$(wait_reason NotFilteredNotFound /tmp/usw-filter-check-restored.json)"
          curl --silent --show-error --fail --max-time 10 --user "$username:$password" "$base/filtering/status" -o /tmp/usw-filter-after.json

          python3 - <<'PY'
          import json
          before=json.load(open('/tmp/usw-filter-before.json',encoding='utf-8'))
          after=json.load(open('/tmp/usw-filter-after.json',encoding='utf-8'))
          restored=json.load(open('/tmp/usw-filter-check-restored.json',encoding='utf-8'))
          assert restored.get('reason') == 'NotFilteredNotFound', restored
          assert (after.get('user_rules') or []) == (before.get('user_rules') or []) == []
          assert after.get('enabled') is True
          assert [(x.get('url'),bool(x.get('enabled'))) for x in after.get('filters') or []] == [(x.get('url'),bool(x.get('enabled'))) for x in before.get('filters') or []]
          assert (after.get('whitelist_filters') or []) == (before.get('whitelist_filters') or []) == []
          print('synthetic_rollback_reason=NotFilteredNotFound')
          print('user_rules_restored_exactly=true')
          print('filter_list_state_unchanged=true')
          PY
          echo "rollback_convergence_poll_attempts=$rollback_attempts"
          mutated=0
          unset password

          sudo python3 - /opt/AdGuardHome/AdGuardHome.yaml <<'PY'
          import sys, yaml
          with open(sys.argv[1],encoding='utf-8') as f: d=yaml.safe_load(f)
          dns=d.get('dns') or {}; fs=d.get('filtering') or {}
          filters=d.get('filters') or []
          active=[x.get('url') for x in filters if x.get('enabled')]
          assert fs.get('protection_enabled') is True
          assert fs.get('filtering_enabled') is True
          assert fs.get('blocking_mode') == 'default'
          assert active == ['https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt'], active
          assert (d.get('whitelist_filters') or []) == []
          assert (d.get('user_rules') or []) == []
          assert list(dns.get('upstream_dns') or []) == ['https://dns10.quad9.net/dns-query']
          assert bool((dns.get('edns_client_subnet') or {}).get('enabled')) is False
          assert (d.get('querylog') or {}).get('enabled') is False
          assert dns.get('anonymize_client_ip') is True
          assert (d.get('statistics') or {}).get('enabled') is False
          print('persisted_policy_matches_v1=true')
          print('privacy_upstream_invariants_preserved=true')
          PY

          python3 - <<'PY'
          import random, socket, struct
          name='example.com'
          q=b''.join(bytes([len(x)])+x.encode() for x in name.split('.'))+b'\x00'
          pkt=struct.pack('!HHHHHH',random.randrange(0,65536),0x0100,1,0,0,0)+q+struct.pack('!HH',1,1)
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(4); s.sendto(pkt,('127.0.0.1',53))
          r,_=s.recvfrom(4096); s.close()
          rcode=struct.unpack('!H',r[2:4])[0] & 0xF
          answers=struct.unpack('!H',r[6:8])[0]
          assert rcode == 0 and answers > 0, (rcode,answers)
          print('post_rollback_example_resolution=true')
          print('post_rollback_example_answer_count='+str(answers))
          PY

          echo 'TSK_0512_ACCEPTANCE=PASS'

      - name: Publish deterministic TSK-0512 run result
        if: always()
        shell: bash
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          set -Eeuo pipefail
          workflow_blob="$(git hash-object .github/workflows/adguard-filter-policy-acceptance.yml)"
          policy_blob="$(git hash-object infrastructure/adguard-server/filter-policy-v1.yaml)"
          state_blob="$(git hash-object CURRENT_STATE.md)"
          result_path='TSK_0512_FILTER_REGRESSION_RESULT_2026-08-28.md'
          if [[ "$REGRESSION_OUTCOME" == 'success' ]]; then
            cat > "$result_path" <<EOF
          # TSK-0512 — Filtering Regression Result

          **Date:** 2026-08-28  
          **Run source commit:** \`${GITHUB_SHA}\`  
          **Target:** production host \`adguardvm\`  
          **Regression outcome:** **PASS**

          - Workflow blob: \`${workflow_blob}\`
          - Filter policy blob: \`${policy_blob}\`
          - CURRENT_STATE blob at run checkout: \`${state_blob}\`
          - Exact active baseline asserted: one enabled AdGuard DNS filter; no whitelist filters; no pre-existing user rules.
          - Randomized reserved \`.invalid\` synthetic name was verified unfiltered before mutation.
          - Temporary exact block was verified as \`FilteredBlackList\`.
          - Matching narrow allow exception was verified as \`NotFilteredWhiteList\`.
          - Exact pre-test user-rule set was restored and filter-list state remained unchanged.
          - Persisted protection/filtering/default-blocking, Quad9 dns10, ECS-off, query-log-off, anonymisation-on and statistics-off invariants all passed assertions.
          - Post-rollback \`example.com\` resolved successfully with at least one DNS answer.
          - Cleanup/rollback assertions completed before this PASS result was published.
          - No participant browsing history or raw DNS history was collected or retained.

          ACC-0512 requires expected blocked tests to fail safely, allowed tests to resolve, the exception workflow to work, and results to be recorded without participant browsing history. **All applicable criteria are directly covered by this successful target-environment assertion run.**

          **Stable acceptance result: TSK-0512 = PASS.**
          EOF
          else
            cat > "$result_path" <<EOF
          # TSK-0512 — Filtering Regression Result

          **Date:** 2026-08-28  
          **Run source commit:** \`${GITHUB_SHA}\`  
          **Target:** production host \`adguardvm\`  
          **Regression outcome:** **FAILURE — NOT ACCEPTED**

          - Workflow blob: \`${workflow_blob}\`
          - Filter policy blob: \`${policy_blob}\`
          - CURRENT_STATE blob at run checkout: \`${state_blob}\`
          - The assertion-based production regression did not complete successfully.
          - No TSK-0512 PASS is claimed from this run.
          - The test contains a cleanup trap that attempts restoration of the exact pre-test user-rule set if a temporary rule mutation had begun.

          **Stable task disposition from this evidence alone: TSK-0512 remains not-PASS pending failure diagnosis and direct recovery verification.**
          EOF
          fi
          git config user.name "UseSafeWeb QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$result_path"
          git commit -m "evidence: record TSK-0512 regression result"
          git push origin HEAD:main
