name: Inspect TSK-0332 browser runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tsk0332-browser-runtime-20260831.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Inspect browser runtime locations
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          bash .github/scripts/inspect_tsk0332_browser_runtime_20260831.sh
          git diff --check
          test -z "$(git status --porcelain)"
