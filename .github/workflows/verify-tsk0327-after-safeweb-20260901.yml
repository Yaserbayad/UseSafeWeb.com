name: Verify TSK-0327 after SafeWeb correction
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/verify_tsk0327_after_safeweb_20260901.py'
      - '.github/workflows/verify-tsk0327-after-safeweb-20260901.yml'
      - 'prototype/TSK-0327/POST_CR0007_FINDINGS_DISPOSITION.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify TSK-0327 against corrected TSK-0333
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/verify_tsk0327_after_safeweb_20260901.py
          git diff --check
          test -z "$(git status --porcelain)"
