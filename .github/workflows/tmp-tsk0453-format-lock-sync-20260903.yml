name: Temporary TSK-0453 formatter baseline sync

on:
  push:
    branches:
      - feature/tsk-0453-quality-review-rules-20260903

permissions:
  contents: write

jobs:
  sync-format-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/tsk-0453-quality-review-rules-20260903
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - name: Update lockfile, format deterministically, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object website/package.json)" = 'f725be68a7edf82b83620beaf3bb00980bec5f58'
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py

          cd website
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm ci --ignore-scripts --no-fund --no-audit
          test "$(node -p "require('./node_modules/prettier/package.json').version")" = '3.9.6'
          npm run format
          npm run format:check
          node --test tests/contract/tsk0453.test.mjs
          npm run lint
          npm run typecheck
          cd ..

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website
          if git diff --cached --quiet; then
            echo 'No formatter baseline changes to commit.'
            exit 0
          fi
          git commit -m 'style(TSK-0453): establish deterministic formatter baseline'
          git push origin HEAD:feature/tsk-0453-quality-review-rules-20260903
