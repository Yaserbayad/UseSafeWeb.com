name: TSK-0309 implementation-ready baseline acceptance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tsk0309-freeze-acceptance.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/azureusr/.cache/usesafeweb-playwright
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Pre-test production health snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          systemctl is-active --quiet AdGuardHome.service
          systemctl is-active --quiet nginx.service
          AGH_CONFIG="$(sudo find /opt/AdGuardHome -maxdepth 2 -type f -name AdGuardHome.yaml -print -quit)"
          [[ -n "$AGH_CONFIG" ]]
          printf '%s\n' "$AGH_CONFIG" > /tmp/tsk0309-agh-path
          sudo sha256sum "$AGH_CONFIG" | awk '{print $1}' > /tmp/tsk0309-agh-before
          sudo sh -c 'find /etc/nginx -xdev -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk "{print \$1}"' > /tmp/tsk0309-nginx-before
          ss -H -lntu | awk '{print $1, $5}' | sort -u > /tmp/tsk0309-listeners-before
          systemctl --failed --no-legend --plain | awk '{print $1}' | sort -u > /tmp/tsk0309-failed-before
          echo 'TSK0309_PRE_HEALTH=PASS'

      - name: Verify frozen baseline contract and source currency
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv, json, pathlib, subprocess
          root=pathlib.Path('.')
          m=json.loads((root/'prototype/TSK-0309/BASELINE_MANIFEST.json').read_text(encoding='utf-8'))
          assert m['schema']=='usesafeweb.experience-baseline.v1'
          assert m['task_id']=='TSK-0309' and m['version']=='1.0.0'
          assert m['status']=='frozen_internal_l4'
          assert m['decision_basis']==['DEC-0052','CR-0005']
          assert m['human_validation_claim'] is False
          assert m['release_authority'] is False
          assert m['defect_disposition']['critical_high_open']==0
          assert m['defect_disposition']['prototype_code_change_required'] is False
          assert len(m['screens'])==11 and len(set(m['screens']))==11
          assert len(m['evidence_states'])==6 and len(set(m['evidence_states']))==6
          assert m['platform_configuration']['android_private_dns_hostname']=='dns.usesafeweb.com'
          assert m['platform_configuration']['iphone_doh_url']=='https://dns.usesafeweb.com/dns-query'
          assert m['critical_journey']==['start','configure','verify','understand','troubleshoot','recover','remove','reset_reconfigure']
          assert {'REQ-0028','REQ-0029','REQ-0031'}==set(m['requirements'])
          assert {'INT-0009','INT-0010'}==set(m['interfaces'])
          assert {'CON-0010','CON-0017','CON-0023','CON-0025'}==set(m['constraints'])
          assert {'mandatory_account','customer_account_dashboard','customer_facing_adguard_admin','child_account','browsing_activity_history','broad_dns_admin_console','native_app','school_portal','public_api_integration_platform','card_trial_payment_before_core_value'}==set(m['scope_exclusions'])
          def blob(path):
              return subprocess.check_output(['git','hash-object',path],text=True).strip()
          for group in ('artifacts','governing_sources'):
              items=m[group].values() if isinstance(m[group],dict) else m[group]
              for item in items:
                  actual=blob(item['path'])
                  assert actual==item['git_blob'], (item['path'],actual,item['git_blob'])
          baseline=(root/'prototype/TSK-0309/BASELINE.md').read_text(encoding='utf-8')
          for needle in ('No unresolved **critical/high pre-product defect**','no Login or customer account/dashboard surface','parent confirmation is never system verification','dns.usesafeweb.com','https://dns.usesafeweb.com/dns-query','English, Turkish, and Arabic/RTL','without product-code changes'):
              assert needle in baseline, needle
          with (root/'Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8',newline='') as f:
              by={r['Task_ID']:r for r in csv.DictReader(f)}
          r=by['TSK-0309']
          assert r['Lifecycle_Stage']=='L4' and 'AUTO_ALLOWED' in r.values()
          assert set(x.strip() for x in r['Dependencies'].split(';'))=={'TSK-0310','TSK-0187'}
          assert by['TSK-0187']['Plan_Status']=='NOT_APPLICABLE' and by['TSK-0187']['Execution_State']=='PASS'
          assert 'No real-user comprehension claim is required or inferred before L8.' in r['Acceptance_Criteria']
          model=(root/'prototype/TSK-0310/model.mjs').read_text(encoding='utf-8')
          for screen in m['screens']:
              assert repr(screen) in model
          for state in m['evidence_states']:
              assert repr(state) in model
          assert "result === 'verified'" in model and "EVIDENCE_STATE.VERIFIED" in model
          print('TSK0309_BASELINE_MANIFEST=PASS')
          print('TSK0309_SOURCE_BLOBS=PASS')
          print('TSK0309_SCOPE_INVARIANTS=PASS')
          print('TSK0309_WBS_AUTHORITY=PASS')
          print('TSK0309_MODEL_CONFORMANCE=PASS')
          PY

      - name: Provision Node 22 and verify retained Chromium
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare browser verifier
        shell: bash
        working-directory: prototype/TSK-0310
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-fund
          npm audit --audit-level=high
          CHROME="$PLAYWRIGHT_BROWSERS_PATH/chromium-1234/chrome-linux64/chrome"
          [[ -x "$CHROME" ]]
          npx playwright --version
          "$CHROME" --version
          echo 'TSK0309_CHROMIUM_CAPABILITY=PASS'

      - name: Run frozen rendered acceptance suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/tsk0309-http.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" >/dev/null 2>&1 || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/prototype/TSK-0310/ >/dev/null; then ready=1; break; fi
            sleep 0.25
          done
          [[ "$ready" == 1 ]]
          node prototype/TSK-0310/browser-acceptance.mjs | tee /tmp/tsk0309-browser.log
          grep -qx 'BROWSER_ACCEPTANCE=PASS' /tmp/tsk0309-browser.log
          grep -qx 'BROWSER_ACCEPTANCE_CHECKS=218' /tmp/tsk0309-browser.log
          cleanup
          trap - EXIT
          ! ss -H -lnt | awk '{print $4}' | grep -Eq '(^|:)4173$'
          echo 'TSK0309_RENDERED_REGRESSION=PASS'

      - name: Post-test production invariants
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          systemctl is-active --quiet AdGuardHome.service
          systemctl is-active --quiet nginx.service
          AGH_CONFIG="$(cat /tmp/tsk0309-agh-path)"
          sudo sha256sum "$AGH_CONFIG" | awk '{print $1}' > /tmp/tsk0309-agh-after
          sudo sh -c 'find /etc/nginx -xdev -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk "{print \$1}"' > /tmp/tsk0309-nginx-after
          cmp /tmp/tsk0309-agh-before /tmp/tsk0309-agh-after
          cmp /tmp/tsk0309-nginx-before /tmp/tsk0309-nginx-after
          ss -H -lntu | awk '{print $1, $5}' | sort -u > /tmp/tsk0309-listeners-after
          cmp /tmp/tsk0309-listeners-before /tmp/tsk0309-listeners-after
          ! ss -H -lnt | awk '{print $4}' | grep -Eq '(^|:)4173$'
          systemctl --failed --no-legend --plain | awk '{print $1}' | sort -u > /tmp/tsk0309-failed-after
          cmp /tmp/tsk0309-failed-before /tmp/tsk0309-failed-after
          echo 'TSK0309_ADGUARD_CONFIG_UNCHANGED=PASS'
          echo 'TSK0309_NGINX_CONFIG_UNCHANGED=PASS'
          echo 'TSK0309_LISTENERS_UNCHANGED=PASS'
          echo 'TSK0309_FAILED_UNITS_UNCHANGED=PASS'
          echo 'TSK0309_POST_HEALTH=PASS'
