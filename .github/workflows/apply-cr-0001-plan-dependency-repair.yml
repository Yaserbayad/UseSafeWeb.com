name: Apply CR-0001 plan dependency repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-cr-0001-plan-dependency-repair.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-plan-authority
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and validate bounded CR-0001
        shell: bash
        env:
          EXPECTED_OLD_PLANS_TREE: e6c78a67a191e04ea85fbb68caf18b854067c3de
          EXPECTED_NEW_PLANS_TREE: c42616e92f0624aaf5caf788b2383a1402393dfd
          EXPECTED_SUMS_SHA256: 99d0c0bc4d1f48ff4c92e6e126e08343b0fc9ed615a2158d7b143cf1da4ccf7a
          EXPECTED_WBS_SHA256: e9953d94b2b4f04f48640c3eaca909f9e61f4c0814c03019faa06e3c7b5adbac
          EXPECTED_REL_SHA256: 7aa06dbbfa296c325ba02834c4bf4b5a25347e3e0da1672fc0b710c95e93effd
          EXPECTED_MANIFEST_SHA256: 8d520120cb90ecf9c446ef31da959a6d0d22b938c546997027cc643fb809c2fe
          EXPECTED_CR_SHA256: 4f951af9ada8d30881c31c55223261ce2e6887289e011c8b4482aab256f7b312
          EXPECTED_VALIDATION_REPORT_SHA256: 9839c945f2b564e7e850cbd26ea0fee114e961f302a4ac951aed3c3665bfd563
          EXPECTED_GENERATED_SHA256: 3e0e27aeedc7b9b17838f139a2ce7ae53f9070385b3f38269479ae354102def4
        run: |
          set -Eeuo pipefail
          export LC_ALL=C

          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ -z "$(git status --porcelain)" ]]

          old_plans_tree="$(git rev-parse HEAD:Plans)"
          echo "old_plans_tree=${old_plans_tree}"
          [[ "${old_plans_tree}" == "${EXPECTED_OLD_PLANS_TREE}" ]]

          python3 - <<'PY'
          from pathlib import Path
          import csv, re

          ROOT=Path('Plans')
          WBS=ROOT/'Master/WBS/master-wbs.csv'
          REL=ROOT/'Master/RELATIONSHIP_INDEX.yaml'
          CR=ROOT/'Master/Registers/EXCEPTIONS_CHANGE_CONTROLS.md'
          MAN=ROOT/'Master/MANIFEST.yaml'
          VR=ROOT/'Master/VALIDATION_REPORT.md'

          with WBS.open('r',encoding='utf-8-sig',newline='') as f:
              reader=csv.DictReader(f)
              fields=reader.fieldnames
              rows=list(reader)
          by={r['Task_ID']:r for r in rows}
          assert by['TSK-0203']['Dependencies']=='TSK-0483; TSK-0011'
          assert by['TSK-0483']['Dependencies']=='TSK-0436; TSK-0011'
          by['TSK-0203']['Dependencies']='TSK-0011'
          by['TSK-0483']['Dependencies']='TSK-0203; TSK-0436; TSK-0011'
          with WBS.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n')
              w.writeheader(); w.writerows(rows)

          text=REL.read_text(encoding='utf-8')
          def task_block(txt, tid):
              m=re.search(rf'(?ms)^  {re.escape(tid)}:\n.*?(?=^  [A-Za-z0-9_.:-]+:\n|\Z)', txt)
              assert m, tid
              return m
          m=task_block(text,'TSK-0203')
          b=m.group(0)
          old='    - target: TSK-0483\n      type: depends_on\n'
          assert b.count(old)==1
          text=text[:m.start()]+b.replace(old,'',1)+text[m.end():]
          m=task_block(text,'TSK-0483')
          b=m.group(0)
          anchor='    - target: TSK-0436\n      type: depends_on\n'
          assert b.count(anchor)==1
          insert='    - target: TSK-0203\n      type: depends_on\n'
          text=text[:m.start()]+b.replace(anchor,insert+anchor,1)+text[m.end():]
          REL.write_text(text,encoding='utf-8')

          cr=CR.read_text(encoding='utf-8')
          assert 'CR-0001' not in cr
          record='''\n## Post-freeze material change records\n\n| Change | Date | Affected authority | Owner/authority basis | Decision | Impact analysis | Implementation / migration | Rollback | Verification / evidence | Canonical read-back |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| CR-0001 | 2026-08-27 | WBS dependency graph; relationship index; generated reconstruction/checksums only. No task IDs, titles, scope, statuses, acceptance criteria, gates, objectives, requirements, constraints, interfaces, risks, action authority, or owner decisions change. | Actual technical execution evidence on the accepted fresh AdGuard VM demonstrated that ACC-0483 requires a running/configurable resolver, while frozen `TSK-0203` incorrectly depended on `TSK-0483`; actual technical reality outranks an impossible planning edge. Owner already authorized autonomous execution and bounded corrections required for correct governed execution. | Reverse the single dependency edge: remove `TSK-0483 -> TSK-0203` (meaning TSK-0203 depends on TSK-0483) and instead require `TSK-0203` before `TSK-0483`. Keep `TSK-0483` mandatory before any public resolver activation. | Enables installation of the supported AdGuard release before live resolver-abuse controls can be implemented/tested. Preserves all current acceptance/evidence/gate semantics and 849 total dependency edges. Existing PASS evidence remains valid; no task is promoted to PASS by this change. | Update only the two WBS dependency cells and matching `depends_on` relationships; rebuild `Generated/MASTER_PLAN_FULL.md`; regenerate checksums; run full deterministic validator; publish/read back exact changed planning tree. | Reapply the prior two dependency cells/relationship edges from the owner-frozen tree `e6c78a67a191e04ea85fbb68caf18b854067c3de` if current technical evidence later disproves this repair. | Full validator must remain PASS with 641 tasks, 849 dependency edges, zero dependency cycles, zero broken links, all relationship targets valid, every task present in generated reconstruction, and all checksum entries valid. | Pending bounded GitHub publication and exact read-back at record creation; must be filled by runtime evidence before later governed work relies on the corrected edge. |\n'''
          marker='\nMaterial change records use `CR-xxxx`'
          assert marker in cr
          CR.write_text(cr.replace(marker,record+marker,1),encoding='utf-8')

          man=MAN.read_text(encoding='utf-8')
          old_status='status: 2.0-owner-frozen / OWNER_FREEZE_2026-08-27 / OWNER_TECHNICAL_COMMERCIAL_AMENDMENT_APPLIED / OWNER_LEGAL_HOLD_ACTIVE_TO_2027-08-27 / OWNER_AZURE_HANDOFF_BOUNDARY_APPLIED_2026-08-27 / deterministic validation PASS / canonical activation requires verified GitHub main publication-readback and CURRENT_STATE rebaseline'
          new_status='status: 2.0-owner-frozen / OWNER_FREEZE_2026-08-27 / OWNER_TECHNICAL_COMMERCIAL_AMENDMENT_APPLIED / OWNER_LEGAL_HOLD_ACTIVE_TO_2027-08-27 / OWNER_AZURE_HANDOFF_BOUNDARY_APPLIED_2026-08-27 / POST_FREEZE_CR_0001_DEPENDENCY_REPAIR_2026-08-27 / deterministic validation PASS / canonical activation established; post-freeze CR requires verified GitHub publication-readback before reliance'
          assert man.count(old_status)==1
          man=man.replace(old_status,new_status,1)
          anchor='  canonical_activation_condition: TSK-0009 publication PASS plus TSK-0011 exact GitHub read-back PASS; volatile execution state is then rebaselined in repository CURRENT_STATE.md under TSK-0010\n'
          assert anchor in man
          addition='''\npost_freeze_change_control:\n  latest_change: CR-0001\n  date: '2026-08-27'\n  status: bounded technical dependency repair; owner freeze remains in force; canonical reliance requires deterministic validation plus GitHub publication/read-back\n  authority: actual technical execution evidence plus existing owner-authorized governed autonomy; no product/scope/acceptance/gate/authority decision changed\n  affected_tasks:\n  - TSK-0203\n  - TSK-0483\n  semantic_delta: install supported AdGuard release before implementing/testing live resolver abuse/amplification controls; TSK-0483 remains mandatory before public resolver activation\n  change_record: Registers/EXCEPTIONS_CHANGE_CONTROLS.md#post-freeze-material-change-records\n'''
          MAN.write_text(man.replace(anchor,anchor+addition,1),encoding='utf-8')

          vr=VR.read_text(encoding='utf-8').rstrip()+'\n'
          assert '## Post-freeze CR-0001 validation' not in vr
          vr += '''\n## Post-freeze CR-0001 validation — 2026-08-27\n\n**Scope:** bounded correction of one technically impossible dependency edge discovered during direct target execution after canonical activation. This section does not rewrite the historical pre-canonicalization audit above.\n\n### Defect\n\nFrozen `TSK-0203 — Install supported AdGuard release` depended on `TSK-0483 — Implement resolver abuse and amplification protections`, while ACC-0483 requires live resolver rate-limiting/denial/amplification controls to be implemented and tested. Direct target evidence proved the accepted fresh VM had no resolver before AdGuard installation, so the dependency was impossible to satisfy without fabricating evidence.\n\n### Correction\n\n- `TSK-0203` dependencies: `TSK-0483; TSK-0011` → `TSK-0011`.\n- `TSK-0483` dependencies: `TSK-0436; TSK-0011` → `TSK-0203; TSK-0436; TSK-0011`.\n- Matching task `depends_on` edges in `RELATIONSHIP_INDEX.yaml` are reversed identically.\n- No task ID, title, scope, planning/runtime status, acceptance criterion, gate, requirement, constraint, interface, risk, AI capability, action authority, or owner decision changes.\n- `TSK-0483` remains mandatory before public resolver activation.\n- Total WBS dependency-edge count remains 849.\n\n### Required verification\n\nThe post-change tree is acceptable only if the deterministic validator reports PASS with 641 tasks, 849 dependency edges, no dependency cycle, valid relationship entities/targets/sources, zero broken local links, every task present in the generated reconstruction, and all regenerated checksums valid. GitHub publication plus exact read-back is additionally required before governed execution may rely on CR-0001.\n'''
          VR.write_text(vr,encoding='utf-8')
          PY

          python3 Plans/Master/Tools/rebuild_master_plan.py
          (
            cd Plans
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | while IFS= read -r -d '' f; do
              sha256sum "${f#./}"
            done
          ) > Plans/SHA256SUMS.txt

          validation="$(python3 Plans/Master/Tools/validate_master_plan.py)"
          printf '%s\n' "${validation}"
          grep -qx 'VALIDATION PASS' <<<"${validation}"
          grep -qx 'tasks=641' <<<"${validation}"
          grep -qx 'dependency_edges=849' <<<"${validation}"
          grep -qx 'broken_links=0' <<<"${validation}"
          grep -qx 'generated_missing_task_ids=0' <<<"${validation}"

          [[ "$(sha256sum Plans/SHA256SUMS.txt | awk '{print $1}')" == "${EXPECTED_SUMS_SHA256}" ]]
          [[ "$(sha256sum Plans/Master/WBS/master-wbs.csv | awk '{print $1}')" == "${EXPECTED_WBS_SHA256}" ]]
          [[ "$(sha256sum Plans/Master/RELATIONSHIP_INDEX.yaml | awk '{print $1}')" == "${EXPECTED_REL_SHA256}" ]]
          [[ "$(sha256sum Plans/Master/MANIFEST.yaml | awk '{print $1}')" == "${EXPECTED_MANIFEST_SHA256}" ]]
          [[ "$(sha256sum Plans/Master/Registers/EXCEPTIONS_CHANGE_CONTROLS.md | awk '{print $1}')" == "${EXPECTED_CR_SHA256}" ]]
          [[ "$(sha256sum Plans/Master/VALIDATION_REPORT.md | awk '{print $1}')" == "${EXPECTED_VALIDATION_REPORT_SHA256}" ]]
          [[ "$(sha256sum Plans/Master/Generated/MASTER_PLAN_FULL.md | awk '{print $1}')" == "${EXPECTED_GENERATED_SHA256}" ]]

          mapfile -t changed < <(git diff --name-only)
          expected=(
            Plans/Master/Generated/MASTER_PLAN_FULL.md
            Plans/Master/MANIFEST.yaml
            Plans/Master/RELATIONSHIP_INDEX.yaml
            Plans/Master/Registers/EXCEPTIONS_CHANGE_CONTROLS.md
            Plans/Master/VALIDATION_REPORT.md
            Plans/Master/WBS/master-wbs.csv
            Plans/SHA256SUMS.txt
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

          git add Plans
          staged_plans_tree="$(git write-tree | xargs -I{} git ls-tree {} Plans | awk '{print $3}')"
          echo "staged_plans_tree=${staged_plans_tree}"
          [[ "${staged_plans_tree}" == "${EXPECTED_NEW_PLANS_TREE}" ]]

          git config user.name 'UseSafeWeb governed automation'
          git config user.email '149335096+Yaserbayad@users.noreply.github.com'
          git commit -m 'CR-0001 repair AdGuard dependency ordering'
          new_commit="$(git rev-parse HEAD)"
          echo "CR_0001_COMMIT=${new_commit}"
          git push origin HEAD:main
          echo 'CR_0001_PUBLICATION=PASS'
