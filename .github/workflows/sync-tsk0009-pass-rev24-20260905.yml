name: Sync TSK-0009 PASS rev24
on:
  push:
    branches: [runtime/tsk0009-pass-rev24-20260905]
    paths: [.github/workflows/sync-tsk0009-pass-rev24-20260905.yml]
permissions:
  contents: write
concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime/tsk0009-pass-rev24-20260905
          fetch-depth: 0
      - name: Persist verified TSK-0009 PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = 'c2cc419ce936dfca10b7811a88ec010a49f1c13c'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('CURRENT_STATE.md')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert d['project_id']=='UseSafeWeb.com'
          assert d['governance_mode']=='SERIAL_LIGHT'
          assert d['checkpoint_revision']==23
          assert d['baseline']['version']==1
          assert d['project_status']=='ACTIVE'
          items={x['id']:x for x in d['runtime']['items']}
          assert items['TSK-0009']['status']=='TODO'
          assert items['TSK-0017']['status']=='PASS'
          t=items['TSK-0009']
          t['status']='PASS'
          t.pop('wait',None); t.pop('blocker',None); t.pop('continuation_note',None)
          t['acceptance_references']=[{
            'ac_id':'ACC-0009',
            'evidence_type':'GITHUB_ACTIONS_RUN',
            'reference':'Yaserbayad/UseSafeWeb.com workflow run 33979284902 on commit a08a77d22f1af3accb4f64369b3bc26560544f1e; evidence artifact tsk0009-publication-verification id 9973256098 digest sha256:7bf2f9643cc8d16a2fd1b4bd1e5eb7897f49257e11f884e90e423885fff53363; historical publication commit fce408f34470c0a0883ab978685b5265fdec4b97; current frozen authority commit 20e2763c0be2124378e3158ac559aed826bc6765',
            'summary':'Bounded verification proved the owner-frozen Plans publication changed only Plans/, had exact SHA256SUMS coverage for all 51 non-checksum files, passed the historical validator with 641 tasks and zero broken/generated-missing links, preserved Generated/MASTER_PLAN_FULL.md as derived non-authority, and revalidated the current frozen planning source.',
            'verification_context':'Source checkpoint revision 23 blob c2cc419ce936dfca10b7811a88ec010a49f1c13c; TSK-0017 PASS; verification run 33979284902 SUCCESS; artifact result=PASS; no deployment, participant, telemetry, payment, production/public, market, launch, profile/certificate or service-removal action.'
          }]
          d['checkpoint_revision']=24
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool CURRENT_STATE.md >/dev/null
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: mark TSK-0009 PASS at checkpoint revision 24'
          git push origin HEAD:runtime/tsk0009-pass-rev24-20260905
