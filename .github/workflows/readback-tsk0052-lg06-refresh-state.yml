name: Retired - Read back refreshed LG-06 state

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retired-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify durable LG-06 state without mutation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '## TSK-0052 / LG-06 current accepted stable state — 2026-09-01 — POST-CR-0007' CURRENT_STATE.md
          grep -Fq '`TSK-0052 / LG-06 — Product, Brand and Experience Freeze`: **PASS**' CURRENT_STATE.md
          grep -Fq 'latest_change: CR-0010' Plans/Master/MANIFEST.yaml
          python3 Plans/Master/Tools/validate_master_plan.py
          echo 'LG06_HISTORICAL_READBACK_WORKFLOW_RETIRED=PASS'
