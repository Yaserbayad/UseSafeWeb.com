name: Reconcile TSK-0302 PASS and queue

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-tsk0302-pass-20260829.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify TSK-0302 and derive next queue
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "6a25d63af125116a80f96ac0f1548b1ddb452a34"
          test "$(git hash-object Plans/Master/MANIFEST.yaml)" = "acadf21483ee3fddd63ee57795126619f92a00f3"
          test "$(git hash-object CURRENT_STATE.md)" = "483f3b891a1cb8f42247b7af5c859eae579efa08"
          test "$(git hash-object brand/concepts/TSK-0302/README.md)" = "59c01476f22147f5567c4d10fd0a0c122056ae23"
          test "$(git hash-object brand/concepts/TSK-0302/direction-a-open-path.svg)" = "73a939877204da3602f31d0f53d5ef38de3f3cce"
          test "$(git hash-object brand/concepts/TSK-0302/direction-b-open-guardrails.svg)" = "0d5fc96aa280b90bdea3046ff80553237f3e3a5d"
          test "$(git hash-object brand/concepts/TSK-0302/direction-c-connected-layers.svg)" = "90dabad2cf77b26fa0480a7c55a97bd24d7c822b"
          test "$(git hash-object TSK_0302_VISUAL_IDENTITY_DIRECTIONS_EVIDENCE_2026-08-29.md)" = "755bca78e66864804549f8645def99a57aeb042f"
          grep -Fq '**ACC-0302: PASS.**' TSK_0302_VISUAL_IDENTITY_DIRECTIONS_EVIDENCE_2026-08-29.md
          grep -Fq 'Final selection/refinement remains HUMAN_ONLY `TSK-0301`' TSK_0302_VISUAL_IDENTITY_DIRECTIONS_EVIDENCE_2026-08-29.md
          grep -Fq 'RSK-0002` remains OPEN' brand/concepts/TSK-0302/README.md
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import csv,re
          runtime=Path('CURRENT_STATE.md')
          text=runtime.read_text(encoding='utf-8')
          assert 'TSK-0302 accepted stable state' not in text
          passed=set()
          m=re.search(r'(?ms)^### PASS\s*$\n(.*?)(?=^### |^## )',text)
          if m:
              passed.update(re.findall(r'^- `?(TSK-\d{4})`?\b',m.group(1),flags=re.M))
          passed.update(re.findall(r'(?m)^### (TSK-\d{4}) accepted stable state\s*$',text))
          passed.update(re.findall(r'(?m)^`(TSK-\d{4})[^`\n]*`:\s*\*\*PASS\b',text))
          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          ids={r['Task_ID'] for r in rows}; passed &= ids
          assert len(passed)==73,(len(passed),sorted(passed))
          assert {'TSK-0298','TSK-0299'} <= passed
          assert 'TSK-0302' not in passed and 'TSK-0301' not in passed and 'TSK-0187' not in passed
          passed.add('TSK-0302')
          candidates=[]
          for idx,r in enumerate(rows):
              if r['Lifecycle_Stage']!='L4' or r['Task_ID'] in passed: continue
              if (r['Plan_Status'] or '').upper() not in {'PLANNED','ACTIVE','IN_PROGRESS'}: continue
              deps={x.strip() for x in re.split(r'[;,]',r['Dependencies'] or '') if x.strip().startswith('TSK-')}
              if deps <= passed:
                  candidates.append((idx,r,deps))
          pri={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          candidates.sort(key=lambda item:(pri.get((item[1]['Priority'] or '').upper(),99), item[0], item[1]['Task_ID']))
          print('POST_TSK0302_PASS_COUNT='+str(len(passed)))
          print('CANDIDATE_COUNT='+str(len(candidates)))
          for _,r,deps in candidates:
              print('CANDIDATE|'+ '|'.join([r['Task_ID'],r['Priority'],r['Action_Authority'],','.join(sorted(deps)),r['Title']]))
          assert candidates,candidates
          selected=candidates[0][1]
          assert selected['Task_ID']=='TSK-0301',[(r['Task_ID'],r['Priority'],r['Action_Authority']) for _,r,_ in candidates]
          assert selected['Action_Authority']=='HUMAN_ONLY',selected
          assert set(x.strip() for x in re.split(r'[;,]',selected['Dependencies']) if x.strip())=={'TSK-0299','TSK-0302'}
          now=datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          text += '''\n\n### TSK-0302 accepted stable state\n\n`TSK-0302 — Develop and evaluate a small set of coherent visual identity directions`: **PASS for provisional internal L4 concept-stage acceptance under DEC-0051/CR-0004**. Evaluation board `brand/concepts/TSK-0302/README.md`, blob `59c01476f22147f5567c4d10fd0a0c122056ae23`; editable masters: A `direction-a-open-path.svg` blob `73a939877204da3602f31d0f53d5ef38de3f3cce`, B `direction-b-open-guardrails.svg` blob `0d5fc96aa280b90bdea3046ff80553237f3e3a5d`, C `direction-c-connected-layers.svg` blob `90dabad2cf77b26fa0480a7c55a97bd24d7c822b`. Acceptance evidence `TSK_0302_VISUAL_IDENTITY_DIRECTIONS_EVIDENCE_2026-08-29.md`, blob `755bca78e66864804549f8645def99a57aeb042f`.\n\nAutomated successful verification run `33246716435` / job `99085341663` proved exactly three concepts, distinct geometry signatures, plain editable/scalable SVG, no raster/font/script/filter/external dependencies, accessible SVG title/description, and all normal-text candidate colours at >=4.5:1 against white. `#C75B12` is explicitly decorative/large-mark-only at 4.26:1, not approved for small normal text.\n\nACC-0302 is satisfied without selecting a final identity or generating downstream asset volume. `RSK-0002` remains OPEN; no parent preference/comprehension, legal completion, build/publication/payment/market/launch authority is inferred.\n\n### Post-TSK-0302 L4 queue and human boundary\n\nFresh dependency derivation with 74 durable PASS task IDs selects `TSK-0301 — Finalize logo system, typography, color, imagery, iconography, visual language, and layout principles` as the next dependency-satisfied L4 task. Its dependencies `TSK-0302; TSK-0299` are now PASS, priority is HIGH, and Action Authority is **HUMAN_ONLY**.\n\nTSK-0301 acceptance requires the Project Owner to approve one identity system. The governor must not self-select A, B or C or fabricate owner approval.\n\n### Exact next authoritative step\n\nPresent the three exact TSK-0302 directions to the Project Owner and obtain one explicit disposition: `SELECT A — Open Path`, `SELECT B — Open Guardrails`, `SELECT C — Connected Layers`, or `REJECT ALL / revise` with the requested change. After explicit owner disposition, refine only the selected/authorized direction into TSK-0301 final identity masters and verify small/mobile/mono/contrast/readability/no-safety-guarantee acceptance before PASS.\n'''
          runtime.write_text(text,encoding='utf-8')
          PY
          git diff --check
      - name: Commit and push runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          git add CURRENT_STATE.md
          git diff --cached --check
          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'state: accept TSK-0302 visual directions'
          git push origin HEAD:main
