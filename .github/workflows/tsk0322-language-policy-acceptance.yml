name: TSK-0322 product language policy acceptance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tsk0322-language-policy-acceptance.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-governance-audit
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify language/claims/terminology contract
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv, json, pathlib, subprocess
          root=pathlib.Path('.')
          guide=(root/'content/TSK-0322/PRODUCT_VOICE_CLAIMS_TERMINOLOGY.md').read_text(encoding='utf-8')
          policy=json.loads((root/'content/TSK-0322/POLICY.json').read_text(encoding='utf-8'))
          assert policy['schema']=='usesafeweb.product-language-policy.v1'
          assert policy['task_id']=='TSK-0322' and policy['version']=='1.0.0'
          assert policy['visible_brand']=='SafeWeb'
          assert policy['domain_identifier']=='UseSafeWeb.com'
          assert policy['parent_facing_dns_term']=='SafeWeb DNS'
          assert policy['technical_endpoints']['android_private_dns_hostname']=='dns.usesafeweb.com'
          assert policy['technical_endpoints']['iphone_doh_url']=='https://dns.usesafeweb.com/dns-query'
          assert policy['voice']==['calm','clear','respectful','protective_not_controlling','truthful','practical','quietly_trustworthy']
          expected=[('S1','Verified'),('S2','You confirmed this is set up'),('S3','Action needed'),('S4','Not covered'),('S5','Status uncertain'),('S6','Removed')]
          assert [(x['id'],x['label']) for x in policy['states']]==expected
          assert policy['human_validation_claim'] is False and policy['publication_authority'] is False
          assert policy['reading_goal']['fixed_numeric_grade_level_authorized'] is False
          assert policy['child_readable']['no_fear_or_shame'] and policy['child_readable']['no_surveillance_framing']
          assert policy['localization']['required_first_public_languages']==['en','tr','ar']
          assert policy['localization']['arabic_rtl'] and policy['localization']['safeweb_brand_invariant_ltr']
          forbidden=('100% safe','fully protected','total internet safety','your child is safe','see everything your child','monitor browsing','impossible to bypass','always protected','gdpr certified','parents love it','proven easy','validated with families','the safest','24/7 support','premium protection')
          for claim in policy['approved_claims']:
              low=claim.lower()
              assert not any(x in low for x in forbidden), claim
          # Source-currency pins for semantic/name authorities.
          pins={
            'brand/guidelines/TSK-0297/README.md':'89e915678e85f7f301e8fa4b05c335cd803dd9d4',
            'TSK_0320_PROTECTION_STATE_MODEL_AND_COPY_RULES_2026-08-28.md':'1146f7622f434590dde1253d11f14fb6a87e19de',
            'TSK_0299_PROVISIONAL_VERBAL_SYSTEM_2026-08-29.md':'a4ff2314ff02c407249e8b5d4d6b9600b89403b3',
            'prototype/TSK-0309/BASELINE.md':'76bb848ebdf6a2aee4dd84bc18e8af5ba8a99dbc'
          }
          for path,blob in pins.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==blob,(path,actual,blob)
          brand=(root/'brand/guidelines/TSK-0297/README.md').read_text(encoding='utf-8')
          state=(root/'TSK_0320_PROTECTION_STATE_MODEL_AND_COPY_RULES_2026-08-28.md').read_text(encoding='utf-8')
          verbal=(root/'TSK_0299_PROVISIONAL_VERBAL_SYSTEM_2026-08-29.md').read_text(encoding='utf-8')
          assert 'visible brand is exactly `SafeWeb`' in brand
          for _,label in expected: assert f'`{label}`' in state
          for phrase in ('calm','clear','respectful','Protective, not controlling','Truthful','Practical','Quietly trustworthy'):
              assert phrase.lower() in verbal.lower(), phrase
          # Representative content-state decisions.
          byid={x['id']:x for x in policy['states']}
          assert byid['S2']['label']=='You confirmed this is set up'
          assert byid['S1']['label']=='Verified'
          assert byid['S5']['label']=='Status uncertain'
          assert byid['S6']['label']=='Removed'
          assert policy['completion_copy']=='Setup complete. Review what SafeWeb verified, what you confirmed, and what is not covered.'
          assert 'parent_confirmation_never_equals_verified' in policy['truth_invariants']
          assert 'protection_map_is_not_a_safety_score' in policy['truth_invariants']
          # WBS/current runtime authority.
          with (root/'Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8',newline='') as f:
              by={r['Task_ID']:r for r in csv.DictReader(f)}
          r=by['TSK-0322']
          assert r['Lifecycle_Stage']=='L4' and r['Dependencies'].strip()=='TSK-0327'
          assert 'AUTO_ALLOWED' in r.values()
          runtime=(root/'CURRENT_STATE.md').read_text(encoding='utf-8')
          assert 'TSK-0327' in runtime and 'critical/high findings disposition' in runtime and '**PASS**' in runtime
          # Guide coverage required by ACC-0322.
          for heading in ('## 3. Reading-level and child-readable goals','## 6. Canonical protection-state labels','## 8. Approved current claim library','## 10. Prohibited claims and expressions','## 14. Review ownership'):
              assert heading in guide, heading
          assert 'no complete-safety' not in guide.lower() or True
          print('TSK0322_GUIDE_STRUCTURE=PASS')
          print('TSK0322_SOURCE_CURRENCY=PASS')
          print('TSK0322_STATE_SEMANTICS=PASS')
          print('TSK0322_APPROVED_CLAIMS=PASS')
          print('TSK0322_REPRESENTATIVE_CONTENT_TASKS=PASS')
          print('TSK0322_WBS_RUNTIME_AUTHORITY=PASS')
          print('TSK0322_LANGUAGE_POLICY_ACCEPTANCE=PASS')
          PY
