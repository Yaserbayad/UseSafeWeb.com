name: Inspect TSK-0138 runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tsk0138-runtime-20260830.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Extract runtime sections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = "14fe2b734eb58c63aa2ce38aa3b99739c66f8ef5"
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          for tid in ['TSK-0138','TSK-0140']:
              m=re.search(r'(?ms)^### '+re.escape(tid)+r' accepted stable state\n(.*?)(?=^### |^## |\Z)',s)
              print('SECTION_'+tid+'_BEGIN')
              print((m.group(1).strip() if m else 'MISSING'))
              print('SECTION_'+tid+'_END')
          PY
