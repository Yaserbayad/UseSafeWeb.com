name: Verify TSK-0011 published plan readback

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-tsk0011-readback-20260905.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact published planning bytes and authority root
        shell: bash
        run: |
          set -euo pipefail
          PINNED_CHECKPOINT_BLOB='21a13045d2ad5c6408ca4ec86da76df2ea370755'
          PINNED_CHECKPOINT_REVISION='25'
          FROZEN_COMMIT='20e2763c0be2124378e3158ac559aed826bc6765'
          FROZEN_PLANS_TREE='0ed412e5dd90f5a05238bb6542a061d7b0ce0ccf'
          FROZEN_MANIFEST_BLOB='da35db0fe16009dfb5ce0e24caab05d6d02c84ed'
          FROZEN_SUMS_BLOB='8fbeb7337233adc289ea51e49a0722f33db08323'
          HISTORICAL_PUBLICATION_COMMIT='fce408f34470c0a0883ab978685b5265fdec4b97'

          test "$GITHUB_REF_NAME" = 'main'
          test "$(git hash-object CURRENT_STATE.md)" = "$PINNED_CHECKPOINT_BLOB"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('CURRENT_STATE.md').read_text(encoding='utf-8'))
          assert d['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert d['project_id']=='UseSafeWeb.com'
          assert d['governance_mode']=='SERIAL_LIGHT'
          assert d['checkpoint_revision']==25
          assert d['baseline']['version']==1
          assert d['runtime']['project_status']=='ACTIVE'
          items={x['id']:x for x in d['runtime']['items']}
          assert items['TSK-0009']['status']=='PASS'
          assert items['TSK-0011']['status']=='TODO'
          print('CHECKPOINT_PRECONDITIONS=PASS')
          PY

          git merge-base --is-ancestor "$HISTORICAL_PUBLICATION_COMMIT" "$FROZEN_COMMIT"
          git merge-base --is-ancestor "$FROZEN_COMMIT" HEAD

          CURRENT_MAIN_COMMIT="$(git rev-parse HEAD)"
          CURRENT_REPO_TREE="$(git rev-parse HEAD^{tree})"
          CURRENT_PLANS_TREE="$(git rev-parse HEAD:Plans)"
          CURRENT_MANIFEST_BLOB="$(git rev-parse HEAD:Plans/Master/MANIFEST.yaml)"
          CURRENT_SUMS_BLOB="$(git rev-parse HEAD:Plans/SHA256SUMS.txt)"
          test "$CURRENT_PLANS_TREE" = "$FROZEN_PLANS_TREE"
          test "$CURRENT_MANIFEST_BLOB" = "$FROZEN_MANIFEST_BLOB"
          test "$CURRENT_SUMS_BLOB" = "$FROZEN_SUMS_BLOB"

          rm -rf /tmp/tsk0011-frozen /tmp/tsk0011-main
          mkdir -p /tmp/tsk0011-frozen /tmp/tsk0011-main
          git archive "$FROZEN_COMMIT" Plans | tar -x -C /tmp/tsk0011-frozen
          git archive HEAD Plans | tar -x -C /tmp/tsk0011-main

          diff -qr /tmp/tsk0011-frozen/Plans /tmp/tsk0011-main/Plans

          test -f /tmp/tsk0011-main/Plans/Master/MASTER_PLAN.md
          test -f /tmp/tsk0011-main/Plans/Master/MANIFEST.yaml
          test -f /tmp/tsk0011-main/Plans/SHA256SUMS.txt

          cd /tmp/tsk0011-frozen/Plans
          sha256sum -c SHA256SUMS.txt | tee /tmp/tsk0011-frozen-checksums.txt
          cd /tmp/tsk0011-main/Plans
          sha256sum -c SHA256SUMS.txt | tee /tmp/tsk0011-main-checksums.txt

          git -C "$GITHUB_WORKSPACE" ls-tree -r --name-only "$FROZEN_COMMIT" Plans \
            | grep -v '^Plans/SHA256SUMS.txt$' | sort > /tmp/tsk0011-tree-files.txt
          awk 'NF {sub(/^[0-9a-f]{64}  /, ""); print "Plans/" $0}' /tmp/tsk0011-frozen/Plans/SHA256SUMS.txt \
            | sort > /tmp/tsk0011-checksum-files.txt
          diff -u /tmp/tsk0011-tree-files.txt /tmp/tsk0011-checksum-files.txt
          FILE_COUNT="$(wc -l < /tmp/tsk0011-tree-files.txt | tr -d ' ')"
          CHECKSUM_COUNT="$(wc -l < /tmp/tsk0011-checksum-files.txt | tr -d ' ')"
          test "$FILE_COUNT" = "$CHECKSUM_COUNT"

          grep -Fx 'canonical_root: Plans/Master' /tmp/tsk0011-main/Plans/Master/MANIFEST.yaml
          grep -F 'MASTER_PLAN.md is the root and MANIFEST.yaml is the machine-readable authority map.' /tmp/tsk0011-main/Plans/Master/MANIFEST.yaml
          grep -F 'runtime_state: separate CURRENT_STATE checkpoint; not duplicated into planning data' /tmp/tsk0011-main/Plans/Master/MANIFEST.yaml
          grep -F 'derived_modules_never_authoritative: true' /tmp/tsk0011-main/Plans/Master/MANIFEST.yaml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/tsk0011-main/Plans/Master/MANIFEST.yaml').read_text(encoding='utf-8')
          anchor='- id: ROOT\n'
          assert anchor in text
          root=text.split(anchor,1)[1].split('\n- id:',1)[0]
          assert 'path: MASTER_PLAN.md' in root
          assert 'authority: authoritative' in root
          full=text.split('- id: FULL\n',1)[1].split('\n- id:',1)[0]
          assert 'path: Generated/MASTER_PLAN_FULL.md' in full
          assert 'authority: derived_non_authoritative' in full
          print('AUTHORITY_ROOT_AND_DERIVED_FENCE=PASS')
          PY

          cd /tmp/tsk0011-main/Plans
          python3 Master/Tools/validate_master_plan.py | tee /tmp/tsk0011-validator.txt
          grep -Fx 'VALIDATION PASS' /tmp/tsk0011-validator.txt
          grep -Fx 'tasks=641' /tmp/tsk0011-validator.txt
          grep -Fx 'broken_links=0' /tmp/tsk0011-validator.txt
          grep -Fx 'generated_missing_task_ids=0' /tmp/tsk0011-validator.txt

          cd "$GITHUB_WORKSPACE"
          python3 - <<PY
          import hashlib, json
          from pathlib import Path

          frozen=Path('/tmp/tsk0011-frozen/Plans')
          current=Path('/tmp/tsk0011-main/Plans')
          rows=[]
          for raw in (frozen/'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              expected, rel = raw.split('  ',1)
              def digest(p):
                  return hashlib.sha256(p.read_bytes()).hexdigest()
              f=digest(frozen/rel)
              c=digest(current/rel)
              assert f==expected==c
              rows.append({'path':'Plans/'+rel,'expected_sha256':expected,'frozen_sha256':f,'main_sha256':c,'match':True})
          result={
            'task':'TSK-0011',
            'acceptance':'ACC-0011',
            'result':'PASS',
            'branch':'main',
            'checkpoint_blob':'$PINNED_CHECKPOINT_BLOB',
            'checkpoint_revision':int('$PINNED_CHECKPOINT_REVISION'),
            'approved_frozen_authority':{
              'commit':'$FROZEN_COMMIT',
              'plans_tree':'$FROZEN_PLANS_TREE',
              'manifest_blob':'$FROZEN_MANIFEST_BLOB',
              'sha256sums_blob':'$FROZEN_SUMS_BLOB'
            },
            'historical_publication_commit':'$HISTORICAL_PUBLICATION_COMMIT',
            'readback_main':{
              'commit':'$CURRENT_MAIN_COMMIT',
              'repository_tree':'$CURRENT_REPO_TREE',
              'plans_tree':'$CURRENT_PLANS_TREE',
              'manifest_blob':'$CURRENT_MANIFEST_BLOB',
              'sha256sums_blob':'$CURRENT_SUMS_BLOB'
            },
            'declared_file_count':int('$CHECKSUM_COUNT'),
            'tree_file_count_excluding_sha256sums':int('$FILE_COUNT'),
            'file_set_exact':True,
            'plans_tree_exact':True,
            'all_declared_sha256_match':True,
            'master_plan_present':True,
            'manifest_present':True,
            'sha256sums_present':True,
            'authority_root':'Plans/Master/MASTER_PLAN.md',
            'manifest_is_machine_readable_authority_map':True,
            'runtime_state_separate':True,
            'generated_master_plan_full_authoritative':False,
            'validator_pass':True,
            'file_checks':rows,
            'validator_output':Path('/tmp/tsk0011-validator.txt').read_text(encoding='utf-8')
          }
          Path('tsk0011-readback-verification.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY

      - name: Upload readback verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: tsk0011-readback-verification
          path: tsk0011-readback-verification.json
          if-no-files-found: error

      - name: Remove one-off verification transport
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = '21a13045d2ad5c6408ca4ec86da76df2ea370755'
          test "$(git rev-parse origin/main:Plans)" = '0ed412e5dd90f5a05238bb6542a061d7b0ce0ccf'
          git switch -C main origin/main
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/verify-tsk0011-readback-20260905.yml
          git commit -m 'evidence: remove TSK-0011 readback verification transport'
          git push origin HEAD:main
