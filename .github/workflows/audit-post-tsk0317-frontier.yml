name: Audit post-TSK-0317 frontier v2

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/post-tsk0317-frontier-trigger.txt']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Compute current L4 AUTO_ALLOWED dependency frontier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, re, subprocess
          from collections import defaultdict, deque
          from pathlib import Path

          WBS='Plans/Master/WBS/master-wbs.csv'; GRAPH='Plans/Master/RELATIONSHIP_INDEX.yaml'; RUNTIME='CURRENT_STATE.md'
          expected={WBS:'b27a0c5df2f5636d8ed71051e9e26a68959a2616',GRAPH:'c108d2c162bcea2ee4cc01def46d0487a9501032',RUNTIME:'2d2e3c9de8f247bcff4f54388002917127c55c24'}
          def blob(p): return subprocess.check_output(['git','hash-object',p],text=True).strip()
          for p,sha in expected.items(): assert blob(p)==sha,(p,blob(p),sha)

          with open(WBS,newline='',encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          byid={r['Task_ID']:r for r in rows if r.get('Task_ID')}
          runtime=Path(RUNTIME).read_text(encoding='utf-8')

          current_pass=set()
          current_sections={}
          for m in re.finditer(r'^## (TSK-\d{4}) current accepted stable state.*?(?=^## |\Z)',runtime,re.MULTILINE|re.DOTALL):
              tid=m.group(1); current_sections[tid]=m.group(0)
              if '**PASS**' in m.group(0): current_pass.add(tid)

          historical_pass=set()
          for m in re.finditer(r'^### (TSK-\d{4}) accepted stable state.*?(?=^### |^## |\Z)',runtime,re.MULTILINE|re.DOTALL):
              if '**PASS' in m.group(0): historical_pass.add(m.group(1))

          static_pass={tid for tid,r in byid.items() if (r.get('Execution_State') or '').strip()=='PASS'}
          explicit_superseded={'TSK-0333','TSK-0321','TSK-0309','TSK-0628'}
          # Explicit CR-0006 supersession wins over old/static/historical headings. Only an explicit
          # later POST-CR refreshed current section can restore one of these IDs.
          refreshed_superseded={tid for tid in explicit_superseded if tid in current_pass and 'POST-CR-' in current_sections.get(tid,'') and re.search(r'2026-(08-3[01]|09-\d{2})',current_sections.get(tid,''))}
          effective_pass=(static_pass | historical_pass | current_pass) - explicit_superseded
          effective_pass |= refreshed_superseded

          deps={}; children=defaultdict(set)
          for tid,r in byid.items():
              ds=[x.strip() for x in (r.get('Dependencies') or '').split(';') if x.strip()]; deps[tid]=ds
              for d in ds: children[d].add(tid)

          def descendants(tid):
              seen=set(); q=deque(children.get(tid,()))
              while q:
                  x=q.popleft()
                  if x in seen: continue
                  seen.add(x); q.extend(children.get(x,()))
              return len(seen)

          print('AUDIT_INPUT_WBS='+blob(WBS)); print('AUDIT_INPUT_GRAPH='+blob(GRAPH)); print('AUDIT_INPUT_RUNTIME='+blob(RUNTIME))
          print('CURRENT_RUNTIME_PASS_COUNT='+str(len(current_pass))); print('HISTORICAL_RUNTIME_PASS_COUNT='+str(len(historical_pass))); print('STATIC_WBS_PASS_COUNT='+str(len(static_pass)))
          print('EXPLICIT_CR0006_SUPERSEDED='+','.join(sorted(explicit_superseded))); print('REFRESHED_SUPERSEDED='+(','.join(sorted(refreshed_superseded)) or 'NONE'))
          for source in ['TSK-0300','TSK-0317']:
              print('DIRECT_SUCCESSORS|{}|{}'.format(source,','.join(sorted(children.get(source,()))) or 'NONE'))

          cands=[]
          for tid,r in byid.items():
              if (r.get('Lifecycle_Stage') or '').strip()!='L4' or (r.get('Action_Authority') or '').strip()!='AUTO_ALLOWED' or tid in effective_pass: continue
              missing=[d for d in deps[tid] if d not in effective_pass]
              cands.append((not missing,descendants(tid),tid,r,missing))
          cands.sort(key=lambda x:(not x[0],-x[1],x[2]))
          for complete,desc,tid,r,missing in cands:
              print('CAND|{}|complete={}|desc={}|priority={}|a={}|plan={}|exec={}|deps={}|missing={}|acc={}|title={}'.format(tid,'YES' if complete else 'NO',desc,r.get('Priority',''),r.get('AI_Capability_A0_A4',''),r.get('Plan_Status',''),r.get('Execution_State',''),';'.join(deps[tid]) or 'NONE',';'.join(missing) or 'NONE',r.get('Acceptance_ID',''),(r.get('Title') or '').replace('|','/')))
          ready=[x for x in cands if x[0]]
          print('READY_COUNT='+str(len(ready)))
          for rank,(complete,desc,tid,r,missing) in enumerate(ready,1):
              print('READY|{}|{}|desc={}|priority={}|a={}|deps={}|acc={}|title={}'.format(rank,tid,desc,r.get('Priority',''),r.get('AI_Capability_A0_A4',''),';'.join(deps[tid]) or 'NONE',r.get('Acceptance_ID',''),(r.get('Title') or '').replace('|','/')))

          for tid in ['TSK-0307','TSK-0308','TSK-0310','TSK-0311','TSK-0309','TSK-0484','TSK-0497','TSK-0352','TSK-0297','TSK-0559','TSK-0628']:
              r=byid.get(tid)
              if not r: continue
              print('ROW|{}|effective_pass={}|historical_pass={}|current_pass={}|stage={}|priority={}|a={}|authority={}|plan={}|exec={}|deps={}|acc={}|ver={}|evd={}|title={}'.format(tid,'YES' if tid in effective_pass else 'NO','YES' if tid in historical_pass else 'NO','YES' if tid in current_pass else 'NO',r.get('Lifecycle_Stage',''),r.get('Priority',''),r.get('AI_Capability_A0_A4',''),r.get('Action_Authority',''),r.get('Plan_Status',''),r.get('Execution_State',''),r.get('Dependencies',''),r.get('Acceptance_ID',''),r.get('Verification_ID',''),r.get('Evidence_ID',''),(r.get('Title') or '').replace('|','/')))
          print('POST_TSK0317_FRONTIER_AUDIT_V2=PASS')
          PY
