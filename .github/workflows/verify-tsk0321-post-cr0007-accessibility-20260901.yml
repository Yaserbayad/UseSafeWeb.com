name: Verify post-CR-0007 TSK-0321 integrated accessibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0321-post-cr0007-accessibility-20260901.yml'
      - '.github/scripts/verify_tsk0321_post_cr0007_accessibility_browser_20260901.mjs'
      - 'prototype/TSK-0333/**'
      - 'prototype/TSK-0323/**'
      - 'prototype/TSK-0324/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Verify current integrated accessibility in Chromium and reconcile PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD:Plans/Master/WBS/master-wbs.csv)" = 'f3c29b5db8b835ef2c896f61335656ea51d8ba1c'
          test "$(git rev-parse HEAD:prototype/TSK-0333/index.html)" = '934dc19d00cc9dd32e1ebc20c604373d153d4013'
          test "$(git rev-parse HEAD:prototype/TSK-0333/model.mjs)" = 'fc25e4b1facc303840311e8ce186612eb8799212'
          test "$(git rev-parse HEAD:prototype/TSK-0333/app.mjs)" = '98659ba74a86d539b89664708bbcb830292486f8'
          test "$(git rev-parse HEAD:prototype/TSK-0333/prototype.css)" = '385dc5269de79b7baca9aa597b9ecf4cca8a95f2'
          test "$(git rev-parse HEAD:.github/scripts/verify_tsk0321_post_cr0007_accessibility_browser_20260901.mjs)" = 'b49b1c0aa81c5667b3059863c5bb5511077811f0'
          echo 'TSK0321_PINNED_CURRENT_INPUTS=PASS'

          runtime_dir="$RUNNER_TEMP/tsk0321-a11y-runtime"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          npm install --prefix "$runtime_dir" --no-save --no-package-lock playwright@1.62.0 axe-core@4.10.3
          playwright_module="$runtime_dir/node_modules/playwright"
          axe_module="$runtime_dir/node_modules/axe-core"
          PLAYWRIGHT_BROWSERS_PATH="$runtime_dir/browsers" "$runtime_dir/node_modules/.bin/playwright" install chromium

          before_index="$(git rev-parse HEAD:prototype/TSK-0333/index.html)"
          before_model="$(git rev-parse HEAD:prototype/TSK-0333/model.mjs)"
          before_app="$(git rev-parse HEAD:prototype/TSK-0333/app.mjs)"
          before_css="$(git rev-parse HEAD:prototype/TSK-0333/prototype.css)"
          verification_commit="$(git rev-parse HEAD)"

          python3 -m http.server 8033 --bind 127.0.0.1 >/tmp/tsk0321-http.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 20); do
            if curl -fsS 'http://127.0.0.1:8033/prototype/TSK-0333/index.html' >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS 'http://127.0.0.1:8033/prototype/TSK-0333/index.html' >/dev/null

          TSK0321_BASE_URL='http://127.0.0.1:8033/prototype/TSK-0333/index.html' TSK0321_PLAYWRIGHT_MODULE="$playwright_module" PLAYWRIGHT_BROWSERS_PATH="$runtime_dir/browsers" node .github/scripts/verify_tsk0321_200pct_candidate_20260901.mjs
          echo 'TSK0321_AUTHORITATIVE_FOCUSED_200PCT=PASS'

          python3 .github/scripts/prepare_tsk0333_safeweb_browser_verifier_20260901.py
          TSK0333_BASE_URL='http://127.0.0.1:8033/prototype/TSK-0333/index.html' TSK0333_PLAYWRIGHT_MODULE="$playwright_module" PLAYWRIGHT_BROWSERS_PATH="$runtime_dir/browsers" node "$RUNNER_TEMP/tsk0333-safeweb-browser.mjs"
          echo 'TSK0333_AUTHORITATIVE_REGRESSION=PASS'

          TSK0321_BASE_URL='http://127.0.0.1:8033/prototype/TSK-0333/index.html' TSK0321_PLAYWRIGHT_MODULE="$playwright_module" TSK0321_AXE_MODULE="$axe_module" PLAYWRIGHT_BROWSERS_PATH="$runtime_dir/browsers" node .github/scripts/verify_tsk0321_post_cr0007_accessibility_browser_20260901.mjs
          echo 'TSK0321_AUTHORITATIVE_FULL_ACCESSIBILITY=PASS'

          test "$before_index" = "$(git rev-parse HEAD:prototype/TSK-0333/index.html)"
          test "$before_model" = "$(git rev-parse HEAD:prototype/TSK-0333/model.mjs)"
          test "$before_app" = "$(git rev-parse HEAD:prototype/TSK-0333/app.mjs)"
          test "$before_css" = "$(git rev-parse HEAD:prototype/TSK-0333/prototype.css)"
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'TSK0321_PRODUCT_SOURCE_UNCHANGED_DURING_REVIEW=PASS'

          export VERIFICATION_COMMIT="$verification_commit"
          export RUN_ID="$GITHUB_RUN_ID"
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess

          def blob(path):
              return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip()

          evidence = Path('TSK_0321_POST_CR0007_FINAL_ACCESSIBILITY_EVIDENCE_2026-09-01.md')
          evidence.write_text(f'''# TSK-0321 — Post-CR-0007 Final Integrated Accessibility Evidence

**Task:** `TSK-0321 — Review design and content against accessibility requirements`  
**Date:** 2026-09-01  
**Disposition:** `PASS` only after owner-approved remediation and authoritative no-overlay review.  
**Owner authority:** exact approval received: `APPROVE TSK-0321 POST-CR-0007 ACCESSIBILITY REMEDIATION AND REVIEW`.

## Proven current boundary

- WBS blob: `{blob('Plans/Master/WBS/master-wbs.csv')}`.
- Authoritative TSK-0333 index/model/app blobs: `{blob('prototype/TSK-0333/index.html')}` / `{blob('prototype/TSK-0333/model.mjs')}` / `{blob('prototype/TSK-0333/app.mjs')}`.
- Authoritative remediated CSS blob: `{blob('prototype/TSK-0333/prototype.css')}`.
- Verification workflow blob: `{blob('.github/workflows/verify-tsk0321-post-cr0007-accessibility-20260901.yml')}`.
- Verification script blob: `{blob('.github/scripts/verify_tsk0321_post_cr0007_accessibility_browser_20260901.mjs')}`.
- Verification source commit: `{os.environ['VERIFICATION_COMMIT']}`.
- GitHub Actions run: `{os.environ['RUN_ID']}` on self-hosted `adguardvm`.

## Required post-approval verification

All commands below completed successfully against the authoritative `prototype/TSK-0333` source with no remediation overlay:

1. Focused 320px / 200% text proof: **PASS**.
2. Full current SafeWeb TSK-0333 Chromium regression: **PASS**.
3. Full post-CR-0007 TSK-0321 mechanical accessibility suite (including axe WCAG-tagged checks, focus/keyboard/skip navigation, target sizing, responsive layouts, 200% reflow, RTL, reduced motion, privacy/no-persistence/no-external-transport and console/page-error boundaries): **PASS**.
4. Product source identity remained unchanged during the review: **PASS**.

The owner-approved candidate is now the authoritative CSS. The prior preparation-only evidence remains provenance. No real-user/assistive-technology validation, successor PASS, LG-06 PASS, implementation, production activation, participant processing, publication or launch is inferred beyond the current L4 contract.
''', encoding='utf-8')

          state = Path('CURRENT_STATE.md')
          text = state.read_text(encoding='utf-8')
          start_heading = '## TSK-0321 current waiting state — 2026-09-01 — POST-CR-0007'
          start = text.find(start_heading)
          if start < 0:
              raise SystemExit('TSK0321_WAITING_SECTION_NOT_FOUND')
          next_heading = text.find('\n## ', start + len(start_heading))
          if next_heading < 0:
              next_heading = len(text)
          replacement = f'''## TSK-0321 current accepted stable state — 2026-09-01 — POST-CR-0007

`TSK-0321 — Review design and content against accessibility requirements`: **PASS** under the current post-CR-0007 task contract, after exact Project Owner approval and authoritative remediation/review.

- Owner approval: `APPROVE TSK-0321 POST-CR-0007 ACCESSIBILITY REMEDIATION AND REVIEW`.
- Current WBS blob `{blob('Plans/Master/WBS/master-wbs.csv')}`: L4; hard dependencies `TSK-0323`, `TSK-0324`, `TSK-0333`; all remain current-qualified PASS.
- Authoritative remediated TSK-0333 CSS blob: `{blob('prototype/TSK-0333/prototype.css')}`; index/model/app remain `{blob('prototype/TSK-0333/index.html')}` / `{blob('prototype/TSK-0333/model.mjs')}` / `{blob('prototype/TSK-0333/app.mjs')}`.
- Durable final evidence: `TSK_0321_POST_CR0007_FINAL_ACCESSIBILITY_EVIDENCE_2026-09-01.md`.
- Authoritative verification source commit `{os.environ['VERIFICATION_COMMIT']}`; GitHub Actions run `{os.environ['RUN_ID']}` on self-hosted `adguardvm`: focused 320px/200% proof PASS; full current SafeWeb TSK-0333 Chromium regression PASS; full post-CR-0007 TSK-0321 accessibility suite PASS; source unchanged during review.
- The prior 320px/200% horizontal overflow defect is remediated in authoritative source. No current critical accessibility defect remains within the verified L4 mechanical review boundary.
- Mechanical evidence does not fabricate real-user/assistive-technology validation beyond the L4 contract.
- Non-inference fence: this PASS does not self-certify any successor, `LG-06`, implementation, real-user validation, publication, production activation, participant processing, payment, market activation or launch.

### Queue status after TSK-0321 acceptance

Recompute successor eligibility from current WBS dependencies, graph, gates, runtime evidence and Action Authority; do not infer eligibility from task numbering.
'''
          state.write_text(text[:start] + replacement + text[next_heading:], encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only | sort)" = $'CURRENT_STATE.md\nTSK_0321_POST_CR0007_FINAL_ACCESSIBILITY_EVIDENCE_2026-09-01.md'
          grep -Fq '## TSK-0321 current accepted stable state — 2026-09-01 — POST-CR-0007' CURRENT_STATE.md
          grep -Fq '**PASS**' TSK_0321_POST_CR0007_FINAL_ACCESSIBILITY_EVIDENCE_2026-09-01.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md TSK_0321_POST_CR0007_FINAL_ACCESSIBILITY_EVIDENCE_2026-09-01.md
          git commit -m 'state: accept TSK-0321 post-CR-0007 accessibility review'
          git push origin HEAD:main
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote" = "$(git rev-parse HEAD)"
          echo "TSK0321_PASS_COMMIT=$remote"
          echo "TSK0321_PASS_RUNTIME_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
          echo "TSK0321_PASS_EVIDENCE_BLOB=$(git rev-parse HEAD:TSK_0321_POST_CR0007_FINAL_ACCESSIBILITY_EVIDENCE_2026-09-01.md)"
          echo 'TSK0321_CURRENT_INTEGRATED_ACCESSIBILITY_VERIFICATION=PASS'
