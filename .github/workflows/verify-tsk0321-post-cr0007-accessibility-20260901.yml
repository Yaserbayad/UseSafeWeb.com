name: Verify post-CR-0007 TSK-0321 integrated accessibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0321-post-cr0007-accessibility-20260901.yml'
      - '.github/scripts/reconcile_tsk0321_post_cr0007_pass_20260901.py'
      - '.github/scripts/verify_tsk0321_post_cr0007_accessibility_browser_20260901.mjs'
      - 'prototype/TSK-0333/**'
      - 'prototype/TSK-0323/**'
      - 'prototype/TSK-0324/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Verify current integrated accessibility in Chromium and reconcile PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD:Plans/Master/WBS/master-wbs.csv)" = 'f3c29b5db8b835ef2c896f61335656ea51d8ba1c'
          test "$(git rev-parse HEAD:prototype/TSK-0333/index.html)" = '934dc19d00cc9dd32e1ebc20c604373d153d4013'
          test "$(git rev-parse HEAD:prototype/TSK-0333/model.mjs)" = 'fc25e4b1facc303840311e8ce186612eb8799212'
          test "$(git rev-parse HEAD:prototype/TSK-0333/app.mjs)" = '98659ba74a86d539b89664708bbcb830292486f8'
          test "$(git rev-parse HEAD:prototype/TSK-0333/prototype.css)" = '385dc5269de79b7baca9aa597b9ecf4cca8a95f2'
          test "$(git rev-parse HEAD:.github/scripts/verify_tsk0321_post_cr0007_accessibility_browser_20260901.mjs)" = 'b49b1c0aa81c5667b3059863c5bb5511077811f0'
          echo 'TSK0321_PINNED_CURRENT_INPUTS=PASS'

          runtime_dir="$RUNNER_TEMP/tsk0321-a11y-runtime"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          npm install --prefix "$runtime_dir" --no-save --no-package-lock playwright@1.62.0 axe-core@4.10.3
          playwright_module="$runtime_dir/node_modules/playwright"
          axe_module="$runtime_dir/node_modules/axe-core"
          PLAYWRIGHT_BROWSERS_PATH="$runtime_dir/browsers" "$runtime_dir/node_modules/.bin/playwright" install chromium

          before_index="$(git rev-parse HEAD:prototype/TSK-0333/index.html)"
          before_model="$(git rev-parse HEAD:prototype/TSK-0333/model.mjs)"
          before_app="$(git rev-parse HEAD:prototype/TSK-0333/app.mjs)"
          before_css="$(git rev-parse HEAD:prototype/TSK-0333/prototype.css)"
          verification_commit="$(git rev-parse HEAD)"

          python3 -m http.server 8033 --bind 127.0.0.1 >/tmp/tsk0321-http.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 20); do
            if curl -fsS 'http://127.0.0.1:8033/prototype/TSK-0333/index.html' >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS 'http://127.0.0.1:8033/prototype/TSK-0333/index.html' >/dev/null

          TSK0321_BASE_URL='http://127.0.0.1:8033/prototype/TSK-0333/index.html' TSK0321_PLAYWRIGHT_MODULE="$playwright_module" PLAYWRIGHT_BROWSERS_PATH="$runtime_dir/browsers" node .github/scripts/verify_tsk0321_200pct_candidate_20260901.mjs
          echo 'TSK0321_AUTHORITATIVE_FOCUSED_200PCT=PASS'

          python3 .github/scripts/prepare_tsk0333_safeweb_browser_verifier_20260901.py
          TSK0333_BASE_URL='http://127.0.0.1:8033/prototype/TSK-0333/index.html' TSK0333_PLAYWRIGHT_MODULE="$playwright_module" PLAYWRIGHT_BROWSERS_PATH="$runtime_dir/browsers" node "$RUNNER_TEMP/tsk0333-safeweb-browser.mjs"
          echo 'TSK0333_AUTHORITATIVE_REGRESSION=PASS'

          TSK0321_BASE_URL='http://127.0.0.1:8033/prototype/TSK-0333/index.html' TSK0321_PLAYWRIGHT_MODULE="$playwright_module" TSK0321_AXE_MODULE="$axe_module" PLAYWRIGHT_BROWSERS_PATH="$runtime_dir/browsers" node .github/scripts/verify_tsk0321_post_cr0007_accessibility_browser_20260901.mjs
          echo 'TSK0321_AUTHORITATIVE_FULL_ACCESSIBILITY=PASS'

          test "$before_index" = "$(git rev-parse HEAD:prototype/TSK-0333/index.html)"
          test "$before_model" = "$(git rev-parse HEAD:prototype/TSK-0333/model.mjs)"
          test "$before_app" = "$(git rev-parse HEAD:prototype/TSK-0333/app.mjs)"
          test "$before_css" = "$(git rev-parse HEAD:prototype/TSK-0333/prototype.css)"
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'TSK0321_PRODUCT_SOURCE_UNCHANGED_DURING_REVIEW=PASS'

          VERIFICATION_COMMIT="$verification_commit" RUN_ID="$GITHUB_RUN_ID" python3 .github/scripts/reconcile_tsk0321_post_cr0007_pass_20260901.py

          git diff --check
          test "$(git diff --name-only | sort)" = $'CURRENT_STATE.md\nTSK_0321_POST_CR0007_FINAL_ACCESSIBILITY_EVIDENCE_2026-09-01.md'
          grep -Fq '## TSK-0321 current accepted stable state — 2026-09-01 — POST-CR-0007' CURRENT_STATE.md
          grep -Fq '**PASS**' TSK_0321_POST_CR0007_FINAL_ACCESSIBILITY_EVIDENCE_2026-09-01.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md TSK_0321_POST_CR0007_FINAL_ACCESSIBILITY_EVIDENCE_2026-09-01.md
          git commit -m 'state: accept TSK-0321 post-CR-0007 accessibility review'
          git push origin HEAD:main
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote" = "$(git rev-parse HEAD)"
          echo "TSK0321_PASS_COMMIT=$remote"
          echo "TSK0321_PASS_RUNTIME_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
          echo "TSK0321_PASS_EVIDENCE_BLOB=$(git rev-parse HEAD:TSK_0321_POST_CR0007_FINAL_ACCESSIBILITY_EVIDENCE_2026-09-01.md)"
          echo 'TSK0321_CURRENT_INTEGRATED_ACCESSIBILITY_VERIFICATION=PASS'
