name: TSK-0431 clean AdGuard recovery drill

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/adguard-clean-recovery-drill.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-adguard-recovery-v4
  cancel-in-progress: false

jobs:
  recover:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [a, b]
    runs-on: [self-hosted]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Timed clean-server rebuild and acceptance
        id: drill
        shell: bash
        run: bash infrastructure/adguard-server/clean-recovery-drill-runtime.sh
      - name: Publish privacy-safe drill evidence
        if: steps.drill.outputs.recovery_target == 'true'
        shell: bash
        run: bash infrastructure/adguard-server/publish-recovery-drill-evidence.sh

  confirm:
    needs: recover
    runs-on: [self-hosted]
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Confirm durable recovery evidence exists
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --quiet origin main
          git show origin/main:TSK_0431_PROJECT_CONTROLLED_RECOVERY_DRILL_EVIDENCE_2026-08-28.md > /tmp/evidence.md
          grep -Fq '**Project-controlled recovery drill: PASS.**' /tmp/evidence.md
          grep -Fq 'azure_native_restore_exercised=false' /tmp/evidence.md
          echo 'TSK_0431_DURABLE_RECOVERY_EVIDENCE=PASS'
