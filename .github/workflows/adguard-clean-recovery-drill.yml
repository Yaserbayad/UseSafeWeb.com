name: TSK-0431 clean AdGuard recovery drill

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/adguard-clean-recovery-drill.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-adguard-recovery
  cancel-in-progress: false

jobs:
  recover:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [a, b]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Timed clean-server rebuild and acceptance
        id: drill
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          started_epoch="$(date +%s)"
          summary=/tmp/t0431-summary.env
          : > "$summary"

          fail_safe() {
            rc=$?
            if (( rc != 0 )); then
              sudo systemctl stop nginx.service >/dev/null 2>&1 || true
              sudo systemctl stop AdGuardHome.service >/dev/null 2>&1 || true
            fi
            rm -f /tmp/t0431-* >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap fail_safe EXIT

          echo 'recovery_target=false' >> "$GITHUB_OUTPUT"
          git fetch --quiet origin main
          if git cat-file -e origin/main:TSK_0431_PROJECT_CONTROLLED_RECOVERY_DRILL_EVIDENCE_2026-08-28.md 2>/dev/null; then
            echo 'durable_recovery_evidence_already_exists=true'
            exit 0
          fi
          host="$(hostname -s)"
          machine_sha="$(sha256sum /etc/machine-id | awk '{print $1}')"
          if [[ "$host" == 'adguardvm' && "$machine_sha" == 'e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2' ]]; then
            echo 'production_runner_no_mutation=PASS'
            sleep 60
            exit 0
          fi
          [[ "$host" == 'adguartestdvm' ]]
          [[ "$machine_sha" == 'e09868443c476b30eae778d191ceedee57ed6f27a74856eae1d0709c68f1c852' ]]
          echo 'recovery_target=true' >> "$GITHUB_OUTPUT"
          sudo -n true

          curl --silent --show-error --fail --noproxy '*' -H 'Metadata:true' \
            'http://169.254.169.254/metadata/instance/compute?api-version=2025-04-07' > /tmp/t0431-imds.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t0431-imds.json',encoding='utf-8'))
          assert d.get('location') == 'westeurope', d.get('location')
          assert d.get('name') == 'adguartestdvm', d.get('name')
          assert d.get('vmId') == '6e92a026-964c-4118-8312-f1d31c6ff4d2', d.get('vmId')
          PY
          echo 'azure_location=westeurope' >> "$summary"
          echo 'recovery_vm_id=6e92a026-964c-4118-8312-f1d31c6ff4d2' >> "$summary"

          [[ "$(git hash-object TSK_0431_AZURE_BACKUP_OWNER_EVIDENCE_2026-08-28.md)" == 'fb846d5ab9a3ed3f4b52976273c92653d73db925' ]]
          [[ "$(git hash-object infrastructure/adguard-server/approved-adguard-config-v1.json)" == 'e9975c4e75c2a68131f049da942468d8d1952d8d' ]]
          [[ "$(git hash-object infrastructure/adguard-server/install-adguard.sh)" == '5891f79b531ac2f0366374a8f4bec8fa560a2496' ]]
          [[ "$(git hash-object infrastructure/adguard-server/initialize-admin.sh)" == '0fa0b3481d9b7173649c72606b40642c278e9c32' ]]

          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
          sudo apt-get update -qq
          sudo apt-get install -y -qq ufw nginx libnginx-mod-stream openssl python3-yaml curl ca-certificates >/dev/null

          sudo ufw --force reset >/dev/null
          sudo ufw default deny incoming >/dev/null
          sudo ufw default allow outgoing >/dev/null
          sudo ufw allow 22/tcp comment 'UseSafeWeb SSH' >/dev/null
          sudo ufw logging off >/dev/null
          sudo ufw --force enable >/dev/null
          echo 'firewall_public_service_ports=22_only' >> "$summary"

          bash infrastructure/adguard-server/install-adguard.sh
          bash infrastructure/adguard-server/initialize-admin.sh

          sudo systemctl stop AdGuardHome.service
          sudo python3 - /opt/AdGuardHome/AdGuardHome.yaml infrastructure/adguard-server/approved-adguard-config-v1.json <<'PY'
          import json, os, sys, tempfile, yaml
          raw_path, approved_path = sys.argv[1:3]
          with open(raw_path,encoding='utf-8') as f: d=yaml.safe_load(f)
          with open(approved_path,encoding='utf-8') as f: a=json.load(f)['settings']

          d['schema_version']=a['schema_version']
          d.setdefault('http',{})['address']=a['http']['address']
          d['http'].setdefault('doh',{})['insecure_enabled']=a['http']['doh']['insecure_enabled']

          dns=d.setdefault('dns',{})
          for k in ('bind_hosts','port','upstream_dns','upstream_dns_file','bootstrap_dns','fallback_dns','private_upstream','upstream_mode','ratelimit','ratelimit_subnet_len_ipv4','ratelimit_subnet_len_ipv6','ratelimit_whitelist','refuse_any','anonymize_client_ip','cache_size','cache_ttl_min','cache_ttl_max','cache_optimistic'):
              dns[k]=a['dns'][k]
          dns['edns_client_subnet']=dict(a['dns']['edns_client_subnet'])

          d['filtering']=dict(a['filtering'])
          d['filters']=[
              {'enabled':True,'url':'https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt','name':'AdGuard DNS filter','id':1},
              {'enabled':False,'url':'https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt','name':'AdAway Default Blocklist','id':2},
          ]
          d['whitelist_filters']=[]
          d['user_rules']=[]
          d['querylog']=dict(a['querylog'])
          d['statistics']=dict(a['statistics'])
          d['tls']=dict(a['tls'])
          d.setdefault('dhcp',{})['enabled']=False
          d.setdefault('clients',{})['persistent']=[]

          fd,tmp=tempfile.mkstemp(prefix='AdGuardHome.yaml.',dir=os.path.dirname(raw_path))
          os.close(fd)
          with open(tmp,'w',encoding='utf-8') as f:
              yaml.safe_dump(d,f,sort_keys=False,allow_unicode=True)
          os.chmod(tmp,0o600)
          os.chown(tmp,0,0)
          os.replace(tmp,raw_path)
          PY
          sudo systemctl start AdGuardHome.service

          secret=/var/lib/usesafeweb/adguard/admin.env
          username="$(sudo awk -F= '$1=="ADGUARD_ADMIN_USER" {sub(/^[^=]*=/,""); print; exit}' "$secret")"
          password="$(sudo awk -F= '$1=="ADGUARD_ADMIN_PASSWORD" {sub(/^[^=]*=/,""); print; exit}' "$secret")"
          [[ -n "$username" && -n "$password" ]]
          base=http://127.0.0.1:3000/control
          for _ in $(seq 1 30); do
            code="$(curl --silent --show-error --max-time 3 --user "$username:$password" -o /dev/null -w '%{http_code}' "$base/status" || true)"
            [[ "$code" == 200 ]] && break
            sleep 1
          done
          [[ "$code" == 200 ]]

          sudo python3 - /opt/AdGuardHome/AdGuardHome.yaml <<'PY'
          import sys,yaml
          d=yaml.safe_load(open(sys.argv[1],encoding='utf-8'))
          dns=d.get('dns') or {}; q=d.get('querylog') or {}; s=d.get('statistics') or {}; f=d.get('filtering') or {}
          assert list(dns.get('bind_hosts') or []) == ['127.0.0.1']
          assert list(dns.get('upstream_dns') or []) == ['https://dns10.quad9.net/dns-query']
          assert list(dns.get('fallback_dns') or []) == []
          assert bool((dns.get('edns_client_subnet') or {}).get('enabled')) is False
          assert dns.get('anonymize_client_ip') is True
          assert q.get('enabled') is False and q.get('file_enabled') is False
          assert s.get('enabled') is False
          assert f.get('protection_enabled') is True and f.get('filtering_enabled') is True
          assert ((d.get('clients') or {}).get('persistent') or []) == []
          assert (d.get('user_rules') or []) == []
          PY
          echo 'approved_config_reconstructed=PASS' >> "$summary"

          sudo install -d -m 0700 -o root -g root /etc/usesafeweb-recovery
          sudo openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout /etc/usesafeweb-recovery/recovery.key \
            -out /etc/usesafeweb-recovery/recovery.crt \
            -subj '/CN=dns.usesafeweb.com' \
            -addext 'subjectAltName=DNS:dns.usesafeweb.com' >/dev/null 2>&1
          sudo chmod 0600 /etc/usesafeweb-recovery/recovery.key /etc/usesafeweb-recovery/recovery.crt

          sudo tee /etc/nginx/nginx.conf >/dev/null <<'NGINX'
          user www-data;
          worker_processes auto;
          pid /run/nginx.pid;
          include /etc/nginx/modules-enabled/*.conf;
          events { worker_connections 768; }
          http {
            access_log off;
            error_log /var/log/nginx/error.log warn;
            server {
              listen 127.0.0.1:443 ssl;
              server_name dns.usesafeweb.com;
              ssl_certificate /etc/usesafeweb-recovery/recovery.crt;
              ssl_certificate_key /etc/usesafeweb-recovery/recovery.key;
              ssl_protocols TLSv1.2 TLSv1.3;
              location = /dns-query {
                proxy_pass http://127.0.0.1:3000;
                proxy_set_header Host $host;
              }
              location / { return 404; }
            }
          }
          stream {
            server {
              listen 127.0.0.1:853 ssl;
              proxy_pass 127.0.0.1:53;
              ssl_certificate /etc/usesafeweb-recovery/recovery.crt;
              ssl_certificate_key /etc/usesafeweb-recovery/recovery.key;
              ssl_protocols TLSv1.2 TLSv1.3;
            }
          }
          NGINX
          sudo nginx -t
          sudo systemctl enable --now nginx.service

          python3 - <<'PY'
          import random,struct
          name='example.com'
          q=b''.join(bytes([len(x)])+x.encode() for x in name.split('.'))+b'\x00'
          pkt=struct.pack('!HHHHHH',random.randrange(65536),0x0100,1,0,0,0)+q+struct.pack('!HH',1,1)
          open('/tmp/t0431-query.bin','wb').write(pkt)
          PY

          curl --silent --show-error --fail --noproxy '*' --max-time 10 \
            --cacert /etc/usesafeweb-recovery/recovery.crt \
            --resolve dns.usesafeweb.com:443:127.0.0.1 \
            -H 'accept: application/dns-message' -H 'content-type: application/dns-message' \
            --data-binary @/tmp/t0431-query.bin \
            https://dns.usesafeweb.com/dns-query -o /tmp/t0431-doh.bin
          python3 - <<'PY'
          import struct
          r=open('/tmp/t0431-doh.bin','rb').read()
          assert len(r)>=12
          flags=struct.unpack('!H',r[2:4])[0]; answers=struct.unpack('!H',r[6:8])[0]
          assert (flags & 0xF)==0 and answers>0, ((flags & 0xF),answers)
          PY
          echo 'local_doh_encrypted_resolution=PASS' >> "$summary"

          sudo python3 - <<'PY'
          import socket,ssl,struct
          pkt=open('/tmp/t0431-query.bin','rb').read()
          ctx=ssl.create_default_context(cafile='/etc/usesafeweb-recovery/recovery.crt')
          with socket.create_connection(('127.0.0.1',853),timeout=5) as raw:
              with ctx.wrap_socket(raw,server_hostname='dns.usesafeweb.com') as s:
                  s.sendall(struct.pack('!H',len(pkt))+pkt)
                  h=s.recv(2); assert len(h)==2
                  n=struct.unpack('!H',h)[0]
                  data=b''
                  while len(data)<n:
                      chunk=s.recv(n-len(data)); assert chunk; data+=chunk
          flags=struct.unpack('!H',data[2:4])[0]; answers=struct.unpack('!H',data[6:8])[0]
          assert (flags & 0xF)==0 and answers>0, ((flags & 0xF),answers)
          PY
          echo 'local_dot_encrypted_resolution=PASS' >> "$summary"

          curl --silent --show-error --fail --max-time 10 --user "$username:$password" "$base/filtering/status" -o /tmp/t0431-filter-before.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/t0431-filter-before.json',encoding='utf-8'))
          assert s.get('enabled') is True
          assert (s.get('user_rules') or []) == []
          json.dump({'rules':[]},open('/tmp/t0431-rules-empty.json','w',encoding='utf-8'),separators=(',',':'))
          json.dump({'rules':['||usesafeweb-recovery-check.invalid^']},open('/tmp/t0431-rules-block.json','w',encoding='utf-8'),separators=(',',':'))
          json.dump({'rules':['||usesafeweb-recovery-check.invalid^','@@||usesafeweb-recovery-check.invalid^']},open('/tmp/t0431-rules-allow.json','w',encoding='utf-8'),separators=(',',':'))
          PY
          curl --silent --show-error --fail --max-time 10 --user "$username:$password" -H 'Content-Type: application/json' --data-binary @/tmp/t0431-rules-block.json "$base/filtering/set_rules" >/dev/null
          sleep 1
          curl --silent --show-error --fail --max-time 10 --user "$username:$password" --get --data-urlencode 'name=usesafeweb-recovery-check.invalid' --data-urlencode 'qtype=A' "$base/filtering/check_host" -o /tmp/t0431-check.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/t0431-check.json',encoding='utf-8')).get('reason')=='FilteredBlackList'
          PY
          curl --silent --show-error --fail --max-time 10 --user "$username:$password" -H 'Content-Type: application/json' --data-binary @/tmp/t0431-rules-allow.json "$base/filtering/set_rules" >/dev/null
          sleep 1
          curl --silent --show-error --fail --max-time 10 --user "$username:$password" --get --data-urlencode 'name=usesafeweb-recovery-check.invalid' --data-urlencode 'qtype=A' "$base/filtering/check_host" -o /tmp/t0431-check.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/t0431-check.json',encoding='utf-8')).get('reason')=='NotFilteredWhiteList'
          PY
          curl --silent --show-error --fail --max-time 10 --user "$username:$password" -H 'Content-Type: application/json' --data-binary @/tmp/t0431-rules-empty.json "$base/filtering/set_rules" >/dev/null
          sleep 1
          curl --silent --show-error --fail --max-time 10 --user "$username:$password" --get --data-urlencode 'name=usesafeweb-recovery-check.invalid' --data-urlencode 'qtype=A' "$base/filtering/check_host" -o /tmp/t0431-check.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/t0431-check.json',encoding='utf-8')).get('reason')=='NotFilteredNotFound'
          PY
          echo 'filter_block_exception_rollback=PASS' >> "$summary"

          curl --silent --show-error --fail --max-time 10 --user "$username:$password" "$base/querylog/config" -o /tmp/t0431-qcfg.json
          curl --silent --show-error --fail --max-time 10 --user "$username:$password" "$base/querylog?limit=20" -o /tmp/t0431-qlog.json
          curl --silent --show-error --fail --max-time 10 --user "$username:$password" "$base/stats/config" -o /tmp/t0431-scfg.json
          curl --silent --show-error --fail --max-time 10 --user "$username:$password" "$base/stats" -o /tmp/t0431-stats.json
          python3 - <<'PY'
          import json
          q=json.load(open('/tmp/t0431-qcfg.json',encoding='utf-8')); ql=json.load(open('/tmp/t0431-qlog.json',encoding='utf-8'))
          s=json.load(open('/tmp/t0431-scfg.json',encoding='utf-8')); sd=json.load(open('/tmp/t0431-stats.json',encoding='utf-8'))
          assert q.get('enabled') is False
          assert (ql.get('data') or []) == []
          assert s.get('enabled') is False
          assert (sd.get('top_clients') or []) == []
          assert int(sd.get('num_dns_queries') or 0) == 0
          PY
          mapfile -t qfiles < <(sudo find /opt/AdGuardHome -type f -name 'querylog.json*' -size +0c -print 2>/dev/null || true)
          ((${#qfiles[@]} == 0))
          echo 'privacy_persistence=PASS' >> "$summary"

          unauth="$(curl --silent --show-error --max-time 5 -o /dev/null -w '%{http_code}' "$base/status" || true)"
          [[ "$unauth" == 401 || "$unauth" == 403 ]]
          sudo ss -H -lntup > /tmp/t0431-listeners.txt
          grep -q '127.0.0.1:53 ' /tmp/t0431-listeners.txt
          grep -q '127.0.0.1:3000 ' /tmp/t0431-listeners.txt
          grep -q '127.0.0.1:443 ' /tmp/t0431-listeners.txt
          grep -q '127.0.0.1:853 ' /tmp/t0431-listeners.txt
          while IFS= read -r line; do
            [[ "$line" == *ALLOW* ]] || continue
            [[ "$line" == 22/tcp* ]]
          done <<<"$(sudo ufw status)"
          echo 'admin_and_firewall_fail_safe=PASS' >> "$summary"

          sudo systemctl is-active --quiet AdGuardHome.service
          sudo systemctl is-active --quiet nginx.service
          elapsed=$(( $(date +%s) - started_epoch ))
          (( elapsed < 1800 ))
          echo "elapsed_seconds=$elapsed" >> "$summary"
          echo 'recovery_target_health=PASS' >> "$summary"
          echo 'azure_backup_owner_evidence=PASS' >> "$summary"
          echo 'azure_native_restore_exercised=false' >> "$summary"
          echo 'project_controlled_rebuild=PASS' >> "$summary"
          unset password
          echo 'TSK_0431_PROJECT_CONTROLLED_DRILL=PASS'
          trap - EXIT
          rm -f /tmp/t0431-imds.json /tmp/t0431-query.bin /tmp/t0431-doh.bin /tmp/t0431-filter-before.json /tmp/t0431-rules-empty.json /tmp/t0431-rules-block.json /tmp/t0431-rules-allow.json /tmp/t0431-check.json /tmp/t0431-qcfg.json /tmp/t0431-qlog.json /tmp/t0431-scfg.json /tmp/t0431-stats.json /tmp/t0431-listeners.txt

      - name: Publish privacy-safe drill evidence
        if: steps.drill.outputs.recovery_target == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/t0431-summary.env
          workflow_blob="$(git hash-object .github/workflows/adguard-clean-recovery-drill.yml)"
          state_blob="$(git hash-object CURRENT_STATE.md)"
          cat > TSK_0431_PROJECT_CONTROLLED_RECOVERY_DRILL_EVIDENCE_2026-08-28.md <<EOF
          # TSK-0431 — Project-Controlled Clean Recovery Drill Evidence

          **Task:** TSK-0431 — Test pilot restore or rebuild procedure  
          **Date:** 2026-08-28  
          **Target:** isolated recovery VM \`adguartestdvm\` / runner \`adguartestdvm_correct\`

          ## Inputs

          - Workflow source commit: \`${GITHUB_SHA}\`
          - Workflow blob: \`${workflow_blob}\`
          - Runtime-state blob at checkout: \`${state_blob}\`
          - Owner Azure Backup readiness evidence blob: \`fb846d5ab9a3ed3f4b52976273c92653d73db925\`
          - Approved AdGuard configuration artifact blob: \`e9975c4e75c2a68131f049da942468d8d1952d8d\`
          - Pinned AdGuard installer blob: \`5891f79b531ac2f0366374a8f4bec8fa560a2496\`
          - Pinned admin initializer blob: \`0fa0b3481d9b7173649c72606b40642c278e9c32\`

          ## Fresh target identity

          The drill asserted the corrected independent recovery VM identity before mutation: Azure VM ID \`${recovery_vm_id}\`, location \`${azure_location}\`, Ubuntu 24.04 LTS, and the previously accepted machine-id fingerprint. Production VM \`adguardvm\` was not the execution target.

          ## Timed rebuild result

          Project-controlled clean rebuild elapsed time: **\`${elapsed_seconds}\` seconds**, below the approximately 30-minute recovery target.

          The drill reconstructed the service from pinned/versioned project artifacts and fresh local secret generation, then proved:

          - approved AdGuard v0.107.79 installation and service startup;
          - approved safe configuration reconstruction with Quad9 dns10, ECS off, query/file logging off, statistics off, IP anonymisation on, no persistent clients, conservative filtering enabled;
          - admin API loopback-only/authenticated and unauthenticated access denied;
          - firewall remained default-deny with public inbound service limited to SSH during the isolated drill;
          - local test TLS terminated only on loopback using an ephemeral one-day recovery-test certificate whose private key never left the recovery VM;
          - DoH resolution through \`https://dns.usesafeweb.com/dns-query\` semantics on loopback: **PASS**;
          - DoT resolution through port 853 semantics on loopback: **PASS**;
          - synthetic block -> narrow exception -> exact rules rollback: **PASS**;
          - post-test query-log output empty, no non-empty querylog files, statistics disabled with zero top clients/query count: **PASS**;
          - AdGuard and Nginx healthy after acceptance checks: **PASS**.

          Safe markers: \`approved_config_reconstructed=${approved_config_reconstructed}\`, \`local_doh_encrypted_resolution=${local_doh_encrypted_resolution}\`, \`local_dot_encrypted_resolution=${local_dot_encrypted_resolution}\`, \`filter_block_exception_rollback=${filter_block_exception_rollback}\`, \`privacy_persistence=${privacy_persistence}\`, \`admin_and_firewall_fail_safe=${admin_and_firewall_fail_safe}\`, \`recovery_target_health=${recovery_target_health}\`.

          No participant DNS/domain history, participant identity, password, token, private key, certificate private material, or raw query data is stored in this evidence.

          ## Azure-native boundary

          The Project Owner directly reported Azure Backup ready with status Successful and explicitly approved the Azure Backup readiness/setup step as done. That owner-managed prerequisite is recorded separately.

          The project-controlled drill **did not execute an Azure control-plane restore**; \`azure_native_restore_exercised=${azure_native_restore_exercised}\`. CON-0004/CON-0019 keep that consequential Azure restore action owner-managed. Therefore the autonomous rebuild/functional/privacy/time portion of TSK-0431 is proven, but the literal REQ-0052 Azure-native *restore* exercise must not be fabricated.

          ## Stable disposition

          **Project-controlled recovery drill: PASS.**  
          **TSK-0431 overall: WAITING only on direct owner evidence that an Azure-native restore/recovery-point restore was actually exercised successfully, unless the owner explicitly changes that requirement through governed change control.**

          No production service or Azure control-plane resource was mutated by this workflow.
          EOF
          git config user.name 'UseSafeWeb Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TSK_0431_PROJECT_CONTROLLED_RECOVERY_DRILL_EVIDENCE_2026-08-28.md
          git commit -m 'evidence: record TSK-0431 clean recovery drill'
          git push origin HEAD:main

  confirm:
    needs: recover
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Confirm durable recovery evidence exists
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --quiet origin main
          git show origin/main:TSK_0431_PROJECT_CONTROLLED_RECOVERY_DRILL_EVIDENCE_2026-08-28.md > /tmp/evidence.md
          grep -Fq '**Project-controlled recovery drill: PASS.**' /tmp/evidence.md
          grep -Fq 'azure_native_restore_exercised=false' /tmp/evidence.md
          echo 'TSK_0431_DURABLE_RECOVERY_EVIDENCE=PASS'
