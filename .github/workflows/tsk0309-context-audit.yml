name: Audit post-TSK-0309 eligibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tsk0309-context-audit.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-governance-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Recompute direct successor authority
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          echo "AUDIT_HEAD=$(git rev-parse HEAD)"
          python3 - <<'PY'
          import csv, pathlib
          root=pathlib.Path('.')
          with (root/'Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          by={r['Task_ID']:r for r in rows}
          def deps(r): return [x.strip() for x in r['Dependencies'].split(';') if x.strip()]
          print('DIRECT_SUCCESSORS_TSK0309_BEGIN')
          for r in rows:
              if 'TSK-0309' in deps(r):
                  print('ROW|'+'|'.join(f'{k}={v}' for k,v in r.items()))
          print('DIRECT_SUCCESSORS_TSK0309_END')
          print('FOCUS_ROWS_BEGIN')
          focus={'TSK-0308','TSK-0327','TSK-0311','TSK-0307','TSK-0314','TSK-0315','TSK-0316','TSK-0321','TSK-0322','TSK-0323','TSK-0324'}
          for r in rows:
              if r['Task_ID'] in focus:
                  print('ROW|'+'|'.join(f'{k}={v}' for k,v in r.items()))
          print('FOCUS_ROWS_END')
          print('CURRENT_L4_PLANNED_BEGIN')
          for r in rows:
              if r['Lifecycle_Stage']=='L4' and r['Plan_Status']=='PLANNED':
                  print(f"{r['Task_ID']}|priority={r['Priority']}|deps={r['Dependencies']}|title={r['Title']}|row_values="+';'.join(v for v in r.values() if v in {'AUTO_ALLOWED','HUMAN_ONLY','HUMAN_APPROVAL_REQUIRED','A1','A2','A3','A4'}))
          print('CURRENT_L4_PLANNED_END')
          runtime=(root/'CURRENT_STATE.md').read_text(encoding='utf-8')
          assert 'TSK-0309`' in runtime and 'implementation-ready experience baseline' in runtime and '**PASS**' in runtime
          print('TSK0309_RUNTIME_PASS_VISIBLE=PASS')
          print('POST_TSK0309_ELIGIBILITY_AUDIT=PASS')
          PY
