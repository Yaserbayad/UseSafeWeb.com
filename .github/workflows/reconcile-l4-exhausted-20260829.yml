name: Reconcile exhausted provisional L4 queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-l4-exhausted-20260829.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact exhausted-queue pre-state
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "902ed00179a30c8b9fd89c6fac3f85117c7304c1"
          test "$(git hash-object Plans/Master/MANIFEST.yaml)" = "00feca027babfd99dcd1992e3e0abd6ef2d3380b"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "dce5b829c4d447eac180ae1e896e0019292cf971"
          grep -Fq '### TSK-0628 accepted stable state' CURRENT_STATE.md
          grep -Fq 'OWNER_L3_BEHAVIORAL_VALIDATION_DEFERRED_TO_2027-08-27' Plans/Master/MANIFEST.yaml
          grep -Fq 'PROVISIONAL_L4_AUTHORIZED' Plans/Master/MANIFEST.yaml
      - name: Replace queue tail with verified stop boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path('CURRENT_STATE.md')
          text=p.read_text(encoding='utf-8')
          updated=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          lines=text.splitlines()
          for i,line in enumerate(lines):
              if line.startswith('**Updated:** '):
                  lines[i]=f'**Updated:** {updated}'
                  break
          text='\n'.join(lines)+'\n'
          marker='## Queue status after TSK-0628 PASS\n'
          pos=text.index(marker)
          tail=(
              '## Provisional L4 exhausted stable boundary — 2026-08-29\n\n'
              'The bounded autonomous tranche has exhausted all currently executable provisional L4 work. Corrected dependency derivation run `33241919118` / job `99072605820` parsed both the historical runtime PASS bullet section and later accepted-stable PASS sections, recognized **71 current durable runtime PASS task IDs**, and returned **`CANDIDATE_COUNT 0`** across all non-deferred PLANNED/ACTIVE/IN_PROGRESS L4 tasks after hard-dependency filtering. This supersedes the earlier narrower parser result.\n\n'
              'The Brand/prototype chain is not currently executable. Read-only inspection run `33241822501` / job `99072355585` confirms `TSK-0298` depends on `TSK-0187`; `TSK-0299` depends on `TSK-0298`; `TSK-0302` depends on `TSK-0298`; HUMAN_ONLY `TSK-0301` depends on `TSK-0302` and `TSK-0299`; `TSK-0300` depends on `TSK-0301`; and `TSK-0310` depends on `TSK-0300` in addition to already-PASS TSK-0318/0317/0320. No predecessor is bypassed.\n\n'
              '`TSK-0187 — Validate the proposed accountless critical journey before production coding` is not eligible for execution under current authority. Inspection run `33241882329` / job `99072508391` confirms its acceptance requires **representative parents** to complete the prototype, understand protection limits, and recover/remove without hidden facilitation, and its direct dependency is `TSK-0146`, which is not current runtime PASS. Independently, authoritative `Plans/Master/MANIFEST.yaml` explicitly records `OWNER_L3_BEHAVIORAL_VALIDATION_DEFERRED_TO_2027-08-27` together with `PROVISIONAL_L4_AUTHORIZED`. Therefore missing representative-parent evidence remains `RSK-0002` OPEN and cannot be synthesized from internal design work.\n\n'
              'TSK-0628 does not create a new authorized implementation path: its direct shown implementation successor `TSK-0630` is L6, additionally depends on `TSK-0629`, and current global fences do not authorize L5/L6 integrated build/public implementation. `REQ-0022` remains unresolved; LG-03/LG-04/LG-05/LG-06 remain non-PASS; account/dashboard remains deferred under EXC-0001; no participant processing, legal completion, payment, publication, market activation or launch is authorized.\n\n'
              '### Stable runtime outcome\n\n'
              '- Newly completed in this tranche: TSK-0318 PASS, TSK-0319 PASS, TSK-0311 PASS, TSK-0628 PASS.\n'
              '- Current executable provisional-L4 queue: **empty**.\n'
              '- Current state of the next blocked frontier: **WAITING on governing dependency/gate conditions**, not TODO work that AI may execute now.\n'
              '- No HUMAN_ONLY L4 decision is presently dependency-satisfied and awaiting owner disposition.\n'
              '- No unrelated safe L4 branch remains eligible under current durable runtime evidence.\n\n'
              '## Exact next authoritative step\n\n'
              'Do not manufacture additional work. Resume only when current authority materially changes or a missing required predecessor/gate becomes durably satisfied. For the visible Brand/prototype chain, the earliest governing boundary is the deferred representative-parent behavioral-validation path: before `2027-08-27`, progression requires an explicit newer Project Owner reactivation/change that supersedes the current deferral and all then-current participant/legal/privacy/gate prerequisites; at or after `2027-08-27`, re-read current authority and re-evaluate the deferral/gates rather than assuming automatic activation. Any other owner-approved canonical change that creates a dependency-satisfied L4 task also requires fresh queue derivation before execution.\n'
          )
          p.write_text(text[:pos]+tail,encoding='utf-8')
          PY
      - name: Verify and commit exhausted boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '## Provisional L4 exhausted stable boundary — 2026-08-29' CURRENT_STATE.md
          grep -Fq 'CANDIDATE_COUNT 0' CURRENT_STATE.md
          grep -Fq 'Current executable provisional-L4 queue: **empty**' CURRENT_STATE.md
          grep -Fq '2027-08-27' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: record exhausted provisional L4 queue'
          git push