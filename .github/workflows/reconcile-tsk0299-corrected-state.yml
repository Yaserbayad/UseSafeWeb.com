name: Reconcile corrected TSK-0299 runtime state

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0299-corrected-state-trigger.txt']

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Run corrected guarded reconciler
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/reconcile_tsk0299_corrected_state.py
      - name: Persist only CURRENT_STATE.md when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CURRENT_STATE.md; then
            echo 'TSK0299_CORRECTED_STATE_WRITE=ALREADY_APPLIED'
            exit 0
          fi
          changed="$(git diff --name-only)"
          if [ "$changed" != "CURRENT_STATE.md" ]; then
            echo "Unexpected changed paths: $changed" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: correct post-CR-0008 TSK-0299 identity binding'
          git push origin HEAD:main
          echo 'TSK0299_CORRECTED_STATE_WRITE=PASS'
