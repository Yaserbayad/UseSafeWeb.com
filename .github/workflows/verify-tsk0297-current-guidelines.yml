name: Verify current TSK-0297 brand guidelines

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0297-current-guidelines-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current TSK-0297 package and active source currency
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_tsk0297_current_guidelines.py
          git diff --check
          git diff --exit-code -- brand/guidelines/TSK-0297 brand/identity/TSK-0301 brand/system/TSK-0300
          echo 'TSK0297_CURRENT_SOURCE_UNCHANGED=PASS'
