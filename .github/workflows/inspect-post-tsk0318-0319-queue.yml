name: Inspect post TSK-0318/0319 queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-post-tsk0318-0319-queue.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Print released and nearby WBS rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path
          path = Path('Plans/Master/WBS/master-wbs.csv')
          with path.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          print('HEADERS=' + '|'.join(rows[0].keys()))
          ids = {'TSK-0300','TSK-0307','TSK-0308','TSK-0309','TSK-0310','TSK-0311','TSK-0312','TSK-0317','TSK-0318','TSK-0319','TSK-0320','TSK-0628'}
          def val(r,*names):
              for n in names:
                  if n in r:
                      return r[n] or ''
              return ''
          for r in rows:
              rid = val(r,'task_id','Task ID','id','ID')
              deps = val(r,'hard_dependencies','Hard Dependencies','dependencies','Dependencies')
              if rid in ids or 'TSK-0318' in deps or 'TSK-0319' in deps:
                  print('ROW=' + ' | '.join(f'{k}={v}' for k,v in r.items()))
          PY