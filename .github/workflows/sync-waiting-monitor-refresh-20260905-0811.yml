name: Sync governed waiting-state refresh 20260905-0811

on:
  push:
    branches:
      - runtime/waiting-monitor-refresh-20260905-0811
    paths:
      - .github/workflows/sync-waiting-monitor-refresh-20260905-0811.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: runtime/waiting-monitor-refresh-20260905-0811
          fetch-depth: 0
          persist-credentials: true
      - name: Persist fresh TSK-0243 WAITING monitor result
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          p = Path('CURRENT_STATE.md')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['checkpoint_schema'] == 'serial-light-checkpoint-v1'
          assert data['project_id'] == 'UseSafeWeb.com'
          assert data['governance_mode'] == 'SERIAL_LIGHT'
          assert data['checkpoint_revision'] == 10
          assert data['baseline']['version'] == 1

          def walk(obj, path=()):
              if isinstance(obj, dict):
                  yield path, obj
                  for k, v in obj.items():
                      yield from walk(v, path + (k,))
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      yield from walk(v, path + (i,))

          nodes = list(walk(data))
          active = [(path, node) for path, node in nodes if isinstance(node, dict) and node.get('project_status') == 'ACTIVE' and node.get('governance_blocker') is None]
          assert len(active) == 1
          tasks = [node for _, node in nodes if isinstance(node, dict) and re.fullmatch(r'TSK-\d{4}', str(node.get('id', ''))) and 'status' in node]
          by_id = {node['id']: node for node in tasks}
          assert by_id['TSK-0243']['status'] == 'WAITING'
          assert by_id['TSK-0452']['status'] == 'WAITING'
          assert by_id['TSK-0360']['status'] == 'WAITING'
          assert by_id['TSK-0369']['status'] == 'WAITING'
          assert by_id['TSK-0455']['status'] == 'WAITING'
          assert not any(node['status'] == 'TODO' for node in tasks), [node['id'] for node in tasks if node['status'] == 'TODO']

          data['checkpoint_revision'] = 11
          by_id['TSK-0243']['wait_details'] = {
            'condition': 'Fresh bounded read-only public preflight attempt 14 confirms verifier DNS routing remains present: verify.usesafeweb.com and the deterministic 32-hex challenge host resolve to 52.157.109.120. The remaining public trust boundary is still not functional: the challenge-host TLS/SNI handshake fails with TLS alert 112 / unrecognized_name, the challenge probe returns HTTP 000, and https://usesafeweb.com/ plus /api/dns-verification/requests remain HTTP 502. Functional public-target proof therefore remains unavailable and fenced.',
            'resolution_check': 'Resume TSK-0243 functional target proof only when a fresh rerun of the existing bounded read-only public preflight shows the challenge verifier host has valid TLS/SNI and the approved probe path is externally reachable, and the public application request/result endpoints are healthy. Recheck current source/version and every material-action fence before any functional POST, DNS rewrite, deployment, certificate/proxy mutation, participant processing, production/public activation, market activation, payment, or launch action.',
            'references': [
              'GitHub Actions workflow run 33900198638 attempt 14 / job 101275465238; completed SUCCESS 2026-09-05T08:11:50Z; TSK0243_PUBLIC_VERIFICATION_WILDCARD=PRESENT; TSK0243_PUBLIC_TRUST_BOUNDARY_PREFLIGHT=ROUTING_PRESENT_REQUIRES_FUNCTIONAL_PROOF; mutation=NONE.'
            ]
          }

          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          chk = json.loads(p.read_text(encoding='utf-8'))
          assert chk['checkpoint_revision'] == 11
          assert chk['baseline']['version'] == 1
          chk_nodes = list(walk(chk))
          chk_tasks = [node for _, node in chk_nodes if isinstance(node, dict) and re.fullmatch(r'TSK-\d{4}', str(node.get('id', ''))) and 'status' in node]
          assert not any(node['status'] == 'TODO' for node in chk_tasks)
          assert next(node for node in chk_tasks if node['id'] == 'TSK-0243')['status'] == 'WAITING'
          PY
          test "$(git diff --name-only)" = "CURRENT_STATE.md"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: record TSK-0243 preflight attempt 14'
          git push origin HEAD:runtime/waiting-monitor-refresh-20260905-0811
