name: Apply CR-0015 V1 deferrals

on:
  push:
    branches:
      - planning/cr0015-v1-deferrals
    paths:
      - .github/workflows/apply-cr0015-v1-deferrals.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: planning/cr0015-v1-deferrals
          fetch-depth: 0
      - name: Apply bounded CR-0015 planning delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import io
          from pathlib import Path

          targets = {
              'TSK-0630', 'TSK-0421', 'TSK-0415', 'TSK-0416',
              'TSK-0370', 'TSK-0499', 'TSK-0242'
          }
          trigger = ('Reactivated after Release 1 controlled testing with approximately '
                     '10-20 people is complete, or earlier only by explicit Project Owner reactivation.')
          timing = 'Deferred until after Release 1 controlled testing with approximately 10-20 people.'
          note = ('Owner Release-1 scope override 2026-09-04 / DEC-0062 / CR-0015: '
                  'deferred as nonessential for the initial controlled 10-20 person test release; '
                  'task remains non-PASS and its ACC/VER/EVD contract is preserved.')

          wbs = Path('Plans/Master/WBS/master-wbs.csv')
          text = wbs.read_text(encoding='utf-8-sig')
          lines = text.splitlines()
          header = next(csv.reader([lines[0]]))
          idx = {name: i for i, name in enumerate(header)}
          changed = set()
          out = [lines[0]]
          permitted = {'Plan_Status', 'Trigger', 'Relative_Timing', 'Notes'}

          for line in lines[1:]:
              if not line:
                  out.append(line)
                  continue
              row = next(csv.reader([line]))
              tid = row[idx['Task_ID']]
              if tid not in targets:
                  out.append(line)
                  continue
              if row[idx['Execution_State']] == 'PASS':
                  raise SystemExit(f'{tid} is already PASS; refusing to defer')
              if row[idx['Plan_Status']] == 'DEFERRED':
                  raise SystemExit(f'{tid} is already DEFERRED; refusing ambiguous replay')
              before = dict(zip(header, row))
              row[idx['Plan_Status']] = 'DEFERRED'
              row[idx['Trigger']] = trigger
              row[idx['Relative_Timing']] = timing
              old_note = row[idx['Notes']].strip()
              row[idx['Notes']] = f'{old_note} {note}'.strip() if old_note else note
              after = dict(zip(header, row))
              actual = {k for k in header if before[k] != after[k]}
              if actual - permitted or 'Plan_Status' not in actual:
                  raise SystemExit(f'{tid} changed unexpected fields: {sorted(actual)}')
              buf = io.StringIO()
              csv.writer(buf, lineterminator='').writerow(row)
              out.append(buf.getvalue())
              changed.add(tid)

          if changed != targets:
              raise SystemExit(f'target mismatch: changed={sorted(changed)} expected={sorted(targets)}')
          wbs.write_text('\n'.join(out) + '\n', encoding='utf-8')

          decisions = Path('Plans/Master/Registers/DECISIONS_TRIGGERS.md')
          dtext = decisions.read_text(encoding='utf-8')
          if 'DEC-0062' in dtext:
              raise SystemExit('DEC-0062 already exists; refusing replay')
          drow = ('| DEC-0062 | New | Additional Release-1 deferral of owner-selected implementation work | '
                  'ACTIVE OWNER DECISION — defer exactly `TSK-0630`, `TSK-0421`, `TSK-0415`, `TSK-0416`, '
                  '`TSK-0370`, `TSK-0499` and `TSK-0242` until after Version 1 / the controlled Release-1 test '
                  'with approximately 10-20 people. These tasks remain non-PASS and retain their complete dependencies, '
                  'acceptance, verification, evidence contracts and valid partial evidence. No other task is deferred by '
                  'this decision. | Explicit Project Owner instruction 2026-09-04; reactivate after Release-1 controlled '
                  'testing is complete or earlier only by explicit Project Owner instruction. | Preserve all affected '
                  'task contracts and evidence. Ordinary hard-dependency consequences remain in force; successors of a '
                  'deferred predecessor are dependency-blocked rather than silently deferred. In particular, deferring '
                  '`TSK-0421` blocks `TSK-0419` -> `TSK-0420` -> `TSK-0414` until reactivation, and `TSK-0499` remains '
                  'source-partial with its accepted evidence preserved. | Project Owner | TSK-0630; TSK-0421; TSK-0415; '
                  'TSK-0416; TSK-0370; TSK-0499; TSK-0242; dependency consequences; CR-0015 | Explicit Project Owner '
                  'instruction 2026-09-04 |')
          marker = '\n<!-- END MODULE: Registers/DECISIONS_TRIGGERS.md -->'
          if marker not in dtext:
              raise SystemExit('decision register marker missing')
          decisions.write_text(dtext.replace(marker, '\n' + drow + marker, 1), encoding='utf-8')

          changes = Path('Plans/Master/Registers/EXCEPTIONS_CHANGE_CONTROLS.md')
          ctext = changes.read_text(encoding='utf-8')
          if 'CR-0015' in ctext:
              raise SystemExit('CR-0015 already exists; refusing replay')
          crow = ('| CR-0015 | Project Owner | 2026-09-04 | Defer exactly seven additional owner-selected tasks until '
                  'after Version 1 / the Release-1 controlled 10-20 person test: `TSK-0630`, `TSK-0421`, `TSK-0415`, '
                  '`TSK-0416`, `TSK-0370`, `TSK-0499`, `TSK-0242`. | Only those seven WBS rows '
                  'Plan_Status/Trigger/Relative_Timing/Notes; DEC-0062; manifest latest-change metadata; generated '
                  'reconstruction/checksums; runtime reconciliation. No task ID, dependency edge, acceptance, verification, '
                  'evidence, action authority, requirement, interface, risk, gate, milestone or material-action fence is '
                  'weakened or removed. | Explicit Project Owner instruction 2026-09-04 naming the seven tasks to defer. | '
                  'Project Owner DEC-0062; actual safety/security/platform/technical reality remains higher authority. | '
                  'Set only the seven named tasks to DEFERRED with deterministic post-Release-1 reactivation; keep '
                  'Execution_State non-PASS; preserve every dependency and ACC/VER/EVD contract and all valid partial '
                  'evidence; leave all nonselected tasks undeferred, with ordinary dependency blocking applied. Rebuild, '
                  'checksum, validate, publish/read back and synchronize CURRENT_STATE. | Explicit Project Owner reversal '
                  'may reactivate any named task earlier; restore PLANNED sequencing only after current authority is reread. '
                  'No evidence is discarded and no task is treated as PASS. | Validator must PASS with 641 tasks and 858 '
                  'dependency edges; parsed WBS comparison must prove exactly seven changed rows and only '
                  'Plan_Status/Trigger/Relative_Timing/Notes changed; dependency edges unchanged; exact GitHub commit/blob '
                  'read-back and runtime reconciliation required. | ACTIVE — creates no PASS, deployment, participant '
                  'processing, telemetry activation, service removal/revocation, payment, production/public activation, '
                  'geographic/market activation, launch or other material-action authority. |')
          marker = '\n<!-- END MODULE: Registers/EXCEPTIONS_CHANGE_CONTROLS.md -->'
          if marker not in ctext:
              raise SystemExit('change-control register marker missing')
          changes.write_text(ctext.replace(marker, '\n' + crow + marker, 1), encoding='utf-8')

          manifest = Path('Plans/Master/MANIFEST.yaml')
          mtext = manifest.read_text(encoding='utf-8')
          old = 'OWNER_RELEASE1_LIMITED_TEST_DEFERRALS_CR_0014'
          new = old + ' / OWNER_ADDITIONAL_V1_DEFERRALS_CR_0015'
          if old not in mtext or 'OWNER_ADDITIONAL_V1_DEFERRALS_CR_0015' in mtext:
              raise SystemExit('manifest CR-0014 anchor missing or CR-0015 already present')
          manifest.write_text(mtext.replace(old, new, 1), encoding='utf-8')
          PY

          python3 Plans/Master/Tools/rebuild_master_plan.py
          python3 Plans/Master/Tools/validate_master_plan.py

          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('Plans/SHA256SUMS.txt')
          rows = []
          for line in p.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              _, rel = line.split('  ', 1)
              f = Path('Plans') / rel
              rows.append(f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {rel}')
          p.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

          python3 Plans/Master/Tools/validate_master_plan.py

          python3 - <<'PY'
          import csv
          from pathlib import Path
          targets = {'TSK-0630','TSK-0421','TSK-0415','TSK-0416','TSK-0370','TSK-0499','TSK-0242'}
          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 641, len(rows)
          by = {r['Task_ID']: r for r in rows}
          assert set(by) >= targets
          for tid in targets:
              r = by[tid]
              assert r['Plan_Status'] == 'DEFERRED', (tid, r['Plan_Status'])
              assert r['Execution_State'] != 'PASS', (tid, r['Execution_State'])
              assert r['Acceptance_ID'] == f'ACC-{tid[4:]}', (tid, r['Acceptance_ID'])
              assert r['Verification_ID'] == f'VER-{tid[4:]}', (tid, r['Verification_ID'])
              assert r['Evidence_ID'] == f'EVD-{tid[4:]}', (tid, r['Evidence_ID'])
          deps = sum(len([x for x in r['Dependencies'].split(';') if x.strip()]) for r in rows)
          assert deps == 858, deps
          print('CR0015_BOUNDED_DELTA=PASS')
          print('CR0015_TASKS=' + ','.join(sorted(targets)))
          print('TASK_COUNT=641')
          print('DEPENDENCY_EDGES=858')
          PY

          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Plans/Master/WBS/master-wbs.csv Plans/Master/Registers/DECISIONS_TRIGGERS.md Plans/Master/Registers/EXCEPTIONS_CHANGE_CONTROLS.md Plans/Master/MANIFEST.yaml Plans/Master/Generated/MASTER_PLAN_FULL.md Plans/SHA256SUMS.txt
          git commit -m 'CR-0015 defer owner-selected tasks until after V1'
          git push origin HEAD:planning/cr0015-v1-deferrals
