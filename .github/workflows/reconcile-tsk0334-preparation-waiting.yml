name: Reconcile TSK-0334 preparation WAITING

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-tsk0334-preparation-waiting.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-state-write
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Reconcile runtime decision boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          test "$(git rev-parse HEAD:design/TSK-0334/SUPPORT_FALSE_POSITIVE_REMOVAL_RECONFIGURATION_FLOWS_CANDIDATE.md)" = "44fab92b51ae8ed8b6f5f325ba1558bcd297eb5f"
          test "$(git rev-parse HEAD:TSK_0334_SUPPORT_FALSE_POSITIVE_REMOVAL_RECONFIGURATION_PREPARATION_EVIDENCE_2026-08-29.md)" = "6ccff5039f1f9d5f9c33e4cbf061fd282b7bbd74"
          python3 .github/scripts/reconcile_tsk0334_preparation_waiting.py
          git diff --check
          changed="$(git diff --name-only)"
          [[ "$changed" == "CURRENT_STATE.md" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          [[ "$(git diff --cached --name-only)" == "CURRENT_STATE.md" ]]
          git commit -m 'state: record TSK-0334 support-flow decision boundary'
          git push origin HEAD:main
          echo "RUNTIME_COMMIT=$(git rev-parse HEAD)"
          echo "RUNTIME_STATE_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
          sha256sum CURRENT_STATE.md | sed 's/^/RUNTIME_STATE_SHA256=/'
