name: Mark hierarchy test statuses

on:
  push:
    paths:
      - '.github/workflows/mark-hierarchy-test-statuses.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  mark-statuses:
    runs-on: ubuntu-latest
    steps:
      - name: Update TEST-LARGE-001 hierarchical task statuses
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.parse

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          base = f'https://api.github.com/repos/{repo}'
          label = 'plan:test-large-hierarchy-001'

          groups = {
              'DONE': [f'T{i:04d}' for i in range(1, 6)],
              'WAITING': [f'T{i:04d}' for i in range(6, 11)],
              'BLOCKED': [f'T{i:04d}' for i in range(11, 16)],
          }
          claim_state = {'DONE': 'COMPLETE', 'WAITING': 'WAITING', 'BLOCKED': 'BLOCKED'}

          def api(method, path, data=None):
              url = path if path.startswith('http') else base + path
              body = None if data is None else json.dumps(data).encode('utf-8')
              req = urllib.request.Request(url, data=body, method=method)
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              req.add_header('User-Agent', 'hierarchy-plan-status-test')
              if body is not None:
                  req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=60) as r:
                  raw = r.read()
                  return json.loads(raw.decode('utf-8')) if raw else None

          task_map = {}
          page = 1
          while True:
              q = urllib.parse.urlencode({'state':'all','labels':label,'per_page':100,'page':page})
              rows = api('GET', '/issues?' + q)
              if not rows:
                  break
              for issue in rows:
                  m = re.match(r'^(T\d{4})\b', issue.get('title',''))
                  if m:
                      task_map[m.group(1)] = issue
              if len(rows) < 100:
                  break
              page += 1

          expected = [tid for tids in groups.values() for tid in tids]
          missing = [tid for tid in expected if tid not in task_map]
          if missing:
              raise RuntimeError(f'Missing hierarchical tasks: {missing}')

          updated = []
          for status, tids in groups.items():
              for tid in tids:
                  issue = task_map[tid]
                  body = issue.get('body') or ''
                  body = re.sub(r'^- \*\*Status:\*\* .*$', f'- **Status:** {status}', body, count=1, flags=re.M)
                  body = re.sub(r'^- \*\*Claim state:\*\* .*$', f'- **Claim state:** {claim_state[status]}', body, count=1, flags=re.M)
                  payload = {'body': body}
                  if status == 'DONE':
                      payload.update({'state': 'closed', 'state_reason': 'completed'})
                  else:
                      payload.update({'state': 'open'})
                  api('PATCH', f'/issues/{issue["number"]}', payload)
                  updated.append({'task': tid, 'issue': issue['number'], 'status': status})

          print(json.dumps(updated, indent=2))
          PY
