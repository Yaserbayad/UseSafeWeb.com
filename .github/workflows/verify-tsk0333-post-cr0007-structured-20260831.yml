name: Verify post-CR-0007 TSK-0333 structured contract

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/verify_tsk0333_post_cr0007_structured_20260831.py'
      - '.github/workflows/verify-tsk0333-post-cr0007-structured-20260831.yml'
      - 'prototype/TSK-0333/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current TSK-0333 structured contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/verify_tsk0333_post_cr0007_structured_20260831.py
          git diff --check
          test -z "$(git status --porcelain)"
