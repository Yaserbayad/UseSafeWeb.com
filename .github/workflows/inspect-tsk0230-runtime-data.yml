name: Inspect TSK-0230 runtime data footprint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tsk0230-runtime-data.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-adguard-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Inspect privacy-relevant runtime without reading request records
        shell: bash
        run: |
          set -euo pipefail
          mid_hash="$(sha256sum /etc/machine-id | awk '{print $1}')"
          test "$mid_hash" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          sudo nginx -T >"$tmp" 2>/dev/null

          # Never read or print access/error log contents. Inspect config directives and file metadata only.
          access_directives="$(grep -E '^[[:space:]]*access_log[[:space:]]+' "$tmp" | sed -E 's/^[[:space:]]+//' | sort -u || true)"
          error_directives="$(grep -E '^[[:space:]]*error_log[[:space:]]+' "$tmp" | sed -E 's/^[[:space:]]+//' | sort -u || true)"
          log_formats="$(grep -E '^[[:space:]]*log_format[[:space:]]+' "$tmp" | sed -E 's/^[[:space:]]+//' | sed -E 's/\$remote_addr/[REMOTE_ADDR]/g;s/\$http_[A-Za-z0-9_]+/[HTTP_FIELD]/g;s/\$request[^ ]*/[REQUEST_FIELD]/g' | sort -u || true)"

          enabled_access_paths="$(printf '%s\n' "$access_directives" | awk '$1=="access_log" && $2!="off;" && $2!="off" {gsub(/;/,"",$2); print $2}' | sort -u || true)"
          access_enabled=NO
          if [ -n "$enabled_access_paths" ]; then access_enabled=YES; fi

          meta=""
          if [ -n "$enabled_access_paths" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                syslog:*) meta="${meta}${path}: non-file target configured\n" ;;
                *)
                  if sudo test -e "$path"; then
                    size="$(sudo stat -c '%s' "$path")"
                    mode="$(sudo stat -c '%a' "$path")"
                    owner="$(sudo stat -c '%U:%G' "$path")"
                    meta="${meta}${path}: exists=yes size_bytes=${size} mode=${mode} owner=${owner}\n"
                  else
                    meta="${meta}${path}: exists=no\n"
                  fi
                  ;;
              esac
            done <<< "$enabled_access_paths"
          fi

          # The accepted production AdGuard configuration is root-protected; probe readability with sudo.
          adguard_yaml=/opt/AdGuardHome/AdGuardHome.yaml
          if ! sudo test -r "$adguard_yaml"; then
            adguard_yaml=/opt/AdGuardHome/conf/AdGuardHome.yaml
          fi
          sudo test -r "$adguard_yaml"
          qlog="$(sudo python3 - "$adguard_yaml" <<'PY'
          import sys, yaml
          d=yaml.safe_load(open(sys.argv[1]))
          q=d.get('querylog',{}) or {}
          s=d.get('statistics',{}) or {}
          dns=d.get('dns',{}) or {}
          print('querylog_enabled='+str(bool(q.get('enabled',False))).lower())
          print('querylog_file_enabled='+str(bool(q.get('file_enabled',False))).lower())
          print('statistics_enabled='+str(bool(s.get('enabled',False))).lower())
          print('anonymize_client_ip='+str(bool(dns.get('anonymize_client_ip',False))).lower())
          print('anonymize_client_ip_schema=dns.anonymize_client_ip')
          PY
          )"

          grep -q '^querylog_enabled=false$' <<< "$qlog"
          grep -q '^querylog_file_enabled=false$' <<< "$qlog"
          grep -q '^statistics_enabled=false$' <<< "$qlog"
          grep -q '^anonymize_client_ip=true$' <<< "$qlog"

          cat > TSK_0230_RUNTIME_DATA_FOOTPRINT_INSPECTION_2026-08-28.md <<EOF
          # TSK-0230 runtime data-footprint inspection

          **Date:** 2026-08-28  
          **Target:** production runner host adguardvm  
          **Purpose:** privacy-safe read-only inspection for TSK-0230. No access/error log contents or DNS query records were read or exported.

          ## Verifier correction history

          - Run 33193360160 failed before evidence because the verifier tested root-protected AdGuard config readability as the unprivileged runner user. No target mutation occurred.
          - Run 33193437786 corrected that permission probe and exposed a second verifier defect: it read `anonymize_client_ip` from the YAML root instead of the accepted AdGuard schema path `dns.anonymize_client_ip`. That false negative contradicted TSK-0206 and is not accepted as runtime evidence.
          - This revision reads and asserts the accepted schema path `dns.anonymize_client_ip` and fails closed unless all four privacy flags match the accepted baseline.

          ## Target identity

          - machine-id SHA-256: \`${mid_hash}\`
          - expected accepted production fingerprint: MATCH

          ## Nginx effective logging configuration

          ### access_log directives

          \`\`\`
          ${access_directives:-<none explicit in effective config>}
          \`\`\`

          - Effective explicit non-off access-log target present: **${access_enabled}**

          ### Access-log target metadata only

          \`\`\`
          $(printf '%b' "${meta:-<no enabled access-log target metadata>}")
          \`\`\`

          ### error_log directives

          \`\`\`
          ${error_directives:-<none explicit in effective config>}
          \`\`\`

          ### log-format declaration shape (sensitive variable names redacted)

          \`\`\`
          ${log_formats:-<none explicit in effective config>}
          \`\`\`

          ## AdGuard privacy flags

          \`\`\`
          ${qlog}
          \`\`\`

          ## Privacy boundary

          This inspection intentionally did not read, sample, grep, print or commit any Nginx log record, DNS query, source IP, domain, URL payload, user agent, participant identifier, credential or secret. It records configuration directives and file metadata only.

          ## Disposition

          Nginx access logging is acceptable for TSK-0230 only if the effective target remains explicitly off, or a future governed necessity case defines its data/purpose/lawful basis/retention/access/deletion before activation. AdGuard query/file logging and statistics must remain disabled and `dns.anonymize_client_ip` must remain enabled. Any material change reopens the privacy/data-flow acceptance that depends on these facts.
          EOF

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TSK_0230_RUNTIME_DATA_FOOTPRINT_INSPECTION_2026-08-28.md
          git commit -m "evidence: correct TSK-0230 runtime data footprint"
          git push
