name: Diagnose TSK-0318 guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-tsk0318-guard.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Print guard evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "machine=$(sha256sum /etc/machine-id | awk '{print $1}')"
          echo "state=$(git hash-object CURRENT_STATE.md)"
          echo "candidate=$(git hash-object TSK_0318_PUBLIC_PRODUCT_SETUP_IA_DESIGN_CANDIDATE_2026-08-28.md)"
          echo "evidence=$(git hash-object TSK_0318_PUBLIC_PRODUCT_SETUP_IA_DESIGN_PREPARATION_EVIDENCE_2026-08-28.md)"
          grep -F 'TSK-0318 HUMAN_ONLY preparation selected' CURRENT_STATE.md || true
          grep -F 'selected runtime **TODO** item for **preparation only**' CURRENT_STATE.md || true
