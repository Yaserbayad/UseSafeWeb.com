name: Verify TSK-0334 acceptance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-tsk0334-acceptance.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify approved TSK-0334 candidate and evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          test "$(git rev-parse HEAD:Plans/Master/WBS/master-wbs.csv)" = "f23b4f017d1baf73258fa30ecd71549bbfe1b815"
          test "$(git rev-parse HEAD:design/TSK-0334/SUPPORT_FALSE_POSITIVE_REMOVAL_RECONFIGURATION_FLOWS_CANDIDATE.md)" = "44fab92b51ae8ed8b6f5f325ba1558bcd297eb5f"
          test "$(git rev-parse HEAD:TSK_0334_SUPPORT_FALSE_POSITIVE_REMOVAL_RECONFIGURATION_PREPARATION_EVIDENCE_2026-08-29.md)" = "6ccff5039f1f9d5f9c33e4cbf061fd282b7bbd74"
          test "$(git rev-parse HEAD:TSK_0334_SUPPORT_FALSE_POSITIVE_REMOVAL_RECONFIGURATION_ACCEPTANCE_EVIDENCE_2026-08-30.md)" = "95163e48e754c3c551460977959e9e07ac45da27"
          python3 - <<'PY'
          import csv,re
          from pathlib import Path
          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          r=next(x for x in rows if x['Task_ID'].strip()=='TSK-0334')
          assert r['Dependencies'].strip()=='TSK-0330'
          assert r['Action_Authority'].strip()=='HUMAN_ONLY'
          ev=Path('TSK_0334_SUPPORT_FALSE_POSITIVE_REMOVAL_RECONFIGURATION_ACCEPTANCE_EVIDENCE_2026-08-30.md').read_text(encoding='utf-8')
          cand=Path('design/TSK-0334/SUPPORT_FALSE_POSITIVE_REMOVAL_RECONFIGURATION_FLOWS_CANDIDATE.md').read_text(encoding='utf-8')
          assert 'APPROVE TSK-0334 SUPPORT FALSE-POSITIVE REMOVAL RECONFIGURATION FLOWS' in ev
          assert '2026-08-30T08:09:29Z' in ev
          assert '44fab92b51ae8ed8b6f5f325ba1558bcd297eb5f' in ev
          for code in ['SUP-01','SUP-02','SUP-03','SUP-04','SUP-05']:
              m=re.search(rf'^## \d+\. {code}.*?(?=^## \d+\.|\Z)',cand,re.M|re.S)
              assert m, code
              b=m.group(0)
              for label in ['Accessible path','Minimal diagnostic','Protection consequence','Escalation option','Success state']:
                  assert label in b, (code,label)
          for n in range(1,13): assert f'TC-0334-{n:02d}' in cand
          print('TSK0334_OWNER_APPROVAL_BINDING=PASS')
          print('TSK0334_APPROVED_BLOB_IDENTITY=PASS')
          print('TSK0334_ACCEPTANCE_CONTRACT=PASS')
          print('TSK0334_FINAL_ACCEPTANCE=PASS')
          PY
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
