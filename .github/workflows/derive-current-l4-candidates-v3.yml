name: Rederive current L4 candidates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/derive-current-l4-candidates-v3.yml'

permissions:
  contents: read

jobs:
  derive:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Derive dependency-satisfied L4 candidates from canonical runtime PASS encodings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,re
          from pathlib import Path
          state=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          pass_ids=set()
          m=re.search(r'## Current technical task state\s+### PASS\s+(.*?)(?=\n### |\n## )',state,re.S)
          if m:
              pass_ids.update(re.findall(r'`(TSK-\d{4})`',m.group(1)))
          for block in re.split(r'(?=### TSK-\d{4} accepted stable state)',state):
              hm=re.match(r'### (TSK-\d{4}) accepted stable state',block)
              if hm and '**PASS' in block[:2200]: pass_ids.add(hm.group(1))
          pass_ids.update(re.findall(r'`(TSK-\d{4})[^`]*`:\s*\*\*PASS\b',state))
          print('PASS_COUNT',len(pass_ids))
          with open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          pri={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          out=[]
          for idx,r in enumerate(rows):
              if r.get('Lifecycle_Stage')!='L4': continue
              if r.get('Plan_Status') not in {'PLANNED','IN_PROGRESS','ACTIVE',''}: continue
              if r['Task_ID'] in pass_ids: continue
              deps=[x.strip() for x in r.get('Dependencies','').split(';') if x.strip()]
              if all(x in pass_ids for x in deps): out.append((pri.get(r.get('Priority',''),9),idx,r))
          for _,idx,r in sorted(out):
              print('CANDIDATE order=%s id=%s priority=%s authority=%s wbs_state=%s deps=%s title=%s acc=%s risk=%s' % (idx,r['Task_ID'],r.get('Priority'),r.get('Action_Authority'),r.get('Execution_State'),r.get('Dependencies'),r.get('Title'),r.get('Acceptance_Criteria'),r.get('Risk_Reference')))
          print('CANDIDATE_COUNT',len(out))
          PY
