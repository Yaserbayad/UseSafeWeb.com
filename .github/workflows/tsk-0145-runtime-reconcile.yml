name: Reconcile TSK-0145 runtime state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tsk-0145-runtime-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact pre-state and accepted evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "3097079edb8f850a6966b74f0b7a35bea226f860"
          test "$(git hash-object TSK_0145_REQUIREMENT_TO_EVIDENCE_TRACEABILITY_2026-08-28.md)" = "d358d9129f37809743a1f599703a706de7333051"
          test "$(git hash-object TSK_0145_REQUIREMENT_TO_EVIDENCE_TRACEABILITY_EVIDENCE_2026-08-28.md)" = "5e82ef3f7737f90e0578c3393626a71cd1b50e1f"

      - name: Apply bounded runtime reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path('CURRENT_STATE.md')
          text = path.read_text(encoding='utf-8')

          old_updated = '**Updated:** 2026-08-28T19:50:38Z'
          if text.count(old_updated) != 1:
              raise SystemExit('unexpected Updated pre-state')
          updated = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          text = text.replace(old_updated, f'**Updated:** {updated}', 1)

          pass_anchor = '### PASS\n\n'
          if text.count(pass_anchor) < 1:
              raise SystemExit('PASS anchor missing')
          pass_bullet = ('- `TSK-0145` — requirement-to-evidence traceability matrix — artifact '
                         '`TSK_0145_REQUIREMENT_TO_EVIDENCE_TRACEABILITY_2026-08-28.md`, blob '
                         '`d358d9129f37809743a1f599703a706de7333051`; acceptance evidence '
                         '`TSK_0145_REQUIREMENT_TO_EVIDENCE_TRACEABILITY_EVIDENCE_2026-08-28.md`, blob '
                         '`5e82ef3f7737f90e0578c3393626a71cd1b50e1f`; publication commit '
                         '`f8aece90103e50e78bcf0468b304000a408fb510`; verification commit '
                         '`4d736411fcd79853d4c4705cc68f8e3ccaff0ad9`: PASS.\n')
          if '`TSK-0145` — requirement-to-evidence traceability matrix' in text:
              raise SystemExit('TSK-0145 PASS bullet already present')
          text = text.replace(pass_anchor, pass_anchor + pass_bullet, 1)

          stable_anchor = '\n## Runtime safeguards\n'
          if text.count(stable_anchor) != 1:
              raise SystemExit('runtime safeguards anchor mismatch')
          stable = '''\n### TSK-0145 accepted stable state\n\n`TSK-0145 — Build requirement-to-evidence traceability matrix`: **PASS for the bounded provisional L4 traceability-matrix task under DEC-0050/CR-0003**. Derived matrix `TSK_0145_REQUIREMENT_TO_EVIDENCE_TRACEABILITY_2026-08-28.md`, blob `d358d9129f37809743a1f599703a706de7333051`, publication commit `f8aece90103e50e78bcf0468b304000a408fb510`; acceptance evidence `TSK_0145_REQUIREMENT_TO_EVIDENCE_TRACEABILITY_EVIDENCE_2026-08-28.md`, blob `5e82ef3f7737f90e0578c3393626a71cd1b50e1f`, verification commit `4d736411fcd79853d4c4705cc68f8e3ccaff0ad9`. ACC-0145 is satisfied: all 91 canonical requirements (`REQ-0001`..`REQ-0091`) have source, transparently derived rationale, canonical priority, acceptance test/verification, canonical owner, transparently derived release target, requirement disposition/status and implementing-task linkage; current validated relationship state identifies 0 orphan requirements.\n\nThe matrix is explicitly derived/non-authoritative and does not duplicate the requirement register, WBS, package charter, runtime state or owner decisions. Requirement-level PASS was not inferred from matrix presence; `REQ-0022` remains intentionally unresolved under owner deferral, and account/dashboard, participant, legal, build, publication and launch boundaries remain unchanged. `RSK-0002` remains OPEN.\n'''
          text = text.replace(stable_anchor, stable + stable_anchor, 1)

          queue_marker = '## Queue status after current reconciliation\n'
          q = text.find(queue_marker)
          if q < 0:
              raise SystemExit('queue marker missing')
          if text.find(queue_marker, q + 1) >= 0:
              raise SystemExit('multiple queue markers')
          new_tail = '''## Queue status after TSK-0145 reconciliation\n\n`TSK-0145` is runtime **PASS** for its bounded traceability-matrix acceptance. The artifact and acceptance evidence were both published and read back from `main`; 91/91 canonical requirements are covered and the current validated relationship state identifies 0 orphan requirements. No requirement, owner decision, gate, participant authority, build authority, publication authority or launch authority is promoted by this PASS.\n\nNo successor task is selected by this synchronization write. Selection must be recomputed from current canonical WBS/runtime/gates after this write is read back.\n\n## Exact next authoritative step\n\nRead back this TSK-0145 runtime reconciliation, verify the exact commit/blob and preserved unrelated state, then recompute the deterministic eligible queue from current authority. Reject candidates requiring unavailable representative-user evidence, owner/legal/privacy approval, unresolved trigger/gate, missing direct predecessor proof, or any open security/privacy deviation that their own acceptance would falsely certify. Persist/read back the selected next bounded AUTO_ALLOWED task before execution.\n'''
          text = text[:q] + new_tail
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify bounded diff and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- CURRENT_STATE.md
          grep -Fq '### TSK-0145 accepted stable state' CURRENT_STATE.md
          grep -Fq 'TSK-0145` is runtime **PASS**' CURRENT_STATE.md
          grep -Fq 'No successor task is selected by this synchronization write.' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: reconcile TSK-0145 PASS'
          git push
