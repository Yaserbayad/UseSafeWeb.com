name: Stage TSK-0431 recovery scheduler patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/governance-fix-recovery-scheduler.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Generate patched workflow as ordinary text artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/adguard-clean-recovery-drill.yml').read_text()
          old="""  recover:\n    runs-on: [self-hosted, linux, x64, adguartestdvm_correct]\n    timeout-minutes: 25\n"""
          new="""  recover:\n    strategy:\n      fail-fast: false\n      max-parallel: 2\n      matrix:\n        slot: [a, b]\n    runs-on: [self-hosted, linux, x64]\n    timeout-minutes: 25\n"""
          assert src.count(old)==1
          src=src.replace(old,new)
          old="""      - name: Timed clean-server rebuild and acceptance\n        shell: bash\n"""
          new="""      - name: Timed clean-server rebuild and acceptance\n        id: drill\n        shell: bash\n"""
          assert src.count(old)==1
          src=src.replace(old,new)
          old="""          [[ \"$(hostname -s)\" == 'adguartestdvm' ]]\n          [[ \"$(sha256sum /etc/machine-id | awk '{print $1}')\" == 'e09868443c476b30eae778d191ceedee57ed6f27a74856eae1d0709c68f1c852' ]]\n          sudo -n true\n"""
          new="""          echo 'recovery_target=false' >> \"$GITHUB_OUTPUT\"\n          git fetch --quiet origin main\n          if git cat-file -e origin/main:TSK_0431_PROJECT_CONTROLLED_RECOVERY_DRILL_EVIDENCE_2026-08-28.md 2>/dev/null; then\n            echo 'durable_recovery_evidence_already_exists=true'\n            exit 0\n          fi\n          host=\"$(hostname -s)\"\n          machine_sha=\"$(sha256sum /etc/machine-id | awk '{print $1}')\"\n          if [[ \"$host\" == 'adguardvm' && \"$machine_sha\" == 'e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2' ]]; then\n            echo 'production_runner_no_mutation=PASS'\n            sleep 60\n            exit 0\n          fi\n          [[ \"$host\" == 'adguartestdvm' ]]\n          [[ \"$machine_sha\" == 'e09868443c476b30eae778d191ceedee57ed6f27a74856eae1d0709c68f1c852' ]]\n          echo 'recovery_target=true' >> \"$GITHUB_OUTPUT\"\n          sudo -n true\n"""
          assert src.count(old)==1
          src=src.replace(old,new)
          old="""      - name: Publish privacy-safe drill evidence\n        shell: bash\n"""
          new="""      - name: Publish privacy-safe drill evidence\n        if: steps.drill.outputs.recovery_target == 'true'\n        shell: bash\n"""
          assert src.count(old)==1
          src=src.replace(old,new)
          src += """\n  confirm:\n    needs: recover\n    runs-on: [self-hosted, linux, x64]\n    timeout-minutes: 3\n    permissions:\n      contents: read\n    steps:\n      - uses: actions/checkout@v6\n        with:\n          fetch-depth: 1\n      - name: Confirm durable recovery evidence exists\n        shell: bash\n        run: |\n          set -Eeuo pipefail\n          git fetch --quiet origin main\n          git show origin/main:TSK_0431_PROJECT_CONTROLLED_RECOVERY_DRILL_EVIDENCE_2026-08-28.md > /tmp/evidence.md\n          grep -Fq '**Project-controlled recovery drill: PASS.**' /tmp/evidence.md\n          grep -Fq 'azure_native_restore_exercised=false' /tmp/evidence.md\n          echo 'TSK_0431_DURABLE_RECOVERY_EVIDENCE=PASS'\n"""
          Path('TSK_0431_RECOVERY_WORKFLOW_PATCHED.txt').write_text(src)
          PY
          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TSK_0431_RECOVERY_WORKFLOW_PATCHED.txt
          git diff --cached --check
          git commit -m 'governance: stage patched TSK-0431 recovery workflow'
          git push origin HEAD:main
