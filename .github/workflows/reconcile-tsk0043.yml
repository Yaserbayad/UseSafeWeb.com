name: Reconcile TSK-0043 runtime state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0043.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact pre-state and accepted evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "67ee2f4c53d02fbdf2602413ac10b7ce508c2544"
          test "$(git hash-object TSK_0043_CROSS_FUNCTIONAL_REQUIREMENTS_REVIEW_2026-08-28.md)" = "10ffbb7986584136013f353bdd962daf6380acca"
          test "$(git hash-object TSK_0043_CROSS_FUNCTIONAL_REQUIREMENTS_REVIEW_EVIDENCE_2026-08-28.md)" = "d38c32aaa270e68957e1a287d7e660faeec804f5"
          grep -Fq 'TSK-0043 — Run cross-functional requirements review and resolve conflicts` is the selected runtime **TODO** work item.' CURRENT_STATE.md

      - name: Apply bounded TSK-0043 PASS reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')

          old_updated = '**Updated:** 2026-08-28T20:53:36Z'
          if text.count(old_updated) != 1:
              raise SystemExit('unexpected Updated pre-state')
          updated = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          text = text.replace(old_updated, f'**Updated:** {updated}', 1)

          anchor = '\n## Runtime safeguards\n'
          if text.count(anchor) != 1:
              raise SystemExit('runtime safeguards anchor mismatch')
          stable = '''\n### TSK-0043 accepted stable state\n\n`TSK-0043 — Run cross-functional requirements review and resolve conflicts`: **PASS for the bounded provisional L4 requirements-review acceptance under DEC-0050/CR-0003**. Review `TSK_0043_CROSS_FUNCTIONAL_REQUIREMENTS_REVIEW_2026-08-28.md`, blob `10ffbb7986584136013f353bdd962daf6380acca`, publication commit `a9058ab0d4a02bd8dac17fe929a0200d4571beb7`; independent evidence `TSK_0043_CROSS_FUNCTIONAL_REQUIREMENTS_REVIEW_EVIDENCE_2026-08-28.md`, blob `d38c32aaa270e68957e1a287d7e660faeec804f5`, verification commit `22456106cd0ed2abfb81907f872872fd729dde5c`. ACC-0043 is satisfied: 11 critical contradiction classes were reviewed with 0 unresolved critical conflicts; two noncritical interpretation items have named owners and gate-relative due conditions; no current requirement contradicts frozen privacy, accountless scope, or current LG-05 authority.\n\n`NCF-0043-01` preserves legacy `G-04` as an alias resolved through the current Gate Register to `LG-05`; `NCF-0043-02` prevents `REQ-0039` from being misread as proof that provisional L4 was behaviorally validated. Neither changes canonical requirements or owner decisions. `RSK-0002` remains OPEN; `REQ-0022` remains intentionally unresolved; LG-03/LG-04/LG-05/LG-06 remain non-PASS; no L5/L6 build, participant processing, legal completion, payment, publication or launch is authorized by this PASS.\n'''
          if '### TSK-0043 accepted stable state' in text:
              raise SystemExit('TSK-0043 stable state already present')
          text = text.replace(anchor, stable + anchor, 1)

          marker = '## Queue status after TSK-0145 reconciliation\n'
          i = text.find(marker)
          if i < 0 or text.find(marker, i + 1) >= 0:
              raise SystemExit('queue marker mismatch')
          tail = '''## Queue status after TSK-0043 reconciliation\n\n`TSK-0043` is runtime **PASS** for its bounded cross-functional requirements-review acceptance. The review and independent acceptance evidence were published and read back from `main`. No successor is selected by this reconciliation write.\n\nCurrent fences remain unchanged: `RSK-0002` OPEN; `REQ-0022` unresolved; LG-03/LG-04/LG-05/LG-06 non-PASS; account/dashboard deferred; L5/L6 build, real-participant processing, legal completion, payment, publication and launch not authorized.\n\n## Exact next authoritative step\n\nRecompute the deterministic eligible queue from the current canonical WBS/runtime/gates after this TSK-0043 PASS read-back. Consider only current bounded L4 AUTO_ALLOWED work whose hard dependencies are directly satisfied and whose own acceptance does not require real-participant evidence, an owner-only decision, unresolved legal fact, L5/L6 authority, or public/production activation. Persist and read back the selected successor before executing it.\n'''
          text = text[:i] + tail
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify diff and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '### TSK-0043 accepted stable state' CURRENT_STATE.md
          grep -Fq 'TSK-0043` is runtime **PASS** for its bounded cross-functional requirements-review acceptance.' CURRENT_STATE.md
          grep -Fq 'No successor is selected by this reconciliation write.' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: reconcile TSK-0043 PASS'
          git push
