name: Reconcile verified runtime preservation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-runtime-preservation-20260905.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify evidence and apply exact preservation repair
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='c2175c5b5e3a5797f38638e36503f76d6cafbd60'
          EVIDENCE_BLOB='e87d1aaca75c155f88348f52adad2b6eb78e589a'
          LEGACY_BLOB='d45c7b1f98ceba6265944aabd970c250dc7be2d2'
          WBS_BLOB='357c5e1be3b455e7efddd329d6a2468e3125b502'
          test "$(git hash-object CURRENT_STATE.md)" = "$EXPECTED_BLOB"
          test "$(git hash-object TSK_0010_RUNTIME_PRESERVATION_RECONCILIATION_EVIDENCE_2026-09-05.md)" = "$EVIDENCE_BLOB"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "$WBS_BLOB"
          test "$(git rev-parse 20e2763c0be2124378e3158ac559aed826bc6765:CURRENT_STATE.md)" = "$LEGACY_BLOB"

          cp CURRENT_STATE.md /tmp/CURRENT_STATE.before
          python3 - <<'PY'
          import copy,csv,json
          from pathlib import Path

          RESTORE='''TSK-0026 TSK-0027 TSK-0028 TSK-0139 TSK-0165 TSK-0166 TSK-0167 TSK-0168 TSK-0169 TSK-0202 TSK-0207 TSK-0214 TSK-0225 TSK-0227 TSK-0228 TSK-0298 TSK-0302 TSK-0374 TSK-0428 TSK-0429 TSK-0430 TSK-0431 TSK-0437 TSK-0441 TSK-0442 TSK-0443 TSK-0510 TSK-0511 TSK-0512 TSK-0513 TSK-0514 TSK-0559'''.split()
          EXCLUDE='''TSK-0243 TSK-0360 TSK-0369 TSK-0399 TSK-0455 TSK-0483 TSK-0499 TSK-0630'''.split()
          OWNER_DEFER={'TSK-0455','TSK-0631','TSK-0633','TSK-0634','TSK-0635','TSK-0637','TSK-0640','TSK-0630','TSK-0421','TSK-0415','TSK-0416','TSK-0370','TSK-0499','TSK-0242'}
          STATUS={'TODO','WAITING','BLOCKED','PASS'}
          assert len(RESTORE)==32 and len(set(RESTORE))==32
          assert len(EXCLUDE)==8 and len(set(EXCLUDE))==8
          assert not (set(RESTORE)&set(EXCLUDE))
          assert not (set(RESTORE)&OWNER_DEFER)

          path=Path('CURRENT_STATE.md')
          text=path.read_text(encoding='utf-8')
          before=json.loads(text)
          assert text == json.dumps(before,indent=2,ensure_ascii=False)+'\n'
          assert before['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert before['project_id']=='UseSafeWeb.com'
          assert before['governance_mode']=='SERIAL_LIGHT'
          assert before['checkpoint_revision']==27
          assert before['baseline']['version']==1
          assert before['runtime']['project_status']=='ACTIVE'
          assert before['runtime']['governance_blocker'] is None
          assert before['runtime']['human_constraints']==[]

          base={x['id']:x for x in before['baseline']['work_items']}
          runtime={x['id']:x for x in before['runtime']['items']}
          assert len(base)==641 and len(runtime)==641 and set(base)==set(runtime)
          assert runtime['TSK-0010']['status']=='TODO'
          assert runtime['TSK-0011']['status']=='PASS'
          for tid in RESTORE:
              assert runtime[tid]['status']=='WAITING', (tid,runtime[tid]['status'])
              assert 'wait' in runtime[tid], tid
              assert runtime[tid].get('acceptance_references',[])==[], tid
              acc='ACC-'+tid.split('-')[1]
              assert [x['id'] for x in base[tid]['acceptance_criteria']]==[acc], tid
          exclusion_snapshot={tid:copy.deepcopy(runtime[tid]) for tid in EXCLUDE}

          evidence=Path('TSK_0010_RUNTIME_PRESERVATION_RECONCILIATION_EVIDENCE_2026-09-05.md').read_text(encoding='utf-8')
          assert 'Result: **RUNTIME PRESERVATION RECONCILIATION VERIFIED**.' in evidence
          assert 'run `33980615850`, job `101345052785`, artifact `9973633064`' in evidence
          for tid in RESTORE:
              assert tid in evidence
          for tid in EXCLUDE:
              assert tid in evidence

          after=copy.deepcopy(before)
          after['checkpoint_revision']=28
          by_id={x['id']:x for x in after['runtime']['items']}
          for tid in RESTORE:
              acc='ACC-'+tid.split('-')[1]
              target=by_id[tid]
              target['status']='PASS'
              target.pop('wait',None)
              target['acceptance_references']=[{
                'ac_id':acc,
                'evidence_type':'GITHUB_BLOB',
                'reference':f'Yaserbayad/UseSafeWeb.com TSK_0010_RUNTIME_PRESERVATION_RECONCILIATION_EVIDENCE_2026-09-05.md; blob e87d1aaca75c155f88348f52adad2b6eb78e589a; evidence commit 2d20e5ef4b1f64b5df9b94bc1e7f2054a438c562; immutable legacy checkpoint blob d45c7b1f98ceba6265944aabd970c250dc7be2d2; task {tid}; acceptance {acc}',
                'summary':'Historical current PASS is preserved under POL-003 from immutable legacy runtime evidence; the current frozen acceptance identity is unchanged and no later owner deferral supersedes this task.',
                'verification_context':'Source checkpoint revision 27 blob c2175c5b5e3a5797f38638e36503f76d6cafbd60; frozen WBS commit 20e2763c0be2124378e3158ac559aed826bc6765 blob 357c5e1be3b455e7efddd329d6a2468e3125b502; exact failure-boundary trace run 33980615850 job 101345052785 artifact 9973633064; reconciliation evidence blob e87d1aaca75c155f88348f52adad2b6eb78e589a.'
              }]

          # No semantic baseline mutation and no unrelated runtime mutation.
          assert after['baseline']==before['baseline']
          assert after['baseline']['version']==1
          assert after['runtime']['project_status']=='ACTIVE'
          assert after['runtime']['governance_blocker'] is None
          assert after['runtime']['human_constraints']==[]
          before_items={x['id']:x for x in before['runtime']['items']}
          after_items={x['id']:x for x in after['runtime']['items']}
          for tid,old in before_items.items():
              if tid not in RESTORE:
                  assert after_items[tid]==old, tid
          for tid in EXCLUDE:
              assert after_items[tid]==exclusion_snapshot[tid], tid
          assert after_items['TSK-0010']==before_items['TSK-0010']

          # Runtime structural invariants.
          for item in after['runtime']['items']:
              assert item['status'] in STATUS, item['id']
              assert set(item).issubset({'id','status','wait','blocker','acceptance_references'}), item['id']
              assert isinstance(item.get('acceptance_references',[]),list), item['id']
              if item['status']=='PASS':
                  assert 'wait' not in item and 'blocker' not in item, item['id']
                  for ref in item.get('acceptance_references',[]):
                      assert set(ref)=={'ac_id','evidence_type','reference','summary','verification_context'}, item['id']
                      assert ref['ac_id'] in {x['id'] for x in base[item['id']]['acceptance_criteria']}, item['id']
              elif item['status']=='WAITING':
                  assert 'wait' in item and 'blocker' not in item, item['id']
              elif item['status']=='BLOCKED':
                  assert 'blocker' in item and 'wait' not in item, item['id']
              elif item['status']=='TODO':
                  assert 'wait' not in item and 'blocker' not in item, item['id']

          assert sum(1 for tid in RESTORE if after_items[tid]['status']=='PASS')==32
          path.write_text(json.dumps(after,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          reread=json.loads(path.read_text(encoding='utf-8'))
          assert reread==after
          print('RUNTIME_PRESERVATION_RECONCILIATION=PASS restored=32 excluded_unchanged=8 revision=28 baseline=1')
          PY

          git diff --check -- CURRENT_STATE.md
          git diff --stat -- CURRENT_STATE.md

      - name: Recheck stale-write boundary, remove transport, and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = 'c2175c5b5e3a5797f38638e36503f76d6cafbd60'
          test "$(git show origin/main:TSK_0010_RUNTIME_PRESERVATION_RECONCILIATION_EVIDENCE_2026-09-05.md | git hash-object --stdin)" = 'e87d1aaca75c155f88348f52adad2b6eb78e589a'
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/reconcile-runtime-preservation-20260905.yml
          git add CURRENT_STATE.md
          printf '%s\n' '.github/workflows/reconcile-runtime-preservation-20260905.yml' 'CURRENT_STATE.md' | sort > /tmp/expected
          git diff --cached --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git commit -m 'state: restore verified historical runtime PASS state'
          git push origin HEAD:main
