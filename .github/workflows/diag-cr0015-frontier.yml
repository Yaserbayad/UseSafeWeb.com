name: Diagnose post-CR0015 governed frontier

on:
  push:
    branches:
      - diag/post-cr0015-frontier-20260904-v1
    paths:
      - .github/workflows/diag-cr0015-frontier.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 38acee6500d21aa55856ff794306a8151fd294cd
          fetch-depth: 1
      - name: Inspect authoritative TSK-0360 frontier contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path

          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))
          by={r['Task_ID']:r for r in rows}
          for tid in ['TSK-0360','TSK-0358','TSK-0317','TSK-0369','TSK-0243','TSK-0418']:
              if tid in by: print('ROW='+json.dumps(by[tid],sort_keys=True))

          state=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          for tid in ['TSK-0360','TSK-0358','TSK-0317','TSK-0369','TSK-0243','TSK-0418']:
              print('STATE_MATCHES='+tid)
              for i,line in enumerate(state.splitlines(),1):
                  if tid in line and re.search(r'PASS|TODO|WAITING|BLOCKED|non-PASS',line,re.I):
                      print(f'{i}:{line}')

          roots=[Path('website'),Path('evidence'),Path('contracts'),Path('docs'),Path('.github/workflows')]
          needles=['TSK-0360','ACC-0360','VER-0360','EVD-0360','TSK0360']
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.md','.txt','.json','.js','.mjs','.ts','.tsx','.yml','.yaml','.sh'}: continue
                  try: text=p.read_text(encoding='utf-8')
                  except Exception: continue
                  if any(n in text for n in needles):
                      print('RELATED='+str(p))
          PY
