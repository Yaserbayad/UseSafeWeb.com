name: Audit TSK-0026 gate evidence package

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-tsk0026-gate-evidence-package.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Audit eight-criterion mapping and CR-0002 boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          report='TSK_0026_G02_LG03_EVIDENCE_PACKAGE_2026-08-28.md'
          [[ "$(git hash-object "$report")" == 'dbeda1202728bdd6ec6d1f838842fa576e733d8e' ]]
          [[ "$(git hash-object Plans/Master/WBS/master-wbs.csv)" == '2e4560103b71bb350b14673ce3e415afc3dbfe3a' ]]
          [[ "$(git hash-object Plans/Master/Registers/GATES.md)" == '692a51b920f3af9c8c937e712d19a0841c57eabf' ]]
          [[ "$(git hash-object VALIDATION_READINESS_GATE.md)" == 'b3b0efd0cc0f40faa1ecab190c7469b8dff12ec1' ]]
          [[ "$(git hash-object Plans/Master/Layers/LAYER_5_AI_EXECUTION_EVIDENCE_STATE_CONTROL.md)" == '5e3137861f546f2b5f7bd6ac152b1b32694a439a' ]]
          [[ "$(git hash-object CR_0002_OWNER_LEGAL_SEQUENCING_OVERRIDE_EVIDENCE_2026-08-28.md)" == '9234fe5b764801db513df0c477120efd2b096e18' ]]
          grep -Fq 'TSK-0026,WP-0025,PKG-01' Plans/Master/WBS/master-wbs.csv
          grep -Fq 'Each of the eight canonical gate criteria maps to current evidence, owner, status, deviation, and source; no planned setting is treated as executed evidence.' Plans/Master/WBS/master-wbs.csv
          grep -Fq '| LG-03 | Validation Readiness | L2 |' Plans/Master/Registers/GATES.md
          grep -Fq '1. pilot data flow/data inventory documented;' VALIDATION_READINESS_GATE.md
          grep -Fq '8. payments/marketing disabled for Experiment 1.' VALIDATION_READINESS_GATE.md
          for n in 1 2 3 4 5 6 7 8; do
            grep -Eq "^\| ${n} \|" "$report"
          done
          count="$(grep -Ec '^\| [1-8] \|' "$report")"
          [[ "$count" == '8' ]]
          grep -Fq '**PASS:** 1, 3, 4, 7, 8.' "$report"
          grep -Fq '**DEFERRED / OPEN:** 2, 5, 6.' "$report"
          grep -Fq '**LG-03 Validation Readiness is NOT PASS on the evidence currently available**' "$report"
          grep -Fq 'Not treated as PASS, exemption, waiver, registration, payment, representation or legal opinion.' "$report"
          grep -Fq 'Gate decision authority:** Project Owner / HUMAN_ONLY (TSK-0027)' "$report"
          ! grep -Fq 'LG-03 Validation Readiness is PASS' "$report"
          ! grep -Fqi 'authorizes recruitment' "$report"
          echo 'TSK_0026_EVIDENCE_PACKAGE_AUDIT=PASS'
