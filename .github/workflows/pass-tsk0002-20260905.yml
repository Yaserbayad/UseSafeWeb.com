name: Record TSK-0002 evidence-backed PASS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pass-tsk0002-20260905.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify evidence and apply exact PASS mutation
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='a71e82d722efdb33d962c19ee6fcb496dee90cea'
          test "$(git hash-object CURRENT_STATE.md)" = "$EXPECTED_BLOB"
          test -f TSK_0002_CHECKPOINT_DECISION_RECORD_EVIDENCE_2026-09-05.md
          test "$(git hash-object TSK_0002_CHECKPOINT_DECISION_RECORD_EVIDENCE_2026-09-05.md)" = 'ac03f35d37e94abc681b3a2bf6f8fd5ffb946c2d'

          cp CURRENT_STATE.md /tmp/CURRENT_STATE.before
          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path

          path=Path('CURRENT_STATE.md')
          text=path.read_text(encoding='utf-8')
          before=json.loads(text)
          assert text == json.dumps(before, indent=2, ensure_ascii=False) + '\n'
          assert before['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert before['project_id']=='UseSafeWeb.com'
          assert before['governance_mode']=='SERIAL_LIGHT'
          assert before['checkpoint_revision']==20
          assert before['baseline']['version']==1
          assert before['runtime']['project_status']=='ACTIVE'
          assert before['runtime']['governance_blocker'] is None

          work={x['id']:x for x in before['baseline']['work_items']}
          items={x['id']:x for x in before['runtime']['items']}
          assert work['TSK-0002']['depends_on']==['TSK-0004']
          assert work['TSK-0002']['acceptance_criteria']==[{
              'id':'ACC-0002',
              'condition':'A current-state file identifies authoritative status and supersedes stale status lines in older detailed files.'
          }]
          assert items['TSK-0004']['status']=='PASS'
          assert items['TSK-0002']=={
              'id':'TSK-0002',
              'status':'TODO',
              'acceptance_references':[]
          }

          evidence=Path('TSK_0002_CHECKPOINT_DECISION_RECORD_EVIDENCE_2026-09-05.md').read_text(encoding='utf-8')
          assert 'ACC-0002: SATISFIED.' in evidence
          assert 'runtime.items` in `CURRENT_STATE.md` are the current runtime authority' in evidence
          assert 'Deviations: none observed for ACC-0002.' in evidence

          after=copy.deepcopy(before)
          after['checkpoint_revision']=21
          aitems={x['id']:x for x in after['runtime']['items']}
          aitems['TSK-0002']={
              'id':'TSK-0002',
              'status':'PASS',
              'acceptance_references':[{
                  'ac_id':'ACC-0002',
                  'evidence_type':'GITHUB_BLOB',
                  'reference':'Yaserbayad/UseSafeWeb.com TSK_0002_CHECKPOINT_DECISION_RECORD_EVIDENCE_2026-09-05.md; blob ac03f35d37e94abc681b3a2bf6f8fd5ffb946c2d; publication commit 4745356e4a7a400b7ec42ff1f7ab536011f60d49',
                  'summary':'Direct evidence backfill verifies that the current checkpoint declares runtime item status authoritative and prevents stale WBS execution snapshots from overriding later confirmed checkpoint state.',
                  'verification_context':'Frozen WBS commit 20e2763c0be2124378e3158ac559aed826bc6765, blob 357c5e1be3b455e7efddd329d6a2468e3125b502; source checkpoint revision 20 blob a71e82d722efdb33d962c19ee6fcb496dee90cea; dependency TSK-0004 PASS; evidence blob ac03f35d37e94abc681b3a2bf6f8fd5ffb946c2d.'
              }]
          }

          assert after['baseline']==before['baseline']
          assert after['runtime']['project_status']==before['runtime']['project_status']
          assert after['runtime']['governance_blocker']==before['runtime']['governance_blocker']
          for wid,old in items.items():
              if wid!='TSK-0002': assert aitems[wid]==old, wid
          assert after['checkpoint_revision']==before['checkpoint_revision']+1
          assert after['baseline']['version']==before['baseline']['version']
          assert aitems['TSK-0002']['status']=='PASS'
          assert set(aitems['TSK-0002'])=={'id','status','acceptance_references'}
          assert len(aitems['TSK-0002']['acceptance_references'])==1
          assert aitems['TSK-0002']['acceptance_references'][0]['ac_id']=='ACC-0002'

          path.write_text(json.dumps(after, indent=2, ensure_ascii=False)+'\n',encoding='utf-8')
          reparsed=json.loads(path.read_text(encoding='utf-8'))
          assert reparsed==after
          print('TSK_0002_PASS_MUTATION=PASS revision=21 baseline=1')
          PY

          git diff --check -- CURRENT_STATE.md
          git diff --stat -- CURRENT_STATE.md
          git diff -- CURRENT_STATE.md

      - name: Recheck stale-write boundary, remove transport, and commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='a71e82d722efdb33d962c19ee6fcb496dee90cea'
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = "$EXPECTED_BLOB"
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pass-tsk0002-20260905.yml
          git add CURRENT_STATE.md
          printf '%s\n' '.github/workflows/pass-tsk0002-20260905.yml' 'CURRENT_STATE.md' > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          git commit -m 'state: confirm TSK-0002 evidence backfill pass'
          git push origin HEAD:main
