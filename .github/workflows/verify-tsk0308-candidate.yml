name: Verify TSK-0308 design-system candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0308-candidate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify authority and candidate structure
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 - <<'PY'
          import csv, json, pathlib, re, subprocess

          def blob(path):
              return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()

          expected_sources={
            'brand/system/TSK-0300/README.md':'4baa67f565c14c3034fca47bb5fad0b9ff71b091',
            'brand/system/TSK-0300/tokens.css':'cd7d9a7cd5109e1ff0baa76532495dfd7a27a70f',
            'brand/system/TSK-0300/components.css':'831e92a74b6dda04252d93242cb33bd491a02381',
            'prototype/TSK-0309/BASELINE.md':'76bb848ebdf6a2aee4dd84bc18e8af5ba8a99dbc',
            'prototype/TSK-0324/UI_COMPONENT_RULES.md':'0b7012a12070f7eccf45a1bbb2f453fde8507ff6',
            'prototype/TSK-0328/INFORMATION_ARCHITECTURE_NAVIGATION.md':'4efb624005061e242e427994953d0fc00fcd745f',
            'content/TSK-0322/PRODUCT_VOICE_CLAIMS_TERMINOLOGY.md':'d12c1e707f0390915002b27bf3a5073d0135d466',
            'brand/identity/TSK-0301/README.md':'b8ffd2ed234465a238558a7b94e56274de49696a',
            'Plans/Master/WBS/master-wbs.csv':'f23b4f017d1baf73258fa30ecd71549bbfe1b815'
          }
          for p,s in expected_sources.items(): assert blob(p)==s,(p,s,blob(p))

          expected_candidate={
            'prototype/TSK-0308/SHARED_RESPONSIVE_DESIGN_SYSTEM_CANDIDATE.md':'cd5c217ca7882589617dc94701fe5b6ac0eaf8d4',
            'prototype/TSK-0308/candidate.css':'de5571379ff240f36b5aecd50f555a07176dbd32',
            'prototype/TSK-0308/reference.html':'fe86b9ec2b5d5e5e11cf4d135baca69f6b4a5862',
            'prototype/TSK-0308/DESIGN_SYSTEM_MAP.json':'cd83279cdf5381cd7dae3feb177439158c1f9197'
          }
          for p,s in expected_candidate.items(): assert blob(p)==s,(p,s,blob(p))

          with pathlib.Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          by={r['Task_ID']:r for r in rows}; r=by['TSK-0308']
          assert r['Lifecycle_Stage']=='L4'
          assert r['Priority']=='HIGH'
          assert r['Dependencies']=='TSK-0309; TSK-0300'
          assert r['Acceptance_ID']=='ACC-0308' and r['Verification_ID']=='VER-0308' and r['Evidence_ID']=='EVD-0308'
          assert r['AI_Capability_A0_A4']=='A1' and r['Action_Authority']=='HUMAN_ONLY'
          for phrase in ['content/error/loading/verification/uncertain/recovery states','tokens','accessibility behavior','localization expansion','implementation specs']:
              assert phrase in r['Acceptance_Criteria'],phrase

          state=pathlib.Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          assert re.search(r'## TSK-0300 accepted stable state',state)
          assert re.search(r'## TSK-0309 accepted stable state',state)
          assert re.search(r'`TSK-0300[^\n]*\*\*PASS\*\*',state)
          assert re.search(r'`TSK-0309[^\n]*\*\*PASS\*\*',state)
          assert 'DEC-0052 / CR-0005' in state

          doc=pathlib.Path('prototype/TSK-0308/SHARED_RESPONSIVE_DESIGN_SYSTEM_CANDIDATE.md').read_text(encoding='utf-8')
          css=pathlib.Path('prototype/TSK-0308/candidate.css').read_text(encoding='utf-8')
          html=pathlib.Path('prototype/TSK-0308/reference.html').read_text(encoding='utf-8')
          ds=json.loads(pathlib.Path('prototype/TSK-0308/DESIGN_SYSTEM_MAP.json').read_text(encoding='utf-8'))

          assert '**CANDIDATE / HUMAN DECISION REQUIRED / NOT PASS**' in doc
          assert 'TSK-0308 cannot become PASS without explicit Project Owner approval' in doc
          assert ds['status']=='CANDIDATE_HUMAN_DECISION_REQUIRED_NOT_PASS'
          assert ds['action_authority']=='HUMAN_ONLY'
          assert ds['owner_decision']=={'required':True,'approved':False,'pass_allowed_before_approval':False}
          assert ds['token_authority']=='brand/system/TSK-0300/tokens.css'
          assert ds['primitive_authority']=='brand/system/TSK-0300/components.css'

          # No token/brand/font fork in the candidate composition layer.
          assert not re.search(r'#[0-9A-Fa-f]{3,8}\b',css)
          assert not re.search(r'--sw-[\w-]+\s*:',css)
          assert 'font-family:' not in css
          assert 'url(' not in css
          assert 'var(--sw-' in css
          assert '@media (prefers-reduced-motion: reduce)' in css
          assert '[dir="rtl"]' in css

          comps=ds['components']
          assert len(comps)==13 and [c['id'] for c in comps]==[f'DS-{i:02d}' for i in range(1,14)]
          assert all(c['testable'] is True for c in comps)
          required={'content','error','loading','verification','uncertain','recovery'}
          assert set(ds['required_state_classes'])==required
          assert all(ds['required_state_classes'][x] for x in required)

          labels=[x['label'] for x in ds['protection_states']]
          assert labels==['Verified','You confirmed this is set up','Action needed','Not covered','Status uncertain','Removed']
          assert ds['protection_states'][0]['evidence']=='system'
          assert ds['protection_states'][1]['evidence']=='parent_confirmation'
          assert ds['responsive_viewports']==[320,768,1024,1440]
          assert [(x['tag'],x['direction']) for x in ds['locales']]==[('en','ltr'),('tr','ltr'),('ar','rtl')]
          assert all(x['market_activation_claim'] is False for x in ds['locales'])

          for req in ['REQ-0028','REQ-0029','REQ-0030','CON-0010','CON-0017','CON-0022','INT-0009','INT-0010']:
              assert req in ds['requirements'] and req in doc

          forbidden=set(ds['forbidden'])
          for item in ['mandatory_account','dashboard_navigation','routine_human_support_dependency','overall_safety_score','parent_confirmation_as_system_verification','local_brand_palette_fork','local_logo_geometry_fork']:
              assert item in forbidden

          for state_class in required:
              assert f'data-state-class="{state_class}"' in html or state_class=='content'
          for label in labels:
              assert label in html
          assert 'aria-busy="true"' in html and 'Checking…' in html
          assert 'SafeWeb has not independently verified this setting.' in html
          assert 'Start over clears the web journey state only. It does not remove device DNS configuration.' in html
          assert 'routine human support' in html
          assert 'not an Arabic translation or native-speaker validation claim' in html
          assert '<input' not in html.lower() and '<form' not in html.lower()

          # Candidate package only: no evidence/PASS file is fabricated before owner decision.
          files=sorted(str(p) for p in pathlib.Path('prototype/TSK-0308').iterdir() if p.is_file())
          assert files==[
            'prototype/TSK-0308/DESIGN_SYSTEM_MAP.json',
            'prototype/TSK-0308/SHARED_RESPONSIVE_DESIGN_SYSTEM_CANDIDATE.md',
            'prototype/TSK-0308/candidate.css',
            'prototype/TSK-0308/reference.html'
          ],files

          print('TSK0308_WBS_HUMAN_ONLY=PASS')
          print('TSK0308_DEPENDENCIES_CURRENT_PASS=PASS')
          print('TSK0308_SOURCE_BLOBS=PASS')
          print('TSK0308_CANDIDATE_STATUS_NOT_PASS=PASS')
          print('TSK0308_COMPONENTS=13/13_PASS')
          print('TSK0308_REQUIRED_STATE_CLASSES=6/6_PASS')
          print('TSK0308_PROTECTION_STATES=6/6_PASS')
          print('TSK0308_RESPONSIVE_LOCALE_SPEC=PASS')
          print('TSK0308_NO_TOKEN_BRAND_FONT_FORK=PASS')
          print('TSK0308_ACCOUNT_SUPPORT_TRUTH_FENCES=PASS')
          PY

      - name: Verify rendered responsive candidate with Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then kill "$server_pid" 2>/dev/null || true; fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          (
            cd "$tmp"
            npm init -y >/dev/null 2>&1
            npm install --no-save --no-audit --no-fund playwright@1.62.0 >/dev/null 2>&1
          )
          export NODE_PATH="$tmp/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"
          "$tmp/node_modules/.bin/playwright" install chromium >/dev/null

          python3 -m http.server 4175 --bind 127.0.0.1 >/tmp/tsk0308-http.log 2>&1 &
          server_pid=$!
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4175/prototype/TSK-0308/reference.html >/dev/null && break
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4175/prototype/TSK-0308/reference.html >/dev/null

          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const consoleErrors=[];
            page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => consoleErrors.push(String(e)));
            const url='http://127.0.0.1:4175/prototype/TSK-0308/reference.html';

            for (const width of [320,768,1024,1440]) {
              await page.setViewportSize({width,height:1200});
              await page.goto(url,{waitUntil:'networkidle'});
              const v=await page.evaluate(() => ({
                sw:getComputedStyle(document.documentElement).getPropertyValue('--sw-brand-green').trim(),
                overflow:document.documentElement.scrollWidth-window.innerWidth,
                publicVisible:!!document.querySelector('[data-reference="public"]'),
                setupVisible:!!document.querySelector('[data-reference="setup"]'),
                stateLabels:[...document.querySelectorAll('[data-state] .sw-ds-state-item__label')].map(x=>x.textContent.trim()),
                busy:document.querySelector('[data-state-class="loading"]')?.getAttribute('aria-busy'),
                rtl:getComputedStyle(document.querySelector('[data-reference="rtl-structure"]')).direction,
                techDir:getComputedStyle(document.querySelector('[data-reference="rtl-structure"] .sw-ds-tech')).direction,
                buttons:[...document.querySelectorAll('.sw-button')].map(x=>{const r=x.getBoundingClientRect(); return [r.width,r.height];})
              }));
              if (!v.sw) throw new Error(`tokens not loaded at ${width}`);
              if (v.overflow > 1) throw new Error(`page overflow ${v.overflow}px at ${width}`);
              if (!v.publicVisible || !v.setupVisible) throw new Error(`reference sections missing at ${width}`);
              for (const label of ['Verified','You confirmed this is set up','Action needed','Not covered','Status uncertain','Removed']) {
                if (!v.stateLabels.includes(label)) throw new Error(`missing ${label} at ${width}`);
              }
              if (v.busy!=='true') throw new Error(`aria-busy missing at ${width}`);
              if (v.rtl!=='rtl' || v.techDir!=='ltr') throw new Error(`RTL/LTR isolation failed at ${width}`);
              for (const [w,h] of v.buttons) if (w < 24 || h < 24) throw new Error(`target below 24px at ${width}: ${w}x${h}`);
              console.log(`VIEWPORT_${width}=PASS`);
            }

            await page.setViewportSize({width:320,height:1200});
            await page.goto(url,{waitUntil:'networkidle'});
            const firstButton=page.locator('.sw-button').first();
            await firstButton.focus();
            const focus=await firstButton.evaluate(el=>{const s=getComputedStyle(el); return {style:s.outlineStyle,width:s.outlineWidth};});
            if (focus.style==='none' || parseFloat(focus.width)<1) throw new Error('visible focus missing');
            console.log('FOCUS_VISIBLE=PASS');

            await page.emulateMedia({reducedMotion:'reduce'});
            const animation=await page.locator('.sw-ds-busy__indicator').evaluate(el=>getComputedStyle(el).animationName);
            if (animation!=='none') throw new Error(`reduced motion failed: ${animation}`);
            console.log('REDUCED_MOTION=PASS');

            if (consoleErrors.length) throw new Error(`console errors: ${consoleErrors.join(' | ')}`);
            console.log('BROWSER_CONSOLE=PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          echo 'TSK0308_RENDERED_CANDIDATE=PASS'

      - name: Repository cleanliness
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
