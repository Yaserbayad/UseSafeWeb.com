name: Audit TSK-0325 authority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tsk0325-authority-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect TSK-0325 contract and existing work
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 - <<'PY'
          import csv, pathlib, re
          with pathlib.Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          by={r['Task_ID']:r for r in rows}
          r=by['TSK-0325']
          print('TSK0325_ROW_BEGIN')
          for k,v in r.items(): print(f'{k}={v}')
          print('TSK0325_ROW_END')
          state=pathlib.Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          print('RUNTIME_HITS='+str(state.count('TSK-0325')))
          for i,m in enumerate(re.finditer('TSK-0325',state),1):
              s=max(0,m.start()-500); e=min(len(state),m.start()+1800)
              print(f'RUNTIME_HIT_{i}_BEGIN')
              print(state[s:e].replace('\n','\\n'))
              print(f'RUNTIME_HIT_{i}_END')
          matches=[]
          for p in pathlib.Path('.').rglob('*'):
              if p.is_file() and ('0325' in p.name.lower() or '0325' in str(p).lower()):
                  if '.git/' not in str(p): matches.append(str(p))
          print('EXISTING_PATHS_BEGIN')
          for p in sorted(matches): print(p)
          print('EXISTING_PATHS_END')
          deps=[d.strip() for d in re.split(r'[;,]',r.get('Dependencies','')) if d.strip()]
          print('DEPENDENCY_ROWS_BEGIN')
          for d in deps:
              dr=by.get(d,{})
              print('|'.join([d,dr.get('Title',''),dr.get('Lifecycle_Stage',''),dr.get('Plan_Status',''),dr.get('Execution_State',''),dr.get('Evidence_Reference',''),dr.get('Action_Authority','')]))
          print('DEPENDENCY_ROWS_END')
          print('TSK0325_AUTHORITY_AUDIT=PASS')
          PY
      - name: Clean checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
