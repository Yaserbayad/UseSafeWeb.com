name: Verify TSK-0318 post-CR-0008 acceptance

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0318-verification-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify TSK-0318 current acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, re, subprocess
          from pathlib import Path

          artifact_path=Path('TSK_0318_POST_CR0008_DUAL_MODE_PUBLIC_PRODUCT_SETUP_IA_2026-09-01.md')
          wbs_path=Path('Plans/Master/WBS/master-wbs.csv')
          graph_path=Path('Plans/Master/RELATIONSHIP_INDEX.yaml')
          runtime_path=Path('CURRENT_STATE.md')
          expected_artifact='975e2e7a8e85e9408e0bbbc2be226f3fdd012db3'
          expected_wbs='b27a0c5df2f5636d8ed71051e9e26a68959a2616'
          expected_graph='c108d2c162bcea2ee4cc01def46d0487a9501032'
          expected_runtime='c4594837623b2462fea250fb360aed8fcabc90f3'

          def blob(path):
              return subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
          assert artifact_path.exists(), 'missing current TSK-0318 artifact'
          assert blob(artifact_path)==expected_artifact, (blob(artifact_path), expected_artifact)
          assert blob(wbs_path)==expected_wbs, (blob(wbs_path), expected_wbs)
          assert blob(graph_path)==expected_graph, (blob(graph_path), expected_graph)
          assert blob(runtime_path)==expected_runtime, (blob(runtime_path), expected_runtime)

          with wbs_path.open(newline='', encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          byid={r['Task_ID']:r for r in rows if r.get('Task_ID')}
          row=byid['TSK-0318']
          assert row['Lifecycle_Stage']=='L4'
          assert row['Priority']=='HIGH'
          assert row['AI_Capability_A0_A4']=='A3'
          assert row['Action_Authority']=='AUTO_ALLOWED'
          assert row['Dependencies'].strip()=='TSK-0315'
          assert row['Acceptance_ID']=='ACC-0318'
          assert row['Verification_ID']=='VER-0318'
          assert row['Evidence_ID']=='EVD-0318'
          assert 'Each page/screen has one purpose' in row['Acceptance_Criteria']
          assert 'entry/exit' in row['Acceptance_Criteria']
          assert 'SEO/index intent' in row['Acceptance_Criteria']
          assert 'privacy/accessibility requirement' in row['Acceptance_Criteria']
          assert 'no duplicated or missing critical step' in row['Acceptance_Criteria']

          runtime=runtime_path.read_text(encoding='utf-8')
          # Direct current predecessor and preserved runtime anchors.
          assert '## TSK-0315 current accepted stable state' in runtime
          assert '## TSK-0229 current accepted stable state' in runtime
          assert '## TSK-0331 current accepted stable state' in runtime
          assert '## TSK-0319 current accepted stable state' in runtime
          assert '## TSK-0485 current accepted stable state' in runtime
          assert 'POST-CR-0007' in runtime[runtime.find('## TSK-0315 current accepted stable state'):runtime.find('## TSK-0315 current accepted stable state')+2500]

          art=artifact_path.read_text(encoding='utf-8')
          # Supersession / dual-mode boundary.
          required=[
              'This artifact supersedes the account-exclusion-dependent parts',
              'Accountless core',
              'Optional parent account',
              'Core value never requires authentication',
              'Anonymous and persistent domains are separate',
              'No browsing/query/activity history or child account',
              'No broad DNS administration',
              'Recovery is first-class',
              'Public and product are distinct systems',
              'Sign in / Manage devices',
              'Continue without account',
              'No automatic J0/J1',
              'Dashboard presence is not protection proof',
              'Logout, revoke/unlink, dashboard-record deletion, account deletion, anonymous-state deletion, and physical DNS removal',
              'NOINDEX',
              'keyboard/focus',
              'RTL',
              'No successor becomes PASS merely because this candidate exists',
          ]
          for s in required:
              assert s in art, f'missing required semantic: {s}'

          # Old contradictory IA clauses must not govern current artifact.
          forbidden=[
              'No Login, Dashboard, Account, Pricing',
              'No account/session lifecycle is introduced by navigation structure',
              'account/dashboard remains deferred under EXC-0001',
          ]
          for s in forbidden:
              assert s not in art, f'stale account-exclusion clause retained: {s}'

          # Exact current route inventory: every public/core/account page has one complete ACC matrix row.
          expected_ids=[*(f'P{i:02d}' for i in range(1,10)),*(f'C{i:02d}' for i in range(1,15)),*(f'A{i:02d}' for i in range(1,16))]
          seen=[]
          matrix_rows=[]
          for line in art.splitlines():
              if re.match(r'^\| [PCA]\d\d ', line):
                  cells=[c.strip() for c in line.strip().strip('|').split('|')]
                  assert len(cells)==8, (cells[0] if cells else line, len(cells))
                  assert all(cells), f'empty ACC-0318 matrix cell: {cells}'
                  seen.append(cells[0].split()[0])
                  matrix_rows.append(cells)
          assert seen==expected_ids, (seen, expected_ids)
          assert len(set(seen))==len(seen)==38
          for cells in matrix_rows:
              # purpose, entry, exit, owner, SEO, privacy, accessibility all non-empty above;
              # require explicit index decision in every page row.
              assert ('INDEX' in cells[5] or 'NOINDEX' in cells[5]), f'missing SEO decision: {cells[0]}'

          # Critical current Version-1 surface/lifecycle coverage.
          coverage=[
              '/start','/setup/route','/setup/native','/setup/dns','/setup/verify',
              '/setup/protection-map','/setup/help/:issue','/setup/reset','/setup/remove','/setup/recovery',
              '/account/sign-in','/account/auth-result','/account` dashboard','/account/devices/add',
              '/account/devices/:device','/account/devices/:device/reverify','/account/devices/:device/reinstall',
              '/account/devices/:device/replace','/account/devices/:device/revoke','/account/devices/:device/delete-record',
              '/account/settings','/account/logout','/account/delete','/account/session-expired','/account/provider-unavailable'
          ]
          for s in coverage:
              assert s in art, f'missing current IA surface: {s}'

          # Scope/privacy/security negative assertions.
          negatives=[
              'mandatory login for core value',
              'child accounts/profiles',
              'browsing/query/activity history',
              'raw/broad DNS administration',
              'payment gate before core value',
              'overall safety score / all-clear page',
          ]
          for s in negatives:
              assert s in art, f'missing explicit exclusion: {s}'

          # Direct-successor impact is bounded and truthful.
          assert '**TSK-0310:**' in art and 'accountless public-to-setup prototype remains evidence for the core path only' in art
          assert '**TSK-0311:**' in art and 'localization architecture may continue' in art

          # Relationship graph must still contain the task and current direct WBS successor IDs.
          graph=graph_path.read_text(encoding='utf-8')
          for tid in ('TSK-0318','TSK-0310','TSK-0311'):
              assert tid in graph, f'missing graph task reference: {tid}'

          print('TSK0318_WBS_CONTRACT=PASS')
          print('TSK0318_CURRENT_PREDECESSOR=PASS')
          print('TSK0318_DUAL_MODE_SCOPE=PASS')
          print('TSK0318_IA_MATRIX_ROWS=38')
          print('TSK0318_SEO_PRIVACY_ACCESSIBILITY=PASS')
          print('TSK0318_LIFECYCLE_SEPARATION=PASS')
          print('TSK0318_SCOPE_NEGATIVES=PASS')
          print('TSK0318_SUCCESSOR_IMPACT=PASS')
          print('TSK0485_PRESERVED_INPUT=PASS')
          print('TSK0319_PRESERVED_INPUT=PASS')
          print('TSK0318_ACCEPTANCE=PASS')
          print('ARTIFACT_BLOB='+blob(artifact_path))
          print('WBS_BLOB='+blob(wbs_path))
          print('GRAPH_BLOB='+blob(graph_path))
          print('RUNTIME_BLOB='+blob(runtime_path))
          PY
