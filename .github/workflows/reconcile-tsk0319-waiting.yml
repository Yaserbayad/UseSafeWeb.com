name: Reconcile TSK-0319 HUMAN_ONLY waiting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0319-waiting.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact pre-state and preparation evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "e811cea4d302318158e6e6557776c159ce5c579f"
          test "$(git hash-object TSK_0319_AUTOMATED_VERIFICATION_TROUBLESHOOTING_RECOVERY_HELP_DESIGN_CANDIDATE_2026-08-28.md)" = "86de353dd8446f02ed48c80638391a3caa852e59"
          test "$(git hash-object TSK_0319_AUTOMATED_VERIFICATION_TROUBLESHOOTING_RECOVERY_HELP_DESIGN_PREPARATION_EVIDENCE_2026-08-28.md)" = "d4d8a4bbf3e8f9ad3e04f45fdf8f342df188a854"
          grep -Fq 'TSK-0319 HUMAN_ONLY preparation selected' CURRENT_STATE.md
          grep -Fq 'selected runtime **TODO** item for **preparation only**' CURRENT_STATE.md
      - name: Apply bounded WAITING reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          old_updated = '**Updated:** 2026-08-28T21:54:35Z'
          if text.count(old_updated) != 1:
              raise SystemExit('unexpected Updated pre-state')
          updated = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text = text.replace(old_updated, f'**Updated:** {updated}', 1)
          marker = '## Queue status — TSK-0319 HUMAN_ONLY preparation selected\n'
          i = text.find(marker)
          if i < 0 or text.find(marker, i + 1) >= 0:
              raise SystemExit('queue marker mismatch')
          tail = (
              '### TSK-0319 preparation stable state\n\n'
              '`TSK-0319 — Design automated verification, issue-specific troubleshooting, safe reset/reinstall/remove, and point-of-need help`: runtime **WAITING**, not PASS. Bounded AI preparation is complete. Candidate `TSK_0319_AUTOMATED_VERIFICATION_TROUBLESHOOTING_RECOVERY_HELP_DESIGN_CANDIDATE_2026-08-28.md`, exact Git blob `86de353dd8446f02ed48c80638391a3caa852e59`, publication commit `674c83b716039cd2165c41f0b223ebc1dc551560`; preparation evidence `TSK_0319_AUTOMATED_VERIFICATION_TROUBLESHOOTING_RECOVERY_HELP_DESIGN_PREPARATION_EVIDENCE_2026-08-28.md`, blob `d4d8a4bbf3e8f9ad3e04f45fdf8f342df188a854`, publication commit `4fe2c2a80d49d86cb2dbefeaeb5120e12b769c6f`. Preparation independently verifies complete ACC-0319 design coverage while preserving A1/HUMAN_ONLY authority.\n\n'
              'The candidate provides fourteen issue-specific decision trees, seven privacy-safe automatic-check classes, point-of-need help placement, changed-condition retry/circuit-breaker rules, separate web-reset/device-removal semantics, Android/iPhone recovery confirmation, no-history diagnostics and narrow privacy/security/safeguarding/operator escalation boundaries.\n\n'
              'TSK-0319 cannot become PASS until an authorized human explicitly APPROVES, REQUESTS CHANGES to, or REJECTS exact candidate blob `86de353dd8446f02ed48c80638391a3caa852e59`. Approval remains provisional internal L4 only and does not authorize implementation, diagnostic collection, staffed support, participant/public use or launch.\n\n'
              '## Queue status after TSK-0319 preparation\n\n'
              '`TSK-0318` and `TSK-0319` are both **WAITING** on independent HUMAN_ONLY design dispositions. TSK-0318 blocks TSK-0311 and contributes to the TSK-0310 prototype chain; TSK-0319 blocks TSK-0628. Nearby AUTO_ALLOWED work remains dependency-blocked by these human decisions or by representative-parent/deferred scope. Current global fences remain unchanged.\n\n'
              '## Exact next authoritative step\n\n'
              'Obtain the smallest human dispositions on exact TSK-0318 candidate blob `64f0e6382a5ce166c0aad2ad2e86a3796c5df379` and exact TSK-0319 candidate blob `86de353dd8446f02ed48c80638391a3caa852e59`. If either is approved unchanged, independently re-check its ACC against that exact blob, reconcile PASS, then recompute and continue the L4 queue; if changes are requested, revise only the specified elements and re-verify.\n'
          )
          text = text[:i] + tail
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify diff and commit WAITING
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '### TSK-0319 preparation stable state' CURRENT_STATE.md
          grep -Fq '`TSK-0318` and `TSK-0319` are both **WAITING**' CURRENT_STATE.md
          grep -Fq '86de353dd8446f02ed48c80638391a3caa852e59' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: mark TSK-0319 waiting for human troubleshooting decision'
          git push
