name: Reconcile TSK-0335 preparation WAITING

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-tsk0335-preparation-waiting.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Reconcile runtime decision boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          test "$(git rev-parse HEAD:design/TSK-0335/PROTECTION_MAP_COVERAGE_LIMIT_INTERACTIONS_CANDIDATE.md)" = "7c65a697a98961d0df278658e59262ce39874ff5"
          test "$(git rev-parse HEAD:TSK_0335_PROTECTION_MAP_COVERAGE_LIMIT_INTERACTIONS_PREPARATION_EVIDENCE_2026-08-30.md)" = "27fd622b84351c2eb6690167f7d6dd59b9dd5549"
          python3 .github/scripts/reconcile_tsk0335_preparation_waiting.py
          git diff --check
          changed="$(git diff --name-only)"
          [[ "$changed" == "CURRENT_STATE.md" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          [[ "$(git diff --cached --name-only)" == "CURRENT_STATE.md" ]]
          git commit -m 'state: record TSK-0335 Protection Map decision boundary'
          git push origin HEAD:main
          echo "RUNTIME_COMMIT=$(git rev-parse HEAD)"
          echo "RUNTIME_STATE_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
          sha256sum CURRENT_STATE.md | sed 's/^/RUNTIME_STATE_SHA256=/'
