name: Reconcile TSK-0298 PASS and queue

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-tsk0298-pass-20260829.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify evidence, derive queue, reconcile runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "6a25d63af125116a80f96ac0f1548b1ddb452a34"
          test "$(git hash-object Plans/Master/MANIFEST.yaml)" = "acadf21483ee3fddd63ee57795126619f92a00f3"
          test "$(git hash-object TSK_0298_EVIDENCE_GROUNDED_BRAND_STRATEGY_2026-08-29.md)" = "73d8587ef9bb37d92b44f102d5a33545b416c44b"
          test "$(git hash-object TSK_0298_EVIDENCE_GROUNDED_BRAND_STRATEGY_EVIDENCE_2026-08-29.md)" = "4e4b53416a6975db9520fcc596e947297914d012"
          grep -Fq 'RSK-0002` remains OPEN' TSK_0298_EVIDENCE_GROUNDED_BRAND_STRATEGY_2026-08-29.md
          grep -Fq 'does not satisfy LG-03, LG-04, LG-05 or LG-06' TSK_0298_EVIDENCE_GROUNDED_BRAND_STRATEGY_2026-08-29.md
          grep -Fq '**ACC-0298: PASS.**' TSK_0298_EVIDENCE_GROUNDED_BRAND_STRATEGY_EVIDENCE_2026-08-29.md
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import csv,re
          runtime=Path('CURRENT_STATE.md')
          text=runtime.read_text(encoding='utf-8')
          assert 'TSK-0298 accepted stable state' not in text
          # Derive current PASS set from durable runtime, then include freshly verified TSK-0298.
          passed=set()
          m=re.search(r'(?ms)^### PASS\s*$\n(.*?)(?=^### |^## )',text)
          if m: passed.update(re.findall(r'^- `?(TSK-\d{4})`?\b',m.group(1),flags=re.M))
          passed.update(re.findall(r'`(TSK-\d{4})[^`\n]*`:\s*\*\*PASS\b',text))
          passed.update(re.findall(r'(?m)^-?\s*`?(TSK-\d{4})`?[^\n]{0,220}\bPASS\b',text))
          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          ids={r['Task_ID'] for r in rows}; passed &= ids
          assert len(passed)==71,(len(passed),sorted(passed))
          passed.add('TSK-0298')
          candidates=[]
          for r in rows:
              if r['Lifecycle_Stage']!='L4' or r['Task_ID'] in passed: continue
              if (r['Plan_Status'] or '').upper() not in {'PLANNED','ACTIVE','IN_PROGRESS'}: continue
              deps={x.strip() for x in re.split(r'[;,]',r['Dependencies'] or '') if x.strip().startswith('TSK-')}
              if deps <= passed:
                  candidates.append(r)
          pri={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          candidates.sort(key=lambda r:(pri.get((r['Priority'] or '').upper(),99), int(r['Task_ID'].split('-')[1])))
          print('POST_TSK0298_PASS_COUNT',len(passed))
          for r in candidates:
              print('CANDIDATE',r['Task_ID'],r['Priority'],r['Action_Authority'],r['Dependencies'],r['Title'])
          assert [r['Task_ID'] for r in candidates[:2]]==['TSK-0299','TSK-0302'],[r['Task_ID'] for r in candidates]
          assert candidates[0]['Action_Authority']=='AUTO_ALLOWED'
          now=datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          text += '''\n\n### TSK-0298 accepted stable state\n\n`TSK-0298 — Create the evidence-grounded brand strategy, promise, personality, audience, differentiation, trust, and prohibited-expression brief`: **PASS for provisional internal L4 brand-strategy acceptance under DEC-0051/CR-0004**. Artifact `TSK_0298_EVIDENCE_GROUNDED_BRAND_STRATEGY_2026-08-29.md`, blob `73d8587ef9bb37d92b44f102d5a33545b416c44b`, publication commit `4d6b75002897855f668b01ff286969d1edf816ca`; independent acceptance evidence `TSK_0298_EVIDENCE_GROUNDED_BRAND_STRATEGY_EVIDENCE_2026-08-29.md`, blob `4e4b53416a6975db9520fcc596e947297914d012`, publication commit `c37efbb3a7706f2978b80adb3a6b73b9bda31cc7`.\n\nACC-0298 is satisfied: the brief is traceable to accepted product/technical/privacy/claims authority; intended audience and value remain explicitly provisional; non-surveillance and evidence-matched protection claims are mandatory; prohibited complete-safety, false-verification, absolute-privacy, legal-certification, behavioral-validation, market-superiority, fear/shame, universal-support and fabricated-support language is explicit; `RSK-0002` remains OPEN; `TSK-0301` remains the HUMAN_ONLY final identity decision.\n\nThis PASS does not establish representative-parent comprehension/preference/trust, behavioral validation, legal completion, LG-03/LG-04/LG-05/LG-06 PASS, build/publication/payment/market/launch authority. Later contradictory real-parent evidence reopens affected provisional assumptions.\n\n### Post-TSK-0298 L4 queue\n\nFresh dependency derivation with 72 durable PASS task IDs exposes both `TSK-0299` (HIGH, AUTO_ALLOWED; dependency TSK-0298) and `TSK-0302` (MEDIUM, AUTO_ALLOWED; dependency TSK-0298). Priority ordering selects `TSK-0299` first.\n\n### Exact next authoritative step\n\nExecute `TSK-0299 — Develop the verbal system: descriptors, message hierarchy, tone rules, approved claims, prohibited claims, taglines, CTA language, and product terminology` against the accepted TSK-0298 strategy and current claims/content/localization authority. Preserve provisional-parent-comprehension and deferred-legal limitations. After PASS/read-back, recompute the queue.\n'''
          runtime.write_text(text,encoding='utf-8')
          PY
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          set -Eeuo pipefail
          git add CURRENT_STATE.md
          git diff --cached --check
          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'state: accept TSK-0298 brand strategy'
          git push origin HEAD:main
