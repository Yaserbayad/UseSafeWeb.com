name: Reconcile TSK-0320 PASS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0320-pass.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify evidence and reconcile runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object TSK_0320_PROTECTION_STATE_MODEL_AND_COPY_RULES_2026-08-28.md)" = "1146f7622f434590dde1253d11f14fb6a87e19de"
          test "$(git hash-object TSK_0320_PROTECTION_STATE_MODEL_AND_COPY_RULES_EVIDENCE_2026-08-28.md)" = "93e32071ce111fddda7df826c3106f1eca3dfc07"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline=''))); by={r['Task_ID']:r for r in rows}
          t=by['TSK-0320']; n=by['TSK-0316']; alt=by['TSK-0409']; human=by['TSK-0319']
          assert t['Dependencies']=='TSK-0315'
          assert t['Action_Authority']=='AUTO_ALLOWED' and t['AI_Capability_A0_A4']=='A3'
          assert n['Dependencies']=='TSK-0315' and n['Priority']=='HIGH' and n['Action_Authority']=='AUTO_ALLOWED' and n['AI_Capability_A0_A4']=='A3'
          assert alt['Dependencies']=='TSK-0408' and alt['Priority']=='HIGH' and alt['Action_Authority']=='AUTO_ALLOWED'
          assert human['Dependencies']=='TSK-0315; TSK-0320' and human['Action_Authority']=='HUMAN_ONLY'
          assert 'Each retained interaction has a decision/technical/safety reason' in n['Acceptance_Criteria']
          e=pathlib.Path('TSK_0320_PROTECTION_STATE_MODEL_AND_COPY_RULES_EVIDENCE_2026-08-28.md').read_text()
          assert 'directly satisfies all ACC-0320 clauses' in e and 'RSK-0002' in e
          p=pathlib.Path('CURRENT_STATE.md'); text=p.read_text()
          assert '### TSK-0315 accepted stable state' in text
          assert '### TSK-0320 accepted stable state' not in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          sec='''### TSK-0320 accepted stable state\n\n`TSK-0320 — Freeze the protection-state model and copy rules`: **PASS for the provisional internal L4 state/copy contract under DEC-0050/CR-0003**. Contract `TSK_0320_PROTECTION_STATE_MODEL_AND_COPY_RULES_2026-08-28.md`, blob `1146f7622f434590dde1253d11f14fb6a87e19de`; independent evidence `TSK_0320_PROTECTION_STATE_MODEL_AND_COPY_RULES_EVIDENCE_2026-08-28.md`, blob `93e32071ce111fddda7df826c3106f1eca3dfc07`. ACC-0320 is satisfied: protected/verified, configured/parent-confirmed, action-needed, not-covered, uncertain/error, and removed states have exact evidence thresholds, copy rules, precedence, transitions and testable assertions; parent confirmation/profile presence cannot masquerade as system verification.\n\n`RSK-0002` remains OPEN: exact labels/copy are not representative-parent validated and must be reopened if later L3 evidence contradicts comprehension/usability assumptions. This PASS does not authorize LG-05/LG-06, implementation/build, participants, legal completion, payment, public release or launch.\n\n'''
          marker='## Runtime safeguards'
          text=text.replace(marker,sec+marker,1)
          q=text.rfind('\n## Queue status after current reconciliation'); assert q>=0
          text=text[:q].rstrip()+f'''\n\n## Queue status after current reconciliation\n\n`TSK-0320` is runtime PASS for the provisional internal L4 Protection Map state/copy contract. `TSK-0319` is now dependency-ready but remains HUMAN_ONLY and is fenced. The highest-priority executable AUTO_ALLOWED candidates are `TSK-0316` and `TSK-0409`, both HIGH/A3; current project tie-break by WBS order selects `TSK-0316`. `TSK-0187` remains real-user-bound/deferred.\n\n- **Selected next: `TSK-0316 — {n['Title']}`** (L4 / {n['AI_Capability_A0_A4']} / {n['Action_Authority']} / {n['Priority']}).\n- Hard dependency: `TSK-0315` — current PASS.\n- ACC-0316: {n['Acceptance_Criteria']}\n- Selection rationale: same HIGH priority/authority as TSK-0409, earlier WBS order; acceptance can be satisfied as provisional internal friction design without representative-user evidence if no unsupported quantitative behavioral claims are invented.\n\n## Exact next authoritative step\n\nExecute bounded `TSK-0316`: challenge every interaction in the TSK-0315 blueprint, remove/conditionalize any interaction lacking a current decision/technical/safety/evidence/recovery reason, identify unavoidable platform-specific manual steps from accepted TSK-0408 evidence, explicitly reject unsupported one-click/universal setup claims, and produce a friction budget framed as design constraints rather than fabricated user-performance metrics. Carry `RSK-0002`, persist/read back independent ACC-0316 evidence, reconcile runtime, then recompute.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md
          git commit -m "state: accept TSK-0320 and select TSK-0316"
          git push
