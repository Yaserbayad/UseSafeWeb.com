name: Select TSK-0042

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/select-tsk0042.yml'

permissions:
  contents: write

jobs:
  select:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify queue and select TSK-0042
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object TSK_0313_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md)" = "6428025a0a71a66257d129aa313cb1133f4c1483"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline=''))); by={r['Task_ID']:r for r in rows}
          t=by['TSK-0042']; real=by['TSK-0187']; owner=by['TSK-0140']
          assert set(x.strip() for x in t['Dependencies'].split(';'))=={'TSK-0041','TSK-0146'}
          assert t['Lifecycle_Stage']=='L4' and t['Priority']=='MEDIUM'
          assert t['AI_Capability_A0_A4']=='A3' and t['Action_Authority']=='AUTO_ALLOWED'
          assert 'accountless setup/journey-state recovery' in t['Acceptance_Criteria']
          assert 'Account-access requirements remain excluded unless EXC-0001 is activated' in t['Acceptance_Criteria']
          assert 'Representative parents' in real['Acceptance_Criteria']
          assert 'reviewed by owner' in owner['Acceptance_Criteria'].lower()
          p=pathlib.Path('CURRENT_STATE.md'); text=p.read_text()
          assert '### TSK-0313 accepted stable state' in text
          assert 'No next task is selected by this write' in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          q=text.rfind('\n## Queue status after current reconciliation'); assert q>=0
          text=text[:q].rstrip()+f'''\n\n## Queue status after current reconciliation\n\nThe TSK-0313 post-PASS queue was reread and screened against CR-0003 and current acceptance authority. `TSK-0187` remains ineligible because it requires representative-parent completion/comprehension evidence. `TSK-0140` remains ineligible for PASS because its acceptance requires owner/multi-role review evidence. `TSK-0042` is the highest eligible AUTO_ALLOWED provisional-L4 task.\n\n- **Selected next: `TSK-0042 — {t['Title']}`** (L4 / {t['AI_Capability_A0_A4']} / {t['Action_Authority']} / {t['Priority']}).\n- Hard dependencies: `TSK-0041`, `TSK-0146` — current PASS.\n- ACC-0042: {t['Acceptance_Criteria']}\n- Selection rationale: requirements-only internal L4 work; current predecessors PASS; no account-access scope, real-participant evidence or owner approval act is required to define the bounded support/recovery contract.\n\n## Exact next authoritative step\n\nExecute bounded `TSK-0042`: specify accountless setup/journey recovery, device configuration lifecycle, DNS/AdGuard integration incident handling, false-positive/unsupported-state remedies, privacy-minimising diagnostics, response expectations, deletion/removal/recovery and provisional support-burden metric definitions; preserve EXC-0001 account-access exclusion and CR-0003/RSK-0002 limits; persist/read back independent ACC-0042 evidence; reconcile runtime; then recompute.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md
          git commit -m "state: select TSK-0042"
          git push
