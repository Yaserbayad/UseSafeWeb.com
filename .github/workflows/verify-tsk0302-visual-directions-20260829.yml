name: Verify TSK-0302 visual directions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-tsk0302-visual-directions-20260829.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify structure, editability, scale and contrast
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET, subprocess

          root=Path('brand/concepts/TSK-0302')
          expected=[
            root/'direction-a-open-path.svg',
            root/'direction-b-open-guardrails.svg',
            root/'direction-c-connected-layers.svg',
          ]
          actual=sorted(root.glob('*.svg'))
          assert actual==sorted(expected),(actual,expected)
          board=(root/'README.md').read_text(encoding='utf-8')
          for f in expected:
              assert f.name in board,f.name
          assert 'NOT FINAL IDENTITY' in board
          assert 'RSK-0002` remains OPEN' in board
          assert 'HUMAN_ONLY `TSK-0301`' in board
          assert 'exactly a small set of three directions exists' in board

          banned_tags={'image','script','foreignObject','text','filter','mask','pattern'}
          allowed_graphic={'path','circle'}
          ns='{http://www.w3.org/2000/svg}'
          all_colors=set()
          signatures=[]
          for f in expected:
              raw=f.read_text(encoding='utf-8')
              tree=ET.fromstring(raw)
              assert tree.tag==ns+'svg'
              assert tree.attrib.get('viewBox')=='0 0 256 256',(f,tree.attrib)
              assert tree.attrib.get('role')=='img'
              tags=[]; graphic=[]
              for el in tree.iter():
                  tag=el.tag.split('}',1)[-1]
                  tags.append(tag)
                  assert tag not in banned_tags,(f,tag)
                  if tag in allowed_graphic: graphic.append(tag)
                  for a,v in el.attrib.items():
                      if a.endswith('href'):
                          assert not re.match(r'^(https?:|data:)',v),(f,a,v)
                  for v in el.attrib.values():
                      all_colors.update(re.findall(r'#[0-9A-Fa-f]{6}',v))
              assert 2 <= len(graphic) <= 6,(f,graphic)
              assert 'title' in tags and 'desc' in tags,(f,tags)
              signatures.append(tuple(graphic))
              print(f'{f.name}|GRAPHIC_ELEMENTS={len(graphic)}|SIGNATURE={graphic}')
          assert len(set(signatures))==3,signatures

          def rgb(hexv):
              s=hexv.lstrip('#'); return tuple(int(s[i:i+2],16)/255 for i in (0,2,4))
          def lin(c):
              return c/12.92 if c<=0.04045 else ((c+0.055)/1.055)**2.4
          def lum(hexv):
              r,g,b=map(lin,rgb(hexv)); return 0.2126*r+0.7152*g+0.0722*b
          def contrast(a,b='#FFFFFF'):
              x,y=sorted((lum(a),lum(b)),reverse=True); return (x+0.05)/(y+0.05)

          required_text_candidates=['#12344D','#147D64','#1F2937','#2563EB','#12372A','#4338CA']
          accents=['#C75B12','#B45309']
          for c in required_text_candidates:
              ratio=contrast(c)
              print(f'CONTRAST|{c}|WHITE|{ratio:.2f}')
              assert ratio>=4.5,(c,ratio)
          for c in accents:
              ratio=contrast(c)
              print(f'ACCENT_CONTRAST|{c}|WHITE|{ratio:.2f}|DECORATIVE_UNLESS_LATER_APPROVED')
          assert set(required_text_candidates+accents) <= {c.upper() for c in all_colors},all_colors

          # Mark masters must be plain source-controlled vector files and remain tiny.
          for f in expected:
              assert f.stat().st_size < 4096,(f,f.stat().st_size)
          print('SVG_COUNT=3')
          print('EDITABLE_VECTOR_ONLY=PASS')
          print('NO_RASTER_FONT_SCRIPT_FILTER_EXTERNAL_RESOURCE=PASS')
          print('DISTINCT_STRUCTURAL_SIGNATURES=PASS')
          print('WCAG_AA_TEXT_CANDIDATE_CONTRAST=PASS')
          print('TSK0302_AUTOMATED_VERIFICATION=PASS')
          print('CURRENT_STATE_BLOB='+subprocess.check_output(['git','hash-object','CURRENT_STATE.md'],text=True).strip())
          PY
