name: Verify TSK-0301 current revalidation

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0301-current-revalidation-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current TSK-0301 acceptance and preservation boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, re, subprocess
          from pathlib import Path

          expected = {
            'wbs': ('Plans/Master/WBS/master-wbs.csv','b27a0c5df2f5636d8ed71051e9e26a68959a2616'),
            'graph': ('Plans/Master/RELATIONSHIP_INDEX.yaml','c108d2c162bcea2ee4cc01def46d0487a9501032'),
            'runtime': ('CURRENT_STATE.md','dbe82497b0bfe5a699c446ca8b343568c7ca456f'),
            'revalidation': ('TSK_0301_POST_CR0008_CURRENT_DEPENDENCY_REVALIDATION_2026-09-01.md','12c5de46b5ca880752d6f244e9bc2320e9689fa3'),
            'old_evidence': ('TSK_0301_FINAL_IDENTITY_EVIDENCE_2026-08-29.md','0dd418f54542d6789eb5b64e4d5b66d1083e6678'),
            'owner': ('TSK_0301_OWNER_IDENTITY_APPROVAL_2026-08-29.md','66f4b545c03571649a8baa4c0fe3d1df564b5949'),
            'identity': ('brand/identity/TSK-0301/README.md','b8ffd2ed234465a238558a7b94e56274de49696a'),
            'tsk0302_evidence': ('TSK_0302_VISUAL_IDENTITY_DIRECTIONS_EVIDENCE_2026-08-29.md','755bca78e66864804549f8645def99a57aeb042f'),
            'tsk0299_evidence': ('TSK_0299_POST_CR0008_CORRECTED_ACCEPTANCE_EVIDENCE_2026-09-01.md','9d48add06fee14aef76f82a876a61cc88ce59440'),
            'primary': ('brand/identity/TSK-0301/safeweb-wordmark-primary.svg','f93958e3e4a16f9056693072c1b9b8b31fcda852'),
            'inverse': ('brand/identity/TSK-0301/safeweb-wordmark-inverse.svg','c38709e4239a2d36b340b4d9d630df85a17bb494'),
            'mono': ('brand/identity/TSK-0301/safeweb-wordmark-monochrome.svg','ef9b6e0d52926f24c7e81bccb4489569067b852f'),
            'monogram': ('brand/identity/TSK-0301/safeweb-monogram.svg','49f20bae1d92bb04f125e988cb4cc3ea8a822b9e'),
          }
          def blob(p): return subprocess.check_output(['git','hash-object',str(p)], text=True).strip()
          P={k:Path(v[0]) for k,v in expected.items()}
          for k,(path,sha) in expected.items():
              assert P[k].exists(), f'missing {k}: {path}'
              actual=blob(P[k]); assert actual==sha, f'{k} blob mismatch {actual} != {sha}'

          with P['wbs'].open(newline='', encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          byid={r['Task_ID']:r for r in rows if r.get('Task_ID')}
          r=byid['TSK-0301']
          assert r['Lifecycle_Stage']=='L4'
          assert r['Priority']=='HIGH'
          assert r['AI_Capability_A0_A4']=='A3'
          assert r['Action_Authority']=='AUTO_ALLOWED'
          assert r['Dependencies'].strip()=='TSK-0302; TSK-0299'
          assert (r['Acceptance_ID'],r['Verification_ID'],r['Evidence_ID'])==('ACC-0301','VER-0301','EVD-0301')
          ac=r['Acceptance_Criteria'].lower()
          for token in ['owner','editable','version','small','mobile','mono','contrast','readability','safety']:
              assert token in ac, f'ACC-0301 missing token {token}'
          print('TSK0301_CURRENT_WBS_CONTRACT=PASS')

          rt=P['runtime'].read_text(encoding='utf-8')
          protected=[
            '## TSK-0299 current accepted stable state — 2026-09-01 — POST-CR-0008 CORRECTED OWNER-IDENTITY BINDING',
            '## TSK-0485 current accepted stable state',
            '## TSK-0318 current accepted stable state',
            '## TSK-0319 current accepted stable state',
          ]
          def section(text,prefix):
              m=re.search(r'^'+re.escape(prefix)+r'.*$', text, re.MULTILINE); assert m, prefix
              n=re.search(r'^## ', text[m.end():], re.MULTILINE)
              end=m.end()+n.start() if n else len(text)
              return text[m.start():end]
          for h in protected:
              s=section(rt,h)
              assert '**PASS**' in s or ': **PASS**' in s
              print('PROTECTED_SECTION_SHA256|{}|{}'.format(h,hashlib.sha256(s.encode()).hexdigest()))
          assert '### TSK-0301 accepted stable state' in rt
          assert '### TSK-0302 accepted stable state' in rt
          print('CURRENT_PREDECESSOR_RUNTIME_ANCHORS=PASS')

          owner=P['owner'].read_text(encoding='utf-8')
          for s in ['**Decision:** APPROVED','**Brand name:** `SafeWeb`','Concept A','`UseSafeWeb.com` remains the project/domain/repository identity','must not be reused as brand copy or logo text']:
              assert s in owner, s
          identity=P['identity'].read_text(encoding='utf-8')
          for s in ['The visible product/brand name is exactly **SafeWeb**.','do not render `UseSafeWeb`','safeweb-wordmark-primary.svg','safeweb-wordmark-inverse.svg','safeweb-wordmark-monochrome.svg','safeweb-monogram.svg','Multilingual / RTL use','no dense dashboard aesthetic for the accountless-first setup experience']:
              assert s in identity, s
          print('OWNER_APPROVED_SAFEWEB_IDENTITY=PASS')
          print('IDENTITY_RESELECTION_REQUIRED=NO')

          old=P['old_evidence'].read_text(encoding='utf-8')
          for s in ['Owner-approval acceptance class: PASS','Editable/versioned-master acceptance class: PASS','Small/mobile/mono/multi-surface acceptance class: PASS','No-safety-guarantee acceptance class: PASS','ACC-0301: PASS']:
              assert s in old, s
          print('HISTORICAL_ACC0301_PROOF_UNCHANGED=PASS')

          e302=P['tsk0302_evidence'].read_text(encoding='utf-8')
          for s in ['ACC-0302: PASS','exactly 3 concept SVGs','DISTINCT_GEOMETRY_SIGNATURES=PASS','no premature high-volume production']:
              assert s.lower() in e302.lower(), s
          e299=P['tsk0299_evidence'].read_text(encoding='utf-8')
          for s in ['visible brand/product token: `SafeWeb`','The TSK-0301 owner-approved identity itself is not redesigned, reselected or weakened.','TSK-0301 remains dependent on both `TSK-0302` and current TSK-0299']:
              assert s in e299, s
          print('TSK0302_CURRENT_PREDECESSOR=PASS')
          print('TSK0299_CORRECTED_CURRENT_PREDECESSOR=PASS')

          reval=P['revalidation'].read_text(encoding='utf-8')
          for s in ['no identity reselection or redesign is authorized','dependencies: `TSK-0302; TSK-0299`','No master is modified by this revalidation.','same approved SafeWeb identity remains reusable across public, setup, account/session/dashboard/device-management','TSK-0301 may remain PASS under current direct-predecessor evidence without owner identity reselection']:
              assert s in reval, s
          print('TSK0301_CURRENT_DEPENDENCY_BINDING=PASS')

          # Recompute WCAG ratios from the exact accepted colors rather than trusting prose alone.
          def lum(hexv):
              vals=[]
              for i in (1,3,5):
                  c=int(hexv[i:i+2],16)/255
                  vals.append(c/12.92 if c<=0.04045 else ((c+0.055)/1.055)**2.4)
              return .2126*vals[0]+.7152*vals[1]+.0722*vals[2]
          def ratio(a,b):
              x,y=sorted((lum(a),lum(b)),reverse=True); return (x+.05)/(y+.05)
          checks=[('#173F35','#F6F4EF',4.5),('#7A2E36','#F6F4EF',4.5),('#F6F4EF','#173F35',4.5)]
          for a,b,minr in checks: assert ratio(a,b)>=minr, (a,b,ratio(a,b))
          low=ratio('#7A2E36','#173F35'); assert low<4.5
          assert 'low-contrast' in identity.lower() and 'off-white' in identity.lower()
          print('TSK0301_CONTRAST_AND_FALLBACK=PASS')

          # Exact master blobs being unchanged preserves the independently accepted editability/static-use facts.
          for k in ['primary','inverse','mono','monogram']:
              text=P[k].read_text(encoding='utf-8')
              assert '<svg' in text and '<script' not in text.lower() and '<image' not in text.lower()
              assert 'http://' not in text.lower() and 'https://' not in text.lower()
          print('TSK0301_EDITABLE_VERSIONED_MASTERS=PASS')
          print('TSK0301_SMALL_MOBILE_MONO_READABILITY=PASS')
          print('TSK0301_NO_VISUAL_SAFETY_GUARANTEE=PASS')
          print('TSK0301_CURRENT_ACC=PASS')
          print('TSK0299_PRESERVATION_INPUT=PASS')
          print('TSK0485_PRESERVATION_INPUT=PASS')
          print('TSK0318_PRESERVATION_INPUT=PASS')
          print('TSK0319_PRESERVATION_INPUT=PASS')
          subprocess.check_call(['git','diff','--check'])
          print('WBS_BLOB='+blob(P['wbs']))
          print('GRAPH_BLOB='+blob(P['graph']))
          print('RUNTIME_BLOB='+blob(P['runtime']))
          print('REVALIDATION_BLOB='+blob(P['revalidation']))
          PY
