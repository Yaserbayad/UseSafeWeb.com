name: TSK-0243 privacy-safe DNS verification acceptance

on:
  push:
    branches:
      - main
      - feature/tsk-0243-privacy-safe-dns-verification-20260903
  pull_request:
    paths:
      - 'website/**'
      - 'TSK_0243_*'
      - '.github/workflows/accept-tsk0243-dns-verification-20260903.yml'

permissions:
  contents: read

jobs:
  accept-tsk0243:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Verify governance, proof contracts, and production build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          cd website
          npm ci --no-fund --no-audit
          npm run test:contract
          npm run lint
          npm run typecheck
          NEXT_TELEMETRY_DISABLED=1 npm run build
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          cd ..
          git diff --check
          test -z "$(git status --porcelain)"
