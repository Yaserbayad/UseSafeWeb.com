name: Audit post-TSK-0308 eligibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-post-tsk0308-eligibility.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Derive active L4 candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 - <<'PY'
          import csv, pathlib, re

          state_text=pathlib.Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          current={}; section=None
          for line in state_text.splitlines():
              msec=re.match(r'^###\s+(PASS|WAITING|BLOCKED|TODO)\s*$',line.strip(),re.I)
              if msec: section=msec.group(1).upper(); continue
              if line.startswith('### ') or line.startswith('## '): section=None
              ids=re.findall(r'TSK-\d{4}',line)
              if not ids: continue
              u=line.upper(); explicit=None
              if '**PASS**' in u: explicit='PASS'
              elif '**WAITING' in u or 'WAITING /' in u: explicit='WAITING'
              elif '**BLOCKED' in u or 'BLOCKED /' in u: explicit='BLOCKED'
              elif '**TODO' in u or 'TODO /' in u: explicit='TODO'
              chosen=explicit or section
              if chosen:
                  for tid in ids: current[tid]=chosen

          with pathlib.Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          priority={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          out=[]
          for idx,r in enumerate(rows):
              tid=r['Task_ID'].strip()
              if not tid.startswith('TSK-') or r['Lifecycle_Stage'].strip()!='L4': continue
              plan=r['Plan_Status'].strip().upper()
              if plan not in {'PLANNED','ACTIVE'}: continue
              if current.get(tid) in {'PASS','WAITING','BLOCKED'}: continue
              deps=[x.strip() for x in re.split(r'[;,]',r.get('Dependencies','') or '') if x.strip()]
              dep_states=[(d,current.get(d)) for d in deps]
              if any(s!='PASS' for _,s in dep_states): continue
              out.append((priority.get(r['Priority'].strip().upper(),9),idx,r,dep_states))
          out.sort(key=lambda x:(x[0],x[1],x[2]['Task_ID']))
          print('ACTIVE_L4_DEP_READY_COUNT='+str(len(out)))
          fields=['Task_ID','Title','Purpose','Plan_Status','Execution_State','Priority','Critical_Path','Dependencies','Dependency_Type','Trigger','Preconditions','Inputs','Output/Artifact','Acceptance_ID','Acceptance_Criteria','Verification_ID','Verification_Method','Evidence_ID','Evidence_Required','Primary_Owner','AI_Capability_A0_A4','Action_Authority','Execution_Instructions','Required_Tools_or_Access','Idempotency','Reversibility','Retry_Recovery','Escalation_Condition','Risk_Reference','Interface_Reference','Requirement_Reference','Notes']
          for rank,(_,idx,r,dep_states) in enumerate(out,1):
              print(f'L4_CANDIDATE_{rank:02d}_BEGIN')
              print(f'ROW={idx+2}')
              for k in fields: print(f'{k}={r.get(k,"")}')
              print('RUNTIME_DEP_STATES='+';'.join(f'{d}:{s}' for d,s in dep_states))
              print(f'L4_CANDIDATE_{rank:02d}_END')
          print('ACTIVE_L4_AUDIT=PASS')
          PY
      - name: Repository cleanliness
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
