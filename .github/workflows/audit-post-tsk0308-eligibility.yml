name: Audit post-TSK-0308 eligibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-post-tsk0308-eligibility.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Derive dependency-ready candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 - <<'PY'
          import csv, pathlib, re

          state_text=pathlib.Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          current={}
          section=None
          for line in state_text.splitlines():
              msec=re.match(r'^###\s+(PASS|WAITING|BLOCKED|TODO)\s*$',line.strip(),re.I)
              if msec:
                  section=msec.group(1).upper(); continue
              if line.startswith('### ') or line.startswith('## '):
                  section=None
              ids=re.findall(r'TSK-\d{4}',line)
              if not ids: continue
              explicit=None
              u=line.upper()
              if '**PASS**' in u or re.search(r'\bPASS\b',u) and ('=' in line or ':' in line or '—' in line or '-' in line): explicit='PASS'
              if '**WAITING' in u or re.search(r'\bWAITING\b',u) and ('=' in line or ':' in line or '—' in line or '/' in line): explicit='WAITING'
              if '**BLOCKED' in u or re.search(r'\bBLOCKED\b',u) and ('=' in line or ':' in line or '—' in line or '/' in line): explicit='BLOCKED'
              if '**TODO' in u or re.search(r'\bTODO\b',u) and ('=' in line or ':' in line or '—' in line or '/' in line): explicit='TODO'
              chosen=explicit or section
              if chosen:
                  for tid in ids: current[tid]=chosen

          with pathlib.Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          print('WBS_HEADERS='+'|'.join(rows[0].keys()))
          print('RUNTIME_COUNTS='+'|'.join(f'{s}:{sum(1 for v in current.values() if v==s)}' for s in ['PASS','WAITING','BLOCKED','TODO']))
          print('TSK0308_RUNTIME='+str(current.get('TSK-0308')))

          priority={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          candidates=[]
          for idx,r in enumerate(rows):
              tid=r.get('Task_ID','').strip()
              if not tid.startswith('TSK-'): continue
              if current.get(tid) in {'PASS','WAITING','BLOCKED'}: continue
              plan=r.get('Plan_Status','').strip().upper()
              if plan and plan not in {'PLANNED','ACTIVE'}: continue
              deps=[x.strip() for x in re.split(r'[;,]',r.get('Dependencies','') or '') if x.strip()]
              if any(current.get(d)!='PASS' for d in deps): continue
              candidates.append((priority.get(r.get('Priority','').strip().upper(),9),idx,r,deps))
          candidates.sort(key=lambda x:(x[0],x[1],x[2].get('Task_ID','')))
          print('DEPENDENCY_READY_COUNT='+str(len(candidates)))
          fields=['Task_ID','Title','Lifecycle_Stage','Plan_Status','Execution_State','Priority','Dependencies','Action_Authority','AI_Capability_A0_A4','Gate_ID','Gate','Required_Gates','Acceptance_ID','Verification_ID','Evidence_ID','Requirement_IDs','Constraint_IDs','Interface_IDs','Decision_IDs','Risk_IDs','Notes']
          for rank,(_,idx,r,deps) in enumerate(candidates[:40],1):
              vals=[]
              for k in fields:
                  if k in r and r.get(k): vals.append(f'{k}={r.get(k)}')
              print(f'CANDIDATE_{rank:02d}|ROW={idx+2}|'+'|'.join(vals))
          print('ELIGIBILITY_AUDIT=PASS')
          PY
      - name: Repository cleanliness
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
