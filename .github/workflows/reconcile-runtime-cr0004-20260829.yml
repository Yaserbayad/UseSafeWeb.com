name: Reconcile runtime to CR-0004

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-runtime-cr0004-20260829.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile CURRENT_STATE to verified CR-0004 baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = "46185aaff2bf30a8fc33a1aabbabb3845258226e"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "6a25d63af125116a80f96ac0f1548b1ddb452a34"
          test "$(git hash-object Plans/Master/MANIFEST.yaml)" = "acadf21483ee3fddd63ee57795126619f92a00f3"
          test "$(git hash-object Plans/Master/RELATIONSHIP_INDEX.yaml)" = "9ed219b4ccb6b05e68c6a264fc2b21b1008b02a4"
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path('CURRENT_STATE.md')
          text=p.read_text(encoding='utf-8')
          text=text.replace('**Updated:** 2026-08-29T07:55:48Z', '**Updated:** '+datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), 1)
          s=text.index('## Canonical planning authority\n')
          e=text.index('\n## Frozen technical identity\n',s)
          block='''## Canonical planning authority\n\n**ACTIVE / OWNER-FROZEN / POST-FREEZE CR-0004 PUBLISHED, RECONCILED, READ-BACK VERIFIED.**\n\n- Latest post-freeze change: `CR-0004` / `DEC-0051`, explicit Project Owner authority 2026-08-29.\n- CR-0004 planning publication commit: `aa875f6dbb4014edda9d80473963280a33306041`; durable evidence `CR_0004_PROVISIONAL_L4_BRAND_UX_DECOUPLING_EVIDENCE_2026-08-29.md`.\n- Manifest latest-change reconciliation commit: `50b2882` with repaired evidence record commit `e42f90d2be66405c41acecf2088e5e9e2e60f4f0`.\n- Current authoritative WBS blob: `6a25d63af125116a80f96ac0f1548b1ddb452a34`; relationship-index blob: `9ed219b4ccb6b05e68c6a264fc2b21b1008b02a4`; manifest blob: `acadf21483ee3fddd63ee57795126619f92a00f3`.\n- Deterministic validation after amendment/reconciliation: 641 tasks, 849 dependency edges, 5,178 relationship entities, 20,463 targets, 0 broken links, 0 generated missing task IDs; checksum inventory regenerated and verified.\n- CR-0004 changes only the provisional Brand/UX/prototype sequencing needed for internal L4 design: `TSK-0298` now depends on the accepted provisional L4 bridge `TSK-0139` instead of `TSK-0187`; `TSK-0309 -> TSK-0187` remains unchanged.\n- `TSK-0187` remains mandatory representative-parent behavioral validation; `RSK-0002` remains OPEN; LG-03/LG-04/LG-05/LG-06 remain non-PASS as applicable; no legal/privacy/participant/L5-L6 build/publication/payment/market/launch authority is created.\n'''
          text=text[:s]+block+text[e:]
          marker='## CR-0004 accepted stable baseline and queue reopening — 2026-08-29'
          assert marker not in text
          text += '''\n\n## CR-0004 accepted stable baseline and queue reopening — 2026-08-29\n\n- Project Owner explicitly approved the controlled decoupling of remaining provisional internal L4 Brand/UX/prototype design from deferred representative-parent behavioral validation, while preserving `TSK-0187`/`RSK-0002` and every legal, privacy, participant, build, publication, payment and launch fence.\n- Impact analysis identified one inappropriate early hard edge: `TSK-0298 -> TSK-0187`. CR-0004 replaces it with `TSK-0298 -> TSK-0139`, the existing provisional L4 entry bridge. The downstream behavioral correction/freeze edge `TSK-0309 -> TSK-0187` is intentionally unchanged.\n- `ACC-0298` and `ACC-0299` were narrowed to provisional design-conformance semantics so internal acceptance cannot be misread as representative-parent comprehension, behavioral validation or deferred legal completion. `TSK-0301` remains `HUMAN_ONLY`.\n- Full deterministic validation and direct fence assertions passed on self-hosted run `33245631573` / job `99082479123`; manifest read-back then exposed stale `latest_change: CR-0003`, so runtime adoption was correctly stopped. Manifest reconciliation run `33245704038` / job `99082663878` passed and published the corrected `latest_change: CR-0004` baseline.\n- Corrected post-change queue derivation run `33245788893` / job `99082882103` parsed the 71 current durable runtime PASS IDs and returned exactly `CANDIDATE_COUNT=1`: `TSK-0298`, HIGH, `AUTO_ALLOWED`, hard dependency `TSK-0139` satisfied. It separately confirmed `TSK-0146` is not current runtime PASS.\n- No existing PASS was invalidated by CR-0004. All provisional work remains subject to contradictory future real-participant evidence reopening affected work.\n\n### Exact next authoritative step\n\nExecute `TSK-0298 — Create the evidence-grounded brand strategy, promise, personality, audience, differentiation, trust, and prohibited-expression brief` against current accepted Product/Brand/Experience, claims, trust and non-surveillance authority. Require explicit `RSK-0002` limitation and no claim of representative-parent validation, legal completion, build/publication/payment/launch readiness. After durable PASS/read-back, recompute the L4 queue.\n'''
          p.write_text(text,encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'POST-FREEZE CR-0004 PUBLISHED, RECONCILED, READ-BACK VERIFIED' CURRENT_STATE.md
          grep -Fq 'CANDIDATE_COUNT=1' CURRENT_STATE.md
          grep -Fq 'Execute `TSK-0298' CURRENT_STATE.md
      - name: Commit and push runtime reconciliation
        shell: bash
        run: |
          set -Eeuo pipefail
          git add CURRENT_STATE.md
          git diff --cached --check
          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'state: adopt verified CR-0004 baseline'
          git push origin HEAD:main
