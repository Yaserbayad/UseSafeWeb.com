name: AdGuard host hardening audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adguard-host-hardening-audit.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Independently audit TSK-0437 stable host state
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${RUNNER_OS}" == "Linux" ]]
          [[ "${RUNNER_ARCH}" == "X64" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          sudo -n true

          unit="$(systemctl list-unit-files 'actions.runner.*.service' --no-legend 2>/dev/null | awk 'NR==1 {print $1}' || true)"
          [[ -n "${unit}" ]]
          systemctl is-enabled --quiet "${unit}"
          systemctl is-active --quiet "${unit}"
          echo "runner_service=PASS"

          test -f infrastructure/adguard-server/harden-host.sh
          bash -n infrastructure/adguard-server/harden-host.sh

          set +e
          sudo bash infrastructure/adguard-server/harden-host.sh --audit \
            | tee /tmp/usesafeweb-tsk-0437-audit.log
          rc=${PIPESTATUS[0]}
          set -e

          [[ "${rc}" -eq 0 ]]
          grep -q '^OVERALL=PASS ' /tmp/usesafeweb-tsk-0437-audit.log
          echo "FRESH_AUDIT=PASS"
