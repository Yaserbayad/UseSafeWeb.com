name: Complete TSK-0167 communication templates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-tsk0167-communication-templates.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-governance-tsk0167
  cancel-in-progress: false

jobs:
  verify-and-reconcile:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Verify ACC-0167, publish evidence, and reconcile state
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git hash-object CURRENT_STATE.md)" == '2a5ffbf904fde625f0b9fd9d517a3485be3cb87c' ]]
          [[ "$(git hash-object EXPERIMENT_01_PARTICIPANT_COMMUNICATION_TEMPLATES.md)" == '1dd5aa88f200174d88d1422bbe0c11f7fc5ecbe8' ]]
          [[ "$(git hash-object EXPERIMENT_01_QUALIFICATION_SCREENER.md)" == 'd35d3e0abfc3882d648df3c0c7458e216853b592' ]]
          [[ "$(git hash-object EXPERIMENT_01_FACILITATOR_GUIDE.md)" == '7d80c1338acc1a5a4c1ff30c020ca39021d8dcb3' ]]
          [[ "$(git hash-object RETENTION_DELETION_EXECUTION_CHECKLIST.md)" == '5c2d6edbfbabe9ed0fb9c309e7afca8c96fa9c9f' ]]
          [[ "$(git hash-object PILOT_PRIVACY_NOTICE.md)" == '331f263388dfacfa73b6e9e556277d4230864ce8' ]]
          test ! -e TSK_0167_PARTICIPANT_COMMUNICATION_TEMPLATES_EVIDENCE_2026-08-28.md

          python3 - <<'PY'
          import csv
          from pathlib import Path
          with open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='') as f:
              rows={r['Task_ID']:r for r in csv.DictReader(f)}
          r=rows['TSK-0167']
          assert r['Title']=='Create invitation, scheduling, reminder, follow-up, and withdrawal templates'
          assert r['Dependencies']=='TSK-0221; TSK-0168'
          assert r['AI_Capability_A0_A4']=='A3'
          assert r['Action_Authority']=='AUTO_ALLOWED'
          assert r['Acceptance_ID']=='ACC-0167'
          assert r['Acceptance_Criteria']=='Templates state voluntary participation, no payment ask, what to prepare, support boundaries, 14-day follow-up, withdrawal route, and current contacts.'
          r2=rows['TSK-0513']
          assert r2['Dependencies']=='TSK-0167; TSK-0169; TSK-0214; TSK-0510'
          assert r2['AI_Capability_A0_A4']=='A3'
          assert r2['Action_Authority']=='AUTO_ALLOWED'
          t=Path('EXPERIMENT_01_PARTICIPANT_COMMUNICATION_TEMPLATES.md').read_text(encoding='utf-8')
          required=[
              'INTERNAL PREPARATION ONLY — NOT FOR PARTICIPANT USE',
              'Template A — Invitation','Template B — Scheduling confirmation','Template C — Session reminder',
              'Template D — 14-day follow-up','Template E — Withdrawal acknowledgment',
              'participation is voluntary','no payment','What to prepare','Support boundary for all templates',
              '14-day follow-up','Withdrawal route boundary','{{CONTROLLER_CONTACT}}',
              '{{UK_REP_CONTACT_OR_APPROVED_EXCEPTION_ROUTE}}','Current contact status at preparation time',
              'participant-facing controller contact = unresolved/deferred',
              'UK representative/contact or approved Article-27 exception route = unresolved/deferred',
              'must not be used with real participants','ACC-0167 trace'
          ]
          for x in required: assert x in t, x
          assert t.count('{{CONTROLLER_CONTACT}}') >= 5
          assert t.count('{{UK_REP_CONTACT_OR_APPROVED_EXCEPTION_ROUTE}}') >= 5
          assert 'Recruitment authorized: YES' not in t
          assert 'LG-03 = PASS' not in t
          print('TSK_0167_ACCEPTANCE_CLASSES=7/7')
          print('TSK_0167_SOURCE_ALIGNMENT=PASS')
          print('TSK_0167_CR0002_BOUNDARY=PASS')
          PY

          cat > TSK_0167_PARTICIPANT_COMMUNICATION_TEMPLATES_EVIDENCE_2026-08-28.md <<EOF
          # TSK-0167 — Participant communication templates verification evidence

          **Task:** TSK-0167 — Create invitation, scheduling, reminder, follow-up, and withdrawal templates  
          **Acceptance:** ACC-0167  
          **Date:** 2026-08-28  
          **Verification:** guarded GitHub Actions repository audit  
          **Run:** ${GITHUB_RUN_ID}  
          **Job:** ${GITHUB_JOB}

          ## Exact artifact and authority

          - Communication templates: \`EXPERIMENT_01_PARTICIPANT_COMMUNICATION_TEMPLATES.md\`
          - Artifact blob: \`1dd5aa88f200174d88d1422bbe0c11f7fc5ecbe8\`
          - WBS blob: \`2e4560103b71bb350b14673ce3e415afc3dbfe3a\`
          - Runtime state before reconciliation: \`2a5ffbf904fde625f0b9fd9d517a3485be3cb87c\`
          - Screener blob: \`d35d3e0abfc3882d648df3c0c7458e216853b592\`
          - Facilitator-guide blob: \`7d80c1338acc1a5a4c1ff30c020ca39021d8dcb3\`
          - Retention/deletion checklist blob: \`5c2d6edbfbabe9ed0fb9c309e7afca8c96fa9c9f\`
          - Pilot privacy-notice draft blob: \`331f263388dfacfa73b6e9e556277d4230864ce8\`

          ## Verification result

          The guarded audit parsed the authoritative WBS and proved the exact TSK-0167 title, dependencies, A3/AUTO_ALLOWED authority, ACC-0167 ID and acceptance text. It then verified the template artifact contains all seven required acceptance classes: voluntary participation, no payment ask, preparation requirements, support boundaries, 14-day follow-up, withdrawal route, and truthful current contact status.

          The audit also verified that unresolved controller/UK-representative contacts remain explicit release-blocking placeholders; the artifact is INTERNAL / NOT FOR PARTICIPANT USE; it does not claim LG-03 PASS or recruitment authorization; and its accepted source blobs are exact.

          **Stable outcome: TSK-0167 = PASS for internal preparatory scope under CR-0002.**

          This PASS does not release the templates to participants. Participant-facing release remains gated by actual contact/notice/legal/gate authority.
          EOF

          evidence_blob="$(git hash-object TSK_0167_PARTICIPANT_COMMUNICATION_TEMPLATES_EVIDENCE_2026-08-28.md)"

          python3 - "$evidence_blob" <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re, sys
          evidence_blob=sys.argv[1]
          p=Path('CURRENT_STATE.md')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'\*\*Updated:\*\* [^\n]+','**Updated:** '+datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')+'  ',s,count=1)
          assert n==1
          marker='## Runtime safeguards'
          assert s.count(marker)==1
          if '### TSK-0167 accepted stable state' not in s:
              section=f'''### TSK-0167 accepted stable state\n\n`TSK-0167` — invitation, scheduling, reminder, 14-day follow-up and withdrawal templates: **PASS for internal preparatory scope under CR-0002**. Artifact `EXPERIMENT_01_PARTICIPANT_COMMUNICATION_TEMPLATES.md`, blob `1dd5aa88f200174d88d1422bbe0c11f7fc5ecbe8`; verification evidence `TSK_0167_PARTICIPANT_COMMUNICATION_TEMPLATES_EVIDENCE_2026-08-28.md`, blob `{evidence_blob}`. ACC-0167's seven required classes are covered. The unresolved controller/UK-representative contact fields are truthfully preserved as release-blocking placeholders rather than fabricated contacts.\n\nThis PASS closes internal preparation only. The artifact remains **NOT FOR PARTICIPANT USE** until the real participant-facing contact/notice/legal/gate conditions are actually satisfied. No recruitment or participant processing is authorized.\n\n'''
              s=s.replace(marker,section+marker,1)
          q=s.index('## Queue status after current reconciliation')
          tail='''## Queue status after current reconciliation\n\n`TSK-0167` is runtime PASS for internal preparatory scope. Its hard successors are recomputed against current authority. `TSK-0513 — Run end-to-end synthetic rehearsal` now has all four hard predecessors satisfied for synthetic execution: TSK-0167 PASS, TSK-0169 PASS, TSK-0214 PASS and TSK-0510 PASS.\n\n- **Selected next: `TSK-0513` — Run end-to-end synthetic rehearsal** (L2 / A3 / AUTO_ALLOWED / MEDIUM).\n- LG-03/G-02 remains **DEFER**. Recruitment and real-participant processing remain unauthorized.\n- The synthetic rehearsal must use synthetic data only, capture no prohibited participant data, preserve CR-0002 legal/contact limitations, and record/fix or explicitly disposition blockers before any later real-participant gate.\n\n## Exact next authoritative step\n\nExecute bounded `TSK-0513` against the accepted Experiment-1 preparation artifacts and current technical evidence. Rehearse the full path with synthetic data only, verify every step completes or record a blocker/deviation, verify no prohibited data is captured, persist/read back the rehearsal/evidence, and recompute selection. Do not convert successful synthetic rehearsal into recruitment authorization or LG-03 PASS.\n'''
          s=s[:q]+tail
          p.write_text(s,encoding='utf-8')
          PY

          grep -Fq 'TSK-0167 accepted stable state' CURRENT_STATE.md
          grep -Fq 'Selected next: `TSK-0513`' CURRENT_STATE.md
          grep -Fq 'LG-03/G-02 remains **DEFER**' CURRENT_STATE.md
          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TSK_0167_PARTICIPANT_COMMUNICATION_TEMPLATES_EVIDENCE_2026-08-28.md CURRENT_STATE.md
          git commit -m 'state: mark TSK-0167 PASS and select TSK-0513'
          git push origin HEAD:main
