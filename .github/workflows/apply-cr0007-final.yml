name: Apply CR-0007 final formatting correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cr0007-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed corrected mutation and normalize final newline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          # Execute the already-reviewed corrected mutation body from the prior runner.
          src=Path('.github/workflows/apply-cr0007-corrected.yml').read_text(encoding='utf-8')
          begin="          python3 - <<'PY'\n"
          start=src.index(begin)+len(begin)
          end=src.index("\n          PY",start)
          raw=src[start:end]
          code='\n'.join((line[10:] if line.startswith('          ') else line) for line in raw.splitlines())
          exec(compile(code,'<cr0007-corrected-mutation>','exec'),{})

          R=Path('Plans/Master'); P=Path('Plans')
          l4=R/'Layers/LAYER_4_INTEGRATED_PROGRAM_CRITICAL_PATH.md'
          l4.write_text(l4.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')
          subprocess.run(['python3',str(R/'Tools/rebuild_master_plan.py')],check=True)
          sumfile=P/'SHA256SUMS.txt'; rels=[]
          for line in sumfile.read_text(encoding='utf-8').splitlines():
              if line.strip(): rels.append(line.split('  ',1)[1])
          out=[]
          for relp in rels:
              fp=P/relp
              if not fp.is_file(): raise SystemExit(f'checksum inventory missing {relp}')
              out.append(hashlib.sha256(fp.read_bytes()).hexdigest()+'  '+relp)
          sumfile.write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('CR0007_FINAL_NEWLINE_NORMALIZATION=PASS')
          PY

      - name: Full deterministic and semantic verification
        shell: bash
        run: |
          set -euo pipefail
          python3 Plans/Master/Tools/validate_master_plan.py | tee /tmp/cr0007_validate.txt
          grep -qx 'VALIDATION PASS' /tmp/cr0007_validate.txt
          grep -qx 'tasks=641' /tmp/cr0007_validate.txt
          grep -qx 'dependency_edges=858' /tmp/cr0007_validate.txt
          grep -qx 'broken_links=0' /tmp/cr0007_validate.txt
          grep -qx 'generated_missing_task_ids=0' /tmp/cr0007_validate.txt
          python3 - <<'PY'
          from pathlib import Path
          import csv
          R=Path('Plans/Master')
          rows=list(csv.DictReader((R/'WBS/master-wbs.csv').open(encoding='utf-8-sig',newline=''))); by={r['Task_ID']:r for r in rows}
          assert len(rows)==641
          for tid in ['TSK-0140','TSK-0317','TSK-0329','TSK-0331','TSK-0332','TSK-0412','TSK-0413','TSK-0417','TSK-0420','TSK-0424','TSK-0465']:
              assert by[tid]['AI_Capability_A0_A4']=='A4' and by[tid]['Action_Authority']=='AUTO_ALLOWED', tid
          d=(R/'Registers/DECISIONS_TRIGGERS.md').read_text(); assert 'DEC-0054' in d
          e=(R/'Registers/EXCEPTIONS_CHANGE_CONTROLS.md').read_text(); assert 'CR-0007' in e
          g=(R/'Registers/GATES.md').read_text()
          assert '| LG-09 | Integrated Production Release Readiness |' in g
          assert '| LG-13 | UK Public Production Activation |' in g and 'AUTO-GO' in g
          assert '| LG-16 | Localized Market Activation |' in g and 'Project Owner | G-16' in g
          l5=(R/'Layers/LAYER_5_AI_EXECUTION_EVIDENCE_STATE_CONTROL.md').read_text()
          assert '5.3.6 Owner autonomy and production-only lifecycle authority' in l5
          assert 'This governance change **does not itself make any task or gate PASS**' in l5
          assert '| TSK-0329 |' not in l5[l5.index('### 5.8 '):]
          man=(R/'MANIFEST.yaml').read_text(); assert 'latest_change: CR-0007' in man
          ph=(R/'Registers/PHASES.md').read_text()
          for line in ph.splitlines():
              if '| L8 |' in line or '| L9 |' in line:
                  assert 'Pilot' not in line and 'pilot' not in line and 'staging' not in line, line
          assert 'named-market' in l5 and 'legal attestation' in l5 and 'contracts' in l5
          print('CR0007_SEMANTIC_AUDIT=PASS')
          PY
          git diff --check

      - name: Create evidence and publish validated canonical amendment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, csv
          R=Path('Plans/Master')
          rows=list(csv.DictReader((R/'WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          auto=sum(1 for r in rows if r.get('Action_Authority')=='AUTO_ALLOWED')
          hpr=sum(1 for r in rows if r.get('Action_Authority')=='HUMAN_APPROVAL_REQUIRED')
          ho=sum(1 for r in rows if r.get('Action_Authority')=='HUMAN_ONLY')
          paths=['Plans/Master/WBS/master-wbs.csv','Plans/Master/Registers/VERIFICATION_EVIDENCE_ACCEPTANCE.md','Plans/Master/Governance/AUTONOMY_POLICY.yaml','Plans/Master/Registers/DECISIONS_TRIGGERS.md','Plans/Master/Registers/GATES.md','Plans/Master/Registers/EXCEPTIONS_CHANGE_CONTROLS.md','Plans/Master/Registers/PHASES.md','Plans/Master/Registers/LIFECYCLE_OBLIGATIONS.md','Plans/Master/Layers/LAYER_1_PROGRAM_ARCHITECTURE_STRATEGIC_BASELINE.md','Plans/Master/Layers/LAYER_4_INTEGRATED_PROGRAM_CRITICAL_PATH.md','Plans/Master/Layers/LAYER_5_AI_EXECUTION_EVIDENCE_STATE_CONTROL.md','Plans/Master/MANIFEST.yaml','Plans/Master/Generated/MASTER_PLAN_FULL.md','Plans/SHA256SUMS.txt']
          out=['# CR-0007 — Owner autonomy and production-only lifecycle evidence','', '**Date:** 2026-08-31  ','**Authority:** explicit Project Owner answers to all 14 human-authority questions.','', '## Owner decisions recorded','', '1. Detailed account/dashboard UX autonomous inside frozen scope.','2. LG-07 automatic on objective evidence.','3. LG-08 automatic normally; genuinely consequential/nondelegable exception escalates.','4. AI may accept material residual risk autonomously, subject to higher actual law/safety/security/platform/technical reality and nondelegable human acts.','5. Standing conditional authority for first real production users after objective readiness and all actually applicable prerequisites.','6. No mandatory pilot or staging lifecycle/environment; work proceeds to production. Mandatory pre-release verification, recovery and rollback remain. Bounded/ramped production rollout is allowed as production safety.','7. LG-12 automatic.','8. LG-13 automatic GO when prerequisites pass; no additional owner input.','9. LG-14 automatic PASS when stabilization criteria pass; strategic adverse disposition remains human.','10. Routine technical scale automatic; organizational/entity/formalization/contracts/material spend human.','11. AI researches/ranks markets; owner approves each named official market activation.','12. Year-1 automatic CONTINUE when frozen thresholds pass; other strategic outcomes human.','13. Routine reversible already-budgeted operating spend automatic; new contracts/regulated fees/banking-or-merchant identity/legal signatures/material-unbudgeted spend human.','14. Routine incidents/retries/rollback/recovery/reversible remediation automatic; strategic lifecycle transitions and irreversible human-authority acts remain human.','', '## Verification','', '- Full deterministic master-plan validator: PASS.','- Tasks: 641.','- Dependency edges: 858.','- Broken links: 0.','- Generated missing task IDs: 0.','- Semantic audit: PASS.','- git diff check: PASS.','- Authority change itself creates no task/gate PASS.',f'- Action authority counts after amendment: AUTO_ALLOWED={auto}; HUMAN_APPROVAL_REQUIRED={hpr}; HUMAN_ONLY={ho}.','', '## Changed planning blobs','']
          for p in paths:
              sha=subprocess.check_output(['git','hash-object',p],text=True).strip(); out.append(f'- `{p}` -> `{sha}`')
          out += ['', '## Publication/read-back','', 'Published with the CR-0007 planning mutation. Exact publication commit and workflow run/job are recorded by CURRENT_STATE reconciliation before later governed work relies on the amendment.','']
          Path('CR_0007_OWNER_AUTONOMY_PRODUCTION_ONLY_EVIDENCE_2026-08-31.md').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Plans CR_0007_OWNER_AUTONOMY_PRODUCTION_ONLY_EVIDENCE_2026-08-31.md
          git commit -m "governance: apply CR-0007 owner autonomy and production lifecycle"
          git push
