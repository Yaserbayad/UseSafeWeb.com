name: TSK-0374 Prettier diagnostic

on:
  push:
    branches:
      - diag/tsk0374-prettier-20260903

permissions:
  contents: read

jobs:
  prettier-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Emit exact pinned Prettier output
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm ci --ignore-scripts --no-fund --no-audit
          test "$(node -p "require('./node_modules/prettier/package.json').version")" = '3.9.6'
          echo 'TSK0374_PRETTIER_BEGIN'
          ./node_modules/.bin/prettier tests/browser/tsk0374-target.mjs
          echo 'TSK0374_PRETTIER_END'
