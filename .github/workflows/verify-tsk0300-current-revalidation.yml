name: Verify TSK-0300 current revalidation

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0300-current-revalidation-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current TSK-0300 acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, re, subprocess
          from pathlib import Path

          expected = {
            'wbs': ('Plans/Master/WBS/master-wbs.csv','b27a0c5df2f5636d8ed71051e9e26a68959a2616'),
            'graph': ('Plans/Master/RELATIONSHIP_INDEX.yaml','c108d2c162bcea2ee4cc01def46d0487a9501032'),
            'runtime': ('CURRENT_STATE.md','16e545c765219e7d1da735b45045f3a9a3621816'),
            'candidate': ('TSK_0300_POST_CR0008_CURRENT_DEPENDENCY_REVALIDATION_2026-09-02.md','b7e731ad958d224fde3c132495df571a925ed697'),
            'readme': ('brand/system/TSK-0300/README.md','f7d013723c8dd967bb8337b44a52a19f32664d41'),
            'tokens': ('brand/system/TSK-0300/tokens.css','cd7d9a7cd5109e1ff0baa76532495dfd7a27a70f'),
            'components': ('brand/system/TSK-0300/components.css','831e92a74b6dda04252d93242cb33bd491a02381'),
            'public': ('brand/system/TSK-0300/templates/public.html','309f6a1f38474f78cd8a241aad3028fd495f9b8e'),
            'product': ('brand/system/TSK-0300/templates/product.html','872920b6f7af6561a1015e1d8fea55dcf95f1249'),
            'help': ('brand/system/TSK-0300/templates/help.html','3193c0d1e11367204d6c46fd862fec5a91245b64'),
            'status': ('brand/system/TSK-0300/templates/status.html','f4f3b32957c978fe9ea00704bd285a20e3c56aef'),
            'partner': ('brand/system/TSK-0300/templates/partner.html','03bb1fd67b9a9824bc856d1f312977d7767619a8'),
            'social': ('brand/system/TSK-0300/templates/social.html','cabdd12851fce1dbd5a3c6326ec6dec63f843958'),
            'identity': ('brand/identity/TSK-0301/README.md','b8ffd2ed234465a238558a7b94e56274de49696a'),
            'primary': ('brand/identity/TSK-0301/safeweb-wordmark-primary.svg','f93958e3e4a16f9056693072c1b9b8b31fcda852'),
            'inverse': ('brand/identity/TSK-0301/safeweb-wordmark-inverse.svg','c38709e4239a2d36b340b4d9d630df85a17bb494'),
            'mono': ('brand/identity/TSK-0301/safeweb-wordmark-monochrome.svg','ef9b6e0d52926f24c7e81bccb4489569067b852f'),
            'monogram': ('brand/identity/TSK-0301/safeweb-monogram.svg','49f20bae1d92bb04f125e988cb4cc3ea8a822b9e'),
            'e0301': ('TSK_0301_POST_CR0008_CURRENT_REVALIDATION_EVIDENCE_2026-09-02.md','c8935b9cfebe06fe1260b04d7af3c84318a6b5e0'),
            'e0299': ('TSK_0299_POST_CR0008_CORRECTED_ACCEPTANCE_EVIDENCE_2026-09-01.md','9d48add06fee14aef76f82a876a61cc88ce59440'),
            'ia0318': ('TSK_0318_POST_CR0008_DUAL_MODE_PUBLIC_PRODUCT_SETUP_IA_2026-09-01.md','975e2e7a8e85e9408e0bbbc2be226f3fdd012db3'),
            'e0316': ('TSK_0316_POST_CR0008_DUAL_MODE_FRICTION_EVIDENCE_2026-09-02.md','aaaa68119c21d76bc29d04e54443c23ce808bebc'),
          }
          P={k:Path(v[0]) for k,v in expected.items()}
          def blob(p): return subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          for k,(path,sha) in expected.items():
              assert P[k].exists(), f'missing {k}: {path}'
              actual=blob(P[k]); assert actual==sha, f'{k} hash mismatch {actual} != {sha}'
          print('TSK0300_IMMUTABLE_INPUT_HASHES=PASS')

          with P['wbs'].open(newline='',encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          byid={r['Task_ID']:r for r in rows if r.get('Task_ID')}
          r=byid['TSK-0300']
          assert (r['Lifecycle_Stage'],r['Priority'],r['AI_Capability_A0_A4'],r['Action_Authority'])==('L4','HIGH','A3','AUTO_ALLOWED')
          assert r['Dependencies'].strip()=='TSK-0301'
          assert (r['Acceptance_ID'],r['Verification_ID'],r['Evidence_ID'])==('ACC-0300','VER-0300','EVD-0300')
          ac=r['Acceptance_Criteria'].lower()
          for token in ['public','product','help','status','partner','social','one token source','accessibility']:
              assert token in ac, f'ACC-0300 missing {token}'
          print('TSK0300_CURRENT_WBS_CONTRACT=PASS')
          print('TSK0300_WBS_DEPENDENCY=TSK-0301')

          rt=P['runtime'].read_text(encoding='utf-8')
          assert '## TSK-0301 current accepted stable state — 2026-09-02 — POST-CR-0008 CURRENT DEPENDENCY REVALIDATION' in rt
          s0301=re.search(r'^## TSK-0301 current accepted stable state.*?(?=^## |\Z)',rt,re.MULTILINE|re.DOTALL)
          assert s0301 and '**PASS**' in s0301.group(0)
          assert 'TSK_0301_POST_CR0008_CURRENT_REVALIDATION_EVIDENCE_2026-09-02.md' in s0301.group(0)
          print('TSK0301_CURRENT_PREDECESSOR=PASS')

          protected=[
            '## TSK-0299 current accepted stable state — 2026-09-01 — POST-CR-0008 CORRECTED OWNER-IDENTITY BINDING',
            '## TSK-0485 current accepted stable state',
            '## TSK-0318 current accepted stable state',
            '## TSK-0319 current accepted stable state',
            '## TSK-0301 current accepted stable state — 2026-09-02 — POST-CR-0008 CURRENT DEPENDENCY REVALIDATION',
            '## TSK-0316 current accepted stable state — 2026-09-02 — POST-CR-0008 DUAL-MODE FRICTION REQUALIFICATION',
          ]
          def section(text,prefix):
              m=re.search(r'^'+re.escape(prefix)+r'.*$',text,re.MULTILINE); assert m, prefix
              n=re.search(r'^## ',text[m.end():],re.MULTILINE)
              end=m.end()+n.start() if n else len(text)
              return text[m.start():end]
          for h in protected:
              s=section(rt,h); assert '**PASS**' in s
              print('PROTECTED_SECTION_SHA256|{}|{}'.format(h,hashlib.sha256(s.encode()).hexdigest()))
          print('TSK0300_PROTECTED_RUNTIME_INPUTS=PASS')

          # Prove the owner-approved identity and its exact masters were not redesigned or reselected.
          ident=P['identity'].read_text(encoding='utf-8')
          e301=P['e0301'].read_text(encoding='utf-8')
          e299=P['e0299'].read_text(encoding='utf-8')
          assert 'The visible product/brand name is exactly **SafeWeb**.' in ident
          assert 'IDENTITY_RESELECTION_REQUIRED=NO' in e301
          assert 'visible brand/product token: `SafeWeb`' in e299
          assert 'generic parent-facing DNS feature/CTA language uses `SafeWeb DNS`' in e299
          print('TSK0300_OWNER_APPROVED_SAFEWEB_IDENTITY=PASS')
          print('TSK0300_IDENTITY_REDESIGN_REQUIRED=NO')
          print('TSK0300_IDENTITY_RESELECTION_REQUIRED=NO')

          # Core token/component architecture remains byte-identical to the historical accepted package.
          tokens=P['tokens'].read_text(encoding='utf-8')
          components=P['components'].read_text(encoding='utf-8')
          assert tokens.count('--sw-brand-green:')==1
          assert '#173F35' in tokens and '#7A2E36' in tokens and '#F6F4EF' in tokens
          assert '#' not in components
          assert 'var(--sw-' in components
          print('TSK0300_TOKEN_SOURCE_UNCHANGED=PASS')
          print('TSK0300_COMPONENT_LAYER_UNCHANGED=PASS')

          templates={k:P[k] for k in ['public','product','help','status','partner','social']}
          assert len(templates)==6
          for name,path in templates.items():
              text=path.read_text(encoding='utf-8')
              assert '../tokens.css' in text and '../components.css' in text, name
              assert '../../../identity/TSK-0301/' in text, name
              assert '<script' not in text.lower(), name
              assert 'http://' not in text.lower() and 'https://' not in text.lower(), name
              assert not re.search(r'#[0-9a-fA-F]{6}\b',text), name
          print('TSK0300_TEMPLATE_COUNT=6')
          print('TSK0300_CONTEXT_SET=help,partner,product,public,social,status')
          print('TSK0300_ALL_TEMPLATES_LOAD_SHARED_SYSTEM=PASS')
          print('TSK0300_ALL_TEMPLATES_REFERENCE_TSK0301_MASTERS=PASS')
          print('TSK0300_NO_REMOTE_SCRIPT_OR_DUPLICATE_HEX=PASS')

          readme=P['readme'].read_text(encoding='utf-8')
          for s in [
            '`tokens.css` is the **sole mutable implementation token source**',
            'The same owner-approved SafeWeb identity applies to the complete accountless core and the optional parent-account/session/dashboard/device-management continuity surfaces.',
            'A secondary `Sign in / Manage devices` route may expose the approved optional continuity feature',
            'Successful sign-in does not automatically join, import, promote, copy or extend J0/J1 state',
            'Accountless core remains fully usable without login.',
            'A managed-device record is minimum bounded continuity metadata, not a child identity and not protection proof.',
          ]: assert s in readme, s
          print('TSK0300_CURRENT_SHARED_SYSTEM_RULES=PASS')

          public=P['public'].read_text(encoding='utf-8')
          assert 'Start setup' in public
          assert 'Sign in / Manage devices' in public
          assert 'Continue without account' in public
          assert 'sign-in does not automatically import anonymous setup state' in public
          assert 'Account ownership does not prove that a device is currently protected' in public
          product=P['product'].read_text(encoding='utf-8')
          assert 'Finish without account' in product
          assert 'Sign in to manage devices' in product
          assert 'Sign-in does not automatically import anonymous journey state or upgrade the protection state.' in product
          print('TSK0300_DUAL_MODE_PUBLIC_PRODUCT_REFERENCE=PASS')

          ia=P['ia0318'].read_text(encoding='utf-8')
          for s in ['Optional account is visible but not coercive.','Public **Sign in / Manage devices**','**Finish without account**','Dashboard presence is not protection proof.','No automatic J0/J1 linkage']:
              assert s in ia, s
          e316=P['e0316'].read_text(encoding='utf-8')
          for s in ['complete accountless core remains the lowest-friction safe path','optional parent account/sign-in/session/dashboard/device management occurs only after explicit parent choice','valid sessions suppress redundant sign-in','managed-device persistence is minimum bounded continuity']:
              assert s in e316, s
          print('TSK0300_CURRENT_DUAL_MODE_AUTHORITY_COMPATIBILITY=PASS')

          status=P['status'].read_text(encoding='utf-8')
          for s in ['Verified','You confirmed this is set up','Action needed','Not covered','Status uncertain','Removed']:
              assert s in status, s
          assert 'color alone' in status.lower() or 'not encoded by brand color' in status.lower()
          assert 'low-contrast' in readme.lower() and 'monochrome/off-white fallback' in readme
          print('TSK0300_ACCESSIBILITY_AND_STATE_SEMANTICS=PASS')

          cand=P['candidate'].read_text(encoding='utf-8')
          for s in ['narrow semantic requalification, not redesign','Identity reselection required: NO. Identity redesign required: NO.','No color, typography, spacing, radius, sizing, focus, component or identity-master value was changed','Candidate disposition: ACC-0300 current PASS pending independent VER-0300']:
              assert s in cand, s
          print('TSK0300_REVALIDATION_SCOPE=PASS')

          subprocess.check_call(['git','diff','--check'])
          print('TSK0300_CURRENT_ACC=PASS')
          print('WBS_BLOB='+blob(P['wbs']))
          print('GRAPH_BLOB='+blob(P['graph']))
          print('RUNTIME_BLOB='+blob(P['runtime']))
          print('CANDIDATE_BLOB='+blob(P['candidate']))
          print('README_BLOB='+blob(P['readme']))
          print('PUBLIC_BLOB='+blob(P['public']))
          print('PRODUCT_BLOB='+blob(P['product']))
          PY
