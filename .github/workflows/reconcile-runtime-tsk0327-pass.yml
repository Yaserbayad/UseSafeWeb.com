name: Reconcile TSK-0327 PASS runtime state

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-runtime-tsk0327-pass.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-governance-state
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Reconcile TSK-0327 PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          python3 .github/scripts/reconcile_runtime_tsk0327_pass.py
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          [[ ${#changed[@]} -eq 1 && "${changed[0]}" == 'CURRENT_STATE.md' ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0327 critical findings disposition'
          git push origin HEAD:main
          echo 'RUNTIME_TSK0327_PASS_RECONCILIATION=PASS'
