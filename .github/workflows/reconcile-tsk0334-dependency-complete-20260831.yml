name: Reconcile dependency-complete TSK-0334 evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0334-dependency-complete-20260831.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist dependency-complete TSK-0334 evidence lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 .github/scripts/reconcile_tsk0334_dependency_complete_20260831.py
          git diff --check
          grep -Fq 'Corrective dependency-complete revalidation:' CURRENT_STATE.md
          grep -Fq '33420242950 / 99580565616' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: dependency-complete TSK-0334 evidence'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          echo "TSK0334_DEPENDENCY_COMPLETE_RECONCILIATION=PASS"
          echo "TSK0334_RUNTIME_COMMIT=$(git rev-parse HEAD)"
          echo "TSK0334_RUNTIME_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
