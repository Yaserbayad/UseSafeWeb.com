name: Record TSK-0423 evidence-backed PASS

on:
  push:
    branches: [main]
    paths: [.github/workflows/pass-tsk0423-20260905.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source, acceptance run, and checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = '20d50b9532291d6180f51f9eb64d80e336b3df76'
          test "$(git hash-object infrastructure/adguard-server/tsk-0423-privacy-security-regression.py)" = 'c50dd2b9b5a0e83cdc60fd7a962f018dee46d142'
          test "$(git hash-object .github/workflows/verify-tsk0423-adguard-privacy-security.yml)" = '1098e86c84eb8973f96f4d51d23d3956fe4ba230'
          jobs="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33982540881/jobs)"
          python3 - "$jobs" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1]); jobs={j['name']:j for j in d['jobs']}
          assert jobs['negative-regression']['conclusion']=='success'
          assert jobs['deployed-runtime-readonly']['conclusion']=='success'
          print('TSK0423_ACCEPTANCE_RUN=PASS')
          PY
          python3 infrastructure/adguard-server/tsk-0423-privacy-security-regression.py --config infrastructure/adguard-server/approved-adguard-config-v1.json --negative-matrix

          python3 - <<'PY'
          import copy,json
          from pathlib import Path
          p=Path('CURRENT_STATE.md'); text=p.read_text(encoding='utf-8'); before=json.loads(text)
          assert text==json.dumps(before,indent=2,ensure_ascii=False)+'\n'
          assert before['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert before['project_id']=='UseSafeWeb.com'
          assert before['governance_mode']=='SERIAL_LIGHT'
          assert before['checkpoint_revision']==30
          assert before['baseline']['version']==1
          assert before['runtime']['project_status']=='ACTIVE'
          assert before['runtime']['governance_blocker'] is None
          assert before['runtime']['human_constraints']==[]
          base={x['id']:x for x in before['baseline']['work_items']}; rt={x['id']:x for x in before['runtime']['items']}
          assert rt['TSK-0423']=={'id':'TSK-0423','status':'TODO','acceptance_references':[]}
          assert rt['TSK-0413']['status']=='PASS'
          assert base['TSK-0423']['depends_on']==['TSK-0413']
          assert base['TSK-0423']['acceptance_criteria']==[{'id':'ACC-0423','condition':'The check detects every seeded unsafe configuration and runs in deployment/recovery/release acceptance.'}]
          after=copy.deepcopy(before); after['checkpoint_revision']=31
          target=next(x for x in after['runtime']['items'] if x['id']=='TSK-0423')
          target['status']='PASS'; target['acceptance_references']=[{
            'ac_id':'ACC-0423','evidence_type':'TEST_RESULT',
            'reference':'Yaserbayad/UseSafeWeb.com source commit 0f5d9695c259c4f66b0c47bf3752cc40d7a10dc0; verifier blob c50dd2b9b5a0e83cdc60fd7a962f018dee46d142; acceptance workflow blob 1098e86c84eb8973f96f4d51d23d3956fe4ba230; GitHub Actions run 33982540881 jobs 101350218278 and 101350218385',
            'summary':'ACC-0423 satisfied: the automated regression rejects every seeded unsafe privacy/security configuration class and the reusable release/deployment/recovery acceptance workflow passed both hosted negative-matrix verification and read-only production-like AdGuard target verification.',
            'verification_context':'Run 33982540881 on exact head 0f5d9695c259c4f66b0c47bf3752cc40d7a10dc0: negative-regression SUCCESS and deployed-runtime-readonly SUCCESS. Target checks are read-only and cover live AdGuard settings, public-admin exposure/firewall, filter behavior and service state; no target mutation is performed.'}]
          assert after['baseline']==before['baseline']
          bi={x['id']:x for x in before['runtime']['items']}; ai={x['id']:x for x in after['runtime']['items']}
          for tid,old in bi.items():
              if tid!='TSK-0423': assert ai[tid]==old,tid
          assert ai['TSK-0423']['status']=='PASS' and len(ai['TSK-0423']['acceptance_references'])==1
          assert 'next_work' not in after and 'next_work' not in after['runtime']
          p.write_text(json.dumps(after,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('TSK0423_PASS_MUTATION=PASS revision=31')
          PY
          git diff --check -- CURRENT_STATE.md
      - name: Stale-write guard, remove transport, commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = '20d50b9532291d6180f51f9eb64d80e336b3df76'
          test "$(git show origin/main:infrastructure/adguard-server/tsk-0423-privacy-security-regression.py | git hash-object --stdin)" = 'c50dd2b9b5a0e83cdc60fd7a962f018dee46d142'
          test "$(git show origin/main:.github/workflows/verify-tsk0423-adguard-privacy-security.yml | git hash-object --stdin)" = '1098e86c84eb8973f96f4d51d23d3956fe4ba230'
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pass-tsk0423-20260905.yml
          git add CURRENT_STATE.md
          git commit -m 'state: confirm TSK-0423 privacy security regression pass'
          git push origin HEAD:main
