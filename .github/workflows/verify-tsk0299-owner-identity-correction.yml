name: Verify TSK-0299 owner-identity correction

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0299-owner-verify-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify corrected TSK-0299 acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, subprocess
          from pathlib import Path

          P={
            'base':Path('TSK_0299_POST_CR0008_DUAL_MODE_VERBAL_SYSTEM_2026-09-01.md'),
            'correction':Path('TSK_0299_POST_CR0008_OWNER_IDENTITY_BINDING_CORRECTION_2026-09-01.md'),
            'owner':Path('TSK_0301_OWNER_IDENTITY_APPROVAL_2026-08-29.md'),
            'identity':Path('brand/identity/TSK-0301/README.md'),
            'statecopy':Path('TSK_0320_POST_CR0008_PROTECTION_STATE_MODEL_AND_COPY_RULES_2026-09-01.md'),
            'wbs':Path('Plans/Master/WBS/master-wbs.csv'),
            'graph':Path('Plans/Master/RELATIONSHIP_INDEX.yaml'),
            'runtime':Path('CURRENT_STATE.md'),
          }
          E={
            'base':'ff30500b933b9ecc92325659d49ea4e671d296d2',
            'correction':'6b4ac6020391a2f6e291f83c50f27a7583215f3b',
            'owner':'66f4b545c03571649a8baa4c0fe3d1df564b5949',
            'identity':'b8ffd2ed234465a238558a7b94e56274de49696a',
            'statecopy':'bdc6bacc424669708f410466f3cfd5527f1c2b3c',
            'wbs':'b27a0c5df2f5636d8ed71051e9e26a68959a2616',
            'graph':'c108d2c162bcea2ee4cc01def46d0487a9501032',
            'runtime':'1d25f08512fe2398bbfbdb89783a87a2b7da3dd2',
          }
          def blob(p): return subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          for k,p in P.items():
              assert p.exists(), f'missing {k}'
              assert blob(p)==E[k], f'{k} hash mismatch: {blob(p)} != {E[k]}'

          with P['wbs'].open(newline='',encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          byid={r['Task_ID']:r for r in rows if r.get('Task_ID')}
          r=byid['TSK-0299']
          assert r['Lifecycle_Stage']=='L4' and r['Priority']=='HIGH'
          assert r['Action_Authority']=='AUTO_ALLOWED' and r['AI_Capability_A0_A4']=='A3'
          assert r['Dependencies'].strip()=='TSK-0298'
          assert (r['Acceptance_ID'],r['Verification_ID'],r['Evidence_ID'])==('ACC-0299','VER-0299','EVD-0299')

          owner=P['owner'].read_text(encoding='utf-8')
          for s in ['**Brand name:** `SafeWeb`','`UseSafeWeb.com` remains the project/domain/repository identity','must not be reused as brand copy or logo text','**TSK-0301 identity selection: OWNER APPROVED — SafeWeb Concept A']:
              assert s in owner, f'owner identity authority missing: {s}'
          identity=P['identity'].read_text(encoding='utf-8')
          assert 'The visible product/brand name is exactly **SafeWeb**.' in identity
          assert 'do not render `UseSafeWeb`' in identity

          corr=P['correction'].read_text(encoding='utf-8')
          required=[
            '**Visible product/brand name:** `SafeWeb`',
            '**Project/domain/repository identity:** `UseSafeWeb.com`',
            '`UseSafeWeb` without `.com` is not a visible brand token',
            'Generic parent-facing product references** use `SafeWeb`, not `UseSafeWeb`',
            'Generic parent-facing DNS feature references** use `SafeWeb DNS`',
            '`Remove UseSafeWeb DNS` as generic CTA | `Remove SafeWeb DNS`',
            '`UseSafeWeb verified this protection step for this setup.` | `SafeWeb verified this protection step for this setup.`',
            '`You can complete the core setup without a UseSafeWeb account.` | `You can complete the core setup without a SafeWeb account.`',
            'current TSK-0299 parent-facing rendering applies the higher-authority owner identity token `SafeWeb`',
            'complete accountless core remains usable without login',
            'optional parent account adds bounded continuity/session/dashboard/device management, never stronger protection',
            'no automatic J0/J1 import/link/promotion/TTL extension on sign-in',
            'no browsing/query/activity history, child account/profile or broad DNS administration',
            '`RSK-0002` remains OPEN',
            'TSK-0485 and synchronized TSK-0318/TSK-0319 runtime PASS sections are not modified by this correction',
            'TSK-0301 owner-approved identity is preserved rather than reselected or overwritten',
          ]
          for s in required: assert s in corr, f'correction missing: {s}'

          # State IDs/evidence semantics remain owned by TSK-0320 and unchanged by the lexical identity binding.
          state=P['statecopy'].read_text(encoding='utf-8')
          for s in ['S1 — `protected/verified`','S2 — `configured/parent-confirmed`','S3 — `action-needed`','S4 — `not-covered`','S5 — `uncertain/error`','S6 — `removed`','Account ownership and persistent device registration are E2/context, not E1']:
              assert s in state, f'TSK-0320 semantic input missing: {s}'
              assert s in corr or s.startswith('Account ownership'), f'correction does not preserve state semantic: {s}'

          # The correction must explicitly normalize every visible product-token example that was material to the first-pass acceptance.
          corrected_copy=[
            'SafeWeb verified this protection step for this setup.',
            'SafeWeb does not cover this on your current setup.',
            'This setup is no longer enrolled through SafeWeb.',
            'Setup complete. Review what SafeWeb verified, what you confirmed, what needs action, and what is not covered.',
            'You can complete the core setup without a SafeWeb account.',
            'SafeWeb is not a child browsing or activity monitoring product.',
            'Remove SafeWeb DNS',
          ]
          for s in corrected_copy: assert s in corr, f'missing corrected visible copy: {s}'

          # Base candidate still supplies the complete acceptance semantics that the binding correction leaves unchanged.
          base=P['base'].read_text(encoding='utf-8')
          for s in ['Plain language first','Calm, non-alarmist framing','Child-aware, not child-surveillance language','Optional account is continuity, not stronger protection','Anonymous and persistent state stay separate','No browsing/query/activity history','No broad DNS administration','English, Turkish and Arabic','RTL','Continue without account','Finish without account',"We couldn't confirm that change",'no successor becomes PASS merely because this candidate exists']:
              assert s in base, f'base acceptance semantic missing: {s}'

          rt=P['runtime'].read_text(encoding='utf-8')
          for h in ['## TSK-0485 current accepted stable state','## TSK-0318 current accepted stable state','## TSK-0319 current accepted stable state','## TSK-0299 current accepted stable state']:
              assert h in rt, f'runtime heading missing: {h}'

          assert byid['TSK-0301']['Dependencies'].strip()=='TSK-0302; TSK-0299'
          graph=P['graph'].read_text(encoding='utf-8')
          for tid in ['TSK-0299','TSK-0301','TSK-0302']: assert tid in graph

          subprocess.check_call(['git','diff','--check'])
          print('TSK0299_OWNER_IDENTITY_AUTHORITY=PASS')
          print('TSK0299_SAFEWEB_VISIBLE_BRAND=PASS')
          print('TSK0299_DOMAIN_BRAND_SEPARATION=PASS')
          print('TSK0299_STATE_SEMANTICS_PRESERVED=PASS')
          print('TSK0299_DUAL_MODE_SEMANTICS_PRESERVED=PASS')
          print('TSK0299_LIFECYCLE_LOCALIZATION_CLAIMS_PRESERVED=PASS')
          print('TSK0299_SUCCESSOR_INTEGRITY=PASS')
          print('TSK0485_PRESERVED_INPUT=PASS')
          print('TSK0318_PRESERVED_INPUT=PASS')
          print('TSK0319_PRESERVED_INPUT=PASS')
          print('TSK0299_CORRECTED_ACCEPTANCE=PASS')
          for k,p in P.items(): print(k.upper()+'_BLOB='+blob(p))
          PY
