name: Reconcile TSK-0044 current state

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0044-runtime-reconcile-trigger.txt']

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile guarded TSK-0044 state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/reconcile_tsk0044_current_state.py
          if git diff --quiet -- CURRENT_STATE.md; then
            echo 'TSK0044_RUNTIME_WRITE=ALREADY_APPLIED'
            exit 0
          fi
          changes="$(git status --porcelain)"
          test "$(printf '%s\n' "$changes" | sed '/^$/d' | wc -l)" -eq 1
          printf '%s\n' "$changes" | grep -Fx ' M CURRENT_STATE.md'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: reconcile current TSK-0044 revalidation'
          git push origin HEAD:main
          echo 'TSK0044_RUNTIME_WRITE=PASS'
