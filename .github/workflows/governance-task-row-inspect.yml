name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Print TSK-0407 successors and TSK-0429 comparison
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv, json, re
          path='Plans/Master/WBS/master-wbs.csv'
          with open(path, newline='', encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          by_id={r.get('Task_ID','').strip():r for r in rows if r.get('Task_ID','').strip()}
          successor=[]
          for r in rows:
              deps=[x.strip() for x in (r.get('Dependencies') or '').split(';') if x.strip()]
              if 'TSK-0407' in deps:
                  successor.append(r)
          wanted={'TSK-0429'}
          for r in successor:
              wanted.add(r['Task_ID'].strip())
              wanted.update(x.strip() for x in (r.get('Dependencies') or '').split(';') if x.strip())
          for task_id in sorted(wanted):
              assert task_id in by_id, task_id
              print(task_id.replace('-','_')+'_WBS_ROW='+json.dumps(by_id[task_id], sort_keys=True, ensure_ascii=False))
          print('TSK_0407_DIRECT_SUCCESSOR_IDS='+','.join(r['Task_ID'].strip() for r in successor))
          PY
