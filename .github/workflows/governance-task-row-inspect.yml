name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  apply:
    strategy:
      fail-fast: false
      matrix:
        slot: [a, b]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 12
    steps:
      - name: Apply renewal controls only on verified production VM
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "SLOT=${{ matrix.slot }}"
          echo "RUNNER_NAME=${{ runner.name }}"
          VMID="$(python3 - <<'PY'
          import json,urllib.request
          req=urllib.request.Request('http://169.254.169.254/metadata/instance/compute?api-version=2021-02-01',headers={'Metadata':'true'})
          with urllib.request.urlopen(req,timeout=3) as r: print(json.load(r).get('vmId',''))
          PY
          )"
          echo "AZURE_VM_ID=$VMID"
          if [[ "$VMID" != 'bc7f566f-7231-41fb-9fdd-49cf190fd5e1' ]]; then
            echo 'ROLE=NON_PRODUCTION_SKIP'
            sleep 30
            exit 0
          fi

          echo 'ROLE=PRODUCTION'
          sudo -n true
          [[ "$(hostname -s)" == 'adguardvm' ]]
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 24.04 ]]
          systemctl is-active --quiet AdGuardHome.service
          systemctl is-active --quiet nginx.service
          systemctl is-enabled --quiet certbot.timer
          systemctl is-active --quiet certbot.timer

          HOOK=/etc/letsencrypt/renewal-hooks/deploy/10-usesafeweb-reload-nginx.sh
          TMP="$(mktemp)"
          trap 'rm -f "$TMP" /tmp/usw-certbot-dryrun.log' EXIT
          cat > "$TMP" <<'SH'
          #!/bin/sh
          set -eu
          /usr/sbin/nginx -t
          /bin/systemctl reload nginx
          SH
          sudo install -o root -g root -m 0755 "$TMP" "$HOOK"
          [[ "$(sudo stat -Lc '%u:%g:%a' "$HOOK")" == '0:0:755' ]]
          echo "DEPLOY_HOOK_SHA256=$(sudo sha256sum "$HOOK" | awk '{print $1}')"
          sudo nginx -t
          sudo "$HOOK"
          systemctl is-active --quiet nginx.service
          echo 'DEPLOY_HOOK_RELOAD=PASS'

          echo 'CERTBOT_DRY_RUN_BEGIN'
          sudo certbot renew --dry-run --no-random-sleep-on-renew 2>&1 | tee /tmp/usw-certbot-dryrun.log
          echo 'CERTBOT_DRY_RUN_END'
          echo 'CERTBOT_RENEWAL_DRY_RUN=PASS'

          CERT=/etc/letsencrypt/live/dns.usesafeweb.com/fullchain.pem
          KEY=/etc/letsencrypt/live/dns.usesafeweb.com/privkey.pem
          sudo openssl x509 -in "$CERT" -noout -checkhost dns.usesafeweb.com >/dev/null
          sudo openssl x509 -in "$CERT" -noout -checkend 2592000 >/dev/null
          [[ "$(sudo stat -Lc '%u:%a' "$KEY")" == '0:600' ]]
          timeout 5 openssl s_client -connect 127.0.0.1:443 -servername dns.usesafeweb.com -verify_hostname dns.usesafeweb.com -verify_return_error </dev/null 2>/dev/null | grep -q 'Verify return code: 0 (ok)'
          timeout 5 openssl s_client -connect 127.0.0.1:853 -servername dns.usesafeweb.com -verify_hostname dns.usesafeweb.com -verify_return_error </dev/null 2>/dev/null | grep -q 'Verify return code: 0 (ok)'
          [[ "$(sudo ss -lntH 'sport = :3000' | awk '{print $4}' | sort -u)" == '127.0.0.1:3000' ]]
          sudo ss -lntH 'sport = :53' | awk '{print $4}' | grep -qx '127.0.0.1:53'
          sudo ss -lnuH 'sport = :53' | awk '{print $4}' | grep -qx '127.0.0.1:53'
          systemctl is-enabled --quiet certbot.timer
          systemctl is-active --quiet certbot.timer
          echo 'POST_RENEWAL_SECURITY_BOUNDARY=PASS'
          echo 'TSK_0443_PRODUCTION_RENEWAL_CONTROL=PASS'
          sleep 30
