name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Print remaining L2 PKG-09 task boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig')))
          for r in rows:
              tid=(r.get('Task_ID') or '').strip()
              try: n=int(tid.split('-')[1])
              except Exception: continue
              if 448 <= n <= 482:
                  keys=['Task_ID','Title','Lifecycle_Stage','Priority','Critical_Path','Plan_Status','Execution_State','Dependencies','Action_Authority','Acceptance_ID','Acceptance_Criteria','Requirement_Reference','Risk_Reference']
                  print(json.dumps({k:r.get(k,'') for k in keys},sort_keys=True,ensure_ascii=False))
          PY
