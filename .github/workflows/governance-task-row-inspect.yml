name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  patch:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Apply current Ubuntu package updates and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          sudo -n true
          MID="$(sha256sum /etc/machine-id | awk '{print $1}')"
          [[ "$MID" == "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2" ]]
          python3 - <<'PY'
          import json,urllib.request
          req=urllib.request.Request('http://169.254.169.254/metadata/instance/compute?api-version=2021-02-01',headers={'Metadata':'true'})
          with urllib.request.urlopen(req,timeout=3) as r: d=json.load(r)
          assert d.get('name')=='adguardvm' and d.get('location')=='westeurope',d
          print('PRODUCTION_IDENTITY=PASS')
          PY
          systemctl is-active --quiet AdGuardHome.service
          systemctl is-active --quiet nginx.service
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=a
          sudo -E apt-get update -y
          sudo -E apt-get -y full-upgrade
          echo 'PACKAGE_UPDATE_APPLIED=PASS'
          SIM="$(sudo apt-get -s full-upgrade 2>/dev/null || true)"
          if grep -q '^Inst ' <<<"$SIM"; then
            echo 'PENDING_UPGRADES_BEGIN'
            grep '^Inst ' <<<"$SIM" | head -20
            echo 'PENDING_UPGRADES_END'
            exit 1
          fi
          echo 'NO_PENDING_UPGRADES=PASS'
          systemctl is-active --quiet AdGuardHome.service
          systemctl is-active --quiet nginx.service
          systemctl is-enabled --quiet apt-daily.timer
          systemctl is-enabled --quiet apt-daily-upgrade.timer
          if [[ -e /var/run/reboot-required ]]; then
            echo 'REBOOT_REQUIRED=YES'
            exit 2
          fi
          echo 'REBOOT_REQUIRED=NO'
          echo 'TSK_0437_PATCH_REPAIR=PASS'
