name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Print recovery and renewal authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv,json,pathlib
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig')))
          for tid in ['TSK-0431','TSK-0443']:
              r=next(x for x in rows if (x.get('Task_ID') or '').strip()==tid)
              keys=['Task_ID','Title','Lifecycle_Stage','Priority','Critical_Path','Plan_Status','Execution_State','Dependencies','Trigger','Preconditions','Action_Authority','Acceptance_ID','Acceptance_Criteria','Verification_ID','Required_Tools_or_Access','Requirement_Reference','Interface_Reference','Risk_Reference','Notes']
              print('WBS='+json.dumps({k:r.get(k,'') for k in keys},sort_keys=True,ensure_ascii=False))
          targets=['REQ-0049','REQ-0050','REQ-0052','CON-0004','CON-0005','CON-0019','INT-0014','RSK-0048','ACC-0431','ACC-0443','VER-0431','VER-0443']
          files=[
            'Plans/Master/Registers/REQUIREMENTS.md',
            'Plans/Master/Registers/CONSTRAINTS.md',
            'Plans/Master/Registers/INTERFACES.md',
            'Plans/Master/Registers/RISKS.md',
            'Plans/Master/Registers/VERIFICATION_EVIDENCE_ACCEPTANCE.md',
            'Plans/Master/Layers/LAYER_5_AI_EXECUTION_EVIDENCE_STATE_CONTROL.md'
          ]
          for f in files:
              p=pathlib.Path(f)
              text=p.read_text(encoding='utf-8')
              lines=text.splitlines()
              hits=[]
              for i,line in enumerate(lines):
                  if any(t in line for t in targets):
                      hits.append(i)
              if hits:
                  print('FILE='+f)
                  emitted=set()
                  for i in hits:
                      for j in range(max(0,i-2),min(len(lines),i+3)):
                          if j not in emitted:
                              print(f'{j+1}: {lines[j]}')
                              emitted.add(j)
          PY
