name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Recompute affected queue after TSK-0202 PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv, json
          path='Plans/Master/WBS/master-wbs.csv'
          with open(path, newline='', encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          by_id={r.get('Task_ID','').strip():r for r in rows if r.get('Task_ID','').strip()}
          wanted={'TSK-0429','TSK-0430','TSK-0443','TSK-0514','TSK-0511'}
          for task_id in list(wanted):
              assert task_id in by_id, task_id
              wanted.update(x.strip() for x in (by_id[task_id].get('Dependencies') or '').split(';') if x.strip())
          for task_id in sorted(wanted):
              assert task_id in by_id, task_id
              print(task_id.replace('-','_')+'_WBS_ROW='+json.dumps(by_id[task_id], sort_keys=True, ensure_ascii=False))
          for target in ['TSK-0429','TSK-0430','TSK-0443','TSK-0514','TSK-0511']:
              successors=[]
              for r in rows:
                  deps=[x.strip() for x in (r.get('Dependencies') or '').split(';') if x.strip()]
                  if target in deps:
                      successors.append(r['Task_ID'].strip())
              print(target.replace('-','_')+'_DIRECT_SUCCESSOR_IDS='+','.join(successors))
          PY
