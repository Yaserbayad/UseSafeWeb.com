name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Independent TSK-0227 diagnostic logging audit
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv,subprocess
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig')))
          by={r['Task_ID'].strip():r for r in rows if (r.get('Task_ID') or '').strip()}
          t=by['TSK-0227']; p=by['TSK-0224']
          assert t['Action_Authority'].strip()=='AUTO_ALLOWED'
          assert t['Acceptance_ID'].strip()=='ACC-0227' and t['Dependencies'].strip()=='TSK-0224'
          assert p['Acceptance_ID'].strip()=='ACC-0224' and p['Execution_State'].strip()=='PASS'
          files={'runbook':'EXCEPTIONAL_DIAGNOSTIC_LOGGING_PROCEDURE.md','gate':'VALIDATION_READINESS_GATE.md'}
          blobs={k:subprocess.check_output(['git','hash-object',v],text=True).strip() for k,v in files.items()}
          assert blobs['runbook']=='f9e1bb52582a69bc385aa69c93d02febb7b5cffa'
          assert blobs['gate']=='b3b0efd0cc0f40faa1ecab190c7469b8dff12ec1'
          gate=open(files['gate'],encoding='utf-8').read(); text=open(files['runbook'],encoding='utf-8').read()
          for s in ['identifiable DNS/domain history: **not retained**','no later than 30 days after that participant\'s follow-up','no later than 90 days after Experiment 1 closes']:
              assert s in gate,'TSK-0224 proof gap '+s
          required=[
            'Incident / ticket ID','Necessity','Exact fields','Start time','End time','Access list','Approver',
            'User notice','Deletion owner','Deletion verification method','Data minimisation order','synthetic test traffic',
            'no later than this time','restore and verify the privacy-minimal baseline configuration',
            'delete the temporary diagnostic dataset','Temporary data deleted: PASS/FAIL','Deletion verifier:',
            'no indefinite or open-ended exceptional logging','no GitHub commit of raw diagnostic/query data',
            'no automatic extension after the approved end time'
          ]
          for s in required: assert s in text,'ACC-0227 gap '+s
          print('TSK_0224_DIRECT_PREDECESSOR_PROOF=PASS')
          print('TSK_0227_ACCEPTANCE_CLASSES=9/9')
          print('TSK_0227_ARTIFACT_BLOB='+blobs['runbook'])
          print('TSK_0227_INDEPENDENT_AUDIT=PASS')
          PY
