name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read-only TSK-0441 DNS preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          command -v dig >/dev/null

          for resolver in system 1.1.1.1 8.8.8.8 9.9.9.9; do
            if [[ "$resolver" == system ]]; then
              dns_a="$(dig +short A dns.usesafeweb.com | sort -u | paste -sd, -)"
              dns_aaaa="$(dig +short AAAA dns.usesafeweb.com | sort -u | paste -sd, -)"
              dns_cname="$(dig +short CNAME dns.usesafeweb.com | sort -u | paste -sd, -)"
              srv_a="$(dig +short A srv.usesafeweb.com | sort -u | paste -sd, -)"
            else
              dns_a="$(dig +time=3 +tries=1 +short A dns.usesafeweb.com @"$resolver" | sort -u | paste -sd, -)"
              dns_aaaa="$(dig +time=3 +tries=1 +short AAAA dns.usesafeweb.com @"$resolver" | sort -u | paste -sd, -)"
              dns_cname="$(dig +time=3 +tries=1 +short CNAME dns.usesafeweb.com @"$resolver" | sort -u | paste -sd, -)"
              srv_a="$(dig +time=3 +tries=1 +short A srv.usesafeweb.com @"$resolver" | sort -u | paste -sd, -)"
            fi
            echo "RESOLVER=$resolver DNS_A=${dns_a:-NONE} DNS_AAAA=${dns_aaaa:-NONE} DNS_CNAME=${dns_cname:-NONE} SRV_A=${srv_a:-NONE}"
          done

          echo 'TSK_0441_READ_ONLY_PREFLIGHT=PASS'
