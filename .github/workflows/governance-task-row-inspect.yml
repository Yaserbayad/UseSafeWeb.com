name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Independent TSK-0169 support-intake audit
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv,re,subprocess
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig')))
          by={r['Task_ID'].strip():r for r in rows if (r.get('Task_ID') or '').strip()}
          t=by['TSK-0169']
          assert t['Action_Authority'].strip()=='AUTO_ALLOWED'
          assert t['Acceptance_ID'].strip()=='ACC-0169'
          assert t['Dependencies'].strip()=='TSK-0227; TSK-0165'
          state=open('CURRENT_STATE.md',encoding='utf-8').read()
          pass_block=state.split('### PASS',1)[1].split('### TSK-0204 corrected stable state',1)[0]
          runtime_pass=set(re.findall(r'`(TSK-\d+)`\s+—',pass_block))
          assert {'TSK-0227','TSK-0165'} <= runtime_pass
          files={
            'intake':'EXPERIMENT_01_SUPPORT_FALSE_POSITIVE_INTAKE.md',
            'diagnostic':'EXCEPTIONAL_DIAGNOSTIC_LOGGING_PROCEDURE.md',
            'facilitator':'EXPERIMENT_01_FACILITATOR_GUIDE.md',
            'claims':'PROTECTION_CLAIMS_CHECKLIST.md',
            'safeguarding':'CHILD_SAFETY_ESCALATION_PROCEDURE.md'
          }
          blobs={k:subprocess.check_output(['git','hash-object',v],text=True).strip() for k,v in files.items()}
          expected={
            'intake':'9fab42f97e3e96023de89a8ed266acc21c0f06ab',
            'diagnostic':'f9e1bb52582a69bc385aa69c93d02febb7b5cffa',
            'facilitator':'7d80c1338acc1a5a4c1ff30c020ca39021d8dcb3',
            'claims':'4bfc83421318fe761d06f9a63e052e3bff36070a',
            'safeguarding':'18c6ac79c3fa5db21c5e591e81fe5b6611cd7bf1'
          }
          assert blobs==expected,(blobs,expected)
          text=open(files['intake'],encoding='utf-8').read()
          required=[
            'Participant ID (pseudonymous):','Category:','Severity:','Privacy-safe evidence reference:',
            'Active intervention minutes:','Action taken:','Outcome:','Closure status:','UTC closed:','Closure verifier:',
            'EXCEPTIONAL_DIAGNOSTIC_LOGGING_PROCEDURE.md','Diagnostic procedure invoked?: yes/no + ticket ID',
            'FALSE-POSITIVE','COMPATIBILITY','REMOVAL-RECOVERY','PRIVACY-SECURITY','SAFEGUARDING',
            'Never ask for browsing history or enable broad query logging as the default way to diagnose a false positive',
            'Reproduce with a synthetic/non-participant test where possible',
            'Do not disable the whole baseline to solve one domain/service issue',
            'Re-test the legitimate path and at least one relevant baseline blocked-test path',
            'Time and classify assistance using `EXPERIMENT_01_FACILITATOR_GUIDE.md`',
            'CHILD_SAFETY_ESCALATION_PROCEDURE.md',
            'temporary diagnostic logging is stopped and deletion verified under TSK-0227'
          ]
          for s in required: assert s in text,'ACC-0169 gap '+s
          forbidden=['child name','exact DOB','browsing/domain history','messages','contacts','photos','location','credentials','tokens','private keys','raw AdGuard query logs']
          for s in forbidden: assert s in text,'privacy control gap '+s
          print('TSK_0227_RUNTIME_PREDECESSOR=PASS')
          print('TSK_0165_RUNTIME_PREDECESSOR=PASS')
          print('TSK_0169_ACCEPTANCE_CLASSES=8/8')
          print('TSK_0169_PRIVACY_BOUNDARY=PASS')
          print('TSK_0169_DIAGNOSTIC_REFERENCE=PASS')
          print('TSK_0169_ARTIFACT_BLOB='+blobs['intake'])
          print('TSK_0169_INDEPENDENT_AUDIT=PASS')
          PY
