name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Print TSK-0442 through TSK-0447 authority rows
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig')))
          wanted={f'TSK-{i:04d}' for i in range(442,448)}
          for r in rows:
              if (r.get('Task_ID') or '').strip() in wanted:
                  keys=['Task_ID','Title','Lifecycle_Stage','Priority','Critical_Path','Plan_Status','Execution_State','Dependencies','Trigger','Preconditions','Action_Authority','Acceptance_ID','Acceptance_Criteria','Verification_ID','Required_Tools_or_Access','Requirement_Reference','Constraint_Reference','Interface_Reference','Risk_Reference','Notes']
                  print(json.dumps({k:r.get(k,'') for k in keys},sort_keys=True,ensure_ascii=False))
          PY
