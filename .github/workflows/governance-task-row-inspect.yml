name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Independent TSK-0165 facilitator-guide audit
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv,re,subprocess
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig')))
          by={r['Task_ID'].strip():r for r in rows if (r.get('Task_ID') or '').strip()}
          t=by['TSK-0165']
          assert t['Action_Authority'].strip()=='AUTO_ALLOWED'
          assert t['Acceptance_ID'].strip()=='ACC-0165'
          assert t['Dependencies'].strip()=='TSK-0166; TSK-0228'
          state=open('CURRENT_STATE.md',encoding='utf-8').read()
          pass_block=state.split('### PASS',1)[1].split('### TSK-0204 corrected stable state',1)[0]
          runtime_pass=set(re.findall(r'`(TSK-\d+)`\s+—',pass_block))
          assert {'TSK-0166','TSK-0228'} <= runtime_pass
          files={
            'guide':'EXPERIMENT_01_FACILITATOR_GUIDE.md',
            'protocol':'EXPERIMENT_01_CONCIERGE_VALIDATION.md',
            'schema':'EXPERIMENT_01_PARTICIPANT_RECORD_SCHEMA.md',
            'safeguarding':'CHILD_SAFETY_ESCALATION_PROCEDURE.md'
          }
          blobs={k:subprocess.check_output(['git','hash-object',v],text=True).strip() for k,v in files.items()}
          assert blobs['guide']=='7d80c1338acc1a5a4c1ff30c020ca39021d8dcb3'
          assert blobs['protocol']=='bc801da11d7a7f2a5315d1cdca4f0d134afe7805'
          assert blobs['schema']=='c7706fceced87c797b8cd92179198754e2b08ffe'
          assert blobs['safeguarding']=='18c6ac79c3fa5db21c5e591e81fe5b6611cd7bf1'
          guide=open(files['guide'],encoding='utf-8').read(); protocol=open(files['protocol'],encoding='utf-8').read(); schema=open(files['schema'],encoding='utf-8').read()
          # Frozen-hypothesis and journey fidelity.
          hypothesis='Qualified parents at the first-smartphone transition will value one guided safety journey enough to complete real configuration changes'
          assert hypothesis in guide and hypothesis in protocol
          for s in ['Phone → Internet → Service','Native safeguards first','Baseline protection','Protection Map']:
              assert s in guide,'journey gap '+s
          # ACC-0165 exact acceptance classes.
          required=[
            'must **not silently complete setup for the parent**',
            'Every intervention that helps a parent move forward is timed and classified',
            'record category, duration, reason and outcome',
            'Safety correction?: yes/no','Start UTC/time marker:','End UTC/time marker:','Active assistance minutes:',
            "Did facilitator perform the user's action?: yes/no",
            'U1 | Wording / comprehension help','U2 | Navigation / discovery help','T1 | Technical setup help',
            'C1 | Compatibility / false-positive recovery','S1 | Safety/privacy correction','G1 | Safeguarding escalation',
            'A **usability intervention**','A **safety/privacy correction**','A **safeguarding escalation**',
            'no performing steps off-camera/behind the scenes and recording them as parent completion',
            'do **not** count the result as silent self-service success'
          ]
          for s in required: assert s in guide,'ACC-0165 gap '+s
          # Measurement and privacy alignment with the accepted participant schema.
          for s in ['intervention','assistance','abandonment','comprehension']:
              assert s.lower() in schema.lower(),'schema alignment gap '+s
          for forbidden in ['child browsing/domain history','child name','exact DOB','messages','contacts','photos','location']:
              assert forbidden.lower() in guide.lower(),'privacy control gap '+forbidden
          print('TSK_0166_RUNTIME_PREDECESSOR=PASS')
          print('TSK_0228_RUNTIME_PREDECESSOR=PASS')
          print('TSK_0165_PROTOCOL_ALIGNMENT=PASS')
          print('TSK_0165_SCHEMA_ALIGNMENT=PASS')
          print('TSK_0165_ACCEPTANCE_CLASSES=4/4')
          print('TSK_0165_ARTIFACT_BLOB='+blobs['guide'])
          print('TSK_0165_INDEPENDENT_AUDIT=PASS')
          PY
