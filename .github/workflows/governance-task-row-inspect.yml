name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Print canonical dependency rows for TSK-0483
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv, json
          wanted=['TSK-0011','TSK-0203','TSK-0436','TSK-0483']
          path='Plans/Master/WBS/master-wbs.csv'
          with open(path, newline='', encoding='utf-8-sig') as f:
              reader=csv.DictReader(f)
              by_id={r.get('Task_ID','').strip():r for r in reader if r.get('Task_ID','').strip() in wanted}
          assert set(by_id)==set(wanted), (set(wanted)-set(by_id))
          for task_id in wanted:
              print(task_id.replace('-','_')+'_WBS_ROW='+json.dumps(by_id[task_id], sort_keys=True, ensure_ascii=False))
          PY
