name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 4
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read-only runner and DNS verification
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "PROBE_SLOT=${{ matrix.slot }}"
          echo "HOSTNAME=$(hostname -s)"
          echo "RUNNER_USER=$(id -un)"
          . /etc/os-release
          echo "OS_ID=${ID}"
          echo "OS_VERSION_ID=${VERSION_ID}"
          if sudo -n true 2>/dev/null; then echo "NONINTERACTIVE_SUDO=PASS"; else echo "NONINTERACTIVE_SUDO=NO"; fi
          if systemctl is-active --quiet adguardhome 2>/dev/null || systemctl is-active --quiet AdGuardHome 2>/dev/null; then
            echo "ADGUARD_SERVICE_PRESENT=YES"
          else
            echo "ADGUARD_SERVICE_PRESENT=NO_OR_INACTIVE"
          fi
          python3 - <<'PY'
          import os,random,socket,struct
          name='dns.usesafeweb.com'
          expected='52.157.109.120'
          resolvers=['1.1.1.1','8.8.8.8','9.9.9.9']
          def enc_name(n):
              out=b''
              for p in n.rstrip('.').split('.'):
                  b=p.encode('ascii'); out+=bytes([len(b)])+b
              return out+b'\x00'
          def read_name(pkt,off):
              labels=[]; seen=0; end=None
              while True:
                  if off>=len(pkt): raise ValueError('name bounds')
                  ln=pkt[off]
                  if ln==0:
                      off+=1
                      if end is None: end=off
                      break
                  if ln & 0xC0 == 0xC0:
                      if off+1>=len(pkt): raise ValueError('ptr bounds')
                      ptr=((ln & 0x3F)<<8)|pkt[off+1]
                      if end is None: end=off+2
                      off=ptr; seen+=1
                      if seen>20: raise ValueError('ptr loop')
                      continue
                  off+=1
                  labels.append(pkt[off:off+ln].decode('ascii'))
                  off+=ln
              return '.'.join(labels)+'.', end
          def query(server,qtype):
              qid=random.randrange(0,65536)
              q=struct.pack('!HHHHHH',qid,0x0100,1,0,0,0)+enc_name(name)+struct.pack('!HH',qtype,1)
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(3); s.sendto(q,(server,53)); pkt,_=s.recvfrom(4096); s.close()
              rid,flags,qd,an,ns,ar=struct.unpack('!HHHHHH',pkt[:12])
              if rid!=qid: raise ValueError('id mismatch')
              if flags & 0xF: raise ValueError('rcode '+str(flags & 0xF))
              off=12
              for _ in range(qd):
                  _,off=read_name(pkt,off); off+=4
              vals=[]
              for _ in range(an):
                  _,off=read_name(pkt,off)
                  rtype,rclass,ttl,rdlen=struct.unpack('!HHIH',pkt[off:off+10]); off+=10
                  rstart=off; off+=rdlen
                  if rtype==1 and rdlen==4: vals.append(('A',socket.inet_ntop(socket.AF_INET,pkt[rstart:rstart+4])))
                  elif rtype==28 and rdlen==16: vals.append(('AAAA',socket.inet_ntop(socket.AF_INET6,pkt[rstart:rstart+16])))
                  elif rtype==5:
                      cname,_=read_name(pkt,rstart); vals.append(('CNAME',cname.rstrip('.')))
              return vals
          system=sorted({x[4][0] for x in socket.getaddrinfo(name,None,socket.AF_INET,socket.SOCK_STREAM)})
          print('SYSTEM_A='+','.join(system))
          if system != [expected]: raise SystemExit('system resolver mismatch')
          for r in resolvers:
              allvals=[]
              for qt in (1,28,5): allvals.extend(query(r,qt))
              a=sorted({v for t,v in allvals if t=='A'})
              aaaa=sorted({v for t,v in allvals if t=='AAAA'})
              cn=sorted({v for t,v in allvals if t=='CNAME'})
              print(f'RESOLVER_{r}_A='+','.join(a))
              print(f'RESOLVER_{r}_AAAA='+','.join(aaaa))
              print(f'RESOLVER_{r}_CNAME='+','.join(cn))
              if a != [expected] or aaaa or cn:
                  raise SystemExit('resolver mismatch '+r)
          print('TSK_0441_MULTI_RESOLVER_DNS=PASS')
          PY
