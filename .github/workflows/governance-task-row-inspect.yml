name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 4
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Read-only TSK-0442 TLS preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          MID="$(sha256sum /etc/machine-id | awk '{print $1}')"
          AZ_JSON="$(python3 - <<'PY'
          import json,urllib.request
          req=urllib.request.Request('http://169.254.169.254/metadata/instance/compute?api-version=2021-02-01',headers={'Metadata':'true'})
          with urllib.request.urlopen(req,timeout=3) as r: print(json.dumps(json.load(r)))
          PY
          )"
          AZ_NAME="$(printf '%s' "$AZ_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("name",""))')"
          AZ_LOC="$(printf '%s' "$AZ_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("location",""))')"
          echo "SLOT=${{ matrix.slot }}"
          echo "AZURE_VM_NAME=$AZ_NAME"
          echo "AZURE_LOCATION=$AZ_LOC"
          echo "OS_VERSION_ID=$VERSION_ID"
          if [[ "$MID" != "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2" || "$AZ_NAME" != "adguardvm" || "$AZ_LOC" != "westeurope" ]]; then
            echo "PRODUCTION_GUARD=SKIP_NON_PRODUCTION"
            exit 0
          fi
          echo "PRODUCTION_GUARD=PASS"
          if sudo -n true 2>/dev/null; then echo "NONINTERACTIVE_SUDO=PASS"; else echo "NONINTERACTIVE_SUDO=NO"; exit 1; fi
          for c in openssl curl python3 ss systemctl apt-get; do command -v "$c" >/dev/null && echo "CMD_${c}=YES" || echo "CMD_${c}=NO"; done
          command -v certbot >/dev/null && echo "CERTBOT_PRESENT=YES" || echo "CERTBOT_PRESENT=NO"
          command -v lego >/dev/null && echo "LEGO_PRESENT=YES" || echo "LEGO_PRESENT=NO"
          echo "LISTENERS_BEGIN"
          sudo ss -lntupH | awk '$5 ~ /:(53|80|443|853)$/ {print $1,$5}' | sort -u
          echo "LISTENERS_END"
          if command -v ufw >/dev/null; then
            echo "UFW_BEGIN"
            sudo ufw status | grep -E '(^Status:|(^|[[:space:]])(53|80|443|853)(/|[[:space:]]))' || true
            echo "UFW_END"
          fi
          sudo python3 - <<'PY'
          import os,stat
          try:
              import yaml
          except Exception:
              print('YAML_MODULE=NO'); raise SystemExit(0)
          print('YAML_MODULE=YES')
          p='/opt/AdGuardHome/AdGuardHome.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8')) or {}
          t=d.get('tls') or {}
          safe=['enabled','server_name','force_https','port_https','port_dns_over_tls','port_dns_over_quic','strict_sni_check','allow_unencrypted_doh','certificate_path','private_key_path']
          for k in safe: print('TLS_'+k.upper()+'='+str(t.get(k,'')))
          for k in ['certificate_path','private_key_path']:
              v=t.get(k)
              if v:
                  try:
                      st=os.stat(v); print(k.upper()+'_EXISTS=YES'); print(k.upper()+'_MODE='+oct(stat.S_IMODE(st.st_mode))); print(k.upper()+'_UID='+str(st.st_uid)); print(k.upper()+'_GID='+str(st.st_gid))
                  except FileNotFoundError: print(k.upper()+'_EXISTS=NO')
          print('TLS_INLINE_CERT_PRESENT='+('YES' if bool(t.get('certificate_chain')) else 'NO'))
          print('TLS_INLINE_PRIVATE_KEY_PRESENT='+('YES' if bool(t.get('private_key')) else 'NO'))
          PY
          echo "TSK_0442_PREFLIGHT=PASS"
