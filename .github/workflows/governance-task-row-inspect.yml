name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Reconcile TSK-0512 PASS and recompute L2 AUTO_ALLOWED queue
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv, datetime, json, re, subprocess

          expected_state_blob='c050dda72a0fa684e2efdc444d3d577289ab7d63'
          state_path='CURRENT_STATE.md'
          state=open(state_path,encoding='utf-8').read()
          actual_blob=subprocess.check_output(['git','hash-object',state_path],text=True).strip()
          if actual_blob != expected_state_blob:
              raise SystemExit(f'CURRENT_STATE stale: expected {expected_state_blob}, got {actual_blob}')
          if '`TSK-0512`' in state.split('### PASS',1)[1].split('### TSK-0204 corrected stable state',1)[0]:
              raise SystemExit('TSK-0512 already present in runtime PASS block; manual reconciliation required')

          now=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          state=re.sub(r'\*\*Updated:\*\* [^\n]+', f'**Updated:** {now}  ', state, count=1)

          anchor='- `TSK-0511` — encrypted DNS resolution verified for both accepted supported phone families: Android/native Private DNS/DoT and iPhone/iOS DoH profile, including iPhone Wi-Fi, cellular and removal/recovery — evidence: `TSK_0511_SUPPORTED_DEVICE_VERIFICATION_COMPLETION_EVIDENCE_2026-08-28.md`, blob `ecd959f93ab7dff62aba6529ce66b45d59c3ed27`, publication commit `72c21844059ad1c9ea63992fac41af7428f40906`.\n'
          addition='- `TSK-0512` — baseline filtering and allowed-domain behavior verified on production with fresh synthetic blocked/allowed/exception/rollback regression while privacy/upstream invariants remained intact — evidence: `TSK_0512_FILTER_REGRESSION_EVIDENCE_2026-08-28.md`, blob `cc21f4574a2ca7e721a7da961baef727350af1d3`, publication commit `91dcc6a8b1304c291a706edf6f2ebd014031a8c0`; confirmatory rerun result `TSK_0512_FILTER_REGRESSION_RESULT_2026-08-28.md`, blob `0de3c62c034263f85635d5a304875d2f98c29480`.\n'
          if anchor not in state:
              raise SystemExit('TSK-0511 PASS anchor not found')
          state=state.replace(anchor, anchor+addition, 1)

          section='''### TSK-0512 accepted stable state

`TSK-0512` — verify baseline filtering and allowed-domain behavior: **PASS**.

ACC-0512 requires expected blocked tests to fail safely, allowed tests to resolve, the narrow exception workflow to work, and results to be recorded without participant browsing history. VER-0512/EVD-0512 require the approved procedure against the exact artifact/environment with reproducible target output, date/verifier and deviation disposition.

Fresh production regression evidence `TSK_0512_FILTER_REGRESSION_EVIDENCE_2026-08-28.md`, blob `cc21f4574a2ca7e721a7da961baef727350af1d3`, publication commit `91dcc6a8b1304c291a706edf6f2ebd014031a8c0`, executed on production host `adguardvm` from workflow source commit `217f7172efd52f467cf2bde5555c9bc65130350d` against filter-policy blob `333a4ef8cd34719d66056aa608ab19473f839634` and runtime-state blob `c050dda72a0fa684e2efdc444d3d577289ab7d63`.

The assertion-based target run directly proved: the exact one-list conservative baseline; zero pre-existing user rules and whitelist filters; a randomized reserved `.invalid` synthetic name initially unfiltered; a temporary exact block observed as `FilteredBlackList`; a matching narrow allow exception observed as `NotFilteredWhiteList`; exact pre-test rule restoration; unchanged filter-list state; persisted protection/filtering/default-blocking state; exact Quad9 dns10 upstream; ECS off; query logging off; client-IP anonymisation on; statistics off; and successful post-rollback `example.com` resolution. The successful evidence publication occurred only after rollback assertions completed.

A later self-reporting rerun independently returned the same **PASS** outcome in `TSK_0512_FILTER_REGRESSION_RESULT_2026-08-28.md`, blob `0de3c62c034263f85635d5a304875d2f98c29480`; no contradictory target evidence exists. The temporary write-capable verifier was then restored exactly to its original read-only blob `5ffaf1e1e77273cb77a21afd03c4800a230b45a9`.

Only `example.com` and randomized reserved `.invalid` synthetic names were used; no participant browsing history, raw DNS history, participant/device identity, credential, token or private key was retained. **ACC-0512 is fully satisfied. TSK-0512: PASS.** This bounded PASS does not authorize participant activation or later release/legal gates.

'''
          marker='### External/provider and legal boundaries\n'
          if marker not in state:
              raise SystemExit('external-boundary marker not found')
          state=state.replace(marker, section+marker, 1)

          state=state.replace(
              '- TSK-0442 TLS target-device acceptance, TSK-0443 certificate renewal/expiry controls, TSK-0514 external-network/removal verification, and TSK-0511 per-supported-device verification are satisfied. None of these technical PASS states by themselves authorize participant activation.',
              '- TSK-0442 TLS target-device acceptance, TSK-0443 certificate renewal/expiry controls, TSK-0514 external-network/removal verification, TSK-0511 per-supported-device verification, and TSK-0512 filtering/exception/rollback verification are satisfied. None of these technical PASS states by themselves authorize participant activation.'
          )
          state=state.replace(
              '- Plain DNS 53 remains non-public. TSK-0442 TLS, TSK-0443 certificate renewal/expiry controls, TSK-0514 external-network/removal verification and TSK-0511 supported-device verification are PASS, but broader participant/public readiness remains gated by validation, privacy/legal and activation evidence.',
              '- Plain DNS 53 remains non-public. TSK-0442 TLS, TSK-0443 certificate renewal/expiry controls, TSK-0514 external-network/removal verification, TSK-0511 supported-device verification and TSK-0512 filtering regression are PASS, but broader participant/public readiness remains gated by validation, privacy/legal and activation evidence.'
          )

          # Recompute dependency-ready L2 AUTO_ALLOWED work against the locally reconciled PASS state.
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig')))
          pass_block=state.split('### PASS',1)[1].split('### TSK-0204 corrected stable state',1)[0]
          runtime_pass=set(re.findall(r'`(TSK-\d+)`\s+—',pass_block)); runtime_pass.add('TSK-0011')
          runtime_wait=set(re.findall(r'### WAITING — (TSK-\d+)',state))
          planning_pass={r['Task_ID'].strip() for r in rows if (r.get('Execution_State') or '').strip()=='PASS'}
          satisfied=runtime_pass|planning_pass
          rank={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          ready=[]
          for i,r in enumerate(rows):
              tid=(r.get('Task_ID') or '').strip()
              if not tid or tid in runtime_pass or tid in runtime_wait: continue
              if (r.get('Lifecycle_Stage') or '').strip()!='L2': continue
              if (r.get('Action_Authority') or '').strip()!='AUTO_ALLOWED': continue
              if (r.get('Plan_Status') or '').strip() not in {'PLANNED','ACTIVE'}: continue
              deps=[x.strip() for x in (r.get('Dependencies') or '').split(';') if x.strip()]
              if all(d in satisfied for d in deps): ready.append((i,r,deps))
          ready.sort(key=lambda x:(rank.get((x[1].get('Priority') or '').strip(),9), x[0], x[1]['Task_ID']))

          queue_path='TSK_0512_QUEUE_RECOMPUTE_EVIDENCE_2026-08-28.md'
          q=[
              '# Queue Recompute Evidence after TSK-0512 PASS','',
              '**Date:** 2026-08-28','',
              f'- Pre-mutation CURRENT_STATE blob: `{actual_blob}`',
              f'- Runtime PASS count after local TSK-0512 reconciliation (including TSK-0011 sentinel): `{len(runtime_pass)}`',
              f'- Runtime WAIT: `{",".join(sorted(runtime_wait)) or "none"}`',
              f'- L2 AUTO_ALLOWED dependency-ready count: `{len(ready)}`','',
              '## Dependency-ready tasks',''
          ]
          if not ready:
              q.append('None.')
          else:
              for _,r,deps in ready[:40]:
                  q += [
                      f"### {r.get('Task_ID','')} — {r.get('Title','')}",'',
                      f"- Priority: `{r.get('Priority','')}`",
                      f"- Critical path: `{r.get('Critical_Path','')}`",
                      f"- Plan status: `{r.get('Plan_Status','')}`",
                      f"- WBS execution snapshot: `{r.get('Execution_State','')}`",
                      f"- Dependencies: `{r.get('Dependencies','')}`",
                      f"- Action authority: `{r.get('Action_Authority','')}`",
                      f"- Acceptance: `{r.get('Acceptance_ID','')}` — {r.get('Acceptance_Criteria','')}",
                      f"- Verification: `{r.get('Verification_ID','')}`",
                      f"- Required tools/access: {r.get('Required_Tools_or_Access','')}",
                      f"- Requirement refs: `{r.get('Requirement_Reference','')}`",
                      f"- Interface refs: `{r.get('Interface_Reference','')}`",
                      f"- Risk refs: `{r.get('Risk_Reference','')}`",
                      f"- Trigger: {r.get('Trigger','')}",
                      f"- Preconditions: {r.get('Preconditions','')}",'',
                  ]
          q += ['## Selection note','', 'This calculation proves dependency readiness only. Every candidate still requires current gate/trigger/constraint/interface/platform/authority preflight and direct acceptance evidence before dispatch or PASS.','']
          open(queue_path,'w',encoding='utf-8').write('\n'.join(q))

          tail='## Queue status after current reconciliation\n\n'
          tail+='TSK-0511 and TSK-0512 are runtime PASS with durable direct target evidence. '
          tail+=f'The deterministic WBS dependency-readiness recomputation against the locally reconciled state found **{len(ready)}** L2 `AUTO_ALLOWED` candidate(s).\n\n'
          if ready:
              first=ready[0][1]
              tail+=f"Highest dependency-ready candidate: `{first.get('Task_ID','')}` — {first.get('Title','')}. It is not dispatched or accepted from dependency readiness alone; full gate/constraint/interface/risk/tool preflight is required first.\n\n"
          else:
              tail+='No ordinary L2 `AUTO_ALLOWED` candidate is dependency-ready.\n\n'
          tail+='Current explicit WAITING boundary:\n\n- `TSK-0431` — identify/provide the owner-managed Azure-native backup/restore path required by REQ-0052.\n\n'
          tail+='## Exact next authoritative step\n\n'
          if ready:
              first=ready[0][1]
              tail+=f"Preflight `{first.get('Task_ID','')}` — {first.get('Title','')} against its exact acceptance, gates, trigger, requirements, constraints, interface, risk and available executor. Continue only if all current conditions permit safe `AUTO_ALLOWED` execution. "
          else:
              tail+='No ordinary L2 work may progress until a dependency/gate condition changes. '
          tail+='Separately, TSK-0431 remains WAITING until the owner identifies/provides the Azure-native backup/restore path required by REQ-0052. Do not bypass participant-activation, legal, Azure control-plane, provider, recovery, privacy or validation gates.\n'
          head=state.split('## Queue status after current reconciliation\n',1)[0]
          state=head+tail
          open(state_path,'w',encoding='utf-8').write(state)

          print('PRE_STATE_BLOB='+actual_blob)
          print('RUNTIME_PASS_COUNT_AFTER='+str(len(runtime_pass)))
          print('RUNTIME_WAIT='+','.join(sorted(runtime_wait)))
          print('READY_COUNT='+str(len(ready)))
          for _,r,_ in ready[:10]:
              print('READY='+json.dumps({k:r.get(k,'') for k in ['Task_ID','Title','Priority','Critical_Path','Dependencies','Action_Authority','Acceptance_ID','Acceptance_Criteria','Verification_ID','Requirement_Reference','Interface_Reference','Risk_Reference','Trigger','Preconditions']},sort_keys=True,ensure_ascii=False))
          PY

          git config user.name "UseSafeWeb Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CURRENT_STATE.md TSK_0512_QUEUE_RECOMPUTE_EVIDENCE_2026-08-28.md
          git commit -m "state: mark TSK-0512 PASS and recompute governed queue"
          git push origin HEAD:main
