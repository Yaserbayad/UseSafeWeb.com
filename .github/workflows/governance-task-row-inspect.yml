name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Independent TSK-0228 safeguarding-boundary audit
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv,subprocess
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig')))
          by={r['Task_ID'].strip():r for r in rows if (r.get('Task_ID') or '').strip()}
          t=by['TSK-0228']; p=by['TSK-0219']; pp=by['TSK-0224']
          assert t['Action_Authority'].strip()=='AUTO_ALLOWED'
          assert t['Acceptance_ID'].strip()=='ACC-0228' and t['Dependencies'].strip()=='TSK-0219'
          assert p['Acceptance_ID'].strip()=='ACC-0219' and p['Dependencies'].strip()=='TSK-0224'
          assert pp['Acceptance_ID'].strip()=='ACC-0224' and pp['Execution_State'].strip()=='PASS'
          files={'procedure':'CHILD_SAFETY_ESCALATION_PROCEDURE.md','notice':'PILOT_PRIVACY_NOTICE.md','gate':'VALIDATION_READINESS_GATE.md'}
          blobs={k:subprocess.check_output(['git','hash-object',v],text=True).strip() for k,v in files.items()}
          assert blobs['procedure']=='18c6ac79c3fa5db21c5e591e81fe5b6611cd7bf1'
          assert blobs['notice']=='331f263388dfacfa73b6e9e556277d4230864ce8'
          assert blobs['gate']=='b3b0efd0cc0f40faa1ecab190c7469b8dff12ec1'
          notice=open(files['notice'],encoding='utf-8').read().replace('**',''); gate=open(files['gate'],encoding='utf-8').read(); text=open(files['procedure'],encoding='utf-8').read()
          for s in ['## Parent notice','## Child-readable explanation','promise complete online safety','## Release gate']:
              assert s in notice,'TSK-0219 proof gap '+s
          for s in ['no later than 30 days after that participant\'s follow-up','no later than 90 days after Experiment 1 closes']:
              assert s in gate,'TSK-0224 proof gap '+s
          required=[
            'not an emergency service, safeguarding investigation service, counselling service, or surveillance system',
            'Normal product support handles setup, DNS filtering, false positives, removal, compatibility and service faults',
            'call **999** immediately','children\'s social care team at the child\'s local council','**101** / online police reporting',
            '**NSPCC Helpline: 0808 800 5000**','**Childline: 0800 1111**','**CEOP Safety Centre**',
            'Do not ask for child browsing/domain history','Do not solicit messages, photos, social-media content, location history, contacts, or device contents',
            'not GitHub','The **Project Owner** is the internal escalation authority','emergency direction first, then immediate owner escalation',
            'https://www.gov.uk/report-child-abuse','https://www.gov.uk/report-child-abuse-to-local-council',
            'https://www.nspcc.org.uk/about-us/our-services/nspcc-helpline/','https://www.nspcc.org.uk/about-us/our-services/childline/',
            'https://www.ceop.police.uk/Safety-Centre/Should-I-make-a-report-to-CEOP-YP/Should-I-make-a-report-to-CEOP-concerned-adult/'
          ]
          for s in required: assert s in text,'ACC-0228 gap '+s
          print('TSK_0224_DIRECT_PREDECESSOR_PROOF=PASS')
          print('TSK_0219_DIRECT_PREDECESSOR_PROOF=PASS')
          print('TSK_0228_ACCEPTANCE_CLASSES=4/4')
          print('TSK_0228_ARTIFACT_BLOB='+blobs['procedure'])
          print('TSK_0228_INDEPENDENT_REPOSITORY_AUDIT=PASS')
          PY
