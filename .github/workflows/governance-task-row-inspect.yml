name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Derive current L2 autonomous candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv, json, re
          with open('Plans/Master/WBS/master-wbs.csv', newline='', encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          by_id={r['Task_ID'].strip():r for r in rows if (r.get('Task_ID') or '').strip()}
          state=open('CURRENT_STATE.md',encoding='utf-8').read()
          pass_block=state.split('### PASS',1)[1].split('### TSK-0204 corrected stable state',1)[0]
          runtime_pass=set(re.findall(r'`(TSK-\d+)`\s+—', pass_block))
          runtime_pass.add('TSK-0011')
          runtime_wait=set(re.findall(r'### WAITING — (TSK-\d+)', state))
          print('RUNTIME_PASS='+','.join(sorted(runtime_pass)))
          print('RUNTIME_WAIT='+','.join(sorted(runtime_wait)))

          # Planning PASS can satisfy non-runtime design/exclusion predecessors, but is reported separately.
          planning_pass={r['Task_ID'].strip() for r in rows if (r.get('Execution_State') or '').strip()=='PASS'}
          satisfied=runtime_pass | planning_pass
          print('PLANNING_PASS_COUNT='+str(len(planning_pass)))

          rank={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          candidates=[]
          for r in rows:
              tid=(r.get('Task_ID') or '').strip()
              if not tid or tid in runtime_pass or tid in runtime_wait:
                  continue
              if (r.get('Lifecycle_Stage') or '').strip()!='L2':
                  continue
              if (r.get('Action_Authority') or '').strip()!='AUTO_ALLOWED':
                  continue
              if (r.get('Priority') or '').strip() not in {'CRITICAL','HIGH'}:
                  continue
              if (r.get('Plan_Status') or '').strip() not in {'PLANNED','ACTIVE'}:
                  continue
              deps=[x.strip() for x in (r.get('Dependencies') or '').split(';') if x.strip()]
              missing=[d for d in deps if d not in satisfied]
              candidates.append((rank.get((r.get('Priority') or '').strip(),9), int(re.sub(r'\D','',tid) or 999999), r, deps, missing))
          candidates.sort(key=lambda x:(x[0],x[1]))
          print('L2_AUTO_HIGH_CRITICAL_COUNT='+str(len(candidates)))
          for _,__,r,deps,missing in candidates:
              compact={k:r.get(k,'') for k in ['Task_ID','Title','Priority','Critical_Path','Plan_Status','Execution_State','Dependencies','Trigger','Preconditions','Action_Authority','Acceptance_ID','Acceptance_Criteria','Verification_ID','Required_Tools_or_Access','Requirement_Reference','Interface_Reference','Risk_Reference']}
              compact['Missing_Dependencies']=missing
              compact['Dependency_Ready']=not missing
              print('CANDIDATE='+json.dumps(compact,sort_keys=True,ensure_ascii=False))
          PY
