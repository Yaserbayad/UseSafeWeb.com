name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Print TSK-0514 authority and references
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv,json,pathlib
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig')))
          r=next(x for x in rows if (x.get('Task_ID') or '').strip()=='TSK-0514')
          keys=['Task_ID','Title','Lifecycle_Stage','Priority','Critical_Path','Plan_Status','Execution_State','Dependencies','Trigger','Preconditions','Action_Authority','Acceptance_ID','Acceptance_Criteria','Verification_ID','Required_Tools_or_Access','Requirement_Reference','Interface_Reference','Risk_Reference','Notes']
          print('WBS='+json.dumps({k:r.get(k,'') for k in keys},sort_keys=True,ensure_ascii=False))
          targets=['REQ-0065','REQ-0066','REQ-0069','CON-0023','CON-0029','INT-0017','RSK-0050','ACC-0514','VER-0514','TSK-0514']
          for p in pathlib.Path('Plans/Master').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.md','.yaml','.yml','.csv'}: continue
              try: text=p.read_text(encoding='utf-8-sig')
              except Exception: continue
              lines=text.splitlines(); hits=[i for i,line in enumerate(lines) if any(t in line for t in targets)]
              if not hits: continue
              print('FILE='+str(p))
              emitted=set()
              for i in hits:
                  for j in range(max(0,i-3),min(len(lines),i+4)):
                      if j not in emitted:
                          print(f'{j+1}: {lines[j]}')
                          emitted.add(j)
          PY
