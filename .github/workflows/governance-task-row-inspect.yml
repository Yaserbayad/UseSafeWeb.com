name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        slot: [a, b]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect renewal and alert capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "SLOT=${{ matrix.slot }}"
          echo "RUNNER_NAME=${{ runner.name }}"
          VMID="$(python3 - <<'PY'
          import json,urllib.request
          req=urllib.request.Request('http://169.254.169.254/metadata/instance/compute?api-version=2021-02-01',headers={'Metadata':'true'})
          with urllib.request.urlopen(req,timeout=3) as r: print(json.load(r).get('vmId',''))
          PY
          )"
          echo "AZURE_VM_ID=$VMID"
          if [[ "$VMID" != 'bc7f566f-7231-41fb-9fdd-49cf190fd5e1' ]]; then
            echo 'ROLE=NON_PRODUCTION_SKIP'
            sleep 20
            exit 0
          fi
          echo 'ROLE=PRODUCTION'
          sudo -n true
          command -v certbot || true
          certbot --version 2>&1 || true
          echo 'CERTBOT_TIMER_BEGIN'
          systemctl is-enabled certbot.timer 2>/dev/null || true
          systemctl is-active certbot.timer 2>/dev/null || true
          systemctl cat certbot.timer 2>/dev/null || true
          systemctl cat certbot.service 2>/dev/null || true
          echo 'CERTBOT_TIMER_END'
          echo 'RENEWAL_CONFIG_BEGIN'
          sudo sh -c "grep -R -nE '^(renew_before_expiry|deploy_hook|pre_hook|post_hook)|renew_hook|deploy-hook|post-hook|pre-hook' /etc/letsencrypt/renewal /etc/letsencrypt/renewal-hooks 2>/dev/null || true"
          echo 'RENEWAL_CONFIG_END'
          echo 'ALERT_CAPABILITIES_BEGIN'
          for x in mail mailx sendmail msmtp ssmtp curl logger systemd-cat; do command -v "$x" >/dev/null 2>&1 && echo "BIN_$x=YES" || echo "BIN_$x=NO"; done
          systemctl list-unit-files --type=service --no-pager 2>/dev/null | grep -Ei 'postfix|exim|sendmail|msmtp|mail|prometheus|alert|zabbix|nagios|grafana|healthchecks|uptime' || true
          systemctl list-unit-files --type=timer --no-pager 2>/dev/null | grep -Ei 'cert|renew|expiry|alert|monitor|health' || true
          echo 'ALERT_CAPABILITIES_END'
          echo 'REPO_ALERT_REFS_BEGIN'
          grep -RniE --exclude-dir=.git --exclude='*.lock' --exclude='CURRENT_STATE.md' '(alert|expiry|certificate renewal|certbot|notify|notification|owner email|webhook|healthcheck)' . 2>/dev/null | head -n 200 || true
          echo 'REPO_ALERT_REFS_END'
          echo 'CERT_STATE_BEGIN'
          sudo certbot certificates 2>/dev/null || true
          sudo systemctl status certbot.timer --no-pager 2>/dev/null | head -n 40 || true
          echo 'CERT_STATE_END'
          sleep 20
          echo 'TSK_0443_PREFLIGHT=PASS'
