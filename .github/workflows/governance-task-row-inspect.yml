name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Inspect TSK-0225 and predecessor TSK-0219
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig')))
          by={r['Task_ID'].strip():r for r in rows if (r.get('Task_ID') or '').strip()}
          for tid in ['TSK-0219','TSK-0225']:
              assert tid in by,tid
              print(tid+'='+json.dumps(by[tid],sort_keys=True,ensure_ascii=False))
          graph=open('Plans/Master/RELATIONSHIP_INDEX.yaml',encoding='utf-8').read()
          print('TSK_0219_GRAPH_PRESENT='+str('TSK-0219' in graph).upper())
          print('TSK_0225_GRAPH_PRESENT='+str('TSK-0225' in graph).upper())
          print('TSK_0225_ROW_INSPECTION=PASS')
          PY
