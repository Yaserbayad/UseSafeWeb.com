name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Independent TSK-0168 screener audit
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import subprocess
          p='EXPERIMENT_01_QUALIFICATION_SCREENER.md'
          text=open(p,encoding='utf-8').read()
          blob=subprocess.check_output(['git','hash-object',p],text=True).strip()
          assert blob=='d35d3e0abfc3882d648df3c0c7458e216853b592',blob
          required=[
            'Q1 — Caregiver setup responsibility','Q2 — First-phone life stage','Q3 — Phone timing',
            'Q4 — Platform','Q5 — Willingness to make real appropriate changes','Q6 — Non-surveillance fit',
            "Do not ask for the child's name or exact date of birth.",
            'Do not collect an address, postcode, school or precise location in this screener.',
            'Do not add free-text rejection notes.',
            '`VALIDATION_READINESS_GATE.md` must be PASS before this screener is used with a real England participant.',
            '20–30 qualified England parents/caregivers','Wave A first 10 and Wave B remaining 10–20'
          ]
          for s in required: assert s in text,'missing '+s
          protocol=open('EXPERIMENT_01_CONCIERGE_VALIDATION.md',encoding='utf-8').read()
          for s in ['responsible for setting up the child’s phone','child roughly 10–12','within about 30 days','iPhone or Android','willing to make real appropriate safety-setting changes','not primarily seeking covert surveillance/maximal monitoring']:
              assert s in protocol,'protocol predecessor gap '+s
          # The only output fields must be controlled fields already present in the accepted TSK-0166 schema.
          schema=open('EXPERIMENT_01_PARTICIPANT_RECORD_SCHEMA.md',encoding='utf-8').read()
          outputs=['qualification_result','qualification_reason_code','caregiver_setup_responsibility','child_stage_band','phone_timing_band','device_family','willing_real_changes','non_surveillance_fit']
          for f in outputs: assert '`'+f+'`' in text and '`'+f+'`' in schema,'output mismatch '+f
          print('TSK_0164_DIRECT_PREDECESSOR_PROOF=PASS')
          print('TSK_0168_ACCEPTANCE_ITEM_COUNT=8')
          print('TSK_0168_OUTPUT_SCHEMA_ALIGNMENT=PASS')
          print('TSK_0168_SCREENER_BLOB='+blob)
          print('TSK_0168_INDEPENDENT_AUDIT=PASS')
          PY
