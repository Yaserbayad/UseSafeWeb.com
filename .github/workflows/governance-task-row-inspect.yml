name: Inspect governed task rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/governance-task-row-inspect.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate TSK-0166 predecessor evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv,json,os,re
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig')))
          by={r['Task_ID'].strip():r for r in rows if (r.get('Task_ID') or '').strip()}
          for tid in ['TSK-0164','TSK-0223','TSK-0166']:
              print(tid.replace('-','_')+'_ROW='+json.dumps(by.get(tid),sort_keys=True,ensure_ascii=False))
          ids=set()
          for tid in ['TSK-0164','TSK-0223','TSK-0166']:
              r=by[tid]
              for field in ['Acceptance_ID','Verification_ID','Evidence_ID','Requirement_Reference','Interface_Reference','Risk_Reference']:
                  ids.update(re.findall(r'(?:ACC|VER|EVD|REQ|INT|RSK|CON)-\d+',r.get(field,'') or ''))
              ids.update(re.findall(r'CON-\d+',r.get('Preconditions','') or ''))
          print('REFERENCE_IDS='+','.join(sorted(ids)))
          for root,dirs,files in os.walk('.'):
              if root.startswith('./.git'): continue
              for fn in files:
                  p=os.path.join(root,fn)
                  try:
                      if os.path.getsize(p)>300000: continue
                      text=open(p,encoding='utf-8',errors='ignore').read()
                  except Exception: continue
                  hits=[x for x in ids if x in text]
                  taskhits=[x for x in ['TSK-0164','TSK-0223','TSK-0166'] if x in text]
                  if hits or taskhits:
                      print('MATCH='+p+' IDS='+','.join(sorted(set(hits+taskhits))))
          PY
