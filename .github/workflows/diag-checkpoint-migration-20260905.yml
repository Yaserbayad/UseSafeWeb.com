name: Diagnose checkpoint migration mapping

on:
  push:
    branches:
      - governance/checkpoint-migration-diagnostic-20260905
    paths:
      - .github/workflows/diag-checkpoint-migration-20260905.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Print bounded proof trace for completed candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import csv, subprocess
          from pathlib import Path
          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          rows=[r for r in rows if (r.get('Execution_State') or '').strip().upper()=='PASS' and (r.get('Plan_Status') or '').strip()=='COMPLETED_CANDIDATE']
          print('COUNT='+str(len(rows)))
          for r in rows:
              tid=r['Task_ID'].strip(); ev=(r.get('Evidence_ID') or '').strip(); acc=(r.get('Acceptance_ID') or '').strip(); ver=(r.get('Verification_ID') or '').strip()
              print('TASK|%s|%s|%s|%s|%s|%s|%s' % (tid,acc,ver,ev,(r.get('Action_Authority') or '').strip(),(r.get('Title') or '').replace('|','/'),(r.get('Evidence_Reference') or '').replace('|','/')))
              term=ev or tid
              p=subprocess.run(['git','log','--all','-n','4','--format=%H%x09%ad%x09%s','--date=short','-S',term,'--'],text=True,capture_output=True)
              for ln in p.stdout.splitlines():
                  sha=ln.split('\t',1)[0]
                  print('HIT|%s|TERM=%s|%s' % (tid,term,ln.replace('|','/')))
                  s=subprocess.run(['git','show','--format=','--name-only','--diff-filter=AM',sha],text=True,capture_output=True)
                  paths=[x for x in s.stdout.splitlines() if x][:12]
                  if paths: print('FILES|%s|%s|%s' % (tid,sha,','.join(paths).replace('|','/')))
              # filename search over all history, bounded and unique
              variants=(tid.lower(),tid.lower().replace('-','_'),tid.lower().replace('-',''))
              p=subprocess.run(['git','log','--all','--name-only','--format='],text=True,capture_output=True)
              found=[]
              for path in p.stdout.splitlines():
                  low=path.lower()
                  if path and any(v in low for v in variants) and path not in found: found.append(path)
                  if len(found)>=8: break
              for path in found: print('PATH|%s|%s' % (tid,path.replace('|','/')))
          PY