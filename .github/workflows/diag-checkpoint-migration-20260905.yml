name: Diagnose checkpoint migration mapping

on:
  push:
    branches:
      - governance/checkpoint-migration-diagnostic-20260905
    paths:
      - .github/workflows/diag-checkpoint-migration-20260905.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Independently validate SERIAL LIGHT checkpoint candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE='20e2763c0be2124378e3158ac559aed826bc6765'
          CANDIDATE='c5e9520a3780265a434c57457db86adb2d833571'
          git fetch --no-tags origin main governance/checkpoint-migration-candidate-v2-20260905
          test "$(git rev-parse origin/main)" = "$SOURCE"
          test "$(git rev-parse origin/governance/checkpoint-migration-candidate-v2-20260905)" = "$CANDIDATE"
          test "$(git rev-parse "$SOURCE":CURRENT_STATE.md)" = 'd45c7b1f98ceba6265944aabd970c250dc7be2d2'
          test "$(git rev-parse "$CANDIDATE":CURRENT_STATE.md)" = '74f677cfd1a903463ab2c374ed7e043f67d900f2'
          test "$(git diff --name-only "$SOURCE" "$CANDIDATE")" = 'CURRENT_STATE.md'
          test "$(git rev-list --count "$SOURCE".."$CANDIDATE")" = '1'
          git show "$CANDIDATE":CURRENT_STATE.md > /tmp/candidate.json
          git show "$SOURCE":CURRENT_STATE.md > /tmp/legacy.md
          git show "$SOURCE":Plans/Master/WBS/master-wbs.csv > /tmp/wbs.csv
          git show "$SOURCE":Plans/Master/MANIFEST.yaml > /tmp/manifest.yaml
          python - <<'PY'
          import csv, json, re
          from collections import Counter, deque
          from pathlib import Path

          SOURCE='20e2763c0be2124378e3158ac559aed826bc6765'
          LEGACY_BLOB='d45c7b1f98ceba6265944aabd970c250dc7be2d2'
          CANDIDATE_BLOB='74f677cfd1a903463ab2c374ed7e043f67d900f2'
          ALLOWED_EVIDENCE={'GITHUB_BLOB','GITHUB_COMMIT','TEST_RESULT','EXTERNAL_REFERENCE','HUMAN_APPROVAL','CHECKPOINT_SUMMARY'}
          FORBIDDEN_KEYS={'RUNNING','active_claim','claim_owner','lease','heartbeat','next_work','current_phase','conversation_id','owner','claim','claims'}
          CR0014={'TSK-0631','TSK-0633','TSK-0634','TSK-0635','TSK-0637','TSK-0640'}
          CR0015={'TSK-0630','TSK-0421','TSK-0415','TSK-0416','TSK-0370','TSK-0499','TSK-0242'}
          FIXED_WAIT={'TSK-0243','TSK-0360','TSK-0369','TSK-0455'}

          text=Path('/tmp/candidate.json').read_text(encoding='utf-8')
          cp=json.loads(text)
          rows=list(csv.DictReader(Path('/tmp/wbs.csv').open(encoding='utf-8-sig',newline='')))
          legacy=Path('/tmp/legacy.md').read_text(encoding='utf-8')
          manifest=Path('/tmp/manifest.yaml').read_text(encoding='utf-8')

          assert text == json.dumps(cp, ensure_ascii=False, indent=2) + '\n', 'candidate serialization is not deterministic 2-space JSON + LF'
          assert cp.get('checkpoint_schema')=='serial-light-checkpoint-v1'
          assert cp.get('project_id')=='UseSafeWeb.com'
          assert cp.get('governance_mode')=='SERIAL_LIGHT'
          assert cp.get('checkpoint_revision')==1
          baseline=cp['baseline']; runtime=cp['runtime']
          assert baseline.get('version')==1
          assert runtime.get('project_status')=='ACTIVE'
          assert runtime.get('governance_blocker') is None
          assert isinstance(baseline.get('objectives'),list) and baseline['objectives']
          assert isinstance(baseline.get('policy_rules'),list) and baseline['policy_rules']
          assert isinstance(baseline.get('work_items'),list)
          assert isinstance(runtime.get('items'),list)
          assert len(rows)==641
          assert len(baseline['work_items'])==641
          assert len(runtime['items'])==641

          def walk_keys(value):
              if isinstance(value,dict):
                  for k,v in value.items():
                      yield k
                      yield from walk_keys(v)
              elif isinstance(value,list):
                  for v in value:
                      yield from walk_keys(v)
          bad=sorted({k for k in walk_keys(cp) if k in FORBIDDEN_KEYS or k.upper()=='RUNNING'})
          assert not bad, f'forbidden persistent runtime/governance keys: {bad}'

          ids=[r['Task_ID'].strip() for r in rows]
          assert len(ids)==len(set(ids))==641
          work={x['id']:x for x in baseline['work_items']}
          rt={x['id']:x for x in runtime['items']}
          assert set(work)==set(ids)==set(rt)
          assert [x['id'] for x in baseline['work_items']]==ids, 'baseline work item order differs from canonical WBS'
          assert [x['id'] for x in runtime['items']]==ids, 'runtime item order differs from canonical WBS'

          priority={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          edge_count=0
          indeg={tid:0 for tid in ids}; succ={tid:[] for tid in ids}
          na=[]
          for order,(row,tid) in enumerate(zip(rows,ids),start=1):
              wi=work[tid]
              assert wi['title']==row['Title'].strip(), f'title drift {tid}'
              assert wi['wbs_path']==[tid], f'wbs_path drift {tid}'
              assert wi['order']==order, f'order drift {tid}'
              deps=sorted(set(re.findall(r'TSK-\d{4}',row.get('Dependencies') or '')))
              assert wi['depends_on']==deps, f'dependency drift {tid}'
              edge_count += len(deps); indeg[tid]=len(deps)
              for d in deps:
                  assert d in work and d!=tid
                  succ[d].append(tid)
              acs=wi.get('acceptance_criteria') or []
              assert len(acs)==1, f'expected one current AC {tid}'
              assert acs[0]['id']==row['Acceptance_ID'].strip(), f'AC id drift {tid}'
              plan_status=(row.get('Plan_Status') or '').strip().upper()
              if plan_status=='NOT_APPLICABLE':
                  na.append(tid)
                  c=acs[0]['condition']
                  assert 'NOT_APPLICABLE' in c and 'exclusion' in c.lower(), f'exclusion AC not explicit {tid}'
                  assert 'no behavioral/user evidence is inferred' in c.lower(), f'exclusion evidence semantics not explicit {tid}'
                  assert wi.get('required_for_completion') is False, f'exclusion required for completion {tid}'
              else:
                  assert acs[0]['condition']==row['Acceptance_Criteria'].strip(), f'AC text drift {tid}'
              p=(row.get('Priority') or '').strip().upper()
              if p:
                  assert wi.get('plan_priority')==priority[p], f'priority drift {tid}'
              assert wi.get('execution_context')=='ACTIVE_ONLY'
              assert wi.get('gates')==[]
              assert 'Plans/Master/WBS/master-wbs.csv@'+SOURCE in wi.get('spec_reference','')

          assert edge_count==858, edge_count
          q=deque(sorted(k for k,v in indeg.items() if v==0)); seen=0
          while q:
              x=q.popleft(); seen+=1
              for y in succ[x]:
                  indeg[y]-=1
                  if indeg[y]==0:q.append(y)
          assert seen==641, 'dependency cycle detected'

          counts=Counter(x['status'] for x in runtime['items'])
          assert counts==Counter({'WAITING':419,'PASS':222}), counts
          assert len(na)==39, f'NOT_APPLICABLE count {len(na)}'
          for tid in na:
              r=rt[tid]
              assert r['status']=='PASS', f'NOT_APPLICABLE not PASS {tid}'
              refs=r.get('acceptance_references') or []
              assert len(refs)==1 and refs[0]['ac_id']==work[tid]['acceptance_criteria'][0]['id']
              assert refs[0]['evidence_type'] in {'GITHUB_COMMIT','GITHUB_BLOB'}, f'exclusion evidence type not repository authority {tid}: {refs[0]["evidence_type"]}'
              joined=(refs[0].get('summary','')+' '+refs[0].get('verification_context','')).lower()
              assert 'exclusion' in joined or 'not_applicable' in joined, f'exclusion proof not described {tid}'

          summary_ids=[]
          for tid,r in rt.items():
              status=r['status']
              assert status in {'TODO','WAITING','BLOCKED','PASS'}
              refs=r.get('acceptance_references') or []
              if status=='PASS':
                  ac_ids=[a['id'] for a in work[tid]['acceptance_criteria']]
                  assert len(refs)==len(ac_ids), f'PASS proof count mismatch {tid}'
                  assert sorted(x['ac_id'] for x in refs)==sorted(ac_ids), f'PASS AC proof mismatch {tid}'
                  for ev in refs:
                      assert ev['evidence_type'] in ALLOWED_EVIDENCE, f'invalid evidence type {tid}'
                      assert ev.get('reference') and ev.get('summary'), f'incomplete evidence binding {tid}'
                      if ev['evidence_type']=='CHECKPOINT_SUMMARY': summary_ids.append(tid)
              elif status=='WAITING':
                  w=r.get('wait')
                  assert isinstance(w,dict) and w.get('condition') and w.get('resolution_check'), f'WAITING lacks deterministic check {tid}'
              elif status=='BLOCKED':
                  b=r.get('blocker')
                  assert isinstance(b,dict) and b.get('reason') and b.get('resolution'), f'BLOCKED lacks resolution {tid}'

          assert set(na).isdisjoint(summary_ids), 'scope exclusions may not use CHECKPOINT_SUMMARY'
          # CHECKPOINT_SUMMARY is allowed only for intrinsically analytical/documentary acceptance.
          for tid in summary_ids:
              hay=(work[tid]['title']+' '+work[tid]['acceptance_criteria'][0]['condition']).lower()
              analytical=('go/no-go','decision','review','assess','analysis','analytical','document','freeze','define','inventory','mapping','map ','plan ','planning','baseline','scope','reconcile','audit','priorit','policy','strategy')
              assert any(token in hay for token in analytical), f'CHECKPOINT_SUMMARY used for non-analytical acceptance {tid}'

          for tid in CR0014|CR0015|FIXED_WAIT:
              assert rt[tid]['status']=='WAITING', f'required deferral/wait lost: {tid}'
          assert rt['TSK-0456']['status']=='WAITING' and 'TSK-0455' in work['TSK-0456']['depends_on']
          assert rt['TSK-0457']['status']=='WAITING' and 'TSK-0455' in work['TSK-0457']['depends_on']
          assert rt['TSK-0492']['status']=='WAITING' and 'TSK-0455' in work['TSK-0492']['depends_on']
          t243=rt['TSK-0243']['wait']
          t243_text=' '.join(str(v) for v in t243.values())
          assert '33900198638' in t243_text and '101194904055' in t243_text and 'attempt 4' in t243_text.lower()
          assert 'NOT_DEPLOYED_OR_NOT_EXTERNALLY_ROUTABLE' in t243_text or 'not yet available' in t243_text.lower()

          policies='\n'.join(x.get('text','') for x in baseline['policy_rules'])
          for needle in ['CR-0012','CR-0014','CR-0015','No deployment','live-device/profile/certificate','participant','telemetry','payment','launch','public activation','material action','representation bridge, not a waiver']:
              assert needle.lower() in policies.lower(), f'missing fence/policy marker: {needle}'
          assert baseline.get('gates')==[], 'migration bridge unexpectedly invented gate satisfaction definitions'
          assert runtime.get('gate_satisfactions')==[]
          assert runtime.get('human_constraints')==[]

          for marker in ['OWNER_SINGLE_WORKING_SERVER_RECOVERY_DEFERRAL_CR_0012','OWNER_RELEASE1_LIMITED_TEST_DEFERRALS_CR_0014','OWNER_ADDITIONAL_V1_DEFERRALS_CR_0015']:
              assert marker in manifest, f'current frozen manifest missing {marker}'
          assert '# UseSafeWeb.com — Current Authoritative State' in legacy
          assert '2026-09-04T22:16:38Z' in legacy

          print('VALIDATION=PASS')
          print('SOURCE='+SOURCE)
          print('LEGACY_BLOB='+LEGACY_BLOB)
          print('CANDIDATE_BLOB='+CANDIDATE_BLOB)
          print('WORK_ITEMS=641')
          print('DEPENDENCY_EDGES=858')
          print('RUNTIME_PASS=222')
          print('RUNTIME_WAITING=419')
          print('RUNTIME_TODO=0')
          print('NOT_APPLICABLE_SCOPE_EXCLUSIONS=39')
          print('CHECKPOINT_SUMMARY_COUNT='+str(len(summary_ids)))
          print('CHECKPOINT_SUMMARY_IDS='+','.join(summary_ids))
          print('CR0012_CR0014_CR0015=Preserved')
          print('MATERIAL_ACTION_FENCES=Preserved')
          PY