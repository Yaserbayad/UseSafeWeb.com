name: Diagnose checkpoint migration mapping

on:
  push:
    branches:
      - governance/checkpoint-migration-diagnostic-20260905
    paths:
      - .github/workflows/diag-checkpoint-migration-20260905.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify frozen WBS-only PASS evidence semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import csv
          import re
          from collections import Counter
          from pathlib import Path

          rows = list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='')))
          by_id = {r['Task_ID'].strip(): r for r in rows}
          legacy = Path('CURRENT_STATE.md').read_text(encoding='utf-8')

          heading_re = re.compile(r'^##\s+(TSK-\d{4})\b([^\n]*)$', re.M)
          matches = list(heading_re.finditer(legacy))
          explicit = {}
          for i, m in enumerate(matches):
              tid = m.group(1)
              end = matches[i + 1].start() if i + 1 < len(matches) else len(legacy)
              section = legacy[m.start():end]
              head = m.group(0)
              status = None
              if re.search(r'(?i)\bcurrent accepted stable state\b|\bTARGET ACCEPTANCE PASS\b|\bTARGET ACCEPTANCE COMPLETE\b|\bPASS UNDER\b', head):
                  if re.search(r'(?i)(?:\*\*|`)?PASS(?:\*\*|`)?\b|Runtime state:\s*`?PASS`?', section): status = 'PASS'
              if re.search(r'(?i)\bWAITING\b|\bDEFERRED\b', head): status = 'WAITING'
              if re.search(r'(?i)\bremains\s+`?TODO`?\b|:\s*\*\*TODO\*\*|Runtime state:\s*`?TODO`?', section): status = 'TODO'
              if re.search(r'(?i)\bRuntime state:\s*`?PASS`?\b', section): status = 'PASS'
              if re.search(r'(?i)^`?TSK-\d{4}[^\n]*:\s*\*\*PASS\*\*', section, re.M): status = 'PASS'
              if re.search(r'(?i)^`?TSK-\d{4}[^\n]*:\s*\*\*WAITING(?:\s*/[^*]+)?\*\*', section, re.M): status = 'WAITING'
              if status: explicit[tid] = status

          states = {r['Task_ID'].strip(): (r.get('Execution_State') or '').strip().upper() for r in rows}
          states.update(explicit)
          fixed_wait = {'TSK-0243','TSK-0360','TSK-0369','TSK-0455','TSK-0631','TSK-0633','TSK-0634','TSK-0635','TSK-0637','TSK-0640','TSK-0630','TSK-0421','TSK-0415','TSK-0416','TSK-0370','TSK-0499','TSK-0242'}
          for tid in fixed_wait: states[tid] = 'WAITING'
          states['TSK-0146'] = 'PASS'

          wbs_only = [tid for tid, st in states.items() if st == 'PASS' and explicit.get(tid) != 'PASS']
          print(f'WBS_ONLY_PASS={len(wbs_only)}')
          print('PLAN_STATUS=' + repr(dict(sorted(Counter((by_id[t].get('Plan_Status') or '').strip() for t in wbs_only).items()))))
          print('ACTION_AUTHORITY=' + repr(dict(sorted(Counter((by_id[t].get('Action_Authority') or '').strip() for t in wbs_only).items()))))
          print('LIFECYCLE=' + repr(dict(sorted(Counter((by_id[t].get('Lifecycle') or '').strip() for t in wbs_only).items()))))
          print('LEVEL=' + repr(dict(sorted(Counter((by_id[t].get('Level') or '').strip() for t in wbs_only).items()))))

          exclusion_tokens = re.compile(r'(?i)NOT_APPLICABLE|EXCLUSION|excluded|outside.*scope|not applicable|pre-L8|human validation')
          human_tokens = re.compile(r'(?i)owner instruction|owner override|owner approval|HUMAN_ONLY|HUMAN_APPROVAL_REQUIRED|DEC-0052|CR-0005')
          test_tokens = re.compile(r'(?i)test|verify|validation|calculate|measure|run |execute|delete|recruit|follow-up|monitor')
          doc_tokens = re.compile(r'(?i)define|freeze|select|record|document|create|draft|specify|authorise|decide|review|audit|reconcile|complete phase|publish|exclude|keep|defer')

          buckets = Counter()
          for tid in wbs_only:
              r = by_id[tid]
              acc = (r.get('Acceptance_Criteria') or '').strip()
              ev = (r.get('Evidence_Reference') or '').strip()
              ver = (r.get('Verification_Procedure') or '').strip()
              title = (r.get('Title') or '').strip()
              ps = (r.get('Plan_Status') or '').strip()
              aa = (r.get('Action_Authority') or '').strip()
              joined = ' '.join([title, acc, ev, ver, ps, aa])
              if exclusion_tokens.search(joined): bucket = 'EXCLUSION_OR_NA'
              elif human_tokens.search(joined): bucket = 'HUMAN_DECISION'
              elif test_tokens.search(title + ' ' + acc): bucket = 'EXECUTION_LIKE'
              elif doc_tokens.search(title): bucket = 'DOCUMENTARY'
              else: bucket = 'OTHER'
              buckets[bucket] += 1
              print('ROW|' + '|'.join([
                  tid,
                  bucket,
                  ps.replace('|','/'),
                  aa.replace('|','/'),
                  (r.get('Level') or '').replace('|','/'),
                  (r.get('Lifecycle') or '').replace('|','/'),
                  title.replace('|','/'),
                  acc.replace('|','/').replace('\n',' '),
                  ver.replace('|','/').replace('\n',' '),
                  ev.replace('|','/').replace('\n',' '),
              ]))
          print('BUCKETS=' + repr(dict(sorted(buckets.items()))))
          PY