name: Diagnose checkpoint migration mapping

on:
  push:
    branches:
      - governance/checkpoint-migration-diagnostic-20260905
    paths:
      - .github/workflows/diag-checkpoint-migration-20260905.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Promote exact validated checkpoint blob to main
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE='20e2763c0be2124378e3158ac559aed826bc6765'
          CANDIDATE='c5e9520a3780265a434c57457db86adb2d833571'
          LEGACY_BLOB='d45c7b1f98ceba6265944aabd970c250dc7be2d2'
          CANDIDATE_BLOB='74f677cfd1a903463ab2c374ed7e043f67d900f2'
          git fetch --no-tags origin main governance/checkpoint-migration-candidate-v2-20260905
          test "$(git rev-parse origin/main)" = "$SOURCE"
          test "$(git rev-parse origin/governance/checkpoint-migration-candidate-v2-20260905)" = "$CANDIDATE"
          test "$(git rev-parse "$SOURCE":CURRENT_STATE.md)" = "$LEGACY_BLOB"
          test "$(git rev-parse "$CANDIDATE":CURRENT_STATE.md)" = "$CANDIDATE_BLOB"
          test "$(git diff --name-only "$SOURCE" "$CANDIDATE")" = 'CURRENT_STATE.md'
          git checkout -B main origin/main
          git checkout "$CANDIDATE" -- CURRENT_STATE.md
          test "$(git diff --name-only)" = 'CURRENT_STATE.md'
          test "$(git hash-object CURRENT_STATE.md)" = "$CANDIDATE_BLOB"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('CURRENT_STATE.md')
          cp=json.loads(p.read_text(encoding='utf-8'))
          assert cp['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert cp['project_id']=='UseSafeWeb.com'
          assert cp['governance_mode']=='SERIAL_LIGHT'
          assert cp['checkpoint_revision']==1
          assert cp['baseline']['version']==1
          assert cp['runtime']['project_status']=='ACTIVE'
          assert len(cp['baseline']['work_items'])==641
          assert len(cp['runtime']['items'])==641
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- CURRENT_STATE.md
          git commit -m 'governance: publish validated SERIAL LIGHT checkpoint migration'
          NEW_COMMIT="$(git rev-parse HEAD)"
          test "$(git diff-tree --no-commit-id --name-only -r "$NEW_COMMIT")" = 'CURRENT_STATE.md'
          test "$(git rev-parse "$NEW_COMMIT":CURRENT_STATE.md)" = "$CANDIDATE_BLOB"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$SOURCE"
          git push origin HEAD:main
          echo "PROMOTION=PASS"
          echo "NEW_MAIN=$NEW_COMMIT"
          echo "CHECKPOINT_BLOB=$CANDIDATE_BLOB"