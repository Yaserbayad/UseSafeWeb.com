name: Diagnose checkpoint migration mapping

on:
  push:
    branches:
      - governance/checkpoint-migration-diagnostic-20260905
    paths:
      - .github/workflows/diag-checkpoint-migration-20260905.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Generate evidence-fit candidate v2
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/generate-checkpoint-migration-candidate-20260905.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          block = source.split(marker, 1)[1]
          lines = block.splitlines()
          script = '\n'.join((line[10:] if line else '') for line in lines) + '\n'

          replacements = {
              "CANDIDATE='governance/checkpoint-migration-candidate-20260905'": "CANDIDATE='governance/checkpoint-migration-candidate-v2-20260905'",
              '357c35318f8b2698c2ebe44be3ea67cc60e51213': '357c5e1be3b455e7efddd329d6a2468e3125b502',
              'e919d8654ac37bd1f46febb809936b2e186472e9': 'da35db0fe16009dfb5ce0e24caab05d6d02c84ed',
              '00ead35d2e8a2aa55358c0a14f437f208860cc8c': '5010ac13c7cbb41817d0b3753633c742d777e241',
              "forbidden = ['\"RUNNING\"', 'active_claim', 'claim_owner', 'lease', 'heartbeat', 'next_work', 'current_phase', 'conversation_id']": "forbidden = ['\"RUNNING\"', '\"active_claim\"', '\"claim_owner\"', '\"lease\"', '\"heartbeat\"', '\"next_work\"', '\"current_phase\"', '\"conversation_id\"']",
              "explicit = {}\n": "explicit = {}\nexplicit_sections = {}\n",
              "            explicit[tid] = status\n": "            explicit[tid] = status\n            explicit_sections[tid] = section\n",
              "{'id': ac_id, 'condition': row['Acceptance_Criteria'].strip()}": "{'id': ac_id, 'condition': effective_ac_condition(tid, row)}",
          }
          for old, new in replacements.items():
              if old not in script:
                  raise SystemExit(f'expected generator text not found: {old[:90]}')
              script = script.replace(old, new)

          insert_before = 'work_items = []\nruntime_items = []\n'
          helper = r'''FREEZE_AUDIT_BLOB = '25047283940ff4a02cbbdd640e262adf65ae033d'
FREEZE_PUBLICATION_COMMIT = '4f72c66e23fefad0e83eb78f4bba81f6d76d428d'
CURRENT_PLAN_VALIDATION_RUN = '33919215443'
CURRENT_PLAN_VALIDATION_JOB = '101173407414'

def effective_ac_condition(tid, row):
    if (row.get('Plan_Status') or '').strip().upper() == 'NOT_APPLICABLE':
        return (f'Current owner-frozen UseSafeWeb authority records {tid} NOT_APPLICABLE + PASS as an exclusion record. '
                'The original behavioral/user acceptance is inactive for the current scope; no behavioral/user evidence is inferred. '
                'This exclusion remains valid only while the controlling frozen scope/decision remains unchanged.')
    return row['Acceptance_Criteria'].strip()

def explicit_pass_binding(tid, row):
    section = explicit_sections.get(tid, '')
    lines = [ln.strip() for ln in section.splitlines() if ln.strip()]
    run_line = next((ln for ln in lines if re.search(r'(?i)\b(?:run|job|workflow|verification)\b', ln) and re.search(r'\b\d{8,12}\b', ln) and re.search(r'(?i)\b(?:PASS|SUCCESS|passed|successful)\b', ln)), None)
    if run_line:
        return ('TEST_RESULT', f'{legacy_ref}#{tid}; {run_line[:700]}',
                f'Current runtime PASS for {tid} is preserved from the immutable legacy checkpoint, which records executed verification/run evidence.')
    blob_match = re.search(r'(?i)\bblob\b[^\n]{0,160}\b([0-9a-f]{40})\b|\b([0-9a-f]{40})\b[^\n]{0,160}\bblob\b', section)
    if blob_match:
        sha = blob_match.group(1) or blob_match.group(2)
        return ('GITHUB_BLOB', f'Yaserbayad/UseSafeWeb.com immutable blob {sha}; recorded at {legacy_ref}#{tid}',
                f'Current runtime PASS for {tid} is preserved from its immutable artifact proof recorded in the legacy checkpoint.')
    human_line = next((ln for ln in lines if re.search(r'(?i)\b(?:owner|human)\b', ln) and re.search(r'(?i)\b(?:approval|approved|authority|decision|authorized|authorised)\b', ln)), None)
    if human_line:
        return ('HUMAN_APPROVAL', f'{legacy_ref}#{tid}; {human_line[:700]}',
                f'Current runtime PASS for {tid} depends on an explicit owner/human authority record preserved in the immutable legacy checkpoint.')
    commit_match = re.search(r'(?i)\b(?:commit|head|source)\b[^\n]{0,160}\b([0-9a-f]{40})\b|\b([0-9a-f]{40})\b[^\n]{0,160}\b(?:commit|head|source)\b', section)
    if commit_match:
        sha = commit_match.group(1) or commit_match.group(2)
        return ('GITHUB_COMMIT', f'Yaserbayad/UseSafeWeb.com commit {sha}; recorded at {legacy_ref}#{tid}',
                f'Current runtime PASS for {tid} is preserved from immutable repository proof recorded in the legacy checkpoint.')
    raise SystemExit(f'No fit durable proof classification for explicit current PASS {tid}')

def historical_pass_binding(tid, row):
    ps = (row.get('Plan_Status') or '').strip().upper()
    if ps == 'NOT_APPLICABLE':
        return ('GITHUB_BLOB',
                f'Yaserbayad/UseSafeWeb.com {wbs_ref}#{tid}; legacy authority {legacy_ref}',
                f'{tid} is preserved as the current owner-frozen NOT_APPLICABLE + PASS exclusion record; this does not assert the superseded behavioral/user acceptance.')
    if tid in {'TSK-0015', 'TSK-0515'}:
        return ('TEST_RESULT',
                f'Yaserbayad/UseSafeWeb.com GitHub Actions run {CURRENT_PLAN_VALIDATION_RUN} job {CURRENT_PLAN_VALIDATION_JOB}; current canonical Master Plan validation PASS',
                f'Current deterministic planning-system validation re-proves the structural/automated-check acceptance for {tid}.')
    if tid == 'TSK-0014':
        return ('GITHUB_BLOB',
                f'Yaserbayad/UseSafeWeb.com blob {FREEZE_AUDIT_BLOB} path Plans/Master/Governance/SOURCE_PLAN_FREEZE_AUDIT.md; current legacy checkpoint also records later adversarial semantic validation',
                'The frozen adversarial-completeness review artifact records CC-16 and the independent adversarial validation pass; later current-state audits preserve/revalidate the corrected modular system.')
    return ('GITHUB_BLOB',
            f'Yaserbayad/UseSafeWeb.com WBS blob {WBS_BLOB} row {tid}; freeze-audit blob {FREEZE_AUDIT_BLOB}; publication commit {FREEZE_PUBLICATION_COMMIT}',
            f'Historical PASS for {tid} is preserved from the immutable owner-frozen pre-SERIAL-LIGHT acceptance record. The freeze audit explicitly states historical evidence gaps remained WAITING and candidate planning artifacts passed only deterministic/current-file criteria; migration does not fabricate a new execution result.')

'''
          if insert_before not in script:
              raise SystemExit('work item insertion point not found')
          script = script.replace(insert_before, helper + insert_before)

          pattern = re.compile(r"    if status == 'PASS':\n.*?    elif status == 'WAITING':", re.S)
          replacement = r'''    if status == 'PASS':
        if explicit.get(tid) == 'PASS':
            evidence_type, proof_ref, proof_summary = explicit_pass_binding(tid, row)
        else:
            evidence_type, proof_ref, proof_summary = historical_pass_binding(tid, row)
        ev = (row.get('Evidence_Reference') or '').strip()
        verification_context = f'Migration source {SOURCE}; legacy checkpoint blob {LEGACY_BLOB}; WBS blob {WBS_BLOB}.'
        if ev:
            verification_context += f' WBS Evidence_Reference: {ev}'
        rt['acceptance_references'] = [
            {
                'ac_id': ac_id,
                'evidence_type': evidence_type,
                'reference': proof_ref,
                'summary': proof_summary,
                'verification_context': verification_context,
            }
        ]
    elif status == 'WAITING':'''
          script, n = pattern.subn(replacement, script, count=1)
          if n != 1:
              raise SystemExit(f'PASS evidence block replacement count={n}')

          # Strengthen candidate validation: no generic checkpoint self-certification is allowed for migrated PASS.
          needle = "if runtime_items[ids.index('TSK-0146')]['status'] != 'PASS':\n    raise SystemExit('TSK-0146 PASS lost')\n"
          extra = r'''if any(ref['evidence_type'] == 'CHECKPOINT_SUMMARY' for rt in runtime_items for ref in rt['acceptance_references']):
    raise SystemExit('CHECKPOINT_SUMMARY is not permitted for migrated PASS proof')
allowed_ev = {'GITHUB_BLOB','GITHUB_COMMIT','TEST_RESULT','EXTERNAL_REFERENCE','HUMAN_APPROVAL','CHECKPOINT_SUMMARY'}
for rt in runtime_items:
    for ref in rt['acceptance_references']:
        if ref['evidence_type'] not in allowed_ev:
            raise SystemExit(f'unsupported evidence type for {rt["id"]}')
        if rt['status'] == 'PASS' and ref['evidence_type'] == 'TEST_RESULT' and not re.search(r'\b\d{8,12}\b', ref['reference']):
            raise SystemExit(f'TEST_RESULT without durable run identifier for {rt["id"]}')
print('PASS_EVIDENCE_TYPES=' + repr(dict(sorted(Counter(ref['evidence_type'] for rt in runtime_items for ref in rt['acceptance_references']).items()))))
print('NOT_APPLICABLE_EFFECTIVE_ACS=' + str(sum(1 for w,r in zip(work_items,rows) if (r.get('Plan_Status') or '').strip().upper() == 'NOT_APPLICABLE' and 'NOT_APPLICABLE + PASS' in w['acceptance_criteria'][0]['condition'])))
'''
          if needle not in script:
              raise SystemExit('validation insertion point not found')
          script = script.replace(needle, needle + extra)

          Path('/tmp/generate-checkpoint-candidate-v2.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/generate-checkpoint-candidate-v2.sh