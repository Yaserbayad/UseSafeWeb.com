name: Diagnose checkpoint migration mapping

on:
  push:
    branches:
      - governance/checkpoint-migration-diagnostic-20260905
    paths:
      - .github/workflows/diag-checkpoint-migration-20260905.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trace completed-candidate PASS evidence through history
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import csv
          import re
          import subprocess
          from pathlib import Path

          rows = list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='')))
          by_id = {r['Task_ID'].strip(): r for r in rows}
          candidates = [r for r in rows if (r.get('Execution_State') or '').strip().upper() == 'PASS' and (r.get('Plan_Status') or '').strip() == 'COMPLETED_CANDIDATE']
          print(f'COMPLETED_CANDIDATE_COUNT={len(candidates)}')
          for r in candidates:
              tid = r['Task_ID'].strip()
              print('CANDIDATE|' + '|'.join([
                  tid,
                  (r.get('Title') or '').replace('|','/'),
                  (r.get('Acceptance_ID') or '').replace('|','/'),
                  (r.get('Acceptance_Criteria') or '').replace('|','/').replace('\n',' '),
                  (r.get('Verification_ID') or '').replace('|','/'),
                  (r.get('Verification_Procedure') or '').replace('|','/').replace('\n',' '),
                  (r.get('Evidence_ID') or '').replace('|','/'),
                  (r.get('Evidence_Reference') or '').replace('|','/').replace('\n',' '),
                  (r.get('Action_Authority') or '').replace('|','/'),
              ]))

              terms = [tid, (r.get('Acceptance_ID') or '').strip(), (r.get('Verification_ID') or '').strip(), (r.get('Evidence_ID') or '').strip()]
              seen = set()
              for term in [t for t in terms if t]:
                  proc = subprocess.run(['git','log','--all','--format=%H%x09%ad%x09%s','--date=iso-strict','-S',term,'--'], text=True, capture_output=True, check=False)
                  lines = [line for line in proc.stdout.splitlines() if line.strip()][:12]
                  for line in lines:
                      key = (term, line)
                      if key not in seen:
                          seen.add(key)
                          print(f'HISTORY|{tid}|TERM={term}|{line.replace("|","/")}')

              # Locate paths in full history whose names contain the task id (dash/underscore variants).
              variants = {tid.lower(), tid.lower().replace('-','_'), tid.lower().replace('-','')}
              proc = subprocess.run(['git','log','--all','--name-only','--format='], text=True, capture_output=True, check=False)
              paths = []
              for path in proc.stdout.splitlines():
                  low = path.lower()
                  if any(v in low for v in variants) and path not in paths:
                      paths.append(path)
              for path in paths[:40]:
                  print(f'PATH|{tid}|{path.replace("|","/")}')

              # Search tracked current files for the identifiers too.
              grep_terms = [t for t in terms if t]
              for term in grep_terms:
                  proc = subprocess.run(['git','grep','-n','-I','--full-name','-F',term,'HEAD','--'], text=True, capture_output=True, check=False)
                  for line in proc.stdout.splitlines()[:30]:
                      print(f'GREP|{tid}|TERM={term}|{line.replace("|","/")}')
          PY