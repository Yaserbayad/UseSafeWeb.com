name: Diagnose checkpoint migration mapping

on:
  push:
    branches:
      - governance/checkpoint-migration-diagnostic-20260905
    paths:
      - .github/workflows/diag-checkpoint-migration-20260905.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Generate and validate checkpoint migration candidate v2
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/scripts/generate_checkpoint_migration_v2.py').read_text(encoding='utf-8')
          old='"            explicit[tid] = status\\n": "            explicit[tid] = status\\n            explicit_sections[tid] = section\\n",'
          new='"        explicit[tid] = status\\n": "        explicit[tid] = status\\n        explicit_sections[tid] = section\\n",'
          if old not in s: raise SystemExit('transformer indentation patch target missing')
          Path('/tmp/generate_checkpoint_migration_v2.py').write_text(s.replace(old,new),encoding='utf-8')
          PY
          python /tmp/generate_checkpoint_migration_v2.py