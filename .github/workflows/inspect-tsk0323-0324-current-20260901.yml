name: Inspect current TSK-0323 and TSK-0324
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/inspect_tsk0323_0324_current_20260901.py'
      - '.github/workflows/inspect-tsk0323-0324-current-20260901.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect current predecessor authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/inspect_tsk0323_0324_current_20260901.py
          git diff --check
          test -z "$(git status --porcelain)"
