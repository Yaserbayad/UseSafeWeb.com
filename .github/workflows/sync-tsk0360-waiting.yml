name: Sync TSK-0360 WAITING

on:
  push:
    branches:
      - runtime/tsk0360-waiting-20260904
    paths:
      - .github/workflows/sync-tsk0360-waiting.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: runtime/tsk0360-waiting-20260904
          fetch-depth: 0
      - name: Persist exact TSK-0360 WAITING boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 38acee6500d21aa55856ff794306a8151fd294cd)" = "38acee6500d21aa55856ff794306a8151fd294cd"
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          p=Path('CURRENT_STATE.md')
          text=p.read_text(encoding='utf-8')
          marker='## TSK-0360 current accepted stable state — 2026-09-04 — SUPPORTED-DEVICE/TARGET EVIDENCE WAITING'
          if marker in text:
              raise SystemExit('TSK-0360 WAITING already recorded; refusing replay')
          if '`TSK-0360` remains TODO' not in text and '`TSK-0360` remains **TODO**' not in text:
              raise SystemExit('current checkpoint does not prove TSK-0360 TODO; refusing mutation')
          section='''\n\n## TSK-0360 current accepted stable state — 2026-09-04 — SUPPORTED-DEVICE/TARGET EVIDENCE WAITING\n\n`TSK-0360 — Implement safe generation/delivery of supported configuration profiles or endpoint instructions without exposing admin secrets`: **WAITING** under current `ACC-0360 / VER-0360 / EVD-0360`; the task is not PASS.\n\n- Current authority/eligibility was revalidated from canonical main after CR-0015: L6 / HIGH / A3 / `AUTO_ALLOWED`; hard predecessors `TSK-0358` and `TSK-0317` are durable PASS and `LG-07` is durable PASS.\n- Existing source work is preserved and was not redundantly replayed: PR #61 provides the fail-closed iPhone DoH profile generator; PR #75 provides disabled-by-default, exact-SHA-256-gated profile delivery. Existing clean-main/source regressions remain accepted evidence only.\n- Remaining acceptance cannot be established by repository/CI repetition. `VER-0360` requires supported-device/target observations including actual supported-iPhone install, verification, remove/revoke/reinstall behavior, integrity/distribution behavior, applicable privacy/rate-abuse controls, and supported-platform validation.\n- **Deterministic WAITING condition:** resume TSK-0360 only when an authorized supported iPhone/device test target and the required target/profile-delivery access are available so the remaining functional, negative, configuration, security/privacy and rollback checks can be performed against the exact intended release artifact. Any real profile distribution/install remains subject to the existing material-action fence and must not be inferred from this state change.\n- No deployment, profile distribution/install, certificate action, participant processing, telemetry activation, payment, production/public activation, market activation or launch action was performed or authorized by this synchronization.\n\n### Queue effect\n\nDo not select TSK-0360 again until the deterministic WAITING condition is observed as satisfied. `TSK-0399` remains dependency-blocked while TSK-0360 is non-PASS. Recompute the independent governed frontier immediately after canonical publication/read-back.\n'''
          lines=text.splitlines()
          stamp=datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          for i,line in enumerate(lines):
              if line.startswith('**Updated:**'):
                  lines[i]=f'**Updated:** {stamp}'
                  break
          else:
              raise SystemExit('Updated line missing')
          p.write_text('\n'.join(lines).rstrip()+section+'\n',encoding='utf-8')
          PY
          grep -F 'TSK-0360 current accepted stable state' CURRENT_STATE.md
          grep -F 'Deterministic WAITING condition' CURRENT_STATE.md | tail -n 1
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'Record TSK-0360 supported-device evidence WAITING'
          git push origin HEAD:runtime/tsk0360-waiting-20260904
