name: Stage TSK-0431 recovery scripts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-tsk0431-recovery-scripts.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Extract reviewed workflow bodies into versioned scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/adguard-clean-recovery-drill.yml').read_text()

          def extract(step_name, end_marker):
              start=src.index('      - name: '+step_name)
              run=src.index('        run: |\n',start)+len('        run: |\n')
              end=src.index(end_marker,run)
              block=src[run:end]
              out=[]
              for line in block.splitlines(True):
                  if line.strip():
                      assert line.startswith('          '), repr(line)
                      out.append(line[10:])
                  else:
                      out.append('\n')
              return ''.join(out)

          runtime=extract('Timed clean-server rebuild and acceptance','\n      - name: Publish privacy-safe drill evidence')
          publish=extract('Publish privacy-safe drill evidence','\n\n  confirm:')
          Path('infrastructure/adguard-server/clean-recovery-drill-runtime.sh').write_text('#!/usr/bin/env bash\n'+runtime)
          Path('infrastructure/adguard-server/publish-recovery-drill-evidence.sh').write_text('#!/usr/bin/env bash\n'+publish)
          PY
          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add infrastructure/adguard-server/clean-recovery-drill-runtime.sh infrastructure/adguard-server/publish-recovery-drill-evidence.sh
          git commit -m 'governance: stage TSK-0431 recovery drill scripts'
          git push origin HEAD:main
