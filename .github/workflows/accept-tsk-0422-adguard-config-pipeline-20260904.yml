name: Accept TSK-0422 AdGuard configuration pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-tsk-0422-adguard-config-pipeline-20260904.yml'

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify target identity, dependency evidence and source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${RUNNER_OS}" == "Linux" ]]
          [[ "${RUNNER_ARCH}" == "X64" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          sudo -n true
          . /etc/os-release
          [[ "${ID}" == "ubuntu" ]]
          [[ "${VERSION_ID}" == "24.04" ]]
          grep -Fq '## TSK-0451 current accepted stable state — 2026-09-04' CURRENT_STATE.md
          grep -Fq '`TSK-0451' CURRENT_STATE.md
          grep -Fq ': **PASS** under current `ACC-0451 / VER-0451 / EVD-0451`.' CURRENT_STATE.md
          grep -Fq 'CR-0012' Plans/Master/Registers/EXCEPTIONS_CHANGE_CONTROLS.md
          echo 'TARGET_RUNNER=adguardvm'
          echo 'DEPENDENCY_TSK_0451=PASS'
          echo 'CR_0012_PRESERVED=PASS'

      - name: Apply versioned approved configuration pipeline
        shell: bash
        run: |
          set -Eeuo pipefail
          script='infrastructure/adguard-server/tsk-0422-adguard-config-pipeline.sh'
          approved='infrastructure/adguard-server/approved-adguard-config-v1.json'
          test -f "${script}"
          test -f "${approved}"
          bash -n "${script}"
          sudo bash "${script}" --apply | tee /tmp/tsk-0422-apply.txt
          grep -Fq 'ACC_0422=PASS' /tmp/tsk-0422-apply.txt
          grep -Fq 'VER_0422=PASS' /tmp/tsk-0422-apply.txt
          grep -Fq 'EVD_0422_SANITIZED_STATUS=PASS' /tmp/tsk-0422-apply.txt
          grep -Fq 'NEGATIVE_SELF_TEST=PASS' /tmp/tsk-0422-apply.txt
          grep -Fq 'NORMALIZATION_SELF_TEST=PASS' /tmp/tsk-0422-apply.txt
          grep -Fq 'PERSISTED_CONFIG_MATCH=PASS' /tmp/tsk-0422-apply.txt
          grep -Fq 'RUNTIME_APPROVED_CONFIG=PASS' /tmp/tsk-0422-apply.txt
          grep -Fq 'SYNTHETIC_LOOPBACK_DNS=PASS' /tmp/tsk-0422-apply.txt
          printf 'SOURCE_COMMIT=%s\n' "${GITHUB_SHA}" >> /tmp/tsk-0422-apply.txt
          printf 'SOURCE_SCRIPT_SHA256=%s\n' "$(sha256sum "${script}" | awk '{print $1}')" >> /tmp/tsk-0422-apply.txt
          printf 'APPROVED_ARTIFACT_SHA256=%s\n' "$(sha256sum "${approved}" | awk '{print $1}')" >> /tmp/tsk-0422-apply.txt
          echo 'APPLY_JOB=PASS' >> /tmp/tsk-0422-apply.txt

      - name: Upload sanitized apply evidence
        uses: actions/upload-artifact@v4
        with:
          name: tsk-0422-apply
          path: /tmp/tsk-0422-apply.txt
          if-no-files-found: error
          retention-days: 7

  independent-verify:
    needs: apply
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Independently verify VER-0422 on target
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          sudo -n true
          script='infrastructure/adguard-server/tsk-0422-adguard-config-pipeline.sh'
          approved='infrastructure/adguard-server/approved-adguard-config-v1.json'
          sudo bash "${script}" --verify | tee /tmp/tsk-0422-verify.txt
          grep -Fq 'APPROVED_ARTIFACT_INVARIANTS=PASS' /tmp/tsk-0422-verify.txt
          grep -Fq 'NEGATIVE_QUERY_LOGGING=REJECTED' /tmp/tsk-0422-verify.txt
          grep -Fq 'NEGATIVE_ECS=REJECTED' /tmp/tsk-0422-verify.txt
          grep -Fq 'NEGATIVE_WRONG_UPSTREAM=REJECTED' /tmp/tsk-0422-verify.txt
          grep -Fq 'NEGATIVE_UNAPPROVED_FILTER_PROCESSOR=REJECTED' /tmp/tsk-0422-verify.txt
          grep -Fq 'NEGATIVE_SELF_TEST=PASS' /tmp/tsk-0422-verify.txt
          grep -Fq 'NORMALIZATION_SELF_TEST=PASS' /tmp/tsk-0422-verify.txt
          grep -Fq 'PERSISTED_CONFIG_MATCH=PASS' /tmp/tsk-0422-verify.txt
          grep -Fq 'RUNTIME_APPROVED_CONFIG=PASS' /tmp/tsk-0422-verify.txt
          grep -Fq 'SYNTHETIC_LOOPBACK_DNS=PASS' /tmp/tsk-0422-verify.txt
          grep -Fq 'secrets remain outside versioned approved artifact and sanitized evidence' /tmp/tsk-0422-verify.txt
          grep -Fq 'rollback guard staged candidate plus root-only backup restore-on-failure is active' /tmp/tsk-0422-verify.txt
          grep -Fq 'ACC_0422=PASS' /tmp/tsk-0422-verify.txt
          grep -Fq 'VER_0422=PASS' /tmp/tsk-0422-verify.txt
          printf 'SOURCE_COMMIT=%s\n' "${GITHUB_SHA}" >> /tmp/tsk-0422-verify.txt
          printf 'SOURCE_SCRIPT_SHA256=%s\n' "$(sha256sum "${script}" | awk '{print $1}')" >> /tmp/tsk-0422-verify.txt
          printf 'APPROVED_ARTIFACT_SHA256=%s\n' "$(sha256sum "${approved}" | awk '{print $1}')" >> /tmp/tsk-0422-verify.txt
          echo 'PRIVACY=PASS secrets=not_emitted raw_query_data=not_emitted client_identifiers=not_emitted' >> /tmp/tsk-0422-verify.txt
          echo 'INDEPENDENT_VERIFY=PASS' >> /tmp/tsk-0422-verify.txt

      - name: Upload sanitized independent evidence
        uses: actions/upload-artifact@v4
        with:
          name: tsk-0422-verify
          path: /tmp/tsk-0422-verify.txt
          if-no-files-found: error
          retention-days: 7

  persist:
    needs: independent-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Download sanitized evidence
        uses: actions/download-artifact@v4
        with:
          pattern: tsk-0422-*
          path: ${{ runner.temp }}/tsk-0422-evidence
          merge-multiple: true

      - name: Verify evidence, persist EVD-0422 and synchronize runtime
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "${SOURCE_COMMIT}" ]]
          [[ "$(git rev-parse origin/main)" == "${SOURCE_COMMIT}" ]]

          apply="${RUNNER_TEMP}/tsk-0422-evidence/tsk-0422-apply.txt"
          verify="${RUNNER_TEMP}/tsk-0422-evidence/tsk-0422-verify.txt"
          test -f "${apply}"
          test -f "${verify}"
          grep -Fq 'APPLY_JOB=PASS' "${apply}"
          grep -Fq 'ACC_0422=PASS' "${verify}"
          grep -Fq 'VER_0422=PASS' "${verify}"
          grep -Fq 'INDEPENDENT_VERIFY=PASS' "${verify}"
          grep -Fq 'PRIVACY=PASS secrets=not_emitted raw_query_data=not_emitted client_identifiers=not_emitted' "${verify}"

          script='infrastructure/adguard-server/tsk-0422-adguard-config-pipeline.sh'
          approved='infrastructure/adguard-server/approved-adguard-config-v1.json'
          evidence_file='TSK_0422_ADGUARD_CONFIGURATION_PIPELINE_EVIDENCE_2026-09-04.md'
          script_blob="$(git hash-object "${script}")"
          approved_blob="$(git hash-object "${approved}")"
          script_sha256="$(sha256sum "${script}" | awk '{print $1}')"
          approved_sha256="$(sha256sum "${approved}" | awk '{print $1}')"
          apply_sha256="$(sha256sum "${apply}" | awk '{print $1}')"
          verify_sha256="$(sha256sum "${verify}" | awk '{print $1}')"
          change_count="$(grep -m1 '^SANITIZED_CHANGE_COUNT=' "${apply}" | cut -d= -f2-)"
          changed_paths="$(grep -m1 '^SANITIZED_CHANGED_PATHS=' "${apply}" | cut -d= -f2-)"
          [[ "${change_count}" =~ ^[0-9]+$ ]]
          [[ -n "${changed_paths}" ]]

          cat > "${evidence_file}" <<EVIDENCE
          # TSK-0422 AdGuard configuration pipeline evidence

          **Date:** 2026-09-04
          **Task:** TSK-0422 — Implement versioned AdGuard and DNS service configuration pipeline
          **Acceptance:** ACC-0422
          **Verification:** VER-0422
          **Evidence:** EVD-0422
          **Source commit:** \`${SOURCE_COMMIT}\`
          **Pipeline blob:** \`${script_blob}\`
          **Pipeline SHA-256:** \`${script_sha256}\`
          **Approved configuration blob:** \`${approved_blob}\`
          **Approved configuration SHA-256:** \`${approved_sha256}\`
          **GitHub Actions run / attempt:** \`${GITHUB_RUN_ID} / ${GITHUB_RUN_ATTEMPT}\`
          **Target:** repository-scoped self-hosted runner on \`adguardvm\`, Ubuntu 24.04 LTS.

          ## Result

          **PASS.** The target applied the version-controlled, secret-safe approved AdGuard projection idempotently and a separate target job independently re-ran VER-0422.

          - Sanitized controlled-field change count at apply: \`${change_count}\`.
          - Sanitized changed paths: \`${changed_paths}\`.
          - Persisted controlled settings match \`approved-adguard-config-v1.json\` after apply.
          - Runtime API checks prove protection enabled, the only approved upstream is \`https://dns10.quad9.net/dns-query\`, query logging disabled, statistics disabled, and the active filter is the approved AdGuard DNS filter.
          - A synthetic loopback DNS request passed without retaining or publishing query content.
          - Negative fixtures for query logging, ECS, a non-approved upstream, and an unapproved active filter/processor were all rejected.
          - Runtime-only filter identifiers are preserved rather than rewritten by the versioned artifact.
          - Secrets remain outside Git; the credential file remains root-owned mode 0600 and no credential/query/client-identifier content is copied into evidence.
          - Changes are diffable through a deterministic privacy-safe projection; candidate generation preserves all non-controlled configuration semantics.
          - Apply uses a staged candidate and root-only rollback copy; any post-replacement failure restores the prior configuration and restarts AdGuard Home.

          ## Sanitized evidence integrity

          - Apply transcript SHA-256: \`${apply_sha256}\`
          - Independent verification transcript SHA-256: \`${verify_sha256}\`
          - Raw credentials, query records and client identifiers are not persisted in project evidence.

          ## Authority and non-inference

          The pipeline consumes the existing canonical \`approved-adguard-config-v1.json\`; it does not create a second configuration authority. REQ-0042/REQ-0043 and CON-0002/CON-0003 remain controlling. This PASS proves only TSK-0422. It does not pass or alter TSK-0455, TSK-0456, TSK-0457 or TSK-0492; deploy a new environment; distribute profiles/certificates; revoke service; process participants; enable telemetry; authorize public/market activation; or satisfy launch gates.
          EVIDENCE

          evidence_blob="$(git hash-object "${evidence_file}")"
          state='CURRENT_STATE.md'
          heading='## TSK-0422 current accepted stable state — 2026-09-04'
          ! grep -Fq "${heading}" "${state}"
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sed -i -E "0,/^\*\*Updated:\*\*/s|^\*\*Updated:\*\*.*$|**Updated:** ${now}|" "${state}"
          cat >> "${state}" <<STATE

          ${heading}

          \`TSK-0422 — Implement versioned AdGuard and DNS service configuration pipeline\`: **PASS** under current \`ACC-0422 / VER-0422 / EVD-0422\`.

          - Action authority: **A3 / AUTO_ALLOWED**; direct hard dependency \`TSK-0451\` is current durable PASS.
          - Exact target: repository-scoped self-hosted runner on \`adguardvm\`, Ubuntu 24.04 LTS, using the existing approved local AdGuard control/credential boundary.
          - Versioned source: \`${script}\`, blob \`${script_blob}\`, SHA-256 \`${script_sha256}\`; canonical approved settings \`${approved}\`, blob \`${approved_blob}\`, SHA-256 \`${approved_sha256}\`; source commit \`${SOURCE_COMMIT}\`.
          - Durable evidence: \`${evidence_file}\`, blob \`${evidence_blob}\`; GitHub Actions run/attempt \`${GITHUB_RUN_ID} / ${GITHUB_RUN_ATTEMPT}\`.
          - Verification: persisted approved projection match; runtime API checks; synthetic loopback DNS; negative query-log/ECS/upstream/filter-processor fixtures; runtime-normalization regression; deterministic sanitized diff; secret separation; staged-candidate/root-only rollback protection; separate independent target verification job.
          - Apply controlled-field change count: \`${change_count}\`; sanitized changed paths: \`${changed_paths}\`.
          - Security/privacy: no secret, raw query content or client identifier is written to Git/evidence; runtime filter IDs are preserved; non-controlled AdGuard configuration semantics are preserved during candidate generation.
          - **Non-inference:** \`TSK-0455\` remains DEFERRED / WAITING under DEC-0059 / CR-0012 with unchanged \`ACC-0455 / VER-0455 / EVD-0455\`; \`TSK-0456\`, \`TSK-0457\` and \`TSK-0492\` remain dependency-blocked. No new environment deployment, participant processing, telemetry, profile/certificate distribution, service revocation/removal, public/market activation, payment or launch authority is inferred.
          STATE

          git diff --check
          [[ "$(git status --porcelain | wc -l)" -eq 2 ]]
          git status --porcelain | grep -Fq ' M CURRENT_STATE.md'
          git status --porcelain | grep -Fq "?? ${evidence_file}"
          ! git diff -- CURRENT_STATE.md | grep -Fq 'TSK-0455 —'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md "${evidence_file}"
          git commit -m 'state: accept TSK-0422 AdGuard configuration pipeline'
          git push origin HEAD:main
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$(git rev-parse HEAD)" ]]
          [[ "$(git show origin/main:"${evidence_file}" | git hash-object --stdin)" == "$(git hash-object "${evidence_file}")" ]]
          [[ "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" == "$(git hash-object CURRENT_STATE.md)" ]]
          echo "PERSISTED_COMMIT=$(git rev-parse HEAD)"
          echo 'PERSIST_READBACK=PASS'
