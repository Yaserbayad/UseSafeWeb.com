name: Update TSK-0324 post-CR-0007 dual mode
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-tsk0324-post-cr0007-dual-mode-20260901.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded current-scope UI contract update
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 .github/scripts/update_tsk0324_post_cr0007_dual_mode_20260901.py
          git diff --check
          test -n "$(git status --porcelain prototype/TSK-0324/UI_COMPONENT_RULES.md prototype/TSK-0324/COMPONENT_CONTRACT.json)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/TSK-0324/UI_COMPONENT_RULES.md prototype/TSK-0324/COMPONENT_CONTRACT.json
          git commit -m 'design: align TSK-0324 with current dual-mode scope'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          echo "TSK0324_UPDATE_COMMIT=$(git rev-parse HEAD)"
          echo "TSK0324_MD_BLOB=$(git rev-parse HEAD:prototype/TSK-0324/UI_COMPONENT_RULES.md)"
          echo "TSK0324_JSON_BLOB=$(git rev-parse HEAD:prototype/TSK-0324/COMPONENT_CONTRACT.json)"
