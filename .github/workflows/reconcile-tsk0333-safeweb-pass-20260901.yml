name: Reconcile TSK-0333 SafeWeb PASS
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/reconcile_tsk0333_safeweb_pass_20260901.py'
      - '.github/workflows/reconcile-tsk0333-safeweb-pass-20260901.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist corrected current TSK-0333 PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 .github/scripts/reconcile_tsk0333_safeweb_pass_20260901.py
          git diff --check
          grep -Fq '## TSK-0333 current accepted stable state — 2026-09-01 — POST-CR-0007' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: refresh TSK-0333 PASS with SafeWeb identity'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          echo "TSK0333_SAFEWEB_PASS_RECONCILIATION=PASS"
          echo "TSK0333_SAFEWEB_RUNTIME_COMMIT=$(git rev-parse HEAD)"
          echo "TSK0333_SAFEWEB_RUNTIME_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
