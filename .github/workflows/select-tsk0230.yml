name: Select TSK-0230

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/select-tsk0230.yml'

permissions:
  contents: write

jobs:
  select:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify queue and select TSK-0230
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object TSK_0042_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md)" = "35ee22dee9a37d595a0d0650416c3e14288520cb"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='')))
          by={r['Task_ID']:r for r in rows}
          t=by['TSK-0230']; real=by['TSK-0187']; owner=by['TSK-0140']
          assert set(x.strip() for x in t['Dependencies'].split(';'))=={'TSK-0313','TSK-0042'}
          assert t['Lifecycle_Stage']=='L4' and t['Priority']=='MEDIUM'
          assert t['AI_Capability_A0_A4']=='A3' and t['Action_Authority']=='AUTO_ALLOWED'
          assert 'Each data element has purpose, lawful basis, source, recipient, retention, deletion mechanism, access control, and prohibited use' in t['Acceptance_Criteria']
          assert 'identifiable browsing history remains excluded' in t['Acceptance_Criteria']
          assert 'Representative parents' in real['Acceptance_Criteria']
          assert 'reviewed by owner' in owner['Acceptance_Criteria'].lower()
          p=pathlib.Path('CURRENT_STATE.md'); text=p.read_text()
          assert '### TSK-0042 accepted stable state' in text
          assert 'No next task is selected by this write' in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          q=text.rfind('\n## Queue status after current reconciliation'); assert q>=0
          text=text[:q].rstrip()+f'''\n\n## Queue status after current reconciliation\n\nThe TSK-0042 post-PASS queue was reread against current acceptance and CR-0003. `TSK-0187` remains ineligible because it requires representative-parent behavioral evidence. `TSK-0140` remains ineligible for PASS because owner/multi-role review evidence is absent. `TSK-0230` is the highest eligible AUTO_ALLOWED provisional-L4 task.\n\n- **Selected next: `TSK-0230 — {t['Title']}`** (L4 / {t['AI_Capability_A0_A4']} / {t['Action_Authority']} / {t['Priority']}).\n- Hard dependencies: `TSK-0313`, `TSK-0042` — current PASS.\n- ACC-0230: {t['Acceptance_Criteria']}\n- Selection boundary: internal provisional privacy/data NFR definition only. It must reuse current data/accountless/privacy authority, preserve the legal/participant hold, distinguish existing accepted lawful-basis analysis from any new legal conclusion, and verify material current UK privacy-law facts from authoritative sources before freezing them.\n\n## Exact next authoritative step\n\nExecute bounded `TSK-0230`: inventory every allowed product/support/diagnostic/operational data element in the active minimum, map purpose/source/recipient/retention/deletion/access/prohibited use and the current supported lawful-basis position, exclude identifiable browsing history, preserve DEC-0042/TSK-0229/CON-0007/CON-0008 and unresolved legal/participant gates; source-verify material current UK privacy rules; persist/read back independent ACC-0230 evidence; reconcile runtime; then recompute.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md
          git commit -m "state: select TSK-0230"
          git push
