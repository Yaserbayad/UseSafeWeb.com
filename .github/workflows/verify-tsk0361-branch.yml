name: TSK-0361 branch contract

on:
  push:
    branches:
      - task/tsk-0361-public-site
    paths:
      - 'website/**'
      - '.github/workflows/verify-tsk0361-branch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify TSK-0361 static contract
        run: node website/tests/tsk0361-contract.mjs
