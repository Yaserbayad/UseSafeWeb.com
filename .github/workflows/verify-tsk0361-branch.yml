name: TSK-0361 branch acceptance

on:
  push:
    branches:
      - task/tsk-0361-public-site
    paths:
      - 'website/**'
      - '.github/workflows/verify-tsk0361-branch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Verify TSK-0361 static contract
        run: npm run test:contract
      - name: Install locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Verify installed top-level dependency graph
        run: npm ls --depth=0
      - name: Lint application
        run: npm run lint
      - name: Build standalone application
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install acceptance browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run real-browser accessibility and journey acceptance
        run: npm run test:e2e
