name: Temporary TSK-0491 format new files

on:
  push:
    branches:
      - feature/tsk-0491-dependency-inventory-sbom-20260903

permissions:
  contents: write

jobs:
  format-new-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/tsk-0491-dependency-inventory-sbom-20260903
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - name: Format only the two new website files and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = 'eb35f3b10356396c5117e3f47d0b0378953e2157'
          test "$(git hash-object website/package-lock.json)" = '6ff91d845bc5f3099b6a00f5f43673eed80a3ba5'
          test "$(git hash-object website/config/dependency-inventory.json)" = '7808df6c7e8e72559950dcf950655fb97a6956bc'
          test "$(git hash-object website/tests/contract/tsk0491.test.mjs)" = '030797b8c83f61922bc57f12d3aaca8898a023d8'
          python3 Plans/Master/Tools/validate_master_plan.py
          cd website
          npm ci --ignore-scripts --no-fund --no-audit
          npx --no-install prettier --write config/dependency-inventory.json tests/contract/tsk0491.test.mjs
          npm run format:check
          node --test tests/contract/tsk0491.test.mjs
          cd ..
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/config/dependency-inventory.json website/tests/contract/tsk0491.test.mjs
          git commit -m 'style(TSK-0491): format dependency inventory contract'
          git push origin HEAD:feature/tsk-0491-dependency-inventory-sbom-20260903
