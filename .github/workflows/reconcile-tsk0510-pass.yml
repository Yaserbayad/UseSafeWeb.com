name: Reconcile TSK-0510 PASS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-tsk0510-pass.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-governance-tsk0510-pass-v2
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Reconcile TSK-0510 and queue
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git hash-object CURRENT_STATE.md)" == 'f4a95ca7df5b527717f91c63044a1323abd1e33a' ]]
          [[ "$(git hash-object TSK_0510_PILOT_TECHNICAL_ACCEPTANCE_REPORT_2026-08-28.md)" == 'fbc41f65ec56e7e9ea8873e9a995b66ae9e8f2c9' ]]
          [[ "$(git hash-object TSK_0510_PILOT_TECHNICAL_ACCEPTANCE_EVIDENCE_2026-08-28.md)" == 'ce833b35f904c7657b5cc69419ec388b84e1a611' ]]
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re
          p=Path('CURRENT_STATE.md')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'\*\*Updated:\*\* [^\n]+', '**Updated:** '+datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')+'  ', s, count=1)
          assert n==1
          anchor='- `TSK-0431` — pilot restore/rebuild recovery acceptance fully satisfied: project-controlled isolated recovery drill PASS with deterministic `rec-v1` routing, encrypted DoH/DoT, filtering/rollback, privacy, health and 12-second recovery evidence; owner-managed Azure-native restore subsequently reported successful by the Project Owner — project recovery evidence `TSK_0431_PROJECT_CONTROLLED_RECOVERY_DRILL_EVIDENCE_2026-08-28.md`, blob `2df5c05767fe326e38c609d37888f672dcb9dd48`; Azure restore owner evidence `TSK_0431_AZURE_RESTORE_OWNER_EVIDENCE_2026-08-28.md`, blob `e077165e98fa4460fba84466ffe28953ad53dec0`. **ACC-0431 and REQ-0052 recovery acceptance are satisfied.**'
          assert s.count(anchor)==1
          pass_line='- `TSK-0510` — pilot technical acceptance report compiled and independently audited against ACC-0510, REQ-0065/REQ-0066, current predecessor evidence and the LG-03 boundary — report `TSK_0510_PILOT_TECHNICAL_ACCEPTANCE_REPORT_2026-08-28.md`, blob `fbc41f65ec56e7e9ea8873e9a995b66ae9e8f2c9`; evidence `TSK_0510_PILOT_TECHNICAL_ACCEPTANCE_EVIDENCE_2026-08-28.md`, blob `ce833b35f904c7657b5cc69419ec388b84e1a611`; independent audit run `33175993512` / job `98864628019`: PASS. The evidence signature is Git/repository evidence only; no human/legal signature or gate approval is fabricated. **TSK-0510 = PASS; LG-03 remains NOT PASS.**'
          assert '`TSK-0510` — pilot technical acceptance report compiled and independently audited' not in s
          pos=s.index(anchor)+len(anchor)
          s=s[:pos]+'\n'+pass_line+s[pos:]
          q=s.index('## Queue status after current reconciliation')
          lines=[
              '## Queue status after current reconciliation',
              '',
              'TSK-0510 is runtime PASS with durable report/evidence and an independent repository audit. Recomputing the L2 dependency graph after that mutation yields **0 ordinary dependency-ready `AUTO_ALLOWED` tasks**.',
              '',
              'The direct L2 successors remain constrained as follows:',
              '',
              '- `TSK-0513` — end-to-end synthetic rehearsal — remains unavailable because hard predecessor `TSK-0167` is not PASS. TSK-0167 itself depends on `TSK-0221`, which is owner-deferred until 2027-08-27 or earlier explicit owner reactivation and is a HUMAN_ONLY notice-approval/release action.',
              '- `TSK-0026` — assemble the G-02/LG-03 evidence package — remains unavailable because required legal/privacy predecessors including `TSK-0211`, `TSK-0217`, and `TSK-0221` remain owner-deferred/unresolved.',
              '- `TSK-0215` and `TSK-0218`, although they depend on TSK-0510, remain explicitly `DEFERRED` under the 2026-08-27 owner legal hold and are not executable ordinary work.',
              '',
              'The accepted technical report does not alter the legal hold, does not satisfy LG-03, and does not authorize recruitment, participant processing, child-linked DNS activation, public launch, or any Project Owner/HUMAN_ONLY gate decision.',
              '',
              '## Exact next authoritative step',
              '',
              'There is no ordinary dependency-ready L2 `AUTO_ALLOWED` work after TSK-0510. Preserve the current technical baseline and WAIT on the owner-deferred legal/regulatory/compliance branch until **2027-08-27** or an earlier explicit Project Owner reactivation. Do not recruit or activate real participants and do not infer LG-03 PASS. If the owner explicitly reactivates that branch earlier, reload its exact WBS rows/gates/requirements and resume from the highest-priority unresolved legal/privacy predecessor rather than bypassing it.',
              '',
          ]
          s=s[:q]+'\n'.join(lines)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq '**TSK-0510 = PASS; LG-03 remains NOT PASS.**' CURRENT_STATE.md
          grep -Fq '0 ordinary dependency-ready `AUTO_ALLOWED` tasks' CURRENT_STATE.md
          grep -Fq 'TSK-0221' CURRENT_STATE.md
          grep -Fq 'There is no ordinary dependency-ready L2 `AUTO_ALLOWED` work after TSK-0510.' CURRENT_STATE.md
          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: mark TSK-0510 PASS and close technical queue'
          git push origin HEAD:main
