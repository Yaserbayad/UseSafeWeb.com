name: Audit CR-0005 canonical readback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-cr0005-human-validation-resequence.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-governance-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify canonical amendment readback
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          echo "READBACK_HEAD=$(git rev-parse HEAD)"
          python3 - <<'PY'
          import csv, pathlib, re
          root=pathlib.Path('Plans/Master')
          with (root/'WBS/master-wbs.csv').open(encoding='utf-8', newline='') as f:
              rows=list(csv.DictReader(f))
          by={r['Task_ID']:r for r in rows}
          l3=[r for r in rows if r['Lifecycle_Stage']=='L3']
          excluded={r['Task_ID'] for r in l3}|{'TSK-0187','TSK-0326','TSK-0336'}
          assert len(rows)==641
          assert len(l3)==31
          assert len(excluded)==34
          for tid in excluded:
              r=by[tid]
              assert r['Plan_Status']=='NOT_APPLICABLE' and r['Execution_State']=='PASS', (tid,r['Plan_Status'],r['Execution_State'])
          for tid in ('TSK-0309','TSK-0327','TSK-0399'):
              assert by[tid]['Plan_Status']!='NOT_APPLICABLE'
          assert 'TSK-0187' in by['TSK-0309']['Dependencies']
          assert 'no real-user comprehension claim is required or inferred before l8.' in by['TSK-0309']['Acceptance_Criteria'].lower()
          assert 'real parent' not in by['TSK-0399']['Title'].lower()
          edges=sum(len([x for x in re.split(r'[;,]',r['Dependencies']) if x.strip()]) for r in rows)
          assert edges==849, edges
          print('READBACK_TASKS=641')
          print('READBACK_DEPENDENCY_EDGES=849')
          print('READBACK_L3_EXCLUSIONS=31')
          print('READBACK_TOTAL_PREPRODUCT_HUMAN_EXCLUSIONS=34')
          for tid in ('TSK-0187','TSK-0326','TSK-0336','TSK-0309','TSK-0327','TSK-0399'):
              r=by[tid]
              print(f"READBACK_ROW={tid}|plan={r['Plan_Status']}|runtime={r['Execution_State']}|deps={r['Dependencies']}|title={r['Title']}")
          checks={
            'manifest':('MANIFEST.yaml','latest_change: CR-0005'),
            'decisions':('Registers/DECISIONS_TRIGGERS.md','| DEC-0052 |'),
            'change':('Registers/EXCEPTIONS_CHANGE_CONTROLS.md','| CR-0005 |'),
            'gates':('Registers/GATES.md','first active parent/user/participant validation stage'),
            'layer5':('Layers/LAYER_5_AI_EXECUTION_EVIDENCE_STATE_CONTROL.md','DEC-0052 / CR-0005'),
            'interface':('Governance/CURRENT_STATE_INTERFACE.md','L8 is the first real-user validation stage'),
          }
          for label,(rel,needle) in checks.items():
              text=(root/rel).read_text(encoding='utf-8')
              assert needle in text, (label,needle)
              print(f'READBACK_{label.upper()}=PASS')
          print('CR0005_CANONICAL_READBACK=PASS')
          PY
          (cd Plans && sha256sum -c SHA256SUMS.txt)
          python3 Plans/Master/Tools/validate_master_plan.py
          echo 'CR0005_CHECKSUM_READBACK=PASS'
          echo 'CR0005_VALIDATOR_READBACK=PASS'
