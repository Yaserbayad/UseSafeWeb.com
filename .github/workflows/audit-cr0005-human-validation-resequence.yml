name: Audit CR-0005 human-validation resequencing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-cr0005-human-validation-resequence.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-governance-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Audit authoritative planning impact
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv, pathlib, re
          root = pathlib.Path('Plans/Master')
          with (root/'WBS/master-wbs.csv').open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))
          fields = list(rows[0]) if rows else []
          print('WBS_FIELDS=' + '|'.join(fields))
          def tid(r): return (r.get('Task_ID') or '').strip()
          def lc(r): return (r.get('Lifecycle_Stage') or '').strip()
          def title(r): return (r.get('Title') or '').strip()
          def deps(r): return (r.get('Dependencies') or '').strip()
          l3ids={tid(r) for r in rows if lc(r)=='L3' and tid(r)}
          print(f'L3_TASK_COUNT={len(l3ids)}')
          print('CROSS_L3_DEPENDENTS_BEGIN')
          for r in rows:
              if lc(r) in {'L4','L5','L6','L7'}:
                  found=sorted(i for i in l3ids if i and i in deps(r))
                  if found: print(f"{tid(r)}|{lc(r)}|{title(r)}|l3deps={';'.join(found)}|deps={deps(r)}")
          print('CROSS_L3_DEPENDENTS_END')
          targets={'TSK-0034','TSK-0139','TSK-0141','TSK-0187','TSK-0188','TSK-0298','TSK-0309','TSK-0325','TSK-0326','TSK-0327','TSK-0333','TSK-0336','TSK-0399','TSK-0054','TSK-0056'}
          print('TARGET_ROWS_BEGIN')
          for r in rows:
              if tid(r) in targets:
                  print('ROW|' + '|'.join(f'{k}={r.get(k,"")}' for k in fields))
          print('TARGET_ROWS_END')
          print('TARGET_DIRECT_DEPENDENTS_BEGIN')
          for target in sorted(targets):
              hit=[]
              for r in rows:
                  if target in [x.strip() for x in deps(r).split(';') if x.strip()]:
                      hit.append(f"{tid(r)}:{lc(r)}:{title(r)}")
              if hit: print(target+'|'+' || '.join(hit))
          print('TARGET_DIRECT_DEPENDENTS_END')
          print('L3_FULL_ROWS_BEGIN')
          for r in rows:
              if lc(r)=='L3': print('ROW|' + '|'.join(f'{k}={r.get(k,"")}' for k in fields))
          print('L3_FULL_ROWS_END')
          print('CR0005_TARGETED_AUDIT=PASS')
          PY
