name: Audit CR-0005 human-validation resequencing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-cr0005-human-validation-resequence.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-governance-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Audit authoritative planning impact
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv, pathlib, re
          root=pathlib.Path('Plans/Master')
          with (root/'WBS/master-wbs.csv').open(encoding='utf-8', newline='') as f:
              rows=list(csv.DictReader(f))
          targets={'TSK-0024','TSK-0052','TSK-0053','TSK-0055','TSK-0056','TSK-0139','TSK-0141','TSK-0187','TSK-0298','TSK-0309','TSK-0326','TSK-0327','TSK-0336','TSK-0399'}
          print('GATE_AND_TARGET_ROWS_BEGIN')
          for r in rows:
              if r['Task_ID'] in targets:
                  print('|'.join(f'{k}={r[k]}' for k in ['Task_ID','Lifecycle_Stage','Title','Plan_Status','Execution_State','Dependencies','Trigger','Acceptance_Criteria','Verification_Method','Notes']))
          print('GATE_AND_TARGET_ROWS_END')
          pats=('representative parent','representative-parent','real-user','real user','behavioral validation','behavioural validation','usability/comprehension','human usability','user evidence','participant')
          print('L4_L7_HUMAN_EVIDENCE_ROWS_BEGIN')
          for r in rows:
              if r['Lifecycle_Stage'] not in {'L4','L5','L6','L7'}: continue
              text=' '.join([r['Title'],r['Purpose'],r['Trigger'],r['Preconditions'],r['Acceptance_Criteria'],r['Verification_Method'],r['Notes']]).lower()
              hits=sorted({p for p in pats if p in text})
              if hits:
                  print(f"{r['Task_ID']}|{r['Lifecycle_Stage']}|{r['Title']}|hits={';'.join(hits)}|deps={r['Dependencies']}|acc={r['Acceptance_Criteria']}|notes={r['Notes']}")
          print('L4_L7_HUMAN_EVIDENCE_ROWS_END')
          print('CR0005_GATE_AUDIT=PASS')
          PY
