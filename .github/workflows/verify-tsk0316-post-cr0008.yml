name: Verify TSK-0316 post-CR-0008

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0316-post-cr0008-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current TSK-0316 acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, re, subprocess
          from pathlib import Path

          expected={
            'wbs':('Plans/Master/WBS/master-wbs.csv','b27a0c5df2f5636d8ed71051e9e26a68959a2616'),
            'graph':('Plans/Master/RELATIONSHIP_INDEX.yaml','c108d2c162bcea2ee4cc01def46d0487a9501032'),
            'runtime':('CURRENT_STATE.md','077e6c61df6284441d447c4a796185adb5f3e65b'),
            'artifact':('TSK_0316_POST_CR0008_DUAL_MODE_FRICTION_BUDGET_2026-09-02.md','27f1b6de7924ceba713f9aed9ffc90df9a31efe5'),
            'historical':('TSK_0316_FRICTION_BUDGET_AND_INTERACTION_CHALLENGE_2026-08-28.md','07df8b1909809a069e3ddba1ff10b688d2f5a5e0'),
            'blueprint':('TSK_0315_POST_CR0007_DUAL_MODE_END_TO_END_SERVICE_BLUEPRINT_2026-08-31.md','97cf09f294c757f80ad5c0fbe6110ed8d471159c'),
            'tsk0299':('TSK_0299_POST_CR0008_CORRECTED_ACCEPTANCE_EVIDENCE_2026-09-01.md','9d48add06fee14aef76f82a876a61cc88ce59440'),
          }
          P={k:Path(v[0]) for k,v in expected.items()}
          def blob(p): return subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          for k,(name,sha) in expected.items():
              assert P[k].exists(), f'missing {k}: {name}'
              actual=blob(P[k]); assert actual==sha, f'{k} hash mismatch {actual} != {sha}'

          with P['wbs'].open(newline='',encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          byid={r['Task_ID']:r for r in rows if r.get('Task_ID')}
          r=byid['TSK-0316']
          assert (r['Lifecycle_Stage'],r['Priority'],r['AI_Capability_A0_A4'],r['Action_Authority'])==('L4','HIGH','A3','AUTO_ALLOWED')
          assert r['Dependencies'].strip()=='TSK-0315'
          assert (r['Acceptance_ID'],r['Verification_ID'],r['Evidence_ID'])==('ACC-0316','VER-0316','EVD-0316')
          ac=r['Acceptance_Criteria'].lower()
          for token in ['retained interaction','decision','technical','safety','removable','platform','one-click']:
              assert token in ac, token
          print('TSK0316_CURRENT_WBS_CONTRACT=PASS')

          rt=P['runtime'].read_text(encoding='utf-8')
          assert '## TSK-0315 current accepted stable state — 2026-08-31 — POST-CR-0007' in rt
          s315=re.search(r'^## TSK-0315 current accepted stable state.*?(?=^## |\Z)',rt,re.MULTILINE|re.DOTALL)
          assert s315 and '**PASS**' in s315.group(0)
          assert 'TSK_0315_POST_CR0007_DUAL_MODE_END_TO_END_SERVICE_BLUEPRINT_2026-08-31.md' in s315.group(0)
          print('TSK0315_CURRENT_PREDECESSOR=PASS')

          protected=[
            '## TSK-0299 current accepted stable state — 2026-09-01 — POST-CR-0008 CORRECTED OWNER-IDENTITY BINDING',
            '## TSK-0485 current accepted stable state',
            '## TSK-0318 current accepted stable state',
            '## TSK-0319 current accepted stable state',
            '## TSK-0301 current accepted stable state — 2026-09-02 — POST-CR-0008 CURRENT DEPENDENCY REVALIDATION',
          ]
          def section(text,prefix):
              m=re.search(r'^'+re.escape(prefix)+r'.*$',text,re.MULTILINE); assert m, prefix
              n=re.search(r'^## ',text[m.end():],re.MULTILINE)
              end=m.end()+n.start() if n else len(text)
              return text[m.start():end]
          for h in protected:
              s=section(rt,h); assert '**PASS**' in s
              print('PROTECTED_SECTION_SHA256|{}|{}'.format(h,hashlib.sha256(s.encode()).hexdigest()))
          print('PROTECTED_RUNTIME_INPUTS=PASS')

          old=P['historical'].read_text(encoding='utf-8')
          assert 'mandatory UseSafeWeb account/login/sign-up' in old
          assert 'Resulting minimum provisional happy path' in old
          assert 'optional parent account' not in old.lower()
          assert 'dashboard' not in old.lower()
          print('HISTORICAL_TSK0316_CR0006_STALENESS=PASS')

          bp=P['blueprint'].read_text(encoding='utf-8')
          for s in ['complete core First Phone Safety Setup remains usable **without login**','an **optional parent account** adds bounded continuity','No automatic J0/J1 linkage','Dashboard empty/list','Account deletion','Provider outage branch','24. Exit / reset / lost state']:
              assert s in bp, s
          print('CURRENT_DUAL_MODE_BLUEPRINT_INPUT=PASS')

          a=P['artifact'].read_text(encoding='utf-8')
          for s in ['supersedes `TSK_0316_FRICTION_BUDGET_AND_INTERACTION_CHALLENGE_2026-08-28.md`','Complete accountless core','Optional account is bounded continuity','No automatic J0/J1 linkage','No child account/profile','Lifecycle operations stay distinct','Current visible brand','No raw DNS administration']:
              assert s in a, s
          for i in range(1,8):
              assert f'### B{i} ' in a, f'missing B{i}'
          print('TSK0316_DUAL_MODE_INVARIANTS_AND_BUDGET_CLASSES=PASS')

          zero=[
            'mandatory login/sign-up/account creation before or after core value',
            'forcing the optional-account branch before the parent can finish/exit accountless',
            'creating a persistent device record silently from J0/J1 or sign-in alone',
            'automatically importing/promoting/linking/extending J0/J1 on account entry',
            'duplicate provider sign-in after a valid session is already known',
            'dashboard/device-management steps for a parent who chose accountless completion',
            'treating managed-device record ownership as protection verification',
            'retry loops without changed conditions/new evidence',
          ]
          for s in zero: assert s in a, s
          print('TSK0316_ZERO_BUDGET_REMOVALS=PASS')

          stages=[
            '0 Discover / trust','1 Start core','2 Minimal route','3 Native safeguard','4 DNS configure','5 DNS verify','6 Relevant service','7 Protection Map','8 Core finish / optional continuity choice','9 Optional account entry','10 First-session account creation','11 Signed-in return/session','12 Dashboard empty/list','13 Add/manage device','14 Reverify/reinstall/reconfigure','15 Replace device','16 Revoke/unlink management','17 Delete dashboard device record','18 Account logout','19 Account deletion','20 False positive / ordinary help','21 Remove SafeWeb DNS','22 Post-removal recovery','23 Provider outage','24 Exit / reset / lost state'
          ]
          for s in stages: assert f'| {s} |' in a, s
          print('TSK0316_ALL_25_BLUEPRINT_STAGES_CHALLENGED=PASS')

          for s in ['Finish without account / Exit','no implicit transfer of J0/J1','no automatic managed-device record solely because sign-in succeeded','valid session suppresses redundant sign-in','dashboard list/empty is output, not a form step','provider outage/cancel returns to the accountless core']:
              assert s in a, s
          print('TSK0316_ACCOUNTLESS_AND_OPTIONAL_ACCOUNT_FRICTION=PASS')

          for s in ['Default required identity/contact fields: **zero**','child account/profile identity','browsing/query/activity history','raw AdGuard administrative credentials/control fields','deleting an account/device record','confirmation that implies a stronger protection state than its evidence supports']:
              assert s in a, s
          print('TSK0316_FIELD_CONFIRMATION_PRIVACY_BUDGET=PASS')

          for s in ['`dns.usesafeweb.com`','Do not claim a web page silently changes the OS setting','Do not claim silent universal installation','`Remove SafeWeb DNS`','`Protect in one click`','`Fully protected`']:
              assert s in a, s
          print('TSK0316_PLATFORM_AND_ONE_CLICK_TRUTH=PASS')

          for s in ['Ambiguous account creation, unlink, delete, replacement or removal results must be reconciled to known state before replay','never blind-retry a potentially duplicated/destructive effect','Repeated equivalent failure exits to truthful error/help rather than looping']:
              assert s in a, s
          print('TSK0316_RETRY_AND_AMBIGUOUS_EFFECT_POLICY=PASS')

          for n in range(1,27):
              assert re.search(r'^'+str(n)+r'\.',a,re.MULTILINE), f'missing assertion {n}'
          print('TSK0316_26_DETERMINISTIC_ASSERTIONS=PASS')

          e299=P['tsk0299'].read_text(encoding='utf-8')
          assert 'visible brand/product token: `SafeWeb`' in e299
          assert 'generic parent-facing DNS feature/CTA language uses `SafeWeb DNS`' in e299
          assert 'generic `UseSafeWeb` without `.com` is prohibited as brand copy' in e299
          assert 'parent-facing generic product copy uses `SafeWeb` / `SafeWeb DNS`' in a
          print('TSK0316_SAFEWEB_NAMING=PASS')

          for s in ['RSK-0002` remains OPEN','does not prove real-parent usability','does not make any successor PASS']:
              assert s in a, s
          print('TSK0316_NON_INFERENCE=PASS')

          subprocess.check_call(['git','diff','--check'])
          print('TSK0316_CURRENT_ACC=PASS')
          print('WBS_BLOB='+blob(P['wbs']))
          print('GRAPH_BLOB='+blob(P['graph']))
          print('RUNTIME_BLOB='+blob(P['runtime']))
          print('ARTIFACT_BLOB='+blob(P['artifact']))
          PY
