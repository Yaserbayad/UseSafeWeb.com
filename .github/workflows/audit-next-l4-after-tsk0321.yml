name: Audit next active L4 after TSK-0321

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-next-l4-after-tsk0321.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Derive active L4 dependency-ready candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv,re
          from pathlib import Path
          wbs=Path('Plans/Master/WBS/master-wbs.csv')
          state=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          rows=list(csv.DictReader(wbs.open(encoding='utf-8-sig',newline='')))
          by={r['Task_ID'].strip():r for r in rows if r.get('Task_ID','').strip()}
          def deps(r):
              raw=(r.get('Dependencies') or r.get('Dependency') or '').strip()
              return re.findall(r'TSK-\d{4}',raw)
          def runtime_status(tid):
              # Strong signals only: task-local lines/headings that explicitly pair the ID with PASS/WAITING/BLOCKED/TODO.
              hits=[]
              lines=state.splitlines()
              for i,l in enumerate(lines):
                  if tid in l:
                      lo=max(0,i-1); hi=min(len(lines),i+5)
                      block='\n'.join(lines[lo:hi])
                      hits.append(block)
              txt='\n'.join(hits)
              if re.search(rf'{re.escape(tid)}[^\n]{{0,180}}\*\*PASS\*\*',txt,re.I) or re.search(rf'{re.escape(tid)}[^\n]{{0,180}}:\s*PASS\b',txt,re.I): return 'PASS'
              if re.search(rf'{re.escape(tid)}[^\n]{{0,180}}\*\*WAITING',txt,re.I): return 'WAITING'
              if re.search(rf'{re.escape(tid)}[^\n]{{0,180}}\*\*BLOCKED',txt,re.I): return 'BLOCKED'
              if re.search(rf'{re.escape(tid)}[^\n]{{0,180}}\*\*TODO',txt,re.I): return 'TODO'
              return 'UNKNOWN'
          l4=[]
          for idx,r in enumerate(rows,1):
              if (r.get('Lifecycle_Stage') or r.get('Lifecycle') or '').strip()!='L4': continue
              tid=r['Task_ID'].strip(); ds=deps(r)
              depinfo=[]; ready=True
              for d in ds:
                  dr=by.get(d,{})
                  rs=runtime_status(d)
                  snap=(dr.get('Execution_State') or '').strip()
                  disp=(dr.get('Plan_Status') or '').strip()
                  # A dependency is provisionally ready only with explicit runtime PASS or frozen exclusion PASS semantics.
                  excluded=(disp=='NOT_APPLICABLE' and snap=='PASS')
                  ok=(rs=='PASS') or excluded
                  depinfo.append((d,rs,disp,snap,ok))
                  if not ok: ready=False
              own=runtime_status(tid)
              if ready and own!='PASS':
                  l4.append((idx,r,own,depinfo))
          print(f'WBS_ROWS={len(rows)}')
          print(f'L4_DEPENDENCY_READY_NONPASS={len(l4)}')
          for idx,r,own,depinfo in l4:
              print('---CANDIDATE---')
              for k in ['Task_ID','Title','Priority','Critical_Path','Plan_Status','Execution_State','Dependencies','Dependency','Action_Authority','AI_Capability','Trigger','Preconditions','Acceptance_Criteria','Verification','Evidence','Requirements','Interfaces','Risk_ID','Owner']:
                  if k in r and r[k]: print(f'{k}={r[k]}')
              print(f'WBS_ORDER={idx}')
              print(f'RUNTIME_STRONG_STATUS={own}')
              print('DEP_AUDIT='+';'.join(f'{d}|runtime={rs}|plan={disp}|snap={snap}|ok={ok}' for d,rs,disp,snap,ok in depinfo))
          print('AUDIT_NEXT_L4=PASS')
          PY
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
