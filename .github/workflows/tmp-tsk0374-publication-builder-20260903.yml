name: Temporary TSK-0374 publication builder

on:
  push:
    branches:
      - tmp/tsk-0374-publication-builder-20260903
    paths:
      - .tmp/tsk0374-publication-trigger-20260903

permissions:
  contents: write

jobs:
  build-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bounded builder branch
        uses: actions/checkout@v4
        with:
          ref: tmp/tsk-0374-publication-builder-20260903
          fetch-depth: 0

      - name: Guard construct validate and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          BASE=6abe13a00fc2c906e0f9d592dd5383da008298c0
          EVIDENCE=TSK_0374_VERSIONED_CONTENT_DELIVERY_SOURCE_IMPLEMENTATION_2026-09-03.md
          PAYLOAD=.tmp/tsk0374-current-state-append-20260903.md
          TRIGGER=.tmp/tsk0374-publication-trigger-20260903
          WORKFLOW=.github/workflows/tmp-tsk0374-publication-builder-20260903.yml

          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base origin/main HEAD)" = "$BASE"
          test -f "$EVIDENCE"
          test -f "$PAYLOAD"
          test -f "$TRIGGER"
          ! grep -Fq 'TSK-0374 = TODO — SOURCE IMPLEMENTATION PARTIAL' CURRENT_STATE.md

          cat "$PAYLOAD" >> CURRENT_STATE.md

          grep -Fq 'TSK-0374 = TODO — SOURCE IMPLEMENTATION PARTIAL' CURRENT_STATE.md
          grep -Fq 'actual target rollback drill' "$EVIDENCE"
          grep -Fq 'target security/privacy verification' "$EVIDENCE"
          grep -Fq 'TSK-0499` PASS' "$EVIDENCE"
          git diff --check
          python Plans/Master/Tools/validate_master_plan.py

          mapfile -t effective < <(git diff --name-only "$BASE" -- CURRENT_STATE.md "$EVIDENCE" | sort)
          test "${#effective[@]}" -eq 2
          test "${effective[0]}" = 'CURRENT_STATE.md'
          test "${effective[1]}" = "$EVIDENCE"

          while IFS= read -r path; do
            case "$path" in
              CURRENT_STATE.md|"$EVIDENCE"|"$PAYLOAD"|"$TRIGGER"|"$WORKFLOW") ;;
              *) echo "Unexpected path relative to guarded base: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" | sort)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm "$WORKFLOW" "$PAYLOAD" "$TRIGGER"
          git add CURRENT_STATE.md
          git diff --cached --check
          git commit -m 'TSK-0374: finalize guarded source publication payload'
          git push origin HEAD:tmp/tsk-0374-publication-builder-20260903
