name: Verify TSK-0310 post-copy current revalidation

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0310-post-copy-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current authority, dependencies and corrected source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,re,subprocess
          from pathlib import Path

          expected={
            'Plans/Master/WBS/master-wbs.csv':'b27a0c5df2f5636d8ed71051e9e26a68959a2616',
            'Plans/Master/RELATIONSHIP_INDEX.yaml':'c108d2c162bcea2ee4cc01def46d0487a9501032',
            'CURRENT_STATE.md':'1e68911d10eb648ac57a9e0f80b552f89dd9f823',
            'TSK_0310_POST_TSK0300_COPY_CORRECTION_CURRENT_REVALIDATION_2026-09-02.md':'24c8e3cdf059fc62a3df1fe8119b959246c216f6',
            'TSK_0300_POST_CR0008_PROTECTION_COPY_CORRECTION_EVIDENCE_2026-09-02.md':'a3e39896b67098ced321cb9e4b82c65c440806e4',
            'TSK_0317_POST_CR0008_CURRENT_REVALIDATION_EVIDENCE_2026-09-02.md':'cd001f3ce391634e38ef0c89934cb34f4f347401',
            'TSK_0318_POST_CR0008_DUAL_MODE_PUBLIC_PRODUCT_SETUP_IA_2026-09-01.md':'975e2e7a8e85e9408e0bbbc2be226f3fdd012db3',
            'TSK_0320_POST_CR0008_PROTECTION_STATE_MODEL_AND_COPY_RULES_2026-09-01.md':'bdc6bacc424669708f410466f3cfd5527f1c2b3c',
            'TSK_0310_RENDERED_BROWSER_ACCEPTANCE_EVIDENCE_2026-08-29.md':'02b34756862a62091908e60d32b490059a84a67c',
            'TSK_0321_ACCESSIBILITY_REVIEW_ACCEPTANCE_EVIDENCE_2026-08-29.md':'7ab9dd2467ca8ad755ef308c4b2ecade71023be8',
            'prototype/TSK-0310/index.html':'5d80dfdefb52042bc34468723354fefd325285e4',
            'prototype/TSK-0310/model.mjs':'cb35f7dbc46ba5d19da18fb09429b59e097e0492',
            'prototype/TSK-0310/app.mjs':'a235993d5abcaac550b6c01978792092012afb00',
            'prototype/TSK-0310/prototype.css':'004b0b34c0e5d94e3eacbeae25710284ef9a7886',
            'prototype/TSK-0310/package.json':'9cbf9f5102592a0147c531748db49b68e4ee1648',
            'prototype/TSK-0310/browser-acceptance.mjs':'5f68400a8bfb063853304e937f744e1ee71032e7',
            'brand/system/TSK-0300/tokens.css':'cd7d9a7cd5109e1ff0baa76532495dfd7a27a70f',
            'brand/system/TSK-0300/components.css':'831e92a74b6dda04252d93242cb33bd491a02381',
            'brand/identity/TSK-0301/safeweb-wordmark-primary.svg':'f93958e3e4a16f9056693072c1b9b8b31fcda852',
          }
          def blob(p): return subprocess.check_output(['git','hash-object',p],text=True).strip()
          for p,sha in expected.items():
              assert Path(p).exists(),f'missing {p}'
              actual=blob(p); assert actual==sha,f'hash drift {p}: {actual} != {sha}'
          print('TSK0310_REFRESH_IMMUTABLE_INPUT_HASHES=PASS')

          with open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          r={x['Task_ID']:x for x in rows if x.get('Task_ID')}['TSK-0310']
          deps=[x.strip() for x in (r.get('Dependencies') or '').split(';') if x.strip()]
          assert r['Lifecycle_Stage']=='L4' and r['Priority']=='HIGH'
          assert r['AI_Capability_A0_A4']=='A3' and r['Action_Authority']=='AUTO_ALLOWED'
          assert deps==['TSK-0318','TSK-0317','TSK-0320','TSK-0300']
          assert (r['Acceptance_ID'],r['Verification_ID'],r['Evidence_ID'])==('ACC-0310','VER-0310','EVD-0310')
          acc=(r.get('Acceptance_Criteria') or '').lower()
          for term in ['discovery','routing','native safeguard','dns setup','verification','external service','protection map','troubleshooting','recovery','removal','limitations']: assert term in acc,term
          ver=(r.get('Verification_Method') or '').lower()
          for term in ['functional','negative','configuration','security/privacy','rollback']: assert term in ver,term
          print('TSK0310_REFRESH_WBS_CONTRACT=PASS')

          rt=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          def sections(tid):
              return [m.group(0) for m in re.finditer(rf'^(?:##|###) {re.escape(tid)}\b.*?(?=^(?:##|###) |\Z)',rt,re.M|re.S)]
          for tid in deps:
              ss=sections(tid); assert ss and any('**PASS' in s for s in ss),f'missing PASS {tid}'
          s300='\n'.join(sections('TSK-0300'))
          for v in ['172e4b82c7c106c48291c6a6a75aca6848ca4d0c','a3e39896b67098ced321cb9e4b82c65c440806e4','33592292946 / 100128578252','ACC-0300 = PASS. VER-0300 = PASS. EVD-0300 = SATISFIED.']: assert v in s300,v
          print('TSK0310_REFRESH_CURRENT_PREDECESSORS=PASS')
          print('TSK0310_REFRESH_TSK0300_CORRECTED_PREDECESSOR=PASS')

          e317=Path('TSK_0317_POST_CR0008_CURRENT_REVALIDATION_EVIDENCE_2026-09-02.md').read_text(encoding='utf-8')
          for v in ['33576615158 / 100081874297','TSK0317_CURRENT_ACC=PASS','dns.usesafeweb.com','accountless']: assert v in e317,v
          print('TSK0310_REFRESH_TSK0317_PREDECESSOR=PASS')

          ia=Path('TSK_0318_POST_CR0008_DUAL_MODE_PUBLIC_PRODUCT_SETUP_IA_2026-09-01.md').read_text(encoding='utf-8').lower()
          assert 'accountless' in ia and 'optional' in ia and 'dashboard' in ia
          artifact=Path('TSK_0310_POST_TSK0300_COPY_CORRECTION_CURRENT_REVALIDATION_2026-09-02.md').read_text(encoding='utf-8').lower()
          assert 'does **not** broaden acc-0310 into optional-account/dashboard implementation' in artifact
          print('TSK0310_REFRESH_SCOPE_BOUNDARY=PASS')

          state_model=Path('TSK_0320_POST_CR0008_PROTECTION_STATE_MODEL_AND_COPY_RULES_2026-09-01.md').read_text(encoding='utf-8')
          model=Path('prototype/TSK-0310/model.mjs').read_text(encoding='utf-8')
          app=Path('prototype/TSK-0310/app.mjs').read_text(encoding='utf-8')
          browser=Path('prototype/TSK-0310/browser-acceptance.mjs').read_text(encoding='utf-8')
          labels=['Protection verified','Setup confirmed','Action needed','Not covered','Protection status could not be verified','Removed']
          for label in labels: assert label in state_model,label
          for value in ['protected/verified','configured/parent-confirmed','action-needed','not-covered','uncertain/error','removed']: assert value in model,value
          for label in labels: assert label in model,label
          assert 'Protection has not yet been technically verified.' in model
          for stale in ["label: 'Verified'","label: 'You confirmed this is set up'","label: 'Status uncertain'"]: assert stale not in model,stale
          assert '<strong>Protection verified</strong>' in app
          assert 'Status uncertain' not in app
          assert "EVIDENCE_STATE.ACTION_NEEDED, EVIDENCE_STATE.UNCERTAIN" in app
          assert "configured/parent-confirmed" in browser and "protected/verified" in browser and "Protection status could not be verified" in browser
          print('TSK0310_REFRESH_CURRENT_STATE_COPY_SOURCE=PASS')

          idx=Path('prototype/TSK-0310/index.html').read_text(encoding='utf-8')
          for v in ['../../brand/system/TSK-0300/tokens.css','../../brand/system/TSK-0300/components.css','../../brand/identity/TSK-0301/safeweb-wordmark-primary.svg','SafeWeb — Internal mobile-first prototype']: assert v in idx,v
          print('TSK0310_REFRESH_SHARED_SYSTEM_BINDING=PASS')

          hist=Path('TSK_0310_RENDERED_BROWSER_ACCEPTANCE_EVIDENCE_2026-08-29.md').read_text(encoding='utf-8')
          assert 'BROWSER_ACCEPTANCE=PASS' in hist and 'RENDERED_ACCEPTANCE=PASS' in hist
          a11y=Path('TSK_0321_ACCESSIBILITY_REVIEW_ACCEPTANCE_EVIDENCE_2026-08-29.md').read_text(encoding='utf-8')
          for v in ['004b0b34c0e5d94e3eacbeae25710284ef9a7886','BROWSER_ACCEPTANCE_CHECKS=218','BROWSER_ACCEPTANCE=PASS','TSK0310_RENDERED_REACCEPTANCE=PASS','A11Y_CHECKS=667','A11Y_FAILURES=0','A11Y_ACCEPTANCE_FAILURES=0','TSK0321_AUTHORITATIVE_ACCESSIBILITY_REVIEW=PASS']:
              assert v in a11y,v
          print('TSK0310_REFRESH_RETAINED_MECHANIC_A11Y_PROOF=PASS')

          print('TSK0310_REFRESH_STATIC_ACCEPTANCE=PASS')
          PY
      - name: Install isolated browser verifier
        shell: bash
        run: |
          set -euo pipefail
          cd prototype/TSK-0310
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps chromium
      - name: Run fresh rendered browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tsk0310-http.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -rf prototype/TSK-0310/node_modules
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/prototype/TSK-0310/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/tsk0310-http.log; exit 1; fi
          node prototype/TSK-0310/browser-acceptance.mjs | tee /tmp/tsk0310-browser.log
          grep -Fx 'BROWSER_ACCEPTANCE_CHECKS=221' /tmp/tsk0310-browser.log
          grep -Fx 'BROWSER_ACCEPTANCE=PASS' /tmp/tsk0310-browser.log
          echo 'TSK0310_REFRESH_RENDERED_ACCEPTANCE=PASS'
      - name: Verify repository source remained unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prototype/TSK-0310/node_modules
          git diff --check
          git diff --exit-code -- prototype/TSK-0310 brand/system/TSK-0300 brand/identity/TSK-0301
          echo 'TSK0310_REFRESH_SOURCE_UNCHANGED=PASS'
