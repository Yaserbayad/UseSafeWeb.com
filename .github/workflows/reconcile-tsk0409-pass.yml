name: Reconcile TSK-0409 PASS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0409-pass.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify support evidence and reconcile runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object TSK_0409_SUPPORTED_OS_DEVICE_NETWORK_LIMIT_MATRIX_2026-08-28.md)" = "09318534ec097849cbe8c7391e2a1acc3ba5a79a"
          test "$(git hash-object TSK_0409_SUPPORTED_OS_DEVICE_NETWORK_LIMIT_MATRIX_EVIDENCE_2026-08-28.md)" = "87aac1d2affacacdbf1007581bce64d2383f5359"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='')))
          by={r['Task_ID']:r for r in rows}
          t=by['TSK-0409']; n=by['TSK-0143']; alt=by['TSK-0559']; owner_review=by['TSK-0140']; human1=by['TSK-0317']; human2=by['TSK-0319']
          assert t['Dependencies']=='TSK-0408'
          assert t['Priority']=='HIGH' and t['Action_Authority']=='AUTO_ALLOWED' and t['AI_Capability_A0_A4']=='A3'
          assert 'Every supported combination has a tested mechanism or explicit unsupported status' in t['Acceptance_Criteria']
          assert n['Dependencies']=='TSK-0146'
          assert n['Priority']=='MEDIUM' and n['Action_Authority']=='AUTO_ALLOWED' and n['AI_Capability_A0_A4']=='A3'
          assert 'supported platform states' in n['Acceptance_Criteria'] and 'already-configured handling' in n['Acceptance_Criteria']
          assert alt['Priority']=='MEDIUM' and alt['Action_Authority']=='AUTO_ALLOWED'
          assert owner_review['Priority']=='MEDIUM' and owner_review['Action_Authority']=='AUTO_ALLOWED'
          assert 'reviewed by owner' in owner_review['Acceptance_Criteria'].lower()
          assert human1['Action_Authority']=='HUMAN_ONLY' and human2['Action_Authority']=='HUMAN_ONLY'
          e=pathlib.Path('TSK_0409_SUPPORTED_OS_DEVICE_NETWORK_LIMIT_MATRIX_EVIDENCE_2026-08-28.md').read_text()
          assert 'directly satisfies ACC-0409' in e
          assert 'Private Relay' in e and 'VPN' in e and 'Chrome' in e and 'RSK-0002' in e
          p=pathlib.Path('CURRENT_STATE.md'); text=p.read_text()
          assert '### TSK-0316 accepted stable state' in text
          assert '### TSK-0409 accepted stable state' not in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          sec='''### TSK-0409 accepted stable state\n\n`TSK-0409 — Freeze supported OS/device/network install, verification, removal, and known-limit matrix`: **PASS for the provisional internal L4 technical support contract under DEC-0050/CR-0003**. Matrix `TSK_0409_SUPPORTED_OS_DEVICE_NETWORK_LIMIT_MATRIX_2026-08-28.md`, blob `09318534ec097849cbe8c7391e2a1acc3ba5a79a`; independent evidence `TSK_0409_SUPPORTED_OS_DEVICE_NETWORK_LIMIT_MATRIX_EVIDENCE_2026-08-28.md`, blob `87aac1d2affacacdbf1007581bce64d2383f5359`. ACC-0409 is satisfied: the accepted support baseline is limited to Android 9+ phones with usable native Private DNS hostname control and iPhone/iOS 14+ with the approved manual DoH profile; untested device families/networks are explicitly not-yet-supported; install/verification/removal are platform-specific; VPN, Private Relay, browser/app custom DNS, captive portal, managed-network, transport-blocking and IPv6-only/NAT64 limits are explicit.\n\nCurrent first-party source checks confirm Android Private DNS/DoT semantics, Android VPN DNS override capability, Chrome custom Secure DNS, Apple encrypted DNS profile semantics, Apple VPN DNS routing, and Private Relay DNS handling. Exact VPN/Private Relay/browser coexistence remains unproven and therefore cannot inherit S1 `Verified`. `RSK-0002` remains OPEN. This PASS does not authorize LG-05/LG-06, implementation/build, participants, legal completion, payment, public release or launch.\n\n'''
          marker='## Runtime safeguards'; assert marker in text
          text=text.replace(marker,sec+marker,1)
          q=text.rfind('\n## Queue status after current reconciliation'); assert q>=0
          text=text[:q].rstrip()+f'''\n\n## Queue status after current reconciliation\n\n`TSK-0409` is runtime PASS. `TSK-0317` and `TSK-0319` remain HUMAN_ONLY and fenced; `TSK-0187` remains real-user-bound/deferred. `TSK-0140` is not selected despite WBS AUTO_ALLOWED metadata because its current acceptance explicitly requires owner and multi-role review evidence that is not present. The highest-priority executable provisional-L4 AUTO_ALLOWED candidate is `TSK-0143`; `TSK-0559` is also MEDIUM/AUTO_ALLOWED but later in WBS order.\n\n- **Selected next: `TSK-0143 — {n['Title']}`** (L4 / {n['AI_Capability_A0_A4']} / {n['Action_Authority']} / {n['Priority']}).\n- Hard dependency: `TSK-0146` — current PASS.\n- ACC-0143: {n['Acceptance_Criteria']}\n- Selection rationale: dependency-ready MEDIUM/A3/AUTO_ALLOWED; acceptance can be satisfied from current platform/support evidence without representative-parent behavior or a human approval act; earlier WBS order than the remaining MEDIUM AUTO candidate.\n\n## Exact next authoritative step\n\nExecute bounded `TSK-0143`: specify native-device safeguard routing requirements for supported, already-configured, unavailable/unsupported and verification-limited states; use only current authoritative platform evidence; preserve parent-confirmation versus system-verification truth; make stale-guidance/review triggers explicit; carry `RSK-0002`; persist/read back independent ACC-0143 evidence; reconcile runtime; then recompute.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md
          git commit -m "state: accept TSK-0409 and select TSK-0143"
          git push
