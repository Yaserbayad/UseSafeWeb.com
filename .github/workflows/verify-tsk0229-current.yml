name: Verify current TSK-0229 revalidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0229-current.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify current contract and revalidation
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv, pathlib, subprocess

          def req(x, label):
              if not x: raise AssertionError(label)
              print(label+'=PASS')

          artp=pathlib.Path('TSK_0229_ACCOUNTLESS_JOURNEY_DATA_MODEL_EXPIRY_DELETION_NO_LINKAGE_2026-08-28.md')
          oldp=pathlib.Path('TSK_0229_ACCOUNTLESS_JOURNEY_DATA_MODEL_EVIDENCE_2026-08-28.md')
          newp=pathlib.Path('TSK_0229_CURRENT_REVALIDATION_EVIDENCE_2026-08-29.md')
          statep=pathlib.Path('CURRENT_STATE.md')
          art=artp.read_text(encoding='utf-8'); old=oldp.read_text(encoding='utf-8'); new=newp.read_text(encoding='utf-8'); state=statep.read_text(encoding='utf-8')

          req(subprocess.check_output(['git','hash-object',str(artp)],text=True).strip()=='3fa48b11b6c7704ecc3748bcd865f77aa54f5605','ARTIFACT_BLOB')
          req(subprocess.check_output(['git','hash-object',str(oldp)],text=True).strip()=='a087c63a0556db549ead4f40805e435725709251','PRIOR_EVIDENCE_BLOB')
          req(subprocess.check_output(['git','hash-object',str(newp)],text=True).strip()=='7c6bd3b888196f2a487c7b7fe14d11e72bec424b','CURRENT_REVALIDATION_BLOB')

          with pathlib.Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8',newline='') as f:
              by={r['Task_ID']:r for r in csv.DictReader(f)}
          r=by['TSK-0229']
          req(r['Lifecycle_Stage']=='L4' and r['Priority']=='HIGH','WBS_STAGE_PRIORITY')
          req(r['Dependencies']=='TSK-0146','WBS_DEPENDENCY')
          req(r['Action_Authority']=='AUTO_ALLOWED' and r['AI_Capability_A0_A4']=='A3','WBS_AUTHORITY')
          req(r['Acceptance_ID']=='ACC-0229' and r['Verification_ID']=='VER-0229' and r['Evidence_ID']=='EVD-0229','WBS_ACC_VER_EVD')
          req('Only fields necessary for the active journey exist' in r['Acceptance_Criteria'] and 'no browsing history or persistent child profile' in r['Acceptance_Criteria'] and 'expiry/deletion and diagnostic boundaries are testable' in r['Acceptance_Criteria'],'WBS_ACCEPTANCE_TEXT')

          # Substantive ACC invariants in accepted contract.
          for phrase,label in [
              ('prefer in-memory/browser-session state','J0_DEFAULT'),
              ('maximum **24 hours from creation**, non-sliding','J1_TTL'),
              ('within **15 minutes** of the trigger','EARLY_DELETE_BOUND'),
              ('no identity-to-`journey_token` table','NO_IDENTITY_LINK'),
              ('no cross-session stitching','NO_CROSS_SESSION_LINK'),
              ('browsing history, URL history, DNS query history','NO_BROWSING_DNS_HISTORY'),
              ('Raw request/DNS diagnostics are outside J1','DIAGNOSTIC_SEPARATION'),
              ('must not be included in durable product backups','BACKUP_EXCLUSION'),
              ('Fourteen explicit implementation invariants','TESTABILITY_TEXT')
          ]:
              # Testability wording occurs in old evidence rather than artifact for one label.
              hay=(art+'\n'+old).lower()
              req(phrase.lower() in hay,label)
          req('accountless-journey-data-v1' in art,'CONTRACT_VERSION')

          # Current owner sequencing supersedes old human-validation references without rewriting history.
          req('CR-0005' in state and 'DEC-0052' in state,'CURRENT_SEQUENCING_PRESENT')
          req('NOT_APPLICABLE + PASS' in state and 'TSK-0187' in state,'PREPRODUCT_HUMAN_EXCLUSION')
          req('### TSK-0229 accepted stable state' in state and '**PASS' in state[state.index('### TSK-0229 accepted stable state'):state.index('### TSK-0229 accepted stable state')+1200],'EXISTING_RUNTIME_PASS')
          req('superseded for current execution by owner-approved `DEC-0052 / CR-0005`' in new,'REVALIDATION_SUPERSESSION')
          req('not a blocker to this L4 PASS' in new,'RSK0002_NONBLOCKING')
          req('does not require or claim pre-product parent/user/participant validation' in new,'NO_PREPRODUCT_HUMAN_REQUIREMENT')

          # Current register anchors captured explicitly in durable revalidation.
          for ident in ['REQ-0018','REQ-0019','CON-0007','CON-0008','INT-0006','INT-0007','RSK-0001']:
              req(ident in new,'REGISTER_'+ident.replace('-','_'))

          # Current official-source review evidence: exact URLs + review date + no false legal threshold claim.
          for u in [
              'https://eur-lex.europa.eu/legal-content/FR-EN/TXT/?uri=CELEX%3A32016R0679',
              'https://eur-lex.europa.eu/legal-content/FR-EN/ALL/?uri=CELEX%3A32016R0679',
              'https://www.edpb.europa.eu/documents/guideline/guidelines-42019-on-article-25-data-protection-by-design-and-by-default_en',
              'https://www.edpb.europa.eu/system/files/2026-02/edpb-summary-gdpr-data-protection-design-default_en.pdf'
          ]:
              req(u in new,'SOURCE_URL_'+str(abs(hash(u))))
          req(new.count('accessed 2026-08-29')>=4,'SOURCE_REVIEW_DATE')
          req('not legal thresholds' in new and 'does not issue a final legal-compliance conclusion' in new,'NO_UNSUPPORTED_LEGAL_CONCLUSION')

          # Legacy workflow is recognized as stale, not current authority.
          legacy=pathlib.Path('.github/workflows/reconcile-tsk0229-pass.yml').read_text(encoding='utf-8')
          req('CR-0003' in legacy and 'TSK-0187' in legacy and 'CR-0005' not in legacy,'LEGACY_RECONCILER_STALE')

          print('ACC0229_CURRENT=PASS')
          print('VER0229_CURRENT=PASS')
          print('EVD0229_CURRENT=PASS')
          print('TSK0229_CURRENT_REVALIDATION=PASS')
          PY
      - name: Verify clean repository state
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
