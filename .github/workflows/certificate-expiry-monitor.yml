name: UseSafeWeb TLS certificate expiry monitor

on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/certificate-expiry-monitor.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: usesafeweb-tls-expiry-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    env:
      HOSTNAME: dns.usesafeweb.com
      THRESHOLD_DAYS: '30'
      OWNER_LOGIN: Yaserbayad
      ALERT_TITLE: '[ALERT] UseSafeWeb TLS certificate expiry or validation failure'
      TEST_TITLE: '[TEST] UseSafeWeb TLS expiry owner-alert route'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate certificate lifetime and route owner alert
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import datetime, json, os, socket, ssl, subprocess, time, urllib.parse, urllib.request

          host = os.environ['HOSTNAME']
          threshold = int(os.environ['THRESHOLD_DAYS'])
          owner = os.environ['OWNER_LOGIN']
          alert_title = os.environ['ALERT_TITLE']
          test_title = os.environ['TEST_TITLE']
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          event = os.environ['GITHUB_EVENT_NAME']
          production_id = 'bc7f566f-7231-41fb-9fdd-49cf190fd5e1'

          def api(method, path, payload=None):
              url = 'https://api.github.com' + path
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'UseSafeWeb-TLS-Monitor',
                  'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  raw = r.read()
                  return json.loads(raw) if raw else None

          def vm_id():
              try:
                  req = urllib.request.Request(
                      'http://169.254.169.254/metadata/instance/compute?api-version=2021-02-01',
                      headers={'Metadata':'true'})
                  with urllib.request.urlopen(req, timeout=3) as r:
                      return json.load(r).get('vmId','')
              except Exception:
                  return ''

          def check_tls(address, port):
              ctx = ssl.create_default_context()
              with socket.create_connection((address, port), timeout=12) as raw:
                  with ctx.wrap_socket(raw, server_hostname=host) as tls:
                      cert = tls.getpeercert()
                      expiry_epoch = ssl.cert_time_to_seconds(cert['notAfter'])
                      return {
                          'port': port,
                          'days_remaining': int((expiry_epoch - time.time()) // 86400),
                          'not_after': datetime.datetime.fromtimestamp(expiry_epoch, datetime.timezone.utc).isoformat(),
                          'protocol': tls.version(),
                      }

          current_vm_id = vm_id()
          role = 'production-local' if current_vm_id == production_id else 'independent-external'
          results, errors = [], []
          for port in (443, 853):
              address = '127.0.0.1' if role == 'production-local' else host
              try:
                  results.append(check_tls(address, port))
              except Exception as exc:
                  errors.append({'port': port, 'error_type': type(exc).__name__, 'error': str(exc)[:240]})

          status = 'OK' if not errors and len(results) == 2 else 'ERROR'
          minimum_days = min((x['days_remaining'] for x in results), default=None)
          details = {
              'status': status,
              'check_role': role,
              'runner_name': os.environ.get('RUNNER_NAME',''),
              'minimum_days_remaining': minimum_days,
              'results': results,
              'errors': errors,
          }
          print('TLS_MONITOR_RESULT=' + json.dumps(details, sort_keys=True))
          print(f"TLS_MINIMUM_DAYS={minimum_days if minimum_days is not None else 'UNKNOWN'}")

          issues = api('GET', f"/repos/{repo}/issues?state=open&per_page=100") or []
          existing = next((x for x in issues if 'pull_request' not in x and x.get('title') == alert_title), None)
          needs_alert = status != 'OK' or minimum_days is None or minimum_days <= threshold
          safe_details = json.dumps(details, sort_keys=True)

          if needs_alert:
              body = (
                  'The automated TLS certificate monitor detected a condition requiring owner attention.\n\n'
                  f'- Resolver: `{host}`\n- Threshold: {threshold} days\n- Status: {status}\n'
                  f'- Minimum observed days remaining: {minimum_days if minimum_days is not None else "unknown"}\n'
                  f'- Check role: {role}\n- Workflow run: {run_url}\n\n'
                  f'Privacy-safe result: `{safe_details}`\n\n'
                  'Follow `infrastructure/adguard-server/TLS_CERTIFICATE_RENEWAL_RUNBOOK.md`. '
                  'Do not fail open to plaintext DNS and do not place private keys or ACME credentials in this issue.'
              )
              if existing is None:
                  created = api('POST', f'/repos/{repo}/issues', {'title': alert_title, 'body': body, 'assignees':[owner]})
                  print(f"OWNER_ALERT_ROUTE=CREATED issue={created['number']}")
              else:
                  api('POST', f"/repos/{repo}/issues/{existing['number']}/comments", {'body': body})
                  print(f"OWNER_ALERT_ROUTE=UPDATED issue={existing['number']}")
          else:
              if existing is not None:
                  api('POST', f"/repos/{repo}/issues/{existing['number']}/comments", {
                      'body': f'Certificate validation has recovered and minimum remaining lifetime is {minimum_days} days (> {threshold}). Closing this alert.'})
                  api('PATCH', f"/repos/{repo}/issues/{existing['number']}", {'state':'closed'})
                  print(f"OWNER_ALERT_ROUTE=RECOVERED issue={existing['number']}")
              else:
                  print('OWNER_ALERT_ROUTE=HEALTHY_NO_OPEN_ALERT')

          if event == 'push':
              created = api('POST', f'/repos/{repo}/issues', {
                  'title': test_title,
                  'body': f'TSK-0443 installation test: this temporary issue proves the expiry monitor can create a durable alert assigned to the Project Owner. No certificate failure is asserted. Workflow: {run_url}',
                  'assignees':[owner],
              })
              number = created['number']
              api('POST', f'/repos/{repo}/issues/{number}/comments', {
                  'body':'Owner-alert route test completed successfully; closing the temporary test issue.'})
              api('PATCH', f'/repos/{repo}/issues/{number}', {'state':'closed'})
              print(f'OWNER_ALERT_TEST_ISSUE={number}')
              print('OWNER_ALERT_TEST=PASS')

          if status != 'OK':
              raise SystemExit('TLS validation failed; owner alert route executed')
          PY
