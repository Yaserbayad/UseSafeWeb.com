name: Audit HIGH L4 AUTO_ALLOWED frontier

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/high-l4-frontier-trigger.txt']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Enumerate exact L4 HIGH AUTO_ALLOWED frontier and dependency chains
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, re, subprocess
          from pathlib import Path
          with Path('Plans/Master/WBS/master-wbs.csv').open(newline='', encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          byid={r['Task_ID']:r for r in rows if r.get('Task_ID')}
          cand=[r for r in rows if r.get('Lifecycle_Stage','').strip()=='L4' and r.get('Priority','').strip().upper()=='HIGH' and r.get('Action_Authority','').strip().upper()=='AUTO_ALLOWED']
          print('L4_HIGH_AUTO_COUNT='+str(len(cand)))
          print('L4_HIGH_AUTO_IDS='+','.join(r['Task_ID'] for r in cand))
          focus=['TSK-0229','TSK-0298','TSK-0299','TSK-0300','TSK-0301','TSK-0302','TSK-0307','TSK-0308','TSK-0310','TSK-0311','TSK-0315','TSK-0316','TSK-0317','TSK-0318','TSK-0319','TSK-0320','TSK-0327','TSK-0331','TSK-0408','TSK-0409','TSK-0558','TSK-0628']
          for tid in focus:
              r=byid.get(tid)
              if r:
                  print('ROW|{}|stage={}|priority={}|plan={}|wbs_exec={}|cap={}|authority={}|critical={}|deps={}|title={}'.format(tid,r.get('Lifecycle_Stage',''),r.get('Priority',''),r.get('Plan_Status',''),r.get('Execution_State',''),r.get('AI_Capability_A0_A4',''),r.get('Action_Authority',''),r.get('Critical_Path',''),r.get('Dependencies',''),r.get('Title','')))
          def deps(r):
              return [x.strip() for x in re.split(r'[;,]',r.get('Dependencies','')) if x.strip().startswith('TSK-')]
          rev={tid:[] for tid in byid}
          for r in rows:
              for d in deps(r): rev.setdefault(d,[]).append(r['Task_ID'])
          for root in ['TSK-0299','TSK-0316','TSK-0318','TSK-0628']:
              seen={root}; q=[root]; edges=[]
              while q:
                  a=q.pop(0)
                  for b in rev.get(a,[]):
                      edges.append((a,b))
                      if b not in seen:
                          seen.add(b); q.append(b)
              print('DESC|{}|count={}|ids={}'.format(root,len(seen)-1,','.join(sorted(seen-{root}))))
              for a,b in edges:
                  rr=byid.get(b,{})
                  print('EDGE|{}|{}|stage={}|priority={}|plan={}|wbs_exec={}|authority={}'.format(a,b,rr.get('Lifecycle_Stage',''),rr.get('Priority',''),rr.get('Plan_Status',''),rr.get('Execution_State',''),rr.get('Action_Authority','')))
          graph=Path('Plans/Master/RELATIONSHIP_INDEX.yaml').read_text(encoding='utf-8')
          for tid in ['TSK-0299','TSK-0316','TSK-0318','TSK-0628']:
              print('GRAPH_MENTIONS|{}|{}'.format(tid,graph.count(tid)))
          print('GRAPH_BLOB='+subprocess.check_output(['git','hash-object','Plans/Master/RELATIONSHIP_INDEX.yaml'],text=True).strip())
          print('WBS_BLOB='+subprocess.check_output(['git','hash-object','Plans/Master/WBS/master-wbs.csv'],text=True).strip())
          print('RUNTIME_BLOB='+subprocess.check_output(['git','hash-object','CURRENT_STATE.md'],text=True).strip())
          PY
