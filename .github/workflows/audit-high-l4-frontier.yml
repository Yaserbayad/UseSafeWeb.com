name: Audit HIGH L4 AUTO_ALLOWED frontier

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/high-l4-frontier-trigger.txt']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Discover canonical HIGH AUTO_ALLOWED L4 encoding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json, re, subprocess
          from pathlib import Path
          known={'TSK-0318','TSK-0316','TSK-0299','TSK-0327','TSK-0319'}
          with Path('Plans/Master/WBS/master-wbs.csv').open(newline='', encoding='utf-8-sig') as f:
              r=csv.DictReader(f); rows=list(r); headers=r.fieldnames or []
          print('WBS_HEADERS='+json.dumps(headers, ensure_ascii=False))
          for row in rows:
              if row.get('Task_ID') in known:
                  print('KNOWN_ROW='+json.dumps(row, ensure_ascii=False, sort_keys=True))
          hi=[]
          for row in rows:
              if str(row.get('Priority','')).strip().upper()=='HIGH' and str(row.get('Action_Authority','')).strip().upper()=='AUTO_ALLOWED':
                  hi.append(row)
          print(f'HIGH_AUTO_COUNT={len(hi)}')
          for row in hi:
              print('HIGH_AUTO_ROW='+json.dumps(row, ensure_ascii=False, sort_keys=True))
          print('GRAPH_BLOB_INPUT_SHA='+subprocess.check_output(['git','hash-object','Plans/Master/RELATIONSHIP_INDEX.yaml'], text=True).strip())
          print('WBS_BLOB_INPUT_SHA='+subprocess.check_output(['git','hash-object','Plans/Master/WBS/master-wbs.csv'], text=True).strip())
          print('RUNTIME_BLOB_INPUT_SHA='+subprocess.check_output(['git','hash-object','CURRENT_STATE.md'], text=True).strip())
          PY
