name: Inspect current L4 queue
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-l4-queue-20260831.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect authoritative L4 queue
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          # Recompute direct successor facts after current TSK-0312 PASS.
          python3 .github/scripts/inspect_l4_queue_20260831.py
          git diff --check
          test -z "$(git status --porcelain)"
