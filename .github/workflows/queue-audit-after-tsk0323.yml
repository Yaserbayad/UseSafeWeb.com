name: Audit post-TSK-0323 eligible queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/queue-audit-after-tsk0323.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Derive current L4 AUTO_ALLOWED queue
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv, pathlib, re

          state = pathlib.Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          with pathlib.Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))
          by = {r['Task_ID']: r for r in rows}

          # Runtime/current-evidence PASS extraction. Do not use historical prose alone.
          pass_ids = set()
          m = re.search(r'## Current technical task state\s+### PASS\s+(.*?)(?=\n### |\n## )', state, re.S)
          if m:
              pass_ids.update(re.findall(r'TSK-\d{4}', m.group(1)))

          # Task-specific accepted/PASS sections appended during governed reconciliation.
          for sec in re.split(r'(?=\n## TSK-)', state):
              head = sec[:1800]
              ids = set(re.findall(r'TSK-\d{4}', head[:600]))
              if ids and (
                  re.search(r'(?i)accepted stable state', head)
                  or re.search(r'(?m)^`TSK-\d{4}.*?\*\*PASS\*\*', head)
                  or re.search(r'(?m)^`TSK-\d{4}.*?: \*\*PASS\*\*', head)
              ):
                  pass_ids.update(ids)

          # Current CR-0005 exclusion-PASS authority.
          if re.search(r'all 31 L3 tasks plus `TSK-0187`, `TSK-0326`, and `TSK-0336` are `NOT_APPLICABLE \+ PASS`', state):
              pass_ids.update({'TSK-0187','TSK-0326','TSK-0336'})
              for r in rows:
                  if r.get('Lifecycle_Stage') == 'L3' and r.get('Plan_Status') == 'NOT_APPLICABLE':
                      pass_ids.add(r['Task_ID'])

          # WBS rows already dispositioned COMPLETED_CANDIDATE+PASS are not executable work.
          # They can satisfy a dependency only when they also carry durable evidence reference or
          # are explicitly present in current runtime PASS evidence.
          completed_nonexec = set()
          completed_evidenced = set()
          for r in rows:
              if r.get('Plan_Status') == 'COMPLETED_CANDIDATE' and r.get('Execution_State') == 'PASS':
                  completed_nonexec.add(r['Task_ID'])
                  if (r.get('Evidence_Reference') or '').strip():
                      completed_evidenced.add(r['Task_ID'])

          def dep_state(tid):
              dr = by.get(tid)
              if not dr:
                  return 'MISSING'
              if tid in pass_ids:
                  return 'PASS'
              if dr.get('Plan_Status') == 'NOT_APPLICABLE' and dr.get('Execution_State') == 'PASS':
                  return 'EXCLUSION_PASS'
              if tid in completed_evidenced:
                  return 'EVIDENCED_COMPLETED_PASS'
              return 'UNSAT'

          print('RUNTIME_PASS_COUNT=' + str(len(pass_ids)))
          print('COMPLETED_NONEXEC_COUNT=' + str(len(completed_nonexec)))
          print('COMPLETED_EVIDENCED_COUNT=' + str(len(completed_evidenced)))
          for tid in ('TSK-0145','TSK-0146','TSK-0147','TSK-0309','TSK-0310','TSK-0322','TSK-0323','TSK-0326','TSK-0327','TSK-0336','TSK-0558'):
              if tid in by:
                  print('PROBE=' + '|'.join([tid, by[tid].get('Plan_Status',''), by[tid].get('Execution_State',''), dep_state(tid)]))

          priority_rank = {'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          current=[]
          deferred=[]
          for idx,r in enumerate(rows):
              if r.get('Lifecycle_Stage') != 'L4' or r.get('Action_Authority') != 'AUTO_ALLOWED':
                  continue
              tid = r['Task_ID']
              if tid in pass_ids or tid in completed_nonexec:
                  continue
              if r.get('Plan_Status') == 'NOT_APPLICABLE':
                  continue
              if r.get('Plan_Status') == 'DEFERRED':
                  deferred.append((idx,r))
                  continue
              # Current executable planning disposition must be PLANNED.
              if r.get('Plan_Status') != 'PLANNED':
                  continue
              deps=[d.strip() for d in re.split(r'[;,]', r.get('Dependencies','')) if d.strip()]
              states=[(d,dep_state(d)) for d in deps]
              ready=all(s in {'PASS','EXCLUSION_PASS','EVIDENCED_COMPLETED_PASS'} for _,s in states)
              current.append((not ready, priority_rank.get(r.get('Priority'),9), idx, r, states))

          current.sort(key=lambda x:(x[0],x[1],x[2]))
          print('CURRENT_L4_AUTO_CANDIDATES_BEGIN')
          for notready,_,idx,r,states in current:
              print('|'.join([
                  'READY' if not notready else 'NOT_READY',
                  str(idx),r['Task_ID'],r.get('Priority',''),r.get('Title',''),
                  r.get('Plan_Status',''),r.get('Execution_State',''),
                  r.get('Action_Authority',''),r.get('AI_Capability_A0_A4',''),
                  r.get('Dependencies',''),';'.join(d+':'+s for d,s in states),
                  r.get('Acceptance_ID','')
              ]))
          print('CURRENT_L4_AUTO_CANDIDATES_END')
          print('DEFERRED_L4_AUTO_COUNT=' + str(len(deferred)))

          ready=[x for x in current if not x[0]]
          if ready:
              r=ready[0][3]
              print('SELECTED=' + r['Task_ID'])
              print('SELECTED_TITLE=' + r.get('Title',''))
              print('SELECTED_PRIORITY=' + r.get('Priority',''))
              print('SELECTED_DEPENDENCIES=' + r.get('Dependencies',''))
              print('SELECTED_TRIGGER=' + r.get('Trigger',''))
              print('SELECTED_PRECONDITIONS=' + r.get('Preconditions',''))
              print('SELECTED_INPUTS=' + r.get('Inputs',''))
              print('SELECTED_OUTPUT=' + r.get('Output/Artifact',''))
              print('SELECTED_ACC_ID=' + r.get('Acceptance_ID',''))
              print('SELECTED_ACC=' + r.get('Acceptance_Criteria',''))
              print('SELECTED_VER_ID=' + r.get('Verification_ID',''))
              print('SELECTED_VER=' + r.get('Verification_Method',''))
              print('SELECTED_EVD_ID=' + r.get('Evidence_ID',''))
              print('SELECTED_EVD=' + r.get('Evidence_Required',''))
              print('SELECTED_REQ=' + r.get('Requirement_Reference',''))
              print('SELECTED_INTERFACE=' + r.get('Interface_Reference',''))
              print('SELECTED_RISK=' + r.get('Risk_Reference',''))
              print('SELECTED_EXECUTION=' + r.get('Execution_Instructions',''))
              print('SELECTED_TOOLS=' + r.get('Required_Tools_or_Access',''))
              print('SELECTED_ESCALATION=' + r.get('Escalation_Condition',''))
          else:
              print('SELECTED=NONE')
          print('POST_TSK0323_QUEUE_AUDIT_V2=PASS')
          PY
