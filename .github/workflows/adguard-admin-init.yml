name: Initialize restricted AdGuard administration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adguard-admin-init.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize TSK-0201 restricted administration
        shell: bash
        env:
          EXPECTED_SCRIPT_BLOB: c3d6a62be2f4fb3dce26db654339ff553c4b5195
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          sudo -n true

          script='infrastructure/adguard-server/initialize-admin.sh'
          [[ "$(git hash-object "$script")" == "${EXPECTED_SCRIPT_BLOB}" ]]
          bash -n "$script"
          echo 'admin_init_artifact=PASS'

          set +e
          bash "$script" | tee /tmp/usesafeweb-tsk-0201.log
          rc=${PIPESTATUS[0]}
          set -e
          [[ "$rc" -eq 0 ]]
          grep -q '^TSK_0201_MUTATION=PASS$' /tmp/usesafeweb-tsk-0201.log
          echo 'TSK_0201_WORKFLOW=PASS'
