name: Inspect CR-0003 L3 to L4 impact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-cr0003-l3-l4-impact.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Inspect authoritative boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, pathlib, re
          root=pathlib.Path('Plans/Master')
          p=root/'WBS/master-wbs.csv'
          rows=list(csv.DictReader(p.open(newline='', encoding='utf-8-sig')))
          def stage(r): return (r.get('Lifecycle_Stage') or '').strip()
          def deps(r): return [x.strip() for x in (r.get('Dependencies') or '').split(';') if x.strip()]
          l3_ids={r['Task_ID'].strip() for r in rows if stage(r)=='L3'}
          l4=[r for r in rows if stage(r)=='L4']; l4_ids={r['Task_ID'].strip() for r in l4}
          roots=[r for r in l4 if not any(d in l4_ids for d in deps(r))]
          cross=[r for r in l4 if any(d in l3_ids for d in deps(r))]
          l3_with_l4=[r for r in rows if (r.get('Task_ID') or '').strip() in l3_ids and any((r.get('Task_ID') or '').strip() in deps(x) for x in l4)]
          cols=['Lifecycle_Stage','Plan_Status','Execution_State','Priority','Critical_Path','Dependencies','Trigger','Preconditions','Acceptance_ID','Acceptance_Criteria','Verification_Method','Evidence_Required','Primary_Owner','AI_Capability_A0_A4','Action_Authority','Requirement_Reference','Constraint_Reference','Interface_Reference','Gate_Reference','Source_Reference','Notes']
          out=['# CR-0003 L3 to L4 impact inspection','',f'- WBS rows: {len(rows)}',f'- L3 tasks: {len(l3_ids)}',f'- L4 tasks: {len(l4)}',f'- L4 roots (no L4 predecessor): {len(roots)}',f'- L4 tasks with direct L3 dependency: {len(cross)}','']
          def emit(title, items):
              out.extend([f'## {title}',''])
              for r in items:
                  out.append(f"### {(r.get('Task_ID') or '').strip()} — {(r.get('Title') or '').strip()}")
                  for c in cols:
                      v=(r.get(c) or '').strip()
                      if v: out.append(f'- **{c}:** {v}')
                  out.append('')
          emit('L3 tasks directly feeding L4', l3_with_l4)
          emit('L4 roots', roots)
          emit('L4 tasks with direct L3 dependencies', cross)
          likely=[]
          for r in rows:
              txt=' '.join([(r.get('Title') or ''),(r.get('Acceptance_Criteria') or ''),(r.get('Notes') or '')]).lower()
              if stage(r)=='L3' and any(k in txt for k in ['experiment-1','behavioral','behavioural','gate','proceed','pivot','outcome','canonical state']): likely.append(r)
          emit('L3 exit / gate / outcome candidates', likely)
          out += ['## Cross-authority references requiring CR-0003 review','']
          terms=re.compile(r'LG-05|behavioral validation|behavioural validation|validated behavior|validated behaviour|before expensive software build|before integrated software build', re.I)
          for f in sorted(root.rglob('*')):
              if not f.is_file() or f.suffix not in {'.md','.yaml','.yml'}: continue
              if 'Generated' in f.parts: continue
              try: lines=f.read_text(encoding='utf-8').splitlines()
              except UnicodeDecodeError: continue
              matches=[(i,l.strip()) for i,l in enumerate(lines,1) if terms.search(l)]
              if matches:
                  out.append(f'### {f.relative_to(root).as_posix()}')
                  for i,l in matches: out.append(f'- L{i}: {l}')
                  out.append('')
          pathlib.Path('CR_0003_L3_L4_IMPACT_INSPECTION_2026-08-28.md').write_text('\n'.join(out)+'\n', encoding='utf-8')
          print('CR0003_IMPACT_INSPECTION=PASS')
          PY
      - name: Publish inspection report
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CR_0003_L3_L4_IMPACT_INSPECTION_2026-08-28.md
          git commit -m "governance: extend CR-0003 L3 to L4 impact inspection"
          git push
