name: Verify TSK-0045 current revalidation

on:
  pull_request:
    branches: [main]
    paths: ['.github/diagnostics/tsk0045-current-verifier-trigger.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Independently verify current TSK-0045 acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,re,subprocess
          from pathlib import Path
          E={
            'Plans/Master/WBS/master-wbs.csv':'b27a0c5df2f5636d8ed71051e9e26a68959a2616',
            'Plans/Master/RELATIONSHIP_INDEX.yaml':'c108d2c162bcea2ee4cc01def46d0487a9501032',
            'CURRENT_STATE.md':'60364cebcdf91f052311a40e3af83f6c984fb18f',
            'TSK_0045_POST_CR0008_DUAL_MODE_MAINTAINABILITY_DEPLOYMENT_COST_NFR_REVALIDATION_2026-09-02.md':'0df1b4747afea4521e4e98b0728c83750ed2b547',
            'TSK_0045_MAINTAINABILITY_DEPLOYMENT_COST_CONTROL_NFR_2026-08-28.md':'cec8ba92151318cc399586ea230ccc399eea6e8b',
            'TSK_0045_MAINTAINABILITY_DEPLOYMENT_COST_CONTROL_NFR_EVIDENCE_2026-08-28.md':'e8f79871379288e5595cdeef0deb3a1997b3e223',
            'TSK_0314_POST_CR0008_DUAL_MODE_ACCESSIBILITY_BROWSER_DEVICE_NFR_REVALIDATION_2026-09-02.md':'e193abd8398d2c91bc113dfc88ad605e67b475f6',
            'TSK_0314_POST_CR0008_CURRENT_REVALIDATION_EVIDENCE_2026-09-02.md':'924d93313eed32daf5811650758fef2955fad738',
          }
          def blob(p): return subprocess.check_output(['git','hash-object',p],text=True).strip()
          def req(text,concepts,label):
              missing=[x for x in concepts if x not in text]
              if missing: raise AssertionError(f'{label} missing: {missing}')
          for p,h in E.items():
              assert Path(p).exists(),f'missing {p}'
              actual=blob(p); assert actual==h,f'hash drift {p}: {actual} != {h}'
          print('TSK0045_INPUT_HASHES=PASS')
          with open('Plans/Master/WBS/master-wbs.csv',newline='',encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          row=next(r for r in rows if r.get('Task_ID')=='TSK-0045')
          assert row['Lifecycle_Stage']=='L4' and row['Priority']=='MEDIUM'
          assert row['AI_Capability_A0_A4']=='A3' and row['Action_Authority']=='AUTO_ALLOWED'
          assert [d.strip() for d in (row['Dependencies'] or '').split(';') if d.strip()]==['TSK-0314']
          assert (row['Acceptance_ID'],row['Verification_ID'],row['Evidence_ID'])==('ACC-0045','VER-0045','EVD-0045')
          acc=(row['Acceptance_Criteria'] or '').lower()
          req(acc,['repeatable deployment','versioning','rollback','documentation ownership','dependency update cadence','cost tagging','budgets','monthly cost-report'], 'ACC-0045')
          print('TSK0045_CURRENT_WBS=PASS')
          state=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          m=re.search(r'^## TSK-0314 current accepted stable state.*?(?=^## |\Z)',state,re.M|re.S)
          assert m and '**PASS**' in m.group(0) and '924d93313eed32daf5811650758fef2955fad738' in m.group(0)
          print('TSK0045_CURRENT_TSK0314_PREDECESSOR=PASS')
          doc=Path('TSK_0045_POST_CR0008_DUAL_MODE_MAINTAINABILITY_DEPLOYMENT_COST_NFR_REVALIDATION_2026-09-02.md').read_text(encoding='utf-8'); low=doc.lower()
          assert len([x for x in doc.splitlines() if x.startswith('## ')])>=17
          print('TSK0045_STRUCTURE=PASS')
          req(low,['github `main`','direct ubuntu host','future web/account application','accountless core','auth-provider','datastore','raw dns query history'], 'deployment architecture')
          req(low,['owner-provided azure vm/control-plane','routine reversible technical deployment','already-budgeted','material/unbudgeted spend','named-market activation'], 'authority split')
          print('TSK0045_DEPLOYMENT_AUTHORITY=PASS')
          req(low,['source pin','target guard','authority/gate check','pre-state capture','recovery readiness','pre-deploy validation','single bounded mutation','target read-back','regression','evidence publication','runtime reconciliation'], 'repeatable deployment')
          assert 'ambiguous consequential side effects are reconciled before replay' in low
          assert 'no mandatory staging/pilot environment' in low and 'lg-09' in low
          print('TSK0045_REPEATABLE_DEPLOYMENT=PASS')
          req(low,['semantic versioning','git commit sha','schema/application version','target/environment identity','generated outputs never outrank'], 'versioning')
          req(low,['rollback is designed before mutation','datastore schema','session/token/provider','ownership/authorization','account/device deletion','accountless-core continuity'], 'rollback')
          print('TSK0045_VERSION_ROLLBACK=PASS')
          req(low,['at least weekly','at least monthly','security advisories','adguard/nginx','future web/auth/datastore'], 'dependency cadence')
          print('TSK0045_DEPENDENCY_CADENCE=PASS')
          req(low,['project=usesafeweb','component=dns|webapp|auth|datastore|backup|monitoring|shared','no personal/participant data','not implicitly inherited','usage records','8–24 hours','understand-cost-mgt-data','enable-tag-inheritance'], 'cost attribution')
          req(low,['unfrozen','actual >=50%','actual >=80%','actual >=100%','forecast >=100%','monitoring/accountability evidence'], 'budget controls')
          print('TSK0045_COST_TAG_BUDGET=PASS')
          s12=re.search(r'## 12\. Monthly cost-report inputs\n(.*?)(?=\n## 13\.)',doc,re.S)
          assert s12 and len(re.findall(r'^\d+\.',s12.group(1),re.M))>=15
          req(s12.group(1).lower(),['billing scope','actual','unfrozen','forecast','environment','component','untagged','anomal','evidence/export timestamp'], 'monthly report')
          print('TSK0045_MONTHLY_COST_REPORT=PASS')
          req(low,['current tsk-0314','accessibility/browser/device','tsk-0046/0538','no dns/browsing/activity history','no azure action','does not deploy/resize/create/delete azure resources'], 'preservation/non-inference')
          print('TSK0045_PRESERVATION_NONINFERENCE=PASS')
          hist=Path('TSK_0045_MAINTAINABILITY_DEPLOYMENT_COST_CONTROL_NFR_2026-08-28.md').read_text(encoding='utf-8').lower()
          req(hist,['repeatable deployment contract','rollback contract','dependency update cadence','cost-attribution tag contract','monthly cost-report inputs'], 'historical core')
          print('TSK0045_HISTORICAL_CORE_PRESERVED=PASS')
          print('TSK0045_CURRENT_ACC=PASS')
          print('TSK0045_CURRENT_VER=PASS')
          print('TSK0045_CURRENT_EVD_READY=PASS')
          print('TSK0045_CURRENT_REVALIDATION=PASS')
          PY
