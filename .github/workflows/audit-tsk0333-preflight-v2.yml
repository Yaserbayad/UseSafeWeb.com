name: Audit TSK-0333 preflight v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-tsk0333-preflight-v2.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact TSK-0333 contract and all direct predecessors
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          test "$(git rev-parse HEAD:Plans/Master/WBS/master-wbs.csv)" = "f23b4f017d1baf73258fa30ecd71549bbfe1b815"
          test "$(git rev-parse HEAD:CURRENT_STATE.md)" = "75d077675ed09d7d5e42f470416b486258bd0857"
          python3 - <<'PY'
          import csv,re
          from pathlib import Path
          rows=list(csv.DictReader(Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='')))
          r=next(x for x in rows if x['Task_ID'].strip()=='TSK-0333')
          assert r['Title'].strip()=='Assemble end-to-end responsive interactive prototype'
          assert r['Lifecycle_Stage'].strip()=='L4'
          assert r['Dependencies'].strip()=='TSK-0335; TSK-0334; TSK-0146'
          assert r['Action_Authority'].strip()=='AUTO_ALLOWED'
          assert r['Trigger'].strip()=='Applicable lifecycle/gate and all hard dependencies satisfied.'
          s=Path('CURRENT_STATE.md').read_text(encoding='utf-8')
          for dep in ['TSK-0335','TSK-0334','TSK-0146']:
              assert re.search(rf'## {re.escape(dep)} accepted stable state',s), dep
              segment=s[s.index(f'## {dep} accepted stable state'):]
              segment=segment[:segment.find('\n## ',1) if segment.find('\n## ',1)>=0 else len(segment)]
              assert '**PASS**' in segment, dep
              print(f'DEPENDENCY_{dep}=PASS')
          print('TSK0333_ACCEPTANCE='+r['Acceptance_Criteria'])
          print('TSK0333_VERIFICATION='+r['Verification_Method'])
          print('TSK0333_EVIDENCE='+r['Evidence_Required'])
          print('TSK0333_WBS_PREFLIGHT=PASS')
          print('TSK0333_ELIGIBILITY_DIRECT=PASS')
          PY
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
