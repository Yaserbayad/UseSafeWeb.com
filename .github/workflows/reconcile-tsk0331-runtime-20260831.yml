name: Reconcile TSK-0331 runtime acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0331-runtime-20260831.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile exact TSK-0331 PASS into CURRENT_STATE
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 .github/scripts/reconcile_tsk0331_runtime_20260831.py
          git diff --check
          grep -Fq '## TSK-0331 current accepted stable state — 2026-08-31 — POST-CR-0007' CURRENT_STATE.md
          grep -Fq 'Final run/job `33419292638 / 99577450844`: **SUCCESS**' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept current post-CR-0007 TSK-0331'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          echo "TSK0331_RUNTIME_RECONCILIATION=PASS"
          echo "TSK0331_RUNTIME_COMMIT=$(git rev-parse HEAD)"
          echo "TSK0331_RUNTIME_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
