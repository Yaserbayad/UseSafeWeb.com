name: Verify TSK-0323 instruction catalogue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0323.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify catalogue contract and evidence inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          python3 - <<'PY'
          import csv, json, pathlib, subprocess

          root = pathlib.Path('.')
          md_path = root/'content/TSK-0323/DEVICE_SERVICE_INSTRUCTION_CATALOGUE.md'
          js_path = root/'content/TSK-0323/CATALOGUE.json'
          state_path = root/'CURRENT_STATE.md'
          wbs_path = root/'Plans/Master/WBS/master-wbs.csv'
          data = json.loads(js_path.read_text(encoding='utf-8'))
          md = md_path.read_text(encoding='utf-8')
          state = state_path.read_text(encoding='utf-8')

          def req(cond, label):
              if not cond:
                  raise AssertionError(label)
              print(label + '=PASS')

          req(data['schema'] == 'usesafeweb.device-service-instructions.v1', 'SCHEMA')
          req(data['task_id'] == 'TSK-0323' and data['version'] == '1.0.0', 'IDENTITY_VERSION')
          req(data['owner'] == 'Content' and data['status'] == 'internal_l4', 'OWNER_STATUS')
          req(data['sequencing'] == 'DEC-0052/CR-0005', 'SEQUENCING')
          req(data['human_validation'] == 'deferred_to_L8_not_claimed_pre_product', 'CR0005_HUMAN_VALIDATION_DISPOSITION')
          req(data['visible_product'] == 'SafeWeb', 'VISIBLE_IDENTITY')
          req(data['technical_endpoints']['android_private_dns_hostname'] == 'dns.usesafeweb.com', 'ANDROID_ENDPOINT')
          req(data['technical_endpoints']['iphone_doh_url'] == 'https://dns.usesafeweb.com/dns-query', 'IOS_ENDPOINT')

          required_ids = {
              'DEV-AND-DNS-SETUP','DEV-AND-DNS-VERIFY','DEV-AND-DNS-REMOVE',
              'DEV-IOS-DNS-SETUP','DEV-IOS-DNS-VERIFY','DEV-IOS-DNS-REMOVE',
              'DEV-COMMON-CONFLICT','DEV-COMMON-NOT-COVERED','DEV-COMMON-RECOVERY',
              'DEV-IOS-NATIVE','DEV-AND-NATIVE','SVC-ONE-RELEVANT'
          }
          records = data['records']
          ids = [r['id'] for r in records]
          req(len(records) == 12 and len(set(ids)) == 12 and set(ids) == required_ids, 'RECORD_SET')
          fields = ['id','version','platform_version_applicability','source_references','last_verified','owner','expected_result','fallback','unsupported_state','test_case','review_trigger']
          for r in records:
              req(all(k in r and r[k] not in ('', None, []) for k in fields), 'FIELDS_' + r['id'])
              req(r['version'] == '1.0.0' and r['last_verified'] == '2026-08-29', 'VERSION_DATE_' + r['id'])
              req(r['test_case'] in md, 'TEST_BINDING_' + r['id'])
          req(len({r['test_case'] for r in records}) == 12, 'UNIQUE_TEST_CASES')

          for sid, src in data['canonical_sources'].items():
              p = root/src['path']
              req(p.is_file(), 'SOURCE_EXISTS_' + sid)
              actual = subprocess.check_output(['git','hash-object',str(p)], text=True).strip()
              req(actual == src['blob'], 'SOURCE_BLOB_' + sid)
          req(subprocess.check_output(['git','hash-object',str(md_path)], text=True).strip() == 'bbe9ed90b205f2ca852ebdaefedf054446dd7f91', 'CATALOGUE_MD_BLOB')
          req(subprocess.check_output(['git','hash-object',str(js_path)], text=True).strip() == '842e18c5666a82d53e2d348715dd6b9198daa44c', 'CATALOGUE_JSON_BLOB')
          print('SOURCE_BLOB_PINS=PASS')

          with wbs_path.open(encoding='utf-8', newline='') as f:
              by = {r['Task_ID']: r for r in csv.DictReader(f)}
          row = by['TSK-0323']
          req(row['Lifecycle_Stage'] == 'L4', 'WBS_LIFECYCLE')
          req(row['Dependencies'].strip() == 'TSK-0322', 'WBS_DEPENDENCY')
          req(row['Action_Authority'] == 'AUTO_ALLOWED' and row['AI_Capability_A0_A4'] == 'A3', 'WBS_ACTION_AUTHORITY')
          req(row['Acceptance_ID'] == 'ACC-0323', 'WBS_ACCEPTANCE_ID')
          req(row['Acceptance_Criteria'] == 'Every instruction has platform/version applicability, source reference, last verified date, owner, expected result, fallback, and test case; unsupported states are explicit.', 'WBS_ACCEPTANCE_TEXT')
          req('TSK-0322' in state and 'PASS' in state[state.find('TSK-0322'):state.find('TSK-0322')+2500], 'PREDECESSOR_RUNTIME_PASS')
          print('WBS_AUTHORITY=PASS')

          byid = {r['id']: r for r in records}
          req('dns.usesafeweb.com' in byid['DEV-AND-DNS-SETUP']['expected_result'] and 'https://' not in byid['DEV-AND-DNS-SETUP']['expected_result'], 'SCENARIO_ANDROID_SETUP')
          req('S1 only' in byid['DEV-AND-DNS-VERIFY']['expected_result'], 'SCENARIO_ANDROID_VERIFY')
          req('S6' in byid['DEV-AND-DNS-REMOVE']['expected_result'], 'SCENARIO_ANDROID_REMOVE')
          req('https://dns.usesafeweb.com/dns-query' in byid['DEV-IOS-DNS-SETUP']['expected_result'] and 'explicitly approves' in byid['DEV-IOS-DNS-SETUP']['expected_result'], 'SCENARIO_IOS_SETUP')
          req('S1 only' in byid['DEV-IOS-DNS-VERIFY']['expected_result'] and 'S5' in byid['DEV-IOS-DNS-VERIFY']['unsupported_state'], 'SCENARIO_IOS_VERIFY')
          req('S6' in byid['DEV-IOS-DNS-REMOVE']['expected_result'], 'SCENARIO_IOS_REMOVE')
          req('S3 only' in byid['DEV-COMMON-CONFLICT']['expected_result'] and 'S5/S4' in byid['DEV-COMMON-CONFLICT']['expected_result'], 'SCENARIO_CONFLICT')
          req('S4 Not covered' in byid['DEV-COMMON-NOT-COVERED']['expected_result'], 'SCENARIO_NOT_COVERED')
          req('S6' in byid['DEV-COMMON-RECOVERY']['expected_result'], 'SCENARIO_RECOVERY')
          req('S2' in byid['DEV-IOS-NATIVE']['expected_result'] and 'no S1' in byid['DEV-IOS-NATIVE']['expected_result'], 'SCENARIO_IOS_NATIVE')
          req('S2' in byid['DEV-AND-NATIVE']['expected_result'] and 'no S1' in byid['DEV-AND-NATIVE']['expected_result'], 'SCENARIO_ANDROID_NATIVE')
          req('Zero services is valid' in byid['SVC-ONE-RELEVANT']['expected_result'] and 'No named external service' in byid['SVC-ONE-RELEVANT']['unsupported_state'], 'SCENARIO_SERVICE')
          print('SCENARIO_TESTS=12/12 PASS')

          unsupported = '\n'.join(data['unsupported_global']).lower()
          for token in ['android below 9','android tablet','iphone below ios 14','ipad','managed','captive-portal','ipv6-only','vpn/private relay','named external service','review trigger']:
              req(token in unsupported, 'UNSUPPORTED_' + token.upper().replace(' ','_').replace('/','_').replace('-','_'))
          prohibited_named_services = ['tiktok','youtube','roblox','instagram','snapchat','whatsapp']
          payload = json.dumps(data, ensure_ascii=False).lower()
          req(not any(x in payload for x in prohibited_named_services), 'NO_HARDCODED_NAMED_SERVICE')
          req('no instruction adds a mandatory safeweb account' in md.lower(), 'NO_MANDATORY_ACCOUNT_CLAIM')
          req('browsing-history collection' in md.lower() and 'no instruction adds' in md.lower(), 'PRIVACY_FENCE')
          req('turkish/arabic/rtl' in md.lower() and 'technical endpoints remain ltr/untranslated' in md.lower(), 'I18N_RTL_FENCE')
          for bad in ['100% safe', 'your child is safe', 'fully protected', 'blocks everything harmful']:
              req(bad not in md.lower(), 'NO_PROHIBITED_CLAIM_' + bad.upper().replace(' ','_').replace('%','PCT'))
          print('CLAIMS_PRIVACY_I18N=PASS')

          req(len(data['external_sources']) == 8, 'EXTERNAL_SOURCE_COUNT')
          for sid, src in data['external_sources'].items():
              req(src.get('url','').startswith('https://') and src.get('checked') == '2026-08-29', 'EXTERNAL_SOURCE_' + sid)
          print('CATALOGUE_JSON=PASS')
          print('RECORD_COUNT=12')
          print('TSK0323_VERIFICATION=PASS')
          PY

      - name: Verify clean repository state
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'REPOSITORY_CLEAN=PASS'
