name: AdGuard runner service bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adguard-runner-service.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  install-service:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Install persistent runner service and schedule handoff
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${RUNNER_OS}" == "Linux" ]]
          [[ "${RUNNER_ARCH}" == "X64" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          sudo -n true

          runner_root="$(dirname "$(dirname "${RUNNER_TEMP}")")"
          [[ -x "${runner_root}/svc.sh" ]]
          [[ -x "${runner_root}/run.sh" ]]
          [[ -f "${runner_root}/.runner" ]]

          existing_unit="$(systemctl list-unit-files 'actions.runner.*.service' --no-legend 2>/dev/null | awk 'NR==1 {print $1}' || true)"
          if [[ -z "${existing_unit}" ]]; then
            sudo "${runner_root}/svc.sh" install azureusr
          fi

          [[ -x "${runner_root}/runsvc.sh" ]]
          unit="$(systemctl list-unit-files 'actions.runner.*.service' --no-legend 2>/dev/null | awk 'NR==1 {print $1}' || true)"
          [[ -n "${unit}" ]]
          echo "runner_service=${unit}"

          sudo install -d -m 0755 /etc/needrestart/conf.d
          printf '%s\n' '$nrconf{override_rc}{qr(^actions\.runner\..+\.service$)} = 0;' \
            | sudo tee /etc/needrestart/conf.d/actions_runner_services.conf >/dev/null

          sudo tee /usr/local/sbin/usesafeweb-runner-service-handoff >/dev/null <<'HANDOFF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          unit="$1"
          runner_root="$2"

          mapfile -t pids < <(pgrep -u azureusr -f "${runner_root}/bin/Runner.Listener run" || true)
          for pid in "${pids[@]}"; do
            kill -TERM "${pid}" 2>/dev/null || true
          done

          for _ in $(seq 1 20); do
            if ! pgrep -u azureusr -f "${runner_root}/bin/Runner.Listener run" >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done

          systemctl start "${unit}"
          sleep 4
          if systemctl is-active --quiet "${unit}"; then
            exit 0
          fi

          sudo -u azureusr nohup "${runner_root}/run.sh" \
            >>"${runner_root}/_diag/usesafeweb-runner-fallback.log" 2>&1 &
          exit 1
          HANDOFF
          sudo chmod 0755 /usr/local/sbin/usesafeweb-runner-service-handoff

          sudo systemd-run \
            --unit=usesafeweb-runner-service-handoff \
            --on-active=8s \
            /usr/local/sbin/usesafeweb-runner-service-handoff "${unit}" "${runner_root}"

          echo "SERVICE_HANDOFF=SCHEDULED"
