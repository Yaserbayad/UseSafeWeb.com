name: AdGuard runner service bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adguard-runner-service.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  diagnose-runner-root:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Diagnose runner installation root without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]

          echo "RUNNER_TEMP=${RUNNER_TEMP}"
          echo "RUNNER_WORKSPACE=${RUNNER_WORKSPACE}"
          echo "PWD=${PWD}"

          candidate_from_temp="$(dirname "$(dirname "${RUNNER_TEMP}")")"
          candidate_from_workspace="$(dirname "$(dirname "${RUNNER_WORKSPACE}")")"
          echo "candidate_from_temp=${candidate_from_temp}"
          echo "candidate_from_workspace=${candidate_from_workspace}"

          for candidate in "${candidate_from_temp}" "${candidate_from_workspace}" /home/azureusr/t/actions-runner; do
            echo "candidate=${candidate}"
            for f in svc.sh runsvc.sh run.sh .runner; do
              if [[ -e "${candidate}/${f}" ]]; then
                stat -c '%A %U:%G %n' "${candidate}/${f}"
              else
                echo "MISSING ${candidate}/${f}"
              fi
            done
          done

          echo "RUNNER_ROOT_DIAGNOSTIC=PASS"
