name: Transition TSK-0011 WAITING to TODO

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/transition-tsk0011-todo-20260905.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify readiness and transition
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='4a8f420be62c461dfe64b64f31c6f2edb66f31ef'
          test "$(git hash-object CURRENT_STATE.md)" = "$EXPECTED_BLOB"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = '357c5e1be3b455e7efddd329d6a2468e3125b502'
          cp CURRENT_STATE.md /tmp/CURRENT_STATE.before
          python3 - <<'PY'
          import csv, copy, json
          from pathlib import Path
          path=Path('CURRENT_STATE.md')
          before=json.loads(path.read_text(encoding='utf-8'))
          assert before['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert before['project_id']=='UseSafeWeb.com'
          assert before['governance_mode']=='SERIAL_LIGHT'
          assert before['checkpoint_revision']==24
          assert before['baseline']['version']==1
          assert before['runtime']['project_status']=='ACTIVE'
          assert before['runtime']['governance_blocker'] is None
          assert not before['runtime']['human_constraints']
          base={x['id']:x for x in before['baseline']['work_items']}
          runtime={x['id']:x for x in before['runtime']['items']}
          assert base['TSK-0011']['depends_on']==['TSK-0009']
          assert base['TSK-0011']['plan_priority']==0
          assert base['TSK-0011']['order']==11
          assert runtime['TSK-0009']['status']=='PASS'
          assert runtime['TSK-0011']['status']=='WAITING'
          assert set(runtime['TSK-0011'])=={'id','status','wait','acceptance_references'}
          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='') as f:
              rows={r['Task_ID']:r for r in csv.DictReader(f)}
          row=rows['TSK-0011']
          assert row['Action_Authority']=='AUTO_ALLOWED'
          assert row['Trigger']=='Applicable lifecycle/gate and all hard dependencies satisfied.'
          assert row['Preconditions']=='Canonical state read; current gate/authority confirmed; required inputs/access available; no unresolved safety/privacy blocker.'
          after=copy.deepcopy(before)
          after['checkpoint_revision']=25
          target=next(x for x in after['runtime']['items'] if x['id']=='TSK-0011')
          target['status']='TODO'
          del target['wait']
          assert target=={'id':'TSK-0011','status':'TODO','acceptance_references':[]}
          assert after['baseline']==before['baseline']
          before_items={x['id']:x for x in before['runtime']['items']}; after_items={x['id']:x for x in after['runtime']['items']}
          for wid,old in before_items.items():
              if wid!='TSK-0011': assert after_items[wid]==old, wid
          path.write_text(json.dumps(after,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('TSK_0011_WAITING_TO_TODO=PASS revision=25 baseline=1')
          PY
          git diff --check -- CURRENT_STATE.md
      - name: Recheck boundary, remove transport, commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = '4a8f420be62c461dfe64b64f31c6f2edb66f31ef'
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/transition-tsk0011-todo-20260905.yml
          git add CURRENT_STATE.md
          printf '%s\n' '.github/workflows/transition-tsk0011-todo-20260905.yml' 'CURRENT_STATE.md' | sort > /tmp/expected
          git diff --cached --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git commit -m 'state: transition TSK-0011 published-plan readback to TODO'
          git push origin HEAD:main
