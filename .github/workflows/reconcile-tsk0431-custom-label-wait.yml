name: Reconcile TSK0431 custom-label WAITING

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-tsk0431-custom-label-wait.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Reconcile current state
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 infrastructure/adguard-server/reconcile-tsk0431-custom-label-state.py
          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add CURRENT_STATE.md
          git diff --cached --check
          git commit -m 'state: require deterministic TSK-0431 recovery label'
          git push origin HEAD:main
