name: Sync CR-0015 current state

on:
  push:
    branches:
      - runtime/cr0015-authority-sync
    paths:
      - .github/workflows/sync-cr0015-current-state.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: runtime/cr0015-authority-sync
          fetch-depth: 0
      - name: Synchronize CURRENT_STATE with CR-0015
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          if '`CR-0015` / `DEC-0062`' in text:
              raise SystemExit('CR-0015 already recorded; refusing replay')

          old_heading = '**ACTIVE / OWNER-FROZEN / POST-FREEZE CR-0014 PUBLISHED; RUNTIME RECONCILIATION RECORDED.**'
          new_heading = '**ACTIVE / OWNER-FROZEN / POST-FREEZE CR-0015 PUBLISHED; RUNTIME RECONCILIATION RECORDED.**'
          if text.count(old_heading) != 1:
              raise SystemExit('expected CR-0014 authority heading exactly once')
          text = text.replace(old_heading, new_heading, 1)

          old = ('- Latest post-freeze planning change: `CR-0014` / `DEC-0061`, explicitly authorized by the Project Owner on 2026-09-04: '
                 'exactly `TSK-0631`, `TSK-0633`, `TSK-0634`, `TSK-0635`, `TSK-0637` and `TSK-0640` are deferred until after the controlled '
                 'Release-1 test with approximately 10-20 people; they remain non-PASS and retain their dependency and ACC/VER/EVD contracts. '
                 'No other task is deferred by this decision.')
          prior = old.replace('- Latest post-freeze planning change:', '- Prior post-freeze planning change:')
          if text.count(old) != 1:
              raise SystemExit('expected CR-0014 latest-change bullet exactly once')

          cr15 = ('- Latest post-freeze planning change: `CR-0015` / `DEC-0062`, explicitly authorized by the Project Owner on 2026-09-04: '
                  'exactly `TSK-0630`, `TSK-0421`, `TSK-0415`, `TSK-0416`, `TSK-0370`, `TSK-0499` and `TSK-0242` are deferred until after Version 1 / '
                  'the controlled Release-1 test with approximately 10-20 people. They remain non-PASS; all dependency edges, ACC/VER/EVD contracts and valid '
                  'partial evidence are preserved. While the deferral is active, only these seven task obligations are excluded from pre-V1/Release-1 completion '
                  'and gate evaluation; no task/gate PASS or other requirement/material-action waiver is inferred. Successors remain undeferred and obey ordinary '
                  'dependency blocking; in particular `TSK-0421` blocks `TSK-0419` -> `TSK-0420` -> `TSK-0414` until reactivation.\n'
                  '- CR-0015 canonical publication: PR `#114`; exact candidate head `52218a8432d2fafb39ca1a2b5cfdc883991a6378`; squash merge/main commit '
                  '`05c618f0c2e074f79fe60d8fc37796db960d74ba`. Bounded planning validation run/job `33919215443 / 101173407414`: **PASS** — '
                  '641 tasks, 858 dependency edges, 0 recurring hard predecessors, 0 broken links, 0 generated missing task IDs, and `CR0015_BOUNDED_DELTA=PASS`. '
                  'All four pull-request checks on the exact candidate head passed before merge: localization `33919281148`, governed CI/promotion `33919281149`, '
                  'automated-check acceptance `33919281316`, and landing acceptance `33919281269`. The governed CI check also proved deployment/material-action fences remained closed.')
          text = text.replace(old, cr15 + '\n' + prior, 1)

          lines = text.splitlines()
          stamp = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          for i, line in enumerate(lines):
              if line.startswith('**Updated:**'):
                  lines[i] = f'**Updated:** {stamp}'
                  break
          else:
              raise SystemExit('Updated line missing')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          grep -F 'CR-0015` / `DEC-0062`' CURRENT_STATE.md
          grep -F '05c618f0c2e074f79fe60d8fc37796db960d74ba' CURRENT_STATE.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'Synchronize CURRENT_STATE for CR-0015'
          git push origin HEAD:runtime/cr0015-authority-sync
