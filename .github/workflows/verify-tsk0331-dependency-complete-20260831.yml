name: Verify dependency-complete TSK-0331
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0331-dependency-complete-20260831.yml'
      - '.github/scripts/verify_tsk0331_dependency_complete_20260831.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify dependency-complete current TSK-0331
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/verify_tsk0331_dependency_complete_20260831.py
          git diff --check
          test -z "$(git status --porcelain)"
