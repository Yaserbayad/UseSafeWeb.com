name: Inspect TSK-0300 and TSK-0310 eligibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tsk0300-tsk0310.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Print exact WBS rows and runtime mentions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          with open('Plans/Master/WBS/master-wbs.csv', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          for r in rows:
              if r.get('Task_ID') in {'TSK-0300','TSK-0310','TSK-0628'}:
                  print('ROW=' + ' | '.join(f'{k}={v}' for k,v in r.items()))
          PY
          echo 'RUNTIME_TSK0300:'
          grep -n -F 'TSK-0300' CURRENT_STATE.md || true
          echo 'RUNTIME_TSK0310:'
          grep -n -F 'TSK-0310' CURRENT_STATE.md || true
          echo 'RUNTIME_TSK0628:'
          grep -n -F 'TSK-0628' CURRENT_STATE.md || true