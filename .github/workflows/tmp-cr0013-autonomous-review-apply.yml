name: TEMP CR-0013 autonomous review apply

on:
  push:
    branches:
      - governance/cr0013-autonomous-review-20260904

permissions:
  contents: write

jobs:
  apply-cr0013:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: governance/cr0013-autonomous-review-20260904

      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Apply exact owner-authorized CR-0013 source delta
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tmp-cr0013-runner.py
          echo "CR0013_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CR0013_SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Verify CR-0013 master-plan invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py | tee /tmp/cr0013-master-validator.log
          grep -q 'VALIDATION PASS' /tmp/cr0013-master-validator.log
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Verify revised TSK-0453 acceptance completely
        shell: bash
        working-directory: website
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund --no-audit
          test "$(node -p "require('./node_modules/prettier/package.json').version")" = '3.9.6'
          node --test tests/contract/tsk0453.test.mjs
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:contract
          NEXT_TELEMETRY_DISABLED=1 npm run build
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

          PROBE='src/tsk0453-cr0013-format-negative.ts'
          printf 'export const cr0013Negative={value:1}\n' > "$PROBE"
          set +e
          ./node_modules/.bin/prettier --check "$PROBE" >/tmp/cr0013-format-negative.log 2>&1
          NEGATIVE_EXIT=$?
          set -e
          rm -f "$PROBE"
          test "$NEGATIVE_EXIT" -ne 0
          npm run format:check
          cd ..
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Create durable evidence and reconcile state
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/cr0013-apply.py finalize
          git push --force-with-lease=refs/heads/governance/cr0013-autonomous-review-20260904:${GITHUB_SHA} origin HEAD:refs/heads/governance/cr0013-autonomous-review-20260904
          test -z "$(git status --porcelain)"
