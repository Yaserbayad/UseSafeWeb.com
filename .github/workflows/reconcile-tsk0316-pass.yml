name: Reconcile TSK-0316 PASS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0316-pass.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify corrected evidence and reconcile runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object TSK_0316_FRICTION_BUDGET_AND_INTERACTION_CHALLENGE_2026-08-28.md)" = "07df8b1909809a069e3ddba1ff10b688d2f5a5e0"
          test "$(git hash-object TSK_0316_FRICTION_BUDGET_AND_INTERACTION_CHALLENGE_EVIDENCE_2026-08-28.md)" = "189a31eb56d877b1553251c2e6a1c6b18fd54616"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='')))
          by={r['Task_ID']:r for r in rows}
          t=by['TSK-0316']; n=by['TSK-0409']; human=by['TSK-0317']; real=by['TSK-0187']
          assert t['Dependencies']=='TSK-0315'
          assert t['Priority']=='HIGH' and t['Action_Authority']=='AUTO_ALLOWED' and t['AI_Capability_A0_A4']=='A3'
          assert 'Each retained interaction has a decision/technical/safety reason' in t['Acceptance_Criteria']
          assert n['Dependencies']=='TSK-0408'
          assert n['Priority']=='HIGH' and n['Action_Authority']=='AUTO_ALLOWED' and n['AI_Capability_A0_A4']=='A3'
          assert 'Every supported combination has a tested mechanism or explicit unsupported status' in n['Acceptance_Criteria']
          assert human['Dependencies']=='TSK-0316' and human['Action_Authority']=='HUMAN_ONLY'
          assert real['Action_Authority']=='AUTO_ALLOWED'
          e=pathlib.Path('TSK_0316_FRICTION_BUDGET_AND_INTERACTION_CHALLENGE_EVIDENCE_2026-08-28.md').read_text()
          assert 'Contract blob: `07df8b1909809a069e3ddba1ff10b688d2f5a5e0`' in e
          assert 'directly satisfies every ACC-0316 clause' in e
          assert 'RSK-0002' in e
          p=pathlib.Path('CURRENT_STATE.md'); text=p.read_text()
          assert '### TSK-0320 accepted stable state' in text
          assert '### TSK-0316 accepted stable state' not in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          sec='''### TSK-0316 accepted stable state\n\n`TSK-0316 — Define a friction budget and challenge every click, field, choice, confirmation, account, and manual step`: **PASS for the provisional internal L4 friction/minimisation contract under DEC-0050/CR-0003**. Contract `TSK_0316_FRICTION_BUDGET_AND_INTERACTION_CHALLENGE_2026-08-28.md`, blob `07df8b1909809a069e3ddba1ff10b688d2f5a5e0`; corrected independent evidence `TSK_0316_FRICTION_BUDGET_AND_INTERACTION_CHALLENGE_EVIDENCE_2026-08-28.md`, blob `189a31eb56d877b1553251c2e6a1c6b18fd54616`. ACC-0316 is satisfied: every retained interaction is tied to a decision/technical/safety/evidence/recovery reason; removable friction is removed or conditionalized; Android/Apple platform-required actions remain explicit; unsupported one-click/universal protection claims are prohibited. The evidence-index mismatch discovered before PASS was corrected and read back against the actual contract blob before this transition.\n\n`RSK-0002` remains OPEN: the minimized journey is not representative-parent validated, and no click-count/completion-time/abandonment/conversion claim is asserted. This PASS does not authorize LG-05/LG-06, implementation/build, participants, legal completion, payment, public release or launch.\n\n'''
          marker='## Runtime safeguards'
          assert marker in text
          text=text.replace(marker,sec+marker,1)
          q=text.rfind('\n## Queue status after current reconciliation'); assert q>=0
          text=text[:q].rstrip()+f'''\n\n## Queue status after current reconciliation\n\n`TSK-0316` is runtime PASS. `TSK-0317` is now dependency-ready but remains HUMAN_ONLY and is fenced. `TSK-0187` remains real-user-bound/deferred under CR-0003. The highest-priority executable AUTO_ALLOWED L4 candidate is `TSK-0409`.\n\n- **Selected next: `TSK-0409 — {n['Title']}`** (L4 / {n['AI_Capability_A0_A4']} / {n['Action_Authority']} / {n['Priority']}).\n- Hard dependency: `TSK-0408` — current PASS.\n- ACC-0409: {n['Acceptance_Criteria']}\n- Selection rationale: HIGH/A3/AUTO_ALLOWED, current hard dependency PASS, no representative-parent evidence required to define a conservative supported/unsupported technical matrix; HUMAN_ONLY TSK-0317 remains fenced.\n\n## Exact next authoritative step\n\nExecute bounded `TSK-0409`: freeze the supported OS/device/network matrix only where current direct technical evidence is sufficient; explicitly mark untested combinations unsupported/not-yet-supported rather than extrapolating; cover install, verification, removal/recovery, and Private Relay/VPN/app/browser/network bypass or conflict limits; carry `RSK-0002`; persist/read back independent ACC-0409 evidence; reconcile runtime; then recompute.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md
          git commit -m "state: accept TSK-0316 and select TSK-0409"
          git push
