name: Reconcile TSK-0317 HUMAN_ONLY waiting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0317-waiting.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact pre-state and preparation evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "ce7972e988254efdd7c1ce1300d6e069173157df"
          test "$(git hash-object TSK_0317_PLATFORM_INSTALL_VERIFICATION_REMOVAL_RECOVERY_DESIGN_CANDIDATE_2026-08-28.md)" = "d44daf376d0e8ed1d5839cc3b6b2ac10d090828d"
          test "$(git hash-object TSK_0317_PLATFORM_DESIGN_PREPARATION_EVIDENCE_2026-08-28.md)" = "8a233a40ec549a5ded9377048eb1ef365e9b31f3"
          grep -Fq 'TSK-0317 HUMAN_ONLY preparation selected' CURRENT_STATE.md
          grep -Fq 'selected runtime **TODO** item for **preparation only**' CURRENT_STATE.md
      - name: Apply bounded WAITING reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          old_updated = '**Updated:** 2026-08-28T21:23:07Z'
          if text.count(old_updated) != 1:
              raise SystemExit('unexpected Updated pre-state')
          updated = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text = text.replace(old_updated, f'**Updated:** {updated}', 1)
          marker = '## Queue status — TSK-0317 HUMAN_ONLY preparation selected\n'
          i = text.find(marker)
          if i < 0 or text.find(marker, i + 1) >= 0:
              raise SystemExit('queue marker mismatch')
          tail = (
              '### TSK-0317 preparation stable state\n\n'
              '`TSK-0317 — Design the simplest technically correct install, verification, removal, and recovery path for each supported platform`: runtime **WAITING**, not PASS. Bounded AI preparation is complete. Candidate `TSK_0317_PLATFORM_INSTALL_VERIFICATION_REMOVAL_RECOVERY_DESIGN_CANDIDATE_2026-08-28.md`, blob `d44daf376d0e8ed1d5839cc3b6b2ac10d090828d`, publication commit `28156f75728c28333c61c33313007556839329e6`; preparation evidence `TSK_0317_PLATFORM_DESIGN_PREPARATION_EVIDENCE_2026-08-28.md`, blob `8a233a40ec549a5ded9377048eb1ef365e9b31f3`, publication commit `719ec389e22f5626bab412b8dc6d1223739559eb`. The preparation independently verifies complete technical coverage of ACC-0317 while preserving the WBS A1/HUMAN_ONLY boundary.\n\n'
              'The candidate limits current support to accepted Android 9+ phone and iPhone/iOS 14+ paths; preserves Android DoT-hostname versus iPhone DoH-profile asymmetry; allows automation only for reliable routing/copy/verified-artifact delivery/controlled verification/state rendering; keeps system DNS/profile authorization user/OS controlled; preserves truthful conflict states, canonical manual fallback, safe removal/recovery and no-surveillance verification.\n\n'
              'TSK-0317 cannot become PASS until the authorized human explicitly APPROVES, REQUESTS CHANGES to, or REJECTS the exact candidate blob `d44daf376d0e8ed1d5839cc3b6b2ac10d090828d`. No human design decision is inferred from technical preparation. Approval would remain provisional internal L4 only and would not authorize implementation/build/profile publication, participants, legal completion, payment, publication or launch.\n\n'
              '## Queue status after TSK-0317 preparation\n\n'
              '`TSK-0317` is **WAITING** on its HUMAN_ONLY design disposition. `RSK-0002` remains OPEN; `REQ-0022` unresolved; LG-03/LG-04/LG-05/LG-06 non-PASS; account/dashboard remains deferred under EXC-0001. TSK-0307 and TSK-0310 remain blocked on TSK-0317 PASS. Other HUMAN_ONLY L4 bottlenecks remain human-controlled and are not silently completed.\n\n'
              '## Exact next authoritative step\n\n'
              'Obtain the smallest required human disposition on candidate blob `d44daf376d0e8ed1d5839cc3b6b2ac10d090828d`: APPROVE, REQUEST CHANGES, or REJECT. If approved unchanged, independently re-check ACC-0317 against that exact blob, reconcile runtime PASS, then recompute the L4 queue. If changes are requested, revise only the specified design elements and re-verify before another human disposition.\n'
          )
          text = text[:i] + tail
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify diff and commit WAITING
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '### TSK-0317 preparation stable state' CURRENT_STATE.md
          grep -Fq '`TSK-0317` is **WAITING**' CURRENT_STATE.md
          grep -Fq 'd44daf376d0e8ed1d5839cc3b6b2ac10d090828d' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: mark TSK-0317 waiting for human design decision'
          git push
