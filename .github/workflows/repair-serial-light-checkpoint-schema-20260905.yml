name: Repair SERIAL LIGHT checkpoint schema

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-serial-light-checkpoint-schema-20260905.yml

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded schema recovery mutation
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='fe4483426fe3f69cf9f1d969282be16d141788e5'
          ACTUAL_BLOB="$(git hash-object CURRENT_STATE.md)"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          test -f TSK_0452_PILOT_DEPLOYMENT_AUTOMATION_EVIDENCE_2026-09-05.md
          test "$(git hash-object TSK_0452_PILOT_DEPLOYMENT_AUTOMATION_EVIDENCE_2026-09-05.md)" = '65902c584f450cd00ef7b3d0a01b421075683289'

          cp CURRENT_STATE.md /tmp/CURRENT_STATE.before
          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path

          path=Path('CURRENT_STATE.md')
          text=path.read_text(encoding='utf-8')
          before=json.loads(text)
          assert text == json.dumps(before, indent=2, ensure_ascii=False) + '\n'
          assert before['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert before['project_id']=='UseSafeWeb.com'
          assert before['governance_mode']=='SERIAL_LIGHT'
          assert before['checkpoint_revision']==19
          assert before['baseline']['version']==1
          assert before['runtime']['project_status']=='ACTIVE'
          assert before['runtime']['governance_blocker'] is None

          items={x['id']:x for x in before['runtime']['items']}
          t243=items['TSK-0243']
          assert t243['status']=='WAITING'
          assert set(t243)=={'id','status','wait','acceptance_references','wait_details'}
          assert t243['acceptance_references']==[]
          assert t243['wait']['condition'].startswith('The owner-selected target/access prerequisite is now established:')
          assert t243['wait']['resolution_check'].startswith('Complete the current AUTO_ALLOWED TSK-0452')
          assert t243['wait_details']['condition'].startswith('Target identity/access is proven;')

          t452=items['TSK-0452']
          assert t452=={
              'id':'TSK-0452',
              'status':'PASS',
              'acceptance_references':[
                  'TSK_0452_PILOT_DEPLOYMENT_AUTOMATION_EVIDENCE_2026-09-05.md',
                  'Yaserbayad/erp.hmg.test Actions run 33969593425 job 101315631105; transport commit 03fc53cb5a030ce3534ede429a19123a28a27bbd'
              ]
          }
          work={x['id']:x for x in before['baseline']['work_items']}
          assert work['TSK-0452']['acceptance_criteria']==[{
              'id':'ACC-0452',
              'condition':'Pipeline deploys directly to the approved host without requiring Docker; records source/config/content/filter versions, environment, authority, tests, health checks and rollback target/result; failed health gates stop/roll back where safe; production secrets are externally injected and never committed.'
          }]

          after=copy.deepcopy(before)
          after['checkpoint_revision']=20
          aitems={x['id']:x for x in after['runtime']['items']}
          del aitems['TSK-0243']['wait_details']
          aitems['TSK-0452']['acceptance_references']=[{
              'ac_id':'ACC-0452',
              'evidence_type':'GITHUB_BLOB',
              'reference':'Yaserbayad/UseSafeWeb.com TSK_0452_PILOT_DEPLOYMENT_AUTOMATION_EVIDENCE_2026-09-05.md; blob 65902c584f450cd00ef7b3d0a01b421075683289; Yaserbayad/erp.hmg.test Actions run 33969593425 job 101315631105; transport commit 03fc53cb5a030ce3534ede429a19123a28a27bbd',
              'summary':'ACC-0452 is satisfied by the direct-host deployment evidence: immutable release identity, approved host/runtime, validation and health checks, safe rollback behavior, and externally injected secret handling were verified.',
              'verification_context':'Frozen WBS commit 20e2763c0be2124378e3158ac559aed826bc6765, blob 357c5e1be3b455e7efddd329d6a2468e3125b502; evidence blob 65902c584f450cd00ef7b3d0a01b421075683289; successful deployment run 33969593425 job 101315631105.'
          }]

          assert after['baseline']==before['baseline']
          assert after['runtime']['project_status']==before['runtime']['project_status']
          assert after['runtime']['governance_blocker']==before['runtime']['governance_blocker']
          for wid,old in items.items():
              new=aitems[wid]
              if wid not in {'TSK-0243','TSK-0452'}:
                  assert new==old, wid
          assert aitems['TSK-0243']['status']=='WAITING'
          assert aitems['TSK-0243']['wait']==t243['wait']
          assert aitems['TSK-0243']['acceptance_references']==[]
          assert set(aitems['TSK-0243'])=={'id','status','wait','acceptance_references'}
          assert aitems['TSK-0452']['status']=='PASS'
          assert len(aitems['TSK-0452']['acceptance_references'])==1
          assert aitems['TSK-0452']['acceptance_references'][0]['ac_id']=='ACC-0452'

          out=json.dumps(after, indent=2, ensure_ascii=False)+'\n'
          path.write_text(out, encoding='utf-8')
          reparsed=json.loads(path.read_text(encoding='utf-8'))
          assert reparsed==after
          print('CHECKPOINT_SCHEMA_RECOVERY=PASS revision=20 baseline=1 TSK-0243=WAITING TSK-0452=PASS')
          PY

          git diff --check -- CURRENT_STATE.md
          git diff --exit-code --quiet /tmp/CURRENT_STATE.before CURRENT_STATE.md && exit 1 || true
          git diff --stat -- CURRENT_STATE.md
          git diff -- CURRENT_STATE.md

      - name: Recheck stale-write boundary, remove one-off transport, and commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='fe4483426fe3f69cf9f1d969282be16d141788e5'
          git fetch origin main
          REMOTE_BLOB="$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)"
          test "$REMOTE_BLOB" = "$EXPECTED_BLOB"

          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/repair-serial-light-checkpoint-schema-20260905.yml
          git add CURRENT_STATE.md
          printf '%s\n' '.github/workflows/repair-serial-light-checkpoint-schema-20260905.yml' 'CURRENT_STATE.md' > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          git commit -m 'state: repair SERIAL LIGHT checkpoint schema'
          git push origin HEAD:main
