name: Verify current TSK-0330 revalidation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tsk0330-current-revalidation-20260831.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact current TSK-0330 revalidation
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          python3 .github/scripts/verify_tsk0330_current_revalidation_20260831.py
          git diff --check
          test -z "$(git status --porcelain)"
