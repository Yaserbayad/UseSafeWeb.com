name: Install pinned AdGuard Home

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adguard-install.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  install:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate artifact and execute TSK-0203
        shell: bash
        env:
          EXPECTED_SCRIPT_SHA256: ca3f3827353837f6494e6875e30e0f6cb459d5960c8e97a76bd2f4aa52b527fc
        run: |
          set -Eeuo pipefail

          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${RUNNER_OS}" == "Linux" ]]
          [[ "${RUNNER_ARCH}" == "X64" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          sudo -n true

          unit="$(systemctl list-unit-files 'actions.runner.*.service' --no-legend 2>/dev/null | awk 'NR==1 {print $1}' || true)"
          [[ -n "${unit}" ]]
          systemctl is-enabled --quiet "${unit}"
          systemctl is-active --quiet "${unit}"

          script='infrastructure/adguard-server/install-adguard.sh'
          test -f "${script}"
          actual_script_sha="$(sha256sum "${script}" | awk '{print $1}')"
          echo "installer_sha256=${actual_script_sha}"
          [[ "${actual_script_sha}" == "${EXPECTED_SCRIPT_SHA256}" ]]
          bash -n "${script}"
          echo 'installer_artifact=PASS'

          set +e
          bash "${script}" | tee /tmp/usesafeweb-tsk-0203.log
          rc=${PIPESTATUS[0]}
          set -e

          [[ "${rc}" -eq 0 ]]
          grep -q '^TSK_0203_MUTATION=PASS$' /tmp/usesafeweb-tsk-0203.log
          echo 'TSK_0203_WORKFLOW=PASS'
