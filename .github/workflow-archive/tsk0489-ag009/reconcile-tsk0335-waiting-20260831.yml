name: Reconcile TSK-0335 current WAITING state
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0335-waiting-20260831.yml'
      - '.github/scripts/reconcile_tsk0335_waiting_20260831.py'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist exact TSK-0335 WAITING boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 .github/scripts/reconcile_tsk0335_waiting_20260831.py
          git diff --check
          grep -Fq '## TSK-0335 current waiting state — 2026-08-31 — POST-CR-0007' CURRENT_STATE.md
          grep -Fq 'APPROVE TSK-0335 POST-CR-0007 DUAL-MODE PROTECTION MAP AMENDMENT' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: record current TSK-0335 WAITING boundary'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          echo "TSK0335_WAITING_RECONCILIATION=PASS"
          echo "TSK0335_WAITING_COMMIT=$(git rev-parse HEAD)"
          echo "TSK0335_RUNTIME_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
