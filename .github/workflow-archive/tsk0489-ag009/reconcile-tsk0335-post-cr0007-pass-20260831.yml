name: Reconcile post-CR-0007 TSK-0335 PASS

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/reconcile_tsk0335_post_cr0007_pass_20260831.py'
      - '.github/workflows/reconcile-tsk0335-post-cr0007-pass-20260831.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist current TSK-0335 PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 .github/scripts/reconcile_tsk0335_post_cr0007_pass_20260831.py
          git diff --check
          grep -Fq '## TSK-0335 current accepted stable state — 2026-08-31 — POST-CR-0007' CURRENT_STATE.md
          grep -Fq '33431191778 / 99616661300' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept current TSK-0335 amendment'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          echo "TSK0335_PASS_RECONCILIATION=PASS"
          echo "TSK0335_RUNTIME_COMMIT=$(git rev-parse HEAD)"
          echo "TSK0335_RUNTIME_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
