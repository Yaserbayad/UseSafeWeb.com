name: Select TSK-0044

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/select-tsk0044.yml'

permissions:
  contents: write

jobs:
  select:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify queue and select TSK-0044
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "4ec183a31831656c0aa8052e1114c4e85c83b23b"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "dce5b829c4d447eac180ae1e896e0019292cf971"
          test "$(git hash-object TSK_0538_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md)" = "fb320889f5cee1e5f55dfdc960199d71b15a0f70"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='')))
          by={r['Task_ID']:r for r in rows}
          t=by['TSK-0044']
          deps=[x.strip() for x in t['Dependencies'].split(';') if x.strip()]
          assert deps==['TSK-0484','TSK-0538','TSK-0146'], deps
          assert t['Lifecycle_Stage']=='L4' and t['Priority']=='MEDIUM'
          assert t['AI_Capability_A0_A4']=='A3' and t['Action_Authority']=='AUTO_ALLOWED'
          assert by['TSK-0146'].get('Execution_State')=='PASS'
          acc=t['Acceptance_Criteria']
          for phrase in ['private/restricted AdGuard administration path','secret storage/rotation','API/config timeouts/retries','partial-failure reconciliation','opaque setup/configuration identifiers if technically required','explicit privacy booleans','version/contract regression checks','safe behavior when AdGuard or the verification path is unavailable','no mandatory customer-authentication or persistent datastore dependency is introduced']:
              assert phrase in acc, phrase
          q=pathlib.Path('TSK_0538_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md').read_text()
          seg=q.split('### TSK-0044',1)[1].split('### TSK-0046',1)[0]
          assert '- **Preflight flags:** (none)' in seg
          assert q.index('### TSK-0044') < q.index('### TSK-0046')
          assert '### TSK-0187' in q and 'REAL_OR_BEHAVIOR_EVIDENCE_CHECK' in q
          assert '### TSK-0140' in q and 'OWNER_REVIEW_CHECK' in q
          p=pathlib.Path('CURRENT_STATE.md')
          text=p.read_text()
          assert '### TSK-0538 accepted stable state' in text
          assert 'No next task is selected by this write' in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          pos=text.rfind('\n## Queue status after current reconciliation')
          assert pos>=0
          text=text[:pos].rstrip()+'''\n\n## Queue status after current reconciliation\n\nThe TSK-0538 post-PASS queue was reread against current acceptance, CR-0003 and the open security/privacy deviations. `TSK-0187` remains ineligible because it requires representative-parent evidence. `TSK-0140` remains ineligible for PASS because owner/multi-role review evidence is absent. `TSK-0044` and `TSK-0046` are both MEDIUM/A3/AUTO_ALLOWED with no preflight flag; WBS order places TSK-0044 first. Canonical WBS directly confirms TSK-0146 current Execution_State=PASS.\n\n- **Selected next: `TSK-0044 — Define AdGuard API compatibility, credential-isolation and failure NFRs`** (L4 / A3 / AUTO_ALLOWED / MEDIUM).\n- Hard dependencies: `TSK-0484`, `TSK-0538`, `TSK-0146` — all current PASS.\n- ACC-0044: define the private/restricted AdGuard administration path, secret storage/rotation, API/config timeouts/retries, partial-failure reconciliation, opaque setup/configuration identifiers if technically required, explicit privacy booleans, version/contract regression checks, and safe behavior when AdGuard or the verification path is unavailable; introduce no mandatory customer-authentication or persistent datastore dependency.\n- Selection boundary: internal compatibility/security/failure NFR definition only. No AdGuard mutation, secret rotation, account/auth activation, persistent database, application build, participant processing or release is authorized.\n\n## Exact next authoritative step\n\nExecute bounded TSK-0044: verify the current/version-pinned AdGuard v0.107.79 administrative/API/configuration contract from official sources and current accepted runtime evidence; define the minimum private administration and secret-isolation contract, explicit privacy booleans, timeout/retry/idempotency/reconciliation semantics, opaque identifier rule only if technically necessary, version/contract regression checks and fail-safe behavior; preserve accountless/no-datastore, privacy and security boundaries; persist/read back independent ACC-0044 evidence; reconcile runtime; then recompute.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md
          git commit -m "state: select TSK-0044"
          git push
