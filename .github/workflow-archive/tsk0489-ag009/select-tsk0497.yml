name: Select TSK-0497

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/select-tsk0497.yml'

permissions:
  contents: write

jobs:
  select:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-governance-state-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify queue and select TSK-0497
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /etc/machine-id | awk '{print $1}')" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"
          test "$(git hash-object CURRENT_STATE.md)" = "107896a18d3cc113daee44a04b392756957b4d94"
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "dce5b829c4d447eac180ae1e896e0019292cf971"
          test "$(git hash-object TSK_0484_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md)" = "0be7f7e80f5b621b7d8ca9014899d30988a2ce72"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone

          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline='')))
          by={r['Task_ID']:r for r in rows}
          t=by['TSK-0497']
          assert [x.strip() for x in t['Dependencies'].split(';') if x.strip()]==['TSK-0230']
          assert t['Lifecycle_Stage']=='L4' and t['Priority']=='MEDIUM'
          assert t['AI_Capability_A0_A4']=='A3' and t['Action_Authority']=='AUTO_ALLOWED'
          acc=t['Acceptance_Criteria']
          for phrase in ['purpose, exact definition, properties, prohibited fields, collection point, denominator, retention and owner','login/account/dashboard events are absent unless EXC-0001 is activated','DNS/domain history, visited-domain and child-activity events are prohibited']:
              assert phrase in acc, phrase

          q=pathlib.Path('TSK_0484_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md').read_text()
          assert '### TSK-0497 — Define minimal product event and KPI catalogue' in q
          assert '- **Preflight flags:** (none)' in q.split('### TSK-0497',1)[1].split('### TSK-0538',1)[0]
          assert q.index('### TSK-0497') < q.index('### TSK-0538')

          p=pathlib.Path('CURRENT_STATE.md')
          text=p.read_text()
          assert '### TSK-0484 accepted stable state' in text
          assert 'No next task is selected by this write' in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          pos=text.rfind('\n## Queue status after current reconciliation')
          assert pos>=0
          text=text[:pos].rstrip()+'''\n\n## Queue status after current reconciliation\n\nThe TSK-0484 post-PASS queue was reread against current acceptance, CR-0003 and the open security/privacy deviations. `TSK-0187` remains ineligible because it requires representative-parent evidence. `TSK-0140` remains ineligible for PASS because owner/multi-role review evidence is absent. `TSK-0497` and `TSK-0538` are both MEDIUM/A3/AUTO_ALLOWED with no preflight flag; WBS order places TSK-0497 first.\n\n- **Selected next: `TSK-0497 — Define minimal product event and KPI catalogue`** (L4 / A3 / AUTO_ALLOWED / MEDIUM).\n- Hard dependency: `TSK-0230` — current PASS.\n- ACC-0497: every approved event has purpose, exact definition, properties, prohibited fields, collection point, denominator, retention and owner; accountless/device-configuration/Protection-Map/self-service/support measurement may be minimal; login/account/dashboard events remain absent unless EXC-0001 activates; DNS/domain history, visited-domain and child-activity events remain prohibited.\n- Selection boundary: internal measurement-contract definition only. No telemetry implementation, new persistent data store, account/dashboard activation, DNS-history collection, behavioral validation, real participants or release is authorized.\n\n## Exact next authoritative step\n\nExecute bounded TSK-0497: load TSK-0230/0229/0313/0320/0042 plus REQ-0060/0061 and INT-0016; define the minimum event/KPI catalogue with exact event semantics, properties, prohibited fields, collection point, denominator, retention and owner; ensure account/login/dashboard and DNS/domain/visited-domain/child-activity telemetry are absent; preserve RSK-0002 and all legal/build/participant gates; persist/read back independent ACC-0497 evidence; reconcile runtime; then recompute.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md
          git commit -m "state: select TSK-0497"
          git push
