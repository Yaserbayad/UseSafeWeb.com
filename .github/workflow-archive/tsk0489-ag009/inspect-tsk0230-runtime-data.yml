name: Inspect TSK-0230 runtime data footprint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tsk0230-runtime-data.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: usesafeweb-adguard-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Inspect privacy-relevant runtime without reading request records
        shell: bash
        run: |
          set -euo pipefail
          mid_hash="$(sha256sum /etc/machine-id | awk '{print $1}')"
          test "$mid_hash" = "e4988ed374ffd1836ca5c154f8ee8d727a2795bfcceb4ef9f682aecf95e177c2"

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          sudo nginx -T >"$tmp" 2>/dev/null

          access_directives="$(grep -E '^[[:space:]]*access_log[[:space:]]+' "$tmp" | sed -E 's/^[[:space:]]+//' | sort -u || true)"
          error_directives="$(grep -E '^[[:space:]]*error_log[[:space:]]+' "$tmp" | sed -E 's/^[[:space:]]+//' | sort -u || true)"
          log_formats="$(grep -E '^[[:space:]]*log_format[[:space:]]+' "$tmp" | sed -E 's/^[[:space:]]+//' | sed -E 's/\$remote_addr/[REMOTE_ADDR]/g;s/\$http_[A-Za-z0-9_]+/[HTTP_FIELD]/g;s/\$request[^ ]*/[REQUEST_FIELD]/g' | sort -u || true)"

          enabled_access_paths="$(printf '%s\n' "$access_directives" | awk '$1=="access_log" && $2!="off;" && $2!="off" {gsub(/;/,"",$2); print $2}' | sort -u || true)"
          access_enabled=NO
          if [ -n "$enabled_access_paths" ]; then access_enabled=YES; fi

          meta=""
          if [ -n "$enabled_access_paths" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                syslog:*) meta="${meta}${path}: non-file target configured\n" ;;
                *)
                  if sudo test -e "$path"; then
                    size="$(sudo stat -c '%s' "$path")"
                    mode="$(sudo stat -c '%a' "$path")"
                    owner="$(sudo stat -c '%U:%G' "$path")"
                    meta="${meta}${path}: exists=yes size_bytes=${size} mode=${mode} owner=${owner}\n"
                  else
                    meta="${meta}${path}: exists=no\n"
                  fi
                  ;;
              esac
            done <<< "$enabled_access_paths"
          fi

          error_meta=""
          error_paths="$(printf '%s\n' "$error_directives" | awk '$1=="error_log" {gsub(/;/,"",$2); print $2}' | sort -u || true)"
          if [ -n "$error_paths" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              if sudo test -e "$path"; then
                size="$(sudo stat -c '%s' "$path")"
                mode="$(sudo stat -c '%a' "$path")"
                owner="$(sudo stat -c '%U:%G' "$path")"
                error_meta="${error_meta}${path}: exists=yes size_bytes=${size} mode=${mode} owner=${owner}\n"
              else
                error_meta="${error_meta}${path}: exists=no\n"
              fi
            done <<< "$error_paths"
          fi

          if sudo test -r /etc/logrotate.d/nginx; then
            logrotate_nginx="$(sudo cat /etc/logrotate.d/nginx)"
          else
            logrotate_nginx="<missing /etc/logrotate.d/nginx>"
          fi

          adguard_yaml=/opt/AdGuardHome/AdGuardHome.yaml
          if ! sudo test -r "$adguard_yaml"; then
            adguard_yaml=/opt/AdGuardHome/conf/AdGuardHome.yaml
          fi
          sudo test -r "$adguard_yaml"
          qlog="$(sudo python3 - "$adguard_yaml" <<'PY'
          import sys, yaml
          d=yaml.safe_load(open(sys.argv[1]))
          q=d.get('querylog',{}) or {}
          s=d.get('statistics',{}) or {}
          dns=d.get('dns',{}) or {}
          print('querylog_enabled='+str(bool(q.get('enabled',False))).lower())
          print('querylog_file_enabled='+str(bool(q.get('file_enabled',False))).lower())
          print('statistics_enabled='+str(bool(s.get('enabled',False))).lower())
          print('anonymize_client_ip='+str(bool(dns.get('anonymize_client_ip',False))).lower())
          print('anonymize_client_ip_schema=dns.anonymize_client_ip')
          PY
          )"

          grep -q '^querylog_enabled=false$' <<< "$qlog"
          grep -q '^querylog_file_enabled=false$' <<< "$qlog"
          grep -q '^statistics_enabled=false$' <<< "$qlog"
          grep -q '^anonymize_client_ip=true$' <<< "$qlog"
          test "$access_enabled" = NO

          cat > TSK_0230_RUNTIME_DATA_FOOTPRINT_INSPECTION_2026-08-28.md <<EOF
          # TSK-0230 runtime data-footprint inspection

          **Date:** 2026-08-28
          **Target:** production runner host adguardvm
          **Purpose:** privacy-safe read-only inspection for TSK-0230. No access/error log contents or DNS query records were read or exported.

          ## Verifier correction history

          - Run 33193360160 failed before evidence because the verifier tested root-protected AdGuard config readability as the unprivileged runner user. No target mutation occurred.
          - Run 33193437786 corrected that permission probe but read anonymize_client_ip from the YAML root instead of the accepted AdGuard schema path dns.anonymize_client_ip. That false negative is not accepted as runtime evidence.
          - Run 33193504036 used the correct schema and all privacy assertions passed; only report rendering failed because Markdown backticks were interpreted by the shell and diff-check rejected trailing whitespace. No target mutation occurred.
          - Run 33193560476 preserved those assertions and produced the first accepted corrected runtime report.
          - This revision adds only error-log metadata and logrotate configuration; it still never reads log contents.

          ## Target identity

          - machine-id SHA-256: ${mid_hash}
          - expected accepted production fingerprint: MATCH

          ## Nginx effective logging configuration

          ### access_log directives

          \`\`\`
          ${access_directives:-<none explicit in effective config>}
          \`\`\`

          - Effective explicit non-off access-log target present: **${access_enabled}**

          ### Access-log target metadata only

          \`\`\`
          $(printf '%b' "${meta:-<no enabled access-log target metadata>}")
          \`\`\`

          ### error_log directives

          \`\`\`
          ${error_directives:-<none explicit in effective config>}
          \`\`\`

          ### Error-log target metadata only

          \`\`\`
          $(printf '%b' "${error_meta:-<no error-log target metadata>}")
          \`\`\`

          ### Nginx logrotate configuration

          \`\`\`
          ${logrotate_nginx}
          \`\`\`

          ### log-format declaration shape (sensitive variable names redacted)

          \`\`\`
          ${log_formats:-<none explicit in effective config>}
          \`\`\`

          ## AdGuard privacy flags

          \`\`\`
          ${qlog}
          \`\`\`

          ## Privacy boundary

          This inspection intentionally did not read, sample, grep, print or commit any Nginx log record, DNS query, source IP, domain, URL payload, user agent, participant identifier, credential or secret. It records configuration directives, retention configuration and file metadata only.

          ## Accepted runtime facts

          - Nginx access logging: explicitly off.
          - Nginx error logging: critical severity only to the configured error-log files; exact file metadata and logrotate configuration are recorded above without reading records.
          - AdGuard persistent query logging: off.
          - AdGuard file query logging: off.
          - AdGuard statistics: off.
          - AdGuard client-IP anonymisation at dns.anonymize_client_ip: enabled.

          ## Disposition

          TSK-0230 must preserve these privacy-minimal facts. Any future access-log enablement or material AdGuard logging/statistics/anonymisation change requires a governed necessity case, purpose/lawful-basis/retention/access/deletion definition, actual-runtime verification, and impact review before participant/public use. Critical error logs must remain restricted to operational/security diagnosis and follow the evidenced bounded rotation policy rather than become product analytics or browsing-history data.
          EOF

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TSK_0230_RUNTIME_DATA_FOOTPRINT_INSPECTION_2026-08-28.md
          git commit -m "evidence: add TSK-0230 runtime log retention facts"
          git push
