name: Reconcile TSK-0300 PASS and queue

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-tsk0300-pass-20260829.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify TSK-0300 and derive next queue
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = "6a25d63af125116a80f96ac0f1548b1ddb452a34"
          test "$(git hash-object Plans/Master/MANIFEST.yaml)" = "acadf21483ee3fddd63ee57795126619f92a00f3"
          test "$(git hash-object CURRENT_STATE.md)" = "5071e5b71a7c5f1631c65afda98005cd70684154"
          test "$(git hash-object brand/system/TSK-0300/tokens.css)" = "cd7d9a7cd5109e1ff0baa76532495dfd7a27a70f"
          test "$(git hash-object brand/system/TSK-0300/components.css)" = "831e92a74b6dda04252d93242cb33bd491a02381"
          test "$(git hash-object brand/system/TSK-0300/README.md)" = "4baa67f565c14c3034fca47bb5fad0b9ff71b091"
          test "$(git hash-object TSK_0300_SHARED_BRAND_SYSTEM_EVIDENCE_2026-08-29.md)" = "397b116bfdd201fcdbef8a69aedda8fe10b296b6"
          grep -Fq '**ACC-0300: PASS.**' TSK_0300_SHARED_BRAND_SYSTEM_EVIDENCE_2026-08-29.md
          grep -Fq '`RSK-0002` OPEN' TSK_0300_SHARED_BRAND_SYSTEM_EVIDENCE_2026-08-29.md
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import csv,re

          runtime=Path('CURRENT_STATE.md')
          text=runtime.read_text(encoding='utf-8')
          assert 'TSK-0300 accepted stable state' not in text
          passed=set()
          m=re.search(r'(?ms)^### PASS\s*$\n(.*?)(?=^### |^## )',text)
          if m:
              passed.update(re.findall(r'^- `?(TSK-\d{4})`?\b',m.group(1),flags=re.M))
          passed.update(re.findall(r'(?m)^### (TSK-\d{4}) accepted stable state\s*$',text))
          passed.update(re.findall(r'(?m)^`(TSK-\d{4})[^`\n]*`:\s*\*\*PASS\b',text))
          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          ids={r['Task_ID'] for r in rows}; passed &= ids
          assert len(passed)==75,(len(passed),sorted(passed))
          assert {'TSK-0298','TSK-0299','TSK-0300','TSK-0301','TSK-0302'} - {'TSK-0300'} <= passed
          assert 'TSK-0300' not in passed and 'TSK-0187' not in passed
          passed.add('TSK-0300')

          candidates=[]
          for idx,r in enumerate(rows):
              if r['Lifecycle_Stage']!='L4' or r['Task_ID'] in passed: continue
              if (r['Plan_Status'] or '').upper() not in {'PLANNED','ACTIVE','IN_PROGRESS'}: continue
              deps={x.strip() for x in re.split(r'[;,]',r['Dependencies'] or '') if x.strip().startswith('TSK-')}
              if deps <= passed:
                  candidates.append((idx,r,deps))
          pri={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          candidates.sort(key=lambda item:(pri.get((item[1]['Priority'] or '').upper(),99), item[0], item[1]['Task_ID']))
          print('POST_TSK0300_PASS_COUNT='+str(len(passed)))
          print('PASS_HAS_TSK0300='+('YES' if 'TSK-0300' in passed else 'NO'))
          print('PASS_HAS_TSK0187='+('YES' if 'TSK-0187' in passed else 'NO'))
          print('CANDIDATE_COUNT='+str(len(candidates)))
          for _,r,deps in candidates:
              print('CANDIDATE|'+'|'.join([r['Task_ID'],r['Priority'],r['Action_Authority'],','.join(sorted(deps)),r['Title']]))
          assert candidates,candidates
          selected=candidates[0][1]
          deps=sorted(x.strip() for x in re.split(r'[;,]',selected['Dependencies'] or '') if x.strip().startswith('TSK-'))
          print('NEXT_SELECTED|'+'|'.join([selected['Task_ID'],selected['Priority'],selected['Action_Authority'],','.join(deps),selected['Title']]))

          now=datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          t=next(r for r in rows if r['Task_ID']=='TSK-0300')
          text += f'''\n\n### TSK-0300 accepted stable state\n\n`TSK-0300 — {t['Title']}`: **PASS for provisional internal L4 shared-brand-system acceptance under DEC-0051/CR-0004**. Shared token source `brand/system/TSK-0300/tokens.css`, blob `cd7d9a7cd5109e1ff0baa76532495dfd7a27a70f`; shared component layer `brand/system/TSK-0300/components.css`, blob `831e92a74b6dda04252d93242cb33bd491a02381`; system contract `brand/system/TSK-0300/README.md`, blob `4baa67f565c14c3034fca47bb5fad0b9ff71b091`; acceptance evidence `TSK_0300_SHARED_BRAND_SYSTEM_EVIDENCE_2026-08-29.md`, blob `397b116bfdd201fcdbef8a69aedda8fe10b296b6`; verification run `33253851210` / job `99104067834`: PASS.\n\nOne shared implementation token source now drives exactly six internal reference contexts: public, product/setup, help, status, partner and social. All templates reference the accepted TSK-0301 SafeWeb masters, carry no duplicate brand hex values or remote/script dependencies, and preserve canonical text/non-color-only protection-state semantics.\n\nACC-0300 is satisfied. `RSK-0002` remains OPEN; `TSK-0187` remains non-PASS and mandatory where required. No representative-parent validation, legal/privacy completion, participant activation, integrated build, publication, payment, market or launch authority is inferred.\n\n### Post-TSK-0300 L4 queue\n\nFresh dependency derivation with {len(passed)} durable PASS task IDs selects `{selected['Task_ID']} — {selected['Title']}` as the next dependency-satisfied L4 task. Priority `{selected['Priority']}`; Action Authority `{selected['Action_Authority']}`; dependencies `{'; '.join(deps) if deps else 'none'}`.\n\n### Exact next authoritative step\n\nProceed according to `{selected['Action_Authority']}` for `{selected['Task_ID']}` using its current WBS acceptance/evidence contract. Re-read its exact row and governing sources before execution; preserve all CR-0004 behavioral/legal/build/publication/payment/launch fences.\n'''
          runtime.write_text(text,encoding='utf-8')
          PY
          git diff --check
      - name: Commit and push runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          git add CURRENT_STATE.md
          git diff --cached --check
          git config user.name 'UseSafeWeb Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'state: accept TSK-0300 shared brand system'
          git push origin HEAD:main
