name: Accept TSK-0233 dual-mode data model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-tsk0233-dual-mode-data-model-20260901.yml'

permissions:
  contents: write

jobs:
  verify-accept:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 3

      - name: Verify TSK-0233 acceptance and stage runtime state
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD:Plans/Master/WBS/master-wbs.csv)" = "b27a0c5df2f5636d8ed71051e9e26a68959a2616"
          test "$(git rev-parse HEAD:TSK_0233_MINIMAL_DUAL_MODE_JOURNEY_ACCOUNT_DATA_MODEL_2026-09-01.md)" = "156a1811bc4322e16474874e728d23a97a93ec4c"

          python3 - <<'PY'
          import csv, re
          from pathlib import Path

          artifact_path = Path('TSK_0233_MINIMAL_DUAL_MODE_JOURNEY_ACCOUNT_DATA_MODEL_2026-09-01.md')
          artifact = artifact_path.read_text(encoding='utf-8')
          state = Path('CURRENT_STATE.md').read_text(encoding='utf-8')

          expected_acceptance = (
              'Each anonymous journey/session field and optional parent identity/device-ownership field maps to a requirement and lawful purpose. '
              'Anonymous state is minimised, scoped and expiring; persistent account/device data is limited to approved ownership/settings/lifecycle purposes '
              'with explicit access, retention, deletion and backup handling; no DNS/domain browsing-history store exists and core value does not require identity.'
          )

          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          row = next(r for r in rows if (r.get('Task_ID') or '').strip() == 'TSK-0233')
          norm = lambda v: (v or '').strip()
          assert norm(row.get('Title')) == 'Design minimal dual-mode journey/account data model, storage, retention, and deletion flows'
          assert norm(row.get('Lifecycle_Stage')) == 'L5'
          assert norm(row.get('Priority')) == 'MEDIUM'
          assert norm(row.get('AI_Capability_A0_A4')) == 'A3'
          assert norm(row.get('Action_Authority')) == 'AUTO_ALLOWED'
          assert norm(row.get('Plan_Status')) == 'PLANNED'
          assert re.findall(r'TSK-\d{4}', row.get('Dependencies') or '') == ['TSK-0235', 'TSK-0230']
          assert set(re.findall(r'REQ-\d{4}', row.get('Requirement_Reference') or '')) == {'REQ-0018', 'REQ-0019'}
          assert set(re.findall(r'CON-\d{4}', row.get('Requirement_Reference') or '')) == {'CON-0007', 'CON-0008'}
          assert set(re.findall(r'RSK-\d{4}', row.get('Risk_Reference') or '')) == {'RSK-0001'}
          assert set(re.findall(r'INT-\d{4}', row.get('Interface_Reference') or '')) == {'INT-0006', 'INT-0007'}
          assert norm(row.get('Acceptance_ID')) == 'ACC-0233'
          assert norm(row.get('Verification_ID')) == 'VER-0233'
          assert norm(row.get('Evidence_ID')) == 'EVD-0233'
          assert norm(row.get('Acceptance_Criteria')) == expected_acceptance

          for dep in ['TSK-0235', 'TSK-0230']:
              assert re.search(rf'^##\s+{dep}(?:\s*/[^\n#]+)?\s+current accepted stable state\b', state, flags=re.M|re.I), dep
          assert not re.search(r'^##\s+TSK-0233(?:\s*/[^\n#]+)?\s+current accepted stable state\b', state, flags=re.M|re.I)

          reg = Path('Plans/Master/Registers/VERIFICATION_EVIDENCE_ACCEPTANCE.md').read_text(encoding='utf-8')
          rr = next(line for line in reg.splitlines() if line.startswith('| TSK-0233 |'))
          cells = [c.strip() for c in rr.strip().strip('|').split('|')]
          assert cells[0] == 'TSK-0233'
          assert cells[1] == 'VER-0233'
          assert cells[3] == 'EVD-0233'
          assert cells[5] == 'ACC-0233'
          assert cells[6] == expected_acceptance

          linked = {
              'Plans/Master/Registers/REQUIREMENTS.md': ['REQ-0018','REQ-0019'],
              'Plans/Master/Registers/CONSTRAINTS.md': ['CON-0007','CON-0008'],
              'Plans/Master/Registers/RISKS.md': ['RSK-0001'],
              'Plans/Master/Registers/INTERFACES.md': ['INT-0006','INT-0007'],
          }
          for path, ids in linked.items():
              source_lines = Path(path).read_text(encoding='utf-8').splitlines()
              for item_id in ids:
                  matches = [line for line in source_lines if line.startswith(f'| {item_id} |')]
                  assert len(matches) == 1, (path, item_id, len(matches))

          required_markers = [
              '**Version:** 1.0.1',
              '**Core value never requires identity.**',
              '**No J1-to-account migration exists in this contract.**',
              '`RSK-0001` remains OPEN',
              'INT-0007 remains downstream acceptance',
              'Persistent identifiable query/file logging remains OFF under CON-0007.',
              'Identifiable per-client statistics remain OFF/excluded under CON-0008.',
              '`ClientID` is an opaque DNS-control reference only and is never authentication or authorization.',
              'Maximum 24h from creation, non-sliding',
              'within 15m',
              '**None; J1 excluded from durable backups**',
              'production A-domain backup processing is `BLOCKED_NO_VALID_BASIS_OR_CONTRACT`',
              'There is **no** `DeviceHistory`, `DnsQuery`, `Domain`, `VisitedUrl`, `TopDomain`, `ChildActivity`, `BrowsingEvent`, `JourneyToAccount`, `ClientHistory`',
              'A has no `journey_token` field.',
              '**Do not claim that the DNS/profile was removed from the physical phone.**',
              'J0/J1 are never restored.',
              'ACC-0233 / VER-0233 / EVD-0233',
          ]
          for marker in required_markers:
              assert marker in artifact, marker

          lines = artifact.splitlines()
          seven_header = '| Field | Requirement/control | Purpose / lawful-basis status | Storage & access | Retention | Deletion | Backup |'
          seven_indices = [i for i, line in enumerate(lines) if line == seven_header]
          assert len(seven_indices) == 2, seven_indices
          seven_tables = []
          for idx in seven_indices:
              out = []
              for line in lines[idx+2:]:
                  if not line.startswith('|'):
                      break
                  vals = [v.strip() for v in line.strip().strip('|').split('|')]
                  assert len(vals) == 7, (vals[0] if vals else '?', len(vals))
                  assert all(vals), vals[0]
                  out.append(vals)
              seven_tables.append(out)
          j0, j1 = seven_tables
          assert len(j0) == 9, len(j0)
          assert len(j1) == 16, len(j1)

          auth_header = '| Field/state | Requirement/control | Purpose / lawful-basis status | Storage & access | Retention | Deletion/revocation | Backup |'
          ai = lines.index(auth_header)
          auth = []
          for line in lines[ai+2:]:
              if not line.startswith('|'):
                  break
              vals = [v.strip() for v in line.strip().strip('|').split('|')]
              assert len(vals) == 7 and all(vals), vals
              auth.append(vals)
          assert len(auth) == 3, len(auth)

          account_header = '| Field | Requirement/control | Purpose / lawful-basis status | Access | Retention | Deletion | Backup |'
          account_indices = [i for i, line in enumerate(lines) if line == account_header]
          assert len(account_indices) == 2, account_indices
          account_tables = []
          for idx in account_indices:
              out = []
              for line in lines[idx+2:]:
                  if not line.startswith('|'):
                      break
                  vals = [v.strip() for v in line.strip().strip('|').split('|')]
                  assert len(vals) == 7 and all(vals), vals
                  out.append(vals)
              account_tables.append(out)
          parent_account, parent_device = account_tables
          assert len(parent_account) == 5, len(parent_account)
          assert len(parent_device) == 16, len(parent_device)

          all_fields = j0 + j1 + auth + parent_account + parent_device
          assert len(all_fields) == 49, len(all_fields)
          for r in all_fields:
              assert re.search(r'(REQ-|CON-|TSK-0230)', r[1]), (r[0], r[1])
              assert any(tok in r[2] for tok in ['LI_CONDITIONAL','CONTRACT_CONDITIONAL','NOT_PERSONAL_OR_SYNTHETIC','same conditional status','same status rule']), (r[0], r[2])
              for cell in r[3:]:
                  assert cell not in {'TBD','UNKNOWN','—','-',''}, (r[0], cell)

          j1_names = {r[0] for r in j1}
          for forbidden in ['`parent_id`','`provider_subject`','`device_id`','`adguard_client_id`','`email`','`ip_address`']:
              assert forbidden not in j1_names, forbidden
          assert any(r[0] == '`journey_token`' and '24h' in r[4] and '15m' in r[5] and 'excluded from durable backups' in r[6] for r in j1)

          pa_names = {r[0] for r in parent_account}
          assert pa_names == {'`parent_id`','`provider_subject`','`account_status`','`created_at`','`row_version`'}
          pd_names = {r[0] for r in parent_device}
          expected_pd = {
              '`device_id`','`parent_id`','`nickname`','`platform_family`','`lifecycle_status`','`adguard_client_id`',
              '`settings_profile_id`','`settings_version`','`protection_state`','`protection_reason_code`','`verifier_version`',
              '`evaluated_at`','`evidence_fresh_until`','`row_version`','`created_at`','`updated_at`'
          }
          assert pd_names == expected_pd, (pd_names, expected_pd)

          settings_profile = next(r for r in parent_device if r[0] == '`settings_profile_id`')
          settings_version = next(r for r in parent_device if r[0] == '`settings_version`')
          for r in [settings_profile, settings_version]:
              assert 'CONTRACT_CONDITIONAL' in r[2] and 'LI_CONDITIONAL' in r[2]
          client_row = next(r for r in parent_device if r[0] == '`adguard_client_id`')
          assert 'never authorization' in client_row[3]
          protection_row = next(r for r in parent_device if r[0] == '`protection_state`')
          assert 'Latest current record only' in protection_row[4]
          assert 'fresh' in protection_row[6].lower()

          prohibited_schema_tokens = ['| `dns_query` |', '| `domain` |', '| `visited_url` |', '| `top_domain` |', '| `child_activity` |', '| `journey_to_account` |']
          for token in prohibited_schema_tokens:
              assert token.lower() not in artifact.lower(), token
          assert 'No table, cache, log or analytics projection may map the two domains.' in artifact
          assert 'does not import the J1 record or preserve a J1 event trail' in artifact

          assert 'Until exact backup retention and deletion-propagation/restore semantics are frozen' in artifact
          assert 'no exact period is invented' in artifact.lower()
          assert 'Final UK legal/data readiness' in artifact
          assert 'This design is not legal sign-off.' in artifact

          assertions = re.findall(r'^([0-9]+)\. ', artifact, flags=re.M)
          assert all(str(i) in assertions for i in range(1,21)), assertions

          print('TSK0233_WBS_CONTRACT=PASS')
          print('TSK0233_DEPENDENCIES=PASS')
          print('TSK0233_ACC_REGISTER=PASS')
          print('TSK0233_LINKED_CONTROLS=PASS')
          print('TSK0233_FIELD_ROWS=49')
          print('TSK0233_FIELD_MAPPING_COMPLETENESS=PASS')
          print('TSK0233_J0_J1_MINIMISATION=PASS')
          print('TSK0233_NO_J1_ACCOUNT_LINKAGE=PASS')
          print('TSK0233_PERSISTENT_SCOPE=PASS')
          print('TSK0233_CLIENTID_NOT_AUTH=PASS')
          print('TSK0233_NO_BROWSING_HISTORY_STORE=PASS')
          print('TSK0233_RETENTION_DELETION_BACKUP=PASS')
          print('TSK0233_CORE_NO_IDENTITY=PASS')
          print('TSK0233_RSK0001_NONINFERENCE=PASS')
          print('TSK0233_INT0007_FUTURE_REALITY_CHECK=PASS')
          PY

          python3 Plans/Master/Tools/validate_master_plan.py

          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          lines = [
              '## TSK-0233 current accepted stable state — 2026-09-01 — POST-CR-0008',
              '',
              '`TSK-0233 — Design minimal dual-mode journey/account data model, storage, retention, and deletion flows`: **PASS** under current `ACC-0233 / VER-0233 / EVD-0233`, current `TSK-0235` + `TSK-0230` dependency proof, and CR-0008 authority.',
              '',
              '- Action authority: **A3 / AUTO_ALLOWED**.',
              '- Artifact: `TSK_0233_MINIMAL_DUAL_MODE_JOURNEY_ACCOUNT_DATA_MODEL_2026-09-01.md`, version `1.0.1`, blob `156a1811bc4322e16474874e728d23a97a93ec4c`, publication commit `139acb64760d1bc224129a1d72849528c1f7b126`.',
              '- Accepted storage model: J0 session-only accountless state; optional J1 anonymous server state max 24h/non-sliding with early deletion and no durable backup; optional AUTH server-session boundary; separate minimum persistent parent/device ownership/settings/lifecycle/current-state domain A.',
              '- No J1-to-account migration/linkage exists. Optional account-mode device creation uses fresh allowlisted account inputs and server-generated ownership/control references; sign-in never extends J1 or imports anonymous history.',
              '- Persistent A-domain fields are limited to minimum provider/account reference, opaque ownership/device IDs, optional nickname/coarse platform, curated settings, current lifecycle/concurrency metadata, server-only ClientID linkage and one current freshness-bounded Protection Map record. ClientID is never authorization and account/device ownership never constitutes technical verification.',
              '- Identifiable DNS/query/domain/URL/browsing/top-domain/child-activity history has no product schema/store; persistent query/file logging remains off and identifiable per-client statistics remain off/excluded.',
              '- Retention/deletion/backup handling is explicit: J0 session-only; J1 <=24h and no backup; active account/device rows exist only for active approved ownership/settings/lifecycle purpose; device/account deletion and AdGuard reconciliation are separate from physical phone DNS/profile removal; restore cannot resurrect J1 or stale verified protection.',
              '- Production A-domain backup processing remains fail-closed until exact backup retention/access/encryption/deletion-propagation/restore semantics are frozen; durable D25 deletion-completion evidence likewise requires an independently justified basis and exact retention before production. No legal duration was invented.',
              '- `RSK-0001` remains OPEN. This L5 design does not establish final UK legal/data readiness or authorize real England participant processing. `INT-0007` still requires later runtime/database/cache/log/backup/config inspection against actual implementation reality.',
              f'- Acceptance workflow run `{os.environ["RUN_ID"]}` verified exact WBS/dependencies/ACC/VER/EVD and linked controls, 49 field rows with mapping/access/retention/deletion/backup completeness, anonymous/persistent separation, no J1-account linkage, minimum persistent scope, ClientID non-authorization, no browsing-history store, fail-closed retention/backup handling, core-no-identity invariant, legal non-inference and the full modular validator before this runtime mutation.',
              '- **Non-inference:** no datastore/vendor implementation, auth/session vendor acceptance, production backup approval, code/build/deployment, LG-07/LG-08/LG-09, participant activation, market activation, launch or downstream task becomes PASS from this architecture freeze.',
          ]
          p.write_text(text.rstrip() + '\n\n' + '\n'.join(lines) + '\n', encoding='utf-8')
          PY

          git diff --check
          test "$(git status --porcelain | sed 's/^...//')" = 'CURRENT_STATE.md'
          echo 'ACC_0233=PASS'
          echo 'VER_0233=PASS'
          echo 'EVD_0233=PASS'
          echo 'TSK0233_STATE_CANDIDATE=PASS'

      - name: Persist and independently read back TSK-0233 state
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0233 dual-mode data model'
          C="$(git rev-parse HEAD)"
          B="$(git rev-parse "$C:CURRENT_STATE.md")"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$C"
          test "$(git rev-parse "origin/main:CURRENT_STATE.md")" = "$B"
          git show "origin/main:CURRENT_STATE.md" | grep -F '## TSK-0233 current accepted stable state — 2026-09-01 — POST-CR-0008'
          echo "TSK0233_STATE_COMMIT=$C"
          echo "TSK0233_STATE_BLOB=$B"
          echo 'TSK0233_ACCEPTANCE_REMOTE_READBACK=PASS'
