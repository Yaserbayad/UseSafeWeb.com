name: Reconcile current TSK-0330 acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0330-current-20260831.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile current TSK-0330 PASS into CURRENT_STATE
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "adguardvm"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 .github/scripts/reconcile_tsk0330_current_20260831.py
          git diff --check
          grep -Fq '## TSK-0330 current accepted stable state — 2026-08-31 — POST-CR-0007' CURRENT_STATE.md
          grep -Fq '33420018806 / 99579828681' CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: current-revalidate TSK-0330'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          echo "TSK0330_RUNTIME_RECONCILIATION=PASS"
          echo "TSK0330_RUNTIME_COMMIT=$(git rev-parse HEAD)"
          echo "TSK0330_RUNTIME_BLOB=$(git rev-parse HEAD:CURRENT_STATE.md)"
