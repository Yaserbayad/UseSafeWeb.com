name: Reconcile TSK-0313 PASS and inspect L4 queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0313-pass-and-inspect-l4.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify Protection Map requirements, reconcile, inspect queue
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object TSK_0313_PROTECTION_MAP_STATE_EVIDENCE_REQUIREMENTS_2026-08-28.md)" = "521c9cc5073aa289281acade12a66a9e979e197d"
          test "$(git hash-object TSK_0313_PROTECTION_MAP_STATE_EVIDENCE_REQUIREMENTS_EVIDENCE_2026-08-28.md)" = "c9b0b890a43680b45afe72f73ff5ffc268fb1b79"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline=''))); by={r['Task_ID']:r for r in rows}
          t=by['TSK-0313']
          assert set(x.strip() for x in t['Dependencies'].split(';'))=={'TSK-0041','TSK-0144','TSK-0146'}
          assert t['Priority']=='MEDIUM' and t['AI_Capability_A0_A4']=='A3' and t['Action_Authority']=='AUTO_ALLOWED'
          assert 'Every Protection Map state has entry/evidence rules' in t['Acceptance_Criteria']
          e=pathlib.Path('TSK_0313_PROTECTION_MAP_STATE_EVIDENCE_REQUIREMENTS_EVIDENCE_2026-08-28.md').read_text()
          assert 'directly satisfies every ACC-0313 clause' in e
          assert 'TSK-0320 remains exact owner' in e and 'TSK-0229 remains owner' in e and 'RSK-0002' in e
          p=pathlib.Path('CURRENT_STATE.md'); text=p.read_text()
          assert '### TSK-0041 accepted stable state' in text
          assert 'Selected next: `TSK-0313' in text
          assert '### TSK-0313 accepted stable state' not in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          sec='''### TSK-0313 accepted stable state\n\n`TSK-0313 — Specify Protection Map state and evidence requirements`: **PASS for the provisional internal L4 product requirements under DEC-0050/CR-0003**. Requirements `TSK_0313_PROTECTION_MAP_STATE_EVIDENCE_REQUIREMENTS_2026-08-28.md`, blob `521c9cc5073aa289281acade12a66a9e979e197d`; independent evidence `TSK_0313_PROTECTION_MAP_STATE_EVIDENCE_REQUIREMENTS_EVIDENCE_2026-08-28.md`, blob `c9b0b890a43680b45afe72f73ff5ffc268fb1b79`. ACC-0313 is satisfied: S1-S6 entry/evidence requirements, parent-facing semantic requirements, transitions, unsupported/mixed-state behavior, accountless persistence scope, device-versus-journey boundary, testable examples and no-account-ownership rules are explicit; parent confirmation can never masquerade as system verification.\n\nAuthority remains non-duplicative: TSK-0320 owns exact state/copy semantics; TSK-0229 owns J0/J1 data/TTL/deletion/no-linkage semantics; TSK-0313 owns cross-layer Product Map application and QA requirements. `RSK-0002` remains OPEN because representative-parent comprehension/usefulness is unvalidated. This PASS does not authorize LG-05/LG-06, implementation/build, participants, legal completion, payment, public release or launch.\n\n'''
          marker='## Runtime safeguards'; assert marker in text
          text=text.replace(marker,sec+marker,1)
          pass_set={r['Task_ID'] for r in rows if r.get('Execution_State')=='PASS'}
          pass_set.update(re.findall(r'^### (TSK-\d{4}) accepted stable state$', text, re.M))
          pass_set.add('TSK-0313')
          pri={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          candidates=[]
          for idx,r in enumerate(rows):
              if r.get('Lifecycle_Stage')!='L4': continue
              if r['Task_ID'] in pass_set: continue
              if r.get('Plan_Status') in {'DEFERRED','NOT_APPLICABLE'}: continue
              if r.get('Action_Authority')!='AUTO_ALLOWED': continue
              deps=[x.strip() for x in (r.get('Dependencies') or '').split(';') if x.strip()]
              if not all(d in pass_set for d in deps): continue
              flags=[]
              hay=' '.join([r.get('Acceptance_Criteria',''),r.get('Preconditions',''),r.get('Notes',''),r.get('Trigger','')]).lower()
              if any(k in hay for k in ['representative parent','real participant','cohort','usability','comprehension','behavioral','observed parent','user evidence']): flags.append('REAL_OR_BEHAVIOR_EVIDENCE_CHECK')
              if any(k in hay for k in ['reviewed by owner','owner approval','explicit owner','approved by owner']): flags.append('OWNER_REVIEW_CHECK')
              candidates.append((pri.get(r.get('Priority','LOW'),9),idx,r,deps,flags))
          candidates.sort(key=lambda x:(x[0],x[1]))
          report=['# TSK-0313 post-PASS L4 queue inspection','','**Date:** 2026-08-28  ','**Purpose:** conservative derived queue after TSK-0313 PASS. This report is not authority and does not change task state.','',f'- Conservative PASS set size: {len(pass_set)}',f'- Dependency-ready non-PASS AUTO_ALLOWED L4 candidates: {len(candidates)}','','## Candidates in deterministic priority/WBS order','']
          for _,_,r,deps,flags in candidates:
              report += [f"### {r['Task_ID']} — {r['Title']}",f"- **Priority:** {r['Priority']}",f"- **Dependencies:** {'; '.join(deps) if deps else '(none)'}",f"- **Acceptance:** {r['Acceptance_ID']} — {r['Acceptance_Criteria']}",f"- **AI / authority:** {r['AI_Capability_A0_A4']} / {r['Action_Authority']}",f"- **Requirements:** {r.get('Requirement_Reference','')}",f"- **Interfaces:** {r.get('Interface_Reference','')}",f"- **Notes:** {r.get('Notes','')}",f"- **Preflight flags:** {', '.join(flags) if flags else '(none)'}",'']
          pathlib.Path('TSK_0313_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md').write_text('\n'.join(report)+'\n')
          q=text.rfind('\n## Queue status after current reconciliation'); assert q>=0
          text=text[:q].rstrip()+'''\n\n## Queue status after current reconciliation\n\n`TSK-0313` is runtime PASS. A fresh conservative dependency-ready AUTO_ALLOWED L4 queue has been generated at `TSK_0313_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md`. No next task is selected by this write; the queue must be reread against acceptance, direct predecessor evidence, gate/trigger conditions and CR-0003 before execution. HUMAN_ONLY/HUMAN_APPROVAL_REQUIRED and representative-parent work remain fenced.\n\n## Exact next authoritative step\n\nRead back the TSK-0313 post-PASS L4 queue, reject any candidate requiring unavailable real-user evidence, owner review/approval, unresolved trigger/gate or missing direct predecessor proof, and persist the deterministic highest-priority eligible AUTO_ALLOWED selection.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md TSK_0313_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md
          git commit -m "state: accept TSK-0313 and inspect L4 queue"
          git push
