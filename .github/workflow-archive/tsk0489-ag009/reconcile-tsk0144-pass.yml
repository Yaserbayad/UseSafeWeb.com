name: Reconcile TSK-0144 PASS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0144-pass.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify service evidence and reconcile runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object TSK_0144_ONE_RELEVANT_EXTERNAL_SERVICE_SAFEGUARD_REQUIREMENTS_2026-08-28.md)" = "f7821c8ef50aa517753c31477b383d660de11f40"
          test "$(git hash-object TSK_0144_ONE_RELEVANT_EXTERNAL_SERVICE_SAFEGUARD_EVIDENCE_2026-08-28.md)" = "2613667a6da870a3943ff5f0b528d635326e757c"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline=''))); by={r['Task_ID']:r for r in rows}
          t=by['TSK-0144']; n=by['TSK-0559']; blocked=by['TSK-0313']; owner_review=by['TSK-0140']
          assert t['Dependencies']=='TSK-0143'
          assert t['Priority']=='MEDIUM' and t['Action_Authority']=='AUTO_ALLOWED' and t['AI_Capability_A0_A4']=='A3'
          assert 'one-service limit' in t['Acceptance_Criteria'] and 'fallback to Not covered' in t['Acceptance_Criteria']
          assert n['Dependencies']=='TSK-0558'
          assert n['Priority']=='MEDIUM' and n['Action_Authority']=='AUTO_ALLOWED' and n['AI_Capability_A0_A4']=='A3'
          assert 'Mass low-quality AI SEO is prohibited' in n['Acceptance_Criteria']
          assert 'TSK-0041' in blocked['Dependencies'] and 'TSK-0144' in blocked['Dependencies']
          assert owner_review['Action_Authority']=='AUTO_ALLOWED' and 'reviewed by owner' in owner_review['Acceptance_Criteria'].lower()
          e=pathlib.Path('TSK_0144_ONE_RELEVANT_EXTERNAL_SERVICE_SAFEGUARD_EVIDENCE_2026-08-28.md').read_text()
          assert 'directly satisfies every ACC-0144 clause' in e
          assert 'UPA-004' in e and 'RSK-0002' in e and 'zero-service journeys are required' in e.lower()
          p=pathlib.Path('CURRENT_STATE.md'); text=p.read_text()
          assert '### TSK-0143 accepted stable state' in text
          assert '### TSK-0144 accepted stable state' not in text
          # Direct predecessor evidence rule: TSK-0313 remains ineligible because CURRENT_STATE has no direct accepted TSK-0041 proof.
          assert 'TSK-0041 accepted stable state' not in text and '`TSK-0041`' not in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          sec='''### TSK-0144 accepted stable state\n\n`TSK-0144 — Specify the one relevant external-service safeguard step`: **PASS for the provisional internal L4 service-guidance contract under DEC-0050/CR-0003**. Contract `TSK_0144_ONE_RELEVANT_EXTERNAL_SERVICE_SAFEGUARD_REQUIREMENTS_2026-08-28.md`, blob `f7821c8ef50aa517753c31477b383d660de11f40`; independent evidence `TSK_0144_ONE_RELEVANT_EXTERNAL_SERVICE_SAFEGUARD_EVIDENCE_2026-08-28.md`, blob `2613667a6da870a3943ff5f0b528d635326e757c`. ACC-0144 is satisfied: service eligibility/applicability, supported/unsupported states, zero-or-one hard limit, parent-confirmed truth, source/version/update ownership and `Not covered` fallback are explicit. No named service is hard-coded from popularity or inferred child behavior; service use must be parent-declared and current-policy/source eligible.\n\nThe UK government's current July 2026 response, updated 19 August 2026, plans under-16 social-media service restrictions for spring 2027 while exact covered-service implementation remains in progress, reinforcing the canonical service-agnostic rule. `UPA-004`/`RSK-0002` remain OPEN: no representative-parent evidence proves the service step's relevance or incremental value. This PASS does not authorize LG-05/LG-06, implementation/build, participants, legal completion, payment, public release or launch.\n\n'''
          marker='## Runtime safeguards'; assert marker in text
          text=text.replace(marker,sec+marker,1)
          q=text.rfind('\n## Queue status after current reconciliation'); assert q>=0
          text=text[:q].rstrip()+f'''\n\n## Queue status after current reconciliation\n\n`TSK-0144` is runtime PASS. `TSK-0313` is **not** eligible yet because its direct hard predecessor `TSK-0041` has no current direct accepted evidence in runtime; TSK-0144 cannot transitively satisfy that missing predecessor. `TSK-0140` remains unselected because its own acceptance requires owner/multi-role review evidence not present. HUMAN_ONLY and real-user-bound tasks remain fenced. The next dependency-ready MEDIUM/A3/AUTO_ALLOWED provisional-L4 task is `TSK-0559`.\n\n- **Selected next: `TSK-0559 — {n['Title']}`** (L4 / {n['AI_Capability_A0_A4']} / {n['Action_Authority']} / {n['Priority']}).\n- Hard dependency: `TSK-0558` — previously established dependency-ready in the current L4 queue and must be rechecked before execution.\n- ACC-0559: {n['Acceptance_Criteria']}\n- Selection rationale: no earlier equal/higher-priority executable AUTO_ALLOWED L4 task remains after the current reconciliations; the task is internal content-governance design and does not require representative-parent evidence to define a quality/source standard.\n\n## Exact next authoritative step\n\nRecheck TSK-0558 direct PASS evidence, then execute bounded `TSK-0559`: define the first-phone content research/originality/usefulness/source/claims/update/localization/pruning standard, explicitly prohibiting mass low-quality AI SEO; ensure every content item maps to a real high-intent job and product/help path with source, review owner and metric; preserve the initial earned-distribution and USD 20-50/month GTM constraints; carry provisional evidence limits; persist/read back independent ACC-0559 evidence; reconcile runtime; then recompute.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md
          git commit -m "state: accept TSK-0144 and select TSK-0559"
          git push
