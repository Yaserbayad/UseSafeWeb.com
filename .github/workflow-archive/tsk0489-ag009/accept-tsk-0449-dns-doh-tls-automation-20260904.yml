name: Accept TSK-0449 DNS DoH TLS automation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-tsk-0449-dns-doh-tls-automation-20260904.yml'
      - 'infrastructure/adguard-server/tsk-0449-dns-tls-verifier.sh'

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  target-verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify target identity, authority and dependency evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${RUNNER_OS}" == "Linux" ]]
          [[ "${RUNNER_ARCH}" == "X64" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          sudo -n true
          . /etc/os-release
          [[ "${ID}" == "ubuntu" ]]
          [[ "${VERSION_ID}" == "24.04" ]]
          grep -Fq '## TSK-0451 current accepted stable state — 2026-09-04' CURRENT_STATE.md
          grep -Fq ': **PASS** under current `ACC-0451 / VER-0451 / EVD-0451`.' CURRENT_STATE.md
          grep -Fq 'LG-07' CURRENT_STATE.md
          grep -Fq '`LG-07 — Architecture, Security, Privacy and Delivery Readiness`: **PASS** under the current gate contract and `AUTO_ALLOWED` authority.' CURRENT_STATE.md
          grep -Fq 'CR-0012' Plans/Master/Registers/EXCEPTIONS_CHANGE_CONTROLS.md
          grep -Fq '`TSK-0455` remains DEFERRED / WAITING' CURRENT_STATE.md
          echo 'TARGET_RUNNER=adguardvm'
          echo 'DEPENDENCY_TSK_0451=PASS'
          echo 'LG_07=PASS'
          echo 'CR_0012_PRESERVED=PASS'

      - name: Verify TSK-0449 on approved target without configuration mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          script='infrastructure/adguard-server/tsk-0449-dns-tls-verifier.sh'
          test -f "${script}"
          bash -n "${script}"
          sudo bash "${script}" --target | tee /tmp/tsk-0449-target.txt
          grep -Fq 'DNS_DIRECT_TARGET=PASS' /tmp/tsk-0449-target.txt
          grep -Fq 'DOH_ENDPOINT=PASS' /tmp/tsk-0449-target.txt
          grep -Fq 'TLS_CHAIN_HOSTNAME=PASS' /tmp/tsk-0449-target.txt
          grep -Fq 'TLS_PROTOCOL=PASS' /tmp/tsk-0449-target.txt
          grep -Fq 'CERTBOT_RENEW_DRY_RUN=PASS' /tmp/tsk-0449-target.txt
          grep -Fq 'CERTIFICATE_PRODUCTION_MATERIAL_UNCHANGED=PASS' /tmp/tsk-0449-target.txt
          grep -Fq 'EXPIRY_MONITOR=PASS' /tmp/tsk-0449-target.txt
          grep -Fq 'EMERGENCY_REPLACEMENT_RUNBOOK=PASS' /tmp/tsk-0449-target.txt
          grep -Fq 'SECRET_BOUNDARY=PASS' /tmp/tsk-0449-target.txt
          grep -Fq 'ROLLBACK_CONTROL=PASS' /tmp/tsk-0449-target.txt
          grep -Fq 'PRODUCTION_CONFIGURATION_MUTATION=NONE' /tmp/tsk-0449-target.txt
          grep -Fq 'ACC_0449=PASS' /tmp/tsk-0449-target.txt
          grep -Fq 'VER_0449=PASS' /tmp/tsk-0449-target.txt
          printf 'SOURCE_COMMIT=%s\n' "${GITHUB_SHA}" >> /tmp/tsk-0449-target.txt
          printf 'SOURCE_SCRIPT_SHA256=%s\n' "$(sha256sum "${script}" | awk '{print $1}')" >> /tmp/tsk-0449-target.txt
          echo 'TARGET_VERIFY_JOB=PASS' >> /tmp/tsk-0449-target.txt

      - name: Upload sanitized target evidence
        uses: actions/upload-artifact@v4
        with:
          name: tsk-0449-target
          path: /tmp/tsk-0449-target.txt
          if-no-files-found: error
          retention-days: 7

  independent-external-verify:
    needs: target-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Independently verify public DNS DoH and TLS boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          script='infrastructure/adguard-server/tsk-0449-dns-tls-verifier.sh'
          bash "${script}" --external | tee /tmp/tsk-0449-external.txt
          grep -Fq 'DNS_RESOLUTION=PASS' /tmp/tsk-0449-external.txt
          grep -Fq 'DOH_ENDPOINT=PASS' /tmp/tsk-0449-external.txt
          grep -Fq 'TLS_CHAIN_HOSTNAME=PASS' /tmp/tsk-0449-external.txt
          grep -Fq 'NEGATIVE_PUBLIC_ADMIN=REJECTED' /tmp/tsk-0449-external.txt
          grep -Fq 'NEGATIVE_WRONG_TLS_HOSTNAME=REJECTED' /tmp/tsk-0449-external.txt
          grep -Fq 'PRODUCTION_CONFIGURATION_MUTATION=NONE' /tmp/tsk-0449-external.txt
          grep -Fq 'ACC_0449=PASS' /tmp/tsk-0449-external.txt
          grep -Fq 'VER_0449=PASS' /tmp/tsk-0449-external.txt
          grep -Fq 'INDEPENDENT_VERIFY=PASS' /tmp/tsk-0449-external.txt
          printf 'SOURCE_COMMIT=%s\n' "${GITHUB_SHA}" >> /tmp/tsk-0449-external.txt
          printf 'SOURCE_SCRIPT_SHA256=%s\n' "$(sha256sum "${script}" | awk '{print $1}')" >> /tmp/tsk-0449-external.txt
          echo 'PRIVACY=PASS secrets=not_emitted raw_query_data=not_emitted client_identifiers=not_emitted' >> /tmp/tsk-0449-external.txt

      - name: Upload sanitized independent evidence
        uses: actions/upload-artifact@v4
        with:
          name: tsk-0449-external
          path: /tmp/tsk-0449-external.txt
          if-no-files-found: error
          retention-days: 7

  persist:
    needs: independent-external-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Download sanitized evidence
        uses: actions/download-artifact@v4
        with:
          pattern: tsk-0449-*
          path: ${{ runner.temp }}/tsk-0449-evidence
          merge-multiple: true

      - name: Verify evidence, persist EVD-0449 and synchronize runtime
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "${SOURCE_COMMIT}" ]]
          [[ "$(git rev-parse origin/main)" == "${SOURCE_COMMIT}" ]]

          target="${RUNNER_TEMP}/tsk-0449-evidence/tsk-0449-target.txt"
          external="${RUNNER_TEMP}/tsk-0449-evidence/tsk-0449-external.txt"
          test -f "${target}"
          test -f "${external}"
          grep -Fq 'TARGET_VERIFY_JOB=PASS' "${target}"
          grep -Fq 'CERTBOT_RENEW_DRY_RUN=PASS' "${target}"
          grep -Fq 'CERTIFICATE_PRODUCTION_MATERIAL_UNCHANGED=PASS' "${target}"
          grep -Fq 'DNS_DIRECT_TARGET=PASS' "${target}"
          grep -Fq 'ROLLBACK_CONTROL=PASS' "${target}"
          grep -Fq 'PRODUCTION_CONFIGURATION_MUTATION=NONE' "${target}"
          grep -Fq 'INDEPENDENT_VERIFY=PASS' "${external}"
          grep -Fq 'PRIVACY=PASS secrets=not_emitted raw_query_data=not_emitted client_identifiers=not_emitted' "${external}"
          grep -Fq 'PRODUCTION_CONFIGURATION_MUTATION=NONE' "${external}"
          grep -Fq 'ACC_0449=PASS' "${external}"
          grep -Fq 'VER_0449=PASS' "${external}"

          script='infrastructure/adguard-server/tsk-0449-dns-tls-verifier.sh'
          evidence_file='TSK_0449_DNS_DOH_TLS_AUTOMATION_EVIDENCE_2026-09-04.md'
          script_blob="$(git hash-object "${script}")"
          script_sha256="$(sha256sum "${script}" | awk '{print $1}')"
          target_sha256="$(sha256sum "${target}" | awk '{print $1}')"
          external_sha256="$(sha256sum "${external}" | awk '{print $1}')"

          cat > "${evidence_file}" <<EVIDENCE
          # TSK-0449 DNS, DoH endpoint, and certificate automation evidence

          **Date:** 2026-09-04
          **Task:** TSK-0449 — Implement environment DNS, DoH endpoint, and certificate automation
          **Acceptance:** ACC-0449
          **Verification:** VER-0449
          **Evidence:** EVD-0449
          **Source commit:** \`${SOURCE_COMMIT}\`
          **Verifier blob:** \`${script_blob}\`
          **Verifier SHA-256:** \`${script_sha256}\`
          **GitHub Actions run / attempt:** \`${GITHUB_RUN_ID} / ${GITHUB_RUN_ATTEMPT}\`
          **Target:** repository-scoped self-hosted runner on \`adguardvm\`, Ubuntu 24.04 LTS, Azure West Europe.

          ## Result

          **PASS.** The existing approved DNS/DoH/TLS automation was verified without changing DNS records, Azure resources, Nginx configuration, firewall state, certificate lineage, public activation, or any participant-facing state.

          - Target verification confirmed \`dns.usesafeweb.com\` resolves directly to the handed-off Azure resolver without persisting the address, and the target is in the approved West Europe region.
          - Local target verification passed trusted TLS hostname/chain checks on encrypted-DNS listeners, TLS protocol checks, DoH response validation, negative wrong-hostname/path/admin checks, and the non-public plaintext-DNS boundary.
          - A separate GitHub-hosted verifier independently passed public DNS resolution, public DoH TLS/hostname validation on TCP 443, DoH response validation, and negative public-admin/wrong-route/wrong-hostname checks.
          - \`certbot.timer\` is enabled/active; the existing root-owned deploy hook is present/executable; the approved Certbot renewal rehearsal passed with \`--dry-run --no-random-sleep-on-renew\`.
          - The production certificate full-chain hash was identical before and after the renewal rehearsal; no production certificate was replaced by this task.
          - The daily expiry monitor retains the approved 30-day threshold and owner issue route; the emergency replacement/rollback runbook remains present.
          - Private-key contents were never read; ownership/permission checks passed, and versioned DNS/TLS artifacts contain no detected secret material.
          - No CI/ephemeral resolver endpoint is provisioned yet (TSK-0450 is downstream); persistent staging was not triggered. No new CI/staging/public DNS endpoint was provisioned.

          ## Sanitized evidence integrity

          - Target transcript SHA-256: \`${target_sha256}\`
          - Independent external transcript SHA-256: \`${external_sha256}\`
          - Evidence contains no IP address, private key, ACME credential, registrar/API credential, raw DNS response/query history, or participant/client identifier.

          ## Authority and non-inference

          This evidence uses the existing canonical \`DNS_ENDPOINT_DECISION.md\`, \`TLS_CERTIFICATE_RENEWAL_RUNBOOK.md\`, and \`certificate-expiry-monitor.yml\`; it creates no second DNS/certificate authority. REQ-0049/REQ-0050, CON-0004/CON-0005, INT-0014, and RSK-0048 remain controlling. This PASS proves only TSK-0449. It does not pass or alter TSK-0455, TSK-0456, TSK-0457 or TSK-0492; deploy a new environment; change DNS records; issue/replace a production certificate; distribute profiles/certificates; revoke service; process participants; enable telemetry; authorize public/market activation; make payment; or satisfy launch gates.
          EVIDENCE

          evidence_blob="$(git hash-object "${evidence_file}")"
          state='CURRENT_STATE.md'
          heading='## TSK-0449 current accepted stable state — 2026-09-04'
          ! grep -Fq "${heading}" "${state}"
          grep -Fq '## TSK-0451 current accepted stable state — 2026-09-04' "${state}"
          grep -Fq ': **PASS** under current `ACC-0451 / VER-0451 / EVD-0451`.' "${state}"
          grep -Fq '`LG-07 — Architecture, Security, Privacy and Delivery Readiness`: **PASS** under the current gate contract and `AUTO_ALLOWED` authority.' "${state}"
          grep -Fq '`TSK-0455` remains DEFERRED / WAITING' "${state}"
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sed -i -E "0,/^\*\*Updated:\*\*/s|^\*\*Updated:\*\*.*$|**Updated:** ${now}|" "${state}"
          cat >> "${state}" <<STATE

          ${heading}

          \`TSK-0449 — Implement environment DNS, DoH endpoint, and certificate automation\`: **PASS** under current \`ACC-0449 / VER-0449 / EVD-0449\`.

          - Action authority: **A3 / AUTO_ALLOWED**; direct hard dependency \`TSK-0451\` and lifecycle gate \`LG-07\` are current durable PASS.
          - Exact target: repository-scoped self-hosted runner on \`adguardvm\`, Ubuntu 24.04 LTS, Azure West Europe; independent public verification ran on a separate GitHub-hosted Ubuntu 24.04 runner.
          - Versioned verifier: \`${script}\`, blob \`${script_blob}\`, SHA-256 \`${script_sha256}\`; source commit \`${SOURCE_COMMIT}\`.
          - Durable evidence: \`${evidence_file}\`, blob \`${evidence_blob}\`; GitHub Actions run/attempt \`${GITHUB_RUN_ID} / ${GITHUB_RUN_ATTEMPT}\`.
          - Verification: direct target DNS identity/region; local encrypted-DNS TLS checks plus independent external public DoH TLS/hostname validation; DoH request/response checks; negative admin/route/hostname/plaintext-DNS checks; Certbot timer; fresh renewal dry-run; production full-chain unchanged; deploy-hook ownership/executability; expiry monitor; emergency replacement/rollback procedure; private-key permission and secret-boundary checks.
          - Production mutation: **none**. DNS records, Azure resources, Nginx/firewall configuration, certificate lineage, public activation and participant-facing state were not changed; persistent staging was not triggered.
          - Security/privacy: no IP address, private key, ACME/registrar/API credential, raw DNS response/query history, or participant/client identifier is written to Git/evidence.
          - **Non-inference:** \`TSK-0455\` remains DEFERRED / WAITING under DEC-0059 / CR-0012 with unchanged \`ACC-0455 / VER-0455 / EVD-0455\`; \`TSK-0456\`, \`TSK-0457\` and \`TSK-0492\` remain dependency-blocked. No new environment deployment, participant processing, telemetry, profile/certificate distribution, service revocation/removal, public/market activation, payment or launch authority is inferred.
          STATE

          git diff --check
          [[ "$(git status --porcelain | wc -l)" -eq 2 ]]
          git status --porcelain | grep -Fq ' M CURRENT_STATE.md'
          git status --porcelain | grep -Fq "?? ${evidence_file}"
          ! git diff -- CURRENT_STATE.md | grep -Eq '^[-].*TSK-0455'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md "${evidence_file}"
          git diff --cached --check
          ! git diff --cached | grep -Eiq 'BEGIN ([A-Z ]+)?PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}'
          git commit -m 'state: accept TSK-0449 DNS DoH TLS automation'
          git push origin HEAD:main
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$(git rev-parse HEAD)" ]]
          [[ "$(git show origin/main:"${evidence_file}" | git hash-object --stdin)" == "$(git hash-object "${evidence_file}")" ]]
          [[ "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" == "$(git hash-object CURRENT_STATE.md)" ]]
          echo "PERSISTED_COMMIT=$(git rev-parse HEAD)"
          echo 'PERSIST_READBACK=PASS'
