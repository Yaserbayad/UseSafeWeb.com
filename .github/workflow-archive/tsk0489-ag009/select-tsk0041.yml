name: Select TSK-0041

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/select-tsk0041.yml'

permissions:
  contents: write

jobs:
  select:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify queue and select TSK-0041
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object TSK_0559_POST_PASS_L4_QUEUE_INSPECTION_2026-08-28.md)" = "a8098f6450046e9813cf379ffe508cffeba75023"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline=''))); by={r['Task_ID']:r for r in rows}
          t=by['TSK-0041']; real=by['TSK-0187']; owner=by['TSK-0140']
          assert t['Lifecycle_Stage']=='L4' and t['Dependencies']=='TSK-0143'
          assert t['Priority']=='MEDIUM' and t['AI_Capability_A0_A4']=='A3' and t['Action_Authority']=='AUTO_ALLOWED'
          assert 'endpoint format' in t['Acceptance_Criteria'] and 'Private Relay/VPN conflicts' in t['Acceptance_Criteria'] and 'no-history constraints' in t['Acceptance_Criteria']
          assert 'Representative parents' in real['Acceptance_Criteria']
          assert 'reviewed by owner' in owner['Acceptance_Criteria'].lower()
          p=pathlib.Path('CURRENT_STATE.md'); text=p.read_text()
          assert '### TSK-0559 accepted stable state' in text
          assert '### TSK-0041 accepted stable state' not in text
          assert 'No next task is selected by this write' in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          q=text.rfind('\n## Queue status after current reconciliation'); assert q>=0
          text=text[:q].rstrip()+f'''\n\n## Queue status after current reconciliation\n\nThe TSK-0559 post-PASS queue was reread and independently screened. `TSK-0187` remains ineligible under CR-0003 because ACC-0187 requires representative-parent completion/comprehension evidence. `TSK-0140` remains ineligible for PASS because ACC-0140 requires owner/product/network/privacy/security/UX/support/finance review evidence not present. `TSK-0041` is the highest-priority remaining dependency-ready AUTO_ALLOWED provisional-L4 task.\n\n- **Selected next: `TSK-0041 — {t['Title']}`** (L4 / {t['AI_Capability_A0_A4']} / {t['Action_Authority']} / {t['Priority']}).\n- Hard dependency: `TSK-0143` — current PASS.\n- ACC-0041: {t['Acceptance_Criteria']}\n- Selection rationale: current predecessor PASS; technical/product requirements can be frozen from accepted UseSafeWeb DNS evidence without real-participant behavior or an owner approval act; its prior “future gate” note is superseded for bounded internal L4 definition by DEC-0050/CR-0003, not by build/launch authority.\n\n## Exact next authoritative step\n\nExecute bounded `TSK-0041`: specify the baseline DNS-protection activation requirements using the already accepted `dns.usesafeweb.com` Android DoT / Apple DoH profile contract, current filtering verification/rollback evidence, fail-safe/uncertainty rules, removal/recovery, Private Relay/VPN/browser/app/network conflict semantics, false-positive exception boundary and no-history privacy controls; carry `RSK-0002`; persist/read back independent ACC-0041 evidence; reconcile runtime; then recompute.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md
          git commit -m "state: select TSK-0041"
          git push
