name: Reconcile TSK-0143 PASS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-tsk0143-pass.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify routing evidence and reconcile runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object TSK_0143_NATIVE_DEVICE_SAFEGUARD_ROUTING_REQUIREMENTS_2026-08-28.md)" = "20b588c27bc0d71249bec2c83f33cf551afa4ff0"
          test "$(git hash-object TSK_0143_NATIVE_DEVICE_SAFEGUARD_ROUTING_REQUIREMENTS_EVIDENCE_2026-08-28.md)" = "d827c765959622dc3dad9f3c474bb17874c24ffa"
          python3 - <<'PY'
          import csv, pathlib, re
          from datetime import datetime, timezone
          rows=list(csv.DictReader(open('Plans/Master/WBS/master-wbs.csv',encoding='utf-8-sig',newline=''))); by={r['Task_ID']:r for r in rows}
          t=by['TSK-0143']; n=by['TSK-0144']; alt=by['TSK-0559']
          assert t['Dependencies']=='TSK-0146'
          assert t['Priority']=='MEDIUM' and t['Action_Authority']=='AUTO_ALLOWED' and t['AI_Capability_A0_A4']=='A3'
          assert 'supported platform states' in t['Acceptance_Criteria'] and 'stale guidance' in t['Acceptance_Criteria']
          assert n['Dependencies']=='TSK-0143'
          assert n['Priority']=='MEDIUM' and n['Action_Authority']=='AUTO_ALLOWED' and n['AI_Capability_A0_A4']=='A3'
          assert 'one-service limit' in n['Acceptance_Criteria'] and 'fallback to Not covered' in n['Acceptance_Criteria']
          assert alt['Priority']=='MEDIUM' and alt['Action_Authority']=='AUTO_ALLOWED'
          e=pathlib.Path('TSK_0143_NATIVE_DEVICE_SAFEGUARD_ROUTING_REQUIREMENTS_EVIDENCE_2026-08-28.md').read_text()
          assert 'directly satisfies every ACC-0143 clause' in e
          assert 'RSK-0002' in e and 'Family Link is not equivalent on iPhone/iPad' in e
          p=pathlib.Path('CURRENT_STATE.md'); text=p.read_text()
          assert '### TSK-0409 accepted stable state' in text
          assert '### TSK-0143 accepted stable state' not in text
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          text=re.sub(r'\*\*Updated:\*\* [^\n]+',f'**Updated:** {now}',text,count=1)
          sec='''### TSK-0143 accepted stable state\n\n`TSK-0143 — Specify native-device safeguard routing requirements`: **PASS for the provisional internal L4 routing contract under DEC-0050/CR-0003**. Contract `TSK_0143_NATIVE_DEVICE_SAFEGUARD_ROUTING_REQUIREMENTS_2026-08-28.md`, blob `20b588c27bc0d71249bec2c83f33cf551afa4ff0`; independent evidence `TSK_0143_NATIVE_DEVICE_SAFEGUARD_ROUTING_REQUIREMENTS_EVIDENCE_2026-08-28.md`, blob `d827c765959622dc3dad9f3c474bb17874c24ffa`. ACC-0143 is satisfied: supported-platform routing, already-configured skip behavior, parent-confirmed truth, unsupported/blocked paths, stale-guidance controls and verification limitations are explicit. The native layer is resolved from current canonical product authority as Apple/Google platform parental controls, not a new UseSafeWeb control system; exact per-version setting lists remain source/version-owned rather than guessed.\n\nCurrent first-party checks support Apple Screen Time/Family Sharing controls, Android/Family Link parental controls, Android 17+ on-device controls where actually available, and Google's explicit limitation that most Family Link supervision does not work on iPhone/iPad. `UPA-003`/`RSK-0002` remain OPEN: native-first value/friction and parent comprehension are not behaviorally validated. This PASS does not authorize LG-05/LG-06, implementation/build, participants, legal completion, payment, public release or launch.\n\n'''
          marker='## Runtime safeguards'; assert marker in text
          text=text.replace(marker,sec+marker,1)
          q=text.rfind('\n## Queue status after current reconciliation'); assert q>=0
          text=text[:q].rstrip()+f'''\n\n## Queue status after current reconciliation\n\n`TSK-0143` is runtime PASS. HUMAN_ONLY L4 tasks remain fenced and real-user-bound work remains deferred under CR-0003. `TSK-0144` is now dependency-ready and is the earliest WBS MEDIUM/A3/AUTO_ALLOWED provisional-L4 task; TSK-0559 remains another later MEDIUM/AUTO candidate.\n\n- **Selected next: `TSK-0144 — {n['Title']}`** (L4 / {n['AI_Capability_A0_A4']} / {n['Action_Authority']} / {n['Priority']}).\n- Hard dependency: `TSK-0143` — current PASS.\n- ACC-0144: {n['Acceptance_Criteria']}\n- Selection rationale: current dependency PASS, AUTO_ALLOWED, acceptance can be satisfied as a bounded service-guidance requirement without real-participant evidence, and WBS order precedes remaining equal-priority AUTO candidates.\n\n## Exact next authoritative step\n\nExecute bounded `TSK-0144`: define the one-relevant-external-service safeguard selection and state contract; specify eligibility/applicability, supported/unsupported handling, one-service maximum, parent-confirmed versus verified truth, source/version/update ownership, stale-guidance behavior and `Not covered` fallback; do not select a service based on invented popularity/user data; carry `UPA-004`/`RSK-0002`; persist/read back independent ACC-0144 evidence; reconcile runtime; then recompute.\n'''
          p.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_STATE.md
          git commit -m "state: accept TSK-0143 and select TSK-0144"
          git push
