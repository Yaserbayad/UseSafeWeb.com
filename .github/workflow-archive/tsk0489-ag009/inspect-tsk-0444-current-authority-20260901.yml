name: Verify and accept TSK-0444 current environment model v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tsk-0444-current-authority-20260901.yml'

permissions:
  contents: write

concurrency:
  group: usesafeweb-tsk-0444-current-acceptance
  cancel-in-progress: false

jobs:
  verify-accept:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify current contract and construct state candidate
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/accept_tsk0444_current_20260901.py')
          text = p.read_text(encoding='utf-8')
          old = "'persistent staging is **ABSENT**'"
          new = "'Persistent staging is **ABSENT**'"
          assert old in text
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('TSK0444_VERIFIER_CASE_FIX=PASS')
          PY
          python3 .github/scripts/accept_tsk0444_current_20260901.py
          git restore -- .github/scripts/accept_tsk0444_current_20260901.py
          git diff --check
          test "$(git status --porcelain | sed 's/^...//')" = 'CURRENT_STATE.md'

      - name: Persist only CURRENT_STATE and verify remote read-back
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept TSK-0444 current environment model'
          STATE_COMMIT="$(git rev-parse HEAD)"
          STATE_BLOB="$(git rev-parse "$STATE_COMMIT:CURRENT_STATE.md")"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$STATE_COMMIT"
          test "$(git rev-parse "origin/main:CURRENT_STATE.md")" = "$STATE_BLOB"
          git show "origin/main:CURRENT_STATE.md" | grep -F '## TSK-0444 current accepted stable state — 2026-09-01'
          echo "TSK0444_STATE_COMMIT=$STATE_COMMIT"
          echo "TSK0444_STATE_BLOB=$STATE_BLOB"
          echo 'TSK0444_ACCEPTANCE_REMOTE_READBACK=PASS'
