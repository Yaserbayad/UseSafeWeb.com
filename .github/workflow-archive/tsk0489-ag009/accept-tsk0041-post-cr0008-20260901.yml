name: Accept current TSK-0041 requalification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-tsk0041-post-cr0008-20260901.yml'
      - '.github/scripts/accept_tsk0041_post_cr0008_20260901.py'
      - 'TSK_0041_POST_CR0008_CURRENT_REQUALIFICATION_AMENDMENT_2026-09-01.md'
permissions:
  contents: write
jobs:
  verify-accept:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 3}
      - name: Verify and stage current TSK-0041
        env: {SOURCE_COMMIT: '${{ github.sha }}'}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          python3 .github/scripts/accept_tsk0041_post_cr0008_20260901.py
          git diff --check
          test "$(git status --porcelain | sed 's/^...//')" = 'CURRENT_STATE.md'
      - name: Persist and read back state
        env: {SOURCE_COMMIT: '${{ github.sha }}'}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'state: accept current TSK-0041 requalification'
          C="$(git rev-parse HEAD)"; B="$(git rev-parse "$C:CURRENT_STATE.md")"
          git push origin HEAD:main; git fetch origin main
          test "$(git rev-parse origin/main)" = "$C"
          test "$(git rev-parse "origin/main:CURRENT_STATE.md")" = "$B"
          git show "origin/main:CURRENT_STATE.md" | grep -F '## TSK-0041 current accepted stable state — 2026-09-01 — POST-CR-0008'
          echo "TSK0041_STATE_COMMIT=$C"
          echo "TSK0041_STATE_BLOB=$B"
          echo 'TSK0041_ACCEPTANCE_REMOTE_READBACK=PASS'