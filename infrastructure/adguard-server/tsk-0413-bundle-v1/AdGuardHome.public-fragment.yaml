# UseSafeWeb TSK-0413 secret-safe desired-state fragment.
# This is intentionally NOT a complete AdGuardHome.yaml. Authentication hashes,
# certificates/private keys, and other secret material must be injected by the
# governed recovery process from an external secret source.
schema_version: 34
http:
  address: 127.0.0.1:3000
  doh:
    insecure_enabled: true
dns:
  bind_hosts:
    - 127.0.0.1
  port: 53
  upstream_dns:
    - https://dns10.quad9.net/dns-query
  upstream_dns_file: ""
  bootstrap_dns:
    - 9.9.9.10
    - 149.112.112.10
    - "2620:fe::10"
    - "2620:fe::fe:10"
  fallback_dns: []
  private_upstream: []
  upstream_mode: load_balance
  ratelimit: 20
  ratelimit_subnet_len_ipv4: 24
  ratelimit_subnet_len_ipv6: 56
  ratelimit_whitelist: []
  refuse_any: true
  edns_client_subnet:
    enabled: false
    use_custom: false
    custom_ip: ""
  anonymize_client_ip: true
  cache_size: 4194304
  cache_ttl_min: 0
  cache_ttl_max: 0
  cache_optimistic: false
filtering:
  protection_enabled: true
  filtering_enabled: true
  blocking_mode: default
  safebrowsing_enabled: false
  parental_enabled: false
  safesearch_enabled: false
filters:
  - name: AdGuard DNS filter
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    enabled: true
whitelist_filters: []
user_rules: []
querylog:
  enabled: false
  file_enabled: false
  interval: 1d
statistics:
  enabled: true
  interval: 1d
tls:
  enabled: false
  force_https: false
  port_dns_over_quic: 853
  port_dns_over_tls: 853
  port_https: 443
  server_name: ""
dhcp:
  enabled: false
