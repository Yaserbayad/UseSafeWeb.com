<!doctype html>
<html lang="en-GB" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>UseSafeWeb — Integrated dual-mode prototype</title>
  <link rel="stylesheet" href="../../brand/system/TSK-0300/tokens.css">
  <link rel="stylesheet" href="../../brand/system/TSK-0300/components.css">
  <link rel="stylesheet" href="../TSK-0308/candidate.css">
  <link rel="stylesheet" href="prototype.css">
</head>
<body data-testid="prototype-root" data-analytics-mode="markers-only-no-transport">
  <a class="prototype-skip-link" id="skip-link" href="#main-content" data-testid="skip-link">Skip to current task</a>
  <div class="prototype-frame">
    <header class="prototype-topbar" aria-label="UseSafeWeb prototype navigation">
      <button class="prototype-brand" type="button" data-global-action="RESET" data-event-key="journey_reset">UseSafeWeb</button>
      <nav class="prototype-topbar__tools" aria-label="Prototype shortcuts">
        <button type="button" class="sw-button sw-button--secondary" data-global-action="START_SETUP">Start setup</button>
        <button type="button" class="sw-button sw-button--secondary" data-global-action="ACCOUNT_ENTRY">Sign in</button>
        <button type="button" class="sw-button sw-button--secondary" data-global-action="DASHBOARD">Dashboard</button>
        <button type="button" class="sw-button sw-button--secondary" data-global-action="TOGGLE_RTL" aria-pressed="false">RTL</button>
      </nav>
    </header>

    <main id="main-content" class="prototype-main" tabindex="-1" aria-live="off">
      <div id="app"></div>
    </main>

    <footer class="prototype-footer">
      <p><strong>Internal L4 prototype.</strong> Core protection setup works without login. Account continuity is optional.</p>
      <p>No browsing history, activity history, raw DNS history, child profile, safety score, or broad DNS administration is provided.</p>
    </footer>
  </div>

  <div id="prototype-announcer" class="prototype-visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
